interface:
  display_name: "单流程编制"
  short_description: "按材料或必要访谈编制单流程，产出Markdown正文、V8 JSON、工作平衡报告和待确认事项"
  brand_color: "#2F4F4F"
  default_prompt: "使用 $single-process-authoring，依据材料和已有确认编制或续修一个流程；必要访谈默认每轮收口一个关键决定，交付Markdown制度正文、V8 JSON、工作平衡报告和待确认事项并离线校验JSON，用户指定Word时由同源正文按模板生成，保持草案与人工交接边界。"
policy:
  allow_implicit_invocation: true
