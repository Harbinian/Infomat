interface:
  display_name: "单流程编制"
  short_description: "七阶段访谈编制单流程，产出制度、V8 JSON、工作平衡报告和待确认事项并离线校验"
  brand_color: "#2F4F4F"
  default_prompt: "使用 $single-process-authoring，一次只编制一个流程。每轮只问一个关键问题，区分现有事实、已确认的拟议设计、建议和待确认；产出制度正文、process-governance-v8 JSON、工作平衡报告和待确认事项四项待核对草案，交付前运行 scripts/validate-process-v8.mjs 做离线校验，不自动写入3001或3000，不伪造校验记录。"
policy:
  allow_implicit_invocation: true
