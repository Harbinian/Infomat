interface:
  display_name: "流程证据映射"
  short_description: "可读源证据到 document-structured-output-v2 草稿"
  brand_color: "#7A3418"
  default_prompt: "使用 $process-evidence-mapping，从用户指定材料生成可追溯的 document-structured-output-v2 待复核草稿；允许带原文件摘要和定位的视觉转录，可读部分继续，来源缺口阻断依赖结论及完整成果声明，不自动发布。"
policy:
  allow_implicit_invocation: true
