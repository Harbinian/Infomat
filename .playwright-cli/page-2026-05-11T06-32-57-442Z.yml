        - heading "OA 是流程协同入口，不只是审批工具" [level=3] [ref=e722]
        - paragraph [ref=e723]: 华天动力 OA 在本次集成方案中定位为跨系统协同层：承接 ERP、PLM、MES 等系统的待办提醒、消息触达、审批证据和门户入口。如果没有 OA 统一门户，员工每天需要在民机 OA、微信、邮件、线下直接沟通、商网、快表以及 ERP、PLM、MES 之间反复切换，重要通知容易被淹没，待办任务容易被遗漏，业务办理也难以形成统一闭环。具备条件的场景可通过单点登录、待办链接、接口回写和二次开发，实现从 OA 待办中心直接跳转到业务系统办理，避免各系统各自发通知、各自留痕、各自找入口。
