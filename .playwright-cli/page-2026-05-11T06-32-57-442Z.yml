    - generic [ref=e1219]:
      - generic [ref=e1220]:
        - generic [ref=e1221]: "12"
        - generic [ref=e1222]:
          - heading "MDM 是基石，不是可选项" [level=2] [ref=e1223]
          - generic [ref=e1224]: 主数据管理：信息化第一阶段的"重中之重"
      - generic [ref=e1225]:
        - generic [ref=e1226]: 核心结论
        - paragraph [ref=e1227]: 主数据管理不是"锦上添花"，而是整个信息化建设的地基。MDM 工作属于第一阶段（打基础），具有强依赖关系——基础不牢，后续计划、执行与追溯功能将形同虚设，系统价值无法发挥。主数据盘点清洗是整个实施周期中最耗时的环节，涉及上万条数据的核对、去重与补全，需要 5-6 个月才能完成。如果强制上线，主数据问题会在第二、第三阶段以数倍成本集中爆发。
      - generic [ref=e1228]:
        - generic [ref=e1229]:
          - heading "1. 建立\"通用语言\"，打破信息孤岛" [level=3] [ref=e1230]
          - paragraph [ref=e1231]: 主数据是企业各系统的"身份证"。通过统一的分类标准和编码规则，避免"一物多码"、主数据归属模糊，确保 PLM、ERP、MES 三大系统对同一物料的认知完全一致。它是"设计—工艺—计划—执行—核算"全流程闭环的核心纽带，没有标准化的主数据，系统集成将无法实现无缝同步。
        - generic [ref=e1232]:
          - heading "2. 确保 MRP 运算与生产计划精准性" [level=3] [ref=e1233]
          - paragraph [ref=e1234]: ERP 的 MRP（物料需求计划）运算高度依赖主数据准确性。提前期、安全库存、损耗率、BOM 用量等关键参数都定义在主数据中。如果主数据不准，采购需求会错误、物料会短缺或积压，最终令生产计划与实际执行脱节，造成执行混乱。
        - generic [ref=e1235]:
          - heading "3. 保障工艺体系的结构化与合法性" [level=3] [ref=e1236]
          - paragraph [ref=e1237]: 工艺管理是 MES 建设的核心，而主数据是构成结构化工艺的最小单元。构建 MBOM 和结构化工艺规程时，必须关联具体的物料、设备、工装等主数据。主数据标准化是实现工艺版本强控的前提，确保现场工人始终获取最新的"技术法规"进行作业。
        - generic [ref=e1238]:
          - heading "4. 支撑现场\"防错\"与\"追溯\"" [level=3] [ref=e1239]
          - paragraph [ref=e1240]: 在生产执行阶段，系统通过匹配实物条码与工艺主数据，强制执行"齐套性校验"，防止工人用错料、用错设备等低级质量错误。依托"一物一码"的主数据管理，可实现从订单到交付的全链路追溯，包括人、机、料、法、环等全维度数据的精准关联。
        - generic [ref=e1241]:
          - heading "5. 决定成本核算与经营决策质量" [level=3] [ref=e1242]
          - paragraph [ref=e1243]: 财务成本核算需要将物料消耗、人工工时、设备折旧等准确关联到对应的主数据上。如果主数据标识错误，采集到的数据将失去分析价值，导致单品成本计算不准。高质量的主数据为管理层提供科学的看板指标（如设备利用率、产值统计等），是决策支持系统的基石。
      - generic [ref=e1244]:
        - generic [ref=e1245]:
          - heading "没有 MDM 的后果" [level=3] [ref=e1246]
          - paragraph [ref=e1247]: 接口只是搬运冲突：系统 A 发出的字段，系统 B 不知道如何解释；系统 C 修改了数据，系统 D 仍使用旧版本。
        - generic [ref=e1248]:
          - heading "有 MDM 的效果" [level=3] [ref=e1249]
          - paragraph [ref=e1250]: 接口有共同语言，字段有权威来源，异常有责任人，追溯链可以跨系统连续查询。
        - generic [ref=e1251]:
          - heading "今天要确认" [level=3] [ref=e1252]
          - paragraph [ref=e1253]: 组织身份权威源、编码规范推进路径、字段台账责任、Q7 数据中台/集成总线路线。
