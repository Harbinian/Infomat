        - heading "物料编码设计五原则" [level=3] [ref=e1518]
        - generic [ref=e1519]:
          - paragraph [ref=e1521]:
            - strong [ref=e1522]: 唯一性：
            - text: 每一个物料全公司范围内有且仅有一个编码，跨系统共用。
          - paragraph [ref=e1524]:
            - strong [ref=e1525]: 稳定性：
            - text: 编码一经创建，不因物料名称、规格变更而修改；变更须新建物料。
          - paragraph [ref=e1527]:
            - strong [ref=e1528]: 可读性：
            - text: 编码结构须兼顾人工识别与系统解析，不使用纯流水码。
          - paragraph [ref=e1530]:
            - strong [ref=e1531]: 扩展性：
            - text: 分类位预留扩展空间，避免未来分类调整导致编码体系崩溃。
          - paragraph [ref=e1533]:
            - strong [ref=e1534]: 系统兼容性：
            - text: 编码长度与字符集须经各系统确认，确保无截断或乱码风险。
