      - generic [ref=e763]:
        - generic [ref=e764]: 重点展开
        - heading "现状痛点：为什么 OA 不能只做\"内部审批\"" [level=3] [ref=e765]
        - paragraph [ref=e766]: 如果 OA 只管自己的表单，员工仍然要在民机 OA、微信、邮件、线下沟通、商网、快表、ERP、PLM、MES 等入口之间反复横跳。痛点需要分成两类看：一类是没有统一门户和统一待办时，员工日常使用会漏看、漏办、难追踪；另一类是开发集成阶段，待办来源、跳转方式、权限映射、结果回写和异常补偿没有设计清楚，会导致系统虽然接上了但闭环跑不稳。
