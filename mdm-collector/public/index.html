<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <title>MDM 数据收集与评审工具</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --navy:#0f2a5e;--blue:#1a56db;--teal:#0891b2;--green:#16a34a;
      --amber:#d97706;--red:#dc2626;--purple:#7c3aed;--pink:#db2777;
      --bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#1e293b;--muted:#64748b;
    }
    body{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
    button,input,select,textarea{font:inherit}
    button{border:none;cursor:pointer}
    .topbar{height:54px;background:rgba(15,42,94,.98);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20;box-shadow:0 8px 24px rgba(15,42,94,.15)}
    .brand{font-weight:800;letter-spacing:.2px}.brand span{color:#7dd3fc}
    .session{display:flex;align-items:center;gap:8px;font-size:12px;color:#dbeafe}
    .page{padding:20px clamp(14px,3vw,36px) 34px}
    .login{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:10px;align-items:end;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:16px;animation:slideUp .28s ease}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .tab{height:34px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--muted);font-weight:700;font-size:13px}
    .tab.on{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 8px 18px rgba(26,86,219,.16)}
    .panel{display:none;animation:fadeIn .24s ease}.panel.on{display:block}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
    .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:0 1px 3px rgba(15,42,94,.04)}
    .card h2{font-size:16px;color:var(--navy);margin-bottom:10px}.card h3{font-size:13px;color:var(--navy);margin-bottom:8px}
    .metric{border-left:4px solid var(--blue)}.metric.green{border-left-color:var(--green)}.metric.amber{border-left-color:var(--amber)}.metric.red{border-left-color:var(--red)}
    .metric .num{font-size:28px;font-weight:900;color:var(--navy);line-height:1}.metric .lbl{font-size:12px;color:var(--muted);margin-top:6px}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
    label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 9px;color:var(--text);min-height:34px}
    textarea{min-height:70px;resize:vertical}
    .btn{height:34px;padding:0 12px;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;font-weight:800}
    .btn.secondary{background:#eef2ff;color:#1e3a8a}.btn.green{background:var(--green)}.btn.amber{background:var(--amber)}.btn.red{background:var(--red)}
    .btn:disabled{opacity:.55;cursor:not-allowed}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
    table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--navy);color:#fff;text-align:left;padding:9px;white-space:nowrap}td{padding:9px;border-top:1px solid var(--line);vertical-align:top}tr:hover td{background:#f8fafc}
    .tag{display:inline-flex;align-items:center;height:22px;border-radius:999px;padding:0 8px;font-size:11px;font-weight:800;background:#eef2ff;color:#1d4ed8}
    .tag.green{background:#dcfce7;color:#166534}.tag.amber{background:#fef3c7;color:#92400e}.tag.red{background:#fee2e2;color:#991b1b}.tag.purple{background:#ede9fe;color:#6d28d9}
    .split{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:12px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .notice{padding:10px 12px;border-radius:8px;border:1px solid #bfdbfe;background:#eff6ff;color:#1e40af;font-size:12px;margin-bottom:12px}
    .empty{padding:18px;color:var(--muted);font-size:12px;text-align:center}
    .chart{height:260px;width:100%}
    .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:18px}
    .modal-mask.on{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:10px;border:1px solid var(--line);box-shadow:0 24px 80px rgba(15,23,42,.28);animation:slideUp .2s ease}
    .modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}.modal-head h3{font-size:15px;color:var(--navy)}
    .modal-body{padding:16px}.close{width:30px;height:30px;border-radius:6px;background:#f1f5f9;color:#475569}
    .blink{animation:blink 1.2s linear infinite}.pulse{animation:pulse 1.4s ease infinite}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    @keyframes blink{50%{opacity:.35}}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.35)}50%{box-shadow:0 0 0 8px rgba(22,163,74,0)}}
    @media(max-width:900px){.g2,.g3,.g4,.split,.login,.form-grid{grid-template-columns:1fr}.topbar{height:auto;min-height:54px;gap:8px;flex-wrap:wrap;padding:10px 14px}.page{padding:14px}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">MDM <span>数据收集与评审工具</span></div>
    <div class="session"><span id="sessionText">未登录</span><button class="btn secondary" id="logoutBtn">退出</button></div>
  </header>

  <main class="page">
    <section class="login" id="loginBox">
      <label>工号<input id="employeeNo" value="ADMIN001" autocomplete="username"></label>
      <label>密码<input id="password" type="password" value="admin123" autocomplete="current-password"></label>
      <button class="btn" id="loginBtn">登录</button>
      <div class="notice" id="loginMsg">ADMIN001 / admin123</div>
    </section>

    <nav class="tabs" id="tabs">
      <button class="tab on" data-tab="dashboard">统计看板</button>
      <button class="tab" data-tab="submission">报送管理</button>
      <button class="tab" data-tab="todos">待办收到</button>
      <button class="tab" data-tab="reviews">评审记录</button>
      <button class="tab" data-tab="terms">术语词典</button>
      <button class="tab" data-tab="conflicts">冲突管理</button>
    </nav>

    <section class="panel on" id="dashboard">
      <div class="grid g4">
        <div class="card metric"><div class="num" id="metricMappings">0</div><div class="lbl">流程映射</div></div>
        <div class="card metric green"><div class="num" id="metricFields">0</div><div class="lbl">字段台账</div></div>
        <div class="card metric amber"><div class="num" id="metricTodos">0</div><div class="lbl">待处理待办</div></div>
        <div class="card metric red"><div class="num" id="metricConflicts">0</div><div class="lbl">未解决冲突</div></div>
      </div>
      <div class="grid g2" style="margin-top:12px">
        <div class="card"><h2>各部门流程数</h2><div class="chart" id="deptChart"></div></div>
        <div class="card"><h2>审批状态分布</h2><div class="chart" id="statusChart"></div></div>
      </div>
    </section>

    <section class="panel" id="submission">
      <div class="split">
        <div class="card">
          <h2>新建流程映射</h2>
          <div class="form-grid">
            <label>业务流程<select id="mappingProcess"></select></label>
            <label>所属部门<select id="mappingDept"></select></label>
          </div>
          <label style="margin-top:10px">说明<textarea id="mappingDesc"></textarea></label>
          <div class="toolbar" style="margin-top:10px">
            <button class="btn green" id="createMappingBtn">保存草稿</button>
            <a class="btn secondary" href="template.xlsx" download>下载模板</a>
            <button class="btn amber" id="exportBtn">导出台账</button>
          </div>
          <div class="notice">Excel 导入会写入当前选中的映射；报送人仅写入数据对象和字段说明。</div>
          <label>导入字段台账<input type="file" id="importFile" accept=".xlsx"></label>
          <div class="toolbar" style="margin-top:10px"><button class="btn" id="importBtn">导入字段</button></div>
        </div>
        <div class="card">
          <div class="toolbar"><h2 style="margin-right:auto">报送列表</h2><button class="btn secondary" id="refreshMappingsBtn">刷新</button></div>
          <div class="table-wrap"><table><thead><tr><th>ID</th><th>流程</th><th>部门</th><th>状态</th><th>系统</th><th>操作</th></tr></thead><tbody id="mappingRows"></tbody></table></div>
        </div>
      </div>
    </section>

    <section class="panel" id="todos">
      <div class="card">
        <div class="toolbar"><h2 style="margin-right:auto">待办收到</h2><select id="todoStatus"><option value="">全部状态</option><option value="pending">待处理</option><option value="done">已完成</option></select><button class="btn secondary" id="refreshTodosBtn">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>来源</th><th>接收</th><th>类型</th><th>内容</th><th>截止</th><th>状态</th><th>操作</th></tr></thead><tbody id="todoRows"></tbody></table></div>
      </div>
    </section>

    <section class="panel" id="reviews">
      <div class="card">
        <div class="toolbar"><h2 style="margin-right:auto">评审记录</h2><button class="btn secondary" id="refreshReviewsBtn">刷新</button></div>
        <div class="table-wrap"><table><thead><tr><th>映射</th><th>流程</th><th>当前步骤</th><th>任务</th><th>状态</th><th>意见</th><th>操作</th></tr></thead><tbody id="reviewRows"></tbody></table></div>
      </div>
    </section>

    <section class="panel" id="terms">
      <div class="split">
        <div class="card">
          <h2>术语维护</h2>
          <label>术语<input id="termName"></label>
          <label>定义<textarea id="termDefinition"></textarea></label>
          <div class="form-grid">
            <label>范围<input id="termScope"></label>
            <label>禁用表述<input id="termForbidden"></label>
          </div>
          <div class="toolbar" style="margin-top:10px"><button class="btn green" id="saveTermBtn">保存术语</button></div>
        </div>
        <div class="card">
          <div class="toolbar"><h2 style="margin-right:auto">术语词典</h2><select id="termStatus"><option value="">全部</option><option value="pending">待审</option><option value="approved">已通过</option><option value="rejected">已驳回</option></select><button class="btn secondary" id="refreshTermsBtn">刷新</button></div>
          <div class="table-wrap"><table><thead><tr><th>ID</th><th>术语</th><th>定义</th><th>范围</th><th>状态</th><th>操作</th></tr></thead><tbody id="termRows"></tbody></table></div>
        </div>
      </div>
    </section>

    <section class="panel" id="conflicts">
      <div class="card">
        <div class="toolbar">
          <h2 style="margin-right:auto">冲突管理</h2>
          <input id="detectFieldName" placeholder="字段中文名">
          <button class="btn amber" id="detectConflictBtn">检测字段冲突</button>
          <button class="btn secondary" id="refreshConflictsBtn">刷新</button>
        </div>
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>类型</th><th>严重度</th><th>字段/术语</th><th>值A</th><th>值B</th><th>状态</th><th>操作</th></tr></thead><tbody id="conflictRows"></tbody></table></div>
      </div>
    </section>
  </main>

  <div class="modal-mask" id="opinionModal">
    <div class="modal">
      <div class="modal-head"><h3 id="modalTitle">处理意见</h3><button class="close" id="modalClose">×</button></div>
      <div class="modal-body">
        <label>意见<textarea id="modalOpinion"></textarea></label>
        <div class="toolbar" style="margin-top:12px"><button class="btn green" id="modalApprove">通过</button><button class="btn red" id="modalReject">驳回</button></div>
      </div>
    </div>
  </div>

  <script>
    const state = { user:null, mappings:[], departments:[], processes:[], todos:[], conflicts:[], activeReview:null };
    const $ = id => document.getElementById(id);

    async function api(path, options = {}) {
      const res = await fetch(path, { credentials:'same-origin', headers:{ ...(options.body && !(options.body instanceof FormData) ? {'Content-Type':'application/json'} : {}) }, ...options });
      const text = await res.text();
      let body = {};
      if (text) { try { body = JSON.parse(text); } catch { body = text; } }
      if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
      return body;
    }

    function statusTag(status) {
      const map = { draft:'草稿', submitted:'已提交', dept_reviewed:'部门内审', cross_confirmed:'跨部门确认', fields_confirmed:'字段确认', final_reviewed:'终审', published:'已发布', pending:'待处理', done:'已完成', resolved:'已解决', rejected:'已驳回', approved:'已通过', blocked:'阻断' };
      const cls = /published|approved|done|resolved/.test(status) ? 'green' : /blocked|rejected|error/.test(status) ? 'red' : /pending|submitted/.test(status) ? 'amber' : 'purple';
      return `<span class="tag ${cls}">${map[status] || status || '-'}</span>`;
    }

    function fillSelect(select, rows, labelKey = 'name') {
      select.innerHTML = rows.map(row => `<option value="${row.id}">${row[labelKey] || row.name}</option>`).join('');
    }

    async function login() {
      try {
        const user = await api('/api/org/login', { method:'POST', body:JSON.stringify({ employee_no:$('employeeNo').value, password:$('password').value }) });
        state.user = user;
        $('sessionText').textContent = `${user.name} · ${user.role}`;
        $('loginBox').style.display = 'none';
        await loadAll();
      } catch (error) {
        $('loginMsg').textContent = error.message;
        $('loginMsg').classList.add('blink');
      }
    }

    async function checkSession() {
      try {
        const user = await api('/api/org/me');
        state.user = user;
        $('sessionText').textContent = `${user.name} · ${user.role}`;
        $('loginBox').style.display = 'none';
        await loadAll();
      } catch {
        $('loginBox').style.display = 'grid';
      }
    }

    async function loadAll() {
      await Promise.all([loadCatalog(), loadMappings(), loadTodos(), loadTerms(), loadConflicts()]);
      renderDashboard();
    }

    async function loadCatalog() {
      state.departments = await api('/api/org/departments');
      state.processes = await api('/api/processes');
      fillSelect($('mappingDept'), state.departments);
      fillSelect($('mappingProcess'), state.processes, 'name');
    }

    async function loadMappings() {
      state.mappings = await api('/api/mappings');
      $('mappingRows').innerHTML = state.mappings.map(row => `<tr>
        <td>${row.id}</td><td>${row.process_name || '-'}</td><td>${row.owner_dept_name || '-'}</td><td>${statusTag(row.status)}</td><td>${row.systems || '-'}</td>
        <td><button class="btn secondary" onclick="selectMapping(${row.id})">选中</button> <button class="btn green" onclick="submitMapping(${row.id})">提交</button></td>
      </tr>`).join('') || `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
      renderReviews();
    }

    async function selectMapping(id) {
      const detail = await api(`/api/mappings/${id}`);
      window.selectedMappingId = id;
      renderReviews(detail);
    }

    async function createMapping() {
      const id = await api('/api/mappings', { method:'POST', body:JSON.stringify({ process_id:Number($('mappingProcess').value), owner_dept_id:Number($('mappingDept').value), description:$('mappingDesc').value, systems:[], related_departments:[] }) });
      window.selectedMappingId = id.id;
      await loadMappings();
    }

    async function submitMapping(id) {
      await api(`/api/mappings/${id}/submit`, { method:'POST' });
      await loadMappings();
    }

    async function importFields() {
      const file = $('importFile').files[0];
      if (!window.selectedMappingId || !file) return alert('请选择映射和 Excel 文件');
      const form = new FormData();
      form.append('mapping_id', String(window.selectedMappingId));
      form.append('file', file);
      const result = await api('/api/import/field-entries', { method:'POST', body:form });
      alert(`已导入 ${result.imported} 行`);
    }

    async function loadTodos() {
      const query = $('todoStatus').value ? `?status=${$('todoStatus').value}` : '';
      state.todos = await api(`/api/todos${query}`);
      $('todoRows').innerHTML = state.todos.map(row => `<tr><td>${row.id}</td><td>${row.from_dept_name || '-'}</td><td>${row.to_dept_name || '-'}</td><td>${row.type}</td><td>${row.content}</td><td>${row.due_date || '-'}</td><td>${statusTag(row.status)}</td><td><button class="btn green" onclick="doneTodo(${row.id})">完成</button></td></tr>`).join('') || `<tr><td colspan="8" class="empty">暂无数据</td></tr>`;
    }

    async function doneTodo(id) {
      await api(`/api/todos/${id}/done`, { method:'POST' });
      await loadTodos();
    }

    async function renderReviews(detail) {
      const details = detail ? [detail] : await Promise.all(state.mappings.slice(0, 30).map(row => api(`/api/mappings/${row.id}`).catch(() => null)));
      const rows = details.filter(Boolean).flatMap(mapping => (mapping.approvalTasks || []).map(task => ({ mapping, task })));
      $('reviewRows').innerHTML = rows.map(({ mapping, task }) => `<tr><td>${mapping.id}</td><td>${mapping.process_name || '-'}</td><td>${mapping.current_step}</td><td>${task.step_name}</td><td>${statusTag(task.status)}</td><td>${task.opinion || '-'}</td><td><button class="btn green" onclick="openReview(${mapping.id},${task.step})">处理</button></td></tr>`).join('') || `<tr><td colspan="7" class="empty">暂无数据</td></tr>`;
    }

    function openReview(mappingId, step) {
      state.activeReview = { mappingId, step };
      $('opinionModal').classList.add('on');
    }

    async function review(action) {
      const { mappingId, step } = state.activeReview;
      await api(`/api/mappings/${mappingId}/review`, { method:'POST', body:JSON.stringify({ step, action, opinion:$('modalOpinion').value }) });
      $('opinionModal').classList.remove('on');
      await loadMappings();
    }

    async function loadTerms() {
      const query = $('termStatus').value ? `?status=${$('termStatus').value}` : '';
      const terms = await api(`/api/terminology${query}`);
      $('termRows').innerHTML = terms.map(row => `<tr><td>${row.id}</td><td>${row.term}</td><td>${row.definition || '-'}</td><td>${row.scope || '-'}</td><td>${statusTag(row.status)}</td><td><button class="btn green" onclick="reviewTerm(${row.id},'approve')">通过</button> <button class="btn red" onclick="reviewTerm(${row.id},'reject')">驳回</button></td></tr>`).join('') || `<tr><td colspan="6" class="empty">暂无数据</td></tr>`;
    }

    async function saveTerm() {
      await api('/api/terminology', { method:'POST', body:JSON.stringify({ term:$('termName').value, definition:$('termDefinition').value, scope:$('termScope').value, forbidden:$('termForbidden').value }) });
      await loadTerms();
    }

    async function reviewTerm(id, action) {
      await api(`/api/terminology/${id}/review`, { method:'POST', body:JSON.stringify({ action }) });
      await loadTerms();
    }

    async function loadConflicts() {
      state.conflicts = await api('/api/conflicts');
      $('conflictRows').innerHTML = state.conflicts.map(row => `<tr><td>${row.id}</td><td>${row.conflict_type}</td><td>${statusTag(row.severity)}</td><td>${row.term || row.conflict_field || '-'}</td><td>${row.value_a || row.dept_a_meaning || '-'}</td><td>${row.value_b || row.dept_b_meaning || '-'}</td><td>${statusTag(row.status)}</td><td><button class="btn green" onclick="resolveConflict('${row.conflict_type}',${row.id})">解决</button></td></tr>`).join('') || `<tr><td colspan="8" class="empty">暂无数据</td></tr>`;
    }

    async function detectConflict() {
      await api(`/api/conflicts/detect?field_name_cn=${encodeURIComponent($('detectFieldName').value)}`, { method:'POST' });
      await loadConflicts();
    }

    async function resolveConflict(type, id) {
      const path = type === 'term' ? `/api/conflicts/term/${id}/resolve` : `/api/conflicts/${id}/resolve`;
      await api(path, { method:'POST', body:JSON.stringify({ resolution:'已确认统一口径', adopted_value:'MDM' }) });
      await loadConflicts();
    }

    function renderDashboard() {
      const pendingTodos = state.todos.filter(row => row.status === 'pending').length;
      const pendingConflicts = state.conflicts.filter(row => row.status === 'pending').length;
      $('metricMappings').textContent = state.mappings.length;
      $('metricTodos').textContent = pendingTodos;
      $('metricConflicts').textContent = pendingConflicts;
      Promise.all(state.mappings.map(row => api(`/api/field-entries/mapping/${row.id}`).catch(() => []))).then(groups => {
        $('metricFields').textContent = groups.flat().length;
      });

      if (!window.echarts) return;
      const deptCounts = {};
      state.mappings.forEach(row => { deptCounts[row.owner_dept_name || '未归属'] = (deptCounts[row.owner_dept_name || '未归属'] || 0) + 1; });
      echarts.init($('deptChart')).setOption({ tooltip:{}, xAxis:{type:'category',data:Object.keys(deptCounts)}, yAxis:{type:'value'}, series:[{type:'bar',data:Object.values(deptCounts),itemStyle:{color:'#0891b2'}}], grid:{left:36,right:18,top:24,bottom:44} });
      const statuses = {};
      state.mappings.forEach(row => { statuses[row.status] = (statuses[row.status] || 0) + 1; });
      echarts.init($('statusChart')).setOption({ tooltip:{trigger:'item'}, series:[{type:'pie',radius:['42%','68%'],data:Object.entries(statuses).map(([name,value]) => ({name,value}))}] });
    }

    $('tabs').addEventListener('click', event => {
      if (!event.target.matches('.tab')) return;
      document.querySelectorAll('.tab,.panel').forEach(el => el.classList.remove('on'));
      event.target.classList.add('on');
      $(event.target.dataset.tab).classList.add('on');
      renderDashboard();
    });

    $('loginBtn').onclick = login;
    $('logoutBtn').onclick = async () => { await api('/api/org/logout', { method:'POST' }).catch(() => null); location.reload(); };
    $('createMappingBtn').onclick = createMapping;
    $('refreshMappingsBtn').onclick = loadMappings;
    $('importBtn').onclick = importFields;
    $('exportBtn').onclick = () => { location.href = '/api/export/excel'; };
    $('refreshTodosBtn').onclick = loadTodos;
    $('todoStatus').onchange = loadTodos;
    $('refreshReviewsBtn').onclick = () => renderReviews();
    $('saveTermBtn').onclick = saveTerm;
    $('refreshTermsBtn').onclick = loadTerms;
    $('termStatus').onchange = loadTerms;
    $('refreshConflictsBtn').onclick = loadConflicts;
    $('detectConflictBtn').onclick = detectConflict;
    $('modalClose').onclick = () => $('opinionModal').classList.remove('on');
    $('modalApprove').onclick = () => review('approve');
    $('modalReject').onclick = () => review('reject');

    checkSession();
  </script>
</body>
</html>
