  <script src="/vendor/cytoscape.min.js"></script>
  <script src="process-diagram.js"></script>
  <script src="structure-score.js"></script>
  <script>
    const DEPARTMENTS = [
      '全公司', '公司领导', '工程技术部', '质量管理部', '财务部', '行政人事部',
      '经营发展部', '物资保障部', '项目管理部', '复材车间', '运维安环部'
    ];
    const ROLE_DUTIES = ['', '发起', '办理', '审核', '批准', '判断', '发送', '接收', '会签'];
    const NODE_TYPES = [
      { value: '', label: '请选择' },
      { value: 'action', label: '业务行为' },
      { value: 'decision', label: '判断节点' },
      { value: 'parallel_split', label: '并行开始（同时启动多条路线）' },
      { value: 'parallel_join', label: '并行汇合（等待多条路线完成）' }
    ];
    const RELATION_TYPES = [
      { value: '', label: '请选择' },
      { value: 'sequence', label: '顺序' },
      { value: 'condition', label: '判断分支' },
      { value: 'loop', label: '流程内部回路' },
      { value: 'parallel', label: '并行路线' }
    ];
    const MATERIAL_TYPES = ['', '现有制度', '表单或记录', '现行业务操作说明', '会议或访谈', '其他参考材料'];
    const AREA_TYPES = ['', '基本信息', '明细清单'];
    const EXPECTED_EXPORT_SCHEMA_VERSION = 'process-governance-v3';
    const FORM_DESIGN_STATES = new Set(['unspecified', 'current_state', 'proposed_design']);
    const ACTOR_ASSIGNMENT_MODES = [
      { value: 'fixed_department', label: '固定部门和岗位' },
      { value: 'company_wide', label: '全公司通用' },
      { value: 'dynamic_from_data', label: '按前序数据动态确定' }
    ];
    const ACTOR_ASSIGNMENT_MODE_VALUES = new Set(ACTOR_ASSIGNMENT_MODES.map(item => item.value));
    const EDITOR_SECTIONS = [
      { value: 'basic', label: '基本信息' },
      { value: 'profile', label: '目的与范围' },
      { value: 'terms', label: '术语定义' },
      { value: 'process', label: '流程步骤' },
      { value: 'forms', label: '表单与记录' },
      { value: 'export', label: '导出检查' }
    ];
    const PROCESS_SECTIONS = [
      { value: 'behaviors', label: '业务流程' },
      { value: 'relations', label: '流程关系' },
      { value: 'data', label: '输出物与数据' },
      { value: 'handoffs', label: '跨部门待办汇总' }
    ];
    const LEGACY_DUTY_MAP = {
      initiator: '发起',
      executor: '办理',
      reviewer: '审核',
      approver: '批准',
      collaborator: '会签',
      provider: '发送',
      sender: '发送',
      receiver: '接收',
      countersigner: '会签'
    };

    let candidates = [];
    let currentIndex = 0;
    let protectedAction = null;
    let protectedActionInvoker = null;
    let busy = false;
    let activeWorkspaceTab = 'editor';
    let activeEditorSection = 'basic';
    let activeProcessSection = 'behaviors';
    let activeBehaviorRef = '';
    let activeRelationRef = '';
    let activeDataRef = '';
    let activeHandoffRef = '';
    let activeFlowItemKind = 'behavior';
    let activeFormRef = '';
    let activeAreaRef = '';
    let rosterRolesByDepartment = {};
    let rosterLoadState = 'loading';
    let formItemTypes = [];
    let formItemTypeLoadState = 'loading';
    let diagramView = null;
    let diagramExampleExpanded = false;
    let diagramExpanded = false;
    let focusClearTimer = null;
    let legacyMergeState = null;
    let owningDepartmentChangeState = null;
    let structureScoreRunId = 0;
    let structureScoreState = {
      status: 'idle',
      candidateIndex: -1,
      documentKey: '',
      result: null,
      message: ''
    };
    const openedPreviewProcesses = new Set();

    const workspace = document.getElementById('workspace');
    const statusBox = document.getElementById('statusBox');
    const candidateList = document.getElementById('candidateList');
    const candidateNote = document.getElementById('candidateNote');
    const workspaceViewSwitch = document.getElementById('workspaceViewSwitch');
    const unsavedModal = document.getElementById('unsavedModal');
    const legacyMergeModal = document.getElementById('legacyMergeModal');
    const legacyMergeContent = document.getElementById('legacyMergeContent');
    const confirmLegacyMergeButton = document.getElementById('confirmLegacyMergeButton');
    const owningDepartmentChangeModal = document.getElementById('owningDepartmentChangeModal');
    const owningDepartmentChangeContent = document.getElementById('owningDepartmentChangeContent');
    const confirmOwningDepartmentChangeButton = document.getElementById('confirmOwningDepartmentChangeButton');
    const jsonInput = document.getElementById('jsonInput');
    const actionButtons = [
      document.getElementById('newProcessButton'),
      document.getElementById('importJsonButton'),
      document.getElementById('exportButton'),
      document.getElementById('clearButton')
    ];

    function newRef(prefix) {
      const token = typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID().replace(/-/g, '')
        : `${Date.now()}${Math.random().toString(16).slice(2)}`;
      return `${prefix}_${token}`;
    }

    function technicalRef(value, prefix) {
      const raw = String(value || '').trim();
      if (/^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$/.test(raw)) return raw;
      return newRef(prefix);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function text(value) {
      return value == null ? '' : String(value);
    }

    function nullable(value) {
      const normalized = text(value).trim();
      return normalized || null;
    }

    function list(value) {
      if (Array.isArray(value)) return [...new Set(value.map(item => text(item).trim()).filter(Boolean))];
      return [...new Set(text(value).split(/[,，\n]/).map(item => item.trim()).filter(Boolean))];
    }

    function escapeHtml(value) {
      return text(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function roleName(behaviorName, duty) {
      const base = text(behaviorName).trim().replace(/行为$/, '');
      return base && duty ? `${base}行为的${duty}角色` : '';
    }

    async function readJsonResponse(response, nonJsonMessage) {
      const contentType = text(response.headers.get('content-type')).toLowerCase();
      if (!contentType.includes('application/json')) throw new Error(nonJsonMessage);
      try {
        return await response.json();
      } catch (_error) {
        throw new Error(nonJsonMessage);
      }
    }

    async function fetchEmptyProcessDocument() {
      const response = await fetch('/api/template?version=process-governance-v3', { cache: 'no-store' });
      const result = await readJsonResponse(
        response,
        '3001空白模板接口未返回结构化数据。请保持当前页面打开，待维护人员重启3001服务后再次新建流程。'
      );
      if (!response.ok) throw new Error(result.error || '无法读取当前空白模板');
      if (result.schema_version !== EXPECTED_EXPORT_SCHEMA_VERSION || !result.data) {
        throw new Error('3001空白模板与当前页面版本不一致，请联系维护人员重启服务。');
      }
      return result.data;
    }

    async function loadEditorCatalogs() {
      rosterLoadState = 'loading';
      formItemTypeLoadState = 'loading';
      try {
        const response = await fetch('/api/enums', { cache: 'no-store' });
        const result = await readJsonResponse(response, '3001岗位和填写项类型接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '无法读取岗位和填写项类型');
        rosterRolesByDepartment = result.rosterRolesByDepartment && typeof result.rosterRolesByDepartment === 'object'
          ? result.rosterRolesByDepartment
          : {};
        formItemTypes = Array.isArray(result.fieldType)
          ? [...new Set(result.fieldType.map(value => text(value).trim()).filter(Boolean))]
          : [];
        rosterLoadState = Object.keys(rosterRolesByDepartment).length ? 'ready' : 'unavailable';
        formItemTypeLoadState = formItemTypes.length ? 'ready' : 'unavailable';
      } catch (_error) {
        rosterRolesByDepartment = {};
        formItemTypes = [];
        rosterLoadState = 'unavailable';
        formItemTypeLoadState = 'unavailable';
      }
      if (currentDocument()) render();
    }

    function rosterPositions(department) {
      return Array.isArray(rosterRolesByDepartment?.[department])
        ? rosterRolesByDepartment[department]
        : [];
    }

    function actorDepartments() {
      return [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司');
    }

    function currentExecutionDepartment() {
      return text(currentDocument()?.process?.owning_department).trim();
    }

    function parseActorRole(value) {
      const raw = text(value).trim();
      if (!raw) return { department: '', position: '', known: false };
      if (raw === '全公司') return { department: '全公司', position: '', known: true };
      const departments = [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司')
        .sort((left, right) => right.length - left.length);
      const department = departments.find(item => raw === item || raw.startsWith(item));
      if (department) {
        const position = raw.slice(department.length).trim();
        return {
          department,
          position,
          known: Boolean(position && rosterPositions(department).includes(position))
        };
      }
      const matches = Object.entries(rosterRolesByDepartment || {})
        .filter(([, positions]) => Array.isArray(positions) && positions.includes(raw));
      if (matches.length === 1) {
        return { department: matches[0][0], position: raw, known: true };
      }
      return { department: '', position: '', known: false };
    }

    function combineActorRole(department, position) {
      if (department === '全公司') return '全公司';
      if (department && position) return `${department}${position}`;
      return department || '';
    }

    function externalActorDepartment(value, ownDepartment = currentExecutionDepartment()) {
      const normalizedOwner = text(ownDepartment).trim();
      const parsed = parseActorRole(value);
      if (!normalizedOwner || !parsed.department || parsed.department === '全公司') return '';
      return parsed.department === normalizedOwner ? '' : parsed.department;
    }

    function actorAssignmentMode(behavior) {
      const explicit = text(behavior?.actor_assignment_mode).trim();
      if (ACTOR_ASSIGNMENT_MODE_VALUES.has(explicit)) return explicit;
      return text(behavior?.current_actor_role).trim() === '全公司'
        ? 'company_wide'
        : 'fixed_department';
    }

    function isDynamicActorBehavior(behavior) {
      return actorAssignmentMode(behavior) === 'dynamic_from_data';
    }

    function counterpartyBehaviorForHandoff(handoff, data = currentDocument()) {
      const ref = text(handoff?.counterparty_behavior_ref).trim();
      return ref ? (data?.behaviors || []).find(item => item.behavior_ref === ref) || null : null;
    }

    function linkedHandoffsForCounterpartyBehavior(behaviorRef, data = currentDocument()) {
      return (data?.cross_department_handoffs || [])
        .map((handoff, handoffIndex) => ({ handoff, handoffIndex }))
        .filter(({ handoff }) => text(handoff.counterparty_behavior_ref).trim() === behaviorRef);
    }

    function linkedHandoffForCounterpartyBehavior(behaviorRef, data = currentDocument()) {
      const linked = linkedHandoffsForCounterpartyBehavior(behaviorRef, data);
      return linked.length === 1 ? linked[0] : null;
    }

    function ordinaryRelationsForBehavior(behaviorRef, data = currentDocument()) {
      return (data?.flow_relations || []).filter(relation =>
        relation.from_behavior_ref === behaviorRef || relation.to_behavior_ref === behaviorRef
      );
    }

    function needsLegacyExternalBehaviorMerge(behavior, data = currentDocument()) {
      if (!behavior || !externalActorDepartment(behavior.current_actor_role, data?.process?.owning_department)) return false;
      const linked = linkedHandoffsForCounterpartyBehavior(behavior.behavior_ref, data);
      return linked.length !== 1 || ordinaryRelationsForBehavior(behavior.behavior_ref, data).length > 0;
    }

    function actorRolePicker(index) {
      const behavior = currentDocument().behaviors[index];
      const rawValue = text(behavior?.current_actor_role).trim();
      const ownDepartment = currentExecutionDepartment();
      const parsed = parseActorRole(rawValue);
      const knownDepartments = actorDepartments();
      const selectedDepartment = parsed.department === '全公司' || knownDepartments.includes(parsed.department)
        ? parsed.department
        : '';
      const externalDepartment = externalActorDepartment(rawValue, ownDepartment);
      const requiresMerge = needsLegacyExternalBehaviorMerge(currentDocument().behaviors[index]);
      const knownCurrentValue = Boolean(
          rawValue
          && selectedDepartment
          && selectedDepartment !== '全公司'
          && parsed.position
          && rosterPositions(selectedDepartment).includes(parsed.position)
        );
      const departmentOnlyInProgress = Boolean(
        rawValue
        && rawValue === selectedDepartment
        && selectedDepartment !== '全公司'
        && !parsed.position
      );
      const departmentOptions = [{
        value: '',
        label: '请选择执行部门'
      }];
      knownDepartments.forEach(department => departmentOptions.push({
        value: department,
        label: department === ownDepartment ? `${department}（本流程归口部门）` : department
      }));
      const positions = selectedDepartment && selectedDepartment !== '全公司'
        ? rosterPositions(selectedDepartment)
        : [];
      const positionOptions = [{
        value: '',
        label: selectedDepartment === '全公司'
          ? '全公司通用无需选择岗位'
          : rosterLoadState === 'loading'
            ? '正在读取花名册岗位'
            : rosterLoadState === 'unavailable'
              ? '花名册岗位暂时不可用'
              : selectedDepartment
                ? '请选择执行岗位'
                : '请先选择执行部门'
      }].concat(positions.map(position => ({ value: position, label: position })));
      if (selectedDepartment && parsed.position && !positions.includes(parsed.position)) {
        positionOptions.push({
          value: parsed.position,
          label: `原文件岗位：${parsed.position}（当前花名册未收录）`
        });
      }

      const legacyWarning = requiresMerge
        ? `<div class="inline-warning">旧版页面同时保存了外部门行为和普通流程关系，可能重复表达同一次跨部门办理。3001不会自动删除；请先查看归并预览，确认交接方向和数据去向后再处理。<div class="item-actions" style="margin-top:8px"><button class="button secondary small" data-action="open-legacy-merge" data-focus-key="legacy_merge" data-ref="${escapeAttribute(currentDocument().behaviors[index]?.behavior_ref)}">归并为单一跨部门行为</button></div></div>`
        : '';
      const rosterWarning = rawValue && !knownCurrentValue && !departmentOnlyInProgress
        ? `<div class="inline-warning">当前导入值“${escapeHtml(rawValue)}”未被现行花名册收录。3001会保留该值；如需修改，请重新选择执行部门和执行岗位。</div>`
        : '';
      const availability = rosterLoadState === 'unavailable'
        ? '<div class="inline-warning">花名册岗位暂时不可用。3001不会清除已有执行岗位；其他内容仍可继续编制和导出。</div>'
        : externalDepartment
          ? `<div class="inline-note">当前为跨部门行为。行为名称、执行部门和执行岗位只在这里填写一次；下方跨部门关系只补充交接方向、事项、数据和返回位置。</div>`
          : selectedDepartment && selectedDepartment === ownDepartment
            ? `<div class="inline-note">当前为本部门执行。执行岗位显示“${escapeHtml(selectedDepartment)}”花名册中的岗位。</div>`
            : !ownDepartment
              ? '<div class="inline-note">可以先选择任意执行部门和岗位。填写流程归口部门后，页面会据此识别本部门行为和跨部门行为。</div>'
              : '<div class="inline-note">请选择实际执行部门和执行岗位。</div>';

      return `
        <div class="field wide">
          <span class="field-label">执行部门和执行岗位</span>
          <div class="role-picker">
            <select
              data-actor-department="${index}"
              data-focus-key="behaviors.${index}.current_actor_role"
            >
              ${optionHtml(departmentOptions, selectedDepartment)}
            </select>
            <select
              data-actor-position="${index}"
              data-focus-key="behaviors.${index}.current_actor_role"
              ${!selectedDepartment || selectedDepartment === '全公司' || rosterLoadState !== 'ready' ? 'disabled' : ''}
            >
              ${optionHtml(positionOptions, parsed.position)}
            </select>
          </div>
          ${legacyWarning}
          ${rosterWarning}
          ${availability}
        </div>`;
    }

    function dynamicDepartmentDataSelect(index, behavior, flowDetails) {
      const selectedRef = text(behavior.actor_department_data_ref).trim();
      const values = [{ value: '', label: '请选择前序数据' }];
      (currentDocument()?.data_objects || []).forEach((item, dataIndex) => {
        const allowed = flowDetails.isAvailableBeforeBehavior?.(item.data_ref, behavior.behavior_ref) === true;
        if (!allowed && item.data_ref !== selectedRef) return;
        values.push({
          value: item.data_ref,
          label: `${dataIndex + 1}. ${item.data_name || '未命名数据'}${allowed ? '' : '（当前不是可用的前序数据）'}`
        });
      });
      const emptyHint = values.length === 1
        ? '<div class="inline-warning">当前没有可用于确定执行部门的前序数据。请先在“输出物与数据”中登记责任部门数据，并建立它的产生行为和流程关系。</div>'
        : '';
      return `
        <div class="field wide">
          <label>执行部门来源数据</label>
          <select data-bind="behaviors.${index}.actor_department_data_ref" data-kind="nullable" data-focus-key="behaviors.${index}.actor_department_data_ref">
            ${optionHtml(values, selectedRef)}
          </select>
          <span class="hint">只能选择本行为开始前已经产生、并可沿流程关系到达本行为的数据。数据值可以包含一个或多个责任部门。</span>
          ${emptyHint}
        </div>`;
    }

    function actorAssignmentEditor(index, behavior, flowDetails) {
      const mode = actorAssignmentMode(behavior);
      const linkedHandoffCount = linkedHandoffsForCounterpartyBehavior(behavior.behavior_ref).length;
      const needsHandoffCleanup = linkedHandoffCount && (
        mode !== 'fixed_department' || !externalActorDepartment(behavior.current_actor_role)
      );
      const cleanupWarning = needsHandoffCleanup
        ? `<div class="field wide"><div class="inline-warning">当前行为仍关联${linkedHandoffCount}条固定跨部门关系，与所选执行主体确定方式不一致。<div class="item-actions" style="margin-top:8px"><button class="button secondary small" data-action="normalize-actor-handoffs" data-ref="${escapeAttribute(behavior.behavior_ref)}">转换为普通流程关系</button></div></div></div>`
        : '';
      const modeField = `
        <div class="field wide">
          <label>执行主体确定方式</label>
          <select data-actor-assignment-mode="${index}" data-focus-key="behaviors.${index}.actor_assignment_mode">
            ${optionHtml(ACTOR_ASSIGNMENT_MODES, mode)}
          </select>
        </div>`;
      if (mode === 'company_wide') {
        return `${modeField}<div class="field wide"><div class="inline-note">“全公司通用”表示该行为不归属于某个特定部门，不算跨部门，也不生成跨部门关系。</div></div>${cleanupWarning}`;
      }
      if (mode === 'dynamic_from_data') {
        return `${modeField}
          ${dynamicDepartmentDataSelect(index, behavior, flowDetails)}
          ${field(`behaviors.${index}.actor_position_rule`, '执行岗位或责任人确定规则', {
            type: 'textarea',
            className: 'wide',
            placeholder: '例如：由问题责任部门确定整改责任人',
            hint: '运行时，每个责任部门分别确定办理岗位或责任人；责任部门尚未形成时，不得向全公司广播待办。'
          })}
          <div class="field wide"><div class="inline-note">该行为在设计时不算固定跨部门行为。运行时取得责任部门后，只有责任部门与流程归口部门不同时才形成跨部门办理。</div></div>${cleanupWarning}`;
      }
      return `${modeField}${actorRolePicker(index)}`;
    }

    function normalizeWorkRole(role, behaviorRef, behaviorName) {
      if (!role || typeof role !== 'object') return null;
      const duty = ROLE_DUTIES.includes(role.role_duty) ? role.role_duty : '';
      const code = nullable(role.work_role_code);
      return {
        behavior_ref: behaviorRef,
        work_role_code: code,
        role_duty: duty,
        work_role_name: roleName(behaviorName, duty),
        assignment_status: code ? 'assigned' : 'pending_assignment'
      };
    }

    function normalizeV1(input) {
      const source = input && typeof input === 'object' ? input : {};
      const process = source.process || {};
      const behaviorRefMap = new Map();
      const behaviors = (Array.isArray(source.behaviors) ? source.behaviors : []).map((item, index) => {
        const behaviorRef = technicalRef(item?.behavior_ref, `behavior${index + 1}`);
        if (item?.behavior_ref) behaviorRefMap.set(item.behavior_ref, behaviorRef);
        const behaviorName = text(item?.behavior_name);
        const assignmentMode = actorAssignmentMode(item);
        return {
          behavior_ref: behaviorRef,
          node_type: NODE_TYPES.some(option => option.value === item?.node_type) ? item.node_type : '',
          behavior_name: behaviorName,
          behavior_description: text(item?.behavior_description),
          current_actor_role: assignmentMode === 'company_wide'
            ? '全公司'
            : assignmentMode === 'dynamic_from_data'
              ? ''
              : text(item?.current_actor_role),
          actor_assignment_mode: assignmentMode,
          actor_department_data_ref: nullable(item?.actor_department_data_ref),
          actor_position_rule: text(item?.actor_position_rule),
          trigger: text(item?.trigger),
          precondition: text(item?.precondition),
          input_description: text(item?.input_description),
          timing: nullable(item?.timing),
          completion_standard: text(item?.completion_standard),
          output_description: text(item?.output_description),
          input_data_refs: list(item?.input_data_refs),
          output_data_refs: list(item?.output_data_refs),
          work_role: normalizeWorkRole(item?.work_role, behaviorRef, behaviorName),
          countersign_all_required: Boolean(item?.countersign_all_required),
          countersign_target_departments: list(item?.countersign_target_departments)
        };
      });
      const mapBehaviorRef = value => value ? (behaviorRefMap.get(value) || technicalRef(value, 'behavior')) : null;
      const dataRefMap = new Map();
      const dataObjects = (Array.isArray(source.data_objects) ? source.data_objects : []).map((item, index) => {
        const dataRef = technicalRef(item?.data_ref, `data${index + 1}`);
        if (item?.data_ref) dataRefMap.set(item.data_ref, dataRef);
        return {
          data_ref: dataRef,
          data_name: text(item?.data_name),
          description: text(item?.description),
          governance_status: 'candidate',
          produced_by_behavior_ref: mapBehaviorRef(item?.produced_by_behavior_ref),
          consumed_by_behavior_refs: list(item?.consumed_by_behavior_refs).map(mapBehaviorRef)
        };
      });
      const mapDataRef = value => value ? (dataRefMap.get(value) || technicalRef(value, 'data')) : null;
      behaviors.forEach((behavior, index) => {
        const original = source.behaviors?.[index] || {};
        behavior.input_data_refs = list(original.input_data_refs).map(mapDataRef);
        behavior.output_data_refs = list(original.output_data_refs).map(mapDataRef);
        behavior.actor_department_data_ref = mapDataRef(original.actor_department_data_ref);
      });

      const normalized = {
        schema_version: 'process-governance-v3',
        export_meta: {
          package_ref: technicalRef(source.export_meta?.package_ref, 'package'),
          exported_at: Number.isNaN(Date.parse(source.export_meta?.exported_at))
            ? new Date().toISOString()
            : new Date(source.export_meta.exported_at).toISOString(),
          initiating_department: text(source.export_meta?.initiating_department),
          compiler: text(source.export_meta?.compiler)
        },
        process: {
          process_ref: technicalRef(process.process_ref, 'process'),
          process_name: text(process.process_name),
          owning_department: text(process.owning_department),
          purpose: text(process.purpose),
          scope: text(process.scope),
          capability_domain: nullable(process.capability_domain),
          business_capability: nullable(process.business_capability),
          classification_status: ['unclassified', 'needs_review', 'confirmed'].includes(process.classification_status)
            ? process.classification_status
            : 'unclassified'
        },
        reference_materials: (Array.isArray(source.reference_materials) ? source.reference_materials : []).map((item, index) => ({
          material_ref: technicalRef(item?.material_ref, `material${index + 1}`),
          material_type: MATERIAL_TYPES.includes(item?.material_type) ? item.material_type : '',
          material_name: text(item?.material_name),
          document_no: nullable(item?.document_no),
          version: nullable(item?.version),
          file_sha256: /^[a-fA-F0-9]{64}$/.test(text(item?.file_sha256)) ? item.file_sha256 : null,
          readable_text: text(item?.readable_text),
          provider_department: text(item?.provider_department),
          provider_name: text(item?.provider_name),
          as_of_date: nullable(item?.as_of_date)
        })),
        behaviors,
        flow_relations: (Array.isArray(source.flow_relations) ? source.flow_relations : []).map((item, index) => ({
          relation_ref: technicalRef(item?.relation_ref, `relation${index + 1}`),
          relation_type: RELATION_TYPES.some(option => option.value === item?.relation_type) ? item.relation_type : '',
          from_behavior_ref: mapBehaviorRef(item?.from_behavior_ref),
          to_behavior_ref: mapBehaviorRef(item?.to_behavior_ref),
          condition: text(item?.condition),
          join_mode: item?.join_mode === 'all' ? 'all' : ''
        })),
        data_objects: dataObjects,
        cross_department_handoffs: (Array.isArray(source.cross_department_handoffs) ? source.cross_department_handoffs : []).map((item, index) => {
          const direction = ['inbound_prerequisite', 'outbound_followup'].includes(item?.handoff_direction)
            ? item.handoff_direction
            : 'outbound_followup';
          const externalDepartment = direction === 'inbound_prerequisite'
            ? text(item?.source_department)
            : text(item?.target_department);
          const counterpartyResolution = ['identified', 'needs_identification'].includes(item?.counterparty_resolution)
            ? item.counterparty_resolution
            : externalDepartment ? 'identified' : 'needs_identification';
          const legacyReturnBehaviorRef = item?.resume_behavior_ref || item?.return_behavior_ref;
          const returnedDataRef = mapDataRef(item?.returned_data_ref);
          return {
            handoff_ref: technicalRef(item?.handoff_ref, `handoff${index + 1}`),
            handoff_direction: direction,
            anchor_behavior_ref: mapBehaviorRef(item?.anchor_behavior_ref || item?.send_behavior_ref),
            counterparty_resolution: counterpartyResolution,
            source_department: text(item?.source_department),
            target_department: text(item?.target_department),
            transfer_data_ref: mapDataRef(item?.transfer_data_ref || item?.input_data_ref || item?.output_data_ref),
            requested_matter: text(item?.requested_matter),
            trigger_condition: text(item?.trigger_condition),
            completion_standard: text(item?.completion_standard),
            counterparty_process_ref: item?.counterparty_process_ref || item?.target_process_ref
              ? technicalRef(item.counterparty_process_ref || item.target_process_ref, 'counterparty_process')
              : null,
            counterparty_process_name: text(item?.counterparty_process_name || item?.target_process_name),
            counterparty_behavior_ref: item?.counterparty_behavior_ref || item?.target_behavior_ref || item?.receive_behavior_ref
              ? technicalRef(item.counterparty_behavior_ref || item.target_behavior_ref || item.receive_behavior_ref, 'counterparty_behavior')
              : null,
            counterparty_behavior_name: text(item?.counterparty_behavior_name || item?.target_behavior_name),
            requires_return: typeof item?.requires_return === 'boolean'
              ? item.requires_return
              : Boolean(returnedDataRef || legacyReturnBehaviorRef),
            returned_data_ref: returnedDataRef,
            resume_behavior_ref: mapBehaviorRef(legacyReturnBehaviorRef)
          };
        }),
        internal_process_calls: (Array.isArray(source.internal_process_calls) ? source.internal_process_calls : []).map((item, index) => ({
          call_ref: technicalRef(item?.call_ref, `call${index + 1}`),
          caller_behavior_ref: mapBehaviorRef(item?.caller_behavior_ref),
          target_process_ref: item?.target_process_ref ? technicalRef(item.target_process_ref, 'target_process') : null,
          target_process_name: text(item?.target_process_name),
          input_data_refs: list(item?.input_data_refs).map(mapDataRef),
          output_data_refs: list(item?.output_data_refs).map(mapDataRef),
          return_behavior_ref: mapBehaviorRef(item?.return_behavior_ref)
        })),
        forms: (Array.isArray(source.forms) ? source.forms : []).map((form, formIndex) => ({
          form_ref: technicalRef(form?.form_ref, `form${formIndex + 1}`),
          behavior_ref: mapBehaviorRef(form?.behavior_ref),
          form_name: text(form?.form_name),
          form_no: nullable(form?.form_no),
          form_design_state: source.schema_version === 'process-governance-v3'
            && FORM_DESIGN_STATES.has(form?.form_design_state)
            ? form.form_design_state
            : 'unspecified',
          areas: (Array.isArray(form?.areas) ? form.areas : []).map((area, areaIndex) => ({
            area_ref: technicalRef(area?.area_ref, `area${formIndex + 1}_${areaIndex + 1}`),
            area_type: AREA_TYPES.includes(area?.area_type) ? area.area_type : '',
            area_title: text(area?.area_title),
            items: (Array.isArray(area?.items) ? area.items : []).map((item, itemIndex) => ({
              item_ref: technicalRef(item?.item_ref, `item${formIndex + 1}_${areaIndex + 1}_${itemIndex + 1}`),
              item_name: text(item?.item_name),
              item_type: text(item?.item_type),
              required: Boolean(item?.required),
              instructions: text(item?.instructions)
            }))
          }))
        })),
        terms: (Array.isArray(source.terms) ? source.terms : []).map((item, index) => ({
          term_ref: technicalRef(item?.term_ref, `term${index + 1}`),
          term_name: text(item?.term_name),
          definition: text(item?.definition)
        }))
      };
      if (source.migration && typeof source.migration === 'object') {
        normalized.migration = {
          source_schema_version: text(source.migration.source_schema_version),
          source_process_ref: source.migration.source_process_ref
            ? technicalRef(source.migration.source_process_ref, 'source_process')
            : null,
          source_process_count: Math.max(1, Number(source.migration.source_process_count) || 1)
        };
      } else if (source.schema_version === 'process-governance-v1') {
        normalized.migration = {
          source_schema_version: 'process-governance-v1',
          source_process_ref: process.process_ref ? technicalRef(process.process_ref, 'source_process') : null,
          source_process_count: 1
        };
      }
      syncRoles(normalized);
      return normalized;
    }

    function legacyReferenceMaterial(source, fileName, fileSha256) {
      const profile = source.document_profile || {};
      const draft = source.draft || {};
      return {
        material_ref: newRef('material'),
        material_type: draft.basis_type === '表单 / 台账' ? '表单或记录' : '现有制度',
        material_name: profile.document_title || draft.document_title || fileName || '历史结构化文件',
        document_no: nullable(profile.document_no || draft.document_no),
        version: nullable(draft.planned_edition),
        file_sha256: fileSha256 || null,
        readable_text: text(source.markdown_draft),
        provider_department: text(draft.department?.department_name),
        provider_name: '',
        as_of_date: null
      };
    }

    function splitLegacyDocument(source, options = {}) {
      const processList = Array.isArray(source.processes) && source.processes.length
        ? source.processes
        : [{
            process_ref: source.draft?.draft_ref || newRef('legacy_process'),
            l1_name: source.draft?.l1_name || '',
            l2_name: source.draft?.l2_name || '',
            l3_name: source.draft?.l3_name || source.draft?.process_name || ''
          }];
      const sharedMaterial = options.referenceMaterial
        ? normalizeV1({ reference_materials: [options.referenceMaterial] }).reference_materials[0]
        : legacyReferenceMaterial(source, options.fileName, options.fileSha256);

      return processList.map((legacyProcess, processIndex) => {
        const oldProcessRef = legacyProcess.process_ref;
        let steps = (source.steps || []).filter(step => step.process_ref === oldProcessRef);
        if (!steps.length && processList.length === 1) steps = Array.isArray(source.steps) ? source.steps : [];
        const stepRefMap = new Map();
        steps.forEach((step, index) => stepRefMap.set(step.step_ref, technicalRef(step.step_ref, `behavior${index + 1}`)));
        const dataObjects = [];
        const outputDataByStep = new Map();
        const bindings = Array.isArray(source.work_role_bindings) ? source.work_role_bindings : [];
        const unusedBindings = bindings.filter(binding => binding.process_ref === oldProcessRef && !stepRefMap.has(binding.step_ref));

        const behaviors = steps.map((step, index) => {
          const behaviorRef = stepRefMap.get(step.step_ref);
          const detail = (source.behavior_details || []).find(item => item.step_ref === step.step_ref) || {};
          const stepBindings = bindings.filter(binding => binding.step_ref === step.step_ref);
          const selectedBinding = stepBindings[0];
          if (stepBindings.length > 1) unusedBindings.push(...stepBindings.slice(1));
          const duty = LEGACY_DUTY_MAP[selectedBinding?.participation_type] || '';
          const outputDescription = text(step.output_result || detail.delivery_object);
          const outputRefs = [];
          if (outputDescription) {
            const dataRef = newRef('data');
            outputDataByStep.set(step.step_ref, dataRef);
            outputRefs.push(dataRef);
            dataObjects.push({
              data_ref: dataRef,
              data_name: outputDescription.slice(0, 120),
              description: outputDescription,
              governance_status: 'candidate',
              produced_by_behavior_ref: behaviorRef,
              consumed_by_behavior_refs: []
            });
          }
          const nodeType = step.step_type === 'decision' ? 'decision' : step.step_type === 'action' ? 'action' : '';
          return {
            behavior_ref: behaviorRef,
            node_type: nodeType,
            behavior_name: text(step.step_name),
            behavior_description: '',
            current_actor_role: text(step.actor_role || selectedBinding?.source_role_text),
            actor_assignment_mode: 'fixed_department',
            actor_department_data_ref: null,
            actor_position_rule: '',
            trigger: text(detail.trigger_scene),
            precondition: text(detail.precondition),
            input_description: text(step.input_materials),
            timing: nullable(step.timing),
            completion_standard: text(detail.execution_standard),
            output_description: outputDescription,
            input_data_refs: [],
            output_data_refs: outputRefs,
            work_role: selectedBinding ? {
              behavior_ref: behaviorRef,
              work_role_code: nullable(selectedBinding.work_role_code),
              role_duty: duty,
              work_role_name: roleName(step.step_name, duty),
              assignment_status: selectedBinding.work_role_code ? 'assigned' : 'pending_assignment'
            } : null,
            countersign_all_required: duty === '会签',
            countersign_target_departments: []
          };
        });

        (source.mdm_requirement_catalog || []).forEach(item => {
          const name = text(item.object);
          if (!name) return;
          dataObjects.push({
            data_ref: newRef('data'),
            data_name: name,
            description: text(item.requirement),
            governance_status: 'candidate',
            produced_by_behavior_ref: null,
            consumed_by_behavior_refs: []
          });
        });

        const formTables = Array.isArray(source.form_tables) ? source.form_tables : [];
        const tableFields = Array.isArray(source.form_table_fields) ? source.form_table_fields : [];
        const forms = (source.forms || [])
          .filter(form => stepRefMap.has(form.step_ref))
          .map((form, formIndex) => {
            let tables = formTables.filter(table => table.form_ref === form.form_ref);
            if (!tables.length && form.main_table_name) {
              tables = [{
                table_ref: newRef('legacy_table'),
                table_kind: 'main',
                table_name: form.main_table_name
              }];
            }
            return {
              form_ref: technicalRef(form.form_ref, `form${formIndex + 1}`),
              behavior_ref: stepRefMap.get(form.step_ref) || null,
              form_name: text(form.form_name),
              form_no: nullable(form.form_code),
              form_design_state: 'unspecified',
              areas: tables.map((table, areaIndex) => ({
                area_ref: technicalRef(table.table_ref, `area${formIndex + 1}_${areaIndex + 1}`),
                area_type: table.table_kind === 'detail' ? '明细清单' : '基本信息',
                area_title: text(table.table_name),
                items: tableFields
                  .filter(field => field.table_ref === table.table_ref)
                  .map((field, itemIndex) => ({
                    item_ref: technicalRef(field.table_field_ref, `item${formIndex + 1}_${areaIndex + 1}_${itemIndex + 1}`),
                    item_name: text(field.field_name),
                    item_type: text(field.field_type),
                    required: Boolean(field.required),
                    instructions: text(field.description)
                  }))
              }))
            };
          });

        const references = [clone(sharedMaterial)];
        const evidence = Array.isArray(source.evidence_catalog) ? source.evidence_catalog : [];
        if (unusedBindings.length || evidence.length) {
          references.push({
            material_ref: newRef('material'),
            material_type: '其他参考材料',
            material_name: '旧版结构化补充信息',
            document_no: null,
            version: null,
            file_sha256: null,
            readable_text: JSON.stringify({
              unmatched_work_role_bindings: unusedBindings,
              evidence_catalog: evidence
            }, null, 2),
            provider_department: text(source.draft?.department?.department_name),
            provider_name: '',
            as_of_date: null
          });
        }

        const result = {
          schema_version: 'process-governance-v3',
          export_meta: {
            package_ref: newRef('package'),
            exported_at: new Date().toISOString(),
            initiating_department: text(source.draft?.department?.department_name),
            compiler: ''
          },
          process: {
            process_ref: technicalRef(oldProcessRef, `process${processIndex + 1}`),
            process_name: text(legacyProcess.l3_name || source.draft?.process_name || source.draft?.l3_name),
            owning_department: text(source.draft?.department?.department_name),
            purpose: text(source.document_profile?.purpose),
            scope: text(source.document_profile?.scope),
            capability_domain: nullable(legacyProcess.l1_name || source.draft?.l1_name),
            business_capability: nullable(legacyProcess.l2_name || source.draft?.l2_name),
            classification_status: source.draft?.l1_status === 'confirmed' && source.draft?.l2_status === 'confirmed'
              ? 'confirmed'
              : 'unclassified'
          },
          reference_materials: references,
          behaviors,
          flow_relations: (source.step_transitions || [])
            .filter(relation => stepRefMap.has(relation.from_step_ref))
            .map((relation, index) => ({
              relation_ref: technicalRef(relation.transition_ref, `relation${index + 1}`),
              relation_type: 'condition',
              from_behavior_ref: stepRefMap.get(relation.from_step_ref),
              to_behavior_ref: relation.to_step_ref ? (stepRefMap.get(relation.to_step_ref) || null) : null,
              condition: text(relation.condition),
              join_mode: ''
            })),
          data_objects: dataObjects,
          cross_department_handoffs: (source.cross_dept_handoffs || [])
            .filter(handoff => stepRefMap.has(handoff.step_ref))
            .map((handoff, index) => ({
              handoff_ref: technicalRef(handoff.handoff_ref, `handoff${index + 1}`),
               handoff_direction: 'outbound_followup',
               anchor_behavior_ref: stepRefMap.get(handoff.step_ref),
               counterparty_resolution: text(handoff.target_department) ? 'identified' : 'needs_identification',
               source_department: text(source.draft?.department?.department_name),
               target_department: text(handoff.target_department),
               transfer_data_ref: outputDataByStep.get(handoff.step_ref) || null,
               returned_data_ref: null,
               requested_matter: text(handoff.target_behavior_name || handoff.handoff_standard),
               trigger_condition: '',
               completion_standard: text(handoff.handoff_standard),
               counterparty_process_ref: handoff.target_process_code ? technicalRef(handoff.target_process_code, 'counterparty_process') : null,
               counterparty_process_name: text(handoff.target_process_name),
               counterparty_behavior_ref: handoff.target_behavior_code ? technicalRef(handoff.target_behavior_code, 'counterparty_behavior') : null,
               counterparty_behavior_name: text(handoff.target_behavior_name),
               requires_return: false,
               resume_behavior_ref: null
             })),
          internal_process_calls: [],
          forms,
          terms: (source.terms || []).map((item, index) => ({
            term_ref: technicalRef(item.term_ref, `term${index + 1}`),
            term_name: text(item.term_name),
            definition: text(item.definition)
          })),
          migration: {
            source_schema_version: 'document-structured-output-v2',
            source_process_ref: oldProcessRef ? technicalRef(oldProcessRef, 'source_process') : null,
            source_process_count: processList.length
          }
        };
        syncRoles(result);
        return result;
      });
    }

    function currentEntry() {
      return candidates[currentIndex] || null;
    }

    function currentDocument() {
      return currentEntry()?.data || null;
    }

    function hasDirtyCandidates() {
      return candidates.some(item => item.dirty);
    }

    function touch() {
      const entry = currentEntry();
      if (!entry) return;
      entry.dirty = true;
      updateCandidateList();
    }

    function setBusy(value, message = '') {
      busy = value;
      actionButtons.forEach(button => {
        if (button.id === 'exportButton' || button.id === 'clearButton') {
          button.disabled = value || !currentDocument();
        } else {
          button.disabled = value;
        }
      });
      if (message) showStatus(message);
    }

    function showStatus(message, kind = '') {
      statusBox.textContent = message;
      statusBox.className = `status show${kind ? ` ${kind}` : ''}`;
    }

    function clearStatus() {
      statusBox.textContent = '';
      statusBox.className = 'status';
    }

    function optionHtml(options, selected) {
      return options.map(option => {
        const value = typeof option === 'string' ? option : option.value;
        const label = typeof option === 'string' ? (option || '请选择') : option.label;
        return `<option value="${escapeAttribute(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function getByPath(pathKey) {
      return pathKey.split('.').reduce((target, part) => target == null ? undefined : target[part], currentDocument());
    }

    function setByPath(pathKey, value) {
      const parts = pathKey.split('.');
      const last = parts.pop();
      const target = parts.reduce((node, part) => node[part], currentDocument());
      target[last] = value;
    }

    function field(pathKey, label, options = {}) {
      const value = getByPath(pathKey);
      const classes = ['field', options.className || ''].filter(Boolean).join(' ');
      const hint = options.hint ? `<span class="hint">${escapeHtml(options.hint)}</span>` : '';
      let control = '';
      if (options.type === 'textarea') {
        control = `<textarea class="${options.tall ? 'tall' : ''}" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" placeholder="${escapeAttribute(options.placeholder || '')}">${escapeHtml(value)}</textarea>`;
      } else if (options.type === 'select') {
        control = `<select data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}">${optionHtml(options.options || [], value == null ? '' : value)}</select>`;
      } else if (options.type === 'date') {
        control = `<input type="date" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}">`;
      } else if (options.type === 'checkbox') {
        control = `<div class="check-row"><label><input type="checkbox" data-bind="${escapeAttribute(pathKey)}" data-kind="boolean"${value ? ' checked' : ''}> ${escapeHtml(options.checkboxLabel || label)}</label></div>`;
      } else {
        control = `<input type="text" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}" placeholder="${escapeAttribute(options.placeholder || '')}">`;
      }
      return `<div class="${classes}"><label>${escapeHtml(label)}</label>${control}${hint}</div>`;
    }

    function formItemTypeField(pathKey, currentValue) {
      const normalizedValue = text(currentValue).trim();
      const knownValue = Boolean(normalizedValue && formItemTypes.includes(normalizedValue));
      const options = [{
        value: '',
        label: formItemTypeLoadState === 'loading' ? '正在读取数据类型' : '请选择数据类型'
      }].concat(formItemTypes.map(value => ({ value, label: value })));
      if (normalizedValue && !knownValue) {
        options.push({
          value: normalizedValue,
          label: formItemTypeLoadState === 'ready'
            ? `${normalizedValue}（当前类型字典未收录）`
            : `${normalizedValue}（保留当前值）`
        });
      }
      const unavailable = formItemTypeLoadState !== 'ready'
        ? '<div class="inline-warning">数据类型字典暂时不可用。3001不会清除已有类型；字典恢复后再选择标准类型。</div>'
        : '';
      const legacyWarning = formItemTypeLoadState === 'ready' && normalizedValue && !knownValue
        ? `<div class="inline-warning">当前导入值“${escapeHtml(normalizedValue)}”未被填写项类型字典收录。3001会保留原值；如需修改，只能改选标准类型。</div>`
        : '';
      return `
        <div class="field">
          <label>${escapeHtml('数据类型')}</label>
          <select
            data-bind="${escapeAttribute(pathKey)}"
            data-kind="text"
            ${formItemTypeLoadState !== 'ready' ? 'disabled' : ''}
          >${optionHtml(options, normalizedValue)}</select>
          <span class="hint">请从标准类型中选择，不允许自由填写。</span>
          ${legacyWarning}
          ${unavailable}
        </div>`;
    }

    function formDesignStateMeta(value) {
      if (value === 'current_state') return { label: '现状', className: 'current' };
      if (value === 'proposed_design') return { label: '拟设计', className: 'proposed' };
      return { label: '待确认', className: 'unspecified' };
    }

    function formDesignStateBadge(value) {
      const meta = formDesignStateMeta(value);
      return `<span class="form-state-badge ${meta.className}">${meta.label}</span>`;
    }

    function formItemAssignmentField(formIndex, areaIndex, itemIndex, item) {
      const form = currentDocument().forms[formIndex];
      const area = form.areas[areaIndex];
      let detailNumber = 0;
      const detailOptions = form.areas
        .filter(candidate => candidate.area_type === '明细清单')
        .map(candidate => {
          detailNumber += 1;
          return {
            value: candidate.area_ref,
            label: `${candidate.area_title || `明细表${detailNumber}`}`
          };
        });
      const selected = area.area_type === '基本信息'
        ? 'main'
        : area.area_type === '明细清单'
          ? area.area_ref
          : 'unassigned';
      const options = [
        { value: 'unassigned', label: '待确认' },
        { value: 'main', label: '主表字段' },
        ...detailOptions,
        { value: '__new_detail__', label: '新建明细表' }
      ];
      const focusKey = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.assignment`;
      return `
        <div class="field">
          <label>字段归属</label>
          <select
            data-form-item-assignment
            data-form-index="${formIndex}"
            data-item-ref="${escapeAttribute(item.item_ref)}"
            data-focus-key="${escapeAttribute(focusKey)}"
          >${optionHtml(options, selected)}</select>
          <span class="hint">只按纸质表单位置选择，不根据数据类型推断。</span>
        </div>`;
    }

    function behaviorSelect(pathKey, label, options = {}) {
      const selectedRef = text(getByPath(pathKey)).trim();
      const values = [{ value: '', label: options.blankLabel || '暂不指定' }]
        .concat((currentDocument()?.behaviors || [])
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => item.behavior_ref !== options.excludeRef)
          .filter(({ item }) => !options.localOnly || !externalActorDepartment(item.current_actor_role) || item.behavior_ref === selectedRef)
          .map(({ item, index }) => ({
            value: item.behavior_ref,
            label: `${index + 1}. ${item.behavior_name || '未命名行为'}${options.localOnly && externalActorDepartment(item.current_actor_role) ? '（历史跨部门关联，请调整）' : ''}`
          })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function dataSelect(pathKey, label, options = {}) {
      const values = [{ value: '', label: '暂不指定' }]
        .concat((currentDocument()?.data_objects || []).map((item, index) => ({
          value: item.data_ref,
          label: `${index + 1}. ${item.data_name || '未命名数据'}`
        })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function multiBehavior(pathKey, label, selected) {
      const behaviors = currentDocument()?.behaviors || [];
      const content = behaviors.length
        ? behaviors.map((item, index) => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(item.behavior_ref)}"${selected.includes(item.behavior_ref) ? ' checked' : ''}> ${index + 1}. ${escapeHtml(item.behavior_name || '未命名行为')}</label>`).join('')
        : '<span class="technical-note">请先新增业务行为。</span>';
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function currentDataFlowDetails() {
      return globalThis.StructureLearningScore?.dataFlowConsistencyDetails?.(currentDocument()) || {
        incomingByBehavior: new Map(),
        dataDetails: [],
        issues: [],
        canReach: () => false,
        isConsumerAvailable: () => true
      };
    }

    function behaviorEntrySummary(behaviorRef, flowDetails = currentDataFlowDetails()) {
      const incoming = flowDetails.incomingByBehavior.get(behaviorRef) || [];
      if (!incoming.length) return '这是流程入口，请说明流程如何开始。';
      return incoming.map(entry => {
        if (entry.kind === 'relation') {
          const relation = entry.relation;
          const source = relationEndpointLabel(relation.from_behavior_ref, '前序行为待选择');
          if (relation.relation_type === 'condition') {
            const condition = text(relation.condition).trim() || '判断条件待填写';
            return `“${condition}”成立时，从“${source}”进入`;
          }
          if (relation.relation_type === 'parallel') return `并行路线“${source}”完成后进入`;
          return `“${source}”完成后进入`;
        }
        const handoff = entry.handoff;
        if (entry.kind === 'outbound_handoff') {
          return `本流程“${relationEndpointLabel(handoff.anchor_behavior_ref, '发起行为待选择')}”完成后进入`;
        }
        const department = externalDepartmentForHandoff(handoff) || '外部门';
        const action = text(counterpartyBehaviorForHandoff(handoff)?.behavior_name).trim()
          || text(handoff.counterparty_behavior_name).trim()
          || text(handoff.requested_matter).trim()
          || '承接事项';
        return entry.kind === 'returning_handoff'
          ? `${department}完成“${action}”并返回后恢复`
          : `${department}提供“${action}”后进入`;
      }).join('；');
    }

    function behaviorDataSummary(behaviorRef, flowDetails = currentDataFlowDetails()) {
      const inputs = [];
      const outputs = [];
      flowDetails.dataDetails.forEach(detail => {
        const label = text(detail.data?.data_name).trim() || `输出物与数据${detail.dataIndex + 1}`;
        if (detail.consumerRefs.includes(behaviorRef) || detail.availabilityStarts.includes(behaviorRef)) inputs.push(label);
        if (detail.producerRefs.includes(behaviorRef)) outputs.push(label);
      });
      const behavior = (currentDocument()?.behaviors || []).find(item => item.behavior_ref === behaviorRef);
      if (isDynamicActorBehavior(behavior) && behavior.actor_department_data_ref) {
        const source = (currentDocument()?.data_objects || []).find(item => item.data_ref === behavior.actor_department_data_ref);
        const label = text(source?.data_name).trim() || '执行部门来源数据';
        inputs.push(`${label}（用于确定执行部门）`);
      }
      return {
        inputs: [...new Set(inputs)],
        outputs: [...new Set(outputs)]
      };
    }

    function renderBehaviorDerivedSummary(item, flowDetails) {
      const summary = behaviorDataSummary(item.behavior_ref, flowDetails);
      const entry = behaviorEntrySummary(item.behavior_ref, flowDetails);
      return `
        <div class="field wide">
          <span class="field-label">由流程关系和输出物与数据自动带出</span>
          <div class="inline-note">
            <div><strong>进入本行为：</strong>${escapeHtml(entry)}</div>
            <div><strong>本行为使用：</strong>${escapeHtml(summary.inputs.length ? summary.inputs.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为产生：</strong>${escapeHtml(summary.outputs.length ? summary.outputs.join('、') : '当前没有已关联数据')}</div>
            <button class="button secondary small" data-action="open-behavior-data" data-ref="${escapeAttribute(item.behavior_ref)}">管理输出物与数据</button>
          </div>
        </div>`;
    }

    function renderLegacyBehaviorSupplement(item, hasDerivedEntry) {
      const entries = [];
      if (hasDerivedEntry && text(item.trigger).trim()) entries.push(`<div><strong>原“何时触发”：</strong>${escapeHtml(item.trigger)}</div>`);
      if (text(item.input_description).trim()) entries.push(`<div><strong>原“需要什么输入”：</strong>${escapeHtml(item.input_description)}</div>`);
      if (text(item.output_description).trim()) entries.push(`<div><strong>原“最终交付什么”：</strong>${escapeHtml(item.output_description)}</div>`);
      if (['parallel_split', 'parallel_join'].includes(item.node_type) && text(item.completion_standard).trim()) {
        entries.push(`<div><strong>原“怎样算完成”：</strong>${escapeHtml(item.completion_standard)}</div>`);
      }
      if (!entries.length) return '';
      return `
        <details class="nested">
          <summary><strong>历史文字补充（只读）</strong></summary>
          <div class="inline-note" style="margin-top:12px">
            ${entries.join('')}
            <div>这些内容按原值保留，不再要求重复填写。请在流程关系和“输出物与数据”中维护现行结构关系。</div>
          </div>
        </details>`;
    }

    function dataConsumerBehaviorPicker(dataIndex, item, flowDetails = currentDataFlowDetails()) {
      const flowDetail = flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref);
      const selected = flowDetail?.consumerRefs
        || (Array.isArray(item.consumed_by_behavior_refs) ? item.consumed_by_behavior_refs : []);
      const pathKey = `data_objects.${dataIndex}.consumed_by_behavior_refs`;
      const choices = (currentDocument()?.behaviors || []).map((behavior, behaviorIndex) => {
        const isSelected = selected.includes(behavior.behavior_ref);
        const issue = flowDetails.consumerIssue?.(item.data_ref, behavior.behavior_ref);
        if (!isSelected && !flowDetails.isConsumerAvailable(item.data_ref, behavior.behavior_ref)) return '';
        const warning = issue ? ` <span class="technical-note">历史引用待整改：${escapeHtml(issue.message)}</span>` : '';
        return `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(behavior.behavior_ref)}"${isSelected ? ' checked' : ''}> ${behaviorIndex + 1}. ${escapeHtml(behavior.behavior_name || '未命名行为')}${warning}</label>`;
      }).filter(Boolean);
      const content = choices.length
        ? choices.join('')
        : '<span class="technical-note">当前没有符合流程先后顺序的可选行为。请先检查产生行为和流程关系。</span>';
      return `<div class="field wide"><span class="field-label">被哪些后续行为使用</span><div class="check-list">${content}</div><span class="hint">只显示产生后可到达的行为。并行分支之间、同一行为自身以及明确的前序行为不可选择。</span></div>`;
    }

    function dataProducerBehaviorSelect(dataIndex, item, flowDetails = currentDataFlowDetails()) {
      const flowDetail = flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref);
      const consumerRefs = flowDetail?.consumerRefs || [];
      const selected = text(item.produced_by_behavior_ref).trim();
      const values = [{ value: '', label: '暂不指定' }];
      (currentDocument()?.behaviors || []).forEach((behavior, behaviorIndex) => {
        const candidateRef = behavior.behavior_ref;
        const allowed = consumerRefs.every(consumerRef =>
          candidateRef !== consumerRef
          && flowDetails.canReach(candidateRef, consumerRef)
          && !flowDetails.canReach(consumerRef, candidateRef)
        );
        if (!allowed && candidateRef !== selected) return;
        values.push({
          value: candidateRef,
          label: `${behaviorIndex + 1}. ${behavior.behavior_name || '未命名行为'}${allowed ? '' : '（历史值待整改）'}`
        });
      });
      return field(`data_objects.${dataIndex}.produced_by_behavior_ref`, '由哪个行为产生', {
        type: 'select',
        options: values,
        nullable: true,
        hint: '只显示位于全部使用行为之前的可选行为。外部门返回的数据可以暂不指定，由跨部门待办的返回数据和恢复位置表达。'
      });
    }

    function syncBehaviorLinksForData(item, options = {}) {
      const data = currentDocument();
      if (!data || !item?.data_ref) return;
      if (options.producer) {
        data.behaviors.forEach(behavior => {
          behavior.output_data_refs = (behavior.output_data_refs || []).filter(ref => ref !== item.data_ref);
        });
        const producer = data.behaviors.find(behavior => behavior.behavior_ref === item.produced_by_behavior_ref);
        if (producer && !producer.output_data_refs.includes(item.data_ref)) producer.output_data_refs.push(item.data_ref);
      }
      if (options.consumers) {
        const consumers = new Set(item.consumed_by_behavior_refs || []);
        data.behaviors.forEach(behavior => {
          behavior.input_data_refs = (behavior.input_data_refs || []).filter(ref => ref !== item.data_ref);
          if (consumers.has(behavior.behavior_ref)) behavior.input_data_refs.push(item.data_ref);
        });
      }
    }

      const content = DEPARTMENTS.map(department => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(department)}"${selected.includes(department) ? ' checked' : ''}> ${escapeHtml(department)}</label>`).join('');
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;

      let behavior = behaviors.find(item => item.behavior_ref === activeBehaviorRef);
      if (!behavior) behavior = behaviors[0] || null;
      activeBehaviorRef = behavior?.behavior_ref || '';
      return behavior;

    function ensureActiveCollectionItem(collectionKey, refKey, activeRef) {
      const collection = currentDocument()?.[collectionKey] || [];
      let item = collection.find(candidate => text(candidate?.[refKey]) === activeRef);
      if (!item) item = collection[0] || null;
      return {
        item,
        index: item ? collection.indexOf(item) : -1,
        ref: text(item?.[refKey])
      };
    }

      const active = ensureActiveCollectionItem('flow_relations', 'relation_ref', activeRelationRef);
      activeRelationRef = active.ref;
      return active;
    }

      const active = ensureActiveCollectionItem('data_objects', 'data_ref', activeDataRef);
      activeDataRef = active.ref;
      return active;
    }

      const active = ensureActiveCollectionItem('cross_department_handoffs', 'handoff_ref', activeHandoffRef);
      activeHandoffRef = active.ref;
      return active;
    }

    function ensureActiveForm() {
      const forms = currentDocument()?.forms || [];
      let form = forms.find(item => item.form_ref === activeFormRef);
      if (!form) form = forms[0] || null;
      activeFormRef = form?.form_ref || '';
      if (!form) {
        activeAreaRef = '';
        return { form: null, formIndex: -1, area: null, areaIndex: -1 };

      const mainArea = form.areas.find(item => item.area_type === '基本信息');
      let area = form.areas.find(item => item.area_ref === activeAreaRef);
      if (!area) area = mainArea || form.areas[0] || null;
      activeAreaRef = area?.area_ref || '';
      return {
        form,
        formIndex: forms.indexOf(form),

    function renderDiagramWarnings(model) {
      const relationReviewMessage = '该关系与其他非回路关系形成闭环；如果这是退回前序行为，请选择“流程内部回路”。';
      const unresolvedWarnings = model.unresolvedItems.length ? `
        <div class="diagram-warning-list" aria-label="未显示项目">
          <strong>有 ${model.unresolvedCount} 项内容无法绘制，请返回文字编制补齐：</strong>
          ${model.unresolvedItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message)}</button>
          `).join('')}
        </div>` : '';
      const relationReviews = model.reviewItems?.length ? `
        <div class="diagram-warning-list" aria-label="关系类型请核对">
          <strong>关系类型请核对（不影响导出）：</strong>
          ${model.reviewItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message || relationReviewMessage)}</button>
          `).join('')}
        </div>` : '';
      return `${unresolvedWarnings}${relationReviews}`;
    }

    function renderDiagramPanel(model) {
      if (!model.namedBehaviorCount) {
        return `
          <div class="diagram-empty">
            <h2>尚不能生成跨职能流程图预览</h2>
            <p>请先在“文字编制”中填写至少一个业务行为名称。填写名称后可以查看节点；补充明确的流程关系后才会显示箭头。</p>
            <button class="button primary" data-action="return-editor">返回文字编制</button>
          </div>`;
      }
      const importedNotice = currentEntry()?.origin !== 'new'
        ? '<div class="diagram-notice">该图根据导入内容生成，仅用于核对，不代表已经审核。</div>'
        : '';
      const relationNotice = model.localEdgeCount === 0
        ? '<div class="diagram-notice warning">当前只能看到业务行为节点；本流程尚无明确流程关系，因此行为节点之间没有箭头。</div>'
        : '';
      return `
        <section class="section diagram-section${diagramExpanded ? ' diagram-expanded' : ''}">
          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>${escapeHtml(currentDocument().process.process_name || '未命名流程')} · 跨职能流程图预览</h2>
                <p>每条横向泳道代表执行部门，节点第二行显示执行岗位。图形只根据明确关系生成；用户可以平移、缩放和点击定位，但不能在图中编排流程。</p>
              </div>
              <div class="diagram-controls">
                <button class="button small" data-action="fit-diagram">适应画布</button>
                <button class="button small" data-action="reset-diagram">重置视图</button>
                <button
                  class="button small"
                  data-action="toggle-diagram-expanded"
                  aria-pressed="${diagramExpanded}"
                >${diagramExpanded ? '退出展开' : '展开查看'}</button>
                <button class="button small" data-action="return-editor">返回文字编制</button>
              </div>
            </div>
            ${renderDiagramLegend()}
            ${importedNotice}
            ${relationNotice}
            <div class="diagram-notice" id="diagramViewportNotice" role="status" hidden>
              当前已聚焦流程开头，点击“适应画布”查看完整流程
            </div>
            <div
              class="diagram-canvas"
              id="processDiagramCanvas"
              role="img"
              aria-label="当前流程的只读跨职能流程图。横向泳道表示执行部门，点击节点或箭头可以返回对应的文字编制位置。"
            ></div>
            <div class="diagram-failure" id="diagramFailure" role="alert"></div>
            ${renderDiagramWarnings(model)}
          </div>
        </section>`;
    }

    function destroyDiagram() {
      if (!diagramView) return;
      try {
        diagramView.destroy();
      } catch (_error) {
        // The text editor must remain available even if the graph library has already released the canvas.
      }
      diagramView = null;
    }

    function mountDiagram() {
      destroyDiagram();
      if (activeWorkspaceTab !== 'diagram') return;
      const data = currentDocument();
      const model = currentDiagramModel(data);
      if (!data || !model.namedBehaviorCount) return;
      const container = document.getElementById('processDiagramCanvas');
      const failure = document.getElementById('diagramFailure');
      if (!container) return;
      try {
        diagramView = window.ProcessDiagram.mount({
          container,
          documentData: data,
          departmentOrder: actorDepartments(),
          onFocus: focusEditorItem,
          onViewportModeChange(viewport) {
            const notice = document.getElementById('diagramViewportNotice');
            if (notice) notice.hidden = viewport?.mode !== 'start';
          }
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `流程图暂时无法生成：${error.message}。当前文字内容仍然保留，可以继续编制或导出。`;
          failure.classList.add('show');
        }
      }
    }

    function setActiveWorkspaceTab(tab) {
      if (!currentDocument()) return;
      activeWorkspaceTab = tab === 'diagram' ? 'diagram' : 'editor';
      if (activeWorkspaceTab === 'editor') diagramExpanded = false;
      if (activeWorkspaceTab === 'diagram') {
        const model = currentDiagramModel();
        if (model.namedBehaviorCount) openedPreviewProcesses.add(currentProcessKey());
      }
      render();
    }

    function focusEditorTarget(target = {}) {
      const focusKind = text(target.focusKind);
      const focusRef = text(target.focusRef);
      const focusPaths = [...new Set([
        text(target.focusPath),
        ...(Array.isArray(target.focusPaths) ? target.focusPaths.map(text) : [])
      ].filter(Boolean))];
      if (focusKind === 'call') {
        showStatus('部门内调用仅用于预览，请在MDM平台正式功能中维护。');
        return;
      }
      diagramExpanded = false;
      activeWorkspaceTab = 'editor';
      activeEditorSection = EDITOR_SECTIONS.some(item => item.value === target.editorSection)
        ? target.editorSection
        : 'process';
      if (PROCESS_SECTIONS.some(item => item.value === target.processSection)) {
        activeProcessSection = target.processSection;
      }
      if (focusKind === 'behavior') {
        activeEditorSection = 'process';
        activeProcessSection = 'behaviors';
        activeBehaviorRef = focusRef;
      } else if (focusKind === 'relation') {
        activeEditorSection = 'process';
        activeProcessSection = 'relations';
        activeRelationRef = focusRef;
      } else if (focusKind === 'data') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = focusRef;
      } else if (focusKind === 'handoff') {
        activeEditorSection = 'process';
        activeProcessSection = 'behaviors';
        const handoff = currentDocument()?.cross_department_handoffs?.find(item => item.handoff_ref === focusRef);
        const counterpartyBehavior = counterpartyBehaviorForHandoff(handoff);
        if (counterpartyBehavior) {
          activeFlowItemKind = 'behavior';
          activeBehaviorRef = counterpartyBehavior.behavior_ref;
        } else {
          activeFlowItemKind = 'handoff';
          activeHandoffRef = focusRef;
        }
      } else if (focusKind === 'form') {
        activeEditorSection = 'forms';
        activeFormRef = focusRef;
      } else if (focusKind === 'area') {
        activeEditorSection = 'forms';
        const owner = currentDocument()?.forms?.find(form =>
          form.areas.some(area => area.area_ref === focusRef)
        );
        if (owner) {
          activeFormRef = owner.form_ref;
          activeAreaRef = focusRef;
        }
      }
      render();
      requestAnimationFrame(() => {
        const card = Array.from(workspace.querySelectorAll('[data-focus-kind]')).find(item =>
          item.dataset.focusKind === focusKind && item.dataset.focusRef === text(focusRef)
        );
        const controls = Array.from(
          workspace.querySelectorAll('[data-bind], [data-focus-key], [data-list-bind]')
        ).filter(item =>
          focusPaths.includes(item.dataset.bind)
          || focusPaths.includes(item.dataset.focusKey)
          || focusPaths.includes(item.dataset.listBind)
        );
        controls.forEach(control => {
          const details = control.closest('details');
          if (details) details.open = true;
        });
        const focusTarget = controls.find(control => !control.disabled)
          || controls[0]
          || card
          || workspace.querySelector('.section');
        if (!focusTarget) return;
        workspace.querySelectorAll('.focused-card, .focused-control').forEach(item => {
          item.classList.remove('focused-card', 'focused-control');
          item.removeAttribute('aria-invalid');
        });
        if (controls.length) {
          controls.forEach(control => {
            void control.offsetWidth;
            control.classList.add('focused-control');
            control.setAttribute('aria-invalid', 'true');
          });
          if (!focusTarget.disabled) focusTarget.focus({ preventScroll: true });
        } else {
          focusTarget.classList.add('focused-card');
          focusTarget.setAttribute('tabindex', '-1');
          focusTarget.focus({ preventScroll: true });
        }
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (focusClearTimer) clearTimeout(focusClearTimer);
        focusClearTimer = setTimeout(() => {
          focusTarget.classList.remove('focused-card');
          controls.forEach(control => {
            control.classList.remove('focused-control');
            control.removeAttribute('aria-invalid');
          });
        }, 2900);
      });
    }

    function focusEditorItem(focusKind, focusRef) {
      focusEditorTarget({ focusKind, focusRef });
    }

    function focusExportWarning(element) {
      let focusPaths = [];
      try {
        const parsed = JSON.parse(element.dataset.focusPaths || '[]');
        if (Array.isArray(parsed)) focusPaths = parsed;
      } catch (_error) {
        focusPaths = [];
      }
      focusEditorTarget({
        editorSection: element.dataset.editorSection,
        processSection: element.dataset.processSection,
        focusKind: element.dataset.focusKind,
        focusRef: element.dataset.focusRef,
        focusPath: element.dataset.focusPath,
        focusPaths
      });
    }

    function refreshPreviewAvailability() {
      if (!currentDocument()) return;
      const model = currentDiagramModel();
      const status = previewStatus(model);
      const badge = document.getElementById('diagramTabStatus');
      if (badge) {
        badge.textContent = status.label;
        badge.className = `tab-status ${status.className}`;
      }
      const callout = document.getElementById('previewReadyCallout');
      if (callout) {
        callout.hidden = !(model.namedBehaviorCount > 0 && !openedPreviewProcesses.has(currentProcessKey()));
      }
    }

    function selectInitialTabAfterImport() {
      const model = currentDiagramModel();
      resetEditorNavigation(model.namedBehaviorCount ? 'process' : 'basic');
      diagramExpanded = false;
      activeWorkspaceTab = model.namedBehaviorCount ? 'diagram' : 'editor';
      if (model.namedBehaviorCount) openedPreviewProcesses.add(currentProcessKey());
    }

    function renderBasic() {
      const body = `<div class="grid">
        ${field('export_meta.initiating_department', '发起部门', { type: 'select', options: [''].concat(DEPARTMENTS) })}
        ${field('export_meta.compiler', '编制人', { placeholder: '手工填写姓名' })}
        ${field('process.process_name', '流程名称', { placeholder: '不自动生成，由编制人填写' })}
        ${field('process.owning_department', '归口部门', {
          type: 'select',
          options: [''].concat(DEPARTMENTS),
          hint: '归口部门是识别本部门行为和跨部门行为的基准。已有流程内容时，变更前会显示影响范围；确认后，页面重置依赖原归口部门的字段。'
        })}
        ${field('process.capability_domain', '能力域（可选）', { nullable: true, placeholder: '不填时保持未归类' })}
        ${field('process.business_capability', '业务能力（可选）', { nullable: true, placeholder: '不填时不阻塞审核' })}
        ${field('process.classification_status', '归类状态', {
          type: 'select',
          options: [
            { value: 'unclassified', label: '未归类' },
            { value: 'needs_review', label: '待确认' },
            { value: 'confirmed', label: '已确认' }
          ]
        })}
      </div>`;
      return section('流程基本信息', '制度名称和制度编号不是本阶段的前置条件；能力域和业务能力可以暂不填写。', body);
    }

    function renderProfile() {
      const body = `<div class="grid">
        ${field('process.purpose', '流程目的', { type: 'textarea', className: 'half', placeholder: '说明为什么要建立这条流程' })}
        ${field('process.scope', '适用范围', { type: 'textarea', className: 'half', placeholder: '说明适用对象、业务边界或触发范围' })}
      </div>`;
      return section('目的与范围', '分别说明这条流程要解决的问题，以及流程适用的对象和业务边界。', body);
    }

    function behaviorLabel(behaviorRef) {
      const index = currentDocument().behaviors.findIndex(item => item.behavior_ref === behaviorRef);
      if (index < 0) return '本流程关联行为待选择';
      return `${index + 1}. ${currentDocument().behaviors[index].behavior_name || '未命名业务行为'}`;
    }

    function linkedHandoffs(behaviorRef) {
      return currentDocument().cross_department_handoffs
        .map((handoff, handoffIndex) => ({ handoff, handoffIndex }))
        .filter(({ handoff }) => handoff.anchor_behavior_ref === behaviorRef);
    }

    function flowItems() {
      const data = currentDocument();
      if (!data) return [];
      const result = [];
      const placedHandoffRefs = new Set();
      data.behaviors.forEach((behavior, behaviorIndex) => {
        const counterpartyLink = linkedHandoffForCounterpartyBehavior(behavior.behavior_ref, data);
        if (counterpartyLink) placedHandoffRefs.add(counterpartyLink.handoff.handoff_ref);
        linkedHandoffs(behavior.behavior_ref)
          .filter(({ handoff }) => !counterpartyBehaviorForHandoff(handoff, data))
          .filter(({ handoff }) => handoff.handoff_direction === 'inbound_prerequisite')
          .forEach(entry => {
            placedHandoffRefs.add(entry.handoff.handoff_ref);
            result.push({ kind: 'handoff', ...entry });
          });
        result.push({ kind: 'behavior', behavior, behaviorIndex, counterpartyLink });
        linkedHandoffs(behavior.behavior_ref)
          .filter(({ handoff }) => !counterpartyBehaviorForHandoff(handoff, data))
          .filter(({ handoff }) => handoff.handoff_direction !== 'inbound_prerequisite')
          .forEach(entry => {
            placedHandoffRefs.add(entry.handoff.handoff_ref);
            result.push({ kind: 'handoff', ...entry });
          });
      });
      data.cross_department_handoffs.forEach((handoff, handoffIndex) => {
        if (!placedHandoffRefs.has(handoff.handoff_ref)) {
          result.push({ kind: 'handoff', handoff, handoffIndex, placementPending: true });
        }
      });
      return result;
    }

    function ensureActiveFlowItem() {
      const items = flowItems();
      let active = items.find(item => item.kind === activeFlowItemKind && (
        item.kind === 'behavior'
          ? item.behavior.behavior_ref === activeBehaviorRef
          : item.handoff.handoff_ref === activeHandoffRef
      ));
      if (!active) active = items[0] || null;
      if (active?.kind === 'behavior') {
        activeFlowItemKind = 'behavior';
        activeBehaviorRef = active.behavior.behavior_ref;
      } else if (active?.kind === 'handoff') {
        activeFlowItemKind = 'handoff';
        activeHandoffRef = active.handoff.handoff_ref;
      }
      return active;
    }

    function successorBehaviorRefs(behaviorRef, data = currentDocument()) {
      return [...new Set((data?.flow_relations || [])
        .filter(relation =>
          relation.from_behavior_ref === behaviorRef
          && relation.relation_type !== 'loop'
          && relation.to_behavior_ref
        )
        .map(relation => relation.to_behavior_ref))];
    }

    function defaultHandoffTrigger(direction, behaviorRef, data = currentDocument()) {
      const behavior = (data?.behaviors || []).find(item => item.behavior_ref === behaviorRef);
      const name = text(behavior?.behavior_name).trim() || '当前本流程行为';
      return direction === 'inbound_prerequisite'
        ? `“${name}”开始前`
        : `“${name}”完成后，系统生成跨部门待办`;
    }

    function defaultResumeBehaviorRef(behaviorRef, data = currentDocument()) {
      const refs = successorBehaviorRefs(behaviorRef, data);
      return refs.length === 1 ? refs[0] : null;
    }

    function externalDepartmentForHandoff(handoff) {
      return text(
        handoff.handoff_direction === 'inbound_prerequisite'
          ? handoff.source_department
          : handoff.target_department
      ).trim();
    }

    function handoffExternalDepartmentOptions(handoff) {
      const owningDepartment = currentExecutionDepartment();
      const currentValue = externalDepartmentForHandoff(handoff);
