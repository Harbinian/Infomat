      ).length;
      if (internalCallCount) {
        window.alert(`当前数据被${internalCallCount}条部门内调用预览信息引用。3001不编辑部门内调用，请保留该数据，或在MDM平台处理后重新导入。`);
        return false;
      }
      const dynamicActorCount = currentDocument().behaviors.filter(behavior =>
        behavior.actor_department_data_ref === ref
      ).length;
      if (
        dynamicActorCount
        && !window.confirm(`当前数据用于确定${dynamicActorCount}个行为的运行时责任部门。删除后，这些行为需要重新选择责任部门来源数据。确定继续吗？`)
      ) return false;
      currentDocument().data_objects.splice(index, 1);
      if (activeDataRef === ref) {
        activeDataRef = currentDocument().data_objects[Math.min(index, currentDocument().data_objects.length - 1)]?.data_ref || '';
      }
      currentDocument().behaviors.forEach(behavior => {
        behavior.input_data_refs = behavior.input_data_refs.filter(value => value !== ref);
        behavior.output_data_refs = behavior.output_data_refs.filter(value => value !== ref);
        if (behavior.actor_department_data_ref === ref) behavior.actor_department_data_ref = null;
      });
      currentDocument().cross_department_handoffs.forEach(handoff => {
        if (handoff.transfer_data_ref === ref) handoff.transfer_data_ref = null;
        if (handoff.returned_data_ref === ref) handoff.returned_data_ref = null;
      });
      return true;
    }

    function mergeChoiceOptions(field, candidates) {
      const values = [];
      candidates.forEach(candidate => {
        const value = text(candidate.value).trim();
        if (!value || values.some(item => item.value === value)) return;
        values.push({ field, value, label: candidate.label || value, source: candidate.source || '' });
      });
      return values;
    }

    function analyzeLegacyExternalBehavior(data, externalBehaviorRef) {
      const behavior = (data?.behaviors || []).find(item => item.behavior_ref === externalBehaviorRef);
      const owner = text(data?.process?.owning_department).trim();
      const externalDepartment = behavior
        ? externalActorDepartment(behavior.current_actor_role, owner)
        : '';
      const incomingRelations = (data?.flow_relations || []).filter(item => item.to_behavior_ref === externalBehaviorRef);
      const outgoingRelations = (data?.flow_relations || []).filter(item => item.from_behavior_ref === externalBehaviorRef);
      const senderRef = incomingRelations.length === 1 ? incomingRelations[0].from_behavior_ref : null;
      const outgoingResumeRef = outgoingRelations.length === 1 ? outgoingRelations[0].to_behavior_ref : null;
      const mergeDirection = incomingRelations.length === 0 && outgoingRelations.length === 1
        ? 'inbound_prerequisite'
        : 'outbound_followup';
      const anchorBehaviorRef = mergeDirection === 'inbound_prerequisite'
        ? outgoingResumeRef
        : senderRef;
      const anchorBehavior = (data?.behaviors || []).find(item => item.behavior_ref === anchorBehaviorRef);
      const outboundMatches = (data?.cross_department_handoffs || []).filter(item =>
        senderRef
        && item.handoff_direction === 'outbound_followup'
        && item.anchor_behavior_ref === senderRef
        && (!text(item.target_department).trim() || item.target_department === externalDepartment)
      );
      const inboundMatches = (data?.cross_department_handoffs || []).filter(item =>
        outgoingResumeRef
        && item.handoff_direction === 'inbound_prerequisite'
        && item.anchor_behavior_ref === outgoingResumeRef
        && (!text(item.source_department).trim() || item.source_department === externalDepartment)
      );
      const selfAnchoredHandoffs = (data?.cross_department_handoffs || []).filter(item =>
        item.anchor_behavior_ref === externalBehaviorRef
      );
      const directCounterpartyHandoffs = (data?.cross_department_handoffs || []).filter(item =>
        item.counterparty_behavior_ref === externalBehaviorRef
      );
      const legacySelfHandoff = selfAnchoredHandoffs.length === 1 ? selfAnchoredHandoffs[0] : null;
      const inboundHandoff = inboundMatches.length === 1 ? inboundMatches[0] : null;
      const directCounterpartyHandoff = directCounterpartyHandoffs.length === 1 ? directCounterpartyHandoffs[0] : null;
      const keptHandoff = directCounterpartyHandoff || (mergeDirection === 'inbound_prerequisite'
        ? inboundHandoff || legacySelfHandoff
        : (outboundMatches.length === 1 ? outboundMatches[0] : null) || legacySelfHandoff);
      const handoffSources = [];
      const addHandoffSource = (handoff, source) => {
        if (!handoff || handoffSources.some(item => item.handoff.handoff_ref === handoff.handoff_ref)) return;
        handoffSources.push({ handoff, source });
      };
      addHandoffSource(keptHandoff, directCounterpartyHandoff === keptHandoff
        ? '已关联当前外部门行为'
        : legacySelfHandoff === keptHandoff
          ? '旧版关联待办'
          : (mergeDirection === 'inbound_prerequisite' ? '已有前置输入' : '已有后续承接'));
      outboundMatches.forEach(item => addHandoffSource(item, '已有后续承接'));
      inboundMatches.forEach(item => addHandoffSource(item, '已有前置输入'));
      selfAnchoredHandoffs.forEach(item => addHandoffSource(item, '旧版关联待办'));
      directCounterpartyHandoffs.forEach(item => addHandoffSource(item, '已关联当前外部门行为'));
      const handoffsToMerge = handoffSources.map(item => item.handoff);
      const producedDataRefs = (data?.data_objects || [])
        .filter(item => item.produced_by_behavior_ref === externalBehaviorRef)
        .map(item => item.data_ref);
      const blockers = [];
      if (!behavior) blockers.push('未找到需要归并的旧版外部门行为。');
      if (!owner) blockers.push('请先填写流程归口部门，再归并重复表达。');
      if (behavior && !externalDepartment) blockers.push('无法从原文件执行岗位识别承接部门。');
      if (incomingRelations.length === 0) {
        if (outgoingRelations.length !== 1) {
          blockers.push(`当前外部门行为没有前序关系，并且有${outgoingRelations.length}条后续关系，无法唯一确定本流程接收行为。`);
        }
      } else {
        if (incomingRelations.length !== 1) blockers.push(`当前外部门行为有${incomingRelations.length}条前序关系，无法唯一确定本部门发起行为。`);
        if (outgoingRelations.length > 1) blockers.push(`当前外部门行为有${outgoingRelations.length}条后续关系，无法唯一确定返回位置。`);
      }
      if (anchorBehavior && externalActorDepartment(anchorBehavior.current_actor_role, owner)) {
        blockers.push('与当前外部门行为相邻的行为仍由外部门执行，无法唯一确定本流程关联行为。');
      }
      if (outboundMatches.length > 1) blockers.push(`检测到${outboundMatches.length}条可能的后续承接，无法唯一确定保留记录。`);
      if (inboundMatches.length > 1) blockers.push(`检测到${inboundMatches.length}条可能的前置输入，无法唯一确定返回记录。`);
      if (selfAnchoredHandoffs.length > 1) blockers.push(`检测到${selfAnchoredHandoffs.length}条锚定在旧版外部门行为上的待办，无法唯一确定保留记录。`);
      if (directCounterpartyHandoffs.length > 1) blockers.push(`当前外部门行为关联了${directCounterpartyHandoffs.length}条跨部门关系，无法唯一确定保留记录。`);
      const processRefs = [...new Set(handoffsToMerge.map(item => text(item.counterparty_process_ref).trim()).filter(Boolean))];
      const behaviorRefs = [...new Set(handoffsToMerge
        .map(item => text(item.counterparty_behavior_ref).trim())
        .filter(ref => ref && ref !== externalBehaviorRef))];
      if (processRefs.length > 1) blockers.push('待归并记录引用了不同的外部门流程，3001不能自动选择保留哪一项。');
      if (behaviorRefs.length > 1) blockers.push('待归并记录引用了不同的外部门行为，3001不能自动选择保留哪一项。');
      const recognizedHandoffRefs = new Set(handoffsToMerge.map(item => item.handoff_ref));
      const otherLinkedHandoffs = (data?.cross_department_handoffs || []).filter(item =>
        (item.anchor_behavior_ref === externalBehaviorRef || item.resume_behavior_ref === externalBehaviorRef)
        && !recognizedHandoffRefs.has(item.handoff_ref)
      );
      if (otherLinkedHandoffs.length) blockers.push(`当前外部门行为还被${otherLinkedHandoffs.length}条其他跨部门待办引用。`);

      if (mergeDirection === 'inbound_prerequisite') {
        const conflictingResumeRefs = [...new Set(handoffsToMerge
          .map(item => text(item.resume_behavior_ref).trim())
          .filter(ref => ref && ref !== anchorBehaviorRef))];
        if (conflictingResumeRefs.length) {
          blockers.push('旧版待办的恢复位置与唯一的本流程接收行为不一致，无法自动改为前置输入。');
        }
      }

      const handoffValueCandidates = (field, labeler = value => value) => handoffSources.map(({ handoff, source }) => ({
        value: handoff?.[field],
        label: `${source}：${labeler(handoff?.[field])}`,
        source
      }));

      const transferDataOptions = mergeChoiceOptions('transfer_data_ref', [
        ...handoffValueCandidates('transfer_data_ref', value => dataLabelForData(data, value))
          .filter(candidate => mergeDirection === 'inbound_prerequisite' || !producedDataRefs.includes(candidate.value)),
        ...(mergeDirection === 'inbound_prerequisite'
          ? handoffValueCandidates('returned_data_ref', value => dataLabelForData(data, value))
          : []),
        ...(mergeDirection === 'inbound_prerequisite'
          ? producedDataRefs.map(ref => ({ value: ref, label: `原外部门行为产生：${dataLabelForData(data, ref)}`, source: '原外部门行为' }))
          : [])
      ]);
      const resumeOptions = mergeDirection === 'outbound_followup'
        ? mergeChoiceOptions('resume_behavior_ref', [
            ...handoffValueCandidates('resume_behavior_ref', value => behaviorLabelForData(data, value)),
            { value: inboundHandoff?.anchor_behavior_ref, label: `已有前置输入：${behaviorLabelForData(data, inboundHandoff?.anchor_behavior_ref)}`, source: '已有前置输入' },
            { value: outgoingResumeRef, label: `原流程后续关系：${behaviorLabelForData(data, outgoingResumeRef)}`, source: '原流程关系' }
          ])
        : [];
      const returnedDataOptions = mergeDirection === 'outbound_followup'
        ? mergeChoiceOptions('returned_data_ref', [
            ...handoffValueCandidates('returned_data_ref', value => dataLabelForData(data, value)),
            { value: inboundHandoff?.transfer_data_ref, label: `已有前置输入：${dataLabelForData(data, inboundHandoff?.transfer_data_ref)}`, source: '已有前置输入' },
            ...producedDataRefs.map(ref => ({ value: ref, label: `原外部门行为产生：${dataLabelForData(data, ref)}`, source: '原外部门行为' }))
          ])
        : [];
      const choices = {
        requested_matter: mergeChoiceOptions('requested_matter', handoffValueCandidates('requested_matter')),
        trigger_condition: mergeChoiceOptions('trigger_condition', handoffValueCandidates('trigger_condition')),
        completion_standard: mergeChoiceOptions('completion_standard', [
          ...handoffValueCandidates('completion_standard'),
          { value: behavior?.completion_standard, label: `原外部门行为：${behavior?.completion_standard}`, source: '原外部门行为' }
        ]),
        counterparty_process_name: mergeChoiceOptions('counterparty_process_name', handoffValueCandidates('counterparty_process_name')),
        transfer_data_ref: transferDataOptions,
        resume_behavior_ref: resumeOptions,
        returned_data_ref: returnedDataOptions
      };
      const conflicts = Object.entries(choices)
        .filter(([, options]) => options.length > 1)
        .map(([field, options]) => ({ field, options }));
      const defaults = Object.fromEntries(Object.entries(choices).map(([field, options]) => [field, options[0]?.value || '']));
      return {
        externalBehaviorRef,
        behavior,
        owner,
        externalDepartment,
        incomingRelations,
        outgoingRelations,
        mergeDirection,
        anchorBehaviorRef,
        senderRef,
        outgoingResumeRef,
        keptHandoff,
        inboundHandoff,
        handoffsToMerge,
        producedDataRefs,
        blockers,
        choices,
        conflicts,
        defaults,
        affectedFormCount: (data?.forms || []).filter(item => item.behavior_ref === externalBehaviorRef).length
      };
    }

    function behaviorLabelForData(data, behaviorRef) {
      const index = (data?.behaviors || []).findIndex(item => item.behavior_ref === behaviorRef);
      if (index < 0) return '位置待确认';
      return `${index + 1}. ${data.behaviors[index].behavior_name || '未命名业务行为'}`;
    }

    function dataLabelForData(data, dataRef) {
      const item = (data?.data_objects || []).find(candidate => candidate.data_ref === dataRef);
      return item?.data_name || '数据待确认';
    }

    function resolvedMergeValue(analysis, selections, field) {
      const options = analysis.choices[field] || [];
      if (options.length <= 1) return options[0]?.value || '';
      const selected = text(selections?.[field]).trim();
      if (!options.some(option => option.value === selected)) {
        throw new Error(`请先确认“${legacyMergeFieldLabel(field)}”采用哪个原值。`);
      }
      return selected;
    }

    function legacyMergeFieldLabel(field) {
      return ({
        counterparty_behavior_name: '承接部门办理动作',
        requested_matter: '需要处理或提供的事项',
        trigger_condition: '触发条件',
        completion_standard: '完成标准',
        counterparty_process_name: '外部门对应流程名称',
        transfer_data_ref: '传递数据',
        resume_behavior_ref: '返回后的恢复位置',
        returned_data_ref: '返回数据'
      })[field] || field;
    }

    function applyLegacyExternalBehaviorMerge(data, analysis, selections = {}) {
      if (analysis.blockers.length) throw new Error(analysis.blockers[0]);
      const next = clone(data);
      const externalBehaviorRef = analysis.externalBehaviorRef;
      const externalBehavior = next.behaviors.find(item => item.behavior_ref === externalBehaviorRef);
      const existingIndex = analysis.keptHandoff
        ? next.cross_department_handoffs.findIndex(item => item.handoff_ref === analysis.keptHandoff.handoff_ref)
        : -1;
      const existing = existingIndex >= 0 ? next.cross_department_handoffs[existingIndex] : null;
      const isInbound = analysis.mergeDirection === 'inbound_prerequisite';
      const transferDataRef = resolvedMergeValue(analysis, selections, 'transfer_data_ref') || null;
      const resumeBehaviorRef = isInbound ? null : (resolvedMergeValue(analysis, selections, 'resume_behavior_ref') || null);
      const returnedDataRef = isInbound ? null : (resolvedMergeValue(analysis, selections, 'returned_data_ref') || null);
      const sourceHandoffs = analysis.handoffsToMerge || [];
      const preservedProcessRef = sourceHandoffs.find(item => item.counterparty_process_ref)?.counterparty_process_ref || null;
      const completionStandard = resolvedMergeValue(analysis, selections, 'completion_standard');
      if (externalBehavior && completionStandard) externalBehavior.completion_standard = completionStandard;
      const handoff = {
        handoff_ref: existing?.handoff_ref || newRef('handoff'),
        handoff_direction: analysis.mergeDirection,
        anchor_behavior_ref: analysis.anchorBehaviorRef,
        counterparty_resolution: 'identified',
        source_department: isInbound ? analysis.externalDepartment : analysis.owner,
        target_department: isInbound ? analysis.owner : analysis.externalDepartment,
        transfer_data_ref: transferDataRef,
        requested_matter: resolvedMergeValue(analysis, selections, 'requested_matter'),
        trigger_condition: resolvedMergeValue(analysis, selections, 'trigger_condition')
          || defaultHandoffTrigger(analysis.mergeDirection, analysis.anchorBehaviorRef, next),
        completion_standard: '',
        counterparty_process_ref: preservedProcessRef,
        counterparty_process_name: resolvedMergeValue(analysis, selections, 'counterparty_process_name'),
        counterparty_behavior_ref: externalBehaviorRef,
        counterparty_behavior_name: '',
        requires_return: isInbound
          ? false
          : Boolean(resumeBehaviorRef || returnedDataRef || sourceHandoffs.some(item => item.requires_return)),
        returned_data_ref: returnedDataRef,
        resume_behavior_ref: resumeBehaviorRef
      };
      const removedHandoffRefs = new Set(sourceHandoffs.map(item => item.handoff_ref));
      next.cross_department_handoffs = next.cross_department_handoffs
        .filter(item => !removedHandoffRefs.has(item.handoff_ref));
      if (existingIndex >= 0) {
        next.cross_department_handoffs.splice(Math.min(existingIndex, next.cross_department_handoffs.length), 0, handoff);
      } else {
        next.cross_department_handoffs.push(handoff);
      }
      next.flow_relations = next.flow_relations.filter(item =>
        item.from_behavior_ref !== externalBehaviorRef && item.to_behavior_ref !== externalBehaviorRef
      );
      return { data: next, handoffRef: handoff.handoff_ref, behaviorRef: externalBehaviorRef };
    }

    function renderLegacyMergeModal() {
      const analysis = legacyMergeState?.analysis;
      if (!analysis) return;
      const isInbound = analysis.mergeDirection === 'inbound_prerequisite';
      const directionLabel = isInbound
        ? '本流程行为开始前，由外部门提供输入'
        : '本流程行为完成后，交给外部门办理';
      const anchorLabel = behaviorLabelForData(currentDocument(), analysis.anchorBehaviorRef);
      const duplicateHandoffCount = Math.max(0, (analysis.handoffsToMerge || []).length - (analysis.keptHandoff ? 1 : 0));
      const handoffHandling = analysis.keptHandoff
        ? `保留并校正1条已有待办${duplicateHandoffCount ? `，删除${duplicateHandoffCount}条重复待办` : ''}`
        : '新建1条跨部门待办';
      const blockerMarkup = analysis.blockers.length
        ? `<div class="inline-warning"><strong>当前不能自动归并：</strong><p>系统无法唯一确定交接方向、关联位置或应保留的记录。为避免误删或错误连接，请先处理以下项目：</p><ul>${analysis.blockers.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ul></div>`
        : '';
      const conflicts = analysis.conflicts.length
        ? `<div class="merge-conflicts"><strong>以下原值不一致，请逐项确认：</strong>${analysis.conflicts.map(conflict => `
            <div class="merge-conflict-field">
              <label for="merge-${escapeAttribute(conflict.field)}">${escapeHtml(legacyMergeFieldLabel(conflict.field))}</label>
              <select id="merge-${escapeAttribute(conflict.field)}" data-legacy-merge-field="${escapeAttribute(conflict.field)}">
                <option value="">请选择保留值</option>
                ${conflict.options.map(option => `<option value="${escapeAttribute(option.value)}"${legacyMergeState.selections[conflict.field] === option.value ? ' selected' : ''}>${escapeHtml(option.label)}</option>`).join('')}
              </select>
            </div>`).join('')}</div>`
        : '<div class="inline-note">检测到的原值没有冲突，确认后可以直接归并。</div>';
      legacyMergeContent.innerHTML = `
        <p>3001只处理当前页面草稿，不修改导入的源文件。归并后保留外部门行为及其执行部门、岗位、表单和数据引用，并用一条跨部门关系连接本流程位置。</p>
        <div class="merge-summary">
          <div class="merge-summary-item"><strong>归并方式：</strong>${escapeHtml(directionLabel)}</div>
          <div class="merge-summary-item"><strong>${isInbound ? '本流程接收行为' : '本部门发起动作'}：</strong>${escapeHtml(anchorLabel)}</div>

          ${isInbound ? '' : `<div class="merge-summary-item"><strong>返回位置：</strong>${escapeHtml(behaviorLabelForData(currentDocument(), analysis.outgoingResumeRef))}</div>`}
          <div class="merge-summary-item"><strong>待办处理：</strong>${escapeHtml(handoffHandling)}</div>

          <div class="merge-summary-item"><strong>将删除：</strong>${analysis.incomingRelations.length + analysis.outgoingRelations.length}条重复的普通流程关系；跨部门方向、数据和返回位置改由保留的跨部门关系表达。</div>
        </div>
        ${blockerMarkup}
        ${analysis.blockers.length ? '' : conflicts}`;
      confirmLegacyMergeButton.disabled = Boolean(
        analysis.blockers.length

      );
    }

    function openLegacyMerge(externalBehaviorRef) {
      const analysis = analyzeLegacyExternalBehavior(currentDocument(), externalBehaviorRef);
      legacyMergeState = { analysis, selections: { ...analysis.defaults } };
      analysis.conflicts.forEach(conflict => {
        legacyMergeState.selections[conflict.field] = '';
      });
      renderLegacyMergeModal();
      legacyMergeModal.classList.add('show');
      legacyMergeModal.setAttribute('aria-hidden', 'false');
    }

    function closeLegacyMerge() {
      legacyMergeState = null;
      legacyMergeModal.classList.remove('show');
      legacyMergeModal.setAttribute('aria-hidden', 'true');
      legacyMergeContent.innerHTML = '';
    }

    async function confirmLegacyMerge() {
      const state = legacyMergeState;
      if (!state || state.analysis.blockers.length) return;
      try {
        const merged = applyLegacyExternalBehaviorMerge(currentDocument(), state.analysis, state.selections);
        await ensureCompatibleValidationService('再次归并');
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: merged.data })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) throw new Error('归并后的技术引用校验未通过，当前草稿未修改。');
        currentEntry().data = merged.data;
        currentEntry().dirty = true;
        activeFlowItemKind = 'behavior';
        activeHandoffRef = merged.handoffRef;
        activeBehaviorRef = merged.behaviorRef;
        closeLegacyMerge();
        render();
        showStatus(
          state.analysis.mergeDirection === 'inbound_prerequisite'
            ? '已归并为一个跨部门行为和一条前置交接关系。源文件未修改；请核对输入数据和本流程接收位置。'
            : '已归并为一个跨部门行为和一条后续交接关系。源文件未修改；请核对传递数据、返回数据和恢复位置。',
          'success'
        );

        showStatus(`归并未执行：${error.message}`, 'error');

    function owningDepartmentChangeNeedsConfirmation(impact) {
      return Boolean(
        impact.fixedAssignments
        || impact.dynamicAssignments
        || impact.handoffCount
        || impact.classificationFields
        || impact.formalWorkRoles
        || impact.internalCallCount
      );
    }

      const previousLabel = impact.previousDepartment || '未填写';
      const nextLabel = impact.nextDepartment || '未填写';
      const preservedReviewItems = [
        impact.formalWorkRoles ? `${impact.formalWorkRoles}个正式工作角色` : '',
        impact.internalCallCount ? `${impact.internalCallCount}条历史部门内调用` : ''
      ].filter(Boolean);
      const actorResetItems = [

        impact.dynamicAssignments ? `将${impact.dynamicAssignments}个动态责任部门设置恢复为“固定部门和岗位—未选择”` : ''

          : '',
        impact.classificationFields ? '回到“基本信息”重新确认能力域、业务能力和归类状态' : '',
        preservedReviewItems.length ? `在后续审核中重新确认${preservedReviewItems.join('和')}是否仍适用` : ''
      ].filter(Boolean);
      owningDepartmentChangeContent.innerHTML = `

        <div class="merge-summary">
          ${actorResetMarkup}
          ${handoffResetMarkup}
          ${classificationResetMarkup}
          <div class="merge-summary-item"><strong>保持不变：</strong>${impact.companyWideAssignments ? `${impact.companyWideAssignments}个“全公司通用”行为、` : ''}业务行为名称和说明、流程关系、输出物与数据、表单、技术标识${preservedReviewItems.length ? `，以及${preservedReviewItems.join('和')}` : ''}。</div>
        </div>
        ${preservedReviewItems.length ? `<div class="inline-warning" style="margin-top:14px">${escapeHtml(preservedReviewItems.join('和'))}不会被页面改写。归口部门变更后，请在后续审核中重新确认这些保留内容是否仍适用。</div>` : ''}
        <div class="inline-warning" style="margin-top:14px"><strong>确认后需要重新梳理：</strong>${escapeHtml(followupItems.join('；'))}。页面刷新或关闭后无法恢复本次重置前的内容；需要留存时，请先导出当前草稿。</div>
        <div id="owningDepartmentChangeError" class="inline-warning" style="margin-top:14px;display:none" role="alert"></div>`;
