    function openGraphUpdateFields(invoker = null, onConfirm = null) {
      const edgeValues = dataEdgeWorkingValues();
      if (graphSelection?.kind !== 'data-edge' || !edgeValues.operations.includes('update')) return;
      const dataObject = currentDocument()?.data_objects?.find(item => item.data_ref === graphSelection.dataRef);
      if (!dataObject) return;
      const candidateKey = candidateStateKey();
      const selection = { dataRef: graphSelection.dataRef, behaviorRef: graphSelection.behaviorRef };
      const session = dataEdgeSession(graphSelection);
      if (!session) return;
      const sessionFingerprint = globalThis.GraphEditorState.fingerprint(session);
      const invokerAction = text(invoker?.dataset?.action);
      const restoreUpdateFieldsFocus = () => {
        requestAnimationFrame(() => {
          let target = null;
          if (invokerAction === 'open-update-fields') {
            const dataIndex = (currentDocument()?.data_objects || []).findIndex(item => item.data_ref === selection.dataRef);
            const linkIndex = dataIndex >= 0
              ? (currentDocument().data_objects[dataIndex].behavior_links || []).findIndex(item => item.behavior_ref === selection.behaviorRef)
              : -1;
            if (dataIndex >= 0 && linkIndex >= 0) {
              target = workspace.querySelector(`[data-action="open-update-fields"][data-data-index="${dataIndex}"][data-index="${linkIndex}"]`);
            }
          }
          if (!target) target = workspace.querySelector('[data-action="open-graph-update-fields"]');
          target?.scrollIntoView({ block: 'nearest' });
          target?.focus({ preventScroll: true });
        });
      };
      openUpdateFieldsModal({
        dataRef: dataObject.data_ref,
        dataName: dataObject.data_name,
        selectedRefs: edgeValues.updatedFieldRefs,
        invoker,
        isCurrent() {
          const liveSession = dataEdgeSession();
          return candidateStateKey() === candidateKey
            && graphSelection?.kind === 'data-edge'
            && graphSelection.dataRef === selection.dataRef
            && graphSelection.behaviorRef === selection.behaviorRef
            && Boolean(liveSession)
            && globalThis.GraphEditorState.fingerprint(liveSession) === sessionFingerprint;
        },
        onConfirm(selectedRefs) {
          editSessionManager.updatePatch({ updatedFieldRefs: selectedRefs });
          updateDataEdgeCanApply();
          refreshUnappliedIndicators();
          if (typeof onConfirm === 'function') {
            Promise.resolve()
              .then(() => onConfirm(selectedRefs))
              .catch(error => showStatus(`更新字段未能应用：${error.message}`, 'error'))
              .finally(restoreUpdateFieldsFocus);
            return;
          }
          render();
          restoreUpdateFieldsFocus();
        },
        onCancel() {
          render();
          restoreUpdateFieldsFocus();
        }
      });
    }

    async function applyGraphDataOperations(updatedFieldRefs = null) {
      if (graphSelection?.kind !== 'data-edge') {
        showStatus('当前没有可应用的数据操作修改。', 'error');
        return false;
      }
      if (updatedFieldRefs) editSessionManager.updatePatch({ updatedFieldRefs });
      const session = dataEdgeSession();
      if (!session) {
        showStatus('当前数据操作编辑状态已经失效，请重新选择数据关系。', 'error');
        return false;
      }
      const workingValues = dataEdgeWorkingValues();
      if (!workingValues.operations.length) {
        editSessionManager.setCanApply(false);
        showStatus('请至少选择一种数据操作，再应用修改。', 'error');
        return false;
      }
      if (workingValues.operations.includes('update') && !list(workingValues.updatedFieldRefs).length) {
        editSessionManager.setCanApply(false);
        showStatus('选择“更新”时，必须先选择本次实际改变的字段。', 'error');
        return false;
      }
      const currentValues = dataEdgeValues(graphSelection.dataRef, graphSelection.behaviorRef);
      const merged = editSessionManager.mergeCurrentEntity(currentValues);
      if (!merged.ok) {
        showStatus(graphPropertyConflictMessage(merged), 'error');
        return false;
      }
      if (!merged.changedFields.length) {
        editSessionManager.reset();
        openDataEdgeSession(graphSelection.dataRef, graphSelection.behaviorRef);
        refreshUnappliedIndicators();
        showStatus('数据操作没有产生变化，无需应用。', 'success');
        return true;
      }
      if (merged.mergedEntity.operations.includes('update') && !list(merged.mergedEntity.updatedFieldRefs).length) {
        editSessionManager.setCanApply(false);
        showStatus('选择“更新”时，必须先选择本次实际改变的字段。', 'error');
        return false;
      }
      const dataRef = graphSelection.dataRef;
      const behaviorRef = graphSelection.behaviorRef;
      const applied = await runGraphCommand({
        type: 'set_data_operations',
        dataRef,
        behaviorRef,
        operations: merged.mergedEntity.operations || [],
        updatedFieldRefs: list(merged.mergedEntity.updatedFieldRefs),
        refFactory: () => newRef('data_link')
      }, {
        successLabel: merged.mergedEntity.operations?.length ? '数据关系已更新' : '数据关系已删除',
        resetEditSessionOnSuccess: true
      });
      if (applied) {
        editSessionManager.reset();
        openDataEdgeSession(dataRef, behaviorRef);
        refreshUnappliedIndicators();
      }
      return applied;
    }

    const PENDING_GUARDED_ACTIONS = new Set([
      'switch-step-view', 'switch-data-editing-mode', 'switch-data-mode',
      'start-new-process', 'open-import-file', 'clear-current-page', 'download-current-stage', 'export-current',
      'open-help-view', 'open-version-view', 'choose-data-start', 'choose-form-start',
      'select-skeleton-item', 'governance-jump', 'switch-tab', 'return-editor',
      'focus-editor', 'focus-export-warning', 'undo-graph', 'redo-graph',
      'add-graph-node', 'start-flow-relation', 'add-graph-data', 'merge-current-data',
      'cancel-flow-relation', 'close-flow-editor',
      'choose-data-behavior', 'delete-graph-selection', 'delete-graph-data-edge', 'open-flow-behavior', 'delete-data-object',
      'open-behavior-data', 'open-data-from-overview', 'merge-duplicate-data',
      'add-data-behavior-link', 'remove-data-behavior-link', 'add-data-source', 'remove-data-source',
      'add-data-field', 'remove-data-field', 'add-form-behavior-link', 'remove-form-behavior-link',
      'add-field-source', 'remove-field-source', 'switch-editor-section', 'switch-process-section',
      'select-behavior', 'select-relation', 'select-data', 'select-data-field', 'select-form', 'select-area',
      'add-behavior', 'remove-behavior', 'add-relation', 'remove-relation', 'add-data', 'remove-data',
      'add-current-form', 'add-proposed-form', 'remove-form', 'remove-detail-area',
      'open-form-field-batch', 'edit-data-field-definition', 'remove-form-item', 'add-term', 'remove-term'
    ]);

    function handleAction(action, element, options = {}) {
      const index = Number(element.dataset.index);
      const formIndex = Number(element.dataset.formIndex);
      const areaIndex = Number(element.dataset.areaIndex);
      let nextFocusPath = '';
      if (pendingTransitionResolution) {
        showStatus('正在处理未应用修改，请等待本次处理完成。', 'error');
        return;
      }
      if (webGridApplyInFlight) {
        showStatus('表格修改正在检查，请等待本次检查完成后再执行其他操作。', 'error');
        return;
      }
      if (formFieldBatchApplying) {
        showStatus('批量字段正在检查，请等待本次检查完成后再执行其他操作。', 'error');
        return;
      }
      if (blockWebGridCompositionTransition()) return;
      if (!options.skipPendingGuard && PENDING_GUARDED_ACTIONS.has(action) && requestTransition(
        '继续当前操作',
        () => handleAction(action, element, { skipPendingGuard: true }),
        { invoker: element }
      )) return;
      if (action === 'switch-governance-step') return setActiveGovernanceStep(element.dataset.step);
      if (action === 'check-governance-step') {
        const stepId = globalThis.GovernanceWorkflow.normalizeStepId(element.dataset.step);
        if (!currentDocument()) return;
        activeGovernanceStep = stepId;
        if (!runGovernanceQueueCheck()) return;
        render();
        requestAnimationFrame(() => workspace.querySelector('.governance-queue, .step-check-clear')?.focus?.());
        return;
      }
      if (action === 'governance-queue-previous' || action === 'governance-queue-next' || action === 'governance-queue-skip') {
        const key = candidateStateKey();
        if (action === 'governance-queue-previous') governanceReviewQueueManager.previous(key);
        if (action === 'governance-queue-next') governanceReviewQueueManager.next(key);
        if (action === 'governance-queue-skip') governanceReviewQueueManager.skipCurrent(key);
        render();
        focusCurrentGovernanceQueueIssue();
        return;
      }
      if (action === 'governance-queue-recheck-next') {
        if (!runGovernanceQueueCheck({ moveNext: true })) return;
        render();
        focusCurrentGovernanceQueueIssue();
        return;
      }
      if (action === 'switch-step-view') {
        editSessionManager.reset();
        graphSelection = null;
        flowEditorOpen = false;
        activeStepView = text(element.dataset.view) || defaultStepView(activeGovernanceStep);
        if (activeGovernanceStep === 'skeleton') diagramExpanded = false;
        if (currentEntry()) currentEntry().stepView = activeStepView;
        return render();
      }
      if (action === 'switch-data-editing-mode') return requestDataEditingMode(element.dataset.mode);
      if (action === 'switch-grid-workspace') {
        const nextWorkspace = element.dataset.workspace === 'forms' ? 'forms' : 'data';
        const tableId = activeGridTableByWorkspace[nextWorkspace] || globalThis.AuthoringSelectionContext.DEFAULT_TABLES[nextWorkspace];
        updateAuthoringSelection({
          workspace: nextWorkspace,
          tableId
        });
        render();
        requestAnimationFrame(() => restoreWebGridTableView(tableId, { focus: true }));
        return;
      }
      if (action === 'switch-grid-table') {
        const tableId = text(element.dataset.tableId);
        if (!GRID_TABLES_BY_WORKSPACE[activeGridWorkspace].includes(tableId)) return;
        activeGridTableByWorkspace[activeGridWorkspace] = tableId;
        updateAuthoringSelection({ tableId });
        render();
        requestAnimationFrame(() => restoreWebGridTableView(tableId, { focus: true }));
        return;
      }
      if (action === 'grid-sort') {
        const tableId = element.dataset.tableId;
        const column = element.dataset.column;
        const current = webGridSorts[tableId];
        if (!current || current.column !== column) webGridSorts[tableId] = { column, direction: 'asc' };
        else if (current.direction === 'asc') webGridSorts[tableId] = { column, direction: 'desc' };
        else delete webGridSorts[tableId];
        refreshNativeGridPanel(tableId);
        requestAnimationFrame(() => {
          workspace.querySelector(`[data-action="grid-sort"][data-table-id="${CSS.escape(tableId)}"][data-column="${CSS.escape(column)}"]`)?.focus({ preventScroll: true });
        });
        return;
      }
      if (action === 'grid-add-row') return addGridRow(element.dataset.tableId);
      if (action === 'open-grid-update-fields') return openGridUpdateFields(element.dataset.rowId, element);
      if (action === 'grid-duplicate-row') {
        const tableId = element.dataset.tableId;
        const rowId = webGridSelectedRows[tableId];
        const sourceRow = webGridSession?.rows(tableId).find(row => row._row_id === rowId && !row._deleted);
        if (!sourceRow) return;
        return addGridRow(tableId, { sourceRow });
      }
      if (action === 'grid-delete-row') {
        const tableId = element.dataset.tableId;
        const rowId = webGridSelectedRows[tableId];
        if (!rowId) return;
        const row = webGridSession.rows(tableId).find(item => item._row_id === rowId);
        if (!row) return;
        if (row._deleted) webGridSession.setDeleted(tableId, rowId, false);
        else if (window.confirm(`确定将选中的${webGridSession.definition(tableId).label}标记为删除吗？应用前系统会检查引用。`)) webGridSession.setDeleted(tableId, rowId, true);
        webGridIssues = [];
        render();
        requestAnimationFrame(() => workspace.querySelector(`[data-action="grid-delete-row"][data-table-id="${CSS.escape(tableId)}"]`)?.focus({ preventScroll: true }));
        return;
      }
      if (action === 'grid-move-row-up' || action === 'grid-move-row-down') {
        const tableId = element.dataset.tableId;
        const rowId = webGridSelectedRows[tableId];
        if (!rowId) return;
        webGridSession.moveRow(tableId, rowId, action === 'grid-move-row-up' ? -1 : 1);
        webGridIssues = [];
        render();
        requestAnimationFrame(() => workspace.querySelector(`[data-action="${CSS.escape(action)}"][data-table-id="${CSS.escape(tableId)}"]`)?.focus({ preventScroll: true }));
        return;
      }
      if (action === 'discard-web-grid') return discardWebGridChanges();
      if (action === 'apply-web-grid') return applyWebGridChanges();
      if (action === 'focus-grid-issue') {
        const target = {
          gridTableId: element.dataset.tableId,
          gridRowId: element.dataset.rowId,
          gridRowRef: element.dataset.gridRowRef,
          gridRefKey: element.dataset.gridRefKey,
          gridColumn: element.dataset.column,
          editorSection: element.dataset.editorSection,
          processSection: element.dataset.processSection,
          focusKind: element.dataset.focusKind,
          focusRef: element.dataset.focusRef,
          focusPath: element.dataset.focusPath,
          dataRef: element.dataset.dataRef,
          dataFieldRef: element.dataset.dataFieldRef,
          formRef: element.dataset.formRef,
          areaRef: element.dataset.areaRef,
          formItemRef: element.dataset.formItemRef
        };
        if (target.gridTableId && focusGridEditorTarget(target)) return;
        activeDataEditingMode = 'guided';
        focusEditorTarget(target);
        return;
      }
      if (action === 'open-update-fields') return openGuidedUpdateFields(Number(element.dataset.dataIndex), index, element);
      if (action === 'open-graph-update-fields') return openGraphUpdateFields(element);
      if (action === 'switch-data-mode') {
        activeDataMode = text(element.dataset.mode) === 'lifecycle' ? 'lifecycle' : 'flow';
        editSessionManager.reset();
        graphSelection = null;
        if (activeDataMode === 'flow') {
          const dataObject = ensureActiveGraphDataObject();
          if (dataObject) openEntityEditSession('data', dataObject.data_ref);
        }
        return render();
      }
      if (action === 'start-new-process') {
        if (webGridSession?.isDirty()) return requestTransition('新建流程', () => protect(startNewProcess));
        return protect(startNewProcess);
      }
      if (action === 'open-import-file') {
        if (webGridSession?.isDirty()) return requestTransition('导入文件', () => protect(() => jsonInput.click()));
        return protect(() => jsonInput.click());
      }
      if (action === 'clear-current-page') {
        if (webGridSession?.isDirty()) return requestTransition('清空页面', () => protect(clearPage));
        return protect(clearPage);
      }
      if (action === 'download-current-stage') {
        const download = () => exportCurrent({
          stage: globalThis.GovernanceWorkflow.stageForStep(activeGovernanceStep),
          skipBusinessConfirm: activeGovernanceStep !== 'handoff'
        });
        if (webGridSession?.isDirty()) return requestTransition('下载文件', download);
        return download();
      }
      if (action === 'open-governance-drawer') {
        renderGovernanceDrawer();
        governanceDrawer.classList.add('show');
        governanceDrawer.setAttribute('aria-hidden', 'false');
        return;
      }
      if (action === 'toggle-advanced-lifecycle') {
        if (!advancedLifecycleMode) {
          const confirmed = window.confirm('高级结构核对会显示触发条件、作用范围、责任和异常处理。它只在当前页面临时开启，刷新后自动关闭，也不参加普通评分。确认开启吗？');
          if (!confirmed) return;
        }
        advancedLifecycleMode = !advancedLifecycleMode;
        render();
        return;
      }
      if (action === 'close-governance-drawer') {
        governanceDrawer.classList.remove('show');
        governanceDrawer.setAttribute('aria-hidden', 'true');
        return;
      }
      if (action === 'open-help-view') return setActiveGovernanceStep('start', 'help');
      if (action === 'open-version-view') return setActiveGovernanceStep('start', 'version');
      if (action === 'choose-data-start') {
        if (!(currentDocument()?.data_objects || []).length) {
          addDataObject();
          touch();
        }
        activeStepView = 'data';
        activeWorkspaceTab = 'data';
        const dataObject = ensureActiveGraphDataObject();
        if (dataObject) openEntityEditSession('data', dataObject.data_ref);
        return render();
      }
      if (action === 'choose-form-start') {
        if (!(currentDocument()?.data_objects || []).length) {
          addDataObject();
          touch();
        }
        activeStepView = 'forms';
        activeWorkspaceTab = 'editor';
        activeEditorSection = 'forms';
        return render();
      }
      if (action === 'select-skeleton-item') {
        const kind = text(element.dataset.kind);
        const ref = text(element.dataset.ref);
        if (kind === 'behavior') {
          openEntityEditSession('behavior', ref);
        } else if (kind === 'relation') {
          openEntityEditSession('relation', ref);
        }
        flowEditorOpen = true;
        return render();
      }
      if (action === 'close-flow-editor') {
        if (flowRelationDraft) {
          flowRelationDraft = null;
          editSessionManager.discard();
        } else {
          editSessionManager.reset();
        }
        flowEditorOpen = false;
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'governance-jump') return navigateToGovernanceTarget(element);
      if (action === 'copy-handoff-summary') return copyLastHandoffSummary();
      if (action === 'switch-tab') return setActiveWorkspaceTab(element.dataset.tab);
      if (action === 'return-editor') {
        activeEditorSection = 'process';
        return setActiveWorkspaceTab('editor');
      }
      if (action === 'fit-review-pattern') return reviewPatternViews.get(text(element.dataset.patternId))?.fit();
      if (action === 'reset-review-pattern') return reviewPatternViews.get(text(element.dataset.patternId))?.reset();
      if (action === 'toggle-review-pattern-expanded') {
        const patternId = text(element.dataset.patternId);
        expandedReviewPatternId = expandedReviewPatternId === patternId ? '' : patternId;
        return render();
      }
      if (action === 'fit-diagram') return diagramView?.fit();
      if (action === 'reset-diagram') return diagramView?.reset();
      if (action === 'toggle-diagram-example') {
        diagramExampleExpanded = !diagramExampleExpanded;
        if (!diagramExampleExpanded) {
          legendPatternGuideExpanded = false;
          expandedReviewPatternId = '';
        }
        return render();
      }
      if (action === 'toggle-diagram-expanded') {
        captureGraphViewport();
        diagramExpanded = !diagramExpanded;
        return render();
      }
      if (action === 'focus-editor') return focusEditorItem(element.dataset.focusKind, element.dataset.focusRef);
      if (action === 'focus-export-warning') return focusExportWarning(element);
      if (action === 'refresh-structure-score') {
        structureScoreRunId += 1;
        const queueKey = candidateStateKey();
        if (queueKey && governanceReviewQueueManager.get(queueKey).checkedAtRevision != null) {
          governanceReviewQueueManager.markStale(queueKey, {
            revision: globalThis.GraphEditorState.fingerprint(currentDocument())
          });
        }
        structureScoreState = {
          status: 'idle',
          candidateIndex: -1,
          documentKey: '',
          result: null,
          message: ''
        };
        return render();
      }
      if (!currentDocument()) return;
      if (action === 'reanalyze-current-lifecycle') {
        return reanalyzeLifecycle('current');
      }
      if (action === 'reanalyze-all-lifecycle') {
        return reanalyzeLifecycle('all');
      }
      if (action === 'supplement-data-facts') {
        activeDataMode = 'flow';
        const dataObject = ensureActiveGraphDataObject();
        if (dataObject) openEntityEditSession('data', dataObject.data_ref);
        return render();
      }
      if (action === 'fit-flow-diagram') {
        diagramView?.fit();
        captureGraphViewport();
        return;
      }
      if (action === 'reset-flow-diagram') {
        graphStateManager.resetView(candidateStateKey(), 'flow');
        diagramView?.reset();
        captureGraphViewport();
        return;
      }
      if (action === 'fit-data-diagram') {
        dataDiagramView?.fit();
        captureGraphViewport();
        return;
      }
      if (action === 'reset-data-diagram') {
        graphStateManager.resetView(candidateStateKey(), 'data');
        dataDiagramView?.reset();
        captureGraphViewport();
        return;
      }
      if (action === 'undo-graph') return applyGraphHistory('undo');
      if (action === 'redo-graph') return applyGraphHistory('redo');
      if (action === 'add-graph-node') {
        flowEditorOpen = true;
        return runGraphCommand({ type: 'add_behavior', behavior: newGraphBehavior() }, { successLabel: '已新增业务行为节点' });
      }
      if (action === 'start-flow-relation') {
        openFlowRelationDraftSession();
        flowEditorOpen = true;
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'cancel-flow-relation') {
        flowRelationDraft = null;
        editSessionManager.discard();
        flowEditorOpen = false;
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'select-relation-endpoint') {
        if (!flowRelationDraft || !['source', 'target'].includes(flowRelationDraft.stage)) return;
        const ref = text(element.dataset.ref);
        if (flowRelationDraft.stage === 'source') {
          flowRelationDraft.from_behavior_ref = ref;
          flowRelationDraft.stage = 'target';
        } else {
          flowRelationDraft.to_behavior_ref = ref;
          flowRelationDraft.stage = 'confirm';
        }
        syncFlowRelationDraftSession();
        return render();
      }
      if (action === 'confirm-flow-relation') {
        return confirmFlowRelationDraft();
      }
      if (action === 'apply-flow-property') return applyGraphPropertyDraft();
      if (action === 'delete-graph-selection') {
        if (!graphSelection || !['behavior', 'relation'].includes(graphSelection.kind)) return;
        return deleteGraphObject(graphSelection.kind, graphSelection.ref);
      }
      if (action === 'add-graph-data') {
        return runGraphCommand({ type: 'add_data_object', dataObject: newGraphDataObject() }, { successLabel: '已新增数据对象' });
      }
      if (action === 'merge-current-data') return mergeCurrentDataObjects();
      if (action === 'choose-data-behavior') {
        openDataBehaviorChoiceSession(activeDataRef);
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'cancel-data-relation') {
        const item = ensureActiveGraphDataObject();
        editSessionManager.discard();
        graphSelection = null;
        if (item) openEntityEditSession('data', item.data_ref);
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'continue-data-relation') {
        const choiceSession = editSessionManager.get({
          candidateKey: candidateStateKey(),
          editorKind: 'data-behavior-choice',
          entityRef: activeDataRef
        });
        const behaviorRef = text(choiceSession?.patch?.behaviorRef);
        if (!behaviorRef) return;
        const dataObject = ensureActiveGraphDataObject();
        editSessionManager.discard();
        openDataEdgeSession(dataObject.data_ref, behaviorRef);
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'apply-data-operations') {
        if (graphSelection?.kind !== 'data-edge') return;
        const workingValues = dataEdgeWorkingValues();
        if (workingValues.operations.includes('update') && !workingValues.updatedFieldRefs.length) {
          return openGraphUpdateFields(element, selectedRefs => applyGraphDataOperations(selectedRefs));
        }
        return applyGraphDataOperations();
      }
      if (action === 'delete-graph-data-edge') {
        return deleteDataEdgeByRefs(text(element.dataset.dataRef), text(element.dataset.behaviorRef));
      }
      if (action === 'apply-data-property') {
        return applyDataObjectPropertyDraft();
      }
      if (action === 'open-flow-behavior') {
        const ref = text(element.dataset.ref);
        openEntityEditSession('behavior', ref);
        return setActiveGovernanceStep('skeleton', 'diagram');
      }
      if (action === 'delete-data-object') return deleteGraphObject('data', activeDataRef);
      if (action === 'focus-legacy-diagnostic') return focusExportWarning(element);
      if (action === 'open-behavior-data') {
        const behaviorRef = text(element.dataset.ref);
        const related = currentDataFlowDetails().dataDetails.find(detail =>
          detail.producerRefs.includes(behaviorRef)
          || detail.consumerRefs.includes(behaviorRef)
          || detail.availabilityStarts.includes(behaviorRef)
          || currentDocument().behaviors.find(item => item.behavior_ref === behaviorRef)?.actor_department_data_ref === detail.dataRef
        );
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        if (related) activeDataRef = related.dataRef;
        return setActiveGovernanceStep('data', 'data');
      }
      if (action === 'open-data-from-overview') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = text(element.dataset.ref);
        return setActiveGovernanceStep('data', 'data');
      }
      if (action === 'merge-duplicate-data') return mergeDuplicateData(index);
      if (action === 'add-data-behavior-link') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        const hasBehavior = currentDocument().behaviors.some(item => item.node_type === 'action');
        if (!dataObject || !hasBehavior) {
          window.alert('请先添加至少一个业务行为，再登记数据关系。');
          return;
        }
        openGuidedCreateSession('new-data-behavior-link', dataObject.data_ref, { behaviorRef: '' });
        return render();
      }
      if (action === 'apply-new-data-behavior-link') return applyGuidedCreateSession('new-data-behavior-link');
      if (action === 'remove-data-behavior-link') {
        return deleteDataBehaviorLink(Number(element.dataset.dataIndex), index);
      }
      if (action === 'add-data-source') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        if (!dataObject) return;
        dataObject.source_relations.push({
          source_ref: newRef('data_source'),
          source_department: '',
          source_process_name: '',
          source_behavior_name: '',
          source_data_name: '',
          availability_mode: 'pending_confirmation',
          available_from_behavior_ref: null
        });
        touch();
        return render();
      }
      if (action === 'remove-data-source') {
        return deleteDataSourceRelation(Number(element.dataset.dataIndex), index);
      }
      if (action === 'add-data-field') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        if (!dataObject) return;
        if (!Array.isArray(dataObject.fields)) dataObject.fields = [];
        const dataField = { field_ref: newRef('data_field'), field_name: '', field_type: '', definition: '' };
        dataObject.fields.push(dataField);
        activeDataFieldRef = dataField.field_ref;
        touch();
        return render();
      }
      if (action === 'remove-data-field') {
        return deleteDataField(Number(element.dataset.dataIndex), index);
      }
      if (action === 'add-form-behavior-link') {
        const form = currentDocument().forms[formIndex];
        const hasBehavior = currentDocument().behaviors.some(item => item.node_type === 'action');
        if (!form || !hasBehavior) {
          window.alert('请先添加至少一个业务行为，再登记表单处理关系。');
          return;
        }
        openGuidedCreateSession('new-form-behavior-link', form.form_ref, { behaviorRef: '' });
        return render();
      }
      if (action === 'apply-new-form-behavior-link') return applyGuidedCreateSession('new-form-behavior-link');
      if (action === 'remove-form-behavior-link') {
        return deleteFormBehaviorLink(formIndex, index);
      }
      if (action === 'edit-field-relations') {
        activeFormItemRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'close-field-relations') {
        activeFormItemRef = '';
        return render();
      }
      if (action === 'add-field-source') {
        const formItem = currentDocument().forms[formIndex]?.areas[areaIndex]?.items[Number(element.dataset.itemIndex)];
        if (!formItem) return;
        openGuidedCreateSession('new-field-source', formItem.item_ref, {
          sourceType: '', sourceDataRef: null, sourceSystemName: '', sourceDataName: '', sourceRole: ''
        });
        return render();
      }
      if (action === 'apply-new-field-source') return applyGuidedCreateSession('new-field-source');
      if (action === 'cancel-guided-create') {
        editSessionManager.discard();
        refreshUnappliedIndicators();
        return render();
      }
      if (action === 'remove-field-source') {
        return deleteFieldSource(formIndex, areaIndex, Number(element.dataset.itemIndex), index);
      }
      if (action === 'switch-editor-section') {
        activeEditorSection = EDITOR_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'basic';
        return render();
      }
      if (action === 'switch-process-section') {
        activeProcessSection = PROCESS_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'behaviors';
        return render();
      }
      if (action === 'select-behavior') {
        activeFlowItemKind = 'behavior';
        activeBehaviorRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-relation') {
        activeRelationRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-data') {
        updateAuthoringSelection({ dataRef: text(element.dataset.ref) });
        return render();
      }
      if (action === 'select-data-field') {
        const fieldRef = text(element.dataset.ref);
        updateAuthoringSelection({ dataFieldRef: fieldRef });
        render();
        requestAnimationFrame(() => {
          const target = workspace.querySelector(`[data-action="select-data-field"][data-ref="${CSS.escape(fieldRef)}"]`);
          target?.focus({ preventScroll: true });
        });
        return;
      }
      if (action === 'select-term') {
        activeTermRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-form') {
        updateAuthoringSelection({ formRef: text(element.dataset.ref) });
        return render();
      }
      if (action === 'select-area') {
        updateAuthoringSelection({ areaRef: text(element.dataset.ref) });
        return render();
      }
      if (action === 'open-form-field-batch') return openFormFieldBatch(formIndex, element.dataset.mode, element);
      if (action === 'edit-data-field-definition') {
        const dataRef = text(element.dataset.dataRef);
        const fieldRef = text(element.dataset.fieldRef);
        const dataObject = (currentDocument().data_objects || []).find(item => item.data_ref === dataRef);
        const dataIndex = (currentDocument().data_objects || []).findIndex(item => item.data_ref === dataRef);
        const fieldIndex = (dataObject?.fields || []).findIndex(item => item.field_ref === fieldRef);
        if (!dataObject || (fieldRef && fieldIndex < 0)) {
          showStatus('对象或对象字段已经不存在，当前没有修改任何内容。', 'error');
          return;
        }
        activeStepView = 'data';
        activeDataMode = 'flow';
        updateAuthoringSelection({ mode: 'guided', workspace: 'data', dataRef, dataFieldRef: fieldRef });
        openEntityEditSession('data', dataRef, { focusTarget: fieldRef ? { fieldRef } : null });
        render();
        requestAnimationFrame(() => {
          const target = fieldRef
            ? workspace.querySelector(`[data-bind="${CSS.escape(`data_objects.${dataIndex}.fields.${fieldIndex}.field_name`)}"]`)
            : workspace.querySelector('[data-graph-data-property="data_name"]');
          target?.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target?.focus({ preventScroll: true });
        });
        return;
      }
      if (action === 'export-current') {
        const download = () => exportCurrent({
          stage: globalThis.GovernanceWorkflow.stageForStep('handoff'),
          skipBusinessConfirm: false
        });
        if (webGridSession?.isDirty()) return requestTransition('下载文件', download);
        return download();
      }
      if (action === 'add-behavior') addBehavior();
      if (action === 'remove-behavior') return removeBehavior(index);
      if (action === 'add-relation') addRelation();
      if (action === 'remove-relation') return removeRelation(index);
      if (action === 'add-data') addDataObject();
      if (action === 'remove-data') return removeData(index);
      if (action === 'add-current-form') addForm('current_state');
      if (action === 'add-proposed-form') addForm('proposed_design');
      if (action === 'remove-form') {
        return deleteFormByIndex(index);
      }
      if (action === 'move-detail-area-up' && !moveDetailArea(formIndex, index, -1)) return;
      if (action === 'move-detail-area-down' && !moveDetailArea(formIndex, index, 1)) return;
      if (action === 'remove-detail-area') return removeDetailArea(formIndex, index);
      if (action === 'move-form-item-up' && !moveFormItem(formIndex, areaIndex, index, -1)) return;
      if (action === 'move-form-item-down' && !moveFormItem(formIndex, areaIndex, index, 1)) return;
      if (action === 'remove-form-item') {
        return deleteFormItem(formIndex, areaIndex, index);
      }
      if (action === 'add-term') addTerm();
      if (action === 'remove-term') return removeTerm(index);
      touch();
      render();
      if (nextFocusPath) {
        requestAnimationFrame(() => {
          const control = Array.from(workspace.querySelectorAll('[data-bind]')).find(item => item.dataset.bind === nextFocusPath);
          if (!control) return;
          control.focus({ preventScroll: true });
          control.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }
    }

    function businessWarnings(data) {
      const warnings = [];
      const defaultSuggestions = target => {
        if (target.focusPath) return ['点击本项返回对应位置，补充并核对页面高亮的字段。'];
        if (Array.isArray(target.focusPaths) && target.focusPaths.length) {
          return ['点击本项返回对应位置，逐项核对页面高亮的字段。'];
        }
        return ['点击本项返回对应页面，核对并补充相关内容。'];
      };
      const addWarning = (message, target = {}, suggestions = []) => {
        const normalizedSuggestions = (Array.isArray(suggestions) ? suggestions : [suggestions])
          .map(text)
          .filter(Boolean);
        warnings.push({
          message,
          suggestions: normalizedSuggestions.length ? normalizedSuggestions : defaultSuggestions(target),
          ...target
        });
      };
      const need = (value, message, target = {}, suggestions = []) => {
        if (!text(value).trim()) addWarning(message, target, suggestions);
      };
      const atField = (target, focusPath) => ({ ...target, focusPath });
      const atFields = (target, focusPaths) => ({ ...target, focusPaths });
      need(data.export_meta.initiating_department, '未填写发起部门', {
        editorSection: 'basic',
        focusPath: 'export_meta.initiating_department'
      });
      need(data.export_meta.compiler, '未填写编制人', {
        editorSection: 'basic',
        focusPath: 'export_meta.compiler'
      });
      need(data.process.process_name, '未填写流程名称', {
        editorSection: 'basic',
        focusPath: 'process.process_name'
      });
      need(data.process.owning_department, '未填写归口部门', {
        editorSection: 'basic',
        focusPath: 'process.owning_department'
      });
      need(data.process.purpose, '未填写流程目的', {
        editorSection: 'profile',
        focusPath: 'process.purpose'
      });
      need(data.process.scope, '未填写适用范围', {
        editorSection: 'profile',
        focusPath: 'process.scope'
      });
      if (!data.behaviors.length) {
        addWarning('尚未添加流程节点', {
          editorSection: 'process',
          processSection: 'behaviors'
        });
      }
      const owningDepartment = text(data.process.owning_department).trim();
      const dataFlowDetails = globalThis.StructureLearningScore?.dataFlowConsistencyDetails?.(data);
      data.behaviors.forEach((item, index) => {
        const label = item.behavior_name || `第${index + 1}项行为`;
        const behaviorTarget = {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: item.behavior_ref
        };
        const isControlNode = ['decision', 'parallel_split', 'parallel_join'].includes(item.node_type);
        const assignmentMode = actorAssignmentMode(item);
        const actorTarget = atField(
          behaviorTarget,
          assignmentMode === 'dynamic_from_data'
            ? `behaviors.${index}.actor_department_data_ref`
            : assignmentMode === 'company_wide'
              ? `behaviors.${index}.actor_assignment_mode`
              : `behaviors.${index}.current_actor_role`
        );
        need(item.node_type, `${label}未选择节点类型`, atField(behaviorTarget, `behaviors.${index}.node_type`));
        need(item.behavior_name, `第${index + 1}项行为未填写名称`, atField(behaviorTarget, `behaviors.${index}.behavior_name`));
        const nameReview = globalThis.StructureLearningScore?.behaviorNameCompleteness?.(item);
        if (item.node_type === 'action' && text(item.behavior_name).trim() && nameReview && !nameReview.complete) {
          addWarning(
            `${label}的名称没有写清谁对什么做什么。`,
            atField(behaviorTarget, `behaviors.${index}.behavior_name`),
            ['补齐主体、动作和对象，例如“编制人员编制产品制造大纲”。']
          );
        }
        if (!isControlNode && assignmentMode === 'dynamic_from_data') {
          if (!item.actor_department_data_ref) {
            addWarning(`${label}未选择用于确定执行部门的前序数据`, actorTarget);
          } else if (!dataFlowDetails?.isAvailableBeforeBehavior?.(item.actor_department_data_ref, item.behavior_ref)) {
            addWarning(
              `${label}选择的执行部门来源数据尚未在本行为开始前形成。`,
              actorTarget,
              ['改选本行为开始前已经形成的数据。']
            );
          }
          need(
            item.actor_position_rule,
            `${label}未填写办理人员确定规则`,
            atField(behaviorTarget, `behaviors.${index}.actor_position_rule`)
          );
        } else if (!isControlNode && assignmentMode === 'fixed_department') {
          need(item.current_actor_role, `${label}未选择执行部门`, actorTarget);
        }
        const externalDepartment = assignmentMode === 'fixed_department'
          ? externalActorDepartment(item.current_actor_role, owningDepartment)
          : '';
        const validRelations = ordinaryRelationsForBehavior(item.behavior_ref, data).filter(relation =>
          relation.relation_type
          && relation.from_behavior_ref
          && relation.to_behavior_ref
        );
        if (!isControlNode && externalDepartment && !validRelations.length) {
          addWarning(
            `${label}由${externalDepartment}执行，但尚未建立有效流程关系。`,
            {
              ruleCode: 'CROSS_DEPARTMENT_BEHAVIOR_RELATION_REQUIRED',
              editorSection: 'process',
              processSection: 'relations',
              focusKind: 'behavior',
              focusRef: item.behavior_ref,
              focusPath: `behaviors.${index}.behavior_ref`
            },
            ['在“流程关系”中补充该行为与前序或后续行为的实际先后关系。']
          );
        }
        if (!isControlNode && assignmentMode === 'fixed_department' && text(item.current_actor_role).trim() && rosterLoadState === 'ready') {
          const parsedActor = parseActorRole(item.current_actor_role);
          const actorDepartmentIsKnown = actorDepartments().includes(parsedActor.department);
          const actorIsValid = item.current_actor_role === '全公司'
            || (
              actorDepartmentIsKnown
              && rosterPositions(parsedActor.department).includes(parsedActor.position)
            );
          if (item.current_actor_role !== '全公司' && actorDepartmentIsKnown && !parsedActor.position) {
            addWarning(`${label}未选择执行岗位`, actorTarget);
          } else if (!actorIsValid) {
            addWarning(`${label}的执行岗位未被所选执行部门的花名册收录`, actorTarget);
          }
        }
        const hasDerivedEntry = (dataFlowDetails?.incomingByBehavior.get(item.behavior_ref) || [])
          .some(entry => entry.relation?.relation_type !== 'loop');
        if (!isControlNode && !hasDerivedEntry && !text(item.trigger).trim()) {
          addWarning(
            `${label}是流程入口，但未说明流程如何开始`,
            atField(behaviorTarget, `behaviors.${index}.trigger`)
          );
        }
        if (!isControlNode) {
          need(
            item.completion_standard,
            `${label}未填写完成标准`,
            atField(behaviorTarget, `behaviors.${index}.completion_standard`)
          );
        }
        if (!isControlNode && item.countersign_all_required) {
          if (!item.countersign_target_departments.length) {
            addWarning(
              `${label}未选择需要确认知悉的部门`,
              atField(behaviorTarget, `behaviors.${index}.countersign_target_departments`)
            );
          }
        }
        if (item.node_type === 'decision') {
          const localBranches = data.flow_relations.filter(relation =>
            relation.from_behavior_ref === item.behavior_ref
            && ['condition', 'sequence', 'loop'].includes(relation.relation_type)
          );
          const outletCount = localBranches.length;
          if (outletCount < 2) {
            addWarning(
              `${label}当前只有${outletCount}条明确出口，判断节点至少需要2条。`,
              behaviorTarget,
              [`补充${2 - outletCount}条具有明确去向的判断出口。`]
            );
          }
          const defaultSequenceBranches = localBranches.filter(branch =>
            branch.relation_type === 'sequence'
            && !text(branch.condition).trim()
          );
          defaultSequenceBranches.slice(1).forEach((branch, branchIndex) => {
            const relationIndex = data.flow_relations.indexOf(branch);
            addWarning(
              `${label}的流程关系${relationIndex + 1}形成第${branchIndex + 2}条默认继续路径，判断节点只能保留1条默认继续路径。`,
              {
                editorSection: 'process',
                processSection: 'relations',
                focusKind: 'relation',
                focusRef: branch.relation_ref,
                focusPath: `flow_relations.${relationIndex}.relation_type`
              },
              [
                '需要保留该关系时，为它填写判断条件并改为“判断分支”。',
                '不需要保留该关系时，删除该默认继续关系。'
              ]
            );
          });
        }
      });
      dataFlowDetails?.issues.forEach(item => {
        const dataObject = data.data_objects[item.dataIndex];
        addWarning(item.message, {
          ruleCode: `DATA_FLOW_${text(item.reason) || 'CONSISTENCY'}:${text(item.consumerRef) || text(item.producerRef) || 'OBJECT'}`,
          editorSection: 'process',
          processSection: 'data',
          focusKind: 'data',
          focusRef: dataObject?.data_ref || item.dataRef,
          focusPath: `data_objects.${item.dataIndex}.behavior_links`
        }, item.suggestions);
      });
      (data.data_objects || []).forEach((dataObject, dataIndex) => {
        const lifecycle = dataObject.lifecycle;
        const lifecycleTarget = {
          editorSection: 'process',
          processSection: 'data',
          focusKind: 'data',
          focusRef: dataObject.data_ref,
          focusPath: `data_objects.${dataIndex}.lifecycle`,
          reviewAspect: 'lifecycle'
        };
        if (!lifecycle || lifecycle.applicability === 'pending_confirmation') {
          addWarning(
            `${dataObject.data_name || `第${dataIndex + 1}个数据对象`}尚未确认本流程是否涉及生命周期变化。`,
            lifecycleTarget,
            ['进入“数据与表单—生命周期”，按数据对象核对；当前流程未涉及完整生命周期时，不需要补造其他阶段。']
          );
          return;
        }
        if (lifecycle.applicability === 'not_applicable' && !lifecycle.decision_reason) {
          addWarning(
            `${dataObject.data_name || `第${dataIndex + 1}个数据对象`}已选择生命周期不适用，但尚未记录原因。`,
            lifecycleTarget,
            ['记录为什么当前流程只引用该对象，或为什么没有生命周期变化。']
          );
        }
        const events = (lifecycle.routes || []).flatMap(route => route.events || []);
        const pendingEvents = events.filter(event => ['pending_confirmation', 'needs_recheck'].includes(event.review_status));
        if (pendingEvents.length) {
          addWarning(
            `${dataObject.data_name || `第${dataIndex + 1}个数据对象`}有${pendingEvents.length}项生命周期事件待确认或需要重新核对。`,
            lifecycleTarget,
            ['按对象核对触发条件、结果状态、作用范围、责任和异常处理；高风险事件必须人工确认。']
          );
        }
      });
      const parallelDetails = globalThis.StructureLearningScore?.parallelStructureDetails?.(data);
      const parallelTarget = { editorSection: 'process', processSection: 'relations' };
      if (parallelDetails?.missingSplit) {
        addWarning('当前存在并行路线，但业务流程中没有“并行开始（同时启动多条路线）”控制节点。', {
          ruleCode: 'FLOW_PARALLEL_SPLIT_REQUIRED',
          editorSection: 'process',
          processSection: 'behaviors'
        }, ['新增“并行开始”控制节点，并让现有并行路线从该节点发出。']);
      }
      if (parallelDetails?.missingJoin) {
        addWarning('当前存在并行路线，但业务流程中没有“并行汇合（等待多条路线完成）”控制节点。', {
          ruleCode: 'FLOW_PARALLEL_JOIN_REQUIRED',
          editorSection: 'process',
          processSection: 'behaviors'
        }, ['新增“并行汇合”控制节点，并让需要等待的并行路线进入该节点。']);
      }
      parallelDetails?.splits.forEach(detail => {
        if (!detail.missingCount) return;
        const guidance = globalThis.StructureLearningScore?.parallelSplitGuidance?.(detail, data);
        const target = guidance?.target || parallelTarget;
        const behaviorIndex = data.behaviors.indexOf(detail.behavior);
        addWarning(guidance?.message || '并行开始节点的有效并行路线不足2条。', {
          ...target,
          ruleCode: 'FLOW_PARALLEL_SPLIT_ROUTE_MINIMUM',
          focusKind: target.focusKind || 'behavior',
          focusRef: target.focusRef || detail.behavior?.behavior_ref,
          focusPath: target.focusPath || (behaviorIndex >= 0 ? `behaviors.${behaviorIndex}.behavior_ref` : '')
        }, guidance?.suggestions);
      });
      parallelDetails?.joins.forEach(detail => {
        if (!detail.missingCount) return;
        const guidance = globalThis.StructureLearningScore?.parallelJoinGuidance?.(detail, data);
        const target = guidance?.target || parallelTarget;
        const behaviorIndex = data.behaviors.indexOf(detail.behavior);
        addWarning(guidance?.message || '并行汇合节点的有效来源不足2个。', {
          ...target,
          ruleCode: 'FLOW_PARALLEL_JOIN_SOURCE_MINIMUM',
          focusKind: target.focusKind || 'behavior',
          focusRef: target.focusRef || detail.behavior?.behavior_ref,
          focusPath: target.focusPath || (behaviorIndex >= 0 ? `behaviors.${behaviorIndex}.behavior_ref` : '')
        }, guidance?.suggestions);
      });
      if (data.behaviors.length > 1) {
        const relationsTarget = {
          editorSection: 'process',
          processSection: 'relations'
        };
        const localRelations = data.flow_relations.filter(relation =>
          relation.from_behavior_ref
          && relation.to_behavior_ref
          && relation.relation_type !== 'loop'
        );
        const incoming = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
        const outgoing = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
        const transitions = localRelations.map(relation => ({
          from: relation.from_behavior_ref,
          to: relation.to_behavior_ref
        }));
        transitions.forEach(transition => {
          if (incoming.has(transition.to)) incoming.set(transition.to, incoming.get(transition.to) + 1);
          if (outgoing.has(transition.from)) outgoing.set(transition.from, outgoing.get(transition.from) + 1);
        });
        if (!transitions.length) {
          addWarning(
            `当前有${data.behaviors.length}个流程节点，但没有建立任何有效流程关系。`,
            { ...relationsTarget, ruleCode: 'FLOW_RELATION_REQUIRED' },
            ['从流程入口开始，按实际先后顺序建立节点之间的关系。']
          );
        } else {
          const starts = [...incoming.values()].filter(count => count === 0).length;
          const ends = [...outgoing.values()].filter(count => count === 0).length;
          if (starts !== 1) {
            addWarning(
              `当前识别到${starts}个流程入口，流程应有1个明确入口。`,
              { ...relationsTarget, reviewAspect: 'boundary', ruleCode: 'FLOW_SINGLE_START_REQUIRED' },
              ['请归口部门核对未连接的起始节点，并补充关系使流程只保留1个入口。']
            );
          }
          if (ends < 1) {
            addWarning(
              '当前没有可识别的流程结束位置。',
              { ...relationsTarget, reviewAspect: 'boundary', ruleCode: 'FLOW_END_REQUIRED' },
              [
                '请归口部门确认实际结束位置，并检查末端业务行为是否写明完成标准。',
                '流程通过明确回路继续办理时，请核对回路关系类型和触发条件。'
              ]
            );
          }
        }
      }
      const hiddenDecisionDetails = globalThis.StructureLearningScore?.hiddenDecisionDetails?.(data);
      hiddenDecisionDetails?.issues?.forEach(detail => {
        addWarning(detail.message, {
          ...detail.target,
          ruleCode: `FLOW_HIDDEN_DECISION:${text(detail.reason) || 'RELATION_CONDITION'}`
        }, detail.suggestions);
      });
      const declaredRouteDetails = globalThis.StructureLearningScore?.declaredRouteDetails?.(data);
      declaredRouteDetails?.issues?.forEach(detail => {
        addWarning(detail.message, {
          ...detail.target,
          ruleCode: `FLOW_DECLARED_ROUTE:${text(detail.reason) || 'MISSING'}`
        }, detail.suggestions);
      });
      data.flow_relations.forEach((relation, index) => {
        const relationTarget = {
          editorSection: 'process',
          processSection: 'relations',
          focusKind: 'relation',
          focusRef: relation.relation_ref
        };
        need(
          relation.relation_type,
          `流程关系${index + 1}未选择关系类型`,
          atField(relationTarget, `flow_relations.${index}.relation_type`)
        );
        need(
          relation.from_behavior_ref,
          `流程关系${index + 1}未选择起点节点`,
          atField(relationTarget, `flow_relations.${index}.from_behavior_ref`)
        );
        need(
          relation.to_behavior_ref,
          `流程关系${index + 1}未选择目标节点`,
          atField(relationTarget, `flow_relations.${index}.to_behavior_ref`)
        );
        if (relation.relation_type === 'condition' && !text(relation.condition).trim()) {
          addWarning(
            `流程关系${index + 1}已选择“判断分支”，但判断条件为空。`,
            atField(relationTarget, `flow_relations.${index}.condition`),
            ['填写进入目标行为必须满足的具体判断结果。']
          );
        }
        if (relation.relation_type === 'loop' && !text(relation.condition).trim()) {
          addWarning(
            `流程关系${index + 1}已选择“流程内部回路”，但回路触发条件为空。`,
            atField(relationTarget, `flow_relations.${index}.condition`),
            ['填写退回前序行为的具体触发条件。']
          );
        }
      });
      const dataNameCounts = new Map();
      data.data_objects.forEach(item => {
        const name = text(item.data_name).trim();
        if (name) dataNameCounts.set(name, (dataNameCounts.get(name) || 0) + 1);
      });
      data.data_objects.forEach((item, dataIndex) => {
        const label = item.data_name || `第${dataIndex + 1}项数据`;
        const dataTarget = {
          editorSection: 'process', processSection: 'data', focusKind: 'data', focusRef: item.data_ref
        };
        need(item.data_name, `第${dataIndex + 1}项数据未填写名称`, atField(dataTarget, `data_objects.${dataIndex}.data_name`));
        need(item.description, `${label}未填写数据说明`, atField(dataTarget, `data_objects.${dataIndex}.description`));
        if (item.information_type === 'pending_confirmation') {
          addWarning(`${label}的信息类型待确认。`, atField(dataTarget, `data_objects.${dataIndex}.information_type`));
        }
        if (text(item.data_name).trim() && dataNameCounts.get(text(item.data_name).trim()) > 1) {
          addWarning(
            `${label}与当前流程中的其他数据对象重名。`,
            atField(dataTarget, `data_objects.${dataIndex}.data_name`),
            ['核对这些对象是否确实不同；需要保留时结合创建行为以及来源线索区分。', '确认属于同一对象时，先核对引用影响，再使用受控归并。']
          );
        }
        const fieldNames = new Map();
        (item.fields || []).forEach((dataField, fieldIndex) => {
          const fieldPath = `data_objects.${dataIndex}.fields.${fieldIndex}`;
          need(dataField.field_name, `${label}的对象字段${fieldIndex + 1}未填写名称`, atField(dataTarget, `${fieldPath}.field_name`));
          need(dataField.field_type, `${label}的对象字段“${dataField.field_name || fieldIndex + 1}”未填写数据类型`, atField(dataTarget, `${fieldPath}.field_type`));
          if (!text(dataField.definition).trim()) {
            addWarning(`${label}的对象字段“${dataField.field_name || fieldIndex + 1}”未填写业务定义。`, atField(dataTarget, `${fieldPath}.definition`));
          }
          const normalizedName = text(dataField.field_name).trim().replace(/\s+/g, ' ').toLocaleLowerCase();
          if (normalizedName) {
            if (!fieldNames.has(normalizedName)) fieldNames.set(normalizedName, []);
            fieldNames.get(normalizedName).push(dataField);
          }
        });
        fieldNames.forEach(fields => {
          const types = [...new Set(fields.map(dataField => text(dataField.field_type).trim()).filter(Boolean))];
          if (fields.length > 1 && types.length > 1) {
            addWarning(
              `${label}包含${fields.length}个同名对象字段，但数据类型不同，系统没有自动归并。`,
              atField(dataTarget, `data_objects.${dataIndex}.fields`),
              ['核对这些字段是否代表不同业务含义；确属同一字段时统一数据类型并保留一个对象字段。']
            );
          }
        });
        const createLinks = (item.behavior_links || []).filter(link => link.operation === 'create');
        if (createLinks.length > 1) {
          addWarning(`${label}登记了${createLinks.length}个创建行为，当前无法确认唯一创建位置。`, atField(dataTarget, `data_objects.${dataIndex}.behavior_links`));
        }
        (item.behavior_links || []).forEach((link, linkIndex) => {
          if (link.operation === 'pending_confirmation') {
            addWarning(`${label}与“${behaviorLabel(link.behavior_ref)}”之间的数据操作待确认。`, atField(dataTarget, `data_objects.${dataIndex}.behavior_links.${linkIndex}.operation`));
          }
          if (link.operation === 'update' && !list(link.updated_field_refs).length) {
            addWarning(
              `${label}与“${behaviorLabel(link.behavior_ref)}”之间已选择“更新”，但尚未选择本次实际更新的字段。`,
              atField(dataTarget, `data_objects.${dataIndex}.behavior_links.${linkIndex}.updated_field_refs`),
              ['点击本项返回数据行为关系，再通过“选择字段”补充一个或多个对象字段。']
            );
          }
        });
        if (!createLinks.length && !(item.source_relations || []).length) {
          addWarning(`${label}没有本流程创建行为，也未登记其他流程以及外部来源线索。`, atField(dataTarget, `data_objects.${dataIndex}.source_relations`));
        }
        (item.source_relations || []).forEach((source, sourceIndex) => {
          const sourcePath = `data_objects.${dataIndex}.source_relations.${sourceIndex}`;
          need(source.source_data_name, `${label}的来源线索${sourceIndex + 1}未填写来源数据名称`, atField(dataTarget, `${sourcePath}.source_data_name`));
          need(source.source_department, `${label}的来源线索${sourceIndex + 1}未填写来源部门`, atField(dataTarget, `${sourcePath}.source_department`));
          need(source.source_process_name, `${label}的来源线索${sourceIndex + 1}未填写来源流程名称`, atField(dataTarget, `${sourcePath}.source_process_name`));
          need(source.source_behavior_name, `${label}的来源线索${sourceIndex + 1}未填写来源行为名称`, atField(dataTarget, `${sourcePath}.source_behavior_name`));
          if (source.availability_mode === 'pending_confirmation') {
            addWarning(`${label}的来源线索${sourceIndex + 1}尚未确认在当前流程中的可用时间。`, atField(dataTarget, `${sourcePath}.availability_mode`));
          }
          if (source.availability_mode === 'at_behavior' && !source.available_from_behavior_ref) {
            addWarning(`${label}的来源线索${sourceIndex + 1}未选择具体可用位置。`, atField(dataTarget, `${sourcePath}.available_from_behavior_ref`));
          }
        });
      });
      data.forms.forEach((form, formIndex) => {
        const formLabel = form.form_name || `第${formIndex + 1}项表单记录`;
        const formTarget = {
          editorSection: 'forms',
          focusKind: 'form',
          focusRef: form.form_ref
        };
        need(
          form.form_name,
          `第${formIndex + 1}项表单记录未填写名称`,
          atField(formTarget, `forms.${formIndex}.form_name`)
        );
        if (form.form_design_state === 'unspecified') {
          addWarning(
            `${formLabel}尚未确认属于现状表单还是拟设计表单。`,
            atField(formTarget, `forms.${formIndex}.form_design_state`),
            ['根据实际情况，在“现状”“拟设计”中选择一项。']
          );
        }
        if (!(form.behavior_links || []).length) {
          addWarning(`${formLabel}尚未登记由哪些业务行为处理。`, atField(formTarget, `forms.${formIndex}.behavior_links`));
        }
        (form.behavior_links || []).forEach((link, linkIndex) => {
          if (!(link.operations || []).length) {
            addWarning(`${formLabel}与“${behaviorLabel(link.behavior_ref)}”的处理方式待确认。`, atField(formTarget, `forms.${formIndex}.behavior_links.${linkIndex}.operations`));
          }
        });
        const detailCount = form.areas.filter(area => area.area_type === '明细清单').length;
        let detailIndex = 0;
        form.areas.forEach((area, areaIndex) => {
          const areaTarget = {
            editorSection: 'forms',
            focusKind: 'area',
            focusRef: area.area_ref
          };
          if (area.area_type === '明细清单') detailIndex += 1;
          const groupLabel = area.area_type === '基本信息'
            ? '主表字段'
            : area.area_type === '明细清单'
              ? `明细表${detailIndex}`
              : '待确认字段';
          if (area.area_type === '明细清单' && detailCount > 1 && !text(area.area_title).trim()) {
            addWarning(
              `${formLabel}包含${detailCount}张明细表，但${groupLabel}的标题为空，当前无法区分该明细表。`,
              atField(areaTarget, `forms.${formIndex}.areas.${areaIndex}.area_title`),
              ['填写能够区分该明细表用途的标题。']
            );
          }
          if (!area.area_type) {
            area.items.forEach((item, itemIndex) => {
              addWarning(
                `${formLabel}的字段“${item.item_name || `字段${itemIndex + 1}`}”尚未确定字段归属。`,
                atField(areaTarget, `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.assignment`),
                ['字段属于主表时选择“主表”；字段属于明细表时选择一张具体明细表。']
              );
            });
          }
          if (!area.items.length && area.area_type === '明细清单') {
            addWarning(
              `${formLabel}的${groupLabel}当前没有字段。`,
              areaTarget,
              ['该明细表确实存在时，至少录入1个字段；不需要该明细表时将其删除。']
            );
          }
          area.items.forEach((item, itemIndex) => {
            const itemLabel = item.item_name || `字段${itemIndex + 1}`;
            const itemPath = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}`;
            if (item.business_data_ref && !item.data_field_ref) {
              addWarning(`${formLabel}的“${itemLabel}”已选择业务数据归属，但尚未引用对象字段。`, atField(areaTarget, `${itemPath}.data_field_ref`));
            }
            if (item.data_field_ref && item.value_usage_mode === 'pending_confirmation') {
              addWarning(`${formLabel}的“${itemLabel}”尚未确认是权威录入、沿用已有值、系统计算还是外部取得。`, atField(areaTarget, `${itemPath}.value_usage_mode`));
            }
            if (item.value_origin_mode === 'pending_confirmation') {
              addWarning(`${formLabel}的“${itemLabel}”取值方式待确认。`, atField(areaTarget, `${itemPath}.value_origin_mode`));
            }
            if (item.value_origin_mode === 'depends_on_data' && item.value_usage_mode !== 'reuse_existing' && !(item.source_links || []).length) {
              addWarning(`${formLabel}的“${itemLabel}”选择依赖数据取得，但尚未登记取值来源。`, atField(areaTarget, `${itemPath}.source_links`));
            }
            (item.source_links || []).forEach((link, linkIndex) => {
              const linkPath = `${itemPath}.source_links.${linkIndex}`;
              if (link.source_type === 'external_system') {
                if (!text(link.source_system_name).trim()) {
                  addWarning(`${formLabel}的“${itemLabel}”已选择外部系统来源，但尚未填写外部系统名称。`, atField(areaTarget, `${linkPath}.source_system_name`));
                }
                if (!text(link.source_data_name).trim()) {
                  addWarning(`${formLabel}的“${itemLabel}”已选择外部系统来源，但尚未填写来源数据名称。`, atField(areaTarget, `${linkPath}.source_data_name`));
                }
              } else if (!link.source_data_ref) {
                addWarning(`${formLabel}的“${itemLabel}”已选择本流程数据来源，但尚未选择来源数据。`, atField(areaTarget, `${linkPath}.source_data_ref`));
              }
            });
          });
        });
      });
      const fieldUsageContexts = new Map();
      const dataFieldLabels = new Map();
      data.data_objects.forEach(dataObject => (dataObject.fields || []).forEach(dataField => {
        dataFieldLabels.set(dataField.field_ref, `${dataObject.data_name || '未命名数据'} / ${dataField.field_name || '未命名对象字段'}`);
      }));
      data.forms.forEach((form, formIndex) => (form.areas || []).forEach((area, areaIndex) =>
        (area.items || []).forEach((item, itemIndex) => {
          if (!item.data_field_ref) return;
          if (!fieldUsageContexts.has(item.data_field_ref)) fieldUsageContexts.set(item.data_field_ref, []);
          fieldUsageContexts.get(item.data_field_ref).push({ form, formIndex, area, areaIndex, item, itemIndex });
        })
      ));
      fieldUsageContexts.forEach((contexts, fieldRef) => {
        const authoritative = contexts.filter(context => context.item.value_usage_mode === 'authoritative_input');
        const establishing = contexts.filter(context => ['authoritative_input', 'calculated', 'external_source'].includes(context.item.value_usage_mode));
        const first = contexts[0];
        const target = atField({ editorSection: 'forms', focusKind: 'area', focusRef: first.area.area_ref }, `forms.${first.formIndex}.areas.${first.areaIndex}.items.${first.itemIndex}.value_usage_mode`);
        if (authoritative.length > 1) {
          addWarning(
            `${dataFieldLabels.get(fieldRef) || fieldRef}在${authoritative.length}个表单字段中都被设置为本流程权威录入点，仍会造成重复录入。`,
            target,
            ['保留一个权威录入点；其他表单字段改为“沿用已有值”。分支互斥等例外需要业务人员说明。']
          );
        } else if (!establishing.length && contexts.some(context => context.item.value_usage_mode === 'reuse_existing')) {
          addWarning(
            `${dataFieldLabels.get(fieldRef) || fieldRef}只设置了沿用已有值，但当前流程没有权威录入、系统计算或外部取得位置。`,
            target,
            ['补充一个能够建立字段值的位置，或核对该值是否在流程开始前已经可用。']
          );
        }
      });
      legacyCrossDepartmentDiagnostics(data).forEach(item => {
        item.issues.forEach(issue => addWarning(issue.message, issue, issue.suggestions));
      });
      return warnings;
    }

    function sanitizeFilenamePart(value, fallback) {
      const cleaned = text(value).trim().replace(/[\\/:*?"<>|\r\n]+/g, '_').replace(/\s+/g, ' ').slice(0, 80);
      return cleaned || fallback;
    }

    function exportTimestamp(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
    }

    async function downloadJson(data, stage) {
      const now = new Date();
      const department = sanitizeFilenamePart(data.export_meta.initiating_department, '未明确部门');
      const processName = sanitizeFilenamePart(data.process.process_name, '未命名流程');
      const stageLabel = sanitizeFilenamePart(stage?.label, '当前草稿');
      const fileName = `未审核-${department}-${processName}-${stageLabel}-${exportTimestamp(now)}.json`;
      const exportedAt = data.export_meta.exported_at;
      const bytes = new TextEncoder().encode(`${JSON.stringify(data, null, 2)}\n`);
      let sha256 = '';
      try {
        sha256 = await globalThis.GovernanceWorkflow.sha256Hex(bytes);
      } catch (_error) {
        sha256 = '';
      }
      const blob = new Blob([bytes], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      return { fileName, exportedAt, stage, sha256 };
    }

    async function ensureCompatibleValidationService(retryAction = '再次下载') {
      let schema;
      try {
        const response = await fetch('/api/schema', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        schema = await readJsonResponse(response, '3001校验接口未返回结构化数据。');
      } catch (_error) {
        throw new Error(`3001校验服务暂时不可用。请保持当前页面打开，待服务恢复后${retryAction}。`);
      }

      const actualVersion = text(schema?.properties?.schema_version?.const).trim();
      if (actualVersion !== EXPECTED_EXPORT_SCHEMA_VERSION) {
        throw new Error(
          `3001前端与服务端版本不一致。当前页面使用“${EXPECTED_EXPORT_SCHEMA_VERSION}”，`
          + `服务端提供“${actualVersion || '未知版本'}”。请保持当前页面打开，待维护人员重启3001服务后${retryAction}。`
        );
      }
    }

    function validationErrorLocation(error) {
      const basePath = text(error?.path).trim() || '/';
      const missingProperty = text(error?.params?.missingProperty).trim();
      if (!missingProperty) return basePath;
      return basePath === '/' ? `/${missingProperty}` : `${basePath}/${missingProperty}`;
    }

    function structureScoreTargetForValidationError(error, snapshot) {
      const location = validationErrorLocation(error);
      const segments = location.split('/').filter(Boolean);
      const focusPath = segments.join('.');
      const root = segments[0];
      const index = Number(segments[1]);
      if (root === 'export_meta') return { editorSection: 'basic', focusPath };
      if (root === 'process') {
        return {
          editorSection: ['purpose', 'scope'].includes(segments[1]) ? 'profile' : 'basic',
          focusPath
        };
      }
      if (root === 'behaviors' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: snapshot.behaviors?.[index]?.behavior_ref || '',
          focusPath
        };
      }
      if (root === 'flow_relations' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'relations',
          focusKind: 'relation',
          focusRef: snapshot.flow_relations?.[index]?.relation_ref || '',
          focusPath
        };
      }
      if (root === 'data_objects' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'data',
          focusKind: 'data',
          focusRef: snapshot.data_objects?.[index]?.data_ref || '',
          focusPath
        };
      }
      if (root === 'forms' && Number.isInteger(index)) {
        const areaIndex = Number(segments[3]);
        if (segments[2] === 'areas' && Number.isInteger(areaIndex)) {
          return {
            editorSection: 'forms',
            focusKind: 'area',
            focusRef: snapshot.forms?.[index]?.areas?.[areaIndex]?.area_ref || '',
            focusPath
          };
        }
        return {
          editorSection: 'forms',
          focusKind: 'form',
          focusRef: snapshot.forms?.[index]?.form_ref || '',
          focusPath
        };
      }
      if (root === 'terms') return { editorSection: 'terms', focusPath };
      return {};
    }

    function structureScoreValidationErrors(result, snapshot) {
      const errors = Array.isArray(result?.errors) ? result.errors : [];
      return errors.slice(0, 8).map(error => {
        const location = validationErrorLocation(error);
        const detail = text(error?.message).trim() || '结构规则检查未通过';
        return {
          message: `技术结构检查未通过：${location} ${detail}`,
          target: structureScoreTargetForValidationError(error, snapshot)
        };
      });
    }

    async function validateStructureScoreDocument(data) {
      const response = await fetch('/api/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return readJsonResponse(response, '3001校验接口未返回结构化数据。');
    }

    function commitStructureScoreState(context, nextState) {
      if (context.runId !== structureScoreRunId) return;
      if (context.candidateIndex !== currentIndex) return;
      if (context.documentKey !== currentStructureScoreKey()) return;
      structureScoreState = {
        ...nextState,
        candidateIndex: context.candidateIndex,
        documentKey: context.documentKey
      };
      if (activeGovernanceStep === 'handoff') {
        render();
      } else {
        governanceHeader.innerHTML = renderGovernanceHeader(currentDocument());
        workspaceViewSwitch.innerHTML = renderGovernanceSteps();
      }
    }

    async function runStructureScore(context) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring) return;
      const checks = {
        parse: false,
        compatibility: false,
        validation: false,
        roundTrip: false,
        preservation: false
      };
      const errors = [];
      let parsed;
      let roundTripDocument;

      try {
        parsed = JSON.parse(JSON.stringify(context.snapshot));
        checks.parse = true;
        const migrated = globalThis.ProcessGovernanceMigration.migrateDocument(parsed, { departments: DEPARTMENTS });
        checks.compatibility = parsed.schema_version === EXPECTED_EXPORT_SCHEMA_VERSION
          && migrated.length === 1
          && migrated[0].schema_version === EXPECTED_EXPORT_SCHEMA_VERSION;
        roundTripDocument = globalThis.ProcessGovernanceMigration.migrateDocument(
          JSON.parse(JSON.stringify(migrated[0])),
          { departments: DEPARTMENTS }
        )[0];
        checks.preservation = scoring.stableStringify(scoring.semanticProjection(migrated[0]))
          === scoring.stableStringify(scoring.semanticProjection(roundTripDocument));
      } catch (_error) {
        errors.push({ message: '当前页面内容无法完成JSON序列化和回读。' });
      }

      if (!checks.compatibility && checks.parse) {
        errors.push({ message: `当前页面内容不是${EXPECTED_EXPORT_SCHEMA_VERSION}。` });
      }
      if (!checks.preservation && roundTripDocument) {
        errors.push({ message: '当前页面内容在下载回读后发生变化，业务字段或技术引用未能完整保持。' });
      }

      try {
        await ensureCompatibleValidationService('重新评分');
        if (parsed) {
          const currentValidation = await validateStructureScoreDocument(parsed);
          checks.validation = Boolean(currentValidation?.valid);
          if (!checks.validation) {
            errors.push(...structureScoreValidationErrors(currentValidation, parsed));
          }
        }
        if (roundTripDocument) {
          const roundTripValidation = await validateStructureScoreDocument(roundTripDocument);
          checks.roundTrip = Boolean(roundTripValidation?.valid);
          if (!checks.roundTrip) {
            errors.push(...structureScoreValidationErrors(roundTripValidation, roundTripDocument));
          }
        }
      } catch (error) {
        const message = text(error?.message).trim()
          || '3001校验服务暂时不可用。请保持当前页面打开，待服务恢复后重新评分。';
        commitStructureScoreState(context, {
          status: 'unavailable',
          result: scoring.finalize(context.contentResult, {
            status: 'unavailable',
            checks,
            message
          }),
          message
        });
        return;
      }

      const deduplicatedErrors = [...new Map(errors.map(item => [item.message, item])).values()];
      commitStructureScoreState(context, {
        status: 'ready',
        result: scoring.finalize(context.contentResult, {
          status: 'ready',
          checks,
          errors: deduplicatedErrors
        }),
        message: ''
      });
    }

    async function exportCurrent(options = {}) {
      const entry = currentEntry();
      if (!entry) return false;
      if (!options.skipPendingGuard && hasUnappliedChanges()) {
        requestTransition('下载当前文件', () => exportCurrent({ ...options, skipPendingGuard: true }));
        return false;
      }
      const stage = options.stage || globalThis.GovernanceWorkflow.stageForStep(activeGovernanceStep);
      const exportDocument = clone(entry.data);
      exportDocument.export_meta.exported_at = new Date().toISOString();
      setBusy(true, '正在检查当前文件中的技术引用……');
      try {
        await ensureCompatibleValidationService();
        const roundTripDocument = globalThis.ProcessGovernanceMigration.migrateDocument(
          JSON.parse(JSON.stringify(exportDocument)),
          { departments: DEPARTMENTS }
        )[0];
        if (JSON.stringify(roundTripDocument) !== JSON.stringify(exportDocument)) {
          showStatus('当前内容在下载回读后会发生丢失，暂不能下载。当前草稿保持不变。', 'error');
          return false;
        }
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: exportDocument })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) {
          const errors = Array.isArray(result.errors) ? result.errors : [];
          const referenceErrorsOnly = errors.length > 0 && errors.every(error => error.keyword === 'localReference');
          if (referenceErrorsOnly) {
            const details = errors.slice(0, 5).map(error => `${validationErrorLocation(error)}：${error.message}`).join('；');
            showStatus(`当前流程文件中的技术引用已断开或重复，暂不能下载。${details}`, 'error');
          } else {
            const locations = [...new Set(errors.slice(0, 5).map(validationErrorLocation))].join('、');
            const locationText = locations ? `涉及位置：${locations}。` : '';
            showStatus(
              `当前流程文件不符合3001单流程下载格式，暂不能下载。${locationText}请保持当前页面内容，并联系维护人员处理。`,
              'error'
            );
          }
          return false;
        }
        const warnings = businessWarnings(exportDocument);
        if (warnings.length && !options.skipBusinessConfirm) {
          const preview = warnings.slice(0, 8).map((item, index) => {
            const suggestionItems = warningSuggestions(item);
            const suggestions = suggestionItems
              .map((suggestion, suggestionIndex) => `${suggestionItems.length > 1 ? `建议${suggestionIndex + 1}` : '建议'}：${suggestion}`)
              .join('\n   ');
            return `${index + 1}. 当前情况：${item.message}\n   ${suggestions}`;
          }).join('\n');
          const more = warnings.length > 8 ? `\n另有 ${warnings.length - 8} 项。` : '';
          if (!window.confirm(`当前是未审核草稿，以下事项仍需处理或登记为待定：\n\n${preview}${more}\n\n仍然下载当前草稿吗？`)) {
            showStatus('已取消下载，当前页面内容仍保留。');
            return false;
          }
        }
        const downloadResult = await downloadJson(exportDocument, stage);
        entry.data = exportDocument;
        entry.lastDownload = downloadResult;
        entry.forceDirty = false;
        graphStateManager.markBaseline(candidateStateKey(entry), entry.data);
        refreshCandidateDirty(entry);
        showStatus(
          downloadResult.sha256
            ? `已下载 ${downloadResult.fileName}，并生成SHA-256摘要。请妥善保存；再次编制时可重新导入3001。`
            : `已下载 ${downloadResult.fileName}。摘要未生成，交接前需使用外部工具补算；当前JSON结构检查结果不受影响。`,
          'success'
        );
        updateCandidateList();
        governanceHeader.innerHTML = renderGovernanceHeader(currentDocument());
        workspaceViewSwitch.innerHTML = renderGovernanceSteps();
        if (activeGovernanceStep === 'handoff') render();
        return true;
      } catch (error) {
        showStatus(`下载失败：${error.message}`, 'error');
        return false;
      } finally {
        setBusy(false);
      }
    }

    function protect(action) {
      if (hasUnappliedChanges()) {
        requestTransition('继续当前操作', () => protect(action));
        return;
      }
      if (!hasUndownloadedChanges()) {
        action();
        return;
      }
      if (!currentEntry()?.dirty) {
        currentIndex = candidates.findIndex(item => item.dirty);
        render();
      }
      protectedAction = action;
      protectedActionInvoker = document.activeElement instanceof HTMLElement
        ? document.activeElement
        : null;
      unsavedModal.classList.add('show');
      unsavedModal.setAttribute('aria-hidden', 'false');
    }

    function closeProtectedModal() {
      if (protectedActionInvoker?.isConnected) {
        protectedActionInvoker.focus();
      } else if (unsavedModal.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      protectedActionInvoker = null;
      unsavedModal.classList.remove('show');
      unsavedModal.setAttribute('aria-hidden', 'true');
    }

    async function importJson(file) {
      setBusy(true, `正在读取 ${file.name}……`);
      try {
        if (file.size > MAX_IMPORT_BYTES) {
          throw new Error('文件超过10MB，系统未读取文件内容。请缩小文件后重新导入');
        }
        const fileBytes = new Uint8Array(await file.arrayBuffer());
        let decodedText = '';
        try {
          decodedText = new TextDecoder('utf-8', { fatal: true }).decode(fileBytes);
        } catch (_error) {
          throw new Error('文件不是有效的UTF-8 JSON。请从原系统重新导出后再导入');
        }
        const parsed = JSON.parse(decodedText);
        let fileSha256 = '';
        try {
          fileSha256 = await globalThis.GovernanceWorkflow.sha256Hex(fileBytes);
        } catch (_error) {
          fileSha256 = '';
        }
        const supported = [
          ...globalThis.ProcessGovernanceMigration.SUPPORTED_PROCESS_VERSIONS,
          globalThis.ProcessGovernanceMigration.LEGACY_DOCUMENT_VERSION
