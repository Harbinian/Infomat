      destroyReviewPatternDiagrams();
      const data = currentDocument();
      if (activeWorkspaceTab !== 'editor' || activeEditorSection !== 'export') expandedReviewPatternId = '';
      document.body.classList.toggle(
        'diagram-overlay-open',
        Boolean(data && (
          (activeWorkspaceTab === 'flow' && diagramExpanded)
          || (activeWorkspaceTab === 'editor' && activeEditorSection === 'export' && expandedReviewPatternId)
        ))
      );
      document.getElementById('exportButton').disabled = busy || !data;
      document.getElementById('clearButton').disabled = busy || !data;
      updateCandidateList();
      if (!data) {
        diagramExpanded = false;
        expandedReviewPatternId = '';
        document.body.classList.remove('diagram-overlay-open');
        workspaceViewSwitch.innerHTML = renderWorkspaceTabs(null, true);
        workspace.innerHTML = activeWorkspaceTab === 'versions' ? renderVersionHistoryPanel() : `<div class="empty">
          <h2>尚未创建或导入流程</h2>
        </div>`;
        return;
      }
      const model = currentDiagramModel(data);
      workspaceViewSwitch.innerHTML = renderWorkspaceTabs(model);
      workspace.innerHTML = `
        <div
          class="tab-panel"
          id="flowPanel"
          role="tabpanel"
          aria-labelledby="flowTab"
          ${activeWorkspaceTab === 'flow' ? '' : 'hidden'}
        >
          ${renderDiagramPanel(model)}
        </div>
        <div
          class="tab-panel"
          id="dataPanel"
          role="tabpanel"
          aria-labelledby="dataTab"
          ${activeWorkspaceTab === 'data' ? '' : 'hidden'}
        >
          ${renderDataDiagramPanel()}
        </div>
        <div
          class="tab-panel"
          id="editorPanel"
          role="tabpanel"
          aria-labelledby="editorTab"
          ${activeWorkspaceTab === 'editor' ? '' : 'hidden'}
        >
          ${renderEditorContent()}
        </div>
        <div class="tab-panel" ${activeWorkspaceTab === 'versions' ? '' : 'hidden'}>
          ${renderVersionHistoryPanel()}
        </div>`;
      if (activeWorkspaceTab === 'flow') requestAnimationFrame(mountDiagram);
      if (activeWorkspaceTab === 'data') requestAnimationFrame(mountDataDiagram);
      if (activeWorkspaceTab === 'editor' && activeEditorSection === 'export') {
        requestAnimationFrame(mountReviewPatternDiagrams);
      }
    }

    function updateCandidateList() {
      if (!candidates.length) {
        candidateList.innerHTML = '<div class="candidate-empty">尚未创建或导入流程。</div>';
        candidateNote.textContent = '新建流程或导入结构化文件后，可以在这里切换当前流程。';
        return;
      }
      candidateList.innerHTML = candidates.map((item, index) => {
        const name = item.data.process.process_name || `未命名流程 ${index + 1}`;
        const fullLabel = `${index + 1}. ${name}${item.dirty ? '，未导出修改' : ''}`;
        return `
          <button
            class="candidate-item${index === currentIndex ? ' active' : ''}"
            type="button"
            role="option"
            aria-selected="${index === currentIndex}"
            aria-label="${escapeAttribute(fullLabel)}"
            title="${escapeAttribute(fullLabel)}"
            data-candidate-index="${index}"
          >
            <span class="candidate-number" aria-hidden="true">${index + 1}</span>
            <span class="candidate-copy">
              <span class="candidate-name">${escapeHtml(name)}</span>
              ${item.dirty ? '<span class="candidate-dirty">未导出修改</span>' : ''}
            </span>
          </button>`;
      }).join('');
      candidateNote.textContent = candidates.length > 1
        ? `本次导入拆出 ${candidates.length} 条候选流程，请逐一检查并分别导出。`
        : '当前页面只编辑并导出这一条流程。';
    }

    function addCandidate(data, dirty, origin) {
      const entry = { data: clone(data), dirty: Boolean(dirty), origin: origin || 'unknown' };
      candidates.push(entry);
      registerCandidateState(entry, { forceDirty: Boolean(dirty) });
    }

    async function startNewProcess() {
      setBusy(true, '正在读取当前结构和空白模板……');
      try {
        await ensureCompatibleValidationService('再次新建流程');
        const data = await fetchEmptyProcessDocument();
        destroyDiagram();
        const entry = { data: clone(data), dirty: false, origin: 'new' };
        candidates = [entry];
        graphStateManager.clear();
        registerCandidateState(entry);
        currentIndex = 0;
        activeWorkspaceTab = 'flow';
        diagramExpanded = false;
        resetEditorNavigation('basic');
        clearStatus();
        render();
      } catch (error) {
        showStatus(`新建流程失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
      }
    }

    function clearPage() {
      destroyDiagram();
      destroyDataDiagram();
      graphStateManager.clear();
      candidates = [];
      currentIndex = 0;
      activeWorkspaceTab = 'flow';
      diagramExpanded = false;
      resetEditorNavigation('basic');
      clearStatus();
      render();
    }

    function addBehavior() {
      const behavior = {
        behavior_ref: newRef('behavior'),
        node_type: '',
        behavior_name: '',
        behavior_description: '',
        current_actor_role: '',
        actor_assignment_mode: 'fixed_department',
        actor_department_data_ref: null,
        actor_position_rule: '',
        trigger: '',
        precondition: '',
        input_description: '',
        timing: null,
        completion_standard: '',
        output_description: '',
        countersign_all_required: false,
        countersign_target_departments: []
      };
      currentDocument().behaviors.push(behavior);
      activeFlowItemKind = 'behavior';
      activeBehaviorRef = behavior.behavior_ref;
      return behavior;
    }

    function addRelation() {
      const relation = {
        relation_ref: newRef('relation'),
        relation_type: '',
        from_behavior_ref: null,
        to_behavior_ref: null,
        condition: ''
      };
      currentDocument().flow_relations.push(relation);
      activeRelationRef = relation.relation_ref;
      return relation;
    }

    function addDataObject() {
      const dataObject = {
        data_ref: newRef('data'),
        data_name: '',
        description: '',
        information_type: 'pending_confirmation',
        behavior_links: [],
        source_relations: []
      };
      currentDocument().data_objects.push(dataObject);
      activeDataRef = dataObject.data_ref;
      return dataObject;
    }

    function owningDepartmentChangeImpact(data, nextDepartment) {
      const behaviors = Array.isArray(data?.behaviors) ? data.behaviors : [];
      const fixedAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'fixed_department'
        && text(item?.current_actor_role).trim()
      ).length;
      const dynamicAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'dynamic_from_data'
        || item?.actor_department_data_ref
        || text(item?.actor_position_rule).trim()
      ).length;
      const companyWideAssignments = behaviors.filter(item => actorAssignmentMode(item) === 'company_wide').length;
      const formalWorkRoles = Array.isArray(data?.migration?.work_roles) ? data.migration.work_roles.length : 0;
      const classificationFields = [
        data?.process?.capability_domain,
        data?.process?.business_capability,
        data?.process?.classification_status !== 'unclassified' ? data?.process?.classification_status : ''
      ].filter(value => text(value).trim()).length;
      return {
        previousDepartment: text(data?.process?.owning_department).trim(),
        nextDepartment: text(nextDepartment).trim(),
        behaviorCount: behaviors.length,
        fixedAssignments,
        dynamicAssignments,
        companyWideAssignments,
        classificationFields,
        formalWorkRoles,
        internalCallCount: Array.isArray(data?.migration?.internal_process_calls) ? data.migration.internal_process_calls.length : 0
      };
    }

    function buildOwningDepartmentResetDocument(data, nextDepartment) {
      const next = clone(data);
      next.process.owning_department = text(nextDepartment).trim();
      next.process.capability_domain = null;
      next.process.business_capability = null;
      next.process.classification_status = 'unclassified';
      next.behaviors.forEach(behavior => {
        if (actorAssignmentMode(behavior) === 'company_wide') return;
        behavior.actor_assignment_mode = 'fixed_department';
        behavior.current_actor_role = '';
        behavior.actor_department_data_ref = null;
        behavior.actor_position_rule = '';
      });
      return next;
    }

    function removeRelation(index) {
      const relation = currentDocument().flow_relations[index];
      if (!relation) return false;
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), 'relation', relation.relation_ref);
      if (impacts.length) {
        window.alert(`当前流程关系仍被${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}引用，不能删除。`);
        return false;
      }
      currentDocument().flow_relations.splice(index, 1);
      if (activeRelationRef === relation.relation_ref) {
        activeRelationRef = currentDocument().flow_relations[Math.min(index, currentDocument().flow_relations.length - 1)]?.relation_ref || '';
      }
      return true;
    }

    function ensureFormArea(form, areaType) {
      const existing = form.areas.find(area => areaType ? area.area_type === areaType : !area.area_type);
      if (existing) return existing;
      const area = {
        area_ref: newRef('area'),
        area_type: areaType || '',
        area_title: '',
        items: []
      };
      form.areas.push(area);
      return area;
    }

    function findFormItem(form, itemRef) {
      for (let areaIndex = 0; areaIndex < form.areas.length; areaIndex += 1) {
        const itemIndex = form.areas[areaIndex].items.findIndex(item => item.item_ref === itemRef);
        if (itemIndex >= 0) return { areaIndex, itemIndex, item: form.areas[areaIndex].items[itemIndex] };
      }
      return null;
    }

    function moveFormItemToAssignment(formIndex, itemRef, assignment) {
      const form = currentDocument().forms[formIndex];
      if (!form) return false;
      const found = findFormItem(form, itemRef);
      if (!found) return false;
      let targetArea = null;
      if (assignment === 'main') {
        targetArea = ensureFormArea(form, '基本信息');
      } else if (assignment === 'unassigned') {
        targetArea = ensureFormArea(form, '');
      } else if (assignment === '__new_detail__') {
        targetArea = {
          area_ref: newRef('area'),
          area_type: '明细清单',
          area_title: '',
          items: []
        };
        form.areas.push(targetArea);
      } else {
        targetArea = form.areas.find(area => area.area_type === '明细清单' && area.area_ref === assignment);
      }
      if (!targetArea) return false;
      const sourceArea = form.areas[found.areaIndex];
      if (sourceArea.area_ref === targetArea.area_ref) return true;
      const [item] = sourceArea.items.splice(found.itemIndex, 1);
      targetArea.items.push(item);
      if (!sourceArea.area_type && !sourceArea.items.length) {
        form.areas.splice(form.areas.indexOf(sourceArea), 1);
      }
      activeAreaRef = targetArea.area_ref;
      return true;
    }

    function moveFormItem(formIndex, areaIndex, itemIndex, direction) {
      const items = currentDocument().forms[formIndex]?.areas[areaIndex]?.items;
      const targetIndex = itemIndex + direction;
      if (!items || targetIndex < 0 || targetIndex >= items.length) return false;
      [items[itemIndex], items[targetIndex]] = [items[targetIndex], items[itemIndex]];
      return true;
    }

    function moveDetailArea(formIndex, areaIndex, direction) {
      const form = currentDocument().forms[formIndex];
      if (!form?.areas[areaIndex] || form.areas[areaIndex].area_type !== '明细清单') return false;
      const detailIndices = form.areas
        .map((area, index) => area.area_type === '明细清单' ? index : -1)
        .filter(index => index >= 0);
      const position = detailIndices.indexOf(areaIndex);
      const targetAreaIndex = detailIndices[position + direction];
      if (position < 0 || targetAreaIndex == null) return false;
      [form.areas[areaIndex], form.areas[targetAreaIndex]] = [form.areas[targetAreaIndex], form.areas[areaIndex]];
      return true;
    }

    function removeDetailArea(formIndex, areaIndex) {
      const form = currentDocument().forms[formIndex];
      const area = form?.areas[areaIndex];
      if (!area || area.area_type !== '明细清单') return false;
      const fieldCount = area.items.length;
      if (!window.confirm(`当前明细表包含${fieldCount}个字段。删除后，这些字段会一并删除；其他字段不受影响。确定继续吗？`)) return false;
      form.areas.splice(areaIndex, 1);
      if (area.area_ref === activeAreaRef) activeAreaRef = '';
      return true;
    }

    function addForm(formDesignState) {
      const mainArea = {
        area_ref: newRef('area'),
        area_type: '基本信息',
        area_title: '',
        items: []
      };
      const form = {
        form_ref: newRef('form'),
        form_name: '',
        form_no: null,
        form_design_state: formDesignState,
        behavior_links: [],
        areas: [mainArea]
      };
      currentDocument().forms.push(form);
      activeFormRef = form.form_ref;
      activeAreaRef = mainArea.area_ref;
    }

    function addTerm() {
      const term = { term_ref: newRef('term'), term_name: '', definition: '' };
      currentDocument().terms.push(term);
      activeTermRef = term.term_ref;
    }

    function removeBehavior(index) {
      const behavior = currentDocument().behaviors[index];
      if (!behavior) return false;
      const ref = behavior.behavior_ref;
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), 'behavior', ref);
      if (impacts.length) {
        window.alert(`当前业务行为仍被以下内容引用：${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}。请先逐项移除或替换引用，再删除该行为。`);
        return false;
      }
      currentDocument().behaviors.splice(index, 1);
      if (activeBehaviorRef === ref) {
        activeBehaviorRef = currentDocument().behaviors[Math.min(index, currentDocument().behaviors.length - 1)]?.behavior_ref || '';
      }
      return true;
    }

    function removeData(index) {
      const item = currentDocument().data_objects[index];
      if (!item) return false;
      const ref = item.data_ref;
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), 'data', ref);
      if (impacts.length) {
        window.alert(`当前数据仍被以下内容引用：${impacts.map(impact => `${impact.label}（${impact.ref}）`).join('、')}。请先逐项移除或替换引用，再删除该数据。`);
        return false;
      }
      currentDocument().data_objects.splice(index, 1);
      if (activeDataRef === ref) {
        activeDataRef = currentDocument().data_objects[Math.min(index, currentDocument().data_objects.length - 1)]?.data_ref || '';
      }
      return true;
    }

    async function mergeDuplicateData(index) {
      const current = currentDocument()?.data_objects?.[index];
      if (current) activeDataRef = current.data_ref;
      return mergeCurrentDataObjects();
    }

    function owningDepartmentChangeNeedsConfirmation(impact) {
      return Boolean(
        impact.fixedAssignments
        || impact.dynamicAssignments
        || impact.classificationFields
        || impact.formalWorkRoles
        || impact.internalCallCount
      );
    }

    function renderOwningDepartmentChangeModal() {
      const impact = owningDepartmentChangeState?.impact;
      if (!impact) return;
      const previousLabel = impact.previousDepartment || '未填写';
      const nextLabel = impact.nextDepartment || '未填写';
      const preservedReviewItems = [
        impact.formalWorkRoles ? `${impact.formalWorkRoles}个正式工作角色` : '',
        impact.internalCallCount ? `${impact.internalCallCount}条历史部门内调用` : ''
      ].filter(Boolean);
      const actorResetItems = [
        impact.fixedAssignments ? `清空${impact.fixedAssignments}个行为已有的固定执行部门和岗位` : '',
        impact.dynamicAssignments ? `将${impact.dynamicAssignments}个动态责任部门设置恢复为“固定部门和岗位—未选择”` : ''
      ].filter(Boolean);
      const actorResetMarkup = actorResetItems.length
        ? `<div class="merge-summary-item"><strong>执行主体：</strong>${actorResetItems.join('；')}。</div>`
        : '';
      const classificationResetMarkup = impact.classificationFields
        ? `<div class="merge-summary-item"><strong>能力归类：</strong>能力域、业务能力和归类状态恢复为未归类，当前有${impact.classificationFields}项已填内容会被重置。</div>`
        : '';
      const followupItems = [
        impact.fixedAssignments || impact.dynamicAssignments
          ? '从“流程步骤—业务流程”开始，逐项重新选择执行主体；页面将根据执行部门自动标记跨部门行为'
          : '',
        impact.classificationFields ? '回到“基本信息”重新确认能力域、业务能力和归类状态' : '',
        preservedReviewItems.length ? `在后续审核中重新确认${preservedReviewItems.join('和')}是否仍适用` : ''
      ].filter(Boolean);
      owningDepartmentChangeContent.innerHTML = `
        <p>归口部门是识别本部门行为和跨部门行为的基准。将归口部门从“${escapeHtml(previousLabel)}”改为“${escapeHtml(nextLabel)}”后，原责任判断不能继续沿用。</p>
        <div class="merge-summary">
          ${actorResetMarkup}
          ${classificationResetMarkup}
          <div class="merge-summary-item"><strong>保持不变：</strong>${impact.companyWideAssignments ? `${impact.companyWideAssignments}个“全公司通用”行为、` : ''}业务行为名称和说明、流程关系、输出物与数据、表单、技术标识${preservedReviewItems.length ? `，以及${preservedReviewItems.join('和')}` : ''}。</div>
        </div>
        ${preservedReviewItems.length ? `<div class="inline-warning" style="margin-top:14px">${escapeHtml(preservedReviewItems.join('和'))}不会被页面改写。归口部门变更后，请在后续审核中重新确认这些保留内容是否仍适用。</div>` : ''}
        <div class="inline-warning" style="margin-top:14px"><strong>确认后需要重新梳理：</strong>${escapeHtml(followupItems.join('；'))}。页面刷新或关闭后无法恢复本次重置前的内容；需要留存时，请先导出当前草稿。</div>
        <div id="owningDepartmentChangeError" class="inline-warning" style="margin-top:14px;display:none" role="alert"></div>`;
    }

    function openOwningDepartmentChange(nextDepartment) {
      const data = currentDocument();
      if (!data) return;
      const impact = owningDepartmentChangeImpact(data, nextDepartment);
      if (impact.nextDepartment === impact.previousDepartment) {
        render();
        return;
      }
      if (!owningDepartmentChangeNeedsConfirmation(impact)) {
        data.process.owning_department = impact.nextDepartment;
        touch();
        render();
        return;
      }
      owningDepartmentChangeState = {
        candidateIndex: currentIndex,
        processRef: text(data?.process?.process_ref).trim(),
        impact
      };
      renderOwningDepartmentChangeModal();
      owningDepartmentChangeModal.classList.add('show');
      owningDepartmentChangeModal.setAttribute('aria-hidden', 'false');
      confirmOwningDepartmentChangeButton.focus();
    }

    function closeOwningDepartmentChange() {
      owningDepartmentChangeState = null;
      owningDepartmentChangeModal.classList.remove('show');
      owningDepartmentChangeModal.setAttribute('aria-hidden', 'true');
      owningDepartmentChangeContent.innerHTML = '';
    }

    function showOwningDepartmentChangeError(message) {
      const errorBox = document.getElementById('owningDepartmentChangeError');
      if (!errorBox) return;
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    async function confirmOwningDepartmentChange() {
      const state = owningDepartmentChangeState;
      const entry = currentEntry();
      if (!state || !entry) return;
      if (
        state.candidateIndex !== currentIndex
        || state.processRef !== text(entry.data?.process?.process_ref).trim()
        || state.impact.previousDepartment !== text(entry.data?.process?.owning_department).trim()
      ) {
        showOwningDepartmentChangeError('当前流程已发生变化。页面没有执行重置，请取消后重新选择归口部门。');
        return;
      }
      confirmOwningDepartmentChangeButton.disabled = true;
      try {
        const next = buildOwningDepartmentResetDocument(entry.data, state.impact.nextDepartment);
        await ensureCompatibleValidationService('再次变更归口部门');
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: next })
        });
        const result = await readJsonResponse(response, '3001校验接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) throw new Error('重置后的技术引用校验未通过，当前草稿保持不变。');
        entry.data = next;
        activeFlowItemKind = 'behavior';
        if (!next.behaviors.some(item => item.behavior_ref === activeBehaviorRef)) {
          activeBehaviorRef = next.behaviors[0]?.behavior_ref || '';
        }
        const impact = state.impact;
        closeOwningDepartmentChange();
        touch();
        render();
        const resetItems = [
          impact.fixedAssignments + impact.dynamicAssignments
            ? `${impact.fixedAssignments + impact.dynamicAssignments}个执行主体设置`
            : '',
          impact.classificationFields ? '能力归类' : ''
        ].filter(Boolean);
        const nextStep = impact.fixedAssignments || impact.dynamicAssignments
          ? '请从“流程步骤—业务流程”开始重新梳理。'
          : impact.classificationFields
            ? '请在“基本信息”中重新确认能力归类。'
            : '请在后续审核中确认保留内容是否仍适用。';
        showStatus(
          `归口部门已改为“${impact.nextDepartment || '未填写'}”。${resetItems.length ? `页面已重置${resetItems.join('、')}；` : ''}${nextStep}`,
          'success'
        );
      } catch (error) {
        showOwningDepartmentChangeError(`变更未执行：${error.message}`);
        showStatus(`归口部门变更未执行：${error.message}`, 'error');
      } finally {
        confirmOwningDepartmentChangeButton.disabled = false;
      }
    }

    function handleAction(action, element) {
      const index = Number(element.dataset.index);
      const formIndex = Number(element.dataset.formIndex);
      const areaIndex = Number(element.dataset.areaIndex);
      let nextFocusPath = '';
      if (action === 'switch-tab') return setActiveWorkspaceTab(element.dataset.tab);
      if (action === 'return-editor') {
        activeEditorSection = 'process';
        return setActiveWorkspaceTab('editor');
      }
      if (action === 'fit-review-pattern') return reviewPatternViews.get(text(element.dataset.patternId))?.fit();
      if (action === 'reset-review-pattern') return reviewPatternViews.get(text(element.dataset.patternId))?.reset();
      if (action === 'toggle-review-pattern-expanded') {
        const patternId = text(element.dataset.patternId);
        expandedReviewPatternId = expandedReviewPatternId === patternId ? '' : patternId;
        return render();
      }
      if (action === 'fit-diagram') return diagramView?.fit();
      if (action === 'reset-diagram') return diagramView?.reset();
      if (action === 'toggle-diagram-example') {
        diagramExampleExpanded = !diagramExampleExpanded;
        return render();
      }
      if (action === 'toggle-diagram-expanded') {
        diagramExpanded = !diagramExpanded;
        return render();
      }
      if (action === 'focus-editor') return focusEditorItem(element.dataset.focusKind, element.dataset.focusRef);
      if (action === 'focus-export-warning') return focusExportWarning(element);
      if (action === 'refresh-structure-score') {
        structureScoreRunId += 1;
        structureScoreState = {
          status: 'idle',
          candidateIndex: -1,
          documentKey: '',
          result: null,
          message: ''
        };
        return render();
      }
      if (!currentDocument()) return;
      if (action === 'fit-flow-diagram') {
        diagramView?.fit();
        captureGraphViewport();
        return;
      }
      if (action === 'reset-flow-diagram') {
        graphStateManager.resetView(candidateStateKey(), 'flow');
        diagramView?.reset();
        captureGraphViewport();
        return;
      }
      if (action === 'fit-data-diagram') {
        dataDiagramView?.fit();
        captureGraphViewport();
        return;
      }
      if (action === 'reset-data-diagram') {
        graphStateManager.resetView(candidateStateKey(), 'data');
        dataDiagramView?.reset();
        captureGraphViewport();
        return;
      }
      if (action === 'undo-graph') return applyGraphHistory('undo');
      if (action === 'redo-graph') return applyGraphHistory('redo');
      if (action === 'add-graph-node') {
        return runGraphCommand({ type: 'add_behavior', behavior: newGraphBehavior() }, { successLabel: '已新增业务行为节点' });
      }
      if (action === 'start-flow-relation') {
        graphSelection = null;
        flowRelationDraft = { stage: 'type', relation_type: '', from_behavior_ref: null, to_behavior_ref: null, condition: '' };
        return render();
      }
      if (action === 'cancel-flow-relation') {
        flowRelationDraft = null;
        return render();
      }
      if (action === 'select-relation-endpoint') {
        if (!flowRelationDraft || !['source', 'target'].includes(flowRelationDraft.stage)) return;
        const ref = text(element.dataset.ref);
        if (flowRelationDraft.stage === 'source') {
          flowRelationDraft.from_behavior_ref = ref;
          flowRelationDraft.stage = 'target';
        } else {
          flowRelationDraft.to_behavior_ref = ref;
          flowRelationDraft.stage = 'confirm';
        }
        return render();
      }
      if (action === 'confirm-flow-relation') {
        if (!flowRelationDraft) return;
        const pendingDraft = flowRelationDraft;
        const relation = {
          relation_ref: newRef('relation'),
          relation_type: flowRelationDraft.relation_type,
          from_behavior_ref: flowRelationDraft.from_behavior_ref,
          to_behavior_ref: flowRelationDraft.to_behavior_ref,
          condition: text(flowRelationDraft.condition)
        };
        return runGraphCommand({ type: 'upsert_flow_relation', relation }, { successLabel: '流程关系已建立' }).then(ok => {
          flowRelationDraft = ok ? null : pendingDraft;
          render();
        });
      }
      if (action === 'apply-flow-property') return applyGraphPropertyDraft();
      if (action === 'delete-graph-selection') {
        if (!graphSelection || !['behavior', 'relation'].includes(graphSelection.kind)) return;
        return deleteGraphObject(graphSelection.kind, graphSelection.ref);
      }
      if (action === 'add-graph-data') {
        return runGraphCommand({ type: 'add_data_object', dataObject: newGraphDataObject() }, { successLabel: '已新增数据对象' });
      }
      if (action === 'merge-current-data') return mergeCurrentDataObjects();
      if (action === 'choose-data-behavior') {
        graphSelection = { kind: 'data-behavior-choice', dataRef: activeDataRef, behaviorRef: '' };
