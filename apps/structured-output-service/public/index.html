    function webGridVisibleRows(tableId) {
      const rows = webGridSession?.rows(tableId) || [];
      if (['data_fields', 'data_behavior_links', 'data_source_relations'].includes(tableId)) {
        if (!activeDataRef) return [];
        return rows.filter(row => row.data_ref === activeDataRef);
      }
      if (['form_behavior_links', 'form_areas'].includes(tableId)) {
        if (!activeFormRef) return [];
        return rows.filter(row => row.form_ref === activeFormRef);
      }
      if (tableId === 'form_items') {
        if (!activeFormRef || !activeAreaRef) return [];
        return rows.filter(row => row.form_ref === activeFormRef && row.area_ref === activeAreaRef);
      }
      if (tableId === 'field_source_links') return activeFormItemRef ? rows.filter(row => row.item_ref === activeFormItemRef) : [];
      return rows;
    }

    function gridLookupRows(lookup, rowData = {}) {
      if (lookup === 'behaviors') {
        const behaviors = (currentDocument()?.behaviors || []).filter(item => item.node_type === 'action');
        const counts = new Map();
        behaviors.forEach(item => {
          const name = text(item.behavior_name);
          if (name) counts.set(name, (counts.get(name) || 0) + 1);
        });
        return behaviors.map(item => {
          const name = text(item.behavior_name);
          const duplicate = name && counts.get(name) > 1;
          return { value: item.behavior_ref, label: duplicate ? `${name}（技术标识：${item.behavior_ref}）` : (name || item.behavior_ref) };
        });
      }
      let rows = webGridSession?.rows(lookup)?.filter(row => !row._deleted) || [];
      if (lookup === 'form_areas' && rowData.form_ref) rows = rows.filter(row => row.form_ref === rowData.form_ref);
      const fields = {
        data_objects: ['data_ref', 'data_name'], data_fields: ['field_ref', 'field_name'], forms: ['form_ref', 'form_name'],
        form_areas: ['area_ref', 'area_title'], form_items: ['item_ref', 'item_name']
      }[lookup] || ['_row_id', '_row_id'];
      const counts = new Map();
      rows.forEach(row => {
        const name = text(row[fields[1]]);
        if (name) counts.set(name, (counts.get(name) || 0) + 1);
      });
      return rows.map(row => {
        const ref = row[fields[0]];
        const name = text(row[fields[1]]);
        const duplicate = name && counts.get(name) > 1;
        if (lookup === 'data_fields') {
          const owner = webGridSession.rows('data_objects').find(item => !item._deleted && item.data_ref === row.data_ref);
          const ownerName = owner?.data_name || row.data_ref || '未命名数据对象';
          return { value: ref, label: `${ownerName} / ${name || ref}${row.field_type ? `（${row.field_type}）` : ''}${duplicate ? ` · ${ref}` : ''}` };
        }
        return { value: ref, label: duplicate ? `${name}（技术标识：${ref}）` : (name || ref) };
      });
    }

    function gridLookupLabel(lookup, value, rowData = {}) {
      if (value == null || value === '') return '';
      return gridLookupRows(lookup, rowData).find(item => item.value === value)?.label || value;
    }

    function selectGridParent(tableId, row) {
      if (tableId === 'data_objects') return updateAuthoringSelection({ dataRef: row.data_ref });
      if (tableId === 'data_fields') return updateAuthoringSelection({ dataFieldRef: row.field_ref });
      if (['data_behavior_links', 'data_source_relations'].includes(tableId)) return updateAuthoringSelection({ dataRef: row.data_ref });
      if (tableId === 'forms') return updateAuthoringSelection({ formRef: row.form_ref });
      if (tableId === 'form_behavior_links') return updateAuthoringSelection({ formRef: row.form_ref });
      if (tableId === 'form_areas') return updateAuthoringSelection({ formRef: row.form_ref, areaRef: row.area_ref });
      if (tableId === 'form_items') return updateAuthoringSelection({ formRef: row.form_ref, areaRef: row.area_ref, formItemRef: row.item_ref });
      if (tableId === 'field_source_links') {
        const item = webGridSession.rows('form_items').find(entry => entry.item_ref === row.item_ref);
        if (item) return updateAuthoringSelection({ formRef: item.form_ref, areaRef: item.area_ref, formItemRef: item.item_ref });
      }
      return null;
    }

    function selectGridIssueContext(tableId, row) {
      selectGridParent(tableId, row);
    }

    function updateGridToolbarSelection(tableId, rowData) {
      webGridSelectedRows[tableId] = rowData._row_id;
      const panel = workspace.querySelector(`[data-grid-panel="${CSS.escape(tableId)}"]`);
      panel?.querySelectorAll('tr[data-grid-row-id]').forEach(row => row.classList.toggle('grid-row-selected', row.dataset.gridRowId === rowData._row_id));
      panel?.querySelector('[data-action="grid-duplicate-row"]')?.toggleAttribute('disabled', !gridParentState(tableId).ready);
      panel?.querySelector('[data-action="grid-move-row-up"]')?.removeAttribute('disabled');
      panel?.querySelector('[data-action="grid-move-row-down"]')?.removeAttribute('disabled');
      const deleteButton = panel?.querySelector('[data-action="grid-delete-row"]');
      if (deleteButton) {
        deleteButton.removeAttribute('disabled');
        deleteButton.textContent = rowData._deleted ? '恢复选中行' : '删除选中行';
      }
    }

    function activeGridContextKey() {
      return `${activeDataRef}|${activeFormRef}|${activeAreaRef}|${activeFormItemRef}`;
    }

    function refreshNativeGridPanel(tableId) {
      const panel = workspace.querySelector(`[data-grid-panel="${CSS.escape(tableId)}"]`);
      if (panel) panel.outerHTML = renderWebGridPanel(tableId);
    }

    function refreshNativeGridPanelAndFocus(tableId, rowId, column) {
      refreshNativeGridPanel(tableId);
      requestAnimationFrame(() => focusNativeGridCell(tableId, rowId, column));
    }

    function refreshNativeGridDependents(tableId) {
      const dependents = {
        data_objects: ['data_fields', 'data_behavior_links', 'data_source_relations'],
        forms: ['form_behavior_links', 'form_areas', 'form_items', 'field_source_links'],
        form_areas: ['form_items', 'field_source_links'],
        form_items: ['field_source_links']
      }[tableId] || [];
      dependents.forEach(refreshNativeGridPanel);
    }

    function applyNativeGridRangeStyles(tableId) {
      const rows = nativeGridRows(tableId);
      const columns = nativeGridColumns(tableId);
      const bounds = nativeGridRangeBounds(tableId, rows, columns);
      const selectedRows = new Set(bounds ? rows.slice(bounds.rowStart, bounds.rowEnd + 1).map(row => row._row_id) : []);
      const selectedColumns = new Set(bounds ? columns.slice(bounds.columnStart, bounds.columnEnd + 1).map(column => column.key) : []);
      workspace.querySelectorAll(`[data-grid-panel="${CSS.escape(tableId)}"] [data-grid-cell-container]`).forEach(cell => {
        cell.classList.toggle('grid-cell-range-selected', selectedRows.has(cell.dataset.gridRowId) && selectedColumns.has(cell.dataset.gridColumn));
      });
    }

    function selectNativeGridRow(tableId, rowId, options = {}) {
      const rowData = webGridSession?.rows(tableId).find(row => row._row_id === rowId);
      if (!rowData) return;
      updateGridToolbarSelection(tableId, rowData);
      if (options.column) {
        const previous = webGridRanges[tableId];
        webGridRanges[tableId] = options.extend && previous?.anchorRowId
          ? { ...previous, currentRowId: rowId, currentColumn: options.column }
          : { anchorRowId: rowId, anchorColumn: options.column, currentRowId: rowId, currentColumn: options.column };
        applyNativeGridRangeStyles(tableId);
      }
      const previousContext = activeGridContextKey();
      selectGridParent(tableId, rowData);
      ensureActiveWebGridContext();
      if (previousContext !== activeGridContextKey()) refreshNativeGridDependents(tableId);
    }

    function clearNativeGridIssues() {
      if (!webGridIssues.length) return;
      webGridIssues = [];
      workspace.querySelector('.web-grid-issues')?.remove();
      workspace.querySelectorAll('.grid-cell-error').forEach(cell => cell.classList.remove('grid-cell-error'));
    }

    function updateNativeGridStatus() {
      const dirty = Boolean(webGridSession?.isDirty());
      const status = workspace.querySelector('.web-grid-status');
      const previousDirty = Boolean(status?.classList.contains('dirty'));
      if (status) {
        status.textContent = dirty ? '表格中有未应用修改；当前JSON尚未改变。' : '表格内容与当前JSON一致。';
        status.classList.toggle('dirty', dirty);
      }
      workspace.querySelector('[data-action="apply-web-grid"]')?.toggleAttribute('disabled', !dirty || webGridApplyInFlight);
      workspace.querySelector('[data-action="discard-web-grid"]')?.toggleAttribute('disabled', !dirty || webGridApplyInFlight);
      if (dirty !== previousDirty) refreshVisibleGovernanceCheckUi();
    }

    function nativeGridControlValue(control) {
      if (control.matches('input[type="checkbox"]')) return control.checked;
      return control.value;
    }

    function updateNativeGridCell(control) {
      if (!control?.matches?.('[data-grid-cell]')) return;
      const tableId = control.dataset.gridTableId;
      const rowId = control.dataset.gridRowId;
      const column = control.dataset.gridColumn;
      const rowBefore = webGridSession.rows(tableId).find(item => item._row_id === rowId);
      const columnSpec = webGridSession.definition(tableId)?.columns?.find(item => item.key === column);
      if (rowBefore && columnSpec && isNativeGridCellReadOnly(tableId, rowBefore, columnSpec)) {
        refreshNativeGridPanelAndFocus(tableId, rowId, column);
        showStatus('该单元格由对象字段稳定引用确定，不能直接输入或粘贴。清除对象字段引用后才可进入兼容调整状态。', 'error');
        return;
      }
      webGridSession.updateCell(tableId, rowId, column, nativeGridControlValue(control));
      if (tableId === 'field_source_links' && column === 'source_type') {
        const sourceType = text(control.value);
        if (sourceType === 'external_system') webGridSession.updateCell(tableId, rowId, 'source_data_ref', null);
        if (sourceType === 'process_data') {
          webGridSession.updateCell(tableId, rowId, 'source_system_name', '');
          webGridSession.updateCell(tableId, rowId, 'source_data_name', '');
        }
      }
      if (tableId === 'form_items' && column === 'data_field_ref') {
        const row = webGridSession.rows('form_items').find(item => item._row_id === rowId && !item._deleted);
        const dataField = webGridSession.rows('data_fields').find(item => item.field_ref === row?.data_field_ref && !item._deleted);
        const dataObject = webGridSession.rows('data_objects').find(item => item.data_ref === dataField?.data_ref && !item._deleted);
        if (row && dataField && dataObject) {
          applyFormFieldReferenceDefaults(row, dataObject, dataField, (key, value) => {
            webGridSession.updateCell('form_items', rowId, key, value);
          });
        }
      }
      clearNativeGridIssues();
      updateNativeGridStatus();
    }

    function applyNativeGridFilter(tableId, query) {
      webGridFilters[tableId] = query;
      const panel = workspace.querySelector(`[data-grid-panel="${CSS.escape(tableId)}"]`);
      if (!panel) return;
      const normalized = text(query).trim().toLowerCase();
      let visible = 0;
      panel.querySelectorAll('tbody tr[data-grid-row-id]').forEach(tableRow => {
        const row = webGridSession.rows(tableId).find(item => item._row_id === tableRow.dataset.gridRowId);
        const matches = !normalized || Object.entries(row || {}).filter(([key]) => !key.startsWith('_')).some(([, value]) => text(value).toLowerCase().includes(normalized));
        tableRow.hidden = !matches;
        if (matches) visible += 1;
      });
      let empty = panel.querySelector('[data-grid-filter-empty]');
      if (!visible && panel.querySelector('tbody tr[data-grid-row-id]')) {
        if (!empty) {
          empty = document.createElement('tr');
          empty.className = 'web-grid-empty-row';
          empty.dataset.gridFilterEmpty = 'true';
          empty.innerHTML = `<td colspan="${nativeGridColumns(tableId).length + 1}">没有符合查找条件的记录。</td>`;
          panel.querySelector('tbody')?.appendChild(empty);
        }
      } else empty?.remove();
      applyNativeGridRangeStyles(tableId);
    }

    function focusNativeGridCell(tableId, rowId, column) {
      const selector = `[data-grid-cell][data-grid-table-id="${CSS.escape(tableId)}"][data-grid-row-id="${CSS.escape(rowId)}"][data-grid-column="${CSS.escape(column)}"]`;
      const control = workspace.querySelector(selector);
      control?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      control?.focus({ preventScroll: true });
      if (control?.matches('input[type="text"]')) control.select();
      return Boolean(control);
    }

    function continueNativeGridInput(control) {
      const tableId = control.dataset.gridTableId;
      const rows = nativeGridRows(tableId);
      const rowIndex = rows.findIndex(row => row._row_id === control.dataset.gridRowId);
      const nextRow = rows[rowIndex + 1];
      if (nextRow) focusNativeGridCell(tableId, nextRow._row_id, control.dataset.gridColumn);
    }

    function nativeGridPasteOptions(tableId, column, row) {
      if (column.editor === 'select') return column.values || [];
      if (column.editor === 'lookup') return gridLookupRows(column.lookup, row || {});
      return [];
    }

    function restoreWebGridTables(snapshot) {
      Object.entries(snapshot || {}).forEach(([tableId, rows]) => webGridSession.replaceRows(tableId, rows));
    }

    function applyNativeGridPaste(control, clipboardText) {
      if (blockWebGridCompositionTransition()) return false;
      const tableId = control.dataset.gridTableId;
      const columns = nativeGridColumns(tableId);
      let rows = nativeGridRows(tableId);
      const startRow = rows.findIndex(row => row._row_id === control.dataset.gridRowId);
      const startColumn = columns.findIndex(column => column.key === control.dataset.gridColumn);
      const matrix = globalThis.NativeWebGrid.parseClipboardGrid(clipboardText);
      const plan = globalThis.NativeWebGrid.planPaste({
        matrix,
        columns,
        startColumn,
        optionResolver(column, rowOffset) { return nativeGridPasteOptions(tableId, column, rows[startRow + rowOffset]); }
      });
      if (plan.errors) {
        showStatus(`没有粘贴任何内容。${plan.errors.slice(0, 5).map(item => item.row ? `第${item.row}行第${item.column}列（${item.fieldLabel}）：${item.message}` : item.message).join('；')}`, 'error');
        return false;
      }
      if ((webGridFilters[tableId] || webGridSorts[tableId]) && startRow + plan.height > rows.length) {
        showStatus('当前表格正在查找或显示排序。请先清除查找和显示排序，再粘贴需要新增行的区域。', 'error');
        return false;
      }
      const snapshot = webGridSession.allRows();
      try {
        while (rows.length < startRow + plan.height) {
          const added = createGridRowInSession(tableId, { ...gridParentContext(tableId), select: false, silent: true });
          if (!added) throw new Error(`当前上级记录不允许继续新增${webGridSession.definition(tableId).label}。`);
          rows = nativeGridRows(tableId);
        }
        if (tableId === 'form_items') {
          const targetColumns = columns.slice(startColumn, startColumn + plan.width);
          const fieldColumnOffset = targetColumns.findIndex(column => column.key === 'data_field_ref');
          plan.values.forEach((sourceRow, rowOffset) => {
            const targetRow = rows[startRow + rowOffset];
            const projectedFieldRef = fieldColumnOffset >= 0 ? text(sourceRow[fieldColumnOffset]) : text(targetRow?.data_field_ref);
            if (projectedFieldRef && targetColumns.some(column => ['business_data_ref', 'item_type'].includes(column.key))) {
              throw new Error('引用对象字段后，业务数据归属和字段类型为派生只读单元格，不能在同一粘贴区域中写入');
            }
          });
        }
        plan.values.forEach((sourceRow, rowOffset) => {
          sourceRow.forEach((value, columnOffset) => {
            webGridSession.updateCell(tableId, rows[startRow + rowOffset]._row_id, columns[startColumn + columnOffset].key, value);
          });
        });
        if (tableId === 'form_items') {
          rows.slice(startRow, startRow + plan.height).forEach(row => {
            const dataField = webGridSession.rows('data_fields').find(item => !item._deleted && item.field_ref === row.data_field_ref);
            const dataObject = webGridSession.rows('data_objects').find(item => !item._deleted && item.data_ref === dataField?.data_ref);
            if (dataField && dataObject) applyFormFieldReferenceDefaults(row, dataObject, dataField, (key, value) => webGridSession.updateCell('form_items', row._row_id, key, value));
          });
        }
      } catch (error) {
        restoreWebGridTables(snapshot);
        showStatus(`没有粘贴任何内容。${error.message}`, 'error');
        return false;
      }
      clearNativeGridIssues();
      render();
      showStatus(`已粘贴${plan.height}行 × ${plan.width}列。修改仍在表格工作副本中。`, 'success');
      return true;
    }

    async function copyNativeGridRange(tableId) {
      const rows = nativeGridRows(tableId);
      const columns = nativeGridColumns(tableId);
      const bounds = nativeGridRangeBounds(tableId, rows, columns);
      if (!bounds || (bounds.rowStart === bounds.rowEnd && bounds.columnStart === bounds.columnEnd)) return false;
      const matrix = rows.slice(bounds.rowStart, bounds.rowEnd + 1).map(row => columns
        .slice(bounds.columnStart, bounds.columnEnd + 1)
        .map(column => nativeGridDisplayValue(column, row[column.key], row)));
      await navigator.clipboard.writeText(globalThis.NativeWebGrid.toClipboardText(matrix));
      showStatus(`已复制${matrix.length}行 × ${matrix[0]?.length || 0}列。`, 'success');
      return true;
    }

    function validationIssueFocusPath(issue = {}) {
      const decodePointerPart = value => text(value).replace(/~1/g, '/').replace(/~0/g, '~');
      const parts = text(issue.instancePath).split('/').slice(1).map(decodePointerPart).filter(Boolean);
      const missingProperty = issue.keyword === 'required' ? text(issue.params?.missingProperty) : '';
      const additionalProperty = issue.keyword === 'additionalProperties' ? text(issue.params?.additionalProperty) : '';
      if (missingProperty) parts.push(missingProperty);
      else if (additionalProperty) parts.push(additionalProperty);
      return parts.join('.');
    }

    function resolveWebGridValidationTarget(documentValue, issue = {}) {
      const focusPath = validationIssueFocusPath(issue);
      const fallback = { focusPath, focusPaths: focusPath ? [focusPath] : [] };
      if (!focusPath || !documentValue) return fallback;
      const stable = stableQueueTarget({ focusPath }, documentValue);
      const resolved = resolveGovernanceQueueIssue({
        stableRef: stable.stableRef,
        path: stable.normalizedPath,
        focusPath
      }, documentValue);
      if (!resolved) return fallback;
      const tableId = text(resolved.tableId);
      const definition = tableId && webGridSession ? webGridSession.definition(tableId) : null;
      const gridRefKey = text(resolved.gridRefKey || definition?.refField);
      const gridRowRef = text(resolved.gridRowRef || resolved.stableRef);
      const row = tableId && gridRefKey && gridRowRef && webGridSession
        ? webGridSession.rows(tableId).find(item => !item._deleted && text(item[gridRefKey]) === gridRowRef)
        : null;
      const columns = tableId ? nativeGridColumns(tableId) : [];
      const requestedColumn = text(resolved.gridColumn);
      const column = columns.some(item => item.key === requestedColumn)
        ? requestedColumn
        : columns.find(item => item.editor !== 'readonly')?.key || columns[0]?.key || '';
      return {
        ...fallback,
        ...resolved,
        tableId,
        rowId: row?._row_id || '',
        column,
        gridRowRef,
        gridRefKey
      };
    }

    async function prepareWebGridCandidate() {
      const data = currentDocument();
      const prepared = webGridSession.prepare(data, gridSourceKey(data), webGridAdapterOptions());
      if (!prepared.ok) return prepared;
      const validation = await validateGraphDocument(prepared.document);
      if (!validation.valid) {
        const invalidCandidate = prepared.document;
        prepared.ok = false;
        prepared.document = clone(data);
        (validation.errors || []).forEach(item => prepared.errors.push({
          ...resolveWebGridValidationTarget(invalidCandidate, item),
          severity: 'error',
          code: item.keyword || 'SCHEMA_VALIDATION',
          message: `${validationErrorLocation(item)}：${item.message}`
        }));
      }
      return prepared;
    }

    function captureWebGridApplyState() {
      const entry = currentEntry();
      if (!entry || !webGridSession) throw new Error('当前没有可应用的表格工作副本');
      return {
        entry,
        candidateKey: candidateStateKey(entry),
        documentFingerprint: globalThis.GraphEditorState.fingerprint(entry.data),
        session: webGridSession,
        sessionRevision: Number(webGridSession.revision?.() || 0),
        sessionSourceKey: webGridSession.sourceKey()
      };
    }

    function assertWebGridApplyState(state) {
      const entry = currentEntry();
      const unchanged = entry === state.entry
        && candidateStateKey(entry) === state.candidateKey
        && webGridSession === state.session
        && Number(webGridSession?.revision?.() || 0) === state.sessionRevision
        && webGridSession?.sourceKey?.() === state.sessionSourceKey
        && globalThis.GraphEditorState.fingerprint(entry?.data) === state.documentFingerprint;
      if (!unchanged) {
        throw new Error('结构检查期间当前候选或表格工作副本发生了变化。系统没有应用旧快照；请核对保留的输入后重新应用');
      }
      return entry;
    }

    function setWebGridApplyInFlight(value) {
      webGridApplyInFlight = Boolean(value);
      const dirty = Boolean(webGridSession?.isDirty());
      workspace.querySelector('[data-action="apply-web-grid"]')?.toggleAttribute('disabled', !dirty || webGridApplyInFlight);
      workspace.querySelector('[data-action="discard-web-grid"]')?.toggleAttribute('disabled', !dirty || webGridApplyInFlight);
      const pendingLocked = webGridApplyInFlight || formFieldBatchApplying || Boolean(pendingTransitionResolution);
      continuePendingEditingButton.disabled = pendingLocked;
      discardPendingEditButton.disabled = pendingLocked;
      applyPendingEditButton.disabled = pendingLocked || Boolean(pendingTransition && !pendingTransition.pending?.canApply);
    }

    function commitWebGridDocument(candidate, details, applyState) {
      const entry = assertWebGridApplyState(applyState);
      const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => ({
        ok: true,
        document: clone(candidate),
        details
      }));
      if (!result.ok) throw new Error(result.message || '表格修改未能写入当前流程');
      entry.data = result.document;
      invalidateCurrentChecks(entry);
      refreshCandidateDirty(entry);
      return result.document;
    }

    function webGridCommitDriver(applyState) {
      return {
        getSource() { return { document: currentDocument(), revisionKey: gridSourceKey() }; },
        validate: prepareWebGridCandidate,
        commit(candidate, details) { return commitWebGridDocument(candidate, details, applyState); }
      };
    }

    async function applyWebGridChanges(options = {}) {
      if (webGridApplyInFlight) {
        showStatus('表格修改正在检查，请等待本次检查完成。', 'error');
        return false;
      }
      if (updateFieldsModalState) {
        showStatus('请先确认或取消当前“更新字段”选择，再应用整批表格修改。', 'error');
        return false;
      }
      if (!webGridSession?.isDirty()) {
        if (options.switchMode) activeDataEditingMode = options.switchMode;
        resetWebGridEditor({ preserveViewState: true });
        closePendingEditModal({ restoreFocus: false });
        if (typeof options.after === 'function') options.after();
        else {
          render();
          restoreActiveWebGridFocusAfterRender();
        }
        return true;
      }
      const applyState = captureWebGridApplyState();
      setWebGridApplyInFlight(true);
      setBusy(true, '正在检查表格修改……');
      try {
        const driver = webGridCommitDriver(applyState);
        const prepared = await driver.validate();
        assertWebGridApplyState(applyState);
        webGridIssues = [...(prepared.errors || []), ...(prepared.warnings || [])];
        if (!prepared.ok) {
          closePendingEditModal();
          render();
          requestAnimationFrame(() => workspace.querySelector('.web-grid-issues')?.focus());
          showStatus(`表格修改有${prepared.errors.length}项错误，当前JSON保持不变。`, 'error');
          return false;
        }
        const source = driver.getSource().document;
        if (globalThis.GraphEditorState.fingerprint(source) === globalThis.GraphEditorState.fingerprint(prepared.document)) {
          resetWebGridEditor({ preserveViewState: true });
          if (options.switchMode) activeDataEditingMode = options.switchMode;
          closePendingEditModal({ restoreFocus: false });
          if (typeof options.after === 'function') options.after();
          else {
            render();
            restoreActiveWebGridFocusAfterRender();
          }
          showStatus('表格内容没有产生数据变化，无需应用。', 'success');
          return true;
        }
        const changeCount = prepared.summary.added + prepared.summary.updated + prepared.summary.deleted;
        assertWebGridApplyState(applyState);
        driver.commit(prepared.document, { source: 'web-grid', changeCount, tableCount: globalThis.ProcessV7GridAdapter.TABLE_IDS.length });
        resetWebGridEditor({ preserveViewState: true });
        if (options.switchMode) activeDataEditingMode = options.switchMode;
        closePendingEditModal({ restoreFocus: false });
        updateCandidateList();
        if (typeof options.after === 'function') options.after();
        else {
          render();
          restoreActiveWebGridFocusAfterRender();
        }
        showStatus(`已应用本次表格修改${changeCount ? `，涉及${changeCount}项记录变化` : ''}。执行一次撤销可恢复应用前内容。`, 'success');
        return true;
      } catch (error) {
        closePendingEditModal();
        showStatus(`表格修改未应用：${error.message}`, 'error');
        return false;
      } finally {
        setBusy(false);
        setWebGridApplyInFlight(false);
      }
    }

    function discardWebGridChanges(options = {}) {
      resetWebGridEditor({ preserveViewState: true });
      if (options.switchMode) activeDataEditingMode = options.switchMode;
      closePendingEditModal({ restoreFocus: false });
      if (typeof options.after === 'function') options.after();
      else {
        render();
        restoreActiveWebGridFocusAfterRender();
      }
      showStatus('已放弃尚未应用的表格修改。当前JSON没有改变。', 'success');
    }

    function getPendingEdit() {
      if (updateFieldsModalIsDirty()) {
        const selectedRefs = currentUpdateFieldsModalRefs();
        return {
          kind: 'update-fields-selection',
          label: '尚未确认的更新字段选择',
          canApply: selectedRefs.length > 0,
          apply: confirmUpdateFieldsSelection,
          discard() {
            closeUpdateFieldsModal(true);
            return true;
          }
        };
      }
      const session = editSessionManager.get();
      if (session && editSessionManager.isDirty(session.candidateKey)) {
        return {
          kind: session.editorKind,
          label: sessionLabel(session),
          canApply: editSessionManager.canApply(session.candidateKey),
          apply: applyCurrentEditSession,
          discard() {
            if (session.editorKind === 'form-field-batch') {
              return closeFormFieldBatchModal({ render: true });
            }
            const discarded = editSessionManager.discard();
            if (discarded?.editorKind === 'new-flow-relation-wizard') flowRelationDraft = null;
            if (['data-behavior-choice', 'data-edge-operations'].includes(discarded?.editorKind)) graphSelection = null;
            refreshUnappliedIndicators();
            render();
            return true;
          }
        };
      }
      if (webGridSession?.isDirty()) {
        return {
          kind: 'web-grid',
          label: '表格工作副本',
          canApply: true,
          apply: () => applyWebGridChanges(),
          discard() {
            resetWebGridEditor({ preserveViewState: true });
            refreshUnappliedIndicators();
            return true;
          }
        };
      }
      return null;
    }

    function closePendingEditModal(options = {}) {
      const transition = pendingTransition;
      pendingTransition = null;
      pendingEditModal.classList.remove('show');
      pendingEditModal.setAttribute('aria-hidden', 'true');
      if (options.restoreFocus === false) return;
      if (transition?.cancelAction) transition.cancelAction();
      if (transition?.invoker?.isConnected) {
        transition.invoker.focus({ preventScroll: true });
        window.scrollTo(transition.scrollX, transition.scrollY);
      } else if (pendingEditModal.contains(document.activeElement)) {
        document.activeElement.blur();
      }
    }

    function requestTransition(intent, action, options = {}) {
      if (pendingTransitionResolution) {
        showStatus('正在处理未应用修改，请等待本次处理完成。', 'error');
        if (typeof options.cancelAction === 'function') options.cancelAction();
        return true;
      }
      if (webGridApplyInFlight) {
        showStatus('表格修改正在检查，请等待本次检查完成后再切换或继续其他操作。', 'error');
        if (typeof options.cancelAction === 'function') options.cancelAction();
        return true;
      }
      if (formFieldBatchApplying) {
        showStatus('批量字段正在检查，请等待本次检查完成后再切换或继续其他操作。', 'error');
        if (typeof options.cancelAction === 'function') options.cancelAction();
        return true;
      }
      if (blockWebGridCompositionTransition()) {
        if (typeof options.cancelAction === 'function') options.cancelAction();
        return true;
      }
      const pending = getPendingEdit();
      if (!pending) {
        action();
        return true;
      }
      pendingTransition = {
        intent: text(intent) || '继续操作',
        action,
        pending,
        invoker: options.invoker || (document.activeElement instanceof HTMLElement ? document.activeElement : null),
        cancelAction: options.cancelAction || null,
        scrollX: window.scrollX,
        scrollY: window.scrollY
      };
      pendingEditTitle.textContent = `${pending.label}还有未应用修改`;
      pendingEditText.textContent = pending.canApply
        ? `${pending.label}中的输入尚未写入当前JSON，也不会进入下载文件。请选择如何处理后再${pendingTransition.intent}。`
        : `${pending.label}尚未完成，当前不能应用。请继续编辑，或者明确放弃本次编制后再${pendingTransition.intent}。`;
      applyPendingEditButton.disabled = !pending.canApply;
      applyPendingEditButton.title = pending.canApply ? '' : '请先补齐当前编制所需内容';
      pendingEditModal.classList.add('show');
      pendingEditModal.setAttribute('aria-hidden', 'false');
      continuePendingEditingButton.focus();
      return true;
    }

    function runDocumentTransaction(mutator, options = {}) {
      const entry = currentEntry();
      if (!entry) return { ok: false, changed: false, code: 'NO_DOCUMENT' };
      const nextDocument = clone(entry.data);
      let details = {};
      try {
        details = mutator(nextDocument) || {};
      } catch (error) {
        showStatus(`${options.failureLabel || '本次操作'}未执行：${error.message}。当前草稿保持不变。`, 'error');
        return { ok: false, changed: false, code: 'MUTATION_FAILED', error };
      }
      const fingerprint = globalThis.GraphEditorState.fingerprint;
      if (fingerprint(entry.data) === fingerprint(nextDocument)) {
        if (options.noChangeLabel) showStatus(options.noChangeLabel, 'success');
        return { ok: true, changed: false, document: entry.data, details };
      }
      const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => ({
        ok: true,
        document: nextDocument,
        details: { ...details, source: options.source || 'document-transaction' }
      }));
      if (!result.ok) {
        showStatus(result.message || `${options.failureLabel || '本次操作'}未执行`, 'error');
        return { ok: false, changed: false, code: 'COMMIT_FAILED', result };
      }
      entry.data = result.document;
      if (options.resetEditSessionOnSuccess !== false) {
        editSessionManager.reset();
        graphSelection = null;
      }
      if (typeof options.afterCommit === 'function') options.afterCommit(entry.data, result.details || details);
      invalidateCurrentChecks(entry);
      resetWebGridEditor({ preserveViewState: true });
      refreshCandidateDirty(entry);
      render();
      if (options.successLabel) showStatus(options.successLabel, 'success');
      refreshValidationAfterGraphCommand(entry.data);
      return { ok: true, changed: true, document: entry.data, details: result.details || details };
    }

    function deletionReferencePaths(documentValue, targetRef, targetPath) {
      if (!targetRef) return [];
      const references = [];
      const visit = (value, path = '') => {
        if (path === targetPath || path.startsWith(`${targetPath}.`)) return;
        if (typeof value === 'string') {
          if (value === targetRef) references.push(path);
          return;
        }
        if (!value || typeof value !== 'object') return;
        if (Array.isArray(value)) {
          value.forEach((item, index) => visit(item, path ? `${path}.${index}` : String(index)));
          return;
        }
        Object.entries(value).forEach(([key, item]) => visit(item, path ? `${path}.${key}` : key));
      };
      visit(documentValue);
      return [...new Set(references)];
    }

    function deletionReferenceLabel(path) {
      if (path.includes('.updated_field_refs.')) return '数据行为关系的更新字段';
      if (path.endsWith('.data_field_ref')) return '表单字段中的对象字段';
      if (path.endsWith('.business_data_ref')) return '表单字段中的数据对象';
      if (path.endsWith('.source_data_ref')) return '字段取值来源';
      if (path.endsWith('.actor_department_data_ref')) return '执行部门来源数据';
      if (path.endsWith('.available_from_behavior_ref')) return '数据来源可用起点';
      if (path.includes('.created_data_link_refs.')) return '历史迁移记录的数据关系';
      if (path.includes('.created_relation_refs.')) return '历史迁移记录的流程关系';
      if (path.endsWith('.behavior_ref') || path.endsWith('.from_behavior_ref') || path.endsWith('.to_behavior_ref')) return '业务行为或流程关系';
      return `结构位置 ${path}`;
    }

    function requestConfirmedDeletion(options = {}) {
      const documentValue = currentDocument();
      if (!documentValue) return false;
      const references = typeof options.analyze === 'function'
        ? options.analyze(documentValue)
        : deletionReferencePaths(documentValue, options.targetRef, options.targetPath).map(deletionReferenceLabel);
      const uniqueReferences = [...new Set((references || []).filter(Boolean))];
      if (uniqueReferences.length) {
        window.alert(`不能删除${options.label}：它仍被${uniqueReferences.join('、')}引用。请先逐项移除或替换引用，系统不会自动级联删除。`);
        return false;
      }
      const impactText = options.impact ? `\n\n影响：${options.impact}` : '';
      if (!window.confirm(`确定删除${options.label}吗？${impactText}\n\n确认后会形成一次可撤销操作，不会自动删除其他引用内容。`)) return false;
      const result = runDocumentTransaction(options.mutate, {
        source: 'confirmed-deletion',
        failureLabel: `删除${options.label}`,
        successLabel: `已删除${options.label}。执行一次撤销可恢复删除前的完整内容。`,
        afterCommit: options.afterCommit
      });
      return result.ok && result.changed;
    }

    async function resolvePendingTransition(resolution) {
      if (pendingTransitionResolution) {
        showStatus('正在处理未应用修改，请等待本次处理完成。', 'error');
        return false;
      }
      const transition = pendingTransition;
      if (!transition) return false;
      if (resolution === 'continue') {
        closePendingEditModal();
        return true;
      }
      if (resolution !== 'discard' && (resolution !== 'apply' || !transition.pending.canApply)) return false;
      const resolutionToken = { transition, resolution };
      pendingTransitionResolution = resolutionToken;
      continuePendingEditingButton.disabled = true;
      discardPendingEditButton.disabled = true;
      applyPendingEditButton.disabled = true;
      try {
        const succeeded = resolution === 'discard'
          ? (await transition.pending.discard(), true)
          : await transition.pending.apply();
        if (pendingTransitionResolution !== resolutionToken) return false;
        if (!succeeded) {
          closePendingEditModal();
          return false;
        }
        closePendingEditModal({ restoreFocus: false });
        pendingTransitionResolution = null;
        requestTransition(transition.intent, transition.action, {
          invoker: transition.invoker,
          cancelAction: transition.cancelAction
        });
        return true;
      } finally {
        if (pendingTransitionResolution === resolutionToken) pendingTransitionResolution = null;
        const locked = webGridApplyInFlight || formFieldBatchApplying;
        continuePendingEditingButton.disabled = locked;
        discardPendingEditButton.disabled = locked;
        applyPendingEditButton.disabled = locked || Boolean(pendingTransition && !pendingTransition.pending?.canApply);
      }
    }

    function captureVisibleWebGridScroll() {
      const shell = workspace.querySelector('.web-grid-shell[id^="webGrid-"]');
      if (!shell) return;
      const tableId = shell.id.slice('webGrid-'.length);
      webGridScrollPositions[tableId] = { top: shell.scrollTop, left: shell.scrollLeft };
    }

    function restoreWebGridTableView(tableId, options = {}) {
      const shell = tableId ? workspace.querySelector(`#webGrid-${CSS.escape(tableId)}`) : null;
      const position = tableId ? webGridScrollPositions[tableId] : null;
      if (shell && position) {
        shell.scrollTop = Number(position.top || 0);
        shell.scrollLeft = Number(position.left || 0);
      }
      if (!options.focus) return;
      const rowId = webGridSelectedRows[tableId] || '';
      const column = webGridRanges[tableId]?.currentColumn || '';
      if (rowId && column && focusNativeGridCell(tableId, rowId, column)) return;
      const tab = workspace.querySelector(`[data-action="switch-grid-table"][data-table-id="${CSS.escape(tableId)}"]`);
      const panel = workspace.querySelector(`[data-grid-panel="${CSS.escape(tableId)}"]`);
      (tab || panel)?.focus?.({ preventScroll: true });
    }

    function restoreVisibleWebGridScroll() {
      restoreWebGridTableView(activeGridTableByWorkspace[activeGridWorkspace]);
    }

    function restoreActiveWebGridFocusAfterRender() {
      if (activeGovernanceStep !== 'data' || activeDataEditingMode !== 'grid') return;

    function render() {
      if (skipNextWebGridScrollCapture) skipNextWebGridScrollCapture = false;
      else captureVisibleWebGridScroll();

      destroyDataDiagram();
      destroyReviewPatternDiagrams();
      const data = currentDocument();
      if (activeGovernanceStep !== 'skeleton' || !diagramExampleExpanded) expandedReviewPatternId = '';
      document.body.classList.toggle(
        'diagram-overlay-open',
        Boolean(data && (
          (activeGovernanceStep === 'skeleton' && diagramExpanded)

        ))

        governanceHeader.innerHTML = renderGovernanceHeader(null);

      updateAuthoringSelection({

      });
      ensureStructureScoreState();
      governanceHeader.innerHTML = renderGovernanceHeader(data);

      workspace.innerHTML = renderCurrentGovernanceStep();
      if (activeGovernanceStep === 'skeleton' && activeStepView === 'diagram') requestAnimationFrame(mountDiagram);
      if (activeGovernanceStep === 'skeleton' && activeStepView === 'diagram') requestAnimationFrame(mountReviewPatternDiagrams);
      if (activeGovernanceStep === 'data' && activeDataEditingMode === 'guided' && activeStepView === 'data') requestAnimationFrame(mountDataDiagram);
      if (activeGovernanceStep === 'data' && activeDataEditingMode === 'grid') requestAnimationFrame(restoreVisibleWebGridScroll);
      requestAnimationFrame(() => {
        const dialog = document.querySelector('#graphEditModal [role="dialog"]');
        if (!dialog || dialog.contains(document.activeElement)) return;

    function updateCandidateList() {
      if (!candidates.length) {
        candidateList.innerHTML = '<div class="candidate-empty">尚未创建或导入流程。</div>';
        candidateNote.textContent = '新建流程或导入结构化文件后，可以在这里切换当前流程。';
        return;
      }
      candidateList.innerHTML = candidates.map((item, index) => {
        const name = item.data.process.process_name || `未命名流程 ${index + 1}`;
        const unapplied = candidateHasUnappliedChanges(item);
        const fileState = candidateFileState(item, unapplied);
        const states = [unapplied ? '未应用修改' : '', item.dirty ? '未下载修改' : '', fileState?.label || ''].filter(Boolean);
        const fullLabel = `${index + 1}. ${name}${states.length ? `，${states.join('，')}` : ''}`;
        return `
          <button
            class="candidate-item${index === currentIndex ? ' active' : ''}"
            type="button"
            role="option"
            aria-selected="${index === currentIndex}"
            aria-label="${escapeAttribute(fullLabel)}"
            title="${escapeAttribute(fullLabel)}"
            data-candidate-index="${index}"
          >
            <span class="candidate-number" aria-hidden="true">${index + 1}</span>
            <span class="candidate-copy">
              <span class="candidate-name">${escapeHtml(name)}</span>
              ${unapplied ? '<span class="candidate-dirty">未应用修改</span>' : ''}
              ${item.dirty ? '<span class="candidate-dirty">未下载修改</span>' : ''}
              ${fileState ? `<span class="candidate-file-state ${escapeAttribute(fileState.className)}">${escapeHtml(fileState.label)}</span>` : ''}
            </span>
          </button>`;
      }).join('');
      candidateNote.textContent = candidates.length > 1
        ? `本次导入拆出 ${candidates.length} 条候选流程，请逐一检查并分别下载。`
        : '当前页面只编辑并下载这一条流程。';
    }

    function owningDepartmentChangeImpact(data, nextDepartment) {
      const behaviors = Array.isArray(data?.behaviors) ? data.behaviors : [];
      const fixedAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'fixed_department'
        && text(item?.current_actor_role).trim()
      ).length;
      const dynamicAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'dynamic_from_data'
        || item?.actor_department_data_ref
        || text(item?.actor_position_rule).trim()
      ).length;
      const companyWideAssignments = behaviors.filter(item => actorAssignmentMode(item) === 'company_wide').length;
      const formalWorkRoles = Array.isArray(data?.migration?.work_roles) ? data.migration.work_roles.length : 0;
      const classificationFields = [
        data?.process?.capability_domain,
        data?.process?.business_capability,
        data?.process?.classification_status !== 'unclassified' ? data?.process?.classification_status : ''
      ].filter(value => text(value).trim()).length;
      return {
        previousDepartment: text(data?.process?.owning_department).trim(),
        nextDepartment: text(nextDepartment).trim(),
        behaviorCount: behaviors.length,
        fixedAssignments,
        dynamicAssignments,
        companyWideAssignments,
        classificationFields,
        formalWorkRoles,
        internalCallCount: Array.isArray(data?.migration?.internal_process_calls) ? data.migration.internal_process_calls.length : 0
      };
    }

    function buildOwningDepartmentResetDocument(data, nextDepartment) {
      const next = clone(data);
      next.process.owning_department = text(nextDepartment).trim();
      next.process.capability_domain = null;
      next.process.business_capability = null;
      next.process.classification_status = 'unclassified';
      next.behaviors.forEach(behavior => {
        if (actorAssignmentMode(behavior) === 'company_wide') return;
        behavior.actor_assignment_mode = 'fixed_department';
        behavior.current_actor_role = '';
        behavior.actor_department_data_ref = null;
        behavior.actor_position_rule = '';
      });
      return next;
    }

    function removeRelation(index) {
      const relation = currentDocument()?.flow_relations?.[index];
      if (!relation) return false;
      const relationRef = relation.relation_ref;
      const source = currentDocument()?.behaviors?.find(item => item.behavior_ref === relation.from_behavior_ref)?.behavior_name || '未命名起点';
      const target = currentDocument()?.behaviors?.find(item => item.behavior_ref === relation.to_behavior_ref)?.behavior_name || '未命名终点';
      return requestConfirmedDeletion({
        label: `流程关系“${source} → ${target}”`,
        targetRef: relationRef,
        targetPath: `flow_relations.${index}`,
        impact: '该关系的类型、起点、终点和条件将一并删除。',
        analyze(documentValue) {
          return globalThis.GraphEditCommands.analyzeDeletion(documentValue, 'relation', relationRef)
            .map(item => `${item.label}（${item.ref}）`);
        },
        mutate(nextDocument) {
          const nextIndex = (nextDocument.flow_relations || []).findIndex(item => item.relation_ref === relationRef);
          if (nextIndex < 0) throw new Error('当前流程关系已不存在');
          nextDocument.flow_relations.splice(nextIndex, 1);
        },
        afterCommit(nextDocument) {
          if (activeRelationRef === relationRef) {
            activeRelationRef = nextDocument.flow_relations[Math.min(index, Math.max(0, nextDocument.flow_relations.length - 1))]?.relation_ref || '';
          }
        }
      });
    }

    function ensureFormArea(form, areaType) {
      const existing = form.areas.find(area => areaType ? area.area_type === areaType : !area.area_type);
      if (existing) return existing;
      const area = {
        area_ref: newRef('area'),
        area_type: areaType || '',
        area_title: '',
        items: []
      };
      form.areas.push(area);
      return area;
    }

    function newFormItem() {
      return {
        item_ref: newRef('item'),
        item_name: '',
        item_type: '',
        required: null,
        instructions: '',
        business_data_ref: null,
        data_field_ref: null,
        value_usage_mode: 'pending_confirmation',
        value_origin_mode: 'pending_confirmation',
        source_links: []
      };
    }

    function findFormItem(form, itemRef) {
      for (let areaIndex = 0; areaIndex < form.areas.length; areaIndex += 1) {
        const itemIndex = form.areas[areaIndex].items.findIndex(item => item.item_ref === itemRef);
        if (itemIndex >= 0) return { areaIndex, itemIndex, item: form.areas[areaIndex].items[itemIndex] };
      }
      return null;
    }

    function moveFormItemToAssignment(formIndex, itemRef, assignment) {
      const form = currentDocument().forms[formIndex];
      if (!form) return false;
      const found = findFormItem(form, itemRef);
      if (!found) return false;
      let targetArea = null;
      if (assignment === 'main') {
        targetArea = ensureFormArea(form, '基本信息');
      } else if (assignment === 'unassigned') {
        targetArea = ensureFormArea(form, '');
      } else if (assignment === '__new_detail__') {
        const areaTitle = text(window.prompt('请输入新建明细表名称。名称尚未确定时，请取消并选择“待确认”。', '')).trim();
        if (!areaTitle) {
          showStatus('未新建明细表。名称尚未确定时，请把字段归属选择为“待确认”。', 'error');
          return false;
        }
        targetArea = {
          area_ref: newRef('area'),
          area_type: '明细清单',
          area_title: areaTitle,
          items: []
        };
        form.areas.push(targetArea);
      } else {
        targetArea = form.areas.find(area => area.area_type === '明细清单' && area.area_ref === assignment);
      }
      if (!targetArea) return false;
      const sourceArea = form.areas[found.areaIndex];
      if (sourceArea.area_ref === targetArea.area_ref) return true;
      const [item] = sourceArea.items.splice(found.itemIndex, 1);
      targetArea.items.push(item);
      if (!sourceArea.area_type && !sourceArea.items.length) {
        form.areas.splice(form.areas.indexOf(sourceArea), 1);
      }
      activeAreaRef = targetArea.area_ref;
      return true;
    }

    function moveFormItem(formIndex, areaIndex, itemIndex, direction) {
      const items = currentDocument().forms[formIndex]?.areas[areaIndex]?.items;
      const targetIndex = itemIndex + direction;
      if (!items || targetIndex < 0 || targetIndex >= items.length) return false;
      [items[itemIndex], items[targetIndex]] = [items[targetIndex], items[itemIndex]];
      return true;
    }

    function moveDetailArea(formIndex, areaIndex, direction) {
      const form = currentDocument().forms[formIndex];
      if (!form?.areas[areaIndex] || form.areas[areaIndex].area_type !== '明细清单') return false;
      const detailIndices = form.areas
        .map((area, index) => area.area_type === '明细清单' ? index : -1)
        .filter(index => index >= 0);
      const position = detailIndices.indexOf(areaIndex);
      const targetAreaIndex = detailIndices[position + direction];
      if (position < 0 || targetAreaIndex == null) return false;
      [form.areas[areaIndex], form.areas[targetAreaIndex]] = [form.areas[targetAreaIndex], form.areas[areaIndex]];
      return true;
    }

    function removeDetailArea(formIndex, areaIndex) {
      const form = currentDocument().forms[formIndex];
      const area = form?.areas[areaIndex];
      if (!area || area.area_type !== '明细清单') return false;
      const formRef = form.form_ref;
      const areaRef = area.area_ref;
      const fieldCount = (area.items || []).length;
      return requestConfirmedDeletion({
        label: `明细表“${area.area_title || '未命名明细表'}”`,
        targetRef: areaRef,
        targetPath: `forms.${formIndex}.areas.${areaIndex}`,
        impact: `该明细表内${fieldCount}个表单字段将随明细表一并删除；其他表单内容不受影响。`,
        mutate(nextDocument) {
          const nextForm = (nextDocument.forms || []).find(item => item.form_ref === formRef);
          const nextAreaIndex = (nextForm?.areas || []).findIndex(item => item.area_ref === areaRef);
          if (nextAreaIndex < 0) throw new Error('当前明细表已不存在');
          nextForm.areas.splice(nextAreaIndex, 1);
        },
        afterCommit() {
          if (areaRef === activeAreaRef) {
            activeAreaRef = '';
            activeFormItemRef = '';
          }
        }
      });

    function addForm(formDesignState) {
      const mainArea = {
        area_ref: newRef('area'),
        area_type: '基本信息',
        area_title: '',
        items: []
      };
      const form = {
        form_ref: newRef('form'),
        form_name: '',
        form_no: null,
        form_design_state: formDesignState,
        behavior_links: [],
        areas: [mainArea]
      };
      currentDocument().forms.push(form);
      activeFormRef = form.form_ref;
      activeAreaRef = mainArea.area_ref;
    }

    function addTerm() {
      const term = { term_ref: newRef('term'), term_name: '', definition: '' };
      currentDocument().terms.push(term);
      activeTermRef = term.term_ref;
    }

    function removeBehavior(index) {
      const behavior = currentDocument()?.behaviors?.[index];
      if (!behavior) return false;
      const ref = behavior.behavior_ref;
      return requestConfirmedDeletion({
        label: `节点“${behavior.behavior_name || '未命名节点'}”`,
        targetRef: ref,
        targetPath: `behaviors.${index}`,
        impact: '该节点的执行主体、动作说明、完成标准和会签信息将一并删除。',
        analyze(documentValue) {
          return globalThis.GraphEditCommands.analyzeDeletion(documentValue, 'behavior', ref)
            .map(item => `${item.label}（${item.ref}）`);
        },
        mutate(nextDocument) {
          const nextIndex = (nextDocument.behaviors || []).findIndex(item => item.behavior_ref === ref);
          if (nextIndex < 0) throw new Error('当前节点已不存在');
          nextDocument.behaviors.splice(nextIndex, 1);
        },
        afterCommit(nextDocument) {
          if (activeBehaviorRef === ref) {
            activeBehaviorRef = nextDocument.behaviors[Math.min(index, Math.max(0, nextDocument.behaviors.length - 1))]?.behavior_ref || '';
          }
        }
      });
    }

    function removeTerm(index) {
      const term = currentDocument()?.terms?.[index];
      if (!term) return false;
      const termRef = term.term_ref;
      return requestConfirmedDeletion({
        label: `术语“${term.term_name || '未命名术语'}”`,
        targetRef: termRef,
        targetPath: `terms.${index}`,
        impact: '该术语名称和定义将一并删除。',
        mutate(nextDocument) {
          const nextIndex = (nextDocument.terms || []).findIndex(item => item.term_ref === termRef);
          if (nextIndex < 0) throw new Error('当前术语已不存在');
          nextDocument.terms.splice(nextIndex, 1);
        },
        afterCommit(nextDocument) {
          if (activeTermRef === termRef) {
            activeTermRef = nextDocument.terms[Math.min(index, Math.max(0, nextDocument.terms.length - 1))]?.term_ref || '';
          }
        }
      });
    }

    function removeData(index) {
      const item = currentDocument().data_objects[index];
      if (!item) return false;
      return deleteDataObjectByRef(item.data_ref);
    }

    function deleteDataObjectByRef(dataRef) {
      const documentValue = currentDocument();
      const dataIndex = (documentValue?.data_objects || []).findIndex(item => item.data_ref === dataRef);
      const dataObject = documentValue?.data_objects?.[dataIndex];
      if (!dataObject) return false;
      const nestedCount = (dataObject.fields || []).length
        + (dataObject.behavior_links || []).length
        + (dataObject.source_relations || []).length;
      return requestConfirmedDeletion({
        label: `数据对象“${dataObject.data_name || '未命名数据'}”`,
        targetRef: dataRef,
        targetPath: `data_objects.${dataIndex}`,
        impact: `对象内${(dataObject.fields || []).length}个字段、${(dataObject.behavior_links || []).length}条数据行为关系、${(dataObject.source_relations || []).length}条数据来源和生命周期内容将随对象一并删除${nestedCount ? '' : '；该对象当前没有字段或关系'}。`,
        mutate(nextDocument) {
          const nextIndex = (nextDocument.data_objects || []).findIndex(item => item.data_ref === dataRef);
          if (nextIndex < 0) throw new Error('当前数据对象已不存在');
          nextDocument.data_objects.splice(nextIndex, 1);
        },
        afterCommit() {
          activeDataRef = '';
          activeDataFieldRef = '';
        }
      });
    }

    function deleteDataField(dataIndex, fieldIndex) {
      const dataObject = currentDocument()?.data_objects?.[dataIndex];
      const dataField = dataObject?.fields?.[fieldIndex];
      if (!dataObject || !dataField) return false;
      const dataRef = dataObject.data_ref;
      const fieldRef = dataField.field_ref;
      return requestConfirmedDeletion({
        label: `对象字段“${dataField.field_name || '未命名对象字段'}”`,
        targetRef: fieldRef,
        targetPath: `data_objects.${dataIndex}.fields.${fieldIndex}`,
        impact: '仅删除该字段；数据对象和其他字段保留。',
        mutate(nextDocument) {
          const nextData = (nextDocument.data_objects || []).find(item => item.data_ref === dataRef);
          const nextIndex = (nextData?.fields || []).findIndex(item => item.field_ref === fieldRef);
          if (nextIndex < 0) throw new Error('当前对象字段已不存在');
          nextData.fields.splice(nextIndex, 1);
        },
        afterCommit() {
          activeDataRef = dataRef;
          activeDataFieldRef = '';
        }
      });
    }

    function deleteDataBehaviorLink(dataIndex, linkIndex) {
      const dataObject = currentDocument()?.data_objects?.[dataIndex];
      const link = dataObject?.behavior_links?.[linkIndex];
      if (!dataObject || !link) return false;
      const dataRef = dataObject.data_ref;
      const linkRef = link.link_ref;
      return requestConfirmedDeletion({
        label: `数据行为关系“${dataObject.data_name || '未命名数据'} / ${behaviorLabel(link.behavior_ref)}”`,
        targetRef: linkRef,
        targetPath: `data_objects.${dataIndex}.behavior_links.${linkIndex}`,
        impact: `将移除该行为对数据的“${DATA_OPERATIONS.find(item => item.value === link.operation)?.label || link.operation || '待确认'}”关系。`,
        mutate(nextDocument) {
          const nextData = (nextDocument.data_objects || []).find(item => item.data_ref === dataRef);
          const nextIndex = (nextData?.behavior_links || []).findIndex(item => item.link_ref === linkRef);
          if (nextIndex < 0) throw new Error('当前数据行为关系已不存在');
          nextData.behavior_links.splice(nextIndex, 1);
        }
      });
    }

    function deleteDataEdgeByRefs(dataRef, behaviorRef) {
      const documentValue = currentDocument();
      const dataIndex = (documentValue?.data_objects || []).findIndex(item => item.data_ref === dataRef);
      const dataObject = documentValue?.data_objects?.[dataIndex];
      if (!dataObject) return false;
      const links = (dataObject.behavior_links || [])
        .map((link, index) => ({ link, index }))
        .filter(item => item.link.behavior_ref === behaviorRef);
      if (!links.length) return false;
      const operationLabels = links.map(({ link }) => DATA_OPERATIONS.find(item => item.value === link.operation)?.label || link.operation);
      return requestConfirmedDeletion({
        label: `数据关系“${dataObject.data_name || '未命名数据'} / ${behaviorLabel(behaviorRef)}”`,
        impact: `该关系中的${operationLabels.join('、') || '待确认'}操作将一并移除；数据对象和业务行为保留。`,
        analyze(nextDocument) {
          return links.flatMap(({ link, index }) => deletionReferencePaths(
            nextDocument,
            link.link_ref,
            `data_objects.${dataIndex}.behavior_links.${index}`
          ).map(deletionReferenceLabel));
        },
        mutate(nextDocument) {
          const nextData = (nextDocument.data_objects || []).find(item => item.data_ref === dataRef);
          if (!nextData) throw new Error('当前数据对象已不存在');
          const beforeCount = (nextData.behavior_links || []).length;
          nextData.behavior_links = (nextData.behavior_links || []).filter(link => link.behavior_ref !== behaviorRef);
          if (nextData.behavior_links.length === beforeCount) throw new Error('当前数据关系已不存在');
        },
        afterCommit(nextDocument) {
          const nextData = (nextDocument.data_objects || []).find(item => item.data_ref === dataRef);
          if (nextData) openEntityEditSession('data', dataRef);
        }
      });
    }

    function deleteDataSourceRelation(dataIndex, sourceIndex) {
      const dataObject = currentDocument()?.data_objects?.[dataIndex];
      const source = dataObject?.source_relations?.[sourceIndex];
      if (!dataObject || !source) return false;
      const dataRef = dataObject.data_ref;
      const sourceRef = source.source_ref;
      const sourceName = source.source_data_name || source.source_process_name || source.source_department || '未命名来源线索';
      return requestConfirmedDeletion({
        label: `数据来源“${sourceName}”`,
        targetRef: sourceRef,
        targetPath: `data_objects.${dataIndex}.source_relations.${sourceIndex}`,
        impact: `仅移除数据对象“${dataObject.data_name || '未命名数据'}”的该来源线索。`,
        mutate(nextDocument) {
          const nextData = (nextDocument.data_objects || []).find(item => item.data_ref === dataRef);
          const nextIndex = (nextData?.source_relations || []).findIndex(item => item.source_ref === sourceRef);
          if (nextIndex < 0) throw new Error('当前数据来源已不存在');
          nextData.source_relations.splice(nextIndex, 1);
        }
      });
    }

    function deleteFormByIndex(formIndex) {
      const form = currentDocument()?.forms?.[formIndex];
      if (!form) return false;
      const formRef = form.form_ref;
      const areaCount = (form.areas || []).length;
      const fieldCount = (form.areas || []).reduce((total, area) => total + (area.items || []).length, 0);
      const linkCount = (form.behavior_links || []).length;
      return requestConfirmedDeletion({
        label: `表单或记录“${form.form_name || '未命名表单或记录'}”`,
        targetRef: formRef,
        targetPath: `forms.${formIndex}`,
        impact: `该表单内${areaCount}个区域、${fieldCount}个表单字段和${linkCount}条表单行为关系将随表单一并删除。`,
        mutate(nextDocument) {
          const nextIndex = (nextDocument.forms || []).findIndex(item => item.form_ref === formRef);
          if (nextIndex < 0) throw new Error('当前表单或记录已不存在');
          nextDocument.forms.splice(nextIndex, 1);
        },
        afterCommit() {
          activeFormRef = '';
          activeAreaRef = '';
          activeFormItemRef = '';
        }
      });
    }

    function deleteFormBehaviorLink(formIndex, linkIndex) {
      const form = currentDocument()?.forms?.[formIndex];
      const link = form?.behavior_links?.[linkIndex];
      if (!form || !link) return false;
      const formRef = form.form_ref;
      const linkRef = link.link_ref;
      return requestConfirmedDeletion({
        label: `表单行为关系“${form.form_name || '未命名表单'} / ${behaviorLabel(link.behavior_ref)}”`,
        targetRef: linkRef,
        targetPath: `forms.${formIndex}.behavior_links.${linkIndex}`,
        impact: '仅移除该表单与业务行为之间的处理关系。',
        mutate(nextDocument) {
          const nextForm = (nextDocument.forms || []).find(item => item.form_ref === formRef);
          const nextIndex = (nextForm?.behavior_links || []).findIndex(item => item.link_ref === linkRef);
          if (nextIndex < 0) throw new Error('当前表单行为关系已不存在');
          nextForm.behavior_links.splice(nextIndex, 1);
        }
      });
    }

    function deleteFormItem(formIndex, areaIndex, itemIndex) {
      const form = currentDocument()?.forms?.[formIndex];
      const area = form?.areas?.[areaIndex];
      const item = area?.items?.[itemIndex];
      if (!form || !area || !item) return false;
      const formRef = form.form_ref;
      const areaRef = area.area_ref;
      const itemRef = item.item_ref;
      return requestConfirmedDeletion({
        label: `表单字段“${item.item_name || '未命名表单字段'}”`,
        targetRef: itemRef,
        targetPath: `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}`,
        impact: `该字段内${(item.source_links || []).length}条取值来源将随字段一并删除；其所引用的数据对象和对象字段不会被删除。`,
        mutate(nextDocument) {
          const nextForm = (nextDocument.forms || []).find(candidate => candidate.form_ref === formRef);
          const nextArea = (nextForm?.areas || []).find(candidate => candidate.area_ref === areaRef);
          const nextIndex = (nextArea?.items || []).findIndex(candidate => candidate.item_ref === itemRef);
          if (nextIndex < 0) throw new Error('当前表单字段已不存在');
          nextArea.items.splice(nextIndex, 1);
        },
        afterCommit() {
          if (itemRef === activeFormItemRef) activeFormItemRef = '';
        }
      });
    }

    function deleteFieldSource(formIndex, areaIndex, itemIndex, sourceIndex) {
      const form = currentDocument()?.forms?.[formIndex];
      const area = form?.areas?.[areaIndex];
      const item = area?.items?.[itemIndex];
      const source = item?.source_links?.[sourceIndex];
      if (!form || !area || !item || !source) return false;
      const formRef = form.form_ref;
      const areaRef = area.area_ref;
      const itemRef = item.item_ref;
      const sourceRef = source.source_link_ref;
      const sourceDataObject = (currentDocument().data_objects || []).find(candidate => candidate.data_ref === source.source_data_ref);
      const sourceName = source.source_data_name
        || sourceDataObject?.data_name
        || source.source_system_name
        || '未命名取值来源';
      return requestConfirmedDeletion({
        label: `字段取值来源“${sourceName}”`,
        targetRef: sourceRef,
        targetPath: `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.source_links.${sourceIndex}`,
        impact: `仅移除表单字段“${item.item_name || '未命名表单字段'}”的该取值来源。`,
        mutate(nextDocument) {
          const nextForm = (nextDocument.forms || []).find(candidate => candidate.form_ref === formRef);
          const nextArea = (nextForm?.areas || []).find(candidate => candidate.area_ref === areaRef);
          const nextItem = (nextArea?.items || []).find(candidate => candidate.item_ref === itemRef);
          const nextIndex = (nextItem?.source_links || []).findIndex(candidate => candidate.source_link_ref === sourceRef);
          if (nextIndex < 0) throw new Error('当前字段取值来源已不存在');
          nextItem.source_links.splice(nextIndex, 1);
        }
      });
    }

    async function mergeDuplicateData(index) {
      const current = currentDocument()?.data_objects?.[index];
      if (current) activeDataRef = current.data_ref;
      return mergeCurrentDataObjects();
    }

    function owningDepartmentChangeNeedsConfirmation(impact) {
      return Boolean(
        impact.fixedAssignments
        || impact.dynamicAssignments
        || impact.classificationFields
        || impact.formalWorkRoles
        || impact.internalCallCount
      );
    }

    function renderOwningDepartmentChangeModal() {
      const impact = owningDepartmentChangeState?.impact;
      if (!impact) return;
      const previousLabel = impact.previousDepartment || '未填写';
      const nextLabel = impact.nextDepartment || '未填写';
      const preservedReviewItems = [
        impact.formalWorkRoles ? `${impact.formalWorkRoles}个正式工作角色` : '',
        impact.internalCallCount ? `${impact.internalCallCount}条历史部门内调用` : ''
      ].filter(Boolean);
      const actorResetItems = [
        impact.fixedAssignments ? `清空${impact.fixedAssignments}个行为已有的固定执行部门和岗位` : '',
        impact.dynamicAssignments ? `将${impact.dynamicAssignments}个动态责任部门设置恢复为“固定部门和岗位—未选择”` : ''
      ].filter(Boolean);
      const actorResetMarkup = actorResetItems.length
        ? `<div class="merge-summary-item"><strong>执行主体：</strong>${actorResetItems.join('；')}。</div>`
        : '';
      const classificationResetMarkup = impact.classificationFields
        ? `<div class="merge-summary-item"><strong>能力归类：</strong>能力域、业务能力和归类状态恢复为未归类，当前有${impact.classificationFields}项已填内容会被重置。</div>`
        : '';
      const followupItems = [
        impact.fixedAssignments || impact.dynamicAssignments
          ? '从“流程步骤—业务流程”开始，逐项重新选择执行主体；页面将根据执行部门自动标记跨部门行为'
          : '',
        impact.classificationFields ? '回到“基本信息”重新确认能力域、业务能力和归类状态' : '',
        preservedReviewItems.length ? `在后续审核中重新确认${preservedReviewItems.join('和')}是否仍适用` : ''
      ].filter(Boolean);
      owningDepartmentChangeContent.innerHTML = `
        <p>归口部门是识别本部门行为和跨部门行为的基准。将归口部门从“${escapeHtml(previousLabel)}”改为“${escapeHtml(nextLabel)}”后，原责任判断不能继续沿用。</p>
        <div class="merge-summary">
          ${actorResetMarkup}
          ${classificationResetMarkup}
          <div class="merge-summary-item"><strong>保持不变：</strong>${impact.companyWideAssignments ? `${impact.companyWideAssignments}个“全公司通用”行为、` : ''}业务行为名称和说明、流程关系、输出物与数据、表单、技术标识${preservedReviewItems.length ? `，以及${preservedReviewItems.join('和')}` : ''}。</div>
        </div>
        ${preservedReviewItems.length ? `<div class="inline-warning" style="margin-top:14px">${escapeHtml(preservedReviewItems.join('和'))}不会被页面改写。归口部门变更后，请在后续审核中重新确认这些保留内容是否仍适用。</div>` : ''}
        <div class="inline-warning" style="margin-top:14px"><strong>确认后需要重新梳理：</strong>${escapeHtml(followupItems.join('；'))}。页面刷新或关闭后无法恢复本次重置前的内容；需要留存时，请先下载当前草稿。</div>
        <div id="owningDepartmentChangeError" class="inline-warning" style="margin-top:14px;display:none" role="alert"></div>`;
    }

    function openOwningDepartmentChange(nextDepartment) {
      const data = currentDocument();
      if (!data) return;
      const impact = owningDepartmentChangeImpact(data, nextDepartment);
      if (impact.nextDepartment === impact.previousDepartment) {
        render();
        return;
      }
      if (!owningDepartmentChangeNeedsConfirmation(impact)) {
        data.process.owning_department = impact.nextDepartment;
        touch();
        render();
        return;
      }
      owningDepartmentChangeState = {
        candidateIndex: currentIndex,
        processRef: text(data?.process?.process_ref).trim(),
        impact
      };
      renderOwningDepartmentChangeModal();
      owningDepartmentChangeModal.classList.add('show');
      owningDepartmentChangeModal.setAttribute('aria-hidden', 'false');
      confirmOwningDepartmentChangeButton.focus();
    }

    function closeOwningDepartmentChange() {
      owningDepartmentChangeState = null;
      owningDepartmentChangeModal.classList.remove('show');
      owningDepartmentChangeModal.setAttribute('aria-hidden', 'true');
      owningDepartmentChangeContent.innerHTML = '';
    }

    function showOwningDepartmentChangeError(message) {
      const errorBox = document.getElementById('owningDepartmentChangeError');
      if (!errorBox) return;
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    async function confirmOwningDepartmentChange() {
      const state = owningDepartmentChangeState;
      const entry = currentEntry();
      if (!state || !entry) return;
      if (
        state.candidateIndex !== currentIndex
        || state.processRef !== text(entry.data?.process?.process_ref).trim()
        || state.impact.previousDepartment !== text(entry.data?.process?.owning_department).trim()
      ) {
        showOwningDepartmentChangeError('当前流程已发生变化。页面没有执行重置，请取消后重新选择归口部门。');
        return;
      }
      confirmOwningDepartmentChangeButton.disabled = true;
      try {
        const next = buildOwningDepartmentResetDocument(entry.data, state.impact.nextDepartment);
        await ensureCompatibleValidationService('再次变更归口部门');
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: next })
        });
        const result = await readJsonResponse(response, '3001校验接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) throw new Error('重置后的技术引用校验未通过，当前草稿保持不变。');
        entry.data = next;
        activeFlowItemKind = 'behavior';
        if (!next.behaviors.some(item => item.behavior_ref === activeBehaviorRef)) {
          activeBehaviorRef = next.behaviors[0]?.behavior_ref || '';
        }
        const impact = state.impact;
        closeOwningDepartmentChange();
        touch();
        render();
        const resetItems = [
          impact.fixedAssignments + impact.dynamicAssignments
            ? `${impact.fixedAssignments + impact.dynamicAssignments}个执行主体设置`
            : '',
          impact.classificationFields ? '能力归类' : ''
        ].filter(Boolean);
        const nextStep = impact.fixedAssignments || impact.dynamicAssignments
          ? '请从“流程步骤—业务流程”开始重新梳理。'
          : impact.classificationFields
            ? '请在“基本信息”中重新确认能力归类。'
            : '请在后续审核中确认保留内容是否仍适用。';
        showStatus(
          `归口部门已改为“${impact.nextDepartment || '未填写'}”。${resetItems.length ? `页面已重置${resetItems.join('、')}；` : ''}${nextStep}`,
          'success'
        );
      } catch (error) {
        showOwningDepartmentChangeError(`变更未执行：${error.message}`);
        showStatus(`归口部门变更未执行：${error.message}`, 'error');
      } finally {
        confirmOwningDepartmentChangeButton.disabled = false;
      }
    }

    function requestDataEditingMode(nextMode, options = {}) {
      const normalized = nextMode === 'grid' ? 'grid' : 'guided';
      if (normalized === activeDataEditingMode) return;
      if (!options.skipPendingGuard && requestTransition(
        '切换编辑方式',
        () => requestDataEditingMode(normalized, { skipPendingGuard: true })
      )) return;
      captureAuthoringSelectionContext();
      if (normalized === 'grid') {
        if (activeStepView === 'forms') {
          activeGridWorkspace = 'forms';
          activeGridTableByWorkspace.forms = activeFormItemRef ? 'form_items' : activeAreaRef ? 'form_areas' : 'forms';
        } else {
          activeGridWorkspace = 'data';
          activeGridTableByWorkspace.data = activeDataFieldRef
            ? 'data_fields'
            : graphSelection?.kind === 'data-edge'
              ? 'data_behavior_links'
              : 'data_objects';
        }
      }
      authoringSelectionContextManager.update(candidateStateKey(), {
        mode: normalized,
        workspace: activeGridWorkspace,
        tableId: activeGridTableByWorkspace[activeGridWorkspace],
        dataRef: activeDataRef,
        dataFieldRef: activeDataFieldRef,
        formRef: activeFormRef,
        areaRef: activeAreaRef,
        formItemRef: activeFormItemRef
      }, currentDocument());
      resetTransientEditingState();
      restoreAuthoringSelectionContext();
      if (normalized === 'guided' && activeStepView === 'data' && activeDataMode === 'flow') {
        const dataObject = ensureActiveGraphDataObject();
        if (dataObject) openEntityEditSession('data', dataObject.data_ref);
      }
      render();
      restoreActiveWebGridFocusAfterRender();
    }

    function gridParentContext(tableId) {
      if (['data_fields', 'data_behavior_links', 'data_source_relations'].includes(tableId)) return { parentRef: activeDataRef };
      if (['form_behavior_links', 'form_areas'].includes(tableId)) return { parentRef: activeFormRef };
      if (tableId === 'form_items') return { parentRef: activeAreaRef, formRef: activeFormRef };
      if (tableId === 'field_source_links') return { parentRef: activeFormItemRef };
      return {};
    }

    function webGridCompositionInProgress() {
      return Boolean(workspace.querySelector('[data-grid-composing="1"]'));
    }

    function blockWebGridCompositionTransition() {
      if (!webGridCompositionInProgress()) return false;
      showStatus('请先完成当前中文输入，再执行会切换或重绘表格的操作。', 'error');
      return true;
    }

    function createGridRowInSession(tableId, options = {}) {
      ensureWebGridSession();
      const definition = webGridSession.definition(tableId);
      const context = { ...gridParentContext(tableId), ...options };
      const parent = gridParentState(tableId);
      if (definition.parentTableId && (!context.parentRef || !parent.ready)) {
        const message = parent.deleted
          ? `当前${parent.label}已在工作副本中标记删除，不能继续新增${definition.label}。`
          : `请先在上级表格中选择一条${parent.label}，再新增${definition.label}。`;
        if (options.silent) throw new Error(message);
        window.alert(message);
        return null;
      }
      const row = options.sourceRow
        ? webGridSession.duplicateRow(tableId, options.sourceRow._row_id, context)
        : webGridSession.addRow(tableId, context);
      if (options.select === false) return row;
      selectGridParent(tableId, row);
      webGridSelectedRows[tableId] = row._row_id;
      return row;
    }

    function addGridRow(tableId, options = {}) {
      const row = createGridRowInSession(tableId, options);
      if (!row) return null;
      webGridIssues = [];
      webGridFilters[tableId] = '';
      render();
      requestAnimationFrame(() => {
        const panel = workspace.querySelector(`[data-grid-panel="${CSS.escape(tableId)}"]`);
        const tableRow = panel?.querySelector(`[data-grid-row-id="${CSS.escape(row._row_id)}"]`);
        const controls = Array.from(tableRow?.querySelectorAll('[data-grid-cell]:not(:disabled)') || []);
        const control = controls.find(candidate => !text(candidate.value)) || controls[0];
        panel?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        control?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        control?.focus({ preventScroll: true });
        if (control?.matches('input[type="text"]')) control.select();
      });
      return row;
    }

    function beginGuidedDataOperationEdit(dataIndex, linkIndex, nextOperation) {
      const dataObject = currentDocument()?.data_objects?.[dataIndex];
      const link = dataObject?.behavior_links?.[linkIndex];
      if (!dataObject || !link) return false;
      const previousOperation = link.operation;
      const baseline = dataEdgeValues(dataObject.data_ref, link.behavior_ref);
      if (!openDataEdgeSession(dataObject.data_ref, link.behavior_ref)) return false;
      const operations = [...baseline.operations];
      const previousIndex = operations.indexOf(previousOperation);
      if (previousIndex >= 0) operations.splice(previousIndex, 1);
      if (nextOperation && !operations.includes(nextOperation)) operations.push(nextOperation);
      editSessionManager.updatePatch({
        operations,
        updatedFieldRefs: operations.includes('update') ? baseline.updatedFieldRefs : []
      });
      updateDataEdgeCanApply();
      refreshUnappliedIndicators();
      render();
      showStatus('数据操作仍在未应用编辑会话中。请核对后点击“应用数据操作”。');
      if (nextOperation === 'update') requestAnimationFrame(() => openGraphUpdateFields());
      return true;
    }

    function openGuidedUpdateFields(dataIndex, linkIndex, invoker = null, options = {}) {
      const dataObject = currentDocument()?.data_objects?.[dataIndex];
      const link = dataObject?.behavior_links?.[linkIndex];
      if (!dataObject || !link || link.operation !== 'update') return;
      const selection = { kind: 'data-edge', dataRef: dataObject.data_ref, behaviorRef: link.behavior_ref };
      const open = () => {
        if (!dataEdgeSession(selection) && !openDataEdgeSession(dataObject.data_ref, link.behavior_ref)) return;
        openGraphUpdateFields(invoker);
      };
      if (!options.skipPendingGuard && !dataEdgeSession(selection) && requestTransition(
        '编辑更新字段',
        () => openGuidedUpdateFields(dataIndex, linkIndex, invoker, { skipPendingGuard: true }),
        { invoker }
      )) return;
      open();
    }

    function openGridUpdateFields(rowId, invoker = null) {
      if (webGridApplyInFlight) {
        showStatus('表格修改正在检查，请等待本次检查完成后再选择更新字段。', 'error');
        return;
      }
      const candidateKey = candidateStateKey();
      const session = webGridSession;
      const sessionRevision = Number(session?.revision?.() || 0);
      const row = session?.rows('data_behavior_links').find(item => item._row_id === rowId && !item._deleted);
      if (!row || row.operation !== 'update') return;
      const dataRow = session.rows('data_objects').find(item => item.data_ref === row.data_ref);
      openUpdateFieldsModal({
        dataRef: row.data_ref,
        dataName: dataRow?.data_name,
        selectedRefs: row.updated_field_refs,
        fields: gridUpdateFieldOptions(row),
        invoker,
        isCurrent() {
          return candidateStateKey() === candidateKey
            && webGridSession === session
            && Number(webGridSession?.revision?.() || 0) === sessionRevision
            && Boolean(session.rows('data_behavior_links').find(item => item._row_id === rowId && !item._deleted && item.operation === 'update'));
        },
        onConfirm(selectedRefs) {
          session.updateCell('data_behavior_links', rowId, 'updated_field_refs', selectedRefs);
          clearNativeGridIssues();
          refreshNativeGridPanel('data_behavior_links');
          updateNativeGridStatus();
          requestAnimationFrame(() => focusNativeGridCell('data_behavior_links', rowId, 'updated_field_refs'));
          showStatus(`表格工作副本已登记${selectedRefs.length}个本次更新字段。`, 'success');
        },
        onCancel() {
          refreshNativeGridPanelAndFocus('data_behavior_links', rowId, 'updated_field_refs');
        }
      });
    }
