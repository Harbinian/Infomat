function stepRowsForCurrentFilter(processRef) {
  const filter = stepFiltersByProcess.get(processRef) || 'all';
  const rows = stepsForProcess(processRef);
  const duplicates = duplicateStepCounts(processRef);
  if (filter === 'incomplete') return rows.filter(row => !stepCoreComplete(row.index));
  if (filter === 'complete') return rows.filter(row => stepCoreComplete(row.index));
  if (filter === 'duplicates') return rows.filter(row => duplicateCountForStep(row.step, duplicates) > 1);
  return rows;
}

function selectedStepRowForProcess(processRef, filteredRows = stepRowsForCurrentFilter(processRef)) {
  if (!filteredRows.length) return null;
  const selectedRef = activeStepRefsByProcess.get(processRef);
  const selected = filteredRows.find(row => row.step.step_ref === selectedRef);
  if (selected) return selected;
  const first = filteredRows.find(row => !stepCoreComplete(row.index)) || filteredRows[0];
  activeStepRefsByProcess.set(processRef, first.step.step_ref);
  return first;
}

function selectStepForProcess(processRef, stepRef) {
  activeStepRefsByProcess.set(processRef, stepRef);
  collapsedProcessRefs.delete(processRef);
  render();
}

function setStepFilterForProcess(processRef, filter) {
  stepFiltersByProcess.set(processRef, filter);
  activeStepRefsByProcess.delete(processRef);
  render();
}

function stepActionButton(label, onClick, disabled = false, extraClass = '') {
  const button = document.createElement('button');
  button.className = `btn ${extraClass}`.trim();
  button.type = 'button';
  button.textContent = label;
  button.disabled = disabled;
  button.addEventListener('click', onClick);
  return button;
}

function renderStepNavigator(processRef, filteredRows, selectedRow) {
  const allRows = stepsForProcess(processRef);
  const duplicates = duplicateStepCounts(processRef);
  const incompleteCount = allRows.filter(row => !stepCoreComplete(row.index)).length;
  const completeCount = allRows.length - incompleteCount;
  const duplicateRows = allRows.filter(row => duplicateCountForStep(row.step, duplicates) > 1).length;
  const panel = div('step-list-panel');
  panel.dataset.processRef = processRef;

  const summary = div('step-list-summary');
  [
    { value: allRows.length, label: '全部步骤' },
    { value: incompleteCount, label: '需要补充' },
    { value: duplicateRows, label: '疑似重复' }
  ].forEach(item => {
    const cell = document.createElement('div');
    const value = document.createElement('strong');
    value.textContent = String(item.value);
    const label = document.createElement('span');
    label.textContent = item.label;
    cell.append(value, label);
    summary.appendChild(cell);
  });
  panel.appendChild(summary);

  const filter = stepFiltersByProcess.get(processRef) || 'all';
  const filterBar = div('step-filter-bar');
  [
    { value: 'all', label: `全部 ${allRows.length}` },
    { value: 'incomplete', label: `待补 ${incompleteCount}` },
    { value: 'duplicates', label: `疑似重复 ${duplicateRows}` },
    { value: 'complete', label: `已完成 ${completeCount}` }
  ].forEach(item => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = item.value === filter ? 'active' : '';
    button.textContent = item.label;
    button.addEventListener('click', () => setStepFilterForProcess(processRef, item.value));
    filterBar.appendChild(button);
  });
  panel.appendChild(filterBar);

  const list = div('step-list');
  list.addEventListener('scroll', () => stepListScrollTopByProcess.set(processRef, list.scrollTop));
  if (!filteredRows.length) {
    const noRows = div('step-filter-empty');
    noRows.textContent = '当前筛选下没有步骤。可切换筛选或新增业务行为。';
    list.appendChild(noRows);
  }
  const selectedRef = selectedRow?.step.step_ref || '';
  filteredRows.forEach(row => {
    const localIndex = allRows.findIndex(item => item.step.step_ref === row.step.step_ref);
    const missing = stepMissingFields(row.index);
    const duplicateCount = duplicateCountForStep(row.step, duplicates);
    const button = document.createElement('button');
    button.type = 'button';
    button.className = `step-list-item ${row.step.step_ref === selectedRef ? 'active' : ''}`.trim();
    button.dataset.stepRef = row.step.step_ref;
    button.setAttribute('aria-current', row.step.step_ref === selectedRef ? 'true' : 'false');

    const head = div('step-list-item-head');
    const index = document.createElement('span');
    index.className = 'step-index';
    index.textContent = String(localIndex + 1).padStart(2, '0');
    const type = document.createElement('span');
    type.className = `step-type-badge ${row.step.step_type === 'decision' ? 'decision' : ''}`.trim();
    type.textContent = row.step.step_type === 'decision' ? '判断' : '行为';
    head.append(index, type);
    if (duplicateCount > 1) {
      const duplicate = document.createElement('span');
      duplicate.className = 'step-duplicate-badge';
      duplicate.textContent = `同名 × ${duplicateCount}`;
      head.appendChild(duplicate);
    }

    const name = div('step-list-name');
    name.textContent = row.step.step_name || '未填写业务行为';
    const status = div(`step-list-status ${missing.length ? '' : 'complete'}`.trim());
    status.textContent = missing.length ? `待补 ${missing.length} 项` : '核心字段已完成';
    button.append(head, name, status);
    button.addEventListener('click', () => selectStepForProcess(processRef, row.step.step_ref));
    list.appendChild(button);
  });
  panel.appendChild(list);

  const selectedPosition = allRows.findIndex(row => row.step.step_ref === selectedRef);
  const rowsAfterSelection = selectedPosition >= 0
    ? allRows.slice(selectedPosition + 1).concat(allRows.slice(0, selectedPosition))
    : allRows;
  const nextIncomplete = rowsAfterSelection.find(row => !stepCoreComplete(row.index));
  const footer = div('step-list-footer');
  footer.appendChild(stepActionButton(
    '下一项待补',
    () => selectStepForProcess(processRef, nextIncomplete.step.step_ref),
    !nextIncomplete
  ));
  panel.appendChild(footer);

  const savedScrollTop = stepListScrollTopByProcess.get(processRef) || 0;
  requestAnimationFrame(() => {
    list.scrollTop = savedScrollTop;
    const active = list.querySelector('.step-list-item.active');
    if (!active) return;
    const listRect = list.getBoundingClientRect();
    const activeRect = active.getBoundingClientRect();
    if (activeRect.top < listRect.top) list.scrollTop -= listRect.top - activeRect.top;
    else if (activeRect.bottom > listRect.bottom) list.scrollTop += activeRect.bottom - listRect.bottom;
  });
  return panel;
}

  const root = div('row-list');
  if (!docData.processes.length) docData.processes.push(blankProcess());
  docData.processes.forEach((process, processIndex) => {
    const processRef = process.process_ref;

    const card = div('process-card');
    const head = div('process-card-head');
    const copy = document.createElement('div');
    copy.innerHTML = `<h3>${escapeHtml(process.l3_name || `流程 ${processIndex + 1}`)}</h3><p>${escapeHtml(processSummaryText(processRef))}</p>`;
    const actions = div('process-actions');
    const collapse = stepActionButton(
      collapsedProcessRefs.has(processRef) ? '展开流程' : '折叠流程',
      () => toggleProcessCollapse(processRef)
    );
    const addAction = stepActionButton('新增业务行为', () => addStepForProcess(processRef, 'action'));
    const addDecision = stepActionButton('新增判断节点', () => addStepForProcess(processRef, 'decision'));
    const hasDecision = processStepRows.some(row => row.step.step_type === 'decision');
    const addTransition = stepActionButton('新增判断分支', () => addTransitionForProcess(processRef), !hasDecision);
    if (!hasDecision) addTransition.title = '先新增或设置一个判断节点';
    actions.append(collapse, addAction, addDecision, addTransition);
    head.append(copy, actions);
    card.appendChild(head);

    if (collapsedProcessRefs.has(processRef)) {
      const summary = div('process-collapsed-summary');
      summary.textContent = `${processSummaryText(processRef)}。展开后可继续补充。`;
      card.appendChild(summary);
      root.appendChild(card);
      return;
    }

    card.appendChild(renderProcessMetaPanel(process, processIndex));
    if (!processStepRows.length) {
      card.appendChild(empty('这条流程还没有业务行为或判断节点。请从上方新增。'));
      root.appendChild(card);
      return;
    }

    const filteredRows = stepRowsForCurrentFilter(processRef);
    const selectedRow = selectedStepRowForProcess(processRef, filteredRows);
    const workbench = div('step-workbench');
    workbench.append(
      renderStepNavigator(processRef, filteredRows, selectedRow),
      renderSelectedStepEditor(processRef, filteredRows, selectedRow)
    );
    card.appendChild(workbench);

    const transitions = (docData.step_transitions || []).filter(item => item.process_ref === processRef);

      `判断分支（${transitions.length} 条）`,
      renderStepTransitions(processRef),
      { open: selectedIsDecision || transitions.length > 0 }

  });
  return root;

function addStepForProcess(processRef, stepType = 'action') {
  const step = blankStep(processRef, stepType);
  docData.steps.push(step);
  docData.behavior_details.push(blankBehaviorDetail(docData.steps.length - 1));
  activeStepRefsByProcess.set(processRef, step.step_ref);
  stepFiltersByProcess.set(processRef, 'all');
  collapsedProcessRefs.delete(processRef);
  hasPageContent = true;
  render();
}

function addTransitionForProcess(processRef) {
  const transitionRef = `trans_${docData.step_transitions.length + 1}`;
  const decision = stepsForProcess(processRef).find(item => item.step.step_type === 'decision')?.step;
  docData.step_transitions.push({
    transition_ref: transitionRef,
    process_ref: processRef,
    from_step_ref: decision?.step_ref || null,
    condition: '',
    to_step_ref: null,
    evidence_refs: []
  });
  collapsedProcessRefs.delete(processRef);
  hasPageContent = true;
  render();
}

function normalizeStepTransitions(data) {
  if (!data) return;
  const steps = Array.isArray(data.steps) ? data.steps : [];
  const stepsByRef = new Map(steps.map(step => [step.step_ref, step]));
  data.step_transitions = (Array.isArray(data.step_transitions) ? data.step_transitions : [])
    .map(transition => {
      const next = {
        transition_ref: transition.transition_ref,
        process_ref: transition.process_ref,
        from_step_ref: transition.from_step_ref || null,
        condition: transition.condition || '',
        to_step_ref: transition.to_step_ref || null,
        evidence_refs: Array.isArray(transition.evidence_refs) ? transition.evidence_refs : []
      };
      const fromStep = stepsByRef.get(next.from_step_ref);
      if (!fromStep) return next;
      next.process_ref = fromStep.process_ref;
      if (fromStep.step_type !== 'decision') return null;
      if (next.to_step_ref) {
        const toStep = stepsByRef.get(next.to_step_ref);
        if (!toStep || toStep.process_ref !== fromStep.process_ref) next.to_step_ref = null;
      }
      return next;
    })
    .filter(Boolean);
}

function cleanStepTransitions() {
  normalizeStepTransitions(docData);
}

function remapStepIndexedStore(store, indexMapper) {
  const remapped = {};
  for (const [path, value] of Object.entries(store || {})) {
    const match = path.match(/^(steps|behavior_details)\.(\d+)(\..+)?$/);
    if (!match) {
      remapped[path] = value;
      continue;
    }
    const nextIndex = indexMapper(Number(match[2]));
    if (nextIndex === null || nextIndex === undefined) continue;
    remapped[`${match[1]}.${nextIndex}${match[3] || ''}`] = value;
  }
  return remapped;
}

function remapStepIndexedMetadata(indexMapper) {
  fieldSources = remapStepIndexedStore(fieldSources, indexMapper);
  fieldOrigins = remapStepIndexedStore(fieldOrigins, indexMapper);
  fieldWarnings = remapStepIndexedStore(fieldWarnings, indexMapper);
  fieldSuggestions = remapStepIndexedStore(fieldSuggestions, indexMapper);
}

function moveStepWithinProcess(index, direction) {
  const step = docData.steps[index];
  if (!step) return;
  const rows = stepsForProcess(step.process_ref);
  const localIndex = rows.findIndex(item => item.index === index);
  const target = rows[localIndex + direction];
  if (!target) return;
  const detail = docData.behavior_details[index];
  docData.steps[index] = docData.steps[target.index];
  docData.steps[target.index] = step;
  docData.behavior_details[index] = docData.behavior_details[target.index];
  docData.behavior_details[target.index] = detail;
  remapStepIndexedMetadata(currentIndex => {
    if (currentIndex === index) return target.index;
    if (currentIndex === target.index) return index;
    return currentIndex;
  });
  hasPageContent = true;
  render();
}

function addTableForActiveForm() {

function removeForm(index) {
  const form = docData.forms[index];
  if (!form) return;
  const tableRefs = docData.form_tables
    .filter(table => table.form_ref === form.form_ref)
    .map(table => table.table_ref);
  docData.forms.splice(index, 1);
  docData.form_tables = docData.form_tables.filter(table => table.form_ref !== form.form_ref);
  docData.form_table_fields = docData.form_table_fields.filter(fieldItem => !tableRefs.includes(fieldItem.table_ref));
  if (activeFormRef === form.form_ref) activeFormRef = '';
  if (tableRefs.includes(activeTableRef)) activeTableRef = '';
  hasPageContent = true;
  render();
}

function removeArrayItem(key, index) {
  let removedProcessRef = null;
  let removedProcessStepRefs = [];
  let removedStepRef = null;
  let nextStepRef = null;
  if (key === 'processes') {
    removedProcessRef = docData.processes[index]?.process_ref || null;
    removedProcessStepRefs = docData.steps
      .filter(step => step.process_ref === removedProcessRef)
      .map(step => step.step_ref);
  }
  if (key === 'steps') {
    const step = docData.steps[index];
    if (step) {
      removedStepRef = step.step_ref;
      const rows = stepsForProcess(step.process_ref);
      const localIndex = rows.findIndex(row => row.index === index);
      nextStepRef = rows[localIndex + 1]?.step.step_ref || rows[localIndex - 1]?.step.step_ref || null;
      docData.step_transitions = docData.step_transitions.filter(transition =>
        transition.from_step_ref !== step.step_ref && transition.to_step_ref !== step.step_ref
      );
      docData.work_role_bindings = docData.work_role_bindings.filter(binding => binding.step_ref !== step.step_ref);
    }
  }
  docData[key].splice(index, 1);
  if (key === 'steps') {
    docData.behavior_details.splice(index, 1);
    remapStepIndexedMetadata(currentIndex => {
      if (currentIndex === index) return null;
      return currentIndex > index ? currentIndex - 1 : currentIndex;
    });
    for (const [processRef, activeRef] of activeStepRefsByProcess.entries()) {
      if (activeRef !== removedStepRef) continue;
      if (nextStepRef) activeStepRefsByProcess.set(processRef, nextStepRef);
      else activeStepRefsByProcess.delete(processRef);
    }
  }
  if (key === 'processes') {
    const validProcessRefs = new Set(docData.processes.map(process => process.process_ref));
    docData.steps = docData.steps.filter(step => validProcessRefs.has(step.process_ref));
    docData.step_transitions = docData.step_transitions.filter(transition => validProcessRefs.has(transition.process_ref));
    docData.work_role_bindings = docData.work_role_bindings.filter(binding =>
      binding.process_ref !== removedProcessRef && !removedProcessStepRefs.includes(binding.step_ref)
    );
  }
  cleanStepTransitions();
  hasPageContent = true;
  render();
}

function removeWorkRoleBinding(index) {
  if (!Array.isArray(docData.work_role_bindings) || !docData.work_role_bindings[index]) return;
  importedConfirmedWorkRoleRefs.delete(docData.work_role_bindings[index].binding_ref);
  docData.work_role_bindings.splice(index, 1);
  hasPageContent = true;

}

function normalizeForStructuredExport(data) {
  const copy = JSON.parse(JSON.stringify(data));
  copy.schema_version = 'document-structured-output-v2';
  if (!Array.isArray(copy.step_transitions)) copy.step_transitions = [];
  if (!Array.isArray(copy.work_role_bindings)) copy.work_role_bindings = [];
  copy.work_role_bindings = copy.work_role_bindings.map((binding, index) => normalizeWorkRoleBinding(binding, index));
  copy.structure_block_projection = copy.structure_block_projection && typeof copy.structure_block_projection === 'object'
    ? copy.structure_block_projection
    : {};
  copy.structure_block_projection.work_role_bindings = copy.work_role_bindings
    .filter(binding => binding.status === 'confirmed')
    .map(binding => JSON.parse(JSON.stringify(binding)));
  normalizeStepTransitions(copy);
  copy.document_profile = copy.document_profile || {};
  copy.document_profile.document_no = copy.draft?.document_no || copy.document_profile.document_no || '';
  copy.document_profile.document_title = copy.draft?.document_title || copy.document_profile.document_title || '';
  if (copy.structure_block_projection?.meta && !copy.structure_block_projection.meta.document_version_status) {
    copy.structure_block_projection.meta.document_version_status = 'published';
  }
  pruneEmptyRecordRefs(copy);
  return copy;
}

function pruneEmptyRecordRefs(value) {
  if (!value || typeof value !== 'object') return;
  if (Array.isArray(value)) {
    value.forEach(pruneEmptyRecordRefs);
    return;
  }
  for (const key of Object.keys(value)) {
    const isWorkRoleStepRef = key === 'step_ref' && 'binding_ref' in value && 'work_role_code' in value;
    if (value[key] === null && key.endsWith('_ref') && key !== 'to_step_ref' && !isWorkRoleStepRef) {
      delete value[key];
    } else {
      pruneEmptyRecordRefs(value[key]);
    }
  }
}

function firstInvalidConfirmedWorkRoleBinding() {
  return (docData?.work_role_bindings || [])

function firstInvalidWorkRoleBinding() {

function exportStructuredFile() {
  if (!docData) {
    toast('请先导入制度文件或结构化文件');
    return;
  }
  const invalidBinding = firstInvalidWorkRoleBinding();
  if (invalidBinding) {
    toast(`工作角色绑定未通过校验：${invalidBinding.problems[0]}`);
    return;
  }
  const invalidConfirmedBinding = firstInvalidConfirmedWorkRoleBinding();
  if (invalidConfirmedBinding) {
    toast(`已确认工作角色绑定未通过校验：${invalidConfirmedBinding.problems[0]}`);
    return;
  }
  if (completionState().red > 0) {
    const ok = confirm('还有必填内容需要补充。现在导出的结构化文件可以保存阶段性成果，导入 3000 后仍需继续完善。');
    if (!ok) return;
  }
  const data = JSON.stringify(normalizeForStructuredExport(docData), null, 2);
  const blob = new Blob([data], { type: 'application/json;charset=utf-8' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  const name = docData.draft.document_no || docData.draft.document_title || 'structured-output';
  link.download = `${safeFileName(name)}.json`;
  link.click();
  URL.revokeObjectURL(link.href);
  toast('结构化文件已导出');
}

function clearPage() {
  if (hasPageContent && !confirm('清空后当前页面内容将无法恢复。')) return;
  currentRequestId = '';
  clearWorkTimers();
  isWorking = false;
  isSuggesting = false;
  workStatus.hidden = true;
  dropZone.classList.remove('busy', 'dragging');
  document.body.removeAttribute('aria-busy');
  setImportControlsDisabled(false);
  docData = null;
  importedConfirmedWorkRoleRefs.clear();
  fieldSources = {};
  fieldOrigins = {};
  fieldWarnings = {};
  fieldSuggestions = {};
  activeFormRef = '';
  activeTableRef = '';
  collapsedProcessRefs.clear();
  resetStepWorkbenchState();
  hasPageContent = false;
  render();
}

function safeFileName(value) {
  return String(value || 'structured-output').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80);
}

function div(className) {
  const el = document.createElement('div');
  el.className = className;
  return el;
}

function title(text) {
  const wrap = div('group-title');
  const h = document.createElement('h3');
  h.textContent = text;
  wrap.appendChild(h);
  return wrap;
}

function empty(text) {
  const el = div('empty');
  el.textContent = text;
  return el;
}

function record(label, onRemove) {
  const item = div('record');
  const head = div('record-head');
  const span = document.createElement('span');
  span.textContent = label;
  const remove = document.createElement('button');
  remove.className = 'btn';
  remove.type = 'button';
  remove.textContent = '删除';
  remove.addEventListener('click', onRemove);
  head.append(span, remove);
  item.appendChild(head);
  return item;
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
