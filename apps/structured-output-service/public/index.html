          <summary class="button small">视图操作</summary>
          <div class="graph-view-menu">
            <button class="button small" data-action="fit-${kind}-diagram">适应画布</button>
            <button class="button small" data-action="reset-${kind}-diagram">重置视图</button>
          </div>
        </details>`;
    }

    function renderFlowRelationDraft() {
      if (!flowRelationDraft) return '';
      const stageText = {
        type: '第1步：选择关系类型',
        source: '第2步：选择起点',
        target: '第3步：选择终点',
        confirm: '第4步：确认关系'
      }[flowRelationDraft.stage] || '建立关系';
      const behaviorButtons = ['source', 'target'].includes(flowRelationDraft.stage)
        ? `<div class="graph-endpoint-list">${(currentDocument().behaviors || []).map((behavior, index) => `
            <button class="button small" data-action="select-relation-endpoint" data-ref="${escapeAttribute(behavior.behavior_ref)}">
              ${index + 1}. ${escapeHtml(behavior.behavior_name || '未命名节点')}
            </button>`).join('')}</div>`
        : '';
      return `
        <div class="graph-operation-card" role="status">
          <strong>${stageText}</strong>
          ${flowRelationDraft.stage === 'type' ? `
            <select data-graph-relation-type>
              ${optionHtml(RELATION_TYPES, flowRelationDraft.relation_type)}
            </select>` : ''}
          <p>起点：${escapeHtml(relationEndpointLabel(flowRelationDraft.from_behavior_ref, '待选择'))}；终点：${escapeHtml(relationEndpointLabel(flowRelationDraft.to_behavior_ref, '待选择'))}</p>
          ${flowRelationDraft.stage === 'confirm' && ['condition', 'loop'].includes(flowRelationDraft.relation_type) ? `
            <label>关系条件<input data-graph-relation-condition value="${escapeAttribute(flowRelationDraft.condition || '')}"></label>` : ''}
          ${behaviorButtons}
          <div class="item-actions">
            ${flowRelationDraft.stage === 'confirm' ? '<button class="button primary small" data-action="confirm-flow-relation">确认建立</button>' : ''}
            <button class="button small" data-action="cancel-flow-relation">取消（Esc）</button>
          </div>
        </div>`;
    }

    function renderFlowPropertyPanel() {
      if (flowRelationDraft) return renderFlowRelationDraft();
      const selection = graphSelection;
      if (!selection || !['behavior', 'relation'].includes(selection.kind)) {
        return '<div class="graph-property-empty">选择一个节点或关系后，在这里编辑属性。技术标识和迁移信息默认不展开。</div>';
      }
      if (selection.kind === 'relation') {
        const relation = selection.draft || currentDocument().flow_relations.find(item => item.relation_ref === selection.ref);
        if (!relation) return '<div class="graph-property-empty">所选关系已经不存在。</div>';
        return `
          <div class="graph-property-panel" data-focus-kind="relation" data-focus-ref="${escapeAttribute(relation.relation_ref)}">
            <h3>流程关系</h3>
            <label>关系类型<select data-graph-property="relation_type">${optionHtml(RELATION_TYPES, relation.relation_type)}</select></label>
            <label>起点<select data-graph-property="from_behavior_ref">${optionHtml(behaviorOptions('请选择起点'), relation.from_behavior_ref)}</select></label>
            <label>终点<select data-graph-property="to_behavior_ref">${optionHtml(behaviorOptions('请选择终点'), relation.to_behavior_ref)}</select></label>
            <label>关系条件<input data-graph-property="condition" value="${escapeAttribute(relation.condition || '')}"></label>
            <details><summary>技术标识</summary><code>${escapeHtml(relation.relation_ref)}</code></details>
            <div class="item-actions">
              <button class="button primary small" data-action="apply-flow-property">应用修改</button>
              <button class="button danger small" data-action="delete-graph-selection">删除关系</button>
            </div>
          </div>`;
      }
      const behavior = selection.draft || currentDocument().behaviors.find(item => item.behavior_ref === selection.ref);
      if (!behavior) return '<div class="graph-property-empty">所选节点已经不存在。</div>';
      const isControl = ['decision', 'parallel_split', 'parallel_join'].includes(behavior.node_type);
      const actor = parseActorRole(behavior.current_actor_role);
      const positions = rosterRolesByDepartment[actor.department] || [];
      const isEntry = !(currentDocument().flow_relations || []).some(relation =>
        relation.to_behavior_ref === behavior.behavior_ref && relation.relation_type !== 'loop'
      );
      return `
        <div class="graph-property-panel" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(behavior.behavior_ref)}">
          <h3>${isControl ? '流程控制节点' : '业务行为'}</h3>
          <label>节点类型<select data-graph-property="node_type">${optionHtml(NODE_TYPES, behavior.node_type)}</select></label>
          <label>节点名称<input data-graph-property="behavior_name" value="${escapeAttribute(behavior.behavior_name)}"></label>
          ${isControl ? `
            <div class="inline-note">流程控制，不代表执行部门。切换类型不会删除原有普通行为字段。</div>
            <details><summary>原普通行为字段（只读保留）</summary>
              <div class="technical-note">执行主体：${escapeHtml(behavior.current_actor_role || '空')}<br>具体做什么：${escapeHtml(behavior.behavior_description || '空')}<br>完成标准：${escapeHtml(behavior.completion_standard || '空')}</div>
            </details>` : `
            <label>具体做什么<textarea data-graph-property="behavior_description">${escapeHtml(behavior.behavior_description)}</textarea></label>
            <label>执行主体确定方式<select data-graph-property="actor_assignment_mode">${optionHtml(ACTOR_ASSIGNMENT_MODES, actorAssignmentMode(behavior))}</select></label>
            ${actorAssignmentMode(behavior) === 'fixed_department' ? `
              <label>执行部门<select data-graph-actor-department>${optionHtml([''].concat(DEPARTMENTS.filter(item => item !== '全公司')), actor.department)}</select></label>
              <label>执行岗位<select data-graph-actor-position>${optionHtml([''].concat(positions), actor.position)}</select></label>` : ''}
            ${actorAssignmentMode(behavior) === 'dynamic_from_data' ? `
              <label>执行部门来源数据<select data-graph-property="actor_department_data_ref">${optionHtml([{ value: '', label: '请选择前序数据' }].concat((currentDocument().data_objects || []).map(item => ({ value: item.data_ref, label: item.data_name || '未命名数据' }))), behavior.actor_department_data_ref || '')}</select></label>
              <label>岗位或责任人确定规则<textarea data-graph-property="actor_position_rule">${escapeHtml(behavior.actor_position_rule)}</textarea></label>` : ''}
            ${isEntry ? `<label>流程如何开始<textarea data-graph-property="trigger">${escapeHtml(behavior.trigger)}</textarea></label>` : '<div class="inline-note">当前节点已有非回路入边，“流程如何开始”只读保留，请通过流程关系理解入口条件。</div>'}
            <label>办理时限<input data-graph-property="timing" value="${escapeAttribute(behavior.timing || '')}"></label>
            <label>完成标准<textarea data-graph-property="completion_standard">${escapeHtml(behavior.completion_standard)}</textarea></label>
            <label class="check-row"><input type="checkbox" data-graph-countersign ${behavior.countersign_all_required ? 'checked' : ''}>全部指定部门确认后完成会签</label>
            <div class="check-grid">${DEPARTMENTS.filter(item => !['全公司', '公司领导'].includes(item)).map(department => `
              <label class="check-row"><input type="checkbox" data-graph-countersign-target value="${escapeAttribute(department)}" ${behavior.countersign_target_departments.includes(department) ? 'checked' : ''}>${escapeHtml(department)}</label>`).join('')}</div>`}
          <details><summary>技术标识和历史文字</summary><code>${escapeHtml(behavior.behavior_ref)}</code><div class="technical-note">输入说明：${escapeHtml(behavior.input_description || '空')}<br>输出说明：${escapeHtml(behavior.output_description || '空')}</div></details>
          <div class="item-actions">
            <button class="button primary small" data-action="apply-flow-property">应用修改</button>
            <button class="button danger small" data-action="delete-graph-selection">删除节点</button>
          </div>
        </div>`;
    }

    function renderDiagramPanel(model) {
      const history = graphHistoryState();
      const collisionNotice = model.layout?.collisions?.length
        ? `<div class="diagram-notice warning">自动避让执行6轮后仍有${model.layout.collisions.length}项碰撞。该告警不修改JSON、不阻止导出，但当前版本不能发布。</div>`
        : '';
      return `
        <section class="section diagram-section${diagramExpanded ? ' diagram-expanded' : ''}">
          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>${escapeHtml(currentDocument().process.process_name || '未命名流程')} · 流程关系</h2>
                <p>普通行为进入部门泳道；判断和并行节点进入顶部“流程控制”带。一对多和多对一使用多条独立关系。</p>
              </div>
              <div class="diagram-controls">
                <button class="button primary small" data-action="add-graph-node">新增节点</button>
                <button class="button secondary small" data-action="start-flow-relation">建立关系</button>
                <button class="button small" data-action="undo-graph" ${history.canUndo ? '' : 'disabled'}>撤销</button>
                <button class="button small" data-action="redo-graph" ${history.canRedo ? '' : 'disabled'}>重做</button>
                ${renderGraphViewActions('flow')}
              </div>
            </div>
            ${renderDiagramLegend()}
            ${collisionNotice}
            <div class="diagram-notice" id="diagramViewportNotice" role="status" hidden>
              当前已聚焦流程开头，点击“适应画布”查看完整流程
            </div>
            <div class="graph-editor-layout">
              <div>
                <div class="diagram-canvas" id="processDiagramCanvas" role="application" aria-label="可编辑流程关系图"></div>
                <div class="diagram-failure" id="diagramFailure" role="alert"></div>
              </div>
              <aside class="graph-property-shell" aria-label="当前选择属性">${renderFlowPropertyPanel()}</aside>
            </div>
            ${renderDiagramWarnings(model)}
          </div>
        </section>`;
    }

    function ensureActiveGraphDataObject() {
      const dataObjects = currentDocument()?.data_objects || [];
      if (!dataObjects.some(item => item.data_ref === activeDataRef)) activeDataRef = dataObjects[0]?.data_ref || '';
      return dataObjects.find(item => item.data_ref === activeDataRef) || null;
    }

    function renderDataPropertyPanel() {
      const dataObject = ensureActiveGraphDataObject();
      if (!dataObject) return '<div class="graph-property-empty">新增数据对象后，可以围绕它建立直接数据关系。</div>';
      const selection = graphSelection;
      if (selection?.kind === 'data-behavior-choice' && selection.dataRef === dataObject.data_ref) {
        return `
          <div class="graph-property-panel">
            <h3>选择关联行为</h3>
            <p class="technical-note">数据模式只编辑数据关系，业务行为仍是只读端点。</p>
            <label>业务行为<select data-graph-data-behavior>${optionHtml(behaviorOptions('请选择业务行为'), selection.behaviorRef || '')}</select></label>
            <div class="item-actions">
              <button class="button primary small" data-action="continue-data-relation" ${selection.behaviorRef ? '' : 'disabled'}>继续</button>
              <button class="button small" data-action="cancel-data-relation">取消</button>
            </div>
          </div>`;
      }
      if (selection?.kind === 'data-edge' && selection.dataRef === dataObject.data_ref) {
        const behavior = currentDocument().behaviors.find(item => item.behavior_ref === selection.behaviorRef);
        const operations = selection.operations || dataObject.behavior_links.filter(link => link.behavior_ref === selection.behaviorRef).map(link => link.operation);
        return `
          <div class="graph-property-panel">
            <h3>${escapeHtml(behavior?.behavior_name || '业务行为')} · 数据操作</h3>
            <p class="technical-note">业务行为是只读端点。需要修改行为时可转到流程关系模式。</p>
            <div class="check-grid">${DATA_OPERATIONS.map(option => `
              <label class="check-row"><input type="checkbox" data-graph-data-operation value="${option.value}" ${operations.includes(option.value) ? 'checked' : ''}>${option.label}</label>`).join('')}</div>
            <div class="item-actions">
              <button class="button primary small" data-action="apply-data-operations">应用数据操作</button>
              <button class="button small" data-action="open-flow-behavior" data-ref="${escapeAttribute(selection.behaviorRef)}">转到流程关系</button>
            </div>
          </div>`;
      }
      const draft = selection?.kind === 'data' && selection.ref === dataObject.data_ref ? (selection.draft || dataObject) : dataObject;
      return `
        <div class="graph-property-panel" data-focus-kind="data" data-focus-ref="${escapeAttribute(dataObject.data_ref)}">
          <h3>当前数据对象</h3>
          <label>数据名称<input data-graph-data-property="data_name" value="${escapeAttribute(draft.data_name)}"></label>
          <label>说明<textarea data-graph-data-property="description">${escapeHtml(draft.description)}</textarea></label>
          <label>信息类型<select data-graph-data-property="information_type">${optionHtml(INFORMATION_TYPE_OPTIONS, draft.information_type)}</select></label>
          <details><summary>技术标识和来源线索</summary><code>${escapeHtml(dataObject.data_ref)}</code><div class="technical-note">来源线索${dataObject.source_relations.length}项；默认不展开。</div></details>
          <div class="item-actions">
            <button class="button primary small" data-action="apply-data-property">应用修改</button>
            <button class="button secondary small" data-action="choose-data-behavior">建立数据关系</button>
            <button class="button danger small" data-action="delete-data-object">删除数据对象</button>
          </div>
        </div>`;
    }

    function renderDataDiagramPanel() {
      const dataObject = ensureActiveGraphDataObject();
      const history = graphHistoryState();
      const sameNameCount = dataObject
        ? currentDocument().data_objects.filter(item => item.data_ref !== dataObject.data_ref && text(item.data_name).trim() === text(dataObject.data_name).trim() && text(item.data_name).trim()).length
        : 0;
      return `
        <section class="section diagram-section">
          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>数据关系</h2>
                <p>一次只围绕一个数据对象显示直接关联行为；图例中的箭头说明业务行为与数据对象之间的操作方向。</p>
              </div>
              <div class="diagram-controls">
                <button class="button primary small" data-action="add-graph-data">新增数据</button>
                <button class="button secondary small" data-action="merge-current-data" ${sameNameCount ? '' : 'disabled'}>归并同名数据</button>
                <button class="button small" data-action="undo-graph" ${history.canUndo ? '' : 'disabled'}>撤销</button>
                <button class="button small" data-action="redo-graph" ${history.canRedo ? '' : 'disabled'}>重做</button>
                ${renderGraphViewActions('data')}
              </div>
            </div>
            <div class="diagram-legend-shell data-relation-legend" aria-label="数据关系图图例">
              <strong class="data-relation-legend-title">数据关系图图例</strong>
              <div class="diagram-legend-list" role="list">
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-node" aria-hidden="true">行为</span>
                  <span class="diagram-legend-copy"><strong>业务行为</strong><small>执行数据操作的只读端点</small></span>
                </div>
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-node data" aria-hidden="true">数据</span>
                  <span class="diagram-legend-copy"><strong>数据对象</strong><small>当前查看和维护的数据</small></span>
                </div>
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-edge" aria-hidden="true"><span>行为</span><b>→</b><span>数据</span></span>
                  <span class="diagram-legend-copy"><strong>创建</strong><small>业务行为 → 数据对象</small></span>
                </div>
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-edge" aria-hidden="true"><span>行为</span><b>↔</b><span>数据</span></span>
                  <span class="diagram-legend-copy"><strong>更新</strong><small>业务行为 ↔ 数据对象</small></span>
                </div>
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-edge" aria-hidden="true"><span>数据</span><b>→</b><span>行为</span></span>
                  <span class="diagram-legend-copy"><strong>使用</strong><small>数据对象 → 业务行为</small></span>
                </div>
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-edge pending" aria-hidden="true"><span>行为</span><b>?</b><span>数据</span></span>
                  <span class="diagram-legend-copy"><strong>待确认</strong><small>操作和方向尚未确认</small></span>
                </div>
              </div>
              <p class="diagram-reading-tip">包含“使用”操作的业务行为显示在数据对象右侧，其他直接关联行为显示在左侧。箭头方向表示数据由业务行为创建，或由数据对象流向使用它的业务行为；双向箭头表示业务行为更新数据。“待确认”表示当前记录尚未确认操作和方向。</p>
            </div>
            <div class="data-focus-selector">
              <label>当前数据对象
                <select data-graph-data-focus>${optionHtml((currentDocument().data_objects || []).map(item => ({ value: item.data_ref, label: item.data_name || '未命名数据' })), activeDataRef)}</select>
              </label>
              <span class="technical-note">只显示当前对象的直接关系；切换对象不会修改JSON。</span>
            </div>
            ${dataObject ? `
              <div class="graph-editor-layout">
                <div>
                  <div class="diagram-canvas data-relation-canvas" id="dataRelationDiagramCanvas" role="application" aria-label="当前数据对象的直接关系图"></div>
                  <div class="diagram-failure" id="dataDiagramFailure" role="alert"></div>
                </div>
                <aside class="graph-property-shell" aria-label="当前选择属性">${renderDataPropertyPanel()}</aside>
              </div>` : `
              <div class="diagram-empty"><h2>尚未登记数据对象</h2><p>点击“新增数据”开始编制数据关系。</p></div>`}
          </div>
        </section>`;
    }

    function destroyDiagram() {
      if (!diagramView) return;
      try {
        diagramView.destroy();
      } catch (_error) {
        // The text editor must remain available even if the graph library has already released the canvas.
      }
      diagramView = null;
    }

    function destroyDataDiagram() {
      if (!dataDiagramView) return;
      try {
        dataDiagramView.destroy();
      } catch (_error) {
        // The text editor remains available if the data canvas has already been released.
      }
      dataDiagramView = null;
    }

    function destroyReviewPatternDiagrams() {
      reviewPatternViews.forEach(view => {
        try {
          view.destroy();
        } catch (_error) {
          // The review page must remain usable if a graph canvas has already been released.
        }
      });
      reviewPatternViews.clear();
    }

    function mountReviewPatternDiagrams() {
      destroyReviewPatternDiagrams();
      if (activeWorkspaceTab !== 'editor' || activeEditorSection !== 'export') return;
      const patternApi = globalThis.ReviewPatternDiagrams;
      if (!patternApi?.definitions || !patternApi?.mount) return;
      patternApi.definitions().forEach(pattern => {
        const container = document.getElementById(`reviewPatternDiagram-${pattern.id}`);
        const failure = document.getElementById(`reviewPatternFailure-${pattern.id}`);
        const viewportNote = document.getElementById(`reviewPatternViewport-${pattern.id}`);
        if (!container) return;
        try {
          const view = patternApi.mount({
            container,
            pattern,
            processDiagram: globalThis.ProcessDiagram,
            onViewportModeChange(viewport) {
              if (!viewportNote) return;
              viewportNote.textContent = viewport?.mode === 'start'
                ? '当前显示图例开头；点击“适应画布”查看完整结构。'
                : '图例可拖动，可使用滚轮缩放。';
            }
          });
          reviewPatternViews.set(pattern.id, view);
          view.cy?.ready(() => view.fit());
        } catch (error) {
          container.hidden = true;
          if (failure) {
            failure.textContent = `图例未显示：${error.message}`;
            failure.style.display = 'grid';
          }
        }
      });
    }

    function mountDiagram() {
      destroyDiagram();
      if (activeWorkspaceTab !== 'flow') return;
      const data = currentDocument();
      const model = currentDiagramModel(data);
      if (!data || !model.namedBehaviorCount) return;
      const container = document.getElementById('processDiagramCanvas');
      const failure = document.getElementById('diagramFailure');
      if (!container) return;
      try {
        diagramView = window.ProcessDiagram.mount({
          container,
          documentData: data,
          departmentOrder: actorDepartments(),
          editable: true,
          viewport: graphStateManager.view(candidateStateKey()).flow,
          onFocus: handleFlowDiagramFocus,
          onViewportModeChange(viewport) {
            const notice = document.getElementById('diagramViewportNotice');
            if (notice) notice.hidden = viewport?.mode !== 'start';
          }
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `流程图暂时无法生成：${error.message}。当前文字内容仍然保留，可以继续编制或导出。`;
          failure.classList.add('show');
        }
      }
    }

    function captureGraphViewport() {
      const entry = currentEntry();
      if (!entry) return;
      const patch = {};
      if (diagramView?.viewport) patch.flow = diagramView.viewport();
      if (dataDiagramView?.viewport) patch.data = { ...dataDiagramView.viewport(), dataRef: activeDataRef };
      if (Object.keys(patch).length) graphStateManager.updateView(candidateStateKey(entry), patch);
    }

    function handleFlowDiagramFocus(focusKind, focusRef) {
      captureGraphViewport();
      if (flowRelationDraft && focusKind === 'behavior') {
        if (flowRelationDraft.stage === 'source') {
          flowRelationDraft.from_behavior_ref = focusRef;
          flowRelationDraft.stage = 'target';
        } else if (flowRelationDraft.stage === 'target') {
          flowRelationDraft.to_behavior_ref = focusRef;
          flowRelationDraft.stage = 'confirm';
        }
        render();
        return;
      }
      if (focusKind === 'data-badge') {
        const related = currentDocument().data_objects.find(item => item.behavior_links.some(link => link.behavior_ref === focusRef));
        if (related) activeDataRef = related.data_ref;
        graphSelection = related ? { kind: 'data', ref: related.data_ref, draft: clone(related) } : null;
        activeWorkspaceTab = 'data';
        render();
        return;
      }
      if (focusKind === 'form-badge') {
        const form = currentDocument().forms.find(item => item.behavior_links.some(link => link.behavior_ref === focusRef));
        if (form) activeFormRef = form.form_ref;
        activeEditorSection = 'forms';
        activeWorkspaceTab = 'editor';
        render();
        return;
      }
      if (focusKind === 'behavior') {
        const item = currentDocument().behaviors.find(behavior => behavior.behavior_ref === focusRef);
        graphSelection = item ? { kind: 'behavior', ref: focusRef, draft: clone(item) } : null;
        activeBehaviorRef = focusRef;
      } else if (focusKind === 'relation') {
        const item = currentDocument().flow_relations.find(relation => relation.relation_ref === focusRef);
        graphSelection = item ? { kind: 'relation', ref: focusRef, draft: clone(item) } : null;
        activeRelationRef = focusRef;
      }
      render();
    }

    function mountDataDiagram() {
      destroyDataDiagram();
      if (activeWorkspaceTab !== 'data' || !ensureActiveGraphDataObject()) return;
      const container = document.getElementById('dataRelationDiagramCanvas');
      const failure = document.getElementById('dataDiagramFailure');
      if (!container) return;
      try {
        dataDiagramView = globalThis.DataRelationDiagram.mount({
          container,
          documentData: currentDocument(),
          selectedDataRef: activeDataRef,
          viewport: graphStateManager.view(candidateStateKey()).data,
          onFocus(item) {
            captureGraphViewport();
            if (item.kind === 'behavior') {
              graphSelection = {
                kind: 'data-edge',
                dataRef: activeDataRef,
                behaviorRef: item.ref,
                operations: currentDocument().data_objects.find(data => data.data_ref === activeDataRef)?.behavior_links
                  .filter(link => link.behavior_ref === item.ref).map(link => link.operation) || []
              };
            } else if (item.kind === 'data-relation') {
              graphSelection = {
                kind: 'data-edge',
                dataRef: item.dataRef,
                behaviorRef: item.behaviorRef,
                operations: text(item.operations).split(',').filter(Boolean)
              };
            } else {
              const dataObject = ensureActiveGraphDataObject();
              graphSelection = dataObject ? { kind: 'data', ref: dataObject.data_ref, draft: clone(dataObject) } : null;
            }
            render();
          }
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `数据关系图暂时无法生成：${error.message}。文字编制、导入、校验和导出仍可使用。`;
          failure.classList.add('show');
        }
      }
    }

    function setActiveWorkspaceTab(tab) {
      captureGraphViewport();
      if (tab === 'versions') {
        activeWorkspaceTab = 'versions';
        diagramExpanded = false;
        render();
        return;
      }
      if (!currentDocument()) return;
      activeWorkspaceTab = ['flow', 'data', 'editor'].includes(tab) ? tab : 'flow';
      if (activeWorkspaceTab !== 'flow') diagramExpanded = false;
      const entry = currentEntry();
      if (entry) graphStateManager.updateView(candidateStateKey(entry), { mode: activeWorkspaceTab === 'data' ? 'data' : 'flow' });
      render();
    }

    async function validateGraphDocument(documentValue) {
      const response = await fetch('/api/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: documentValue })
      });
      const result = await readJsonResponse(response, '3001图编辑校验接口未返回结构化数据。');
      if (!response.ok) throw new Error(result.error || '校验服务不可用');
      return result;
    }

    function updateSelectionFromGraphResult(result) {
      const selected = result?.details?.selected;
      if (!selected) return;
      if (selected.kind === 'behavior') {
        const item = currentDocument().behaviors.find(value => value.behavior_ref === selected.ref);
        graphSelection = item ? { kind: 'behavior', ref: selected.ref, draft: clone(item) } : null;
        activeBehaviorRef = selected.ref;
      } else if (selected.kind === 'relation') {
        const item = currentDocument().flow_relations.find(value => value.relation_ref === selected.ref);
        graphSelection = item ? { kind: 'relation', ref: selected.ref, draft: clone(item) } : null;
        activeRelationRef = selected.ref;
      } else if (selected.kind === 'data') {
        const item = currentDocument().data_objects.find(value => value.data_ref === selected.ref);
        activeDataRef = selected.ref;
        graphSelection = item ? { kind: 'data', ref: selected.ref, draft: clone(item) } : null;
      }
    }

    async function refreshValidationAfterGraphCommand(documentValue) {
      try {
        const result = await validateGraphDocument(documentValue);
        if (!result.valid) {
          const first = result.errors?.[0];
          showStatus(`图操作已保留；当前草稿还有${result.errors?.length || 1}项结构阻断。${first ? `${validationErrorLocation(first)}：${first.message}` : ''}`, 'error');
        }
      } catch (error) {
        showStatus(`图操作已保留；完整结构校验暂未刷新：${error.message}`, 'error');
      }
    }

    async function runGraphCommand(command, options = {}) {
      const entry = currentEntry();
      if (!entry) return false;
      captureGraphViewport();
      const preview = globalThis.GraphEditCommands.applyCommand(entry.data, command);
      if (!preview.ok) {
        const impacts = preview.details?.impacts || [];
        const impactText = impacts.length ? `：${impacts.map(item => `${item.label}${item.ref ? `（${item.ref}）` : ''}`).join('、')}` : '';
        showStatus(`${preview.message}${impactText}`, 'error');
        return false;
      }
      if (options.prevalidate) {
        try {
          const validation = await validateGraphDocument(preview.document);
          if (!validation.valid) {
            const first = validation.errors?.[0];
            throw new Error(first ? `${validationErrorLocation(first)}：${first.message}` : '副本未通过结构校验');
          }
        } catch (error) {
          showStatus(`${options.failureLabel || '图操作'}未执行：${error.message}。当前草稿保持不变。`, 'error');
          return false;
        }
      }
      const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => preview);
      if (!result.ok) {
        showStatus(result.message || '图操作未执行', 'error');
        return false;
      }
      entry.data = result.document;
      updateSelectionFromGraphResult(result);
      if (command.type === 'delete_object') {
        const collection = command.kind === 'behavior'
          ? entry.data.behaviors
          : command.kind === 'relation'
            ? entry.data.flow_relations
            : command.kind === 'data'
              ? entry.data.data_objects
              : [];
        const refKey = command.kind === 'behavior' ? 'behavior_ref' : command.kind === 'relation' ? 'relation_ref' : 'data_ref';
        const nearby = collection[Math.min(result.details?.previousIndex || 0, Math.max(0, collection.length - 1))];
        graphSelection = nearby ? { kind: command.kind, ref: nearby[refKey], draft: clone(nearby) } : null;
        if (command.kind === 'behavior') activeBehaviorRef = nearby?.behavior_ref || '';
        if (command.kind === 'relation') activeRelationRef = nearby?.relation_ref || '';
        if (command.kind === 'data') activeDataRef = nearby?.data_ref || '';
      }
      refreshCandidateDirty(entry);
      render();
      if (result.details?.warnings?.length) {
        showStatus(`${options.successLabel || '图操作已完成'}。请核对：${result.details.warnings.join('；')}`, 'success');
      } else if (options.successLabel) {
        showStatus(options.successLabel, 'success');
      }
      refreshValidationAfterGraphCommand(result.document);
      return true;
    }

    function newGraphBehavior() {
      return {
        behavior_ref: newRef('behavior'),
        node_type: 'action',
        behavior_name: '未命名业务行为',
        behavior_description: '',
        current_actor_role: '',
        actor_assignment_mode: 'fixed_department',
        actor_department_data_ref: null,
        actor_position_rule: '',
        trigger: '',
        precondition: '',
        input_description: '',
        timing: null,
        completion_standard: '',
        output_description: '',
        countersign_all_required: false,
        countersign_target_departments: []
      };

    function newGraphDataObject() {
      return {
        data_ref: newRef('data'),

    function applyGraphHistory(direction) {
      const entry = currentEntry();
      if (!entry) return;
      captureGraphViewport();
      const result = direction === 'undo'
        ? graphStateManager.undo(candidateStateKey(entry), entry.data)
        : graphStateManager.redo(candidateStateKey(entry), entry.data);
      if (!result.ok) return showStatus(result.message, 'error');
      entry.data = result.document;
      refreshCandidateDirty(entry);
      graphSelection = null;
      ensureActiveGraphDataObject();
      render();
      showStatus(direction === 'undo' ? '已撤销上一次图操作。' : '已重做上一次图操作。', 'success');
      refreshValidationAfterGraphCommand(result.document);

    function applyGraphPropertyDraft() {
      if (!graphSelection?.draft) return;
      if (graphSelection.kind === 'behavior') {
        return runGraphCommand({ type: 'update_behavior', behavior: graphSelection.draft }, { successLabel: '节点属性已更新' });
      }
      if (graphSelection.kind === 'relation') {
        return runGraphCommand({ type: 'upsert_flow_relation', relation: graphSelection.draft }, { successLabel: '流程关系已更新' });
      }
    }

    function deleteGraphObject(kind, ref) {
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), kind, ref);
      if (impacts.length) {
        showStatus(`不能删除：该对象仍被${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}引用。请先转到对应内容移除或替换引用。`, 'error');
        return;
      }
      if (!window.confirm('删除后可通过本候选流程的“撤销”恢复。确定删除吗？')) return;
      return runGraphCommand({ type: 'delete_object', kind, ref }, { successLabel: '对象已删除' });
    }

    async function mergeCurrentDataObjects() {
      const keep = ensureActiveGraphDataObject();
      if (!keep) return;
      const removing = currentDocument().data_objects.filter(item => item.data_ref !== keep.data_ref && text(item.data_name).trim() === text(keep.data_name).trim());
      const preview = globalThis.GraphEditCommands.mergePreview(currentDocument(), keep.data_ref, removing.map(item => item.data_ref));
      if (!preview.ok) return showStatus(preview.message, 'error');
      const valueChoices = {};
      for (const conflict of preview.details.valueConflicts) {
        const choices = [keep, ...removing].map((item, index) => `${index}：${text(item[conflict.field]) || '（空）'}`).join('\n');
        const answer = window.prompt(`字段“${conflict.field}”存在不同值。请输入要保留的编号：\n${choices}`, '0');
        if (answer == null) return showStatus('已取消归并，当前草稿保持不变。');
        const choiceIndex = Number(answer);
        if (!Number.isInteger(choiceIndex) || choiceIndex < 0 || choiceIndex > removing.length) return showStatus('归并未执行：保留值编号无效。', 'error');
        valueChoices[conflict.field] = choiceIndex === 0 ? 'keep' : removing[choiceIndex - 1].data_ref;
      }
      const impactCount = preview.details.impacts.reduce((sum, item) => sum + item.behaviorLinks + item.sourceRelations + item.fieldReferences, 0);
      if (!window.confirm(`将${removing.length + 1}个同名数据归并为当前对象“${keep.data_name}”，涉及${impactCount}项关系或引用。归并副本校验通过后才会替换草稿。确定继续吗？`)) return;
      return runGraphCommand({
        type: 'merge_data_objects',
        keepRef: keep.data_ref,
        removeRefs: removing.map(item => item.data_ref),
        valueChoices
      }, { prevalidate: true, failureLabel: '同名数据归并', successLabel: `已归并同名数据“${keep.data_name}”` });
    }

    function focusEditorTarget(target = {}) {
      const focusKind = text(target.focusKind);
      const focusRef = text(target.focusRef);
      const focusPaths = [...new Set([
        text(target.focusPath),
        ...(Array.isArray(target.focusPaths) ? target.focusPaths.map(text) : [])
      ].filter(Boolean))];
      if (focusKind === 'call') {
        showStatus('部门内调用仅用于预览，请在MDM平台正式功能中维护。');
        return;
      }
      diagramExpanded = false;
      activeWorkspaceTab = 'editor';
      activeEditorSection = EDITOR_SECTIONS.some(item => item.value === target.editorSection)
        ? target.editorSection
        : 'process';
      if (PROCESS_SECTIONS.some(item => item.value === target.processSection)) {
        activeProcessSection = target.processSection;
      }
      if (focusKind === 'behavior') {
        activeEditorSection = 'process';
        activeProcessSection = 'behaviors';
        activeBehaviorRef = focusRef;
      } else if (focusKind === 'relation') {
        activeEditorSection = 'process';
        activeProcessSection = 'relations';
        activeRelationRef = focusRef;
      } else if (focusKind === 'data') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = focusRef;
      } else if (focusKind === 'form') {
        activeEditorSection = 'forms';
        activeFormRef = focusRef;
      } else if (focusKind === 'area') {
        activeEditorSection = 'forms';
        const owner = currentDocument()?.forms?.find(form =>
          form.areas.some(area => area.area_ref === focusRef)
        );
        if (owner) {
          activeFormRef = owner.form_ref;
          activeAreaRef = focusRef;
        }
        const itemPath = focusPaths
          .map(path => path.match(/^forms\.(\d+)\.areas\.(\d+)\.items\.(\d+)\.(?:business_data_ref|value_origin_mode|source_links)/))
          .find(Boolean);
        if (itemPath) {
          activeFormItemRef = currentDocument()?.forms?.[Number(itemPath[1])]
            ?.areas?.[Number(itemPath[2])]?.items?.[Number(itemPath[3])]?.item_ref || '';
        }
      }
      render();
      requestAnimationFrame(() => {
        const card = Array.from(workspace.querySelectorAll('[data-focus-kind]')).find(item =>
          item.dataset.focusKind === focusKind && item.dataset.focusRef === text(focusRef)
        );
        const controls = Array.from(
          workspace.querySelectorAll('[data-bind], [data-focus-key], [data-list-bind]')
        ).filter(item =>
          focusPaths.includes(item.dataset.bind)
          || focusPaths.includes(item.dataset.focusKey)
          || focusPaths.includes(item.dataset.listBind)
        );
        controls.forEach(control => {
          const details = control.closest('details');
          if (details) details.open = true;
        });
        const focusTarget = controls.find(control => !control.disabled)
          || controls[0]
          || card
          || workspace.querySelector('.section');
        if (!focusTarget) return;
        workspace.querySelectorAll('.focused-card, .focused-control').forEach(item => {
          item.classList.remove('focused-card', 'focused-control');
          item.removeAttribute('aria-invalid');
        });
        if (controls.length) {
          controls.forEach(control => {
            void control.offsetWidth;
            control.classList.add('focused-control');
            control.setAttribute('aria-invalid', 'true');
          });
          if (!focusTarget.disabled) focusTarget.focus({ preventScroll: true });
        } else {
          focusTarget.classList.add('focused-card');
          focusTarget.setAttribute('tabindex', '-1');
          focusTarget.focus({ preventScroll: true });
        }
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (focusClearTimer) clearTimeout(focusClearTimer);
        focusClearTimer = setTimeout(() => {
          focusTarget.classList.remove('focused-card');
          controls.forEach(control => {
            control.classList.remove('focused-control');
            control.removeAttribute('aria-invalid');
          });
        }, 2900);
      });
    }

    function focusEditorItem(focusKind, focusRef) {
      focusEditorTarget({ focusKind, focusRef });
    }

    function focusExportWarning(element) {

        processSection: element.dataset.processSection,
        focusKind: element.dataset.focusKind,
        focusRef: element.dataset.focusRef,
        focusPath: element.dataset.focusPath,
        focusPaths
      });
    }

    function behaviorLabel(behaviorRef) {
      const index = currentDocument().behaviors.findIndex(item => item.behavior_ref === behaviorRef);
      if (index < 0) return '本流程关联行为待选择';
      return `${index + 1}. ${currentDocument().behaviors[index].behavior_name || '未命名业务行为'}`;

    function flowItems() {
      const data = currentDocument();
      if (!data) return [];
      return data.behaviors.map((behavior, behaviorIndex) => ({ kind: 'behavior', behavior, behaviorIndex }));

    function ensureActiveFlowItem() {
      const items = flowItems();
      let active = items.find(item => item.behavior.behavior_ref === activeBehaviorRef);

      if (active) {
