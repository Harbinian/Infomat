<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档结构化输出辅助工具</title>
<style>
:root {
  --mdm-bg: #efe7d5;
  --mdm-bg-deep: #e6dcc1;
  --mdm-surface: #f7f1e0;
  --mdm-surface-2: #fbf6e9;
  --mdm-line: rgba(58, 46, 31, 0.16);
  --mdm-line-soft: rgba(58, 46, 31, 0.08);
  --mdm-text: #2a2014;
  --mdm-soft: #7a6a56;
  --mdm-accent: #b25638;
  --mdm-accent-hover: #8f3f2c;
  --mdm-sage: #6f7d4e;
  --mdm-mist: #4a6b7e;
  --mdm-gold: #9a7a30;
  --page: var(--mdm-bg);
  --surface: var(--mdm-surface-2);
  --line: var(--mdm-line);
  --text: var(--mdm-text);
  --soft: var(--mdm-soft);
  --green: #4f7f55;
  --red: #b91c1c;
  --blue: var(--mdm-accent);
  --blue-soft: #fff7e8;
  --manual: #8b5cf6;
  --imported: #8b806f;
  --auto: var(--mdm-sage);
  --warning: var(--mdm-gold);
  --shadow: 0 4px 12px rgba(58, 46, 31, 0.06);
  --radius: 8px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  color: var(--text);
  background: var(--page);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
}
button, input, textarea, select { font: inherit; }
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: rgba(247, 241, 224, 0.94);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 220px; }
.brand strong { font-size: 18px; }
.brand span { color: var(--soft); font-size: 12px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.btn {
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--text);
  background: var(--surface);
  padding: 8px 12px;
  cursor: pointer;
  min-height: 36px;
}
.btn:hover { border-color: var(--blue); background: var(--blue-soft); }
.btn.primary { color: #fff; background: var(--blue); border-color: var(--blue); }
.btn.warn { color: var(--red); border-color: rgba(214, 66, 66, 0.45); }
.btn:disabled { cursor: not-allowed; opacity: 0.62; }
.file-input { display: none; }
.layout {
  max-width: 1440px;
  margin: 0 auto;
  padding: 18px 24px 32px;
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 16px;
}
.side, .editor { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.side { padding: 16px; align-self: start; position: sticky; top: 74px; }
.status-wrap { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.completion-pie {
  position: relative;
  width: 108px;
  height: 108px;
  border-radius: 50%;
  background: conic-gradient(var(--green) 0deg, var(--red) 0deg);
  display: grid;
  place-items: center;
  flex: 0 0 auto;
}
.completion-pie::after {
  content: "";
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: var(--surface);
  position: absolute;
}
.pie-label {
  position: absolute;
  z-index: 1;
  font-weight: 700;
  font-size: 13px;
  text-align: center;
}
.status-copy { color: var(--soft); font-size: 13px; line-height: 1.6; }
.work-status {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr);
  gap: 10px;
  align-items: center;
  margin: 0 0 14px;
  padding: 10px;
  border: 1px solid rgba(178, 86, 56, 0.28);
  border-radius: 8px;
  background: #fff7e8;
}
.work-status[hidden] { display: none; }
.work-spinner {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  border: 3px solid rgba(178, 86, 56, 0.2);
  border-top-color: var(--blue);
  animation: spin .9s linear infinite;
}
.work-status strong { display: block; font-size: 13px; margin-bottom: 2px; }
.work-status span { display: block; color: var(--soft); font-size: 12px; line-height: 1.5; }
@keyframes spin { to { transform: rotate(360deg); } }
.nav { display: flex; flex-direction: column; gap: 6px; }
.nav button {
  width: 100%;
  border: 0;
  border-radius: 6px;
  background: transparent;
  text-align: left;
  padding: 9px 10px;
  cursor: pointer;
  color: var(--soft);
}
.nav button.active { background: var(--blue-soft); color: var(--blue); font-weight: 700; }
.drop-zone {
  border: 1px dashed var(--blue);
  border-radius: 8px;
  background: var(--blue-soft);
  color: var(--blue);
  padding: 12px;
  margin-top: 14px;
  text-align: center;
  font-size: 13px;
  line-height: 1.5;
}
.drop-zone strong { display: block; font-size: 14px; }
.drop-zone.dragging { background: #f6faf2; border-color: var(--green); color: var(--green); }
.drop-zone.busy {
  border-style: solid;
  border-color: rgba(178, 86, 56, 0.42);
  background: #fff8ef;
  color: var(--blue);
}
.editor { min-height: 680px; padding: 0; overflow: hidden; }
.section-head {
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.section-head h2 { margin: 0; font-size: 20px; }
.section-head p { margin: 4px 0 0; color: var(--soft); font-size: 13px; }
.section-body { padding: 18px 20px 24px; }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.grid.one { grid-template-columns: 1fr; }
.group {
  border-top: 1px solid var(--line);
  padding-top: 18px;
  margin-top: 20px;
}
.group:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
.group-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
.group-title h3 { margin: 0; font-size: 15px; }
.row-list { display: flex; flex-direction: column; gap: 12px; }
.record {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  background: #fffdf8;
}
.record-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
  color: var(--soft);
  font-size: 13px;
}
.process-card {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px;
  background: #fffaf0;
}
.process-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 12px;
}
.process-card-head h3 { margin: 0; font-size: 16px; }
.process-card-head p { margin: 4px 0 0; color: var(--soft); font-size: 13px; }
.process-actions,
.step-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.process-collapsed-summary {
  border: 1px dashed var(--line);
  border-radius: 8px;
  padding: 10px;
  color: var(--text);
  background: #fffdf8;
}
.process-meta-panel,
.step-support-panel {
  margin-bottom: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fffdf8;
}
.process-meta-panel > summary,
.step-support-panel > summary {
  cursor: pointer;
  list-style: none;
  padding: 11px 12px;
  color: var(--text);
  font-size: 13px;
  font-weight: 700;
}
.process-meta-panel > summary::-webkit-details-marker,
.step-support-panel > summary::-webkit-details-marker { display: none; }
.process-meta-panel > summary::after,
.step-support-panel > summary::after {
  content: "展开";
  float: right;
  color: var(--blue);
  font-size: 12px;
  font-weight: 600;
}
.process-meta-panel[open] > summary::after,
.step-support-panel[open] > summary::after { content: "收起"; }
.process-meta-panel-body,
.step-support-panel-body {
  border-top: 1px solid var(--line);
  padding: 12px;
}
.step-workbench {
  display: grid;
  grid-template-columns: minmax(250px, 310px) minmax(0, 1fr);
  gap: 14px;
  align-items: start;
}
.step-list-panel {
  position: sticky;
  top: 86px;
  align-self: start;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #f8f2e7;
}
.step-list-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  margin-bottom: 9px;
}
.step-list-summary div {
  border: 1px solid var(--mdm-line-soft);
  border-radius: 6px;
  padding: 7px 5px;
  background: #fffdf8;
  text-align: center;
}
.step-list-summary strong {
  display: block;
  color: var(--text);
  font-size: 15px;
}
.step-list-summary span {
  color: var(--soft);
  font-size: 11px;
}
.step-filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 8px;
}
.step-filter-bar button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fffdf8;
  color: var(--soft);
  padding: 5px 8px;
  cursor: pointer;
  font-size: 12px;
}
.step-filter-bar button.active {
  border-color: rgba(178, 86, 56, 0.48);
  background: #fff7e8;
  color: var(--blue);
  font-weight: 700;
}
.step-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 62vh;
  overflow: auto;
  padding-right: 3px;
}
.step-list-item {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: #fffdf8;
  color: var(--text);
  padding: 8px;
  cursor: pointer;
  text-align: left;
}
.step-list-item:hover { border-color: rgba(178, 86, 56, 0.48); }
.step-list-item.active {
  border-color: var(--blue);
  box-shadow: inset 3px 0 0 var(--blue);
  background: #fff7e8;
}
.step-list-item-head {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
}
.step-index {
  min-width: 26px;
  color: var(--soft);
  font-size: 11px;
  font-weight: 700;
}
.step-type-badge,
.step-duplicate-badge {
  border-radius: 999px;
  padding: 2px 6px;
  font-size: 10px;
  white-space: nowrap;
}
.step-type-badge { color: var(--mdm-mist); background: #edf3f5; }
.step-type-badge.decision { color: #765b20; background: #fff2c7; }
.step-duplicate-badge { margin-left: auto; color: #8a3f2b; background: #fbe2d7; }
.step-list-name {
  display: -webkit-box;
  overflow: hidden;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-height: 1.45;
  font-size: 12px;
  font-weight: 700;
}
.step-list-status {
  margin-top: 5px;
  color: var(--soft);
  font-size: 11px;
}
.step-list-status.complete { color: var(--green); }
.step-list-footer {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}
.step-list-footer .btn { flex: 1; padding: 6px 8px; min-height: 32px; font-size: 12px; }
.step-editor {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fffdf8;
  overflow: hidden;
}
.step-editor-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: 12px;
  border-bottom: 1px solid var(--line);
  background: #fffaf0;
}
.step-editor-head h4 { margin: 0; font-size: 15px; }
.step-editor-head p { margin: 5px 0 0; color: var(--soft); font-size: 12px; line-height: 1.5; }
.step-editor-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}
.step-editor-actions .btn { min-height: 32px; padding: 6px 9px; font-size: 12px; }
.step-editor-body { padding: 12px; }
.step-fill-guide {
  margin-bottom: 12px;
  border-left: 4px solid var(--mdm-sage);
  border-radius: 6px;
  background: #f8fbf1;
  color: #455038;
  padding: 9px 10px;
  font-size: 12px;
  line-height: 1.6;
}
.step-editor-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.step-wide { grid-column: 1 / -1; }
.step-filter-empty {
  border: 1px dashed var(--line);
  border-radius: 7px;
  padding: 16px 10px;
  color: var(--soft);
  background: #fffdf8;
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
}
.transition-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
}
.transition-table th,
.transition-table td {
  border-bottom: 1px solid var(--line);
  padding: 8px;
  text-align: left;
  vertical-align: top;
}
.field {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px;
  background: #fffdf8;
}
.field.missing { border-color: var(--red); box-shadow: 0 0 0 2px rgba(214, 66, 66, 0.08); }
.field.manual { border-left: 4px solid var(--manual); }
.field.auto { border-left: 4px solid var(--auto); }
.field.imported { border-left: 4px solid var(--imported); }
.field.external_reference { border-left: 4px solid var(--blue); }
.readonly-value {
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  background: #f8f2e7;
  color: var(--ink);
}
.readonly-value.empty { color: var(--soft); }
.field label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
}
.required { color: var(--red); }
.origin {
  margin-left: auto;
  color: var(--soft);
  font-size: 12px;
  font-weight: 500;
}
.field input, .field textarea, .field select {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  min-height: 36px;
  padding: 8px;
  background: #fffaf1;
}
.field textarea { min-height: 84px; resize: vertical; }
.source {
  margin-top: 8px;
  border-top: 1px dashed var(--line);
  padding-top: 8px;
}
.source summary { cursor: pointer; color: var(--blue); font-size: 12px; font-weight: 700; }
.source p { margin: 6px 0 0; color: var(--soft); font-size: 12px; white-space: pre-wrap; }
.warning {
  margin-top: 8px;
  border: 1px solid rgba(154, 122, 48, 0.34);
  border-left: 4px solid var(--warning);
  border-radius: 6px;
  background: #fffaf0;
  color: #4a4036;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.5;
}
.external-role-value {
  margin-top: 8px;
  border: 1px solid rgba(154, 122, 48, 0.24);
  border-radius: 6px;
  background: #fff7e2;
  color: #5a4426;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.5;
}
.role-picker {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 8px;
}
.work-role-group {
  margin-top: 14px;
  border: 1px solid rgba(74, 107, 126, 0.22);
  border-radius: 8px;
  padding: 12px;
  background: #fbf8ef;
}
.work-role-group .group-title { margin-bottom: 8px; }
.work-role-group-copy {
  margin: 0 0 10px;
  color: var(--soft);
  font-size: 12px;
  line-height: 1.6;
}
.work-role-list { display: flex; flex-direction: column; gap: 10px; }
.work-role-entry {
  border: 1px solid var(--mdm-line-soft);
  border-radius: 8px;
  padding: 10px;
  background: #fffdf8;
}
.work-role-entry-head,
.work-role-adder-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 10px;
  color: var(--soft);
  font-size: 13px;
}
.work-role-adder {
  margin-top: 10px;
  border: 1px dashed rgba(74, 107, 126, 0.34);
  border-radius: 8px;
  padding: 10px;
  background: #fffaf1;
}
.work-role-adder-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.work-role-adder-grid label {
  display: flex;
  flex-direction: column;
  gap: 6px;
  color: var(--text);
  font-size: 12px;
  font-weight: 700;
}
.work-role-adder-grid input,
.work-role-adder-grid select {
  width: 100%;
  min-height: 36px;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  background: #fffdf8;
}
.work-role-adder-actions {
  display: flex;
  justify-content: flex-end;
  margin-top: 10px;
}
.work-role-empty {
  border: 1px dashed var(--line);
  border-radius: 7px;
  padding: 10px;
  color: var(--soft);
  background: #fffdf8;
  font-size: 12px;
  line-height: 1.6;
}
.work-role-context {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 9px;
  background: #f8f2e7;
  color: var(--soft);
  font-size: 12px;
  line-height: 1.5;
}
.evidence-choice-list {
  display: flex;
  flex-direction: column;
  gap: 7px;
  max-height: 180px;
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 8px;
  background: #fffaf1;
}
.evidence-choice {
  display: grid !important;
  grid-template-columns: 18px minmax(0, 1fr);
  align-items: start !important;
  gap: 7px !important;
  margin: 0 !important;
  font-weight: 500 !important;
  line-height: 1.45;
}
.evidence-choice input { width: auto; min-height: auto; margin-top: 2px; }
.work-role-warning {
  margin-top: 8px;
  color: #765b20;
  font-size: 12px;
  line-height: 1.5;
}
.field-suggestion {
  margin-top: 8px;
  border: 1px solid rgba(111, 125, 78, 0.28);
  border-left: 4px solid var(--mdm-sage);
  border-radius: 6px;
  background: #f8fbf1;
  color: #455038;
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.5;
}
.suggestion-source {
  margin-top: 6px;
  border-top: 1px dashed rgba(111, 125, 78, 0.32);
  padding-top: 6px;
}
.suggestion-source summary {
  cursor: pointer;
  color: var(--mdm-mist);
  font-weight: 700;
}
.suggestion-source p {
  margin: 5px 0 0;
  color: var(--soft);
  white-space: pre-wrap;
}
.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fffdf8;
}
.fields-table {
  width: 100%;
  min-width: 940px;
  border-collapse: separate;
  border-spacing: 0;
  font-size: 13px;
}
.fields-table th,
.fields-table td {
  border-bottom: 1px solid var(--mdm-line-soft);
  border-right: 1px solid var(--mdm-line-soft);
  padding: 8px;
  vertical-align: top;
}
.fields-table th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--mdm-surface);
  color: var(--soft);
  text-align: left;
  white-space: nowrap;
  font-weight: 700;
}
.fields-table th:last-child,
.fields-table td:last-child { border-right: 0; }
.fields-table tr:last-child td { border-bottom: 0; }
.fields-table td.missing-cell { background: #fff7ed; box-shadow: inset 3px 0 0 var(--red); }
.table-control {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fffaf1;
  min-height: 34px;
  padding: 7px 8px;
}
.table-control.textarea {
  min-height: 54px;
  resize: vertical;
}
.table-source summary { cursor: pointer; color: var(--blue); font-size: 12px; font-weight: 700; margin-top: 6px; }
.table-source p { margin: 4px 0 0; color: var(--soft); white-space: pre-wrap; }
.form-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px;
  border: 1px solid var(--mdm-line-soft);
  border-radius: 8px;
  background: rgba(251, 246, 233, 0.72);
}
.table-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 12px;
  padding: 8px;
  border: 1px solid var(--mdm-line-soft);
  border-radius: 8px;
  background: rgba(251, 246, 233, 0.72);
}
.form-selector button,
.table-selector button {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #fffdf8;
  color: var(--soft);
  padding: 7px 10px;
  cursor: pointer;
  min-height: 34px;
}
.form-selector button.active,
.table-selector button.active {
  border-color: rgba(178, 86, 56, 0.48);
  background: #fff7e8;
  color: var(--blue);
  font-weight: 700;
}
.table-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  margin-bottom: 8px;
}
.empty {
  border: 1px dashed var(--line);

  padding: 24px;
  color: var(--soft);
  text-align: center;
  background: #fffdf8;
}
.busy-placeholder {
  min-height: 240px;
  display: grid;

}

.toast {

@media (max-width: 980px) {

}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <strong>文档结构化输出辅助工具</strong>
    <span>导入制度文件后，在本页直接补充和修改</span>
    <span>Deepseek-V4-Pro 1M上下文模型辅助生成</span>
  </div>
  <div class="actions">
    <button class="btn" type="button" id="importDocButton">导入制度文件</button>
    <button class="btn" type="button" id="importStructButton">导入结构化文件</button>
    <button class="btn primary" type="button" id="exportButton">导出结构化文件</button>
    <button class="btn warn" type="button" id="clearButton">清空页面</button>
    <input class="file-input" type="file" id="documentInput" accept=".docx,.txt,.md">
    <input class="file-input" type="file" id="structuredInput" accept=".json,application/json">

</header>

<main class="layout">
  <aside class="side">
    <div class="status-wrap">
      <div class="completion-pie" id="completionPie"><div class="pie-label" id="pieLabel">待导入</div></div>
      <div class="status-copy" id="statusCopy">导入文件后，绿色表示已经可以结构化的必填内容，红色表示还需要补充。</div>
    </div>
    <div class="work-status" id="workStatus" hidden aria-live="polite">
      <div class="work-spinner" aria-hidden="true"></div>
      <div>
        <strong id="workStatusTitle">正在整理制度文件</strong>
        <span id="workStatusDetail">请稍候，页面会在整理完成后自动填充。</span>
      </div>
    </div>
    <nav class="nav" aria-label="结构化输出区块">
      <button type="button" class="active" data-section="basic">基本信息</button>
      <button type="button" data-section="profile">目的与范围</button>
      <button type="button" data-section="terms">术语定义</button>
      <button type="button" data-section="steps">流程步骤</button>

  <section class="editor">
    <div class="section-head">
      <div>
        <h2 id="sectionTitle">基本信息</h2>
        <p id="sectionHint">先导入制度文件，系统会把能整理出来的内容填到这里。</p>
      </div>
      <button class="btn" type="button" id="addButton" hidden>新增一项</button>
    </div>
    <div class="section-body" id="sectionBody">
      <div class="empty">请先导入制度文件或结构化文件。</div>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const sections = {
  basic: { title: '基本信息', hint: '确认制度名称、编号、归口部门和依据类型。' },
  profile: { title: '目的与范围', hint: '目的和适用范围来自标准模板章节，可以直接修改。' },
  terms: { title: '术语定义', hint: '术语来自制度中的术语章节。' },
  steps: { title: '流程步骤', hint: '从左侧步骤清单选择一项，按业务顺序补齐谁来做、何时触发、输入、规则和输出。' },
  forms: { title: '表单与记录', hint: '表单、记录和字段是第一版重点整理内容。' },
  export: { title: '导出结构化文件', hint: '导出的文件只包含当前页面中的结构化内容。' }
};

let sessionId = '';
let currentRequestId = '';
let docData = null;
let fieldSources = {};
let fieldOrigins = {};
let fieldWarnings = {};
let fieldSuggestions = {};
let rosterRolesByDepartment = {};
let workRoles = [];
let workRolesByDepartment = {};
let workRoleParticipationTypes = [];
let activeFormRef = '';
let activeTableRef = '';
let activeSection = 'basic';
let hasPageContent = false;
let isWorking = false;
let isSuggesting = false;
let workTimers = [];
const collapsedProcessRefs = new Set();
const importedConfirmedWorkRoleRefs = new Set();
const activeStepRefsByProcess = new Map();
const stepFiltersByProcess = new Map();
const stepListScrollTopByProcess = new Map();

const DEPARTMENT_OPTIONS = [
  { value: '', label: '请选择' },
  { value: '全公司', label: '全公司', domain: '全公司' },
  { value: '公司领导', label: '公司领导', domain: '公司领导' },
  { value: '工程技术部', label: '工程技术部', domain: '总经理直辖' },
  { value: '质量管理部', label: '质量管理部', domain: '总经理直辖' },
  { value: '财务部', label: '财务部', domain: '总经理直辖' },
  { value: '行政人事部', label: '行政人事部', domain: '经营副总' },
  { value: '经营发展部', label: '经营发展部', domain: '经营副总' },
  { value: '物资保障部', label: '物资保障部', domain: '经营副总' },
  { value: '项目管理部', label: '项目管理部', domain: '生产副总' },
  { value: '复材车间', label: '复材车间', domain: '生产副总' },
  { value: '运维安环部', label: '运维安环部', domain: '生产副总' }
];

const FIELD_TYPE_OPTIONS = ['文本', '长文本', '数字', '日期', '日期时间', '金额', '枚举', { value: '布尔', label: '是/否' }, '部门', '人员', '文件编号', '签名', '图片', '附件', '二维码'];
const DEFAULT_WORK_ROLE_PARTICIPATION_TYPES = [
  { value: 'initiator', label: '发起' },
  { value: 'executor', label: '执行' },
  { value: 'reviewer', label: '审核' },
  { value: 'approver', label: '批准' },
  { value: 'collaborator', label: '协同' },
  { value: 'provider', label: '提供' },
  { value: 'receiver', label: '接收' }
];
const WORK_ROLE_STATUS_OPTIONS = [
  { value: 'proposed', label: '待确认' },
  { value: 'confirmed', label: '已确认' }
];

const importDocButton = document.getElementById('importDocButton');
const importStructButton = document.getElementById('importStructButton');
const exportButton = document.getElementById('exportButton');
const clearButton = document.getElementById('clearButton');
const documentInput = document.getElementById('documentInput');
const structuredInput = document.getElementById('structuredInput');
const sectionBody = document.getElementById('sectionBody');
const addButton = document.getElementById('addButton');
const dropZone = document.getElementById('dropZone');
const workStatus = document.getElementById('workStatus');
const workStatusTitle = document.getElementById('workStatusTitle');
const workStatusDetail = document.getElementById('workStatusDetail');

importDocButton.addEventListener('click', () => {
  if (!isWorking) documentInput.click();
});
importStructButton.addEventListener('click', () => {
  if (!isWorking) structuredInput.click();
});
exportButton.addEventListener('click', exportStructuredFile);
clearButton.addEventListener('click', clearPage);
documentInput.addEventListener('change', event => {
  importDocumentFile(event.target.files[0]);
  event.target.value = '';
});
structuredInput.addEventListener('change', event => {
  importStructuredFile(event.target.files[0]);
  event.target.value = '';
});
addButton.addEventListener('click', addItemForActiveSection);
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
  window.addEventListener(eventName, handleFileDrag, true);
});

function isFileDrag(event) {
  return Array.from(event.dataTransfer?.types || []).includes('Files');
}

function routeDroppedFile(file) {
  if (isWorking) {
    toast('正在整理上一份文件，请稍候。');
    return;
  }
  if (/\.json$/i.test(file.name)) importStructuredFile(file);
  else importDocumentFile(file);
}

function handleFileDrag(event) {
  if (!isFileDrag(event)) return;
  event.preventDefault();
  event.stopPropagation();
  if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();

  if (event.type === 'dragenter' || event.type === 'dragover') {
    dropZone.classList.toggle('dragging', dropZone.contains(event.target));
    return;
  }
  dropZone.classList.remove('dragging');
  if (event.type === 'drop') {
    const file = event.dataTransfer?.files && event.dataTransfer.files[0];
    if (file) routeDroppedFile(file);
  }
}

document.querySelectorAll('.nav button').forEach(button => {
  button.addEventListener('click', () => {
    activeSection = button.dataset.section;
    document.querySelectorAll('.nav button').forEach(item => item.classList.toggle('active', item === button));
    render();
  });
});

window.addEventListener('beforeunload', event => {
  if (!hasPageContent) return;
  event.preventDefault();
  event.returnValue = '刷新后当前内容将清空，请先导出结构化文件。';
});

init();

async function init() {
  const response = await fetch('/api/session', { method: 'POST' });
  const payload = await response.json();
  sessionId = payload.sessionId;
  try {
    const enumsResponse = await fetch('/api/enums');
    if (enumsResponse.ok) applyEnums(await enumsResponse.json());
  } catch (_) {
    rosterRolesByDepartment = {};
    workRoles = [];
    workRolesByDepartment = {};
    workRoleParticipationTypes = [];
  }
}

function toast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2600);
}

function clearWorkTimers() {
  workTimers.forEach(timer => clearTimeout(timer));
  workTimers = [];
}

function setWorkMessage(title, detail) {
  workStatusTitle.textContent = title;
  workStatusDetail.textContent = detail;
  document.getElementById('pieLabel').textContent = '整理中';
  document.getElementById('completionPie').style.background = 'conic-gradient(var(--blue) 0deg 360deg)';
  document.getElementById('statusCopy').textContent = detail;
  if (sectionBody.querySelector('.busy-panel')) renderBusyPlaceholder();
}

function scheduleWorkMessage(delayMs, title, detail, requestId) {
  workTimers.push(setTimeout(() => {
    if (!isWorking || requestId !== currentRequestId) return;
    setWorkMessage(title, detail);
  }, delayMs));
}

function setSuggestionMessage(title, detail) {
  workStatusTitle.textContent = title;
  workStatusDetail.textContent = detail;
}

function scheduleSuggestionMessage(delayMs, title, detail, requestId) {
  workTimers.push(setTimeout(() => {
    if (!isSuggesting || requestId !== currentRequestId) return;
    setSuggestionMessage(title, detail);
  }, delayMs));
}

function setImportControlsDisabled(disabled) {
  importDocButton.disabled = disabled;
  importStructButton.disabled = disabled;
  exportButton.disabled = disabled;
  clearButton.disabled = disabled;
  addButton.disabled = disabled;
}

function renderBusyPlaceholder() {
  sectionBody.innerHTML = '';
  const placeholder = div('busy-placeholder');
  const panel = div('busy-panel');
  const spinner = div('work-spinner');
  spinner.setAttribute('aria-hidden', 'true');
  const title = document.createElement('strong');
  title.textContent = workStatusTitle.textContent;
  const detail = document.createElement('p');
  detail.textContent = workStatusDetail.textContent;
  panel.append(spinner, title, detail);
  placeholder.appendChild(panel);
  sectionBody.appendChild(placeholder);
}

function beginImportWork(file, requestId) {
  clearWorkTimers();
  isWorking = true;
  workStatus.hidden = false;
  dropZone.classList.add('busy');
  document.body.setAttribute('aria-busy', 'true');
  setImportControlsDisabled(true);
  addButton.hidden = true;
  const fileName = file?.name ? `已收到“${file.name}”。` : '已收到文件。';
  setWorkMessage('正在整理制度文件', `${fileName}正在提取章节、流程和表单。`);
  render();
  scheduleWorkMessage(6000, '正在整理流程和表单', '文件较大时需要一点时间，请保持当前页面打开。', requestId);
  scheduleWorkMessage(16000, '正在生成填报建议', '正在为还空着的字段准备填写提示，完成后会自动填到页面旁边。', requestId);
}

function finishImportWork(requestId) {
  if (requestId && requestId !== currentRequestId) return;
  clearWorkTimers();
  isWorking = false;
  workStatus.hidden = true;
  dropZone.classList.remove('busy', 'dragging');
  document.body.removeAttribute('aria-busy');
  setImportControlsDisabled(false);
}

function beginSuggestionWork(requestId) {
  clearWorkTimers();
  isSuggesting = true;
  workStatus.hidden = false;
  setSuggestionMessage('页面已可编辑，正在补充填报建议', '可以先检查和修改页面内容，建议会自动出现在空白字段旁边。');
  scheduleSuggestionMessage(7000, '正在查看流程步骤里的空白项', '页面可以继续编辑，已填写的字段不会被建议覆盖。', requestId);
  scheduleSuggestionMessage(18000, '正在查看表单字段说明', '表单字段较多时会多花一点时间，请保持当前页面打开。', requestId);
}

function finishSuggestionWork(requestId) {
  if (requestId && requestId !== currentRequestId) return;
  clearWorkTimers();
  isSuggesting = false;
  workStatus.hidden = true;
}

function suggestionsForEmptyFields(suggestions = {}) {
  const filtered = {};
  for (const [path, suggestion] of Object.entries(suggestions || {})) {
    if (!isFilled(getValue(path))) filtered[path] = suggestion;
  }
  return filtered;
}

function appendUploadSourcePath(body, file) {
  const sourcePath = file?.webkitRelativePath || file?.name || '';
  if (sourcePath) body.append('sourcePath', sourcePath);
}

async function requestFieldSuggestions(file, requestId) {
  if (!file || !docData || requestId !== currentRequestId) return;
  beginSuggestionWork(requestId);
  const body = new FormData();
  body.append('sessionId', sessionId);
  body.append('requestId', requestId);
  body.append('data', JSON.stringify(docData));
  body.append('file', file);
  try {
    const response = await fetch('/api/suggestions', { method: 'POST', headers: { 'x-session-id': sessionId }, body });
    const payload = await response.json();
    if (payload.requestId && payload.requestId !== currentRequestId) return;
    if (response.ok) {
      const nextSuggestions = suggestionsForEmptyFields(payload.fieldSuggestions || {});
      fieldSuggestions = { ...fieldSuggestions, ...nextSuggestions };
      render();
      if (Object.keys(nextSuggestions).length) toast('填报建议已补充到空白字段旁边');
    }
  } catch (_) {
    toast('页面已可编辑，部分填报建议稍后可重新导入生成。');
  } finally {
    finishSuggestionWork(requestId);
  }
}

async function importDocumentFile(file) {
  if (!file) return;
  if (isWorking) {
    toast('正在整理上一份文件，请稍候。');
    return;
  }
  if (!sessionId) await init();
  const requestId = `req_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
  currentRequestId = requestId;
  beginImportWork(file, requestId);
  const body = new FormData();
  body.append('sessionId', sessionId);
  body.append('requestId', requestId);
  body.append('file', file);
  appendUploadSourcePath(body, file);
  let shouldRequestSuggestions = false;
  try {
    const response = await fetch('/api/upload', { method: 'POST', headers: { 'x-session-id': sessionId }, body });
    const payload = await response.json();
    if (payload.requestId && payload.requestId !== currentRequestId) return;
    if (!response.ok) {
      toast(payload.error || '文件整理失败');
      return;
    }
    applyEnums(payload.enums || {});
    importedConfirmedWorkRoleRefs.clear();
    docData = ensureDocument(payload.data);
    fieldSources = payload.fieldSources || {};
    fieldOrigins = payload.fieldOrigins || {};
    fieldWarnings = payload.fieldWarnings || {};
    fieldSuggestions = payload.fieldSuggestions || {};
    activeFormRef = '';
    activeTableRef = '';
    collapsedProcessRefs.clear();
    resetStepWorkbenchState();
    hasPageContent = true;
    activeSection = 'basic';
    setActiveNav();
    toast('制度文件已整理到页面');
    shouldRequestSuggestions = true;
  } catch (_) {
    toast('文件整理失败，请重新导入。');
  } finally {
    finishImportWork(requestId);
    render();
  }
  if (shouldRequestSuggestions) requestFieldSuggestions(file, requestId);
}

function importStructuredFile(file) {
  if (!file) return;
  if (isWorking) {
    toast('正在整理上一份文件，请稍候。');
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(String(reader.result || '{}'));
      if (!parsed || parsed.schema_version !== 'document-structured-output-v2') {
        throw new Error('结构化文件必须使用 document-structured-output-v2');
      }
      importedConfirmedWorkRoleRefs.clear();
      (Array.isArray(parsed.work_role_bindings) ? parsed.work_role_bindings : [])
        .filter(binding => binding?.status === 'confirmed' && binding.binding_ref)
        .forEach(binding => importedConfirmedWorkRoleRefs.add(binding.binding_ref));
      docData = ensureDocument(parsed);
      fieldSources = {};
      fieldOrigins = importedOrigins(docData);
      fieldWarnings = {};
      fieldSuggestions = {};
      activeFormRef = '';
      activeTableRef = '';
      collapsedProcessRefs.clear();
      resetStepWorkbenchState();
      hasPageContent = true;
      activeSection = 'basic';
      setActiveNav();
      render();
      toast('结构化文件已导入');
    } catch (_) {
      toast('结构化文件无法读取');
    }
  };
  reader.readAsText(file, 'utf-8');
}

function setActiveNav() {
  document.querySelectorAll('.nav button').forEach(item => item.classList.toggle('active', item.dataset.section === activeSection));
}

function resetStepWorkbenchState() {
  activeStepRefsByProcess.clear();
  stepFiltersByProcess.clear();
  stepListScrollTopByProcess.clear();
}

function ensureDocument(data) {
  const base = {
    schema_version: 'document-structured-output-v2',
    generated_at: new Date().toISOString(),
    draft: {
      draft_ref: null,
      document_no: '',
      document_title: '',
      planned_edition: 'A',
      current_edition: null,
      base_version_ref: null,
      process_name: '',
      reason: '',
      basis_type: '制度 / 规程',
      basis_description: '',
      involves_other_departments: false,
      related_departments: [],
      department: { department_name: '', department_code: null, department_id: null, domain: null },
      l1_name: null,
      l1_status: 'unclassified',
      l2_name: null,
      l2_status: 'unclassified',
      l3_name: null,
      status: 'draft'
    },
    document_profile: { profile_ref: null, draft_ref: null, document_title: '', document_no: '', purpose: '', scope: '', inheritance_relation: null },
    terms: [],
    processes: [],
    steps: [],
    behavior_details: [],
    step_transitions: [],
    work_role_bindings: [],
    cross_dept_handoffs: [],
    forms: [],
    form_tables: [],
    form_table_fields: [],
    form_fields: [],
    evidence_catalog: [],
    mdm_requirement_catalog: [],
    pending_issues: [],
    structure_block_projection: { meta: {}, l3_catalog: [], a1_catalog: [], evidence_catalog: [], mdm_requirement_catalog: [] },
    markdown_draft: ''
  };
  const merged = deepMerge(base, data || {});
  merged.draft.department = deepMerge(base.draft.department, merged.draft.department || {});
  merged.document_profile.document_no = merged.draft.document_no || merged.document_profile.document_no || '';
  merged.document_profile.document_title = merged.draft.document_title || merged.document_profile.document_title || '';
  for (const key of ['terms', 'processes', 'steps', 'behavior_details', 'step_transitions', 'work_role_bindings', 'cross_dept_handoffs', 'forms', 'form_tables', 'form_table_fields', 'form_fields', 'evidence_catalog', 'mdm_requirement_catalog', 'pending_issues']) {
    if (!Array.isArray(merged[key])) merged[key] = [];
  }
  merged.work_role_bindings = merged.work_role_bindings.map((binding, index) => normalizeWorkRoleBinding(binding, index));
  merged.schema_version = 'document-structured-output-v2';
  merged.steps.forEach(step => {
    if (!['action', 'decision'].includes(step.step_type)) step.step_type = 'action';
  });
  return merged;
}

function normalizeWorkRoleBinding(binding, index = 0) {
  const source = binding && typeof binding === 'object' && !Array.isArray(binding) ? binding : {};
  const participantDepartment = typeof source.participant_department === 'string'
    ? { department_name: source.participant_department }
    : source.participant_department && typeof source.participant_department === 'object' && !Array.isArray(source.participant_department)
      ? { ...source.participant_department, department_name: source.participant_department.department_name || '' }
      : { department_name: '' };
  const stepRef = source.step_ref === undefined || source.step_ref === null || source.step_ref === '' ? null : source.step_ref;
  return {
    ...source,
    binding_ref: source.binding_ref || `work_role_binding_${index + 1}`,
    process_ref: source.process_ref || '',
    step_ref: stepRef,
    participant_department: participantDepartment,
    source_role_text: source.source_role_text || '',
    work_role_code: source.work_role_code || '',
    participation_type: source.participation_type || (stepRef === null ? 'owner' : 'executor'),
    status: source.status === 'confirmed' ? 'confirmed' : 'proposed',
    evidence_refs: Array.isArray(source.evidence_refs) ? [...source.evidence_refs] : [],
    confirmation_basis: source.confirmation_basis ?? null
  };
}

function deepMerge(base, patch) {
  const result = Array.isArray(base) ? [...base] : { ...base };
  for (const [key, value] of Object.entries(patch || {})) {
    if (value && typeof value === 'object' && !Array.isArray(value) && base[key] && typeof base[key] === 'object' && !Array.isArray(base[key])) {
      result[key] = deepMerge(base[key], value);
    } else {
      result[key] = value;
    }
  }
  return result;
}

function importedOrigins(data) {
  const origins = {};
  walkValues(data, '', path => { origins[path] = 'imported'; });
  return origins;
}

function walkValues(value, prefix, visit) {
  if (value == null) return;
  if (typeof value !== 'object') {
    if (prefix) visit(prefix);
    return;
  }
  if (Array.isArray(value)) {
    value.forEach((item, index) => walkValues(item, prefix ? `${prefix}.${index}` : String(index), visit));
    return;
  }
  for (const key of Object.keys(value)) {
    walkValues(value[key], prefix ? `${prefix}.${key}` : key, visit);
  }
}

function getValue(path) {
  return path.split('.').reduce((target, part) => target == null ? undefined : target[part], docData);
}

function setValue(path, value, options = {}) {
  const previousValue = getValue(path);
  const parts = path.split('.');
  let target = docData;
  for (let i = 0; i < parts.length - 1; i += 1) {
    const part = parts[i];
    if (target[part] == null) target[part] = {};
    target = target[part];
  }
  target[parts[parts.length - 1]] = value;
  syncRelatedTableValue(path, value);
  syncWorkRoleBindingTarget(path, value);
  if (/^(?:steps\.\d+\.(?:process_ref|step_type)|step_transitions\.\d+\.(?:from_step_ref|to_step_ref))$/.test(path)) cleanStepTransitions();
  const movedStepMatch = path.match(/^steps\.(\d+)\.process_ref$/);
  if (movedStepMatch) {
    const step = docData.steps[Number(movedStepMatch[1])];
    if (previousValue && activeStepRefsByProcess.get(previousValue) === step?.step_ref) activeStepRefsByProcess.delete(previousValue);
    if (value && step?.step_ref) activeStepRefsByProcess.set(value, step.step_ref);
  }
  if (path === 'draft.department.department_name') {
    const found = DEPARTMENT_OPTIONS.find(item => item.value === value);
    docData.draft.department.domain = found?.domain || null;
    if (docData.processes[0] && !docData.processes[0].owner) docData.processes[0].owner = value;
  }
  if (path === 'draft.document_no') setLinkedValue('document_profile.document_no', value);
  if (path === 'draft.document_title') setLinkedValue('document_profile.document_title', value);
  fieldOrigins[path] = 'manual';
  if (fieldWarnings[path]) delete fieldWarnings[path];
  if (fieldSuggestions[path]) delete fieldSuggestions[path];
  hasPageContent = true;
  updateCompletion();
  if (options.rerender !== false && shouldRerenderAfterValueChange(path)) render();
}

function setLinkedValue(path, value) {
  const parts = path.split('.');
  let target = docData;
  for (let i = 0; i < parts.length - 1; i += 1) {
    const part = parts[i];
    if (target[part] == null) target[part] = {};
    target = target[part];
  }
  target[parts[parts.length - 1]] = value;
  fieldOrigins[path] = 'manual';
  if (fieldWarnings[path]) delete fieldWarnings[path];
  if (fieldSuggestions[path]) delete fieldSuggestions[path];
}

function syncRelatedTableValue(path, value) {
  const formMatch = path.match(/^forms\.(\d+)\.main_table_name$/);
  if (formMatch) {
    const form = docData.forms[Number(formMatch[1])];
    const tableIndex = docData.form_tables.findIndex(item => item.form_ref === form?.form_ref && item.table_kind === 'main');
    if (tableIndex >= 0) setLinkedValue(`form_tables.${tableIndex}.table_name`, value);
  }
  const tableNameMatch = path.match(/^form_tables\.(\d+)\.table_name$/);
  const tableKindMatch = path.match(/^form_tables\.(\d+)\.table_kind$/);
  const tableIndex = tableNameMatch ? Number(tableNameMatch[1]) : tableKindMatch ? Number(tableKindMatch[1]) : -1;
  if (tableIndex >= 0) {
    const table = docData.form_tables[tableIndex];
    if (table?.table_kind === 'main') {
      const formIndex = docData.forms.findIndex(item => item.form_ref === table.form_ref);
      if (formIndex >= 0) setLinkedValue(`forms.${formIndex}.main_table_name`, table.table_name || '');
    }
  }
}

function syncWorkRoleBindingTarget(path, value) {
  const participantDepartmentMatch = path.match(/^work_role_bindings\.(\d+)\.participant_department\.department_name$/);
  if (participantDepartmentMatch) {
    const binding = docData.work_role_bindings[Number(participantDepartmentMatch[1])];
    if (binding) binding.participant_department = { department_name: value };
    return;
  }
  const stepProcessMatch = path.match(/^steps\.(\d+)\.process_ref$/);
  if (!stepProcessMatch) return;
  const step = docData.steps[Number(stepProcessMatch[1])];
  if (!step) return;
  docData.work_role_bindings
    .filter(binding => binding.step_ref === step.step_ref)
    .forEach(binding => { binding.process_ref = value; });
}

function isFilled(value) {
  if (Array.isArray(value)) return value.length > 0;
  return value !== null && value !== undefined && String(value).trim() !== '';
}

function applyEnums(enums = {}) {
  if (enums.rosterRolesByDepartment && typeof enums.rosterRolesByDepartment === 'object') {
    rosterRolesByDepartment = enums.rosterRolesByDepartment;
  }
  if (Array.isArray(enums.workRoles)) {
    workRoles = enums.workRoles.map(normalizeWorkRoleOption).filter(item => item.work_role_code);
  }
  if (enums.workRolesByDepartment && typeof enums.workRolesByDepartment === 'object') {
    workRolesByDepartment = Object.fromEntries(
      Object.entries(enums.workRolesByDepartment).map(([department, roles]) => [
        department,
        Array.isArray(roles) ? roles.map(normalizeWorkRoleOption).filter(item => item.work_role_code) : []
      ])
    );
  }
  if (Array.isArray(enums.workRoleParticipationTypes)) {
    workRoleParticipationTypes = enums.workRoleParticipationTypes.map(normalizeParticipationTypeOption).filter(item => item.value && item.value !== 'owner');
  }
}

function normalizeWorkRoleOption(item) {
  if (typeof item === 'string') {
    return { work_role_code: item, work_role_name: item, status: 'active' };
  }
  const source = item && typeof item === 'object' ? item : {};
  return {
    ...source,
    work_role_code: source.work_role_code || source.code || '',
    work_role_name: source.work_role_name || source.name || source.work_role_code || source.code || '',
    status: source.status || 'active'
  };
}

function isSelectableWorkRole(role) {
  return Boolean(role && role.status === 'active' && role.is_effective !== false);
}

function normalizeParticipationTypeOption(item) {
  if (typeof item === 'string') {
    const fallback = DEFAULT_WORK_ROLE_PARTICIPATION_TYPES.find(option => option.value === item);
    return { value: item, label: fallback?.label || item };
  }
  const source = item && typeof item === 'object' ? item : {};
  const value = source.value || source.code || source.participation_type || '';
  const fallback = DEFAULT_WORK_ROLE_PARTICIPATION_TYPES.find(option => option.value === value);
  return { value, label: source.label || source.name || fallback?.label || value };
}

function participationTypeOptions(currentValue = '') {
  const configured = workRoleParticipationTypes.length ? workRoleParticipationTypes : DEFAULT_WORK_ROLE_PARTICIPATION_TYPES;
  const options = configured.filter(item => item.value !== 'owner').map(item => ({ ...item }));
  if (currentValue && !options.some(item => item.value === currentValue)) {
    options.unshift({ value: currentValue, label: currentValue === 'owner' ? '流程负责人（不适用于业务行为）' : currentValue });
  }
  return options;
}

function workRoleDepartmentOptions(currentDepartment = '') {
  const options = rosterDepartmentOptions();
  const known = new Set(options.map(item => item.value));
  Object.keys(workRolesByDepartment || {})
    .filter(Boolean)
    .sort((left, right) => left.localeCompare(right, 'zh-CN'))
    .forEach(department => {
      if (!known.has(department)) {
        options.push({ value: department, label: department });
        known.add(department);
      }
    });
  if (currentDepartment && !known.has(currentDepartment)) options.push({ value: currentDepartment, label: currentDepartment });
  return options;
}

function workRoleByCode(code) {
  return allWorkRoles().find(item => item.work_role_code === code) || null;
}

function allWorkRoles() {
  const byCode = new Map();
  [...workRoles, ...Object.values(workRolesByDepartment || {}).flat()].forEach(role => {
    if (role?.work_role_code && !byCode.has(role.work_role_code)) byCode.set(role.work_role_code, role);
  });
  return [...byCode.values()];
}

function workRolesForDepartment(department) {
  if (!department) return allWorkRoles();
  const mapped = Array.isArray(workRolesByDepartment?.[department]) ? workRolesByDepartment[department] : [];
  const companyWide = department === '全公司' || !Array.isArray(workRolesByDepartment?.['全公司'])
    ? []
    : workRolesByDepartment['全公司'];
  const byCode = new Map();
  [...mapped, ...companyWide].forEach(role => {
    if (role?.work_role_code && !byCode.has(role.work_role_code)) byCode.set(role.work_role_code, role);
  });
  return [...byCode.values()];
}

function workRoleSelectOptions(department, currentCode = '') {
  const roles = workRolesForDepartment(department);
  const hasActiveCatalog = allWorkRoles().some(isSelectableWorkRole);
  const placeholder = !hasActiveCatalog
    ? '等待行政人事部发布角色目录'
    : department && !roles.length
      ? '当前部门暂无可用工作角色'
      : '请选择正式工作角色';
  const options = [{ value: '', label: placeholder }];
  roles.forEach(role => {
    const suffix = role.status === 'retired' ? '（已停用）' : !isSelectableWorkRole(role) ? '（未生效）' : '';
    options.push({
      value: role.work_role_code,
      label: `${role.work_role_name || role.work_role_code}（${role.work_role_code}）${suffix}`,
      disabled: !isSelectableWorkRole(role) && role.work_role_code !== currentCode
    });
  });
  if (currentCode && !options.some(item => item.value === currentCode)) {
    const current = workRoleByCode(currentCode);
    options.push({
      value: currentCode,
      label: current ? `${current.work_role_name || currentCode}（${currentCode}，当前部门未映射）` : `导入的工作角色（${currentCode}）`,
      disabled: false
    });
  }
  return options;
}

function rosterDepartmentOptions() {
  const options = [...DEPARTMENT_OPTIONS];
  const known = new Set(options.map(item => item.value).filter(Boolean));
  Object.keys(rosterRolesByDepartment || {})
    .filter(Boolean)
    .sort((left, right) => left.localeCompare(right, 'zh-CN'))
    .forEach(department => {
      if (!known.has(department)) options.push({ value: department, label: department });
    });
  return options;
}

function currentDocumentDepartment() {
  return docData?.draft?.department?.department_name || '';
}

function processDepartmentForStep(index) {
  const step = docData?.steps?.[index];
  const process = docData?.processes?.find(item => item.process_ref === step?.process_ref);
  return process?.owner || currentDocumentDepartment();
}

function formDepartment(index) {
  return docData?.forms?.[index]?.responsible_department_name || currentDocumentDepartment();
}

function shouldRerenderAfterValueChange(path) {
  return path === 'draft.department.department_name' ||
    /^processes\.\d+\.owner$/.test(path) ||
    /^forms\.\d+\.responsible_department_name$/.test(path) ||
    /^steps\.\d+\.(?:process_ref|step_type|step_name|actor_role|input_materials|output_result)$/.test(path) ||
    /^behavior_details\.\d+\.execution_standard$/.test(path) ||
    /^work_role_bindings\.\d+\.(?:work_role_code|status)$/.test(path) ||
    /^work_role_bindings\.\d+\.participant_department\.department_name$/.test(path);
}

function actorRoleDepartmentOptions(ownDepartment = currentDocumentDepartment(), missingDepartmentLabel = '先确认归口部门') {
  const department = ownDepartment || '';
  const options = [{ value: '', label: department ? '请选择部门' : missingDepartmentLabel }];
  if (department) options.push({ value: department, label: department });
  if (department !== '全公司') options.push({ value: '全公司', label: '全公司' });
  return options;
}

function rosterPositions(department) {
  return Array.isArray(rosterRolesByDepartment?.[department]) ? rosterRolesByDepartment[department] : [];
}

function parseActorRole(value, ownDepartment = currentDocumentDepartment()) {
  const text = String(value || '').trim();
  if (!text) return { department: '', position: '' };
  if (ownDepartment && rosterPositions(ownDepartment).includes(text)) {
    return { department: ownDepartment, position: text };
  }
  const departments = rosterDepartmentOptions()
    .map(item => item.value)
    .filter(Boolean)
    .sort((left, right) => right.length - left.length);
  const department = departments.find(item => text === item || text.startsWith(item));
  if (department) {
    const rest = text.slice(department.length).trim();
    const position = rosterPositions(department).includes(rest) ? rest : '';
    return { department, position };
  }
  const matches = Object.entries(rosterRolesByDepartment || {})
    .filter(([, positions]) => Array.isArray(positions) && positions.includes(text));
  if (matches.length === 1) return { department: matches[0][0], position: text };
  return { department: '', position: '' };
}

function actorRoleMatchesPicker(value, parsed, ownDepartment = currentDocumentDepartment()) {
  return Boolean(
    value &&
    ownDepartment &&
    (
      (parsed.department === ownDepartment && parsed.position && rosterPositions(ownDepartment).includes(parsed.position)) ||
      (parsed.department === '全公司' && !parsed.position)
    )
  );
}

function combineActorRole(department, position) {
  if (department && position) return `${department}${position}`;
  return department || position || '';
}

function refreshActorRolePositionOptions(positionSelect, department, selectedPosition = '', ownDepartment = currentDocumentDepartment(), missingDepartmentLabel = '先确认归口部门') {
  const positions = department && department !== '全公司' ? rosterPositions(department) : [];
  const position = positions.includes(selectedPosition) ? selectedPosition : '';
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = !ownDepartment
    ? missingDepartmentLabel
    : department === '全公司'
      ? '全公司无需选择岗位'
      : '请选择岗位';
  placeholder.selected = !position;
  positionSelect.replaceChildren(placeholder);
  positions.forEach(item => {
    const option = document.createElement('option');
    option.value = item;
    option.textContent = item;
    option.selected = item === position;
    positionSelect.appendChild(option);
  });
  positionSelect.disabled = !department || department === '全公司';
}

function shortSuggestionContext(value) {
  const text = String(value || '').replace(/\s+/g, ' ').trim();
  return text.length > 32 ? `${text.slice(0, 32)}...` : text;
}

function fillSuggestionForPath(path) {
  const stepMatch = path.match(/^(steps|behavior_details)\.(\d+)\./);
  const stepName = stepMatch ? shortSuggestionContext(docData?.steps?.[Number(stepMatch[2])]?.step_name) : '';
  const stepPrefix = stepName ? `围绕“${stepName}”，` : '';
  const formMatch = path.match(/^forms\.(\d+)\./);
  const formName = formMatch ? shortSuggestionContext(docData?.forms?.[Number(formMatch[1])]?.form_name) : '';
  const formPrefix = formName ? `“${formName}”` : '这张表';
  const fieldMatch = path.match(/^form_table_fields\.(\d+)\./);
  const fieldName = fieldMatch ? shortSuggestionContext(docData?.form_table_fields?.[Number(fieldMatch[1])]?.field_name) : '';
  const fieldPrefix = fieldName ? `“${fieldName}”` : '这个字段';
  if (/\.trigger_scene$/.test(path)) return `${stepPrefix}补充这一动作在什么业务情形下开始。`;
  if (/\.precondition$/.test(path)) return `${stepPrefix}补充开始前必须具备的材料、状态或上一环节结果。`;
  if (/\.input_materials$/.test(path)) return `${stepPrefix}补充执行时要使用的表单、材料或记录。`;
  if (/\.output_result$/.test(path)) return `${stepPrefix}补充完成后形成的表单、记录、结论或通知。`;
  if (/\.timing$/.test(path)) return `${stepPrefix}补充制度明确的办理时限、频次或完成节点；原文未规定时可留空。`;
  if (/\.execution_standard$/.test(path)) return `${stepPrefix}补充判断这一步是否完成的标准、时限或评价维度。`;
  if (/\.form_code$/.test(path)) return `补充${formPrefix}在制度中列明的编号。`;
  if (/\.form_name$/.test(path)) return '补充表单或记录的正式名称。';
  if (/\.main_table_name$/.test(path)) return `补充${formPrefix}对应的主表名称，可沿用表单名称。`;
  if (/form_tables\.\d+\.table_name$/.test(path)) return `补充${formPrefix}的表头名称，可沿用表单名称或制度里的表格标题。`;
  if (/\.responsible_role$/.test(path)) return `补充${formPrefix}的形成或填写岗位。`;
  if (/form_table_fields\.\d+\.field_name$/.test(path)) return '补充表单里的字段名称。';
  if (/form_table_fields\.\d+\.description$/.test(path)) return `补充${fieldPrefix}的含义、填写口径、选项或格式要求。`;
  return '';
}

function deepSeekSuggestionForPath(path) {
  const suggestion = fieldSuggestions[path];
  return suggestion && suggestion.suggestion ? suggestion : null;
}

function appendFillSuggestion(target, path, value, force = false) {
  if (!force && isFilled(value)) return;
  const deepSeekSuggestion = deepSeekSuggestionForPath(path);
  const suggestion = deepSeekSuggestion?.suggestion || fillSuggestionForPath(path);
  if (!suggestion) return;
  const el = document.createElement('div');
  el.className = 'field-suggestion';
  el.textContent = `填报建议：${suggestion}`;
  if (deepSeekSuggestion?.source_text) {
    const source = document.createElement('details');
    source.className = 'suggestion-source';
    const summary = document.createElement('summary');
    summary.textContent = '查看参考原文';
    const text = document.createElement('p');
    text.textContent = [deepSeekSuggestion.source_anchor, deepSeekSuggestion.source_text].filter(Boolean).join('\n');
    source.append(summary, text);
    el.appendChild(source);
  }
  target.appendChild(el);
}

function requiredPaths() {
  const paths = [
    'draft.document_no',
    'draft.document_title',
    'draft.planned_edition',
    'draft.basis_type',
    'draft.department.department_name',
    'document_profile.purpose',
    'document_profile.scope'
  ];
  (docData?.steps || []).forEach((_, i) => {
    paths.push(`steps.${i}.process_ref`);
    paths.push(`steps.${i}.step_type`);
    paths.push(`steps.${i}.step_name`);
    paths.push(`steps.${i}.actor_role`);
    paths.push(`steps.${i}.input_materials`);
    paths.push(`steps.${i}.output_result`);
    paths.push(`behavior_details.${i}.execution_standard`);
  });
  (docData?.forms || []).forEach((_, i) => paths.push(`forms.${i}.form_code`, `forms.${i}.form_name`, `forms.${i}.main_table_name`));
  (docData?.form_tables || []).forEach((_, i) => paths.push(`form_tables.${i}.table_name`));
  (docData?.form_table_fields || []).forEach((_, i) => paths.push(`form_table_fields.${i}.field_name`));
  return paths;
}

function completionState() {
  if (!docData) return { green: 0, red: 1, total: 1, done: false };
  const paths = requiredPaths();
  const green = paths.filter(path => isFilled(getValue(path))).length;
  const red = Math.max(paths.length - green, 0);
  return { green, red, total: paths.length || 1, done: red === 0 };
}

function updateCompletion() {
  if (isWorking) return;
  const state = completionState();
  const deg = Math.round((state.green / state.total) * 360);
  const pie = document.getElementById('completionPie');
  pie.style.background = `conic-gradient(var(--green) 0deg ${deg}deg, var(--red) ${deg}deg 360deg)`;
  document.getElementById('pieLabel').textContent = state.done ? '可导出' : '继续补充';
  document.getElementById('statusCopy').textContent = state.done
    ? '必填内容已经可以结构化。仍可继续完善可选内容。'
    : '红色对应还需要补充的必填内容，请在字段位置直接修改。';
}

function originLabel(path) {
  const origin = fieldOrigins[path];
  if (origin === 'manual') return '手动填写';
  if (origin === 'imported') return '导入内容';
  if (origin === 'auto') return '自动填充';
  if (origin === 'external_reference') return '映射来源';
  if (origin === 'default') return '默认值';
  return '';
}

function render() {
  const meta = sections[activeSection];
  document.getElementById('sectionTitle').textContent = meta.title;
  document.getElementById('sectionHint').textContent = meta.hint;
  if (isWorking) {
    addButton.hidden = true;
    renderBusyPlaceholder();
    return;
  }
  addButton.hidden = !['terms', 'steps', 'forms'].includes(activeSection) || !docData;
  addButton.textContent = {
    terms: '新增术语',
    steps: '新增流程',
    forms: '新增表单'
  }[activeSection] || '新增一项';
  updateCompletion();
  if (!docData) {
    sectionBody.innerHTML = '<div class="empty">请先导入制度文件或结构化文件。</div>';
    return;
  }
  const renderers = {
    basic: renderBasic,
    profile: renderProfile,
    terms: renderTerms,
    steps: renderSteps,
    forms: renderForms,
    export: renderExport
  };
  sectionBody.innerHTML = '';
  sectionBody.appendChild(renderers[activeSection]());
}

function field(path, label, options = {}) {
  const wrapper = document.createElement('div');
  const required = options.required || requiredPaths().includes(path);
  const value = getValue(path);
  wrapper.className = `field ${required && !isFilled(value) ? 'missing' : ''} ${fieldOrigins[path] || ''}`.trim();

  const labelEl = document.createElement('label');
  labelEl.innerHTML = `${label}${required ? '<span class="required">*</span>' : ''}<span class="origin">${originLabel(path)}</span>`;
  wrapper.appendChild(labelEl);

  let input;
  if (options.type === 'textarea') {
    input = document.createElement('textarea');
    input.value = value || '';
  } else if (options.type === 'select') {
    input = document.createElement('select');
    for (const item of options.options || []) {
      const optionValue = typeof item === 'object' ? item.value : item;
      const optionLabel = typeof item === 'object' ? item.label : item;
      const option = document.createElement('option');
      option.value = optionValue;
      option.textContent = optionLabel;
      option.selected = String(optionValue) === String(value ?? '');
      option.disabled = Boolean(typeof item === 'object' && item.disabled);
      input.appendChild(option);
    }
  } else {
    input = document.createElement('input');
    input.value = value || '';
  }
  const readValue = event => options.parse ? options.parse(event.target.value) : event.target.value;
  const writeValue = (event, rerender) => {
    const nextValue = readValue(event);
    setValue(path, nextValue, { rerender });
    wrapper.classList.toggle('missing', required && !isFilled(nextValue));
    const origin = wrapper.querySelector('.origin');
    if (origin) origin.textContent = originLabel(path);
  };
  input.disabled = Boolean(options.disabled);
  input.addEventListener('input', event => writeValue(event, false));
  input.addEventListener('change', event => writeValue(event, true));
  wrapper.appendChild(input);

  const source = fieldSources[path];
  if (source) {
    const details = document.createElement('details');
    details.className = 'source';
    details.innerHTML = `<summary>查看依据</summary><p>${escapeHtml(source.source_anchor || '')}\n${escapeHtml(source.source_text || '')}</p>`;
    wrapper.appendChild(details);
  }
  const warning = fieldWarnings[path];
  if (warning) {
    const warningEl = document.createElement('div');
    warningEl.className = 'warning';

function tableCell(path, options = {}) {
  const cell = document.createElement('td');
  const required = options.required || requiredPaths().includes(path);
  const value = getValue(path);
  if (required && !isFilled(value)) cell.classList.add('missing-cell');

  let input;
  if (options.type === 'textarea') {
    input = document.createElement('textarea');
    input.value = value || '';
    input.className = 'table-control textarea';
  } else if (options.type === 'select') {
    input = document.createElement('select');
    input.className = 'table-control';
    for (const item of options.options || []) {
      const optionValue = typeof item === 'object' ? item.value : item;
      const optionLabel = typeof item === 'object' ? item.label : item;
      const option = document.createElement('option');
      option.value = optionValue;
      option.textContent = optionLabel;
      option.selected = String(optionValue) === String(value ?? '');
      option.disabled = Boolean(typeof item === 'object' && item.disabled);
      input.appendChild(option);
    }
  } else {
    input = document.createElement('input');
    input.value = value || '';
    input.className = 'table-control';
  }
  const readValue = event => options.parse ? options.parse(event.target.value) : event.target.value;
  const writeValue = (event, rerender) => {
    const nextValue = readValue(event);
    setValue(path, nextValue, { rerender });
    cell.classList.toggle('missing-cell', required && !isFilled(nextValue));
  };
  input.addEventListener('input', event => writeValue(event, false));
  input.addEventListener('change', event => writeValue(event, true));
  cell.appendChild(input);

  const source = fieldSources[path];
  if (source) {
    const details = document.createElement('details');
    details.className = 'table-source';
    details.innerHTML = `<summary>查看依据</summary><p>${escapeHtml(source.source_anchor || '')}\n${escapeHtml(source.source_text || '')}</p>`;
    cell.appendChild(details);
  }
  const warning = fieldWarnings[path];
  if (warning) {
    const warningEl = document.createElement('div');
    warningEl.className = 'warning';
    warningEl.textContent = warning.message || '需要核对。';
    cell.appendChild(warningEl);
  }
  if (options.type !== 'select') appendFillSuggestion(cell, path, value);
  return cell;
}

function duplicateStepCounts(processRef) {
  const counts = new Map();
  stepsForProcess(processRef).forEach(({ step }) => {
    const key = normalizedDuplicateStepName(step.step_name);
    if (key) counts.set(key, (counts.get(key) || 0) + 1);
  });
  return counts;
}

function duplicateCountForStep(step, counts) {
  const key = normalizedDuplicateStepName(step?.step_name);
  return key ? counts.get(key) || 0 : 0;
}

function processCoreComplete(processRef) {
  const rows = stepsForProcess(processRef);
  return rows.length > 0 && rows.every(row => stepCoreComplete(row.index));

function processSummaryText(processRef) {
  const rows = stepsForProcess(processRef);
  const decisionCount = rows.filter(row => row.step.step_type === 'decision').length;
  const transitions = (docData.step_transitions || []).filter(item => item.process_ref === processRef);
  const missingTargets = transitions.filter(item => !item.to_step_ref).length;
  const incompleteCount = rows.filter(row => !stepCoreComplete(row.index)).length;
  const duplicateCounts = duplicateStepCounts(processRef);
  const duplicateRows = rows.filter(row => duplicateCountForStep(row.step, duplicateCounts) > 1).length;
  return `步骤 ${rows.length} 个；待补 ${incompleteCount} 个；疑似重复 ${duplicateRows} 个；判断节点 ${decisionCount} 个；判断分支 ${transitions.length} 条；未补流向 ${missingTargets} 条`;

function sourceRoleBindingEligibilityProblem(sourceRoleText) {
  const value = String(sourceRoleText || '').trim();
  if (/^(?:申请人|当前处理人|本人|经办人|全体员工|全体人员|全公司人员|所有员工)$/.test(value)) return '场景身份不能建立固定工作角色绑定';
  if (/^(?:客户|供应商|银行|外部机构|第三方|承包商|承揽方)(?:$|代表$|联系人$|单位$)/.test(value)) return '外部参与方不能建立内部工作角色绑定';
  if (/^(?:有关部门|相关部门|各部门|各单位|相关单位|使用单位|责任单位|业务部门|所属部门|班组)(?:负责人|人员|代表)?$/.test(value)) return '集体称谓不能直接建立工作角色绑定';
  return '';
}

function structuralProblemsForWorkRoleBinding(index) {
  const binding = docData.work_role_bindings[index];
  if (!binding) return ['绑定内容不存在'];
  const problems = [];
  const participationTypes = ['owner', ...DEFAULT_WORK_ROLE_PARTICIPATION_TYPES.map(item => item.value)];
  if (docData.work_role_bindings.some((item, otherIndex) => otherIndex !== index && item.binding_ref === binding.binding_ref)) problems.push('绑定编号重复');
  if (!String(binding.binding_ref || '').trim()) problems.push('绑定编号未填写');
  const process = docData.processes.find(item => item.process_ref === binding.process_ref);
  const step = binding.step_ref === null ? null : docData.steps.find(item => item.step_ref === binding.step_ref);
  const department = workRoleBindingDepartment(binding);
  if (!process) problems.push('所属业务流程不存在');
  if (binding.step_ref !== null && !step) problems.push('所属业务行为不存在');
  if (step && step.process_ref !== binding.process_ref) problems.push('业务行为不属于所选业务流程');
  if (!participationTypes.includes(binding.participation_type)) problems.push('参与方式无效');
  if (binding.step_ref === null && binding.participation_type !== 'owner') problems.push('流程层只能使用流程负责人');
  if (binding.step_ref !== null && binding.participation_type === 'owner') problems.push('业务行为不能使用流程负责人');
  if (!department) problems.push('参与部门未填写');
  else if (!workRoleDepartmentOptions().some(item => item.value === department)) problems.push('参与部门不在当前组织目录');
  if (!String(binding.source_role_text || '').trim()) problems.push('制度原文称谓未填写');
  const eligibilityProblem = sourceRoleBindingEligibilityProblem(binding.source_role_text);
  if (eligibilityProblem) problems.push(eligibilityProblem);
  if (!/^WR-\d{4}$/.test(String(binding.work_role_code || ''))) problems.push('正式工作角色编码无效');
  if (!['proposed', 'confirmed'].includes(binding.status)) problems.push('处理状态无效');
  if (!Array.isArray(binding.evidence_refs)) problems.push('原文依据格式无效');
  else if (new Set(binding.evidence_refs).size !== binding.evidence_refs.length) problems.push('原文依据存在重复引用');
  return problems;
}

function markWorkRoleEvidenceVerified(binding) {
  for (const ref of binding?.evidence_refs || []) {
    const evidence = docData.evidence_catalog.find(item => item.evidence_ref === ref);
    if (!evidence || evidence.status === 'ocr_extracted_not_confirmed' || /ocr/i.test(String(evidence.locate_method || ''))) continue;
    evidence.status = 'verified';
  }
}

function confirmationProblemsForWorkRoleBinding(index, { allowEvidenceVerification = false } = {}) {
  const binding = docData.work_role_bindings[index];
  if (!binding) return ['绑定内容不存在'];
  const problems = structuralProblemsForWorkRoleBinding(index);
  const department = workRoleBindingDepartment(binding);
  const role = workRoleByCode(binding.work_role_code);
  const mappedRoles = workRolesForDepartment(department);
  const importedRetiredHistory = binding.status === 'confirmed' && importedConfirmedWorkRoleRefs.has(binding.binding_ref) && role?.status === 'retired';
  if (!role) problems.push('正式工作角色未发布');
  else if (!isSelectableWorkRole(role) && !importedRetiredHistory) problems.push('正式工作角色当前未生效');
  if (binding.work_role_code && !mappedRoles.some(item => item.work_role_code === binding.work_role_code) && !importedRetiredHistory) problems.push('参与部门尚无有效岗位映射');
  if (!Array.isArray(binding.evidence_refs) || !binding.evidence_refs.length) problems.push('原文依据未选择');
  else {
    const evidenceItems = binding.evidence_refs.map(ref => docData.evidence_catalog.find(item => item.evidence_ref === ref));
    if (evidenceItems.some(item => !item)) problems.push('原文依据无法定位');
    else if (evidenceItems.some(item =>
      !(item.source_file || item.source_name) ||
      !(item.locator || item.source_anchor) ||
      !String(item.source_excerpt || '').trim() ||
      !String(item.locate_method || '').trim()
    )) problems.push('原文依据缺少源文件、位置、原文摘录或抽取方式');
    else if (evidenceItems.some(item => item.status === 'ocr_extracted_not_confirmed' || /ocr/i.test(String(item.locate_method || '')))) problems.push('OCR 原文依据只能待复核，不能形成正式绑定');
    else if (!allowEvidenceVerification && evidenceItems.some(item => item.status !== 'verified')) problems.push('原文依据尚未人工核验');
    else if (!evidenceItems.some(item =>
      (item.object_type === 'work_role_binding' && item.object_ref === binding.binding_ref) ||
      (binding.step_ref !== null && item.object_type === 'step' && item.object_ref === binding.step_ref) ||
      (binding.step_ref === null && item.object_type === 'process' && item.object_ref === binding.process_ref)
    )) problems.push('原文依据未关联到当前流程或业务行为');
  }
  if (!String(binding.confirmation_basis || '').trim()) problems.push('确认依据未填写');
  if (binding.step_ref === null) {
    const hasOtherConfirmedOwner = docData.work_role_bindings.some((item, otherIndex) =>
      otherIndex !== index && item.process_ref === binding.process_ref && item.step_ref === null && item.participation_type === 'owner' && item.status === 'confirmed'
    );
    if (hasOtherConfirmedOwner) problems.push('该流程已经有一名已确认负责人');
  }
  return problems;
}

function workRoleStatusField(index) {
  const path = `work_role_bindings.${index}.status`;
  const value = getValue(path) || 'proposed';
  const wrapper = div('field');
  const label = document.createElement('label');
  label.textContent = '处理状态';
  const select = document.createElement('select');
  WORK_ROLE_STATUS_OPTIONS.forEach(item => {
    const option = document.createElement('option');
    option.value = item.value;
    option.textContent = item.label;
    option.selected = item.value === value;
    select.appendChild(option);
  });
  select.addEventListener('change', () => {
    if (select.value === 'confirmed') {
      const problems = confirmationProblemsForWorkRoleBinding(index, { allowEvidenceVerification: true });
      if (problems.length) {
        select.value = value;
        toast(`暂不能确认：${problems[0]}`);
        return;
      }
      markWorkRoleEvidenceVerified(docData.work_role_bindings[index]);
    }
    if (select.value !== 'confirmed') importedConfirmedWorkRoleRefs.delete(docData.work_role_bindings[index]?.binding_ref);
    setValue(path, select.value);
  });
  wrapper.append(label, select);
  if (value !== 'confirmed') {
    const problems = confirmationProblemsForWorkRoleBinding(index);
    if (problems.length) {
      const warning = div('work-role-warning');
      warning.textContent = `转为已确认前还需：${problems.join('、')}。`;
      wrapper.appendChild(warning);
    }
  }
  return wrapper;
}

function renderWorkRoleAdder(processRef, stepRef = null) {
  const process = docData.processes.find(item => item.process_ref === processRef);
  const step = stepRef === null ? null : docData.steps.find(item => item.step_ref === stepRef);
  const adder = div('work-role-adder');
  const head = div('work-role-adder-head');
  const heading = document.createElement('strong');
  heading.textContent = stepRef === null ? '添加流程负责人工作角色' : '添加参与工作角色';
  head.appendChild(heading);
  adder.appendChild(head);

  if (!allWorkRoles().some(isSelectableWorkRole)) {
    const message = div('work-role-empty');
    message.textContent = '等待行政人事部发布角色目录。制度原文称谓和依据仍会保留，可先继续整理其他流程内容。';
    adder.appendChild(message);
    return adder;
  }

  const grid = div('work-role-adder-grid');
  const departmentLabel = document.createElement('label');
  departmentLabel.textContent = '参与部门';
  const departmentSelect = document.createElement('select');
  const defaultDepartment = process?.owner || currentDocumentDepartment();
  workRoleDepartmentOptions(defaultDepartment).forEach(item => {
    const option = document.createElement('option');
    option.value = item.value;
    option.textContent = item.label;
    option.selected = item.value === defaultDepartment;
    departmentSelect.appendChild(option);
  });
  departmentLabel.appendChild(departmentSelect);

  const sourceLabel = document.createElement('label');
  sourceLabel.textContent = '制度原文中的角色/岗位称谓';
  const sourceInput = document.createElement('input');
  sourceInput.value = step?.actor_role || '';
  sourceInput.placeholder = '保持制度原文称谓，不按正式角色名称改写';
  sourceLabel.appendChild(sourceInput);

  const roleLabel = document.createElement('label');
  roleLabel.textContent = '正式工作角色';
  const roleSelect = document.createElement('select');
  roleLabel.appendChild(roleSelect);

  let participationSelect = null;
  if (stepRef !== null) {
    const participationLabel = document.createElement('label');
    participationLabel.textContent = '参与方式';
    participationSelect = document.createElement('select');
    participationTypeOptions('executor').forEach(item => {
      const option = document.createElement('option');
      option.value = item.value;
      option.textContent = item.label;
      option.selected = item.value === 'executor';
      participationSelect.appendChild(option);
    });
    participationLabel.appendChild(participationSelect);
    grid.append(departmentLabel, sourceLabel, roleLabel, participationLabel);
  } else {
    grid.append(departmentLabel, sourceLabel, roleLabel);
  }

  const actions = div('work-role-adder-actions');
  const add = document.createElement('button');
  add.className = 'btn';
  add.type = 'button';
  add.textContent = stepRef === null ? '添加负责人绑定' : '添加参与绑定';
  const refreshAddState = () => {
    add.disabled = !departmentSelect.value || !sourceInput.value.trim() || !roleSelect.value;
  };
  const refreshRoleOptions = () => {
    roleSelect.replaceChildren();
    workRoleSelectOptions(departmentSelect.value).forEach(item => {
      const option = document.createElement('option');
      option.value = item.value;
      option.textContent = item.label;
      option.disabled = Boolean(item.disabled);
      roleSelect.appendChild(option);
    });
    refreshAddState();
  };
  departmentSelect.addEventListener('change', refreshRoleOptions);
  roleSelect.addEventListener('change', refreshAddState);
  sourceInput.addEventListener('input', refreshAddState);
  add.addEventListener('click', () => {
    const role = workRoleByCode(roleSelect.value);
    if (!isSelectableWorkRole(role)) {
      toast('请选择已经生效的正式工作角色');
      return;
    }
    const eligibilityProblem = sourceRoleBindingEligibilityProblem(sourceInput.value);
    if (eligibilityProblem) {
      toast(eligibilityProblem);
      return;
    }
    const inheritedEvidenceRefs = Array.isArray(step?.evidence_refs)
      ? step.evidence_refs
      : Array.isArray(process?.evidence_refs) ? process.evidence_refs : [];
    docData.work_role_bindings.push(normalizeWorkRoleBinding({
      binding_ref: nextWorkRoleBindingRef(),
      process_ref: processRef,
      step_ref: stepRef,
      participant_department: { department_name: departmentSelect.value },
      source_role_text: sourceInput.value.trim(),
      work_role_code: roleSelect.value,
      participation_type: stepRef === null ? 'owner' : participationSelect?.value || 'executor',
      status: 'proposed',
      evidence_refs: [...inheritedEvidenceRefs],
      confirmation_basis: null
    }, docData.work_role_bindings.length));
    hasPageContent = true;
    render();
  });
  refreshRoleOptions();
  actions.appendChild(add);
  adder.append(grid, actions);
  return adder;
}

function renderWorkRoleBindings(processRef, stepRef = null) {
  const group = div('work-role-group');
  group.appendChild(title(stepRef === null ? '流程负责人工作角色' : '参与工作角色'));
  const copy = document.createElement('p');
  copy.className = 'work-role-group-copy';
  copy.textContent = stepRef === null
    ? '这里记录业务流程的正式负责人工作角色；归口部门仍保留在上方，二者不是同一概念。'
    : '可为同一业务行为添加多个工作角色，并分别确认发起、执行、审核、批准、协同、提供或接收责任。';
  group.appendChild(copy);

  const rows = workRoleBindingsForTarget(processRef, stepRef);
  if (rows.length) {

    rows.forEach(({ binding, index }) => list.appendChild(renderWorkRoleEntry(binding, index, processRef, stepRef)));
    group.appendChild(list);
