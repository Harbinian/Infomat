<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3001 单流程治理编制工具</title>
  <style>
    :root {
      --paper: #f3ead7;
      --paper-deep: #e9ddc5;
      --card: rgba(255, 252, 243, 0.94);
      --ink: #2f302b;
      --muted: #6d6a60;
      --line: #cbbd9e;
      --red: #8c3f33;
      --red-soft: #f2dfd8;
      --sage: #66745f;
      --sage-soft: #dfe7db;
      --blue: #5d6f78;
      --gold: #9b783d;
      --shadow: 0 12px 32px rgba(76, 58, 33, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(140, 63, 51, 0.08), transparent 28rem),
        linear-gradient(145deg, #efe4cc, var(--paper) 45%, #eee4d2);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      overflow: hidden;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .page {
      width: 100%;
      height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      align-items: stretch;
      height: 100%;
    }

    .task-sidebar {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: calc(100vh - 32px);
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(250, 244, 230, 0.9);
      box-shadow: var(--shadow);
    }

    .sidebar-scroll-area {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
    }

    .main-column {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .governance-header {
      z-index: 40;
      margin-bottom: 8px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 252, 243, 0.97);
      box-shadow: var(--shadow);
    }

    .governance-header-main,
    .governance-header-actions,
    .governance-context,
    .step-view-switch,
    .start-actions,
    .handoff-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .governance-header-main { justify-content: space-between; gap: 10px; }
    .governance-current { display: flex; flex: 1 1 620px; min-width: 0; align-items: center; gap: 8px; }
    .governance-current label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .governance-current select { min-width: 280px; max-width: 520px; }
    .governance-context { min-width: 0; flex-wrap: nowrap; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .context-badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 8px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #f7f1e5;
      font-weight: 700;
    }
    .context-badge.version { color: #fff; border-color: var(--blue); background: var(--blue); }
    .context-badge.dirty { color: #7b2f27; border-color: #c18a7d; background: var(--red-soft); }
    .context-badge.ready { color: #40543b; border-color: #91a38a; background: var(--sage-soft); }
    .header-menu { position: relative; }
    .header-menu > summary { list-style: none; }
    .header-menu > summary::-webkit-details-marker { display: none; }
    .header-menu-panel {
      position: absolute;
      z-index: 60;
      top: calc(100% + 6px);
      right: 0;
      display: grid;
      width: min(360px, 72vw);
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fffaf0;
      box-shadow: var(--shadow);
    }
    .header-menu-panel .button { width: 100%; text-align: left; }

    .sidebar-brand h1 {
      margin: 7px 0 0;
      font-family: "SimSun", "STSong", serif;
      font-size: 25px;
      line-height: 1.3;
    }

    .eyebrow {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tool-badge {
      display: inline-flex;
      margin-top: 9px;
      padding: 4px 8px;
      border: 1px solid #b9aa8b;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.76);
      font-size: 12px;
      font-weight: 700;
    }

    .notice {
      margin-top: 16px;
      padding: 12px 15px;
      border-left: 4px solid var(--sage);
      border-radius: 0 10px 10px 0;
      background: var(--sage-soft);
      color: #3e4c3b;
      font-weight: 700;
    }

    .boundary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .sidebar-section {
      display: grid;
      gap: 9px;
      padding-top: 13px;
      border-top: 1px solid rgba(203, 189, 158, 0.72);
    }

    .sidebar-section-title {
      color: #584f40;
      font-size: 13px;
      font-weight: 700;
    }

    .sidebar-actions {
      display: grid;
      gap: 8px;
    }

    .sidebar-actions .button { width: 100%; }

    .button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fffaf0;
      font-weight: 700;
    }

    .button:hover { border-color: var(--gold); }
    .button.primary { color: #fff; border-color: var(--red); background: var(--red); }
    .button.secondary { color: #fff; border-color: var(--sage); background: var(--sage); }
    .button.danger { color: var(--red); border-color: #b98578; background: var(--red-soft); }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

    .status {
      display: none;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.show { display: block; }
    .status.error { color: #7b2f27; border-color: #c18a7d; background: #f7e5df; }
    .status.success { color: #40543b; border-color: #91a38a; background: #e8efe4; }

    .candidate-list {
      display: grid;
      gap: 7px;
      max-height: min(32vh, 300px);
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
    }

    .candidate-item {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: rgba(255, 252, 243, 0.78);
      text-align: left;
    }

    .candidate-item:hover { border-color: var(--gold); }
    .candidate-item.active {
      border-color: var(--red);
      background: #fff6ed;
      box-shadow: inset 3px 0 0 var(--red);
    }

    .candidate-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: #655b4a;
      background: var(--paper-deep);
      font-size: 12px;
      font-weight: 700;
    }

    .candidate-item.active .candidate-number { color: #fff; background: var(--red); }
    .candidate-copy { min-width: 0; }
    .candidate-name {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-dirty {
      display: block;
      margin-top: 3px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
    }

    .candidate-file-state {
      display: block;
      margin-top: 3px;
      color: #5d685a;
      font-size: 11px;
    }
    .candidate-file-state.ready { color: #40543b; }

    .candidate-empty {
      padding: 12px;
      border: 1px dashed #bcae90;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.48);
      font-size: 13px;
      line-height: 1.55;
    }

    .candidate-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .workspace { min-width: 0; min-height: 0; overflow: auto; scrollbar-width: thin; }
    .workspace-tabs-shell {
      margin: 0;
    }

    .workspace-tabs {
      display: grid;
      gap: 7px;
    }

    .workspace-tab {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.78);
      font-weight: 700;
      text-align: left;
    }

    .step-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: #655b4a;
      background: var(--paper-deep);
      font-size: 12px;
    }
    .workspace-tab.active .step-number { color: var(--red); background: #fff; }
    .step-copy { min-width: 0; }
    .step-label { display: block; }
    .step-responsibility { display: block; margin-top: 3px; font-size: 11px; font-weight: 400; line-height: 1.45; }
    .workspace-tab.active .step-responsibility { color: rgba(255, 255, 255, 0.88); }

    .workspace-tab:hover { color: var(--ink); background: var(--paper-deep); }
    .workspace-tab.active { color: #fff; background: var(--red); }
    .tab-status {
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .workspace-tab:not(.active) .tab-status.ready { color: #40543b; background: var(--sage-soft); }
    .workspace-tab:not(.active) .tab-status.warning { color: #7b2f27; background: var(--red-soft); }
    .workspace-tab:not(.active) .tab-status.waiting { color: var(--muted); background: #f4f0e7; }
    .workspace-tabs.compact-task .workspace-tab {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-height: 48px;
    }
    .tab-panel[hidden] { display: none; }

    .step-intro {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 12px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.9);
    }
    .step-intro h2 { margin: 0 0 5px; font-family: "SimSun", serif; font-size: 22px; }
    .step-intro p { margin: 0; color: var(--muted); line-height: 1.65; }
    .primary-guidance { max-width: 360px; padding: 9px 11px; border-left: 4px solid var(--gold); background: #f7edda; font-size: 13px; }
    .step-check-action { display: grid; justify-items: start; gap: 5px; margin-top: 9px; }
    .step-check-action small { color: var(--muted); line-height: 1.5; }
    .step-issue-panel {
      margin-bottom: 12px;
      border: 1px solid #d7b7a6;
      border-radius: 12px;
      background: #fff8f1;
    }
    .step-issue-panel summary { padding: 12px 14px; cursor: pointer; color: var(--red); font-weight: 700; }
    .step-issue-copy { margin: 0; padding: 0 14px 4px; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .step-issue-list { margin: 8px 0 0; padding: 0 14px 14px 36px; }
    .step-issue-list li + li { margin-top: 8px; }
    .step-issue-list .diagram-warning-button { width: 100%; }
    .step-check-clear {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding: 11px 14px;
      border: 1px solid #9fb29a;
      border-radius: 10px;
      color: #3f513b;
      background: #edf4e9;
    }
    .step-check-clear span { color: #5d685a; font-size: 13px; line-height: 1.55; }
    .step-view-switch { margin-bottom: 12px; }
    .step-view-button.active { color: #fff; border-color: var(--blue); background: var(--blue); }

    .start-hero {
      display: grid;
      gap: 18px;
      padding: clamp(22px, 4vw, 46px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 252, 243, 0.94);
      box-shadow: var(--shadow);
    }
    .start-hero h2 { margin: 0; font-family: "SimSun", serif; font-size: clamp(26px, 3vw, 38px); }
    .start-hero > p { max-width: 820px; margin: 0; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .governance-flow-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(130px, 1fr));
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .governance-flow-card { min-width: 130px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fffaf0; }
    .governance-flow-card strong { display: block; margin-bottom: 6px; }
    .governance-flow-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .role-sequence {
      display: grid;
      gap: 12px;
      padding: 16px;
      border: 1px solid rgba(161, 72, 53, 0.28);
      border-radius: 12px;
      background: rgba(255, 247, 231, 0.92);
    }
    .role-sequence-head { display: grid; gap: 5px; }
    .role-sequence-head strong { font-size: 15px; }
    .role-sequence-head p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .role-sequence-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .role-sequence-item { display: grid; align-content: start; gap: 7px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .role-sequence-role { display: flex; align-items: center; gap: 8px; }
    .role-sequence-order { display: inline-grid; width: 25px; height: 25px; place-items: center; border-radius: 50%; color: #fff; background: var(--red); font-size: 12px; font-weight: 700; }
    .role-sequence-item p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .role-sequence-handoff { padding-top: 7px; border-top: 1px dashed var(--line); color: var(--ink) !important; }
    .role-sequence.compact { margin-top: 18px; padding: 13px; }
    .role-sequence.compact .role-sequence-list { grid-template-columns: 1fr; }

    .governance-drawer-backdrop {
      position: fixed;
      z-index: 110;
      inset: 0;
      display: none;
      justify-content: flex-end;
      background: rgba(37, 31, 23, 0.36);
    }
    .governance-drawer-backdrop.show { display: flex; }
    .governance-drawer {
      width: min(620px, 92vw);
      height: 100%;
      padding: 22px;
      overflow-y: auto;
      border-left: 1px solid var(--line);
      background: #fffaf0;
      box-shadow: -18px 0 50px rgba(37, 31, 23, 0.22);
    }
    .governance-drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .governance-drawer h2 { margin: 0; font-family: "SimSun", serif; }
    .governance-drawer-list { display: grid; gap: 10px; margin-top: 18px; }
    .governance-drawer-card { padding: 13px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .governance-drawer-card p { margin: 6px 0 0; color: var(--muted); line-height: 1.65; }

    .tool-help-page { display: grid; gap: 12px; }
    .tool-help-grid,
    .tool-help-step-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .tool-help-card,
    .tool-help-step-card { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #fffaf0; }
    .tool-help-card h3,
    .tool-help-step-card h3 { margin: 0 0 7px; font-size: 15px; }
    .tool-help-card p,
    .tool-help-step-card p { margin: 5px 0 0; color: var(--muted); line-height: 1.65; }
    .tool-help-step-card strong { color: var(--ink); }
    .tool-term-groups { display: grid; gap: 10px; }
    .tool-term-group { overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .tool-term-group summary { padding: 13px 15px; cursor: pointer; background: var(--paper-deep); font-weight: 700; }
    .tool-term-list { margin: 0; }
    .tool-term-row { display: grid; grid-template-columns: minmax(160px, 230px) minmax(0, 1fr); gap: 14px; padding: 11px 15px; border-top: 1px solid var(--line); }
    .tool-term-row dt { font-weight: 700; line-height: 1.6; }
    .tool-term-row dd { margin: 0; color: var(--muted); line-height: 1.65; }

    .skeleton-list-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
    .skeleton-list { display: grid; gap: 8px; }
    .skeleton-list-button { width: 100%; text-align: left; }
    .skeleton-list-button small { display: block; margin-top: 4px; font-size: 12px; opacity: 0.82; }
    .cross-department-list { display: grid; gap: 10px; }
    .cross-department-card { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #fffaf0; }
    .cross-department-card h3 { margin: 0 0 7px; }
    .cross-department-card p { margin: 4px 0; color: var(--muted); line-height: 1.6; }
    .download-result { display: grid; gap: 8px; margin-top: 12px; padding: 14px; border: 1px solid #91a38a; border-radius: 10px; background: #e8efe4; }
    .download-result code { overflow-wrap: anywhere; }

    .editor-navigation,
    .process-navigation {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.88);
      scrollbar-width: thin;
    }

    .editor-section-tab,
    .process-section-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    .editor-section-tab:hover,
    .process-section-tab:hover {
      color: var(--ink);
      border-color: var(--line);
      background: var(--paper-deep);
    }

    .editor-section-tab.active {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }

    .process-section-tab.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .diagram-section { overflow: visible; }
    body.diagram-overlay-open { overflow: hidden; }
    .diagram-section.diagram-expanded {
      position: fixed;
      inset: 0;
      z-index: 90;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      border: 0;
      border-radius: 0;
      background: #fffaf0;
      box-shadow: 0 26px 80px rgba(37, 31, 23, 0.34);
    }

    .diagram-section.diagram-expanded > .section-body {
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr) auto;
      height: 100%;
      min-height: 0;
      padding: 10px 12px;
      overflow: hidden;
    }

    .diagram-section.diagram-expanded .flow-graph-editor-layout {
      grid-row: 4;
      height: auto;
      align-self: stretch;
      min-height: 0;
    }

    .diagram-section.diagram-expanded .flow-graph-editor-layout > div {
      height: 100%;
      min-height: 0;
    }

    .diagram-section.diagram-expanded .diagram-canvas {
      height: 100%;
      min-height: 0;
      border-radius: 8px;
    }

    .diagram-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 8px;
    }

    .diagram-toolbar h2 { margin: 0 0 5px; font-family: "SimSun", serif; font-size: 22px; }
    .diagram-toolbar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .diagram-legend-shell {
      margin-bottom: 8px;
      padding: 7px 10px;
      border: 1px solid #bcae90;
      border-radius: 10px;
      background: #fbf5e9;
    }

    .diagram-legend-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .diagram-legend-list {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 10px;
    }

    .diagram-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #3f403b;
      font-size: 12px;
      line-height: 1.35;
    }

    .diagram-legend-copy { min-width: 0; }
    .diagram-legend-copy strong, .diagram-legend-copy small { display: block; }
    .diagram-legend-copy strong { color: #35362f; font-size: 12px; }
    .diagram-legend-copy small { margin-top: 2px; color: #6b685f; font-size: 10px; }
    .legend-symbol {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 24px;
      border: 2px solid #8c3f33;

    function newRef(prefix) {
      const token = typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID().replace(/-/g, '')
        : `${Date.now()}${Math.random().toString(16).slice(2)}`;
      return `${prefix}_${token}`;

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function text(value) {
      return value == null ? '' : String(value);
    }

    function nullable(value) {
      const normalized = text(value).trim();
      return normalized || null;
    }

    function list(value) {
      if (Array.isArray(value)) return [...new Set(value.map(item => text(item).trim()).filter(Boolean))];
      return [...new Set(text(value).split(/[,，\n]/).map(item => item.trim()).filter(Boolean))];

    function topVisibleModalDialog() {
      const backdrops = Array.from(document.querySelectorAll('.modal-backdrop.show, .governance-drawer-backdrop.show'));
      const topBackdrop = backdrops.sort((left, right) => {
        const zIndexDifference = Number.parseInt(getComputedStyle(left).zIndex, 10) - Number.parseInt(getComputedStyle(right).zIndex, 10);
        if (Number.isFinite(zIndexDifference) && zIndexDifference !== 0) return zIndexDifference;
        return left.compareDocumentPosition(right) & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
      }).at(-1);
      return topBackdrop?.querySelector('[role="dialog"]') || null;
    }

    function trapTopModalFocus(event) {
      if (event.key !== 'Tab') return false;
      const dialog = topVisibleModalDialog();
      if (!dialog) return false;
      const focusable = Array.from(dialog.querySelectorAll([
        'button:not([disabled])',
        'input:not([disabled]):not([type="hidden"])',
        'select:not([disabled])',
        'textarea:not([disabled])',
        'a[href]',
        '[tabindex]:not([tabindex="-1"])'
      ].join(','))).filter(item => item.getClientRects().length > 0 && item.getAttribute('aria-hidden') !== 'true');
      if (!focusable.length) {
        event.preventDefault();
        if (!dialog.hasAttribute('tabindex')) dialog.setAttribute('tabindex', '-1');
        dialog.focus({ preventScroll: true });
        return true;
      }
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      const active = document.activeElement;
      if (!dialog.contains(active)) {
        event.preventDefault();
        (event.shiftKey ? last : first).focus({ preventScroll: true });
        return true;
      }
      if (!event.shiftKey && active === last) {
        event.preventDefault();
        first.focus({ preventScroll: true });
        return true;
      }
      if (event.shiftKey && active === first) {
        event.preventDefault();
        last.focus({ preventScroll: true });
        return true;
      }
      return false;
    }

    function formFieldBatchCanApply(patch) {
      const targetReady = text(patch.targetValue)
        && (patch.targetValue !== 'new:detail' || text(patch.newAreaTitle).trim());
      if (!targetReady) return false;
      if (patch.mode === 'blank') return typeof patch.blankRequired === 'boolean';
      const fieldRefs = list(patch.fieldRefs);
      return fieldRefs.length > 0 && fieldRefs.every(fieldRef => typeof patch.requiredByFieldRef?.[fieldRef] === 'boolean');
    }

    function captureFormFieldBatchFocus(focusTarget = document.activeElement) {
      const target = focusTarget;
      if (!(target instanceof HTMLElement) || !formFieldBatchContent.contains(target)) return null;
      let kind = '';
      let value = '';
      if (target.matches('[data-form-field-batch-search]')) kind = 'search';
      else if (target.matches('[data-form-field-batch-area-title]')) kind = 'area-title';
      else if (target.matches('[data-form-field-batch-target]')) kind = 'target';
      else if (target.matches('[data-form-field-batch-blank-required]')) kind = 'blank-required';
      else if (target.matches('[data-form-field-batch-ref]')) {
        kind = 'field-ref';
        value = target.dataset.formFieldBatchRef;
      } else if (target.matches('[data-form-field-batch-required]')) {
        kind = 'required';
        value = target.dataset.formFieldBatchRequired;
      } else if (target.matches('[data-form-field-batch-bulk]')) {
        kind = 'bulk';
        value = target.dataset.formFieldBatchBulk;
      }
      if (!kind) return null;
      return {
        kind,
        value,
        selectionStart: typeof target.selectionStart === 'number' ? target.selectionStart : null,
        selectionEnd: typeof target.selectionEnd === 'number' ? target.selectionEnd : null,
        contentScrollTop: formFieldBatchContent.scrollTop,
        panelScrolls: Array.from(formFieldBatchContent.querySelectorAll('.form-field-batch-groups, .form-field-batch-selection'))
          .map(item => ({ top: item.scrollTop, left: item.scrollLeft }))
      };
    }

    function restoreFormFieldBatchFocus(state) {
      if (!state) return;
      requestAnimationFrame(() => {
        if (!formFieldBatchModal.classList.contains('show')) return;
        const controls = Array.from(formFieldBatchContent.querySelectorAll('input, select, button'));
        const control = controls.find(item => {
          if (state.kind === 'search') return item.matches('[data-form-field-batch-search]');
          if (state.kind === 'area-title') return item.matches('[data-form-field-batch-area-title]');
          if (state.kind === 'target') return item.matches('[data-form-field-batch-target]');
          if (state.kind === 'blank-required') return item.matches('[data-form-field-batch-blank-required]');
          if (state.kind === 'field-ref') return item.dataset.formFieldBatchRef === state.value;
          if (state.kind === 'required') return item.dataset.formFieldBatchRequired === state.value;
          return state.kind === 'bulk' && item.dataset.formFieldBatchBulk === state.value;
        });
        formFieldBatchContent.scrollTop = state.contentScrollTop;
        formFieldBatchContent.querySelectorAll('.form-field-batch-groups, .form-field-batch-selection').forEach((item, index) => {
          item.scrollTop = state.panelScrolls[index]?.top || 0;
          item.scrollLeft = state.panelScrolls[index]?.left || 0;
        });
        control?.focus({ preventScroll: true });
        if (control && state.selectionStart != null && typeof control.setSelectionRange === 'function') {
          control.setSelectionRange(state.selectionStart, state.selectionEnd ?? state.selectionStart);
        }
      });
    }

    function updateFormFieldBatchPatch(values = {}, options = {}) {
      const session = currentFormFieldBatchSession();

      confirmFormFieldBatchButton.textContent = patch.mode === 'blank' ? '添加空白字段' : `引用所选 ${count} 个字段`;
      confirmFormFieldBatchButton.disabled = formFieldBatchApplying || !formFieldBatchCanApply(patch);
      cancelFormFieldBatchButton.disabled = formFieldBatchApplying;
    }

    function openFormFieldBatch(formIndex, mode = 'reference', invoker = null) {
      if (formFieldBatchApplying) {
        showStatus('批量字段正在检查，请等待本次检查完成。', 'error');
        return false;
      }
      const form = currentDocument()?.forms?.[formIndex];
      if (!form) return false;
      const patch = {
        mode: mode === 'blank' ? 'blank' : 'reference',
        formRef: form.form_ref,
        fieldRefs: [],
        requiredByFieldRef: {},
        blankRequired: null,
        targetValue: '',
        newAreaTitle: '',
        search: '',
        sourceFingerprint: globalThis.GraphEditorState.fingerprint(currentDocument())
      };
      const result = editSessionManager.open({
        candidateKey: candidateStateKey(),
        editorKind: 'form-field-batch',
        entityRef: form.form_ref,
        allowedFields: Object.keys(patch),
        baselineFields: {},
        patch,
        started: true,
        canApply: false,
        focusTarget: { formRef: form.form_ref, invokerId: invoker?.id || '' }
      });
      if (!result.ok) {
        showStatus('当前还有未应用修改。请先应用或放弃，再批量添加表单字段。', 'error');
        return false;
      }
      formFieldBatchSessionToken += 1;
      formFieldBatchError.textContent = '';
      renderFormFieldBatchModal();
      formFieldBatchModal.classList.add('show');
      formFieldBatchModal.setAttribute('aria-hidden', 'false');
      requestAnimationFrame(() => {
        const firstControl = formFieldBatchContent.querySelector('input, select');
        if (firstControl) firstControl.focus();
        else cancelFormFieldBatchButton.focus();
      });
      refreshUnappliedIndicators();
      return true;
    }

    function closeFormFieldBatchModal(options = {}) {
      if (formFieldBatchApplying && options.force !== true) {
        formFieldBatchError.textContent = '批量字段正在检查，完成前不能取消或关闭。';
        showStatus('批量字段正在检查，请等待本次检查完成。', 'error');
        return false;
      }
      const session = currentFormFieldBatchSession();
      const restoreTarget = session ? { formRef: session.patch.formRef, mode: session.patch.mode } : null;
      formFieldBatchApplying = false;
      formFieldBatchSessionToken += 1;
      formFieldBatchModal.classList.remove('show');
      formFieldBatchModal.setAttribute('aria-hidden', 'true');
      formFieldBatchError.textContent = '';
      if (options.discard !== false) editSessionManager.discard();
      refreshUnappliedIndicators();
      if (options.render) render();
      if (options.restoreFocus !== false && restoreTarget) {
        requestAnimationFrame(() => {
          const formIndex = (currentDocument()?.forms || []).findIndex(item => item.form_ref === restoreTarget.formRef);
          const target = formIndex >= 0
            ? workspace.querySelector(`[data-action="open-form-field-batch"][data-form-index="${formIndex}"][data-mode="${restoreTarget.mode}"]`)
            : null;
          target?.scrollIntoView({ block: 'nearest' });
          target?.focus({ preventScroll: true });
        });
      }
      return true;
    }

    function formFieldBatchPlanInput(patch) {
      const input = {
        candidateKey: candidateStateKey(),
        documentFingerprint: patch.sourceFingerprint,
        formRef: patch.formRef,
        fieldRefs: list(patch.fieldRefs),
        requiredByFieldRef: clone(patch.requiredByFieldRef || {})
      };
      if (text(patch.targetValue).startsWith('area:')) input.areaRef = text(patch.targetValue).slice(5);
      else if (patch.targetValue === 'new:detail') input.newArea = { areaType: '明细清单', areaTitle: text(patch.newAreaTitle).trim() };
      else if (patch.targetValue === 'new:unassigned') input.newArea = { areaType: '', areaTitle: '' };
      return input;
    }

    function planBlankFormField(documentValue, patch) {
      const candidate = clone(documentValue);
      const form = (candidate.forms || []).find(item => item.form_ref === patch.formRef);
      if (!form) return { ok: false, errors: [{ message: '目标表单已经不存在' }] };
      let area = null;
      if (text(patch.targetValue).startsWith('area:')) {
        const areaRef = text(patch.targetValue).slice(5);
        area = (form.areas || []).find(item => item.area_ref === areaRef);
        if (!area) return { ok: false, errors: [{ message: '目标主表或明细表已经不存在' }] };
      } else if (patch.targetValue === 'new:detail') {
        const title = text(patch.newAreaTitle).trim();
        if (!title) return { ok: false, errors: [{ message: '新建明细表时必须填写明细表名称' }] };
        area = { area_ref: newRef('area'), area_type: '明细清单', area_title: title, items: [] };
        form.areas.push(area);
      } else if (patch.targetValue === 'new:unassigned') {
        area = { area_ref: newRef('area'), area_type: '', area_title: '', items: [] };
        form.areas.push(area);
      } else return { ok: false, errors: [{ message: '必须明确选择目标主表或明细表' }] };
      if (typeof patch.blankRequired !== 'boolean') return { ok: false, errors: [{ message: '必须明确选择“必填”或“非必填”' }] };
      const item = { ...newFormItem(), required: patch.blankRequired };
      area.items.push(item);
      return {
        ok: true,
        document: candidate,
        addedItems: [{ itemRef: item.item_ref, fieldRef: '', dataRef: '', areaRef: area.area_ref, required: item.required }],
        createdArea: null,
        errors: []
      };
    }

    async function applyFormFieldBatch() {
      const session = currentFormFieldBatchSession();
      if (!session || formFieldBatchApplying) return false;
      const patch = session.patch;
      if (!formFieldBatchCanApply(patch)) {
        formFieldBatchError.textContent = '请完成对象字段、目标区域和必填属性选择。';
        renderFormFieldBatchModal();
        return false;
      }
      const applyState = {
        candidateKey: session.candidateKey,
        sessionToken: formFieldBatchSessionToken,
        sessionFingerprint: globalThis.GraphEditorState.fingerprint(session),
        patchFingerprint: globalThis.GraphEditorState.fingerprint(patch),
        documentFingerprint: globalThis.GraphEditorState.fingerprint(currentDocument())
      };
      formFieldBatchApplying = true;
      renderFormFieldBatchModal();
      try {
        const source = currentDocument();
        const planned = patch.mode === 'blank'
          ? planBlankFormField(source, patch)
          : globalThis.FormFieldReuse.planBatchReference(source, formFieldBatchPlanInput(patch), newRef);
        if (!planned.ok) {
          formFieldBatchError.textContent = (planned.errors || []).map(item => item.message).join('；') || '批量规划失败。';
          return false;
        }
        const validation = await validateGraphDocument(planned.document);
        if (!validation.valid) {
          formFieldBatchError.textContent = `完整候选未通过v7结构检查：${(validation.errors || []).slice(0, 3).map(item => `${validationErrorLocation(item)}：${item.message}`).join('；')}`;
          return false;
        }
        const liveSession = currentFormFieldBatchSession();
        const sessionUnchanged = candidateStateKey() === applyState.candidateKey
          && formFieldBatchSessionToken === applyState.sessionToken
          && Boolean(liveSession)
          && globalThis.GraphEditorState.fingerprint(liveSession) === applyState.sessionFingerprint
          && globalThis.GraphEditorState.fingerprint(liveSession.patch) === applyState.patchFingerprint;
        if (!sessionUnchanged) {
          formFieldBatchError.textContent = '检查期间批量草稿或编辑会话已经变化。系统没有写入旧快照；请核对当前选择后重新应用。';
          return false;
        }
        if (globalThis.GraphEditorState.fingerprint(currentDocument()) !== applyState.documentFingerprint
          || applyState.documentFingerprint !== patch.sourceFingerprint) {
          formFieldBatchError.textContent = '打开批量草稿后当前JSON已经发生变化。系统没有写入任何字段；请保留选择并重新核对目标。';
          if (candidateStateKey() === session.candidateKey && formFieldBatchSessionToken === applyState.sessionToken) {
            editSessionManager.updatePatch({ sourceFingerprint: globalThis.GraphEditorState.fingerprint(currentDocument()) }, { started: true });
          }
          return false;
        }
        const entry = currentEntry();
        const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => ({
          ok: true,
          document: clone(planned.document),
          details: { source: 'form-field-batch', itemCount: planned.addedItems.length }
        }));
        if (!result.ok) throw new Error(result.message || '整批字段未能写入当前流程');
        entry.data = result.document;
        const first = planned.addedItems[0];
        activeFormRef = patch.formRef;
        activeAreaRef = first?.areaRef || '';
        activeFormItemRef = first?.itemRef || '';
        invalidateCurrentChecks(entry);
        resetWebGridEditor({ preserveViewState: true });
        refreshCandidateDirty(entry);
        editSessionManager.reset();
        closeFormFieldBatchModal({ discard: false, force: true, restoreFocus: false });
        render();
        requestAnimationFrame(() => {
          const row = workspace.querySelector(`[data-item-ref="${CSS.escape(first?.itemRef || '')}"]`);
          const control = row?.querySelector('[data-bind]');
          row?.scrollIntoView({ block: 'center', inline: 'nearest' });
          control?.focus({ preventScroll: true });
          if (control?.matches('input[type="text"]')) control.select();
        });
        showStatus(`已一次添加${planned.addedItems.length}个表单字段。执行一次撤销可删除整批，再次重做可恢复整批。`, 'success');
        refreshValidationAfterGraphCommand(result.document);
        return true;
      } catch (error) {
        formFieldBatchError.textContent = `整批字段未应用：${error.message}`;
        return false;
      } finally {
        formFieldBatchApplying = false;
        if (formFieldBatchModal.classList.contains('show')) renderFormFieldBatchModal();
      }
    }

    function escapeHtml(value) {
      return text(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    async function readJsonResponse(response, nonJsonMessage) {
      const contentType = text(response.headers.get('content-type')).toLowerCase();
      if (!contentType.includes('application/json')) throw new Error(nonJsonMessage);
      try {
        return await response.json();
      } catch (_error) {
        throw new Error(nonJsonMessage);
      }
    }

    async function fetchEmptyProcessDocument() {
      const response = await fetch('/api/template?version=process-governance-v7', { cache: 'no-store' });
      const result = await readJsonResponse(
        response,
        '3001空白模板接口未返回结构化数据。请保持当前页面打开，待维护人员重启3001服务后再次新建流程。'
      );
      if (!response.ok) throw new Error(result.error || '无法读取当前空白模板');
      if (result.schema_version !== EXPECTED_EXPORT_SCHEMA_VERSION || !result.data) {
        throw new Error('3001空白模板与当前页面版本不一致，请联系维护人员重启服务。');
      }
      return result.data;
    }

    async function loadEditorCatalogs() {
      rosterLoadState = 'loading';
      formItemTypeLoadState = 'loading';
      try {
        const response = await fetch('/api/enums', { cache: 'no-store' });
        const result = await readJsonResponse(response, '3001岗位和填写项类型接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '无法读取岗位和填写项类型');
        rosterRolesByDepartment = result.rosterRolesByDepartment && typeof result.rosterRolesByDepartment === 'object'
          ? result.rosterRolesByDepartment
          : {};
        formItemTypes = Array.isArray(result.fieldType)
          ? [...new Set(result.fieldType.map(value => text(value).trim()).filter(Boolean))]
          : [];
        rosterLoadState = Object.keys(rosterRolesByDepartment).length ? 'ready' : 'unavailable';
        formItemTypeLoadState = formItemTypes.length ? 'ready' : 'unavailable';
      } catch (_error) {
        rosterRolesByDepartment = {};
        formItemTypes = [];
        rosterLoadState = 'unavailable';
        formItemTypeLoadState = 'unavailable';
      }
      if (currentDocument()) render();
    }

    async function loadVersionHistory() {
      versionHistoryLoadState = 'loading';
      try {
        const response = await fetch('/api/version-history', { cache: 'no-store' });
        const result = await readJsonResponse(response, '3001版本说明接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '无法读取版本说明');
        versionHistory = result;
        versionHistoryLoadState = 'ready';
      } catch (_error) {
        versionHistory = null;
        versionHistoryLoadState = 'unavailable';
      }
      if (activeWorkspaceTab === 'versions') render();
    }

    function rosterPositions(department) {
      return Array.isArray(rosterRolesByDepartment?.[department])
        ? rosterRolesByDepartment[department]
        : [];
    }

    function actorDepartments() {
      return [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司');
    }

    function currentExecutionDepartment() {
      return text(currentDocument()?.process?.owning_department).trim();
    }

    function parseActorRole(value) {
      const raw = text(value).trim();
      if (!raw) return { department: '', position: '', known: false };
      if (raw === '全公司') return { department: '全公司', position: '', known: true };
      const departments = [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司')
        .sort((left, right) => right.length - left.length);
      const department = departments.find(item => raw === item || raw.startsWith(item));
      if (department) {
        const position = raw.slice(department.length).trim();
        return {
          department,
          position,
          known: Boolean(position && rosterPositions(department).includes(position))
        };
      }
      const matches = Object.entries(rosterRolesByDepartment || {})
        .filter(([, positions]) => Array.isArray(positions) && positions.includes(raw));
      if (matches.length === 1) {
        return { department: matches[0][0], position: raw, known: true };
      }
      return { department: '', position: '', known: false };
    }

    function combineActorRole(department, position) {
      if (department === '全公司') return '全公司';
      if (department && position) return `${department}${position}`;
      return department || '';
    }

    function externalActorDepartment(value, ownDepartment = currentExecutionDepartment()) {
      const normalizedOwner = text(ownDepartment).trim();
      const parsed = parseActorRole(value);
      if (!normalizedOwner || !parsed.department || parsed.department === '全公司') return '';
      return parsed.department === normalizedOwner ? '' : parsed.department;
    }

    function actorAssignmentMode(behavior) {
      const explicit = text(behavior?.actor_assignment_mode).trim();
      if (ACTOR_ASSIGNMENT_MODE_VALUES.has(explicit)) return explicit;
      return text(behavior?.current_actor_role).trim() === '全公司'
        ? 'company_wide'
        : 'fixed_department';
    }

    function isDynamicActorBehavior(behavior) {
      return actorAssignmentMode(behavior) === 'dynamic_from_data';
    }

    function ordinaryRelationsForBehavior(behaviorRef, data = currentDocument()) {
      return (data?.flow_relations || []).filter(relation =>
        relation.from_behavior_ref === behaviorRef || relation.to_behavior_ref === behaviorRef
      );
    }

    function actorRolePicker(index) {
      const behavior = currentDocument().behaviors[index];
      const rawValue = text(behavior?.current_actor_role).trim();
      const ownDepartment = currentExecutionDepartment();
      const parsed = parseActorRole(rawValue);
      const knownDepartments = actorDepartments();
      const selectedDepartment = parsed.department === '全公司' || knownDepartments.includes(parsed.department)
        ? parsed.department
        : '';
      const externalDepartment = externalActorDepartment(rawValue, ownDepartment);
      const knownCurrentValue = Boolean(
          rawValue
          && selectedDepartment
          && selectedDepartment !== '全公司'
          && parsed.position
          && rosterPositions(selectedDepartment).includes(parsed.position)
        );
      const departmentOnlyInProgress = Boolean(
        rawValue
        && rawValue === selectedDepartment
        && selectedDepartment !== '全公司'
        && !parsed.position
      );
      const departmentOptions = [{
        value: '',
        label: '请选择执行部门'
      }];
      knownDepartments.forEach(department => departmentOptions.push({
        value: department,
        label: department === ownDepartment ? `${department}（本流程归口部门）` : department
      }));
      const positions = selectedDepartment && selectedDepartment !== '全公司'
        ? rosterPositions(selectedDepartment)
        : [];
      const positionOptions = [{
        value: '',
        label: selectedDepartment === '全公司'
          ? '全公司通用无需选择岗位'
          : rosterLoadState === 'loading'
            ? '正在读取花名册岗位'
            : rosterLoadState === 'unavailable'
              ? '花名册岗位暂时不可用'
              : selectedDepartment
                ? '请选择执行岗位'
                : '请先选择执行部门'
      }].concat(positions.map(position => ({ value: position, label: position })));
      if (selectedDepartment && parsed.position && !positions.includes(parsed.position)) {
        positionOptions.push({
          value: parsed.position,
          label: `原文件岗位：${parsed.position}（当前花名册未收录）`
        });
      }

      const rosterWarning = rawValue && !knownCurrentValue && !departmentOnlyInProgress
        ? `<div class="inline-warning">当前导入值“${escapeHtml(rawValue)}”未被现行花名册收录。3001会保留该值；如需修改，请重新选择执行部门和执行岗位。</div>`
        : '';
      const availability = rosterLoadState === 'unavailable'
        ? '<div class="inline-warning">花名册岗位暂时不可用。3001不会清除已有执行岗位；其他内容仍可继续编制和下载。</div>'
        : externalDepartment
          ? `<div class="inline-note">当前为跨部门行为。流程先后请在“流程关系”中维护；发送、接收、创建或更新的数据请在“输出物与数据”中维护。</div>`
          : selectedDepartment && selectedDepartment === ownDepartment
            ? `<div class="inline-note">当前为本部门执行。执行岗位显示“${escapeHtml(selectedDepartment)}”花名册中的岗位。</div>`
            : !ownDepartment
              ? '<div class="inline-note">可以先选择任意执行部门和岗位。填写流程归口部门后，页面会据此识别本部门行为和跨部门行为。</div>'
              : '<div class="inline-note">请选择实际执行部门和执行岗位。</div>';

      return `
        <div class="field wide">
          <span class="field-label">执行部门和执行岗位</span>
          <div class="role-picker">
            <select
              data-actor-department="${index}"
              data-focus-key="behaviors.${index}.current_actor_role"
            >
              ${optionHtml(departmentOptions, selectedDepartment)}
            </select>
            <select
              data-actor-position="${index}"
              data-focus-key="behaviors.${index}.current_actor_role"
              ${!selectedDepartment || selectedDepartment === '全公司' || rosterLoadState !== 'ready' ? 'disabled' : ''}
            >
              ${optionHtml(positionOptions, parsed.position)}
            </select>
          </div>
          ${rosterWarning}
          ${availability}
        </div>`;
    }

    function dynamicDepartmentDataSelect(index, behavior, flowDetails) {
      const selectedRef = text(behavior.actor_department_data_ref).trim();
      const values = [{ value: '', label: '请选择前序数据' }];
      (currentDocument()?.data_objects || []).forEach((item, dataIndex) => {
        const allowed = flowDetails.isAvailableBeforeBehavior?.(item.data_ref, behavior.behavior_ref) === true;
        if (!allowed && item.data_ref !== selectedRef) return;
        values.push({
          value: item.data_ref,
          label: `${dataIndex + 1}. ${item.data_name || '未命名数据'}${allowed ? '' : '（当前不是可用的前序数据）'}`
        });
      });
      const emptyHint = values.length === 1
        ? '<div class="inline-warning">当前没有可用于确定执行部门的前序数据。请先在“输出物与数据”中登记责任部门数据，并建立它的产生行为和流程关系。</div>'
        : '';
      return `
        <div class="field wide">
          <label>执行部门来源数据</label>
          <select data-bind="behaviors.${index}.actor_department_data_ref" data-kind="nullable" data-focus-key="behaviors.${index}.actor_department_data_ref">
            ${optionHtml(values, selectedRef)}
          </select>
          <span class="hint">只能选择本行为开始前已经产生、并可沿流程关系到达本行为的数据。数据值可以包含一个或多个责任部门。</span>
          ${emptyHint}
        </div>`;
    }

    function actorAssignmentEditor(index, behavior, flowDetails) {
      const mode = actorAssignmentMode(behavior);
      const modeField = `
        <div class="field wide">
          <label>执行主体确定方式</label>
          <select data-actor-assignment-mode="${index}" data-focus-key="behaviors.${index}.actor_assignment_mode">
            ${optionHtml(ACTOR_ASSIGNMENT_MODES, mode)}
          </select>
        </div>`;
      if (mode === 'company_wide') {
        return `${modeField}<div class="field wide"><div class="inline-note">“全公司通用”表示该行为不归属于某个特定部门，不算跨部门。</div></div>`;
      }
      if (mode === 'dynamic_from_data') {
        return `${modeField}
          ${dynamicDepartmentDataSelect(index, behavior, flowDetails)}
          ${field(`behaviors.${index}.actor_position_rule`, '执行岗位或责任人确定规则', {
            type: 'textarea',
            className: 'wide',
            placeholder: '例如：由问题责任部门确定整改责任人',
            hint: '运行时，每个责任部门分别确定办理岗位或责任人；责任部门尚未形成时，不得向全公司广播待办。'
          })}
          <div class="field wide"><div class="inline-note">该行为在设计时不算固定跨部门行为。运行时取得责任部门后，只有责任部门与流程归口部门不同时才形成跨部门办理。</div></div>`;
      }
      return `${modeField}${actorRolePicker(index)}`;
    }

    function entityEditConfig(kind) {
      return ENTITY_EDIT_CONFIG[kind] || null;
    }

    function currentEntry() {
      return candidates[currentIndex] || null;
    }

    function currentDocument() {
      return currentEntry()?.data || null;
    }

    function candidateStateKey(entry = currentEntry()) {
      if (!entry) return '';
      if (!entry.stateKey) entry.stateKey = newRef('candidate');
      return entry.stateKey;
    }

    function authoringContextSource() {
      if (!webGridSession) return currentDocument() || {};
      const rows = webGridSession.allRows();
      return {
        data_objects: rows.data_objects || [],
        data_fields: rows.data_fields || [],
        forms: rows.forms || [],
        form_areas: rows.form_areas || [],
        form_items: rows.form_items || []
      };
    }

    function captureAuthoringSelectionContext() {
      const key = candidateStateKey();
      if (!key) return null;
      if (webGridSession) captureVisibleWebGridScroll();
      const stored = authoringSelectionContextManager.get(key);
      const workspaceName = webGridSession ? activeGridWorkspace : stored.workspace;
      const tableId = webGridSession
        ? activeGridTableByWorkspace[workspaceName] || globalThis.AuthoringSelectionContext.DEFAULT_TABLES[workspaceName]
        : stored.tableId;
      if (webGridSession) {
        globalThis.ProcessV7GridAdapter.TABLE_IDS.forEach(currentTableId => {
          const tableWorkspace = globalThis.AuthoringSelectionContext.TABLE_WORKSPACES[currentTableId];
          authoringSelectionContextManager.setTableView(key, currentTableId, {
            filter: webGridFilters[currentTableId] || '',
            sort: clone(webGridSorts[currentTableId] || null),
            selectedRowId: webGridSelectedRows[currentTableId] || '',
            scrollTop: Number(webGridScrollPositions[currentTableId]?.top || 0),
            scrollLeft: Number(webGridScrollPositions[currentTableId]?.left || 0),
            focusColumn: webGridRanges[currentTableId]?.currentColumn || '',
            activeInWorkspace: activeGridTableByWorkspace[tableWorkspace] === currentTableId
          });
        });
      }
      return authoringSelectionContextManager.update(key, {
        mode: activeDataEditingMode,
        workspace: workspaceName,
        tableId,
        dataRef: activeDataRef,
        dataFieldRef: activeDataFieldRef,
        formRef: activeFormRef,
        areaRef: activeAreaRef,
        formItemRef: activeFormItemRef
      }, authoringContextSource());
    }

    function restoreAuthoringSelectionContext() {
      const key = candidateStateKey();
      if (!key) return null;
      const state = authoringSelectionContextManager.reconcile(key, authoringContextSource());
      activeDataEditingMode = state.mode;
      activeGridWorkspace = state.workspace;
      activeGridTableByWorkspace = { ...globalThis.AuthoringSelectionContext.DEFAULT_TABLES };
      activeDataRef = state.dataRef;
      activeDataFieldRef = state.dataFieldRef;
      activeFormRef = state.formRef;
      activeAreaRef = state.areaRef;
      activeFormItemRef = state.formItemRef;
      Object.entries(state.tableViews || {}).forEach(([tableId, view]) => {
        const tableWorkspace = globalThis.AuthoringSelectionContext.TABLE_WORKSPACES[tableId];
        if (view.activeInWorkspace && tableWorkspace) activeGridTableByWorkspace[tableWorkspace] = tableId;
        webGridFilters[tableId] = view.filter || '';
        if (view.sort) webGridSorts[tableId] = clone(view.sort);
        else delete webGridSorts[tableId];
        webGridSelectedRows[tableId] = view.selectedRowId || '';
        webGridScrollPositions[tableId] = {
          top: Number(view.scrollTop || 0),
          left: Number(view.scrollLeft || 0)
        };
        const selectedRowId = view.selectedRowId || '';
        const focusColumn = view.focusColumn || '';
        if (selectedRowId && focusColumn) {
          webGridRanges[tableId] = {
            anchorRowId: selectedRowId,
            currentRowId: selectedRowId,
            anchorColumn: focusColumn,
            currentColumn: focusColumn
          };
        }
      });
      activeGridTableByWorkspace[state.workspace] = state.tableId;
      return state;
    }

    function updateAuthoringSelection(patch) {
      const key = candidateStateKey();
      if (!key) return null;
      const state = authoringSelectionContextManager.update(key, patch, authoringContextSource());
      activeDataEditingMode = state.mode;
      activeGridWorkspace = state.workspace;
      activeGridTableByWorkspace[state.workspace] = state.tableId;
      activeDataRef = state.dataRef;
      activeDataFieldRef = state.dataFieldRef;
      activeFormRef = state.formRef;
      activeAreaRef = state.areaRef;
      activeFormItemRef = state.formItemRef;
      return state;
    }

    function entityByKindAndRef(kind, ref, data = currentDocument()) {
      const config = entityEditConfig(kind);
      return config && data
        ? (data[config.collection] || []).find(item => item[config.refKey] === ref) || null
        : null;
    }

    function openEntityEditSession(kind, ref, options = {}) {
      const config = entityEditConfig(kind);
      const entity = entityByKindAndRef(kind, ref);
      if (!config || !entity) return null;
      const result = editSessionManager.open({
        candidateKey: candidateStateKey(),
        editorKind: config.editorKind,
        entityRef: ref,
        allowedFields: config.allowedFields,
        baselineFields: entity,
        patch: {},
        canApply: true,
        focusTarget: options.focusTarget || null
      });
      if (!result.ok) {
        showStatus('当前还有未应用修改。请先应用或放弃，再编辑其他对象。', 'error');
        return null;
      }
      graphSelection = { kind, ref };
      if (kind === 'behavior') activeBehaviorRef = ref;
      if (kind === 'relation') activeRelationRef = ref;
      if (kind === 'data') activeDataRef = ref;
      return entity;
    }

    function entityEditSession(kind, ref) {
      const config = entityEditConfig(kind);
      if (!config) return null;
      return editSessionManager.get({
        candidateKey: candidateStateKey(),
        editorKind: config.editorKind,
        entityRef: ref
      });
    }

    function workingEntity(kind, ref) {
      const entity = entityByKindAndRef(kind, ref);
      if (!entity) return null;
      const session = entityEditSession(kind, ref);
      return session ? { ...clone(entity), ...clone(session.patch) } : clone(entity);
    }

    function sessionLabel(session = editSessionManager.get()) {
      return EDIT_SESSION_LABELS[session?.editorKind] || '当前编辑内容';
    }

    function dataEdgeValues(dataRef, behaviorRef, data = currentDocument()) {
      const dataObject = (data?.data_objects || []).find(item => item.data_ref === dataRef);
      const links = (dataObject?.behavior_links || []).filter(link => link.behavior_ref === behaviorRef);
      const updateLink = links.find(link => link.operation === 'update');
      return {
        operations: links.map(link => link.operation),
        updatedFieldRefs: list(updateLink?.updated_field_refs)
      };
    }

    function openDataEdgeSession(dataRef, behaviorRef) {
      const baseline = dataEdgeValues(dataRef, behaviorRef);
      const isNewRelation = baseline.operations.length === 0;
      const result = editSessionManager.open({
        candidateKey: candidateStateKey(),
        editorKind: 'data-edge-operations',
        entityRef: `${dataRef}:${behaviorRef}`,
        allowedFields: ['operations', 'updatedFieldRefs'],
        baselineFields: baseline,
        patch: {},
        started: isNewRelation,
        canApply: !isNewRelation && (!baseline.operations.includes('update') || baseline.updatedFieldRefs.length > 0)
      });
      if (!result.ok) return false;
      graphSelection = { kind: 'data-edge', dataRef, behaviorRef };
      activeDataRef = dataRef;
      return true;
    }

    function dataEdgeSession(selection = graphSelection) {
      if (selection?.kind !== 'data-edge') return null;
      return editSessionManager.get({
        candidateKey: candidateStateKey(),
        editorKind: 'data-edge-operations',
        entityRef: `${selection.dataRef}:${selection.behaviorRef}`
      });
    }

    function dataEdgeWorkingValues(selection = graphSelection) {
      const baseline = dataEdgeValues(selection?.dataRef, selection?.behaviorRef);
      const session = dataEdgeSession(selection);
      return session ? { ...baseline, ...clone(session.patch) } : baseline;
    }

    function updateDataEdgeCanApply(selection = graphSelection) {
      const values = dataEdgeWorkingValues(selection);
      const canApply = values.operations.length > 0
        && (!values.operations.includes('update') || list(values.updatedFieldRefs).length > 0);
      editSessionManager.setCanApply(canApply);
      return canApply;
    }

    function openDataBehaviorChoiceSession(dataRef) {
      const result = editSessionManager.open({
        candidateKey: candidateStateKey(),
        editorKind: 'data-behavior-choice',
        entityRef: dataRef,
        allowedFields: ['behaviorRef'],
        baselineFields: { behaviorRef: '' },
        patch: { behaviorRef: '' },
        started: true,
        canApply: false
      });
      if (!result.ok) return false;
      graphSelection = { kind: 'data-behavior-choice', dataRef };
      return true;
    }

    function openFlowRelationDraftSession() {
      flowRelationDraft = { stage: 'type', relation_type: '', from_behavior_ref: null, to_behavior_ref: null, condition: '' };
      const result = editSessionManager.open({
        candidateKey: candidateStateKey(),
        editorKind: 'new-flow-relation-wizard',
        entityRef: 'new-flow-relation',
        allowedFields: ['stage', 'relation_type', 'from_behavior_ref', 'to_behavior_ref', 'condition'],
        baselineFields: {},
        patch: flowRelationDraft,
        started: true,
        canApply: false
      });
      if (!result.ok) {
        flowRelationDraft = null;
        return false;
      }
      graphSelection = null;
      return true;
    }

    function syncFlowRelationDraftSession() {
      if (!flowRelationDraft) return;
      editSessionManager.replacePatch(flowRelationDraft, { started: true });
      editSessionManager.setCanApply(Boolean(
        flowRelationDraft.stage === 'confirm'
        && flowRelationDraft.relation_type
        && flowRelationDraft.from_behavior_ref
        && flowRelationDraft.to_behavior_ref
      ));
      refreshUnappliedIndicators();
    }

    function openGuidedCreateSession(editorKind, entityRef, patch, allowedFields = null) {
      const sessionPatch = { ...clone(patch), sourceFingerprint: globalThis.GraphEditorState.fingerprint(currentDocument()) };
      const result = editSessionManager.open({
        candidateKey: candidateStateKey(),
        editorKind,
        entityRef,
        allowedFields: allowedFields || Object.keys(sessionPatch),
        baselineFields: {},
        patch: sessionPatch,
        started: true,
        canApply: false
      });
      if (!result.ok) {
        showStatus('当前还有未应用修改。请先应用或放弃，再新增其他内容。', 'error');
        return false;
      }
      updateGuidedCreateCanApply();
      refreshUnappliedIndicators();
      return true;
    }

    function guidedCreateSession(editorKind, entityRef = null) {
      const session = editSessionManager.get();
      if (!session || session.editorKind !== editorKind || session.candidateKey !== candidateStateKey()) return null;
      return entityRef == null || session.entityRef === entityRef ? session : null;
    }

    function updateGuidedCreateCanApply() {
      const session = editSessionManager.get();
      if (!session) return false;
      const patch = session.patch;
      let canApply = false;
      if (['new-data-behavior-link', 'new-form-behavior-link'].includes(session.editorKind)) {
        canApply = Boolean(text(patch.behaviorRef));
      } else if (session.editorKind === 'new-field-source') {
        const roleReady = Boolean(text(patch.sourceRole));
        canApply = roleReady && (
          (patch.sourceType === 'process_data' && Boolean(text(patch.sourceDataRef)))
          || (patch.sourceType === 'external_system'
            && Boolean(text(patch.sourceSystemName).trim())
            && Boolean(text(patch.sourceDataName).trim()))
        );
      }
      editSessionManager.setCanApply(canApply);
      return canApply;
    }

    function updateGuidedCreatePatch(values, options = {}) {
      const result = editSessionManager.updatePatch(values, { started: true });
      if (!result.ok) return false;
      updateGuidedCreateCanApply();
      refreshUnappliedIndicators();
      if (options.render) render();
      else {
        const session = editSessionManager.get();
        const action = {
          'new-data-behavior-link': 'apply-new-data-behavior-link',
          'new-form-behavior-link': 'apply-new-form-behavior-link',
          'new-field-source': 'apply-new-field-source'
        }[session?.editorKind];
        if (action) workspace.querySelector(`[data-action="${action}"]`)?.toggleAttribute('disabled', !session.canApply);
      }
      return true;
    }

    function findFormItemByRef(documentValue, itemRef) {
      for (const form of documentValue?.forms || []) {
        for (const area of form.areas || []) {
          const item = (area.items || []).find(candidate => candidate.item_ref === itemRef);
          if (item) return { form, area, item };
        }
      }
      return null;
    }

    function applyGuidedCreateSession(expectedKind) {
      const session = guidedCreateSession(expectedKind);
      if (!session || !editSessionManager.canApply(session.candidateKey)) {
        showStatus('当前新增内容尚未完成，请先明确选择所有必填业务信息。', 'error');
        return false;
      }
      if (globalThis.GraphEditorState.fingerprint(currentDocument()) !== session.patch.sourceFingerprint) {
        showStatus('打开新增草稿后当前JSON已经变化。系统没有写入任何内容，请放弃草稿后重新开始。', 'error');
        return false;
      }
      const patch = clone(session.patch);
      const result = runDocumentTransaction(nextDocument => {
        if (expectedKind === 'new-data-behavior-link') {
          const dataObject = (nextDocument.data_objects || []).find(item => item.data_ref === session.entityRef);
          const behavior = (nextDocument.behaviors || []).find(item => item.behavior_ref === patch.behaviorRef && item.node_type === 'action');
          if (!dataObject) throw new Error('目标数据对象已不存在');
          if (!behavior) throw new Error('所选业务行为已不存在或不是实际办理行为');
          dataObject.behavior_links.push({
            link_ref: newRef('data_link'), behavior_ref: behavior.behavior_ref,
            operation: 'pending_confirmation', updated_field_refs: []
          });
        } else if (expectedKind === 'new-form-behavior-link') {
          const form = (nextDocument.forms || []).find(item => item.form_ref === session.entityRef);
          const behavior = (nextDocument.behaviors || []).find(item => item.behavior_ref === patch.behaviorRef && item.node_type === 'action');
          if (!form) throw new Error('目标表单已不存在');
          if (!behavior) throw new Error('所选业务行为已不存在或不是实际办理行为');
          form.behavior_links.push({
            link_ref: newRef('form_link'), behavior_ref: behavior.behavior_ref, operations: [], notes: ''
          });
        } else if (expectedKind === 'new-field-source') {
          const context = findFormItemByRef(nextDocument, session.entityRef);
          if (!context) throw new Error('目标表单字段已不存在');
          const sourceType = patch.sourceType;
          const sourceDataRef = sourceType === 'process_data' ? text(patch.sourceDataRef) : null;
          if (sourceType === 'process_data' && !(nextDocument.data_objects || []).some(item => item.data_ref === sourceDataRef)) {
            throw new Error('所选本流程数据对象已不存在');
          }
          context.item.source_links.push({
            source_link_ref: newRef('field_source'),
            source_type: sourceType,
            source_data_ref: sourceDataRef,
            source_system_name: sourceType === 'external_system' ? text(patch.sourceSystemName).trim() : '',
            source_data_name: sourceType === 'external_system' ? text(patch.sourceDataName).trim() : '',
            source_role: patch.sourceRole
          });
        }
      }, {
        source: expectedKind,
        failureLabel: '新增内容',
        successLabel: '新增内容已应用。执行一次撤销可恢复应用前内容。'
      });
      return result.ok;
    }

    function registerCandidateState(entry, options = {}) {
      if (!entry) return;
      const key = candidateStateKey(entry);
      graphStateManager.register(key, entry.data, { resetHistory: options.resetHistory !== false });
      entry.forceDirty = Boolean(options.forceDirty);
      entry.dirty = entry.forceDirty;
    }

    function refreshCandidateDirty(entry = currentEntry()) {
      if (!entry) return false;
      entry.dirty = Boolean(entry.forceDirty) || graphStateManager.isDirty(candidateStateKey(entry), entry.data);
      return entry.dirty;
    }

    function candidateHasUnappliedChanges(entry) {
      if (!entry) return false;
      const key = candidateStateKey(entry);
      return editSessionManager.isDirty(key)
        || Boolean(entry === currentEntry() && (
          webGridSession?.isDirty()
          || updateFieldsModalIsDirty(key)
        ));
    }

    function hasUnappliedChanges() {
      return candidates.some(candidateHasUnappliedChanges);
    }

    function hasUndownloadedChanges() {
      return candidates.some(item => item.dirty);
    }

    function hasDirtyCandidates() {
      return hasUndownloadedChanges() || hasUnappliedChanges();
    }

    function candidateFileState(entry, hasUnapplied = candidateHasUnappliedChanges(entry)) {
      if (!entry || entry.dirty || hasUnapplied) return null;
      if (entry.lastDownload) return { label: '当前内容已下载', className: 'ready' };
      if (entry.importInfo) return { label: '当前内容与导入文件一致', className: 'imported' };
      return { label: '尚未下载', className: 'pending' };
    }

    function governanceCheckKey(stepId, entry = currentEntry()) {
      return entry ? `${candidateStateKey(entry)}:${stepId}` : '';
    }

    function checkedGovernanceStepIds(entry = currentEntry()) {
      if (!entry) return [];
      const prefix = `${candidateStateKey(entry)}:`;
      return [...checkedGovernanceSteps]
        .filter(key => key.startsWith(prefix))
        .map(key => key.slice(prefix.length));
    }

    function invalidateCurrentChecks(entry = currentEntry()) {
      if (!entry) return;
      const candidateKey = candidateStateKey(entry);
      const queueState = governanceReviewQueueManager.get(candidateKey);
      if (queueState.checkedAtRevision != null) {
        governanceReviewQueueManager.markStale(candidateKey, {
          revision: globalThis.GraphEditorState.fingerprint(entry.data)
        });
      }
      const prefix = `${candidateKey}:`;
      [...checkedGovernanceSteps].forEach(key => {
        if (key.startsWith(prefix)) checkedGovernanceSteps.delete(key);
      });
    }

    function resetWebGridEditor(options = {}) {
      const preserveViewState = options.preserveViewState === true;
      if (preserveViewState) {
        captureVisibleWebGridScroll();
        if (webGridSession) captureAuthoringSelectionContext();
      }
      webGridSession = null;
      webGridIssues = [];
      if (!preserveViewState) {
        webGridSelectedRows = {};
        webGridFilters = {};
        webGridSorts = {};
        webGridRanges = {};
        webGridScrollPositions = {};
      }
    }

    function resetActiveGridTables() {
      activeGridTableByWorkspace = { ...globalThis.AuthoringSelectionContext.DEFAULT_TABLES };
    }

    function resetTransientEditingState(options = {}) {
      editSessionManager.reset();
      graphSelection = null;
      flowRelationDraft = null;
      flowEditorOpen = false;
      resetWebGridEditor();
      skipNextWebGridScrollCapture = true;
      formFieldBatchSessionToken += 1;
      pendingTransitionResolution = null;
      updateFieldsModalState = null;
      updateFieldsError.textContent = '';
      updateFieldsModal.classList.remove('show');
      updateFieldsModal.setAttribute('aria-hidden', 'true');
      formFieldBatchApplying = false;
      formFieldBatchContent.innerHTML = '';
      formFieldBatchError.textContent = '';
      formFieldBatchModal.classList.remove('show');
      formFieldBatchModal.setAttribute('aria-hidden', 'true');
      pendingTransition = null;
      pendingEditModal.classList.remove('show');
      pendingEditModal.setAttribute('aria-hidden', 'true');
      if (options.resetDataMode) activeDataMode = 'flow';
    }

    function refreshUnappliedIndicators() {
      updateCandidateList();
      governanceHeader.innerHTML = renderGovernanceHeader(currentDocument());
    }

    function enableActiveApplyButton() {
      const action = graphSelection?.kind === 'data'
        ? 'apply-data-property'
        : graphSelection?.kind === 'data-edge'
          ? 'apply-data-operations'
          : ['behavior', 'relation'].includes(graphSelection?.kind)
            ? 'apply-flow-property'
            : '';
      if (!action) return;
      const button = workspace.querySelector(`[data-action="${action}"]`);
      if (!button) return;
      const session = graphSelection?.kind === 'data-edge'
        ? dataEdgeSession(graphSelection)
        : ['behavior', 'relation', 'data'].includes(graphSelection?.kind)
          ? entityEditSession(graphSelection.kind, graphSelection.ref)
          : null;
      button.toggleAttribute('disabled', !session || !editSessionManager.isDirty(session.candidateKey) || !editSessionManager.canApply(session.candidateKey));
    }

    function touch() {
      const entry = currentEntry();
      if (!entry) return;
      invalidateCurrentChecks(entry);
      if (activeDataEditingMode !== 'grid') resetWebGridEditor({ preserveViewState: true });
      refreshCandidateDirty(entry);
      updateCandidateList();
      governanceHeader.innerHTML = renderGovernanceHeader(currentDocument());
      workspaceViewSwitch.innerHTML = renderGovernanceSteps();
      refreshVisibleGovernanceCheckUi();
    }

    function setBusy(value, message = '') {
      busy = value;
      document.querySelectorAll('[data-global-action]').forEach(button => {
        button.disabled = value || (button.dataset.requiresDocument === 'true' && !currentDocument());
      });
      if (message) showStatus(message);
    }

    function showStatus(message, kind = '') {
      statusBox.textContent = message;
      statusBox.className = `status show${kind ? ` ${kind}` : ''}`;
    }

    function clearStatus() {
      statusBox.textContent = '';
      statusBox.className = 'status';
    }

    function optionHtml(options, selected) {
      return options.map(option => {
        const value = typeof option === 'string' ? option : option.value;
        const label = typeof option === 'string' ? (option || '请选择') : option.label;
        return `<option value="${escapeAttribute(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function getByPath(pathKey) {
      return pathKey.split('.').reduce((target, part) => target == null ? undefined : target[part], currentDocument());
    }

    function setByPath(pathKey, value) {
      const parts = pathKey.split('.');
      const last = parts.pop();
      const target = parts.reduce((node, part) => node[part], currentDocument());
      target[last] = value;
    }

    function field(pathKey, label, options = {}) {
      const value = getByPath(pathKey);
      const classes = ['field', options.className || ''].filter(Boolean).join(' ');
      const hint = options.hint ? `<span class="hint">${escapeHtml(options.hint)}</span>` : '';
      let control = '';
      if (options.type === 'textarea') {
        control = `<textarea class="${options.tall ? 'tall' : ''}" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" placeholder="${escapeAttribute(options.placeholder || '')}">${escapeHtml(value)}</textarea>`;
      } else if (options.type === 'select') {
        control = `<select data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}">${optionHtml(options.options || [], value == null ? '' : value)}</select>`;
      } else if (options.type === 'date') {
        control = `<input type="date" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}">`;
      } else if (options.type === 'checkbox') {
        control = `<div class="check-row"><label><input type="checkbox" data-bind="${escapeAttribute(pathKey)}" data-kind="boolean"${value ? ' checked' : ''}> ${escapeHtml(options.checkboxLabel || label)}</label></div>`;
      } else {
        control = `<input type="text" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}" placeholder="${escapeAttribute(options.placeholder || '')}">`;
      }
      return `<div class="${classes}"><label>${escapeHtml(label)}</label>${control}${hint}</div>`;
    }

    function formItemTypeField(pathKey, currentValue) {
      const normalizedValue = text(currentValue).trim();
      const knownValue = Boolean(normalizedValue && formItemTypes.includes(normalizedValue));
      const options = [{
        value: '',
        label: formItemTypeLoadState === 'loading' ? '正在读取数据类型' : '请选择数据类型'
      }].concat(formItemTypes.map(value => ({ value, label: value })));
      if (normalizedValue && !knownValue) {
        options.push({
          value: normalizedValue,
          label: formItemTypeLoadState === 'ready'
            ? `${normalizedValue}（当前类型字典未收录）`
            : `${normalizedValue}（保留当前值）`
        });
      }
      const unavailable = formItemTypeLoadState !== 'ready'
        ? '<div class="inline-warning">数据类型字典暂时不可用。3001不会清除已有类型；字典恢复后再选择标准类型。</div>'
        : '';
      const legacyWarning = formItemTypeLoadState === 'ready' && normalizedValue && !knownValue
        ? `<div class="inline-warning">当前导入值“${escapeHtml(normalizedValue)}”未被填写项类型字典收录。3001会保留原值；如需修改，只能改选标准类型。</div>`
        : '';
      return `
        <div class="field">
          <label>${escapeHtml('数据类型')}</label>
          <select
            data-bind="${escapeAttribute(pathKey)}"
            data-kind="text"
            ${formItemTypeLoadState !== 'ready' ? 'disabled' : ''}
          >${optionHtml(options, normalizedValue)}</select>
          <span class="hint">请从标准类型中选择，不允许自由填写。</span>
          ${legacyWarning}
          ${unavailable}
        </div>`;
    }

    function formDesignStateMeta(value) {
      if (value === 'current_state') return { label: '现状', className: 'current' };
      if (value === 'proposed_design') return { label: '拟设计', className: 'proposed' };
      return { label: '待确认', className: 'unspecified' };
    }

    function formDesignStateBadge(value) {
      const meta = formDesignStateMeta(value);
      return `<span class="form-state-badge ${meta.className}">${meta.label}</span>`;
    }

    function formItemAssignmentField(formIndex, areaIndex, itemIndex, item) {
      const form = currentDocument().forms[formIndex];
      const area = form.areas[areaIndex];
      let detailNumber = 0;
      const detailOptions = form.areas
        .filter(candidate => candidate.area_type === '明细清单')
        .map(candidate => {
          detailNumber += 1;
          return {
            value: candidate.area_ref,
            label: `${candidate.area_title || `明细表${detailNumber}`}`
          };
        });
      const selected = area.area_type === '基本信息'
        ? 'main'
        : area.area_type === '明细清单'
          ? area.area_ref
          : 'unassigned';
      const options = [
        { value: 'unassigned', label: '待确认' },
        { value: 'main', label: '主表字段' },
        ...detailOptions,
        { value: '__new_detail__', label: '新建明细表（需填写名称）' }
      ];
      const focusKey = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.assignment`;
      return `
        <div class="field">
          <label>字段归属</label>
          <select
            data-form-item-assignment
            data-form-index="${formIndex}"
            data-item-ref="${escapeAttribute(item.item_ref)}"
            data-focus-key="${escapeAttribute(focusKey)}"
          >${optionHtml(options, selected)}</select>
          <span class="hint">只按纸质表单位置选择，不根据数据类型推断。</span>
        </div>`;
    }

    function behaviorSelect(pathKey, label, options = {}) {
      const selectedRef = text(getByPath(pathKey)).trim();
      const values = [{ value: '', label: options.blankLabel || '暂不指定' }]
        .concat((currentDocument()?.behaviors || [])
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => item.behavior_ref !== options.excludeRef)
          .filter(({ item }) => !options.localOnly || !externalActorDepartment(item.current_actor_role) || item.behavior_ref === selectedRef)
          .map(({ item, index }) => ({
            value: item.behavior_ref,
            label: `${index + 1}. ${item.behavior_name || '未命名行为'}${options.localOnly && externalActorDepartment(item.current_actor_role) ? '（历史跨部门关联，请调整）' : ''}`
          })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function dataSelect(pathKey, label, options = {}) {
      const values = [{ value: '', label: '暂不指定' }]
        .concat((currentDocument()?.data_objects || []).map((item, index) => ({
          value: item.data_ref,
          label: `${index + 1}. ${item.data_name || '未命名数据'}`
        })));
