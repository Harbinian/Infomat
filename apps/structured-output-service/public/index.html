<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3001 单流程治理编制工具</title>
  <style>
    :root {
      --paper: #f3ead7;
      --paper-deep: #e9ddc5;
      --card: rgba(255, 252, 243, 0.94);
      --ink: #2f302b;
      --muted: #6d6a60;
      --line: #cbbd9e;
      --red: #8c3f33;
      --red-soft: #f2dfd8;
      --sage: #66745f;
      --sage-soft: #dfe7db;
      --blue: #5d6f78;
      --gold: #9b783d;
      --shadow: 0 12px 32px rgba(76, 58, 33, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(140, 63, 51, 0.08), transparent 28rem),
        linear-gradient(145deg, #efe4cc, var(--paper) 45%, #eee4d2);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
      min-width: 1280px;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .page {
      width: 100%;
      padding: 16px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .task-sidebar {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: calc(100vh - 32px);
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(250, 244, 230, 0.9);
      box-shadow: var(--shadow);
    }

    .sidebar-scroll-area {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
    }

    .main-column { min-width: 0; }

    .sidebar-brand h1 {
      margin: 7px 0 0;
      font-family: "SimSun", "STSong", serif;
      font-size: 25px;
      line-height: 1.3;
    }

    .eyebrow {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tool-badge {
      display: inline-flex;
      margin-top: 9px;
      padding: 4px 8px;
      border: 1px solid #b9aa8b;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.76);
      font-size: 12px;
      font-weight: 700;
    }

    .notice {
      margin-top: 16px;
      padding: 12px 15px;
      border-left: 4px solid var(--sage);
      border-radius: 0 10px 10px 0;
      background: var(--sage-soft);
      color: #3e4c3b;
      font-weight: 700;
    }

    .boundary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .sidebar-section {
      display: grid;
      gap: 9px;
      padding-top: 13px;
      border-top: 1px solid rgba(203, 189, 158, 0.72);
    }

    .sidebar-section-title {
      color: #584f40;
      font-size: 13px;
      font-weight: 700;
    }

    .sidebar-actions {
      display: grid;
      gap: 8px;
    }

    .sidebar-actions .button { width: 100%; }

    .button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fffaf0;
      font-weight: 700;
    }

    .button:hover { border-color: var(--gold); }
    .button.primary { color: #fff; border-color: var(--red); background: var(--red); }
    .button.secondary { color: #fff; border-color: var(--sage); background: var(--sage); }
    .button.danger { color: var(--red); border-color: #b98578; background: var(--red-soft); }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

    .status {
      display: none;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.show { display: block; }
    .status.error { color: #7b2f27; border-color: #c18a7d; background: #f7e5df; }
    .status.success { color: #40543b; border-color: #91a38a; background: #e8efe4; }

    .candidate-list {
      display: grid;
      gap: 7px;
      max-height: min(32vh, 300px);
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
    }

    .candidate-item {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: rgba(255, 252, 243, 0.78);
      text-align: left;
    }

    .candidate-item:hover { border-color: var(--gold); }
    .candidate-item.active {
      border-color: var(--red);
      background: #fff6ed;
      box-shadow: inset 3px 0 0 var(--red);
    }

    .candidate-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: #655b4a;
      background: var(--paper-deep);
      font-size: 12px;
      font-weight: 700;
    }

    .candidate-item.active .candidate-number { color: #fff; background: var(--red); }
    .candidate-copy { min-width: 0; }
    .candidate-name {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-dirty {
      display: block;
      margin-top: 3px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
    }

    .candidate-empty {
      padding: 12px;
      border: 1px dashed #bcae90;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.48);
      font-size: 13px;
      line-height: 1.55;
    }

    .candidate-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .workspace { min-width: 0; }
    .workspace-tabs-shell {
      margin: 0;
    }

    .workspace-tabs {
      display: grid;
      gap: 7px;
    }

    .workspace-tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.78);
      font-weight: 700;
      text-align: left;
    }

    .workspace-tab:hover { color: var(--ink); background: var(--paper-deep); }
    .workspace-tab.active { color: #fff; background: var(--red); }
    .tab-status {
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .workspace-tab:not(.active) .tab-status.ready { color: #40543b; background: var(--sage-soft); }
    .workspace-tab:not(.active) .tab-status.warning { color: #7b2f27; background: var(--red-soft); }
    .workspace-tab:not(.active) .tab-status.waiting { color: var(--muted); background: #f4f0e7; }
    .tab-panel[hidden] { display: none; }

    .editor-navigation,
    .process-navigation {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.88);
      scrollbar-width: thin;
    }

    .editor-section-tab,
    .process-section-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    .editor-section-tab:hover,
    .process-section-tab:hover {
      color: var(--ink);
      border-color: var(--line);
      background: var(--paper-deep);
    }

    .editor-section-tab.active {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }

    .process-section-tab.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .preview-guidance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding: 9px 12px;
      border: 1px solid #b7c2b0;
      border-left: 4px solid var(--sage);
      border-radius: 10px;
      background: var(--sage-soft);
    }

    .preview-guidance-copy {
      display: flex;
      align-items: baseline;
      gap: 7px;
      min-width: 0;
    }

    .preview-guidance strong { flex: 0 0 auto; color: #40543b; font-size: 13px; }
    .preview-guidance p {
      margin: 0;
      overflow: hidden;
      color: #4d5b49;
      font-size: 13px;
      line-height: 1.5;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .preview-ready-callout {
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      gap: 8px;
      padding-left: 12px;
      border-left: 1px solid #aab7a4;
    }

    .preview-ready-callout[hidden] { display: none; }
    .preview-ready-callout span { color: #2f472b; font-size: 12px; font-weight: 700; }

    .diagram-section { overflow: visible; }
    body.diagram-overlay-open { overflow: hidden; }
    .diagram-section.diagram-expanded {
      position: fixed;
      inset: 12px;
      z-index: 90;
      margin: 0;
      overflow: auto;
      background: #fffaf0;
      box-shadow: 0 26px 80px rgba(37, 31, 23, 0.34);
    }

    .diagram-section.diagram-expanded .diagram-canvas {
      height: max(520px, calc(100vh - 350px));
    }

    .diagram-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .diagram-toolbar h2 { margin: 0 0 5px; font-family: "SimSun", serif; font-size: 22px; }
    .diagram-toolbar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .diagram-legend-shell {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid #bcae90;
      border-radius: 10px;
      background: #fbf5e9;
    }

    .diagram-legend-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .diagram-legend-list {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 10px;
    }

    .diagram-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #3f403b;
      font-size: 12px;
      line-height: 1.35;
    }

    .diagram-legend-copy { min-width: 0; }
    .diagram-legend-copy strong, .diagram-legend-copy small { display: block; }
    .diagram-legend-copy strong { color: #35362f; font-size: 12px; }
    .diagram-legend-copy small { margin-top: 2px; color: #6b685f; font-size: 10px; }
    .legend-symbol {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 24px;
      border: 2px solid #8c3f33;
      color: #7b2f27;
      background: #fffaf0;
      font-size: 15px;
      font-weight: 800;
    }

    .legend-symbol.action { border-radius: 7px; }
    .legend-symbol.decision, .legend-symbol.parallel {
      width: 23px;
      height: 23px;
      margin: 0 6px;
      transform: rotate(45deg);
      border-radius: 1px;
      background: #f5e5df;
    }

    .legend-symbol.parallel {
      border-color: #8a6a30;
      color: #6f5223;
      background: #f3e7ca;
    }

    .legend-symbol.decision > span, .legend-symbol.parallel > span { transform: rotate(-45deg); }
    .legend-symbol.call {
      border-width: 4px;
      border-color: #52665a;
      border-radius: 7px;
      background: #e5eadf;
    }

    .legend-symbol.pending {
      border-style: dashed;
      border-color: #746f64;
      background: #f4f0e7;
    }

    .legend-symbol.flow, .legend-symbol.handoff {
      width: 42px;
      height: 18px;
      border: 0;
      background: transparent;
    }

    .legend-symbol.flow::before, .legend-symbol.handoff::before {
      content: "";
      position: absolute;
      left: 1px;
      right: 8px;
      top: 8px;
      border-top: 2px solid #5b625d;
    }

    .legend-symbol.flow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 4px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #5b625d;
    }

    .legend-symbol.handoff::before { border-top: 2px dashed #526973; }
    .legend-symbol.handoff::after {
      content: "";
      position: absolute;
      right: 1px;
      top: 4px;
      width: 8px;
      height: 8px;
      border-top: 2px solid #526973;
      border-right: 2px solid #526973;
      transform: rotate(45deg);
    }

    .diagram-reading-tip {
      margin: 10px 0 0;
      padding-top: 9px;
      border-top: 1px solid rgba(188, 174, 144, 0.7);
      color: #514834;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
    }

    .diagram-legend-example {
      margin-top: 10px;
      padding: 11px;
      border: 1px dashed #bcae90;
      border-radius: 8px;
      background: #fffdf8;
    }

    .diagram-legend-example[hidden] { display: none; }
    .diagram-legend-example > p { margin: 0 0 9px; color: #666158; font-size: 11px; }
    .legend-example-flow {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) 48px minmax(110px, 1fr) 58px minmax(130px, 1.25fr);
      align-items: center;
      gap: 8px;
      max-width: 760px;
    }

    .legend-example-step { min-width: 0; text-align: center; }
    .legend-example-department {
      display: block;
      margin-bottom: 4px;
      color: #6f695d;
      font-size: 10px;
      font-weight: 700;
    }

    .legend-example-node {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 6px 9px;
      border: 2px solid #8c3f33;
      border-radius: 7px;
      color: #3c3d37;
      background: #fffaf0;
      font-size: 11px;
      font-weight: 700;
    }

    .legend-example-node.decision {
      width: 64px;
      height: 64px;
      min-height: 0;
      margin: 0 auto;
      padding: 7px;
      border-radius: 1px;
      transform: rotate(45deg);
      background: #f5e5df;
    }

    .legend-example-node.decision span { transform: rotate(-45deg); }
    .legend-example-node.handoff {
      border-style: dashed;
      border-color: #526973;
      background: #e7edef;
    }

    .legend-example-arrow {
      position: relative;
      height: 22px;
    }

    .legend-example-arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 8px;
      top: 10px;
      border-top: 2px solid #5b625d;
    }

    .legend-example-arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 6px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #5b625d;
    }

    .legend-example-arrow.message::before { border-top: 2px dashed #526973; }
    .legend-example-arrow.message::after {
      top: 6px;
      width: 8px;
      height: 8px;
      border: 0;
      border-top: 2px solid #526973;
      border-right: 2px solid #526973;
      transform: rotate(45deg);
    }

    .diagram-notice {
      margin-bottom: 12px;
      padding: 10px 13px;
      border: 1px solid #bcae90;
      border-radius: 9px;
      color: #514834;
      background: #f8efd9;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .diagram-notice.warning {
      color: #7b2f27;
      border-color: #c18a7d;
      background: #f7e5df;
    }

    .diagram-canvas {
      width: 100%;
      height: clamp(360px, 50vh, 520px);
      border: 1px solid #bcae90;
      border-radius: 12px;
      background:
        linear-gradient(rgba(203, 189, 158, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(203, 189, 158, 0.16) 1px, transparent 1px),
        #fffdf8;
      background-size: 24px 24px;
    }

    .diagram-empty {
      padding: 42px 22px;
      border: 1px dashed #bcae90;
      border-radius: 12px;
      text-align: center;
      background: rgba(255, 253, 248, 0.78);
    }

    .diagram-empty h2 { margin: 0 0 9px; font-family: "SimSun", serif; }
    .diagram-empty p { margin: 0 auto 17px; max-width: 700px; color: var(--muted); line-height: 1.75; }
    .diagram-failure {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #c18a7d;
      border-radius: 9px;
      color: #7b2f27;
      background: #f7e5df;
      line-height: 1.6;
    }

    .diagram-failure.show { display: block; }
    .diagram-warning-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.82);
    }

    .diagram-warning-list strong { color: #7b2f27; }
    .diagram-warning-button {
      padding: 8px 10px;
      border: 1px solid #d3b2aa;
      border-radius: 7px;
      color: #6f342c;
      background: #fff8f4;
      text-align: left;
      line-height: 1.55;
    }

    .diagram-warning-button:hover { border-color: var(--red); }
    .item-card.focused-card,
    .section.focused-card {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(140, 63, 51, 0.14);
      animation: focus-card-pulse 1.1s ease-out 1;
    }

    input.focused-control,
    select.focused-control,
    textarea.focused-control {
      border-color: #b42318 !important;
      background: #fff4f2 !important;
      outline: none;
      animation: focus-control-breathe 0.9s ease-in-out 3;
    }

    @keyframes focus-card-pulse {
      0% { transform: translateY(0); }
      40% { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }

    @keyframes focus-control-breathe {
      0%, 100% {
        box-shadow: 0 0 0 2px rgba(180, 35, 24, 0.16);
      }
      50% {
        box-shadow:
          0 0 0 7px rgba(180, 35, 24, 0.28),
          0 0 18px rgba(180, 35, 24, 0.24);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input.focused-control,
      select.focused-control,
      textarea.focused-control {
        animation: none;
        box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.24);
      }
    }
    .empty {
      padding: 64px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .empty h2 { margin: 0 0 10px; font-family: "SimSun", serif; }
    .empty p { margin: 0 auto 18px; max-width: 720px; color: var(--muted); line-height: 1.8; }

    .section {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 22px rgba(76, 58, 33, 0.06);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 20px;
      border-bottom: 1px solid rgba(203, 189, 158, 0.7);
      background: rgba(237, 226, 203, 0.58);
    }

    .section-head h2 { margin: 0; font-family: "SimSun", serif; font-size: 21px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .section-body { padding: 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .field { grid-column: span 4; min-width: 0; }
    .field.half { grid-column: span 6; }
    .field.wide { grid-column: 1 / -1; }
    .field label, .field-label {
      display: block;
      margin-bottom: 6px;
      color: #504d45;
      font-size: 13px;
      font-weight: 700;
    }

    .field .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .relation-guidance {
      margin-bottom: 16px;
      padding: 15px;
      border: 1px solid #c9b98f;
      border-radius: 11px;
      background: rgba(249, 244, 231, 0.9);
    }

    .relation-guidance h3 {
      margin: 0;
      color: #514834;
      font-family: "SimSun", serif;
      font-size: 17px;
    }

    .relation-guidance-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 11px;
    }

    .relation-guidance-card {
      padding: 11px 12px;
      border: 1px solid #d5c7aa;
      border-radius: 9px;
      background: #fffdf7;
    }

    .relation-guidance-card strong {
      display: block;

      line-height: 1.6;
    }

      display: grid;
      grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);

    .record-selector,

    .selector-button,

      font-weight: 700;

    .form-field-table .check-row { min-height: 38px; align-items: center; }
    .form-field-table .inline-warning { margin-top: 5px; padding: 7px; font-size: 12px; }
    .form-field-number { color: #6f624f; text-align: center; font-weight: 700; }
    .form-field-actions { display: flex; justify-content: center; gap: 4px; }
    .form-field-actions .button { min-width: 34px; padding: 6px 8px; }

    .form-field-group-row th {
      padding: 10px 12px;
      color: #514834;
      background: rgba(237, 226, 203, 0.72);
      text-align: left;
    }

    .form-field-group-row.unassigned th { background: #fff0e8; }
    .form-field-group-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .form-field-group-title { display: flex; flex: 1; align-items: center; gap: 12px; }
    .form-field-group-title .field {
      display: grid;
      grid-template-columns: auto minmax(180px, 360px);
      align-items: center;
      gap: 8px;
    }
    .form-field-group-title .field > label { margin: 0; }
    .form-field-group-title .field > input { min-width: 180px; }
    .form-field-group-empty td { padding: 14px; color: var(--muted); text-align: center; }

    .form-primary-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .structure-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
      padding: 10px;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.82);
    }

    .structure-button {
      width: auto;
      max-width: 100%;
    }

    .form-structure-warning,
    .export-warning-list {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #d3b2aa;
      border-radius: 9px;
      color: #6f342c;
      background: #fff4ef;
      line-height: 1.65;
    }

    .export-warning-list ol {
      margin: 8px 0 0;
      padding-left: 22px;
    }

    .export-warning-list li + li {
      margin-top: 7px;
    }

    .export-warning-button {
      width: 100%;
      cursor: pointer;
      text-align: left;
      white-space: normal;
      overflow-wrap: anywhere;
    }

    .warning-fact,
    .warning-suggestion {
      display: block;
    }

    .warning-suggestion {
      margin-top: 3px;
      color: var(--ink);
    }

    .warning-suggestion + .warning-suggestion {
      margin-top: 2px;
    }

    .next-stage-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin: 16px 0;
    }

    .next-stage-card {
      min-width: 0;
      padding: 16px 17px;
      border: 1px solid var(--line);
      border-radius: 12px;
      line-height: 1.75;
    }

    .next-stage-card.next {
      border-color: #aebeaa;
      background: rgba(223, 231, 219, 0.72);
    }

    .next-stage-card.future {
      border-color: #c8b179;
      background: rgba(246, 235, 207, 0.78);
    }

    .next-stage-badge {
      display: inline-flex;
      margin-bottom: 9px;
      padding: 2px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .next-stage-card.next .next-stage-badge { color: #40543b; }
    .next-stage-card.future .next-stage-badge { color: #7a5c24; }

    .next-stage-card h3 {
      margin: 0 0 7px;
      font-family: "SimSun", "STSong", serif;
      font-size: 18px;
    }

    .next-stage-card p {
      margin: 0;
      color: #514f47;
      font-size: 13px;
    }

    .score-panel {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid #c8b78f;
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255, 253, 247, 0.98), rgba(242, 233, 213, 0.9));
      box-shadow: 0 10px 28px rgba(76, 58, 33, 0.08);
    }

    .score-panel-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .score-panel-head h3 {
      margin: 0 0 5px;
      font-family: "SimSun", "STSong", serif;
      font-size: 20px;
    }

    .score-panel-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .score-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .score-summary-card {
      min-width: 0;
      padding: 15px;
      border: 1px solid #d4c6a8;
      border-radius: 11px;
      background: rgba(255, 253, 247, 0.9);
    }

    .score-summary-card.primary {
      border-color: #b8975e;
      background: #fff8e8;
    }

    .score-summary-label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .score-summary-value {
      display: block;
      color: #3c382d;
      font-family: "SimSun", "STSong", serif;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 700;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }

    .score-summary-card.primary .score-summary-value { color: var(--red); }
    .score-grade-A { color: #356044; }
    .score-grade-B { color: #536a45; }
    .score-grade-C { color: #886423; }
    .score-grade-D { color: var(--red); }

    .score-summary-note {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .score-dimension-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 12px;
    }

    .score-dimension {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 12px;
      padding: 10px 12px;
      border: 1px solid #ddd0b7;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.56);

    .score-dimension strong { font-size: 13px; }
    .score-dimension span { color: var(--red); font-weight: 700; }
    .score-dimension small {
      grid-column: 1 / -1;
      color: var(--muted);
      line-height: 1.5;

    .score-blocker,
    .score-unavailable {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      line-height: 1.65;
    }

    .score-blocker {
      border: 1px solid #d3a69c;
      color: #733128;
      background: #fff0eb;
    }

    .score-unavailable {
      border: 1px solid #c8b98e;
      color: #5e502c;
      background: #fff8df;
    }

    .score-issue-list,
    .score-preview-list {
      margin-top: 14px;
      padding: 12px 14px;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.78);
    }

    .score-issue-list summary,
    .score-preview-list summary,
    .score-standard summary {
      cursor: pointer;
      font-weight: 700;
    }

    .score-issue-list ol,
    .score-preview-list ol {
      margin: 10px 0 0;
      padding-left: 22px;
    }

    .score-issue-list li + li,
    .score-preview-list li + li {
      margin-top: 9px;
    }

    .score-issue-line {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .score-issue-category {
      flex: 0 0 auto;
      padding: 2px 7px;
      border-radius: 999px;
      color: #fff;
      background: var(--blue);
      font-size: 12px;
      font-weight: 700;
    }

    .score-issue-effect {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .score-standard {
      margin-top: 14px;
      padding: 12px 14px;
      border-left: 4px solid var(--gold);
      border-radius: 0 10px 10px 0;
      background: rgba(250, 242, 221, 0.88);
    }

    .score-standard-body {
      margin-top: 12px;
      color: #4d483c;
      line-height: 1.7;
    }

    .score-table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    .score-standard table {
      width: 100%;
      min-width: 620px;
      margin: 8px 0 14px;
      border-collapse: collapse;
      background: rgba(255, 253, 247, 0.8);
    }

    .score-standard th,
    .score-standard td {
      padding: 8px 10px;
      border: 1px solid #d8c9a9;
      text-align: left;
      vertical-align: top;
    }

    .score-standard th {
      color: #514630;
      background: #eee1c5;
    }

    .score-standard ul {
      margin: 8px 0 0;
      padding-left: 22px;
    }

    .check-row, .check-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 10px 12px;
      border: 1px solid #d4c7ad;
      border-radius: 8px;
      background: #fffdf8;
    }

    .check-row label, .check-list label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 13px;
      font-weight: 400;
    }

    .nested {
      margin-top: 14px;
      padding: 14px;
      border-left: 4px solid var(--blue);

    .linked-handoff-list {
      display: grid;
      gap: 12px;

    }

    .linked-handoff-card {

      border: 1px solid #b8c4c6;
      border-radius: 9px;
      background: rgba(255, 253, 247, 0.86);

    .linked-handoff-card .item-title { margin-bottom: 12px; }

    .empty-list {
      padding: 22px;
      border: 1px dashed #bcae90;
      border-radius: 9px;
      color: var(--muted);
      text-align: center;
    }

    .footer-note {
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(250, 244, 230, 0.75);
      font-size: 12px;
      line-height: 1.6;
    }

    .sidebar-completion {

      padding-top: 8px;
      border-top: 1px dashed #c9aa9f;
    }

    .desktop-width-notice {

      padding: 10px 13px;

      color: #654a2f;
      background: #fff2d8;
      font-size: 13px;
      line-height: 1.55;
    }

    .modal-backdrop {

      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(47, 48, 43, 0.52);

    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(560px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffaf0;
      box-shadow: 0 24px 70px rgba(30, 27, 21, 0.28);
    }

    .modal.merge-modal {
      width: min(820px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .modal.impact-modal {
      width: min(720px, 100%);
      max-height: calc(100vh - 40px);
      overflow-y: auto;
    }

    .merge-summary,
    .merge-conflicts,
    .handoff-summary-list {
      display: grid;
      gap: 10px;
    }

    .merge-summary,
    .merge-conflicts {
      margin-top: 14px;
    }

    .merge-summary-item,
    .handoff-summary-card {
      padding: 12px;
      border: 1px solid #d5c7aa;
      border-radius: 9px;
      background: rgba(255, 253, 247, 0.82);

    }

      display: grid;
      gap: 6px;

      border: 1px solid #d3b2aa;
      border-radius: 8px;
      background: #fff3ee;

</head>
<body>
  <div class="page">
    <div class="app-shell">
      <aside class="task-sidebar" id="taskSidebar" aria-label="3001任务栏">
        <div class="sidebar-scroll-area">
          <header class="sidebar-brand">
            <div class="eyebrow">Infomat · 3001</div>
            <h1>单流程治理编制工具</h1>
            <span class="tool-badge">无状态临时工具</span>
          </header>

          <section class="sidebar-section" aria-labelledby="startActionsTitle">
            <div class="sidebar-section-title" id="startActionsTitle">开始</div>
            <div class="sidebar-actions">
              <button class="button primary" id="newProcessButton">新建流程</button>
              <button class="button" id="importJsonButton">导入结构化文件</button>
            </div>
          </section>

          <section class="sidebar-section" aria-labelledby="candidateListTitle">
            <div class="sidebar-section-title" id="candidateListTitle">当前流程</div>
            <div class="candidate-list" id="candidateList" role="listbox" aria-label="本次打开的流程">
              <div class="candidate-empty">尚未创建或导入流程。</div>
            </div>
            <p class="candidate-note" id="candidateNote">新建流程或导入结构化文件后，可以在这里切换当前流程。</p>
          </section>

          <section class="sidebar-section" aria-labelledby="workspaceViewTitle">
            <div class="sidebar-section-title" id="workspaceViewTitle">查看方式</div>
            <div id="workspaceViewSwitch"></div>
          </section>

          <div class="status" id="statusBox" role="status" aria-live="polite"></div>
          <input id="jsonInput" type="file" accept=".json,application/json" hidden>
        </div>

        <div class="sidebar-completion">
          <button class="button secondary" id="exportButton" disabled>导出当前流程</button>
          <div class="sidebar-danger-zone">
            <button class="button danger" id="clearButton" disabled>清空当前页面</button>
          </div>
          <div class="footer-note">
            用户主动导出是唯一保存方式。页面刷新或关闭后，本次内容无法恢复；导出的草稿仍会标注“未审核”。
          </div>
        </div>
      </aside>

      <div class="main-column">
        <div class="desktop-width-notice" id="desktopWidthNotice" role="note">
          请使用宽度不低于1280px的桌面窗口。当前窗口不会自动改为移动版，可以横向滚动继续查看。
        </div>
        <main class="workspace" id="workspace"></main>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="unsavedModal" aria-hidden="true">
