        ];
        if (!supported.includes(parsed.schema_version)) {
          throw new Error(`不支持的结构化文件版本：${parsed.schema_version || '未提供'}`);
        }
        const needsCandidateFieldUpgrade = globalThis.ProcessGovernanceMigration.needsDataFieldUpgrade(parsed);
        const sourceValidation = await validateGraphDocument(parsed, needsCandidateFieldUpgrade
          ? { validationProfile: 'early-v7-data-fields' }
          : {});
        const sourceClassification = globalThis.ImportCompatibility.classifyPostMigrationValidation(sourceValidation);
        const sourceCanEnterRelationshipRepair = parsed.schema_version === EXPECTED_EXPORT_SCHEMA_VERSION
          && sourceClassification.allowed;
        if (!sourceValidation.valid && !sourceCanEnterRelationshipRepair) {
          const firstError = sourceValidation.errors?.[0];
          throw new Error(firstError ? `${validationErrorLocation(firstError)}：${firstError.message}` : '源文件未通过结构与本地引用检查');
        }
        const migratedDocuments = globalThis.ProcessGovernanceMigration.migrateDocument(parsed, {
          fileName: file.name,
          fileSha256,
          departments: DEPARTMENTS
        });
        const targetValidations = await Promise.all(migratedDocuments.map(validateGraphDocument));
        const targetBatch = globalThis.ImportCompatibility.classifyPostMigrationBatch(targetValidations);
        const failedTargetIndex = targetBatch.failedIndex;
        if (failedTargetIndex >= 0) {
          const failedTarget = targetValidations[failedTargetIndex];
          const firstError = failedTarget.errors?.[0];
          throw new Error(firstError ? `${validationErrorLocation(firstError)}：${firstError.message}` : '迁移副本未通过v7结构校验');
        }
        if (!targetBatch.allowed) throw new Error('迁移没有生成可安装的流程候选');
        const repairableRelationshipErrorCount = targetBatch.repairableErrorCount;
        const migrated = parsed.schema_version !== EXPECTED_EXPORT_SCHEMA_VERSION
          || needsCandidateFieldUpgrade
          || repairableRelationshipErrorCount > 0;
        const nextCandidates = migratedDocuments.map(data => ({
          data: clone(data),
          dirty: migrated,
          forceDirty: migrated,
          origin: parsed.schema_version,
          importInfo: {
            fileName: file.name,
            sourceVersion: parsed.schema_version,
            sha256: fileSha256,
            candidateCount: migratedDocuments.length
          },
          governanceStep: migrated || migratedDocuments.length > 1 ? 'start' : 'boundary',
          stepView: migrated || migratedDocuments.length > 1 ? 'overview' : 'basic'
        }));
        destroyDiagram();
        destroyDataDiagram();
        graphStateManager.clear();
        checkedGovernanceSteps.clear();
        authoringSelectionContextManager.clear();
        governanceReviewQueueManager.clear();
        resetTransientEditingState({ resetDataMode: true });
        resetActiveGridTables();
        activeDataEditingMode = 'guided';
        activeGridWorkspace = 'data';
        advancedLifecycleMode = false;
        candidates = nextCandidates;
        candidates.forEach(entry => registerCandidateState(entry, { forceDirty: migrated }));
        currentIndex = 0;
        selectInitialTabAfterImport();
        render();
        showStatus(
          repairableRelationshipErrorCount > 0
            ? `文件已导入当前页面，保留${repairableRelationshipErrorCount}项历史控制节点关系。请逐项改到实际办理业务的行为；全部处理前不能下载。`
            : candidates.length > 1
            ? `历史文件包含 ${candidates.length} 条流程，已在当前页面显示为候选。每条流程必须单独下载。`
            : migrated
              ? '历史结构化文件已导入当前页面，当前内容标记为未下载。'
              : 'v7结构化文件已导入当前页面。',
          'success'
        );
      } catch (error) {
        showStatus(`结构化文件导入失败：${error.message}。当前草稿、图状态和撤销记录保持不变。`, 'error');
      } finally {
        setBusy(false);
        jsonInput.value = '';
      }
    }

    jsonInput.addEventListener('change', () => {
      const file = jsonInput.files?.[0];
      if (file) importJson(file);
    });

    function switchCandidate(nextIndex, options = {}) {
      if (!Number.isInteger(nextIndex) || !candidates[nextIndex] || nextIndex === currentIndex) return;
      if (!options.skipPendingGuard && requestTransition(
        '切换候选流程',
        () => switchCandidate(nextIndex, { ...options, skipPendingGuard: true }),
        { invoker: options.invoker, cancelAction: options.cancelAction }
      )) return;
      captureGraphViewport();
      captureAuthoringSelectionContext();
      const current = currentEntry();
      if (current) {
        current.governanceStep = activeGovernanceStep;
        current.stepView = activeStepView;
      }
      resetTransientEditingState({ resetDataMode: true });
      currentIndex = nextIndex;
      advancedLifecycleMode = false;
      selectInitialTabAfterImport();
      restoreAuthoringSelectionContext();
      render();
      restoreActiveWebGridFocusAfterRender();
    }

    candidateList.addEventListener('click', event => {
      const button = event.target.closest('[data-candidate-index]');
      if (!button) return;
      const nextIndex = Number(button.dataset.candidateIndex);
      switchCandidate(nextIndex, { invoker: button });
    });

    governanceHeader.addEventListener('change', event => {
      const select = event.target.closest('[data-governance-candidate]');
      if (select) switchCandidate(Number(select.value), {
        invoker: select,
        cancelAction: () => {
          if (select.isConnected) select.value = String(currentIndex);
          else render();
        }
      });
    });

    workspaceViewSwitch.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    governanceHeader.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    governanceDrawer.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (button) handleAction(button.dataset.action, button);
      if (event.target === governanceDrawer) handleAction('close-governance-drawer', governanceDrawer);
    });

    workspace.addEventListener('toggle', event => {
      if (!event.target.matches('.node-combination-guide')) return;
      legendPatternGuideExpanded = event.target.open;
      if (legendPatternGuideExpanded) {
        requestAnimationFrame(mountReviewPatternDiagrams);
        return;
      }
      expandedReviewPatternId = '';
      destroyReviewPatternDiagrams();
      document.body.classList.toggle('diagram-overlay-open', diagramExpanded);
    }, true);

    workspace.addEventListener('input', event => {
      const editSessionField = event.target.closest('[data-edit-session-field]');
      if (editSessionField) {
        const key = editSessionField.dataset.editSessionField;
        const values = { [key]: key === 'sourceDataRef' ? nullable(editSessionField.value) : editSessionField.value };
        if (key === 'sourceType') {
          if (editSessionField.value === 'external_system') values.sourceDataRef = null;
          if (editSessionField.value === 'process_data') {
            values.sourceSystemName = '';
            values.sourceDataName = '';
          }
        }
        updateGuidedCreatePatch(values, { render: editSessionField.matches('select') });
        return;
      }
      if (event.target.matches('[data-grid-search]')) {
        applyNativeGridFilter(event.target.dataset.gridSearch, event.target.value);
        return;
      }
      if (event.target.matches('[data-grid-cell]')) {
        updateNativeGridCell(event.target);
        return;
      }
      const graphProperty = event.target.closest('[data-graph-property]');
      const graphPropertySession = graphProperty && ['behavior', 'relation'].includes(graphSelection?.kind)
        ? entityEditSession(graphSelection.kind, graphSelection.ref)
        : null;
      if (graphProperty && graphPropertySession) {
        const key = graphProperty.dataset.graphProperty;
        const value = graphProperty.type === 'checkbox'
          ? graphProperty.checked
          : key === 'timing' || key === 'actor_department_data_ref'
            ? nullable(graphProperty.value)
            : graphProperty.value;
        editSessionManager.updatePatch({ [key]: value });
        clearStatus();
        refreshUnappliedIndicators();
        enableActiveApplyButton();
        return;
      }
      const dataProperty = event.target.closest('[data-graph-data-property]');
      if (dataProperty && graphSelection?.kind === 'data' && entityEditSession('data', graphSelection.ref)) {
        editSessionManager.updatePatch({ [dataProperty.dataset.graphDataProperty]: dataProperty.value });
        clearStatus();
        refreshUnappliedIndicators();
        enableActiveApplyButton();
        return;
      }
      if (event.target.matches('[data-graph-relation-condition]') && flowRelationDraft) {
        flowRelationDraft.condition = event.target.value;
        syncFlowRelationDraftSession();
        refreshUnappliedIndicators();
        return;
      }
      const target = event.target.closest('[data-bind]');
      if (!target || !currentDocument()) return;
      if (target.dataset.bind === 'process.owning_department') return;
      const dataOperationMatch = target.dataset.bind.match(/^data_objects\.(\d+)\.behavior_links\.(\d+)\.operation$/);
      if (dataOperationMatch) {
        const dataIndex = Number(dataOperationMatch[1]);
        const linkIndex = Number(dataOperationMatch[2]);
        const link = currentDocument()?.data_objects?.[dataIndex]?.behavior_links?.[linkIndex];
        if (!link) return;
        const previousOperation = link.operation;
        const nextOperation = target.value;
        requestTransition(
          '编辑数据操作',
          () => beginGuidedDataOperationEdit(dataIndex, linkIndex, nextOperation),
          {
            invoker: target,
            cancelAction: () => {
              if (target.isConnected) target.value = previousOperation;
            }
          }
        );
        return;
      }
      const formFieldOwnerMatch = target.dataset.bind.match(/^forms\.(\d+)\.areas\.(\d+)\.items\.(\d+)\.business_data_ref$/);
      if (formFieldOwnerMatch) {
        setByPath(target.dataset.bind, nullable(target.value));
        touch();
        render();
        return;
      }
      const fieldSourceTypeInputMatch = target.dataset.bind.match(/^forms\.(\d+)\.areas\.(\d+)\.items\.(\d+)\.source_links\.(\d+)\.source_type$/);
      if (fieldSourceTypeInputMatch) {
        const [formIndex, areaIndex, itemIndex, linkIndex] = fieldSourceTypeInputMatch.slice(1).map(Number);
        const link = currentDocument()?.forms?.[formIndex]?.areas?.[areaIndex]?.items?.[itemIndex]?.source_links?.[linkIndex];
        if (!link) return;
        const nextType = target.value === 'external_system' ? 'external_system' : 'process_data';
        const clears = nextType === 'external_system'
          ? Boolean(link.source_data_ref)
          : Boolean(text(link.source_system_name).trim() || text(link.source_data_name).trim());
        if (clears && !window.confirm(nextType === 'external_system'
          ? '切换为外部系统后，当前流程数据引用将被清空。确定继续吗？'
          : '切换为流程数据后，当前外部系统名称和数据名称将被清空。确定继续吗？')) {
          render();
          showStatus('已取消切换字段来源类型，当前来源信息保持不变。');
          return;
        }
        return runDocumentTransaction(nextDocument => {
          const nextLink = nextDocument.forms?.[formIndex]?.areas?.[areaIndex]?.items?.[itemIndex]?.source_links?.[linkIndex];
          if (!nextLink) throw new Error('当前字段取值来源已不存在');
          nextLink.source_type = nextType;
          if (nextType === 'external_system') {
            nextLink.source_data_ref = null;
            nextLink.source_system_name = text(nextLink.source_system_name);
            nextLink.source_data_name = text(nextLink.source_data_name);
          } else {
            nextLink.source_data_ref = null;
            nextLink.source_system_name = '';
            nextLink.source_data_name = '';
          }
        }, {
          source: 'field-source-type-change',
          successLabel: '已切换字段来源类型。如果原来源信息被清空，执行一次撤销可恢复。'
        });
      }
      const kind = target.dataset.kind;

    workspace.addEventListener('change', event => {

        const nextMode = ACTOR_ASSIGNMENT_MODE_VALUES.has(target.value) ? target.value : 'fixed_department';
        if (nextMode === previousMode) return;

        if (nextMode === 'company_wide') {

          behavior.actor_position_rule = '';
        } else if (nextMode === 'dynamic_from_data') {
          behavior.current_actor_role = '';
          behavior.actor_department_data_ref = null;
          behavior.actor_position_rule = '';

      if (target.matches('[data-actor-department]')) {

        const nextValue = combineActorRole(target.value, '');
        behavior.actor_assignment_mode = 'fixed_department';

        if (!item) return;
        const owner = (currentDocument().data_objects || []).find(dataObject =>

        );
        const dataField = (owner?.fields || []).find(field => field.field_ref === item.data_field_ref);
        if (owner && dataField) {
          applyFormFieldReferenceDefaults(item, owner, dataField);
        }
        render();
        return;
      }
      if (target.matches('[data-bind]') && (
        /^behaviors\.\d+\.node_type$/.test(target.dataset.bind)
        || /^behaviors\.\d+\.(actor_department_data_ref|actor_position_rule)$/.test(target.dataset.bind)
        || /^data_objects\.\d+\.(information_type|behavior_links\.\d+\.(behavior_ref|operation)|source_relations\.\d+\.availability_mode)$/.test(target.dataset.bind)
        || /^data_objects\.\d+\.fields\.\d+\.(field_name|field_type)$/.test(target.dataset.bind)
        || /^data_objects\.\d+\.lifecycle\./.test(target.dataset.bind)
        || /^forms\.\d+\.form_design_state$/.test(target.dataset.bind)
        || /^forms\.\d+\.behavior_links\.\d+\.behavior_ref$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.items\.\d+\.(business_data_ref|data_field_ref|value_usage_mode|value_origin_mode)$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.items\.\d+\.item_type$/.test(target.dataset.bind)
      )) {
        render();
      }
    });

    workspace.addEventListener('click', event => {
      if (event.target.id === 'graphEditModal') {
        handleAction('close-flow-editor', event.target);
        return;
      }
      const rowSelector = event.target.closest('[data-grid-row-selector]');
      if (rowSelector) {
        selectNativeGridRow(rowSelector.dataset.gridTableId, rowSelector.dataset.gridRowId);
        const firstControl = rowSelector.closest('tr')?.querySelector('[data-grid-cell]');
        firstControl?.focus();
        return;
      }
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    workspace.addEventListener('pointerdown', event => {
      const gridCell = event.target.closest('[data-grid-cell]');
      if (gridCell && event.button === 0) {
        selectNativeGridRow(gridCell.dataset.gridTableId, gridCell.dataset.gridRowId, {
          column: gridCell.dataset.gridColumn,
          extend: event.shiftKey
        });
      }
      const handle = event.target.closest('[data-drag-handle]');
      if (!handle || event.button !== 0) return;
      if (!beginSortableDrag(handle, event.pointerType || 'pointer', event.pointerId)) return;
      event.preventDefault();
    });

    workspace.addEventListener('pointermove', event => {
      if (!sortableDragState || sortableDragState.pointerId !== event.pointerId) return;
      event.preventDefault();
      sortableTargetFromPointer(event.clientX, event.clientY);
    });

    workspace.addEventListener('pointerup', event => {
      if (!sortableDragState || sortableDragState.pointerId !== event.pointerId) return;
      event.preventDefault();
      sortableTargetFromPointer(event.clientX, event.clientY);
      finishSortableDrag(true);
    });

    workspace.addEventListener('pointercancel', event => {
      if (!sortableDragState || sortableDragState.pointerId !== event.pointerId) return;
      finishSortableDrag(false);
    });

    workspace.addEventListener('compositionstart', event => {
      const control = event.target.closest('[data-grid-cell], [data-grid-search]');
      if (!control) return;
      control.dataset.gridComposing = '1';
      control.dataset.gridCompositionEndedAt = '0';
    });

    workspace.addEventListener('compositionend', event => {
      const control = event.target.closest('[data-grid-cell], [data-grid-search]');
      if (!control) return;
      control.dataset.gridComposing = '0';
      control.dataset.gridCompositionEndedAt = String(Date.now());
      if (control.matches('[data-grid-cell]')) updateNativeGridCell(control);
      else applyNativeGridFilter(control.dataset.gridSearch, control.value);
    });

    workspace.addEventListener('paste', event => {
      const control = event.target.closest('[data-grid-cell]');
      if (!control) return;
      const clipboardText = event.clipboardData?.getData('text/plain') || '';
      if (!/[\t\r\n]/.test(clipboardText)) return;
      event.preventDefault();
      applyNativeGridPaste(control, clipboardText);
    });

    workspace.addEventListener('keydown', event => {
      const gridCell = event.target.closest('[data-grid-cell]');
      if (gridCell) {
        const tableId = gridCell.dataset.gridTableId;
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'c') {
          const bounds = nativeGridRangeBounds(tableId, nativeGridRows(tableId), nativeGridColumns(tableId));
          if (bounds && (bounds.rowStart !== bounds.rowEnd || bounds.columnStart !== bounds.columnEnd)) {
            event.preventDefault();
            copyNativeGridRange(tableId).catch(error => showStatus(`复制失败：${error.message}`, 'error'));
          }
          return;
        }
        if (event.key === 'Enter') {
          const composing = globalThis.NativeWebGrid.isCompositionKey(
            event,
            gridCell.dataset.gridComposing === '1',
            Number(gridCell.dataset.gridCompositionEndedAt || 0)
          );
          if (composing) return;
          gridCell.dataset.gridCompositionEndedAt = '0';
          if (gridCell.matches('textarea, select, input[type="checkbox"]')) return;
          event.preventDefault();
          event.stopPropagation();
          updateNativeGridCell(gridCell);
          continueNativeGridInput(gridCell);
          return;
        }
      }
      const handle = event.target.closest('[data-drag-handle]');
      if (!handle && !sortableDragState) return;
      if (!sortableDragState && handle && (event.key === ' ' || event.key === 'Enter')) {
        event.preventDefault();
        beginSortableDrag(handle, 'keyboard');
        return;
      }
      if (!sortableDragState || sortableDragState.inputMode !== 'keyboard') return;
      if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
        event.preventDefault();
        moveSortableTarget(sortableDragState.targetIndex - 1);
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
        event.preventDefault();
        moveSortableTarget(sortableDragState.targetIndex + 1);
        return;
      }
      if (event.key === ' ' || event.key === 'Enter') {
        event.preventDefault();
        finishSortableDrag(true);
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        finishSortableDrag(false);
      }
    });

      }

    formFieldBatchContent.addEventListener('change', event => {
      if (formFieldBatchApplying) {

        return;

      const session = currentFormFieldBatchSession();
      if (!session) return;
      if (event.target.matches('[data-form-field-batch-ref]')) {
        const selected = new Set(list(session.patch.fieldRefs));
        if (event.target.checked) selected.add(event.target.dataset.formFieldBatchRef);
        else selected.delete(event.target.dataset.formFieldBatchRef);
        const requiredByFieldRef = clone(session.patch.requiredByFieldRef || {});
        Object.keys(requiredByFieldRef).forEach(fieldRef => {
          if (!selected.has(fieldRef)) delete requiredByFieldRef[fieldRef];
        });
        updateFormFieldBatchPatch({ fieldRefs: [...selected], requiredByFieldRef }, { focusTarget: event.target });
        return;
      }
      if (event.target.matches('[data-form-field-batch-target]')) {
        updateFormFieldBatchPatch({ targetValue: event.target.value, newAreaTitle: event.target.value === 'new:detail' ? session.patch.newAreaTitle : '' }, { focusTarget: event.target });
        return;
      }
      if (event.target.matches('[data-form-field-batch-required]')) {
        const requiredByFieldRef = clone(session.patch.requiredByFieldRef || {});
        const fieldRef = event.target.dataset.formFieldBatchRequired;
        if (event.target.value === '') delete requiredByFieldRef[fieldRef];
        else requiredByFieldRef[fieldRef] = event.target.value === 'true';
        updateFormFieldBatchPatch({ requiredByFieldRef }, { focusTarget: event.target });
        return;
      }
      if (event.target.matches('[data-form-field-batch-blank-required]')) {
        updateFormFieldBatchPatch({ blankRequired: event.target.value === '' ? null : event.target.value === 'true' }, { focusTarget: event.target });

      updateFormFieldBatchPatch({ requiredByFieldRef }, { focusTarget: bulk });

    cancelFormFieldBatchButton.addEventListener('click', () => closeFormFieldBatchModal({ render: true }));
    confirmFormFieldBatchButton.addEventListener('click', applyFormFieldBatch);
    formFieldBatchModal.addEventListener('click', event => {

        };

        if (compactTaskUiEnabled() && activeGovernanceStep === 'action') {
          activeGovernanceStep = 'skeleton';
          activeStepView = 'diagram';
          if (currentEntry()) {
            currentEntry().governanceStep = activeGovernanceStep;
            currentEntry().stepView = activeStepView;
          }
        }
        if (workspaceViewTitle) workspaceViewTitle.textContent = compactTaskUiEnabled() ? '编制任务' : '治理步骤';
        render();
      })
      .catch(() => {});
    loadEditorCatalogs();
    loadVersionHistory();
    ensureCompatibleValidationService('再次操作').catch(error => showStatus(error.message, 'error'));
  </script>
</body>
</html>
