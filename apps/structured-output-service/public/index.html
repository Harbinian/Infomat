    }

    function renderDiagramWarnings(model) {
      const relationReviewMessage = '该关系与其他非回路关系形成闭环；如果这是退回前序行为，请选择“流程内部回路”。';
      const unresolvedWarnings = model.unresolvedItems.length ? `
        <div class="diagram-warning-list" aria-label="未显示项目">
          <strong>有 ${model.unresolvedCount} 项内容无法绘制，请回到“数据与表单”补齐：</strong>
          ${model.unresolvedItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message)}</button>
          `).join('')}
        </div>` : '';
      const relationReviews = model.reviewItems?.length ? `
        <div class="diagram-warning-list" aria-label="关系类型请核对">
          <strong>关系类型请核对（不影响下载）：</strong>
          ${model.reviewItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message || relationReviewMessage)}</button>
          `).join('')}
        </div>` : '';
      return `${unresolvedWarnings}${relationReviews}`;
    }

    function graphHistoryState() {
      const entry = currentEntry();
      return entry ? graphStateManager.snapshot(candidateStateKey(entry), entry.data) : { canUndo: false, canRedo: false };
    }

    function renderGraphViewActions(kind) {
      return `
        <details class="graph-view-actions">
          <summary class="button small">视图操作</summary>
          <div class="graph-view-menu">
            <button class="button small" data-action="fit-${kind}-diagram">适应画布</button>
            <button class="button small" data-action="reset-${kind}-diagram">重置视图</button>
          </div>
        </details>`;
    }

    function renderFlowRelationDraft() {
      if (!flowRelationDraft) return '';
      const stageText = {
        type: '第1步：选择关系类型',
        source: '第2步：选择起点',
        target: '第3步：选择终点',
        confirm: '第4步：确认关系'
      }[flowRelationDraft.stage] || '建立关系';
      const behaviorButtons = ['source', 'target'].includes(flowRelationDraft.stage)
        ? `<div class="graph-endpoint-list">${(currentDocument().behaviors || []).map((behavior, index) => `
            <button class="button small" data-action="select-relation-endpoint" data-ref="${escapeAttribute(behavior.behavior_ref)}">
              ${index + 1}. ${escapeHtml(behavior.behavior_name || '未命名节点')}
            </button>`).join('')}</div>`
        : '';
      return `
        <div class="graph-operation-card" role="status">
          <strong>${stageText}</strong>
          ${flowRelationDraft.stage === 'type' ? `
            <select data-graph-relation-type>
              ${optionHtml(RELATION_TYPES, flowRelationDraft.relation_type)}
            </select>` : ''}
          <p>起点：${escapeHtml(relationEndpointLabel(flowRelationDraft.from_behavior_ref, '待选择'))}；终点：${escapeHtml(relationEndpointLabel(flowRelationDraft.to_behavior_ref, '待选择'))}</p>
          ${flowRelationDraft.stage === 'confirm' && ['condition', 'loop'].includes(flowRelationDraft.relation_type) ? `
            <div class="inline-note">先建立关系。判断条件或退回条件在第4步“动作与异常”填写。</div>` : ''}
          ${behaviorButtons}
          <div class="item-actions">
            ${flowRelationDraft.stage === 'confirm' ? '<button class="button primary small" data-action="confirm-flow-relation">确认建立</button>' : ''}
            <button class="button small" data-action="cancel-flow-relation">取消（Esc）</button>
          </div>
        </div>`;
    }

    function renderFlowPropertyPanel() {
      if (flowRelationDraft) return renderFlowRelationDraft();
      const selection = graphSelection;
      if (!selection || !['behavior', 'relation'].includes(selection.kind)) {
        return '<div class="graph-property-empty">选择一个节点或关系后，在这里编辑属性。技术标识和迁移信息默认不展开。</div>';
      }
      if (selection.kind === 'relation') {
        const relation = selection.draft || currentDocument().flow_relations.find(item => item.relation_ref === selection.ref);
        if (!relation) return '<div class="graph-property-empty">所选关系已经不存在。</div>';
        return `
          <div class="graph-property-panel" data-focus-kind="relation" data-focus-ref="${escapeAttribute(relation.relation_ref)}">
            <h3>流程关系</h3>
            <label>关系类型<select data-graph-property="relation_type">${optionHtml(RELATION_TYPES, relation.relation_type)}</select></label>
            <label>起点<select data-graph-property="from_behavior_ref">${optionHtml(behaviorOptions('请选择起点'), relation.from_behavior_ref)}</select></label>
            <label>终点<select data-graph-property="to_behavior_ref">${optionHtml(behaviorOptions('请选择终点'), relation.to_behavior_ref)}</select></label>
            <div class="inline-note">判断条件、退回条件和并行规则在第4步“动作与异常”维护。</div>
            <details><summary>技术标识</summary><code>${escapeHtml(relation.relation_ref)}</code></details>
            <div class="item-actions">
              <button class="button primary small" data-action="apply-flow-property">应用修改</button>
              <button class="button danger small" data-action="delete-graph-selection">删除关系</button>
            </div>
          </div>`;
      }
      const behavior = selection.draft || currentDocument().behaviors.find(item => item.behavior_ref === selection.ref);
      if (!behavior) return '<div class="graph-property-empty">所选节点已经不存在。</div>';
      const isControl = ['decision', 'parallel_split', 'parallel_join'].includes(behavior.node_type);
      const actor = parseActorRole(behavior.current_actor_role);
      const positions = rosterRolesByDepartment[actor.department] || [];
      const isEntry = !(currentDocument().flow_relations || []).some(relation =>
        relation.to_behavior_ref === behavior.behavior_ref && relation.relation_type !== 'loop'
      );
      return `
        <div class="graph-property-panel" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(behavior.behavior_ref)}">
          <h3>${isControl ? '流程控制节点' : '业务行为'}</h3>
          <label>节点类型<select data-graph-property="node_type">${optionHtml(NODE_TYPES, behavior.node_type)}</select></label>
          <label>节点名称<input data-graph-property="behavior_name" value="${escapeAttribute(behavior.behavior_name)}"></label>
          ${isControl ? `
            <div class="inline-note">流程控制，不代表执行部门。切换类型不会删除原有普通行为字段。</div>
            <details><summary>原普通行为字段（只读保留）</summary>
              <div class="technical-note">执行主体：${escapeHtml(behavior.current_actor_role || '空')}<br>具体做什么：${escapeHtml(behavior.behavior_description || '空')}<br>完成标准：${escapeHtml(behavior.completion_standard || '空')}</div>
            </details>` : `
            <label>执行主体确定方式<select data-graph-property="actor_assignment_mode">${optionHtml(ACTOR_ASSIGNMENT_MODES, actorAssignmentMode(behavior))}</select></label>
            ${actorAssignmentMode(behavior) === 'fixed_department' ? `
              <label>执行部门<select data-graph-actor-department>${optionHtml([''].concat(DEPARTMENTS.filter(item => item !== '全公司')), actor.department)}</select></label>
              <label>执行岗位<select data-graph-actor-position>${optionHtml([''].concat(positions), actor.position)}</select></label>` : ''}
            ${actorAssignmentMode(behavior) === 'dynamic_from_data' ? `
              <label>执行部门来源数据<select data-graph-property="actor_department_data_ref">${optionHtml([{ value: '', label: '请选择前序数据' }].concat((currentDocument().data_objects || []).map(item => ({ value: item.data_ref, label: item.data_name || '未命名数据' }))), behavior.actor_department_data_ref || '')}</select></label>
              <label>岗位或责任人确定规则<textarea data-graph-property="actor_position_rule">${escapeHtml(behavior.actor_position_rule)}</textarea></label>` : ''}
            <div class="inline-note">“具体做什么”、流程如何开始、办理时限、完成标准和会签要求在第4步“动作与异常”维护。</div>`}
          <details><summary>技术标识和历史文字</summary><code>${escapeHtml(behavior.behavior_ref)}</code><div class="technical-note">输入说明：${escapeHtml(behavior.input_description || '空')}<br>输出说明：${escapeHtml(behavior.output_description || '空')}</div></details>
          <div class="item-actions">
            <button class="button primary small" data-action="apply-flow-property">应用修改</button>
            ${selection.kind === 'behavior' ? `<button class="button small" data-action="governance-jump" data-step="action" data-view="behaviors" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(behavior.behavior_ref)}" data-focus-path="behaviors.${currentDocument().behaviors.indexOf(behavior)}.behavior_description">转到动作与异常</button>` : ''}
            <button class="button danger small" data-action="delete-graph-selection">删除节点</button>
          </div>
        </div>`;
    }

    function renderDiagramPanel(model) {
      const history = graphHistoryState();
      const collisionNotice = model.layout?.collisions?.length
        ? `<div class="diagram-notice warning">自动避让执行6轮后仍有${model.layout.collisions.length}项碰撞。该告警不修改JSON、不阻止下载，但当前版本不能发布。</div>`
        : '';
      return `
        <section class="section diagram-section${diagramExpanded ? ' diagram-expanded' : ''}">
          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>${escapeHtml(currentDocument().process.process_name || '未命名流程')} · 流程关系</h2>
                <p>普通行为进入部门泳道；判断和并行节点进入顶部“流程控制”带。一对多和多对一使用多条独立关系。</p>
              </div>
              <div class="diagram-controls">
                <button class="button primary small" data-action="add-graph-node">新增节点</button>
                <button class="button secondary small" data-action="start-flow-relation">建立关系</button>
                <button class="button small" data-action="undo-graph" ${history.canUndo ? '' : 'disabled'}>撤销</button>
                <button class="button small" data-action="redo-graph" ${history.canRedo ? '' : 'disabled'}>重做</button>
                ${renderGraphViewActions('flow')}
              </div>
            </div>
            ${renderDiagramLegend()}
            ${collisionNotice}
            <div class="diagram-notice" id="diagramViewportNotice" role="status" hidden>
              当前已聚焦流程开头，点击“适应画布”查看完整流程
            </div>
            <div class="graph-editor-layout">
              <div>
                <div class="diagram-canvas" id="processDiagramCanvas" role="application" aria-label="可编辑流程关系图"></div>
                <div class="diagram-failure" id="diagramFailure" role="alert"></div>
              </div>
              <aside class="graph-property-shell" aria-label="当前选择属性">${renderFlowPropertyPanel()}</aside>
            </div>
            ${renderDiagramWarnings(model)}
          </div>
        </section>`;
    }

    function ensureActiveGraphDataObject() {
      const dataObjects = currentDocument()?.data_objects || [];
      if (!dataObjects.some(item => item.data_ref === activeDataRef)) activeDataRef = dataObjects[0]?.data_ref || '';
      return dataObjects.find(item => item.data_ref === activeDataRef) || null;
    }

    function pendingLifecycle() {
      return globalThis.ProcessGovernanceMigration?.pendingLifecycle
        ? globalThis.ProcessGovernanceMigration.pendingLifecycle()
        : {
            applicability: 'pending_confirmation',
            entry_state: {
              business_validity: 'pending_confirmation',
              custody: 'pending_confirmation',
              identifiability_applicability: 'pending_confirmation',
              identifiability: 'pending_confirmation'
            },
            routes: [],
            analysis: { analyzer_version: '', source_fingerprint: '', status: 'not_analyzed' },
            decision_reason: '',
            decision_notes: ''
          };
    }

    function renderDataModeSwitch() {
      return `<div class="step-view-switch" aria-label="数据工作区视图">
        <button class="button small step-view-button${activeDataMode === 'flow' ? ' active' : ''}" data-action="switch-data-mode" data-mode="flow">数据流</button>
        <button class="button small step-view-button${activeDataMode === 'lifecycle' ? ' active' : ''}" data-action="switch-data-mode" data-mode="lifecycle">生命周期</button>
      </div>`;
    }

    function renderMasterDataHint(dataObject) {
      const analyzer = globalThis.LifecycleAnalyzer;
      if (!analyzer?.classifyMasterDataHint) return '';
      const hint = analyzer.classifyMasterDataHint(currentDocument(), dataObject);
      const pending = masterDataPendingRefs.has(dataObject.data_ref);
      return `<section class="inline-note" aria-label="主数据认定提示">
        <strong>主数据认定提示：${escapeHtml(hint.label)}</strong>
        <p>${escapeHtml(hint.message)}</p>
        <details><summary>查看判断依据</summary><ul>${hint.reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join('')}</ul></details>
        <div class="item-actions">
          <button class="button small" data-action="supplement-data-facts">补充对象事实</button>
          <button class="button small secondary" data-action="mark-master-data-pending">${pending ? '已列入本页交接待定' : '列入交接待定事项'}</button>
        </div>
        <p class="technical-note">所有主数据都是数据对象，但不是所有数据对象都是主数据。表单通常不是主数据；填写完成的表单通常是交易记录或业务证据。该提示不写入正式主数据结论，也不阻止下载。</p>
      </section>`;
    }

    function renderLifecycleStateFields(pathPrefix, title) {
      return `<div class="item-card">
        <strong>${escapeHtml(title)}</strong>
        <div class="grid" style="margin-top:10px">
          ${field(`${pathPrefix}.business_validity`, '业务效力', { type: 'select', options: BUSINESS_VALIDITY_OPTIONS })}
          ${field(`${pathPrefix}.custody`, '保管状态', { type: 'select', options: CUSTODY_OPTIONS })}
          ${field(`${pathPrefix}.identifiability_applicability`, '可识别性是否适用', { type: 'select', options: IDENTIFIABILITY_APPLICABILITY_OPTIONS })}
          ${field(`${pathPrefix}.identifiability`, '可识别性', { type: 'select', options: IDENTIFIABILITY_OPTIONS })}
        </div>
      </div>`;
    }

    function renderLifecycleEvent(dataIndex, routeIndex, eventIndex, event) {
      const eventPath = `data_objects.${dataIndex}.lifecycle.routes.${routeIndex}.events.${eventIndex}`;
      const needsReason = ['not_applicable', 'rejected'].includes(event.review_status);
      const needsCarrier = ['archive', 'restore_active_custody', 'destroy'].includes(event.action);
      const reviewOpen = event.high_risk || ['pending_confirmation', 'needs_recheck'].includes(event.review_status);
      const triggerMode = {
        behavior: '业务行为', time_period: '时间或期限', business_condition: '业务或数据条件',
        external_process_notice: '外部流程或通知', pending_confirmation: '待确认'
      }[event.trigger?.mode] || '待确认';
      return `<article class="item-card" data-focus-path="${escapeAttribute(eventPath)}">
        <div class="item-title">
          <strong>${escapeHtml(LIFECYCLE_ACTIONS[event.action] || event.action)}</strong>
          <span class="status-pill ${event.high_risk ? 'danger' : ''}">${event.high_risk ? '高风险，必须人工核对' : '普通生命周期事件'}</span>
        </div>
        <p><strong>触发：</strong>${escapeHtml(triggerMode)}；${escapeHtml(event.trigger?.expression || '条件待确认')}</p>
        <p><strong>作用范围：</strong>${escapeHtml(event.target_scope || '待确认')}；<strong>责任：</strong>${escapeHtml(event.responsibility?.position || event.responsibility?.department || '待确认')}</p>
        ${field(`${eventPath}.review_status`, '核对状态', { type: 'select', options: LIFECYCLE_REVIEW_STATUS_OPTIONS })}
        ${needsReason ? field(`${eventPath}.decision_reason`, '决定原因', { type: 'select', options: LIFECYCLE_DECISION_REASON_OPTIONS }) : ''}
        ${needsReason ? field(`${eventPath}.decision_notes`, '补充说明', { type: 'textarea', className: 'wide' }) : ''}
        <details ${reviewOpen ? 'open' : ''}><summary>核对触发、范围、责任和异常</summary>
          <div class="grid" style="margin-top:10px">
            ${field(`${eventPath}.trigger.mode`, '触发方式', { type: 'select', options: LIFECYCLE_TRIGGER_MODE_OPTIONS })}
            ${field(`${eventPath}.trigger.operator`, '条件组合', { type: 'select', options: LIFECYCLE_TRIGGER_OPERATOR_OPTIONS })}
            ${field(`${eventPath}.trigger.expression`, '触发条件原文', { type: 'textarea', className: 'wide' })}
            ${field(`${eventPath}.target_scope`, '作用范围', { type: 'select', options: LIFECYCLE_TARGET_SCOPE_OPTIONS })}
            ${needsCarrier ? field(`${eventPath}.carrier_scope`, '载体范围', { type: 'select', options: LIFECYCLE_CARRIER_SCOPE_OPTIONS }) : ''}
            ${field(`${eventPath}.responsibility.mode`, '责任确定方式', { type: 'select', options: LIFECYCLE_RESPONSIBILITY_MODE_OPTIONS })}
            ${field(`${eventPath}.responsibility.department`, '责任部门')}
            ${field(`${eventPath}.responsibility.position`, '责任岗位')}
            ${field(`${eventPath}.exception_handling`, '例外处理', { type: 'textarea', className: 'wide' })}
          </div>
          ${renderLifecycleStateFields(`${eventPath}.result_state`, '动作完成后的状态')}
        </details>
        <details><summary>查看推导依据</summary>
          <p>来源位置：<code>${escapeHtml(event.provenance?.source_path || '未记录')}</code></p>
          <p>依据：${escapeHtml(event.provenance?.basis || '未记录')}</p>
        </details>
      </article>`;
    }

    function analyzeLifecycleForObject(dataObject) {
      const analyzer = globalThis.LifecycleAnalyzer;
      if (!analyzer?.analyzeDataObject) return null;
      const before = JSON.stringify(dataObject.lifecycle || null);
      const result = analyzer.analyzeDataObject(currentDocument(), dataObject.data_ref);
      dataObject.lifecycle = result.lifecycle;
      return { ...result, changed: before !== JSON.stringify(result.lifecycle) };
    }

    function renderLifecyclePanel() {
      const dataObject = ensureActiveGraphDataObject();
      if (!dataObject) {
        return `<section class="section"><div class="section-body"><div class="diagram-empty"><h2>尚未登记数据对象</h2><p>先登记数据对象，页面再按对象自动整理生命周期建议。</p><button class="button primary" data-action="add-graph-data">新增数据</button></div></div></section>`;
      }
      if (!dataObject.lifecycle) dataObject.lifecycle = pendingLifecycle();
      const dataIndex = currentDocument().data_objects.indexOf(dataObject);
      const lifecycle = dataObject.lifecycle;
      const eventCount = (lifecycle.routes || []).reduce((total, route) => total + (route.events || []).length, 0);
      const pendingCount = (lifecycle.routes || []).flatMap(route => route.events || []).filter(event =>
        ['pending_confirmation', 'needs_recheck'].includes(event.review_status)
      ).length;
      const routes = (lifecycle.routes || []).map((route, routeIndex) => {
        const routePath = `data_objects.${dataIndex}.lifecycle.routes.${routeIndex}`;
        const events = (route.events || []).map((event, eventIndex) => renderLifecycleEvent(dataIndex, routeIndex, eventIndex, event)).join('');
        return `<details class="nested" open>
          <summary><strong>${escapeHtml(route.route_label || `路径${routeIndex + 1}`)}</strong> · ${(route.events || []).length}个事件</summary>
          <p class="technical-note">流程关系：${escapeHtml((route.flow_relation_refs || []).join('、') || '当前行为未定位到具体流程关系')}</p>
          ${events || emptyList('当前路径没有生命周期事件。')}
          ${renderLifecycleStateFields(`${routePath}.exit_state`, '当前路径的出口状态')}
        </details>`;
      }).join('');
      return `<section class="section diagram-section">
        <div class="section-body">
          <div class="diagram-toolbar">
            <div><h2>数据生命周期</h2><p>系统按当前数据对象集中分析，不要求逐行为定义。停用、作废和失效分别记录；系统删除不属于业务生命周期动作。</p></div>
            <div class="diagram-controls">
              <button class="button primary small" data-action="reanalyze-current-lifecycle">重新分析当前对象</button>
              <button class="button secondary small" data-action="reanalyze-all-lifecycle">重新分析全部对象</button>
            </div>
          </div>
          <div class="data-focus-selector">
            <label>当前数据对象<select data-graph-data-focus>${optionHtml((currentDocument().data_objects || []).map(item => ({ value: item.data_ref, label: item.data_name || '未命名数据' })), activeDataRef)}</select></label>
            <span class="technical-note">${eventCount}个事件，${pendingCount}项待确认或需重新核对；分析器 ${escapeHtml(lifecycle.analysis?.analyzer_version || '未运行')}。</span>
          </div>
          ${renderMasterDataHint(dataObject)}
          <div class="grid" style="margin-top:14px">
            ${field(`data_objects.${dataIndex}.lifecycle.applicability`, '本流程是否涉及该对象的生命周期', {
              type: 'select',
              options: [
                { value: 'pending_confirmation', label: '待确认' },
                { value: 'applicable', label: '适用' },
                { value: 'not_applicable', label: '不适用' }
              ]
            })}
            ${lifecycle.applicability === 'not_applicable' ? field(`data_objects.${dataIndex}.lifecycle.decision_reason`, '不适用原因', {
              type: 'select',
              options: [
                { value: '', label: '请选择原因' },
                { value: 'no_lifecycle_in_current_process', label: '当前流程不改变该对象的生命周期' },
                { value: 'reference_only', label: '当前流程只引用该对象' },
                { value: 'insufficient_evidence', label: '现有依据不足' },
                { value: 'other', label: '其他' }
              ]
            }) : ''}
            ${lifecycle.applicability === 'not_applicable' ? field(`data_objects.${dataIndex}.lifecycle.decision_notes`, '补充说明', { type: 'textarea', className: 'wide' }) : ''}
          </div>
          ${renderLifecycleStateFields(`data_objects.${dataIndex}.lifecycle.entry_state`, '对象进入本流程时的状态')}
          <div class="cross-department-list">${routes || `<div class="inline-warning"><strong>尚未形成生命周期事件。</strong>现有材料可能没有明确动作，也可能尚未建立数据与行为关系。请补充对象事实，或保留待确认后下载。</div>`}</div>
          <p class="boundary"><strong>边界：</strong>当前v7文件记录未审核的单流程事实和建议，暂不能直接导入3000。生命周期缺口属于业务提示，不阻止草稿下载。</p>
        </div>
      </section>`;
    }

    function renderDataPropertyPanel() {
      const dataObject = ensureActiveGraphDataObject();
      if (!dataObject) return '<div class="graph-property-empty">新增数据对象后，可以围绕它建立直接数据关系。</div>';
      const selection = graphSelection;
      if (selection?.kind === 'data-behavior-choice' && selection.dataRef === dataObject.data_ref) {
        return `
          <div class="graph-property-panel">
            <h3>选择关联行为</h3>
            <p class="technical-note">数据模式只编辑数据关系，业务行为仍是只读端点。</p>
            <label>业务行为<select data-graph-data-behavior>${optionHtml(behaviorOptions('请选择业务行为'), selection.behaviorRef || '')}</select></label>
            <div class="item-actions">
              <button class="button primary small" data-action="continue-data-relation" ${selection.behaviorRef ? '' : 'disabled'}>继续</button>
              <button class="button small" data-action="cancel-data-relation">取消</button>
            </div>
          </div>`;
      }
      if (selection?.kind === 'data-edge' && selection.dataRef === dataObject.data_ref) {
        const behavior = currentDocument().behaviors.find(item => item.behavior_ref === selection.behaviorRef);
        const operations = selection.operations || dataObject.behavior_links.filter(link => link.behavior_ref === selection.behaviorRef).map(link => link.operation);
        return `
          <div class="graph-property-panel">
            <h3>${escapeHtml(behavior?.behavior_name || '业务行为')} · 数据操作</h3>
            <p class="technical-note">业务行为是只读端点。需要修改行为时可转到“流程骨架”。</p>
            <div class="check-grid">${DATA_OPERATIONS.map(option => `
              <label class="check-row"><input type="checkbox" data-graph-data-operation value="${option.value}" ${operations.includes(option.value) ? 'checked' : ''}>${option.label}</label>`).join('')}</div>
            <div class="item-actions">
              <button class="button primary small" data-action="apply-data-operations">应用数据操作</button>
              <button class="button small" data-action="open-flow-behavior" data-ref="${escapeAttribute(selection.behaviorRef)}">转到流程骨架</button>
            </div>
          </div>`;
      }
      const draft = selection?.kind === 'data' && selection.ref === dataObject.data_ref ? (selection.draft || dataObject) : dataObject;
      return `
        <div class="graph-property-panel" data-focus-kind="data" data-focus-ref="${escapeAttribute(dataObject.data_ref)}">
          <h3>当前数据对象</h3>
          <label>数据名称<input data-graph-data-property="data_name" value="${escapeAttribute(draft.data_name)}"></label>
          <label>说明<textarea data-graph-data-property="description">${escapeHtml(draft.description)}</textarea></label>
          <label>信息类型<select data-graph-data-property="information_type">${optionHtml(INFORMATION_TYPE_OPTIONS, draft.information_type)}</select></label>
          ${renderMasterDataHint(dataObject)}
          <details><summary>技术标识和来源线索</summary><code>${escapeHtml(dataObject.data_ref)}</code><div class="technical-note">来源线索${dataObject.source_relations.length}项；默认不展开。</div></details>
          <div class="item-actions">
            <button class="button primary small" data-action="apply-data-property">应用修改</button>
            <button class="button secondary small" data-action="choose-data-behavior">建立数据关系</button>
            <button class="button danger small" data-action="delete-data-object">删除数据对象</button>
          </div>
        </div>`;
    }

    function renderDataDiagramPanel() {
      const dataObject = ensureActiveGraphDataObject();
      const history = graphHistoryState();
      const sameNameCount = dataObject
        ? currentDocument().data_objects.filter(item => item.data_ref !== dataObject.data_ref && text(item.data_name).trim() === text(dataObject.data_name).trim() && text(item.data_name).trim()).length
        : 0;
      return `
        <section class="section diagram-section">
          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>数据关系</h2>
                <p>一次只围绕一个数据对象显示直接关联行为；图例中的箭头说明业务行为与数据对象之间的操作方向。</p>
              </div>
              <div class="diagram-controls">
                <button class="button primary small" data-action="add-graph-data">新增数据</button>
                <button class="button secondary small" data-action="merge-current-data" ${sameNameCount ? '' : 'disabled'}>归并同名数据</button>
                <button class="button small" data-action="undo-graph" ${history.canUndo ? '' : 'disabled'}>撤销</button>
                <button class="button small" data-action="redo-graph" ${history.canRedo ? '' : 'disabled'}>重做</button>
                ${renderGraphViewActions('data')}
              </div>
            </div>
            <div class="diagram-legend-shell data-relation-legend" aria-label="数据关系图图例">
              <strong class="data-relation-legend-title">数据关系图图例</strong>
              <div class="diagram-legend-list" role="list">
                <div class="diagram-legend-item" role="listitem">
                  <span class="data-legend-node" aria-hidden="true">行为</span>

    function destroyDiagram() {
      if (!diagramView) return;
      try {
        diagramView.destroy();
      } catch (_error) {
        // The text editor must remain available even if the graph library has already released the canvas.
      }
      diagramView = null;
    }

    function destroyDataDiagram() {
      if (!dataDiagramView) return;
      try {
        dataDiagramView.destroy();
      } catch (_error) {
        // The text editor remains available if the data canvas has already been released.
      }
      dataDiagramView = null;
    }

    function destroyReviewPatternDiagrams() {
      reviewPatternViews.forEach(view => {
        try {
          view.destroy();
        } catch (_error) {
          // The review page must remain usable if a graph canvas has already been released.
        }
      });
      reviewPatternViews.clear();
    }

    function mountReviewPatternDiagrams() {
      destroyReviewPatternDiagrams();
      if (
        activeWorkspaceTab !== 'flow'
        || activeGovernanceStep !== 'skeleton'
        || activeStepView !== 'diagram'
        || !diagramExampleExpanded
        || !document.querySelector('.node-combination-guide[open]')
      ) return;
      const patternApi = globalThis.ReviewPatternDiagrams;
      if (!patternApi?.definitions || !patternApi?.mount) return;
      patternApi.definitions().forEach(pattern => {
        const container = document.getElementById(`reviewPatternDiagram-${pattern.id}`);
        const failure = document.getElementById(`reviewPatternFailure-${pattern.id}`);
        const viewportNote = document.getElementById(`reviewPatternViewport-${pattern.id}`);
        if (!container) return;
        try {
          const view = patternApi.mount({
            container,
            pattern,
            processDiagram: globalThis.ProcessDiagram,
            onViewportModeChange(viewport) {
              if (!viewportNote) return;
              viewportNote.textContent = viewport?.mode === 'start'
                ? '当前显示图例开头；点击“适应画布”查看完整结构。'
                : '图例可拖动，可使用滚轮缩放。';
            }
          });
          reviewPatternViews.set(pattern.id, view);
          view.cy?.ready(() => view.fit());
        } catch (error) {
          container.hidden = true;
          if (failure) {
            failure.textContent = `图例未显示：${error.message}`;
            failure.style.display = 'grid';
          }
        }
      });
    }

    function mountDiagram() {
      destroyDiagram();
      if (activeWorkspaceTab !== 'flow') return;
      const data = currentDocument();
      const model = currentDiagramModel(data);
      if (!data || !model.namedBehaviorCount) return;
      const container = document.getElementById('processDiagramCanvas');
      const failure = document.getElementById('diagramFailure');
      if (!container) return;
      try {
        diagramView = window.ProcessDiagram.mount({
          container,
          documentData: data,
          departmentOrder: actorDepartments(),
          editable: true,
          viewport: graphStateManager.view(candidateStateKey()).flow,
          onFocus: handleFlowDiagramFocus,
          onViewportModeChange(viewport) {
            const notice = document.getElementById('diagramViewportNotice');
            if (notice) notice.hidden = viewport?.mode !== 'start';
          }
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `流程图暂时无法生成：${error.message}。当前文字内容仍然保留，可以继续编制或下载。`;
          failure.classList.add('show');
        }
      }
    }

    function captureGraphViewport() {
      const entry = currentEntry();
      if (!entry) return;
      const patch = {};
      if (diagramView?.viewport) patch.flow = diagramView.viewport();
      if (dataDiagramView?.viewport) patch.data = { ...dataDiagramView.viewport(), dataRef: activeDataRef };
      if (Object.keys(patch).length) graphStateManager.updateView(candidateStateKey(entry), patch);
    }

    function handleFlowDiagramFocus(focusKind, focusRef) {
      captureGraphViewport();
      if (flowRelationDraft && focusKind === 'behavior') {
        if (flowRelationDraft.stage === 'source') {
          flowRelationDraft.from_behavior_ref = focusRef;
          flowRelationDraft.stage = 'target';
        } else if (flowRelationDraft.stage === 'target') {
          flowRelationDraft.to_behavior_ref = focusRef;
          flowRelationDraft.stage = 'confirm';
        }
        render();
        return;
      }
      if (focusKind === 'data-badge') {
        const related = currentDocument().data_objects.find(item => item.behavior_links.some(link => link.behavior_ref === focusRef));
        if (related) activeDataRef = related.data_ref;
        graphSelection = related ? { kind: 'data', ref: related.data_ref, draft: clone(related) } : null;
        return setActiveGovernanceStep('data', 'data');
      }
      if (focusKind === 'form-badge') {
        const form = currentDocument().forms.find(item => item.behavior_links.some(link => link.behavior_ref === focusRef));
        if (form) activeFormRef = form.form_ref;
        activeEditorSection = 'forms';
        return setActiveGovernanceStep('data', 'forms');
      }
      if (focusKind === 'behavior') {
        const item = currentDocument().behaviors.find(behavior => behavior.behavior_ref === focusRef);
        graphSelection = item ? { kind: 'behavior', ref: focusRef, draft: clone(item) } : null;
        activeBehaviorRef = focusRef;
      } else if (focusKind === 'relation') {
        const item = currentDocument().flow_relations.find(relation => relation.relation_ref === focusRef);
        graphSelection = item ? { kind: 'relation', ref: focusRef, draft: clone(item) } : null;
        activeRelationRef = focusRef;
      }
      render();
    }

    function mountDataDiagram() {
      destroyDataDiagram();
      if (activeWorkspaceTab !== 'data' || activeDataMode !== 'flow' || !ensureActiveGraphDataObject()) return;
      const container = document.getElementById('dataRelationDiagramCanvas');
      const failure = document.getElementById('dataDiagramFailure');
      if (!container) return;
      try {
        dataDiagramView = globalThis.DataRelationDiagram.mount({
          container,
          documentData: currentDocument(),
          selectedDataRef: activeDataRef,
          viewport: graphStateManager.view(candidateStateKey()).data,
          onFocus(item) {
            captureGraphViewport();
            if (item.kind === 'behavior') {
              graphSelection = {
                kind: 'data-edge',
                dataRef: activeDataRef,
                behaviorRef: item.ref,
                operations: currentDocument().data_objects.find(data => data.data_ref === activeDataRef)?.behavior_links
                  .filter(link => link.behavior_ref === item.ref).map(link => link.operation) || []
              };
            } else if (item.kind === 'data-relation') {
              graphSelection = {
                kind: 'data-edge',
                dataRef: item.dataRef,
                behaviorRef: item.behaviorRef,
                operations: text(item.operations).split(',').filter(Boolean)
              };
            } else {
              const dataObject = ensureActiveGraphDataObject();
              graphSelection = dataObject ? { kind: 'data', ref: dataObject.data_ref, draft: clone(dataObject) } : null;
            }
            render();
          }
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `数据关系图暂时无法生成：${error.message}。字段编辑、导入、校验和下载仍可使用。`;
          failure.classList.add('show');
        }
      }
    }

    function setActiveWorkspaceTab(tab) {
      if (tab === 'versions') return setActiveGovernanceStep('start', 'version');
      if (tab === 'data') return setActiveGovernanceStep('data', 'data');
      if (tab === 'editor') return setActiveGovernanceStep('action', 'behaviors');
      return setActiveGovernanceStep('skeleton', 'diagram');
    }

    async function validateGraphDocument(documentValue) {
      const response = await fetch('/api/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data: documentValue })
      });
      const result = await readJsonResponse(response, '3001图编辑校验接口未返回结构化数据。');
      if (!response.ok) throw new Error(result.error || '校验服务不可用');
      return result;
    }

    function updateSelectionFromGraphResult(result) {
      const selected = result?.details?.selected;
      if (!selected) return;
      if (selected.kind === 'behavior') {
        const item = currentDocument().behaviors.find(value => value.behavior_ref === selected.ref);
        graphSelection = item ? { kind: 'behavior', ref: selected.ref, draft: clone(item) } : null;
        activeBehaviorRef = selected.ref;
      } else if (selected.kind === 'relation') {
        const item = currentDocument().flow_relations.find(value => value.relation_ref === selected.ref);
        graphSelection = item ? { kind: 'relation', ref: selected.ref, draft: clone(item) } : null;
        activeRelationRef = selected.ref;
      } else if (selected.kind === 'data') {
        const item = currentDocument().data_objects.find(value => value.data_ref === selected.ref);
        activeDataRef = selected.ref;
        graphSelection = item ? { kind: 'data', ref: selected.ref, draft: clone(item) } : null;
      }
    }

    async function refreshValidationAfterGraphCommand(documentValue) {
      try {
        const result = await validateGraphDocument(documentValue);
        if (!result.valid) {
          const first = result.errors?.[0];
          showStatus(`图操作已保留；当前草稿还有${result.errors?.length || 1}项结构阻断。${first ? `${validationErrorLocation(first)}：${first.message}` : ''}`, 'error');
        }
      } catch (error) {
        showStatus(`图操作已保留；完整结构校验暂未刷新：${error.message}`, 'error');
      }
    }

    async function runGraphCommand(command, options = {}) {
      const entry = currentEntry();
      if (!entry) return false;
      captureGraphViewport();
      const preview = globalThis.GraphEditCommands.applyCommand(entry.data, command);
      if (!preview.ok) {
        const impacts = preview.details?.impacts || [];
        const impactText = impacts.length ? `：${impacts.map(item => `${item.label}${item.ref ? `（${item.ref}）` : ''}`).join('、')}` : '';
        showStatus(`${preview.message}${impactText}`, 'error');
        return false;
      }
      if (options.prevalidate) {
        try {
          const validation = await validateGraphDocument(preview.document);
          if (!validation.valid) {
            const first = validation.errors?.[0];
            throw new Error(first ? `${validationErrorLocation(first)}：${first.message}` : '副本未通过结构校验');
          }
        } catch (error) {
          showStatus(`${options.failureLabel || '图操作'}未执行：${error.message}。当前草稿保持不变。`, 'error');
          return false;
        }
      }
      const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => preview);
      if (!result.ok) {
        showStatus(result.message || '图操作未执行', 'error');
        return false;
      }
      entry.data = result.document;
      updateSelectionFromGraphResult(result);
      if (command.type === 'delete_object') {
        const collection = command.kind === 'behavior'
          ? entry.data.behaviors
          : command.kind === 'relation'
            ? entry.data.flow_relations
            : command.kind === 'data'
              ? entry.data.data_objects
              : [];
        const refKey = command.kind === 'behavior' ? 'behavior_ref' : command.kind === 'relation' ? 'relation_ref' : 'data_ref';
        const nearby = collection[Math.min(result.details?.previousIndex || 0, Math.max(0, collection.length - 1))];
        graphSelection = nearby ? { kind: command.kind, ref: nearby[refKey], draft: clone(nearby) } : null;
        if (command.kind === 'behavior') activeBehaviorRef = nearby?.behavior_ref || '';
        if (command.kind === 'relation') activeRelationRef = nearby?.relation_ref || '';
        if (command.kind === 'data') activeDataRef = nearby?.data_ref || '';
      }
      invalidateCurrentChecks(entry);
      invalidateBulkPreview();
      refreshCandidateDirty(entry);
      render();
      if (result.details?.warnings?.length) {
        showStatus(`${options.successLabel || '图操作已完成'}。请核对：${result.details.warnings.join('；')}`, 'success');
      } else if (options.successLabel) {
        showStatus(options.successLabel, 'success');
      }
      refreshValidationAfterGraphCommand(result.document);
      return true;
    }

        behavior_description: '',
        current_actor_role: '',
        actor_assignment_mode: 'fixed_department',
        actor_department_data_ref: null,
        actor_position_rule: '',
        trigger: '',
        precondition: '',
        input_description: '',
        timing: null,
        completion_standard: '',
        output_description: '',
        countersign_all_required: false,
        countersign_target_departments: []
      };
    }

    function newGraphDataObject() {
      return {
        data_ref: newRef('data'),
        data_name: '未命名数据',
        description: '',
        information_type: 'pending_confirmation',
        fields: [],
        behavior_links: [],
        source_relations: [],
        lifecycle: pendingLifecycle()
      };
    }

    function applyGraphHistory(direction) {
      const entry = currentEntry();
      if (!entry) return;
      captureGraphViewport();
      const result = direction === 'undo'
        ? graphStateManager.undo(candidateStateKey(entry), entry.data)
        : graphStateManager.redo(candidateStateKey(entry), entry.data);
      if (!result.ok) return showStatus(result.message, 'error');
      entry.data = result.document;
      invalidateCurrentChecks(entry);
      invalidateBulkPreview();
      refreshCandidateDirty(entry);
      graphSelection = null;
      ensureActiveGraphDataObject();
      render();
      showStatus(direction === 'undo' ? '已撤销上一次编辑操作。' : '已重做上一次编辑操作。', 'success');
      refreshValidationAfterGraphCommand(result.document);
    }

    function applyGraphPropertyDraft() {
      if (!graphSelection?.draft) return;
      if (graphSelection.kind === 'behavior') {
        return runGraphCommand({ type: 'update_behavior', behavior: graphSelection.draft }, { successLabel: '节点属性已更新' });
      }
      if (graphSelection.kind === 'relation') {
        return runGraphCommand({ type: 'upsert_flow_relation', relation: graphSelection.draft }, { successLabel: '流程关系已更新' });
      }
    }

    function deleteGraphObject(kind, ref) {
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), kind, ref);
      if (impacts.length) {
        showStatus(`不能删除：该对象仍被${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}引用。请先转到对应内容移除或替换引用。`, 'error');
        return;
      }
      if (!window.confirm('删除后可通过本候选流程的“撤销”恢复。确定删除吗？')) return;
      return runGraphCommand({ type: 'delete_object', kind, ref }, { successLabel: '对象已删除' });
    }

    async function mergeCurrentDataObjects() {
      const keep = ensureActiveGraphDataObject();
      if (!keep) return;
      const removing = currentDocument().data_objects.filter(item => item.data_ref !== keep.data_ref && text(item.data_name).trim() === text(keep.data_name).trim());
      const preview = globalThis.GraphEditCommands.mergePreview(currentDocument(), keep.data_ref, removing.map(item => item.data_ref));
      if (!preview.ok) return showStatus(preview.message, 'error');
      const valueChoices = {};
      for (const conflict of preview.details.valueConflicts) {
        const choices = [keep, ...removing].map((item, index) => `${index}：${text(item[conflict.field]) || '（空）'}`).join('\n');
        const answer = window.prompt(`字段“${conflict.field}”存在不同值。请输入要保留的编号：\n${choices}`, '0');
        if (answer == null) return showStatus('已取消归并，当前草稿保持不变。');
        const choiceIndex = Number(answer);
        if (!Number.isInteger(choiceIndex) || choiceIndex < 0 || choiceIndex > removing.length) return showStatus('归并未执行：保留值编号无效。', 'error');
        valueChoices[conflict.field] = choiceIndex === 0 ? 'keep' : removing[choiceIndex - 1].data_ref;
      }
      const impactCount = preview.details.impacts.reduce((sum, item) => sum + item.behaviorLinks + item.sourceRelations + item.fieldReferences, 0);
      if (!window.confirm(`将${removing.length + 1}个同名数据归并为当前对象“${keep.data_name}”，涉及${impactCount}项关系或引用。归并副本校验通过后才会替换草稿。确定继续吗？`)) return;
      return runGraphCommand({
        type: 'merge_data_objects',
        keepRef: keep.data_ref,
        removeRefs: removing.map(item => item.data_ref),
        valueChoices
      }, { prevalidate: true, failureLabel: '同名数据归并', successLabel: `已归并同名数据“${keep.data_name}”` });
    }

    function focusEditorTarget(target = {}) {
      const focusKind = text(target.focusKind);
      const focusRef = text(target.focusRef);
      const focusPaths = [...new Set([
        text(target.focusPath),
        ...(Array.isArray(target.focusPaths) ? target.focusPaths.map(text) : [])
      ].filter(Boolean))];
      if (focusKind === 'call') {
        showStatus('部门内调用仅用于预览，请在MDM平台正式功能中维护。');
        return;
      }
      diagramExpanded = false;
      const governanceStep = globalThis.GovernanceWorkflow.stepForTarget(target);
      activeGovernanceStep = governanceStep;
      activeStepView = defaultStepView(governanceStep);
      activeWorkspaceTab = governanceStep === 'skeleton' ? 'flow' : governanceStep === 'data' ? 'data' : 'editor';
      activeEditorSection = EDITOR_SECTIONS.some(item => item.value === target.editorSection)
        ? target.editorSection
        : 'process';
      if (PROCESS_SECTIONS.some(item => item.value === target.processSection)) {
        activeProcessSection = target.processSection;
      }
      if (focusKind === 'behavior') {
        activeEditorSection = 'process';
        activeProcessSection = 'behaviors';
        activeBehaviorRef = focusRef;
        if (governanceStep === 'skeleton') {
          const item = currentDocument()?.behaviors?.find(value => value.behavior_ref === focusRef);
          graphSelection = item ? { kind: 'behavior', ref: focusRef, draft: clone(item) } : null;
          activeStepView = 'diagram';
        } else {
          activeStepView = 'behaviors';
        }
      } else if (focusKind === 'relation') {
        activeEditorSection = 'process';
        activeProcessSection = 'relations';
        activeRelationRef = focusRef;
        if (governanceStep === 'skeleton') {
          const item = currentDocument()?.flow_relations?.find(value => value.relation_ref === focusRef);
          graphSelection = item ? { kind: 'relation', ref: focusRef, draft: clone(item) } : null;
          activeStepView = 'diagram';
        } else {
          activeStepView = 'relations';
        }
      } else if (focusKind === 'data') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = focusRef;
        activeStepView = 'data';
      } else if (focusKind === 'form') {
        activeEditorSection = 'forms';
        activeFormRef = focusRef;
        activeStepView = 'forms';
      } else if (focusKind === 'area') {
        activeEditorSection = 'forms';
        activeStepView = 'forms';
        const owner = currentDocument()?.forms?.find(form =>
          form.areas.some(area => area.area_ref === focusRef)
        );
        if (owner) {
          activeFormRef = owner.form_ref;
          activeAreaRef = focusRef;
        }
        const itemPath = focusPaths
          .map(path => path.match(/^forms\.(\d+)\.areas\.(\d+)\.items\.(\d+)\.(?:business_data_ref|value_origin_mode|source_links)/))
          .find(Boolean);
        if (itemPath) {
          activeFormItemRef = currentDocument()?.forms?.[Number(itemPath[1])]
            ?.areas?.[Number(itemPath[2])]?.items?.[Number(itemPath[3])]?.item_ref || '';
        }
      }
      render();
      requestAnimationFrame(() => {
        const card = Array.from(workspace.querySelectorAll('[data-focus-kind]')).find(item =>
          item.dataset.focusKind === focusKind && item.dataset.focusRef === text(focusRef)
        );
        const controls = Array.from(
          workspace.querySelectorAll('[data-bind], [data-focus-key], [data-list-bind]')
        ).filter(item =>
          focusPaths.includes(item.dataset.bind)
          || focusPaths.includes(item.dataset.focusKey)
          || focusPaths.includes(item.dataset.listBind)
        );
        controls.forEach(control => {
          const details = control.closest('details');
          if (details) details.open = true;
        });
        const focusTarget = controls.find(control => !control.disabled)
          || controls[0]
          || card
          || workspace.querySelector('.section');
        if (!focusTarget) return;
        workspace.querySelectorAll('.focused-card, .focused-control').forEach(item => {
          item.classList.remove('focused-card', 'focused-control');
          item.removeAttribute('aria-invalid');
        });
        if (controls.length) {
          controls.forEach(control => {
            void control.offsetWidth;
            control.classList.add('focused-control');
            control.setAttribute('aria-invalid', 'true');
          });
          if (!focusTarget.disabled) focusTarget.focus({ preventScroll: true });
        } else {
          focusTarget.classList.add('focused-card');
          focusTarget.setAttribute('tabindex', '-1');
          focusTarget.focus({ preventScroll: true });
        }
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (focusClearTimer) clearTimeout(focusClearTimer);
        focusClearTimer = setTimeout(() => {
          focusTarget.classList.remove('focused-card');
          controls.forEach(control => {
            control.classList.remove('focused-control');
            control.removeAttribute('aria-invalid');
          });
        }, 2900);
      });
    }

    function focusEditorItem(focusKind, focusRef) {
      focusEditorTarget({ focusKind, focusRef });
    }

    function focusExportWarning(element) {
      let focusPaths = [];
      try {
        const parsed = JSON.parse(element.dataset.focusPaths || '[]');
        if (Array.isArray(parsed)) focusPaths = parsed;

      const step = text(element.dataset.step);
      const view = text(element.dataset.view);
      const target = {

        focusRef: element.dataset.focusRef,
        focusPath: element.dataset.focusPath
      };

        const routed = {
          ...target,
          editorSection: step === 'action' ? 'process' : step === 'data' && view === 'forms' ? 'forms' : '',
          processSection: step === 'action' ? view : step === 'data' ? view : ''

        focusEditorTarget(routed);

      try {

        } else {
          const area = document.createElement('textarea');
          area.value = line;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          if (!document.execCommand('copy')) throw new Error('copy unavailable');
          area.remove();
        }
        showStatus('交接摘要已复制。', 'success');

    function sortableCollection(kind) {
      const definitions = {
        behavior: { collectionKey: 'behaviors', refKey: 'behavior_ref', label: '业务行为', setActive: ref => { activeBehaviorRef = ref; } },
        relation: { collectionKey: 'flow_relations', refKey: 'relation_ref', label: '流程关系', setActive: ref => { activeRelationRef = ref; } },
        data: { collectionKey: 'data_objects', refKey: 'data_ref', label: '输出物与数据', setActive: ref => { activeDataRef = ref; } },
        term: { collectionKey: 'terms', refKey: 'term_ref', label: '术语', setActive: ref => { activeTermRef = ref; } }
      };
      const definition = definitions[kind];
      const collection = definition ? currentDocument()?.[definition.collectionKey] : null;
      return definition && Array.isArray(collection) ? { ...definition, collection } : null;
    }

    function sortableRows(kind) {
      return Array.from(workspace.querySelectorAll(`.selector-row[data-sort-kind="${CSS.escape(kind)}"]`));
    }

    function clearSortableIndicators() {
      workspace.querySelectorAll('.sortable-dragging, .sortable-target-before, .sortable-target-after').forEach(row => {
        row.classList.remove('sortable-dragging', 'sortable-target-before', 'sortable-target-after');
      });
      workspace.querySelectorAll('.selector-drag-handle[aria-pressed="true"]').forEach(handle => {
        handle.setAttribute('aria-pressed', 'false');
      });
    }

    function showSortableTarget() {
      const state = sortableDragState;
      if (!state) return;
      clearSortableIndicators();
      state.handle.setAttribute('aria-pressed', 'true');
      state.row.classList.add('sortable-dragging');
      if (state.targetIndex === state.originalIndex) return;
      const rows = sortableRows(state.kind);
      const targetRow = rows[state.targetIndex];
      if (!targetRow) return;
      targetRow.classList.add(state.targetIndex < state.originalIndex ? 'sortable-target-before' : 'sortable-target-after');
    }

    function beginSortableDrag(handle, inputMode, pointerId = null) {
      const kind = text(handle.dataset.dragHandle);
      const itemRef = text(handle.dataset.ref);
      const definition = sortableCollection(kind);
      const row = handle.closest('.selector-row');
      if (!definition || !row) return false;
      const originalIndex = definition.collection.findIndex(item => text(item?.[definition.refKey]) === itemRef);
      if (originalIndex < 0) return false;
      sortableDragState = {
        kind,
        itemRef,
        definition,
        originalIndex,
        targetIndex: originalIndex,
        row,
        handle,
        inputMode,
        pointerId,
        selector: row.closest('.record-selector')
      };
      definition.setActive(itemRef);
      if (pointerId != null && handle.setPointerCapture) handle.setPointerCapture(pointerId);
      showSortableTarget();
      showStatus(`正在调整第${originalIndex + 1}项${definition.label}。`);
      return true;
    }

    function moveSortableTarget(targetIndex) {
      const state = sortableDragState;
      if (!state) return;
      const nextIndex = Math.max(0, Math.min(state.definition.collection.length - 1, targetIndex));
      if (nextIndex === state.targetIndex) return;
      state.targetIndex = nextIndex;
      showSortableTarget();
      showStatus(`将${state.definition.label}移动到第${nextIndex + 1}项；确认前不会修改草稿。`);
    }

    function sortableTargetFromPointer(clientX, clientY) {
      const state = sortableDragState;
      if (!state) return;
      const selector = state.selector;
      if (selector) {
        const bounds = selector.getBoundingClientRect();
        const edge = Math.min(48, bounds.height / 4);
        if (clientY < bounds.top + edge) selector.scrollBy({ top: -24, behavior: 'auto' });
        if (clientY > bounds.bottom - edge) selector.scrollBy({ top: 24, behavior: 'auto' });
      }
      const hit = document.elementFromPoint(clientX, clientY)?.closest('.selector-row');
      if (!hit || hit.dataset.sortKind !== state.kind) return;
      const rows = sortableRows(state.kind);
      const hitIndex = rows.indexOf(hit);
      if (hitIndex < 0) return;
      const bounds = hit.getBoundingClientRect();
      const insertionIndex = hitIndex + (clientY > bounds.top + bounds.height / 2 ? 1 : 0);
      const targetIndex = insertionIndex > state.originalIndex ? insertionIndex - 1 : insertionIndex;
      moveSortableTarget(targetIndex);
    }

    function finishSortableDrag(commit) {
      const state = sortableDragState;
      if (!state) return;
      const changed = commit && state.targetIndex !== state.originalIndex;
      clearSortableIndicators();
      sortableDragState = null;
      if (!changed) {
        showStatus(commit ? '顺序未变化，草稿没有新增修改。' : '已取消调整顺序，草稿没有新增修改。');
        state.handle.focus({ preventScroll: true });
        return;
      }
      const [item] = state.definition.collection.splice(state.originalIndex, 1);
      state.definition.collection.splice(state.targetIndex, 0, item);
      state.definition.setActive(state.itemRef);
      touch();
      render();
      requestAnimationFrame(() => {
        workspace.querySelector(`.selector-drag-handle[data-drag-handle="${CSS.escape(state.kind)}"][data-ref="${CSS.escape(state.itemRef)}"]`)?.focus({ preventScroll: true });
      });
      showStatus(`${state.definition.label}已移动到第${state.targetIndex + 1}项。技术标识和关联关系保持不变。`, 'success');
    }

          <p class="relation-guidance-example">例：部门负责人审核报销单。审核通过 → 使用顺序关系进入财务复核；审核不通过 → 使用流程内部回路退回申请人补充材料。财务复核仍是普通业务行为。</p>
        </aside>`;
      const selector = currentDocument().flow_relations.length
        ? currentDocument().flow_relations.map((relation, relationIndex) =>
            orderedSelectorRow(
              'relation',
              relation.relation_ref,
              relationIndex,
              currentDocument().flow_relations.length,
              '流程关系',
              relationSelectorLabel(relation, relationIndex),
              activeRelationRef
            )
          ).join('')
        : '<span class="technical-note">尚未添加流程关系。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="relation" data-focus-ref="${escapeAttribute(item.relation_ref)}">
            <div class="item-title">
              <strong>流程关系 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-relation" data-index="${index}">删除当前关系</button>
            </div>
            <div class="grid">
              ${actionOnly ? `<div class="field wide"><span class="field-label">关系骨架（只读）</span><div class="inline-note">${escapeHtml(relationSelectorLabel(item, index))}<br><button class="button small" style="margin-top:8px" data-action="governance-jump" data-step="skeleton" data-view="diagram" data-focus-kind="relation" data-focus-ref="${escapeAttribute(item.relation_ref)}">返回流程骨架修改</button></div></div>` : `${field(`flow_relations.${index}.relation_type`, '关系类型', {
                type: 'select',
                options: RELATION_TYPES,
                hint: '默认继续下一步选择“顺序”；按判断结果进入后续步骤选择“判断分支”；退回前序步骤选择“流程内部回路”；同时启动或汇合多条路线选择“并行路线”。'
              })}
              ${behaviorSelect(`flow_relations.${index}.from_behavior_ref`, '从哪个行为开始', { blankLabel: '请选择' })}
              ${behaviorSelect(`flow_relations.${index}.to_behavior_ref`, '流向哪个行为')}`}
              ${field(`flow_relations.${index}.condition`, '判断分支条件或回路触发条件（顺序关系可不填）', { type: 'textarea', className: 'half' })}
            </div>
          </div>
        </div>` : `
        <div class="record-editor">${emptyList('尚未添加流程关系。点击“添加流程关系”开始编制。')}</div>`;
      const workbench = `
        <div class="record-workbench">
          <aside class="record-selector" aria-label="流程关系列表">${selector}</aside>
          ${editor}
        </div>`;
      return section(
        actionOnly ? '判断、退回与并行条件' : '流程关系',
        actionOnly
          ? '本步骤只维护关系条件和异常规则。关系类型、起点和终点回到“流程骨架”修改。'
          : '一次只编辑一条流程关系。左侧顺序只用于整理条目，不代表流程先后关系。',
        `${guidance}${workbench}`,
        '<button class="button small" data-action="add-relation">添加流程关系</button>'
      );
    }

    function behaviorOptions(includeEmpty = false) {
      const owner = currentExecutionDepartment();
      const values = (currentDocument()?.behaviors || []).map((behavior, index) => {
        const mode = actorAssignmentMode(behavior);
        const parsed = parseActorRole(behavior.current_actor_role);
        const department = mode === 'company_wide'
          ? '全公司通用'
          : mode === 'dynamic_from_data'
            ? '运行时责任部门'
            : parsed.department || '执行部门待选择';
        const crossDepartment = mode === 'fixed_department'
          && owner
          && parsed.department
          && parsed.department !== owner
          && parsed.department !== '全公司';
        return {
          value: behavior.behavior_ref,
          label: `${index + 1}. ${department}${crossDepartment ? '（跨部门）' : ''} · ${behavior.behavior_name || '未命名行为'}`
        };
      });
      return includeEmpty ? [{ value: '', label: '请选择' }, ...values] : values;
    }

    function dataOptions(includeEmpty = true) {
      const values = (currentDocument()?.data_objects || []).map((item, index) => ({
        value: item.data_ref,
        label: dataSelectorLabel(item, index)
      }));
      return includeEmpty ? [{ value: '', label: '暂不选择' }, ...values] : values;
    }

    function dataBehaviorLinksEditor(item, dataIndex) {
      const rows = (item.behavior_links || []).map((link, linkIndex) => `
        <div class="item-card" data-focus-path="data_objects.${dataIndex}.behavior_links.${linkIndex}">
          <div class="grid">
            ${field(`data_objects.${dataIndex}.behavior_links.${linkIndex}.behavior_ref`, '业务行为', {
              type: 'select', options: behaviorOptions()
            })}
            ${field(`data_objects.${dataIndex}.behavior_links.${linkIndex}.operation`, '对数据的操作', {
              type: 'select', options: DATA_OPERATIONS
            })}
          </div>
          <button class="button danger small" data-action="remove-data-behavior-link" data-index="${linkIndex}" data-data-index="${dataIndex}">删除关系</button>
        </div>`).join('');
      return `
        <div class="field wide">
          <span class="field-label">业务行为与数据的关系</span>
          <div class="inline-note">一项数据最多确认一个“创建”行为，可以有多个“更新”和“使用”行为。系统不会根据表单或名称自动生成关系。</div>
          ${rows || emptyList('尚未登记创建、更新或使用关系。')}
          <button class="button small" data-action="add-data-behavior-link" data-data-index="${dataIndex}">添加行为关系</button>
        </div>`;
    }

    function dataSourceRelationsEditor(item, dataIndex) {
      const rows = (item.source_relations || []).map((source, sourceIndex) => `
        <div class="item-card" data-focus-path="data_objects.${dataIndex}.source_relations.${sourceIndex}">
          <div class="grid">
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_department`, '来源部门', {
              type: 'select', options: [{ value: '', label: '待补充' }, ...DEPARTMENTS.map(value => ({ value, label: value }))]
            })}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_process_name`, '来源流程名称')}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_behavior_name`, '来源行为名称')}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_data_name`, '来源数据名称')}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.availability_mode`, '在当前流程何时可用', {
              type: 'select',
              options: [
                { value: 'pending_confirmation', label: '待确认' },
                { value: 'process_start', label: '流程开始前已可用' },
                { value: 'at_behavior', label: '到指定业务行为时可用' }
              ]
            })}
            ${source.availability_mode === 'at_behavior'
              ? field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.available_from_behavior_ref`, '可用位置', {
                  type: 'select', options: behaviorOptions(true), nullable: true
                })
              : ''}
          </div>
          <button class="button danger small" data-action="remove-data-source" data-index="${sourceIndex}" data-data-index="${dataIndex}">删除来源线索</button>
        </div>`).join('');
      return `
        <div class="field wide">
          <span class="field-label">其他流程或外部来源线索</span>
          <div class="inline-note">这里记录线索，不绑定其他流程文件，也不判断权威源。来源部门、流程和行为可以暂缺，页面会逐项提示。</div>
          ${rows || emptyList('没有来源线索。本流程本地创建的数据可以不填写。')}
          <button class="button small secondary" data-action="add-data-source" data-data-index="${dataIndex}">添加来源线索</button>
        </div>`;
    }

    function dataFieldReferenceCount(fieldRef) {
      let count = 0;
      (currentDocument()?.forms || []).forEach(form => (form.areas || []).forEach(area =>
        (area.items || []).forEach(item => { if (item.data_field_ref === fieldRef) count += 1; })
      ));
      return count;
    }

    function dataFieldsEditor(item, dataIndex) {
      const rows = (item.fields || []).map((dataField, fieldIndex) => {
        const fieldPath = `data_objects.${dataIndex}.fields.${fieldIndex}`;
        const referenceCount = dataFieldReferenceCount(dataField.field_ref);
        return `
          <tr>
            <td>${fieldIndex + 1}</td>
            <td>${field(`${fieldPath}.field_name`, '对象字段名称')}</td>
            <td>${formItemTypeField(`${fieldPath}.field_type`, dataField.field_type)}</td>
            <td>${field(`${fieldPath}.definition`, '业务定义', { type: 'textarea' })}</td>
            <td>${referenceCount ? `${referenceCount}处引用` : '未引用'}</td>
            <td><button class="button danger small" data-action="remove-data-field" data-data-index="${dataIndex}" data-index="${fieldIndex}">删除</button></td>
          </tr>`;
      }).join('');
      return `
        <div class="field wide" data-focus-path="data_objects.${dataIndex}.fields">
          <span class="field-label">数据对象字段明细</span>
          <div class="inline-note">先在数据对象下统一定义字段名称、数据类型和业务含义。实际表单引用这些字段，只补充表单显示名称、必填条件、填写说明和排列顺序。</div>
          <div class="form-field-table-shell">
            <table class="form-field-table data-object-field-table">
              <colgroup><col style="width:54px"><col style="width:230px"><col style="width:150px"><col style="width:360px"><col style="width:110px"><col style="width:80px"></colgroup>
              <thead><tr><th>序号</th><th>对象字段名称</th><th>数据类型</th><th>业务定义</th><th>表单引用</th><th>删除</th></tr></thead>
              <tbody>${rows || '<tr><td colspan="6">尚未建立对象字段。旧表单迁移时，系统会在同一数据对象内按字段名称和数据类型自动归并。</td></tr>'}</tbody>
            </table>
          </div>
          <button class="button small" data-action="add-data-field" data-data-index="${dataIndex}">添加对象字段</button>
        </div>`;
    }

    function renderDataObjectFieldCatalog() {
      const active = ensureActiveDataObject();
      const item = active.item;
      const index = active.index;
      const selector = currentDocument().data_objects.length
        ? currentDocument().data_objects.map((dataObject, dataIndex) =>
            orderedSelectorRow(
              'data', dataObject.data_ref, dataIndex, currentDocument().data_objects.length,
              '数据对象', dataSelectorLabel(dataObject, dataIndex), activeDataRef
            )
          ).join('')
        : '<span class="technical-note">尚未登记数据对象。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="data" data-focus-ref="${escapeAttribute(item.data_ref)}">
            <div class="item-title"><strong>当前数据对象定义</strong></div>
            <div class="grid">
              ${field(`data_objects.${index}.data_name`, '数据对象名称')}
              ${field(`data_objects.${index}.information_type`, '信息类型', {
                type: 'select',
                options: INFORMATION_TYPE_OPTIONS,
                hint: '对象字段引用只在当前单流程内有效，不形成企业级字段身份或主数据认定。'
              })}
              ${field(`data_objects.${index}.description`, '数据对象说明', { type: 'textarea', className: 'wide' })}
              ${dataFieldsEditor(item, index)}
            </div>
          </div>
        </div>` : `<div class="record-editor">${emptyList('先登记数据对象，再建立字段明细。')}</div>`;
      const body = `<div class="record-workbench"><aside class="record-selector" aria-label="数据对象列表">${selector}</aside>${editor}</div>`;
      return section(
        '1. 数据对象与字段明细',
        '先统一定义数据对象、字段名称、数据类型和业务定义；再在下方实际表单的主表或明细表中引用。',
        body,
        '<button class="button small" data-action="add-data">登记数据对象</button>'
      );
    }

    function renderDataObjects() {
      const active = ensureActiveDataObject();
      const item = active.item;
      const index = active.index;
      const selector = currentDocument().data_objects.length
        ? currentDocument().data_objects.map((dataObject, dataIndex) =>
            orderedSelectorRow(
              'data', dataObject.data_ref, dataIndex, currentDocument().data_objects.length,
              '输出物与数据', dataSelectorLabel(dataObject, dataIndex), activeDataRef
            )
          ).join('')
        : '<span class="technical-note">尚未登记数据对象。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="data" data-focus-ref="${escapeAttribute(item.data_ref)}">
            <div class="item-title">
              <strong>信息输出或数据 ${index + 1}</strong>
              <div class="item-actions">
                ${text(item.data_name).trim() && currentDocument().data_objects.some(other => other !== item && text(other.data_name).trim() === text(item.data_name).trim())
                  ? `<button class="button secondary small" data-action="merge-duplicate-data" data-index="${index}">归并同名数据</button>`
                  : ''}
                <button class="button danger small" data-action="remove-data" data-index="${index}">删除当前数据</button>
              </div>
            </div>
            <div class="grid">
              ${field(`data_objects.${index}.data_name`, '数据名称')}
              ${field(`data_objects.${index}.information_type`, '信息类型', {
                type: 'select',
                options: INFORMATION_TYPE_OPTIONS,
                hint: '示例只用于帮助判断类型，不会写入下载的结构化文件。'
              })}
              ${field(`data_objects.${index}.description`, '数据说明', { type: 'textarea', className: 'wide' })}
              <div class="field wide">
                <span class="field-label">对象字段</span>
                <div class="inline-note">当前已定义${(item.fields || []).length}个对象字段。字段定义统一在“表单、明细和字段”中维护。</div>
                <button class="button secondary small" data-action="switch-process-section" data-section="forms">维护对象字段</button>
              </div>
              ${dataBehaviorLinksEditor(item, index)}
              ${dataSourceRelationsEditor(item, index)}
            </div>
          </div>
        </div>` : `<div class="record-editor">${emptyList('尚未登记数据对象。点击“登记数据对象”开始编制。')}</div>`;
      const body = `<div class="record-workbench"><aside class="record-selector" aria-label="输出物与数据列表">${selector}</aside>${editor}</div>`;
      return section(
        '输出物与数据使用',
        '这里只结构化信息输出。实物和服务结果写在业务行为的完成标准中；需要追溯时，登记其记录或数据。3001不判断主数据、权威源、数据责任和质量规则。',
        body,
        '<button class="button small" data-action="add-data">登记数据对象</button>'
      );
    }

    function relatedFormFields(dataRef) {
      const results = [];
      (currentDocument()?.forms || []).forEach((form, formIndex) => (form.areas || []).forEach((area, areaIndex) =>
        (area.items || []).forEach((item, itemIndex) => {
          const ownership = item.business_data_ref === dataRef;
          const sourceRoles = (item.source_links || [])
            .filter(link => link.source_data_ref === dataRef)
            .map(link => FIELD_SOURCE_ROLES.find(option => option.value === link.source_role)?.label || link.source_role);
          if (!ownership && !sourceRoles.length) return;
          results.push({ form, formIndex, area, areaIndex, item, itemIndex, ownership, sourceRoles });
        })
      ));
      return results;
    }

    function renderRelationshipOverview() {
      const rows = (currentDocument()?.data_objects || []).map((item, index) => {
        const links = operation => (item.behavior_links || []).filter(link => link.operation === operation).map(link => behaviorLabel(link.behavior_ref));
        const sources = (item.source_relations || []).map(source =>
          [source.source_department, source.source_process_name, source.source_behavior_name, source.source_data_name].map(text).filter(Boolean).join(' / ') || '来源待补充'
        );
        const fields = relatedFormFields(item.data_ref);
        const pendingCount = (item.information_type === 'pending_confirmation' ? 1 : 0)
          + (item.behavior_links || []).filter(link => link.operation === 'pending_confirmation').length
          + (item.source_relations || []).filter(source => source.availability_mode === 'pending_confirmation').length
          + fields.filter(fieldItem => fieldItem.item.value_origin_mode === 'pending_confirmation').length;
        return `
          <details class="nested" data-focus-kind="data" data-focus-ref="${escapeAttribute(item.data_ref)}">
            <summary><strong>${index + 1}. ${escapeHtml(item.data_name || '未命名数据')}</strong> · ${escapeHtml(INFORMATION_TYPES.find(option => option.value === item.information_type)?.label || '类型待确认')} · ${pendingCount ? `${pendingCount}项待确认` : '关系已登记'}</summary>
            <div class="grid" style="margin-top:12px">
              <div class="inline-note"><strong>来源：</strong>${escapeHtml(sources.length ? sources.join('；') : '本流程本地创建或来源未登记')}</div>
              <div class="inline-note"><strong>创建：</strong>${escapeHtml(links('create').join('、') || '未登记')}</div>
              <div class="inline-note"><strong>更新：</strong>${escapeHtml(links('update').join('、') || '未登记')}</div>
              <div class="inline-note"><strong>使用：</strong>${escapeHtml(links('use').join('、') || '未登记')}</div>
              <div class="inline-note wide"><strong>表单与字段：</strong>${escapeHtml(fields.length ? fields.map(fieldItem => `${fieldItem.form.form_name || '未命名表单'} / ${fieldItem.item.item_name || '未命名字段'}${fieldItem.ownership ? '（归属）' : ''}${fieldItem.sourceRoles.length ? `（${fieldItem.sourceRoles.join('、')}）` : ''}`).join('；') : '未关联')}</div>
            </div>
            <button class="button secondary small" data-action="open-data-from-overview" data-ref="${escapeAttribute(item.data_ref)}">返回输出物与数据编辑</button>
          </details>`;
      }).join('');
      return section(
        '数据与表单关系总览',
        '按数据查看来源、创建、更新、使用以及表单字段关系。这里仅供核对，编辑仍回到“输出物与数据”或“表单与记录”。',
        rows || emptyList('尚未登记数据对象。')
      );
    }

    function bulkKindLabel(kind) {
      return globalThis.BulkDataEditor?.TABLES?.[kind]?.label || '批量数据';
    }

    function bulkActionLabel(action) {
      return { add: '新增', update: '修改', delete: '删除' }[action] || action;
    }

    function renderBulkPreview() {
      const preview = bulkDataEditorState.preview;
      if (!preview) return '<div class="bulk-preview-empty">尚未预览。粘贴后先检查差异，页面不会直接修改当前流程。</div>';
      const summary = preview.summary || { added: 0, updated: 0, deleted: 0, unchanged: 0 };
      const currentKey = currentDocument() ? globalThis.GraphEditorState.fingerprint(currentDocument()) : '';
      const stale = Boolean(bulkDataEditorState.documentKey && bulkDataEditorState.documentKey !== currentKey);
      const errors = (preview.errors || []).map(item => `<li><strong>${item.row ? `第${item.row}行` : '整体检查'}${item.column ? ` · ${escapeHtml(item.column)}` : ''}</strong>：${escapeHtml(item.message)}</li>`).join('');
      const warnings = (preview.warnings || []).map(item => `<li><strong>${item.row ? `第${item.row}行` : '整体提醒'}${item.column ? ` · ${escapeHtml(item.column)}` : ''}</strong>：${escapeHtml(item.message)}</li>`).join('');
      const diffRows = (preview.diff || []).map(item => {
        const changes = (item.changes || []).map(change => `${change.label}：${change.before || '空白'} → ${change.after || '空白'}`).join('；');
        return `<tr><td>${item.row || '-'}</td><td><span class="bulk-action-badge ${escapeAttribute(item.action)}">${escapeHtml(bulkActionLabel(item.action))}</span></td><td>${escapeHtml(item.label || item.ref)}</td><td><code>${escapeHtml(item.ref)}</code></td><td>${escapeHtml(changes || (item.action === 'delete' ? '删除整条记录' : '新增整条记录'))}</td></tr>`;
      }).join('');
      return `<div class="bulk-preview${preview.ok && !stale ? ' ready' : ' blocked'}">
        <div class="bulk-summary" aria-label="批量变更摘要">
          <span><strong>${summary.added}</strong>新增</span>
          <span><strong>${summary.updated}</strong>修改</span>
          <span><strong>${summary.deleted}</strong>删除</span>
          <span><strong>${summary.unchanged}</strong>不变</span>
        </div>
        ${stale ? '<div class="inline-warning"><strong>预览已失效。</strong>当前流程在预览后发生过修改，请重新预览。</div>' : ''}
        ${errors ? `<div class="bulk-message-list error"><strong>整批未通过，不会修改当前流程</strong><ol>${errors}</ol></div>` : ''}
        ${warnings ? `<div class="bulk-message-list warning"><strong>应用前需要核对</strong><ol>${warnings}</ol></div>` : ''}
        ${diffRows ? `<div class="bulk-diff-shell"><table class="bulk-diff-table"><thead><tr><th>表格行</th><th>动作</th><th>记录</th><th>技术标识</th><th>差异</th></tr></thead><tbody>${diffRows}</tbody></table></div>` : preview.ok ? '<div class="step-check-clear"><strong>没有数据差异</strong><span>当前粘贴内容与流程中的记录一致，无需应用。</span></div>' : ''}
      </div>`;
    }

    function renderBulkDataEditor() {
      const kind = bulkDataEditorState.kind;
      const preview = bulkDataEditorState.preview;
      const summary = preview?.summary || {};
      const changeCount = Number(summary.added || 0) + Number(summary.updated || 0) + Number(summary.deleted || 0);
      const currentKey = currentDocument() ? globalThis.GraphEditorState.fingerprint(currentDocument()) : '';
      const canApply = Boolean(preview?.ok && changeCount && bulkDataEditorState.documentKey === currentKey);
      const kindButtons = ['objects', 'fields', 'relations'].map(value => `<button class="button small step-view-button${kind === value ? ' active' : ''}" data-action="switch-bulk-kind" data-kind="${value}">${escapeHtml(bulkKindLabel(value))}</button>`).join('');
      const guidance = {
        objects: '一行表示一个数据对象。已有记录保留技术标识；新增记录的标识留空。',
        fields: '一行表示一个对象字段。优先填写数据对象标识；只填名称时，名称必须唯一。',
        relations: '一行表示一条数据行为关系。优先填写数据对象和业务行为标识，避免重名误连。'
      }[kind];
      return section(
        'Excel / WPS批量编辑',
        '复制固定列头或当前数据到Excel/WPS，编辑后整块复制并粘贴到下方。页面先解析、核对引用并显示差异；只有点击“一次应用”才修改当前流程。',
        `<div class="bulk-editor">
