      return section(
        '跨部门承接',
        '这里继续编辑业务行为中创建的承接记录。主流程指定输入、完成标准、返回输出和恢复位置；目标步骤可以暂缺，但承接部门必须明确。',
        items || emptyList('尚未添加跨部门承接。'),
        '<button class="button small" data-action="add-handoff">添加跨部门承接</button>'
      );
    }

    function renderForms() {
      const active = ensureActiveForm();
      if (!active.form) {
        return section(
          '表单与记录',
          '表单与记录在独立工作区中维护。新增后先编制主表，再按需要增加多张明细表。',
          emptyList('当前流程没有表单或记录。'),
          '<button class="button small" data-action="add-form">添加表单或记录</button>'
        );
      }

      const { form, formIndex, area, areaIndex } = active;
      const mainAreas = form.areas.filter(item => item.area_type === '基本信息');
      const unresolvedAreas = form.areas.filter(item => !item.area_type);
      const structureWarnings = [];
      if (!mainAreas.length) structureWarnings.push('当前表单尚未设置主表结构。');
      if (mainAreas.length > 1) structureWarnings.push(`当前表单包含 ${mainAreas.length} 个主表结构，请将多余结构改为明细表。`);
      if (unresolvedAreas.length) structureWarnings.push(`当前表单有 ${unresolvedAreas.length} 个结构尚未确认是主表还是明细表。`);
      const warningHtml = structureWarnings.length
        ? `<div class="form-structure-warning">${structureWarnings.map(escapeHtml).join('<br>')}3001会保留现有内容，不会自动改写。</div>`
        : '';

      const formSelector = currentDocument().forms.map((item, index) => `
        <button
          class="selector-button${item.form_ref === form.form_ref ? ' active' : ''}"
          data-action="select-form"
          data-ref="${escapeAttribute(item.form_ref)}"
        >${index + 1}. ${escapeHtml(item.form_name || '未命名表单或记录')}</button>
      `).join('');

      let detailNumber = 0;
      let mainNumber = 0;
      const structureSelector = form.areas.map(item => {
        let prefix = '待确认结构';
        if (item.area_type === '基本信息') {
          mainNumber += 1;
          prefix = mainAreas.length > 1 ? `主表结构 ${mainNumber}` : '主表结构';
        } else if (item.area_type === '明细清单') {
          detailNumber += 1;
          prefix = `明细表结构 ${detailNumber}`;
        }
        return `
          <button
            class="structure-button${item.area_ref === area?.area_ref ? ' active' : ''}"
            data-action="select-area"
            data-ref="${escapeAttribute(item.area_ref)}"
          >${escapeHtml(prefix)}：${escapeHtml(item.area_title || '标题待填写')}</button>`;
      }).join('');

      const structureActions = `
        ${mainAreas.length ? '' : `<button class="button small" data-action="add-main-area" data-form-index="${formIndex}">建立主表结构</button>`}
        <button class="button small" data-action="add-detail-area" data-form-index="${formIndex}">添加明细表结构</button>`;

      let areaEditor = emptyList('当前表单尚未建立主表或明细表结构。');
      if (area) {
        const kindLabel = area.area_type === '基本信息'
          ? '主表'
          : area.area_type === '明细清单'
            ? '明细表'
            : '待确认结构';
        const formItems = area.items.map((item, itemIndex) => `
          <div class="nested">
            <div class="item-title">
              <strong>填写项 ${itemIndex + 1}</strong>
              <button class="button danger small" data-action="remove-form-item" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}">删除填写项</button>
            </div>
            <div class="grid">
              ${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.item_name`, '填写项名称')}
              ${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.item_type`, '填写项类型')}
              ${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.required`, '是否必填', { type: 'checkbox', checkboxLabel: '此填写项必须填写' })}
              ${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.instructions`, '填写说明', { type: 'textarea', className: 'wide' })}
            </div>
          </div>`).join('');
        areaEditor = `
          <div class="item-card">
            <div class="item-title">
              <strong>${escapeHtml(kindLabel)}</strong>
              ${area.area_type === '基本信息' ? '' : `<button class="button danger small" data-action="remove-area" data-form-index="${formIndex}" data-index="${areaIndex}">删除当前结构</button>`}
            </div>
            <div class="grid">
              ${field(`forms.${formIndex}.areas.${areaIndex}.area_type`, '结构类型', {
                type: 'select',
                options: [
                  { value: '', label: '待确认' },
                  { value: '基本信息', label: '主表' },
                  { value: '明细清单', label: '明细表' }
                ]
              })}
              ${field(
                `forms.${formIndex}.areas.${areaIndex}.area_title`,
                area.area_type === '基本信息' ? '主表标题' : area.area_type === '明细清单' ? '明细表标题' : '结构标题'
              )}
            </div>
            <div style="margin-top:12px">${formItems || emptyList(`当前${kindLabel}还没有填写项。`)}</div>
            <button class="button small" style="margin-top:12px" data-action="add-form-item" data-form-index="${formIndex}" data-area-index="${areaIndex}">添加填写项</button>
          </div>`;
      }

      const body = `
        ${warningHtml}
        <div class="form-workbench">
          <aside class="form-sidebar">
            ${formSelector}
            <button class="button small" data-action="add-form">添加表单或记录</button>
          </aside>
          <div class="form-editor">
            <div class="item-card">
              <div class="item-title">
                <strong>当前表单或记录</strong>
                <button class="button danger small" data-action="remove-form" data-index="${formIndex}">删除当前表单或记录</button>
              </div>
              <div class="grid">
                ${field(`forms.${formIndex}.form_name`, '表单或记录名称')}
                ${field(`forms.${formIndex}.form_no`, '表单或记录编号（如有）', { nullable: true })}
                ${behaviorSelect(`forms.${formIndex}.behavior_ref`, '关联业务行为（可选）')}
              </div>
            </div>
            <div class="structure-tabs">
              ${structureSelector || '<span class="technical-note">尚未建立表结构。</span>'}
              ${structureActions}
            </div>
            ${areaEditor}
          </div>
        </div>`;
      return section(
        '表单与记录',
        '一张表单或记录包含一张主表和零到多张明细表。表单与业务行为可以关联，但不是必填项。',
        body,
        '<button class="button small" data-action="add-form">添加表单或记录</button>'
      );
    }

    function renderTerms() {
      const items = currentDocument().terms.map((item, index) => `
        <div class="item-card">
          <div class="item-title">
            <strong>术语 ${index + 1}</strong>
            <button class="button danger small" data-action="remove-term" data-index="${index}">删除</button>
          </div>
          <div class="grid">
            ${field(`terms.${index}.term_name`, '术语名称')}
            ${field(`terms.${index}.definition`, '定义', { type: 'textarea', className: 'wide' })}
          </div>
        </div>`).join('');
      return section(
        '术语定义',
        '只记录本流程需要解释的业务术语。',
        items || emptyList('尚未添加术语。'),
        '<button class="button small" data-action="add-term">添加术语</button>'
      );
    }

    function renderProcessEditor() {
      const content = {
        behaviors: renderBehaviors,
        relations: renderRelations,
        data: renderDataObjects,
        handoffs: renderHandoffs
      }[activeProcessSection] || renderBehaviors;
      return `${renderProcessNavigation()}${content()}`;
    }

    function renderExportCheck() {
      const warnings = businessWarnings(currentDocument());
      const warningHtml = warnings.length
        ? `<div class="export-warning-list">
            <strong>当前草稿仍有 ${warnings.length} 项业务内容需要在PMO审核前确认：</strong>
            <ol>${warnings.map(item => `<li>${escapeHtml(item)}</li>`).join('')}</ol>
          </div>`
        : '<div class="notice">当前未发现待补业务内容。导出结果仍是未审核JSON，必须经过Codex预审和PMO线下批准后才能发放。</div>';
      const body = `
        ${warningHtml}
        <p class="boundary">3001导出前只阻止损坏的技术引用。业务内容尚未补齐时，用户仍可导出草稿并继续线下审核。</p>
        <button class="button secondary" data-action="export-current">导出当前流程</button>`;
      return section(
        '导出检查',
        '先查看待补内容，再导出当前这一条流程。导出不会把分区状态、流程图布局或花名册快照写入JSON。',
        body
      );
    }

    function renderEditorContent() {
      const renderSection = {
        basic: renderBasic,
        profile: renderProfile,
        terms: renderTerms,
        process: renderProcessEditor,
        forms: renderForms,
        export: renderExportCheck
      }[activeEditorSection] || renderBasic;
      return `${renderEditorNavigation()}${renderSection()}`;
    }

    function render() {
      destroyDiagram();
      const data = currentDocument();
      document.body.classList.toggle(
        'diagram-overlay-open',
        Boolean(data && activeWorkspaceTab === 'diagram' && diagramExpanded)
      );
      document.getElementById('exportButton').disabled = busy || !data;
      document.getElementById('clearButton').disabled = busy || !data;
      updateCandidateBar();
      if (!data) {
        diagramExpanded = false;
        document.body.classList.remove('diagram-overlay-open');
        activeWorkspaceTab = 'editor';
        workspace.innerHTML = `<div class="empty">
          <h2>从一条空白流程开始</h2>
          <p>点击“新建流程”后，直接填写流程、业务行为、执行岗位、跨部门承接和数据输出。3001暂不要求提供编制参考资料，也不要求填写制度编号。</p>
          <button class="button primary" data-action="new-process-inline">新建流程</button>
        </div>`;
        return;
      }
      const model = currentDiagramModel(data);
      workspace.innerHTML = `
        ${renderWorkspaceTabs(model)}
        <div
          class="tab-panel"
          id="editorPanel"
          role="tabpanel"
          aria-labelledby="editorTab"
          ${activeWorkspaceTab === 'editor' ? '' : 'hidden'}
        >
          ${renderPreviewGuidance(model)}
          ${renderEditorContent()}
        </div>
        <div
          class="tab-panel"
          id="diagramPanel"
          role="tabpanel"
          aria-labelledby="diagramTab"
          ${activeWorkspaceTab === 'diagram' ? '' : 'hidden'}
        >
          ${renderDiagramPanel(model)}
        </div>`;
      if (activeWorkspaceTab === 'diagram') requestAnimationFrame(mountDiagram);
    }

    function updateCandidateBar() {
      if (!candidates.length) {
        candidateBar.classList.remove('show');
        candidateSelect.innerHTML = '';
        candidateNote.textContent = '';
        return;
      }
      candidateBar.classList.add('show');
      candidateSelect.innerHTML = candidates.map((item, index) => {
        const name = item.data.process.process_name || `未命名流程 ${index + 1}`;
        const marker = item.dirty ? ' · 未导出修改' : '';
        return `<option value="${index}"${index === currentIndex ? ' selected' : ''}>${escapeHtml(`${index + 1}. ${name}${marker}`)}</option>`;
      }).join('');
      candidateNote.textContent = candidates.length > 1
        ? `本次导入拆出 ${candidates.length} 条候选流程，请逐一检查并分别导出。`
        : '当前页面只编辑并导出这一条流程。';
    }

    function syncRoles(data = currentDocument()) {
      (data?.behaviors || []).forEach(behavior => {
        if (!behavior.work_role) return;
        behavior.work_role.behavior_ref = behavior.behavior_ref;
        behavior.work_role.work_role_name = roleName(behavior.behavior_name, behavior.work_role.role_duty);
        behavior.work_role.assignment_status = behavior.work_role.work_role_code ? 'assigned' : 'pending_assignment';
      });
    }

    function refreshRoleName(index) {
      syncRoles();
      const target = document.querySelector(`[data-role-name="${index}"]`);
      if (target) target.textContent = currentDocument().behaviors[index].work_role?.work_role_name || '填写行为名称和角色职责后生成';
    }

    function addCandidate(data, dirty, origin) {
      candidates.push({ data: normalizeV1(data), dirty: Boolean(dirty), origin: origin || 'unknown' });
    }

    async function startNewProcess() {
      setBusy(true, '正在读取当前结构和空白模板……');
      try {
        await ensureCompatibleValidationService('再次新建流程');
        const data = await fetchEmptyProcessDocument();
        destroyDiagram();
        candidates = [{ data: normalizeV1(data), dirty: false, origin: 'new' }];
        currentIndex = 0;
        activeWorkspaceTab = 'editor';
        diagramExpanded = false;
        resetEditorNavigation('basic');
        openedPreviewProcesses.clear();
        clearStatus();
        render();
      } catch (error) {
        showStatus(`新建流程失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
      }
    }

    function clearPage() {
      destroyDiagram();
      candidates = [];
      currentIndex = 0;
      activeWorkspaceTab = 'editor';
      diagramExpanded = false;
      resetEditorNavigation('basic');
      openedPreviewProcesses.clear();
      clearStatus();
      render();
    }

    function addBehavior() {
      const behavior = {
        behavior_ref: newRef('behavior'),
        node_type: '',
        behavior_name: '',
        current_actor_role: '',
        trigger: '',
        precondition: '',
        input_description: '',
        timing: null,
        completion_standard: '',
        output_description: '',
        input_data_refs: [],
        output_data_refs: [],
        work_role: null,
        countersign_all_required: false,
        countersign_target_departments: []
      };
      currentDocument().behaviors.push(behavior);
      activeBehaviorRef = behavior.behavior_ref;
    }

    function addRelation() {
      currentDocument().flow_relations.push({
        relation_ref: newRef('relation'),
        relation_type: '',
        from_behavior_ref: null,
        to_behavior_ref: null,
        condition: '',
        join_mode: ''
      });
    }

    function addDataObject() {
      currentDocument().data_objects.push({
        data_ref: newRef('data'),
        data_name: '',
        description: '',
        governance_status: 'candidate',
        produced_by_behavior_ref: null,
        consumed_by_behavior_refs: []
      });
    }

    function addHandoff(sendBehaviorRef = null) {
      const handoff = {
        handoff_ref: newRef('handoff'),
        source_department: currentDocument().process.owning_department || currentDocument().export_meta.initiating_department || '',
        target_department: '',
        send_behavior_ref: sendBehaviorRef || null,
        receive_behavior_ref: null,
        input_data_ref: null,
        returned_data_ref: null,
        requested_matter: '',
        trigger_condition: '',
        completion_standard: '',
        target_process_ref: null,
        target_process_name: '',
        target_behavior_ref: null,
        target_behavior_name: '',
        return_behavior_ref: null
      };
      currentDocument().cross_department_handoffs.push(handoff);
      return handoff;
    }

    function addForm() {
      const mainArea = {
        area_ref: newRef('area'),
        area_type: '基本信息',
        area_title: '',
        items: []
      };
      const form = {
        form_ref: newRef('form'),
        behavior_ref: null,
        form_name: '',
        form_no: null,
        areas: [mainArea]
      };
      currentDocument().forms.push(form);
      activeFormRef = form.form_ref;
      activeAreaRef = mainArea.area_ref;
    }

    function addTerm() {
      currentDocument().terms.push({ term_ref: newRef('term'), term_name: '', definition: '' });
    }

    function removeBehavior(index) {
      const behavior = currentDocument().behaviors[index];
      if (!behavior) return false;
      const ref = behavior.behavior_ref;
      const internalCallCount = currentDocument().internal_process_calls.filter(item =>
        item.caller_behavior_ref === ref || item.return_behavior_ref === ref
      ).length;
      if (internalCallCount) {
        window.alert(`当前业务行为被${internalCallCount}条部门内调用预览信息引用。3001不编辑部门内调用，请保留该行为，或在MDM平台处理后重新导入。`);
        return false;
      }
      const linkedHandoffCount = currentDocument().cross_department_handoffs.filter(item => item.send_behavior_ref === ref).length;
      if (linkedHandoffCount && !window.confirm(`删除当前业务行为将同时删除${linkedHandoffCount}条由它发起的跨部门承接。确定继续吗？`)) {
        return false;
      }
      currentDocument().behaviors.splice(index, 1);
      if (activeBehaviorRef === ref) {
        activeBehaviorRef = currentDocument().behaviors[Math.min(index, currentDocument().behaviors.length - 1)]?.behavior_ref || '';
      }
      currentDocument().flow_relations = currentDocument().flow_relations.filter(item => item.from_behavior_ref !== ref && item.to_behavior_ref !== ref);
      currentDocument().data_objects.forEach(item => {
        if (item.produced_by_behavior_ref === ref) item.produced_by_behavior_ref = null;
        item.consumed_by_behavior_refs = item.consumed_by_behavior_refs.filter(value => value !== ref);
      });
      currentDocument().cross_department_handoffs = currentDocument().cross_department_handoffs.filter(item => item.send_behavior_ref !== ref);
      currentDocument().cross_department_handoffs.forEach(item => {
        if (item.return_behavior_ref === ref) item.return_behavior_ref = null;
      });
      currentDocument().forms.forEach(item => {
        if (item.behavior_ref === ref) item.behavior_ref = null;
      });
      return true;
    }

    function removeData(index) {
      const item = currentDocument().data_objects[index];
      if (!item) return false;
      const ref = item.data_ref;
      const internalCallCount = currentDocument().internal_process_calls.filter(call =>
        call.input_data_refs.includes(ref) || call.output_data_refs.includes(ref)
      ).length;
      if (internalCallCount) {
        window.alert(`当前数据被${internalCallCount}条部门内调用预览信息引用。3001不编辑部门内调用，请保留该数据，或在MDM平台处理后重新导入。`);
        return false;
      }
      currentDocument().data_objects.splice(index, 1);
      currentDocument().behaviors.forEach(behavior => {
        behavior.input_data_refs = behavior.input_data_refs.filter(value => value !== ref);
        behavior.output_data_refs = behavior.output_data_refs.filter(value => value !== ref);
      });
      currentDocument().cross_department_handoffs.forEach(handoff => {
        if (handoff.input_data_ref === ref) handoff.input_data_ref = null;
        if (handoff.returned_data_ref === ref) handoff.returned_data_ref = null;
      });
      return true;
    }

    function handleAction(action, element) {
      const index = Number(element.dataset.index);
      const formIndex = Number(element.dataset.formIndex);
      const areaIndex = Number(element.dataset.areaIndex);
      if (action === 'new-process-inline') return protect(startNewProcess);
      if (action === 'switch-tab') return setActiveWorkspaceTab(element.dataset.tab);
      if (action === 'view-diagram') return setActiveWorkspaceTab('diagram');
      if (action === 'return-editor') {
        activeEditorSection = 'process';
        return setActiveWorkspaceTab('editor');
      }
      if (action === 'fit-diagram') return diagramView?.fit();
      if (action === 'reset-diagram') return diagramView?.reset();
      if (action === 'toggle-diagram-example') {
        diagramExampleExpanded = !diagramExampleExpanded;
        return render();
      }
      if (action === 'toggle-diagram-expanded') {
        diagramExpanded = !diagramExpanded;
        return render();
      }
      if (action === 'focus-editor') return focusEditorItem(element.dataset.focusKind, element.dataset.focusRef);
      if (action === 'edit-linked-handoff') return focusEditorItem('handoff', element.dataset.ref);
      if (!currentDocument()) return;
      if (action === 'switch-editor-section') {
        activeEditorSection = EDITOR_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'basic';
        return render();
      }
      if (action === 'switch-process-section') {
        activeProcessSection = PROCESS_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'behaviors';
        return render();
      }
      if (action === 'select-behavior') {
        activeBehaviorRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-form') {
        activeFormRef = text(element.dataset.ref);
        activeAreaRef = '';
        return render();
      }
      if (action === 'select-area') {
        activeAreaRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'export-current') return exportCurrent();
      if (action === 'add-behavior') addBehavior();
      if (action === 'remove-behavior' && !removeBehavior(index)) return;
      if (action === 'add-relation') addRelation();
      if (action === 'remove-relation') currentDocument().flow_relations.splice(index, 1);
      if (action === 'add-data') addDataObject();
      if (action === 'remove-data' && !removeData(index)) return;
      if (action === 'add-handoff') addHandoff();
      if (action === 'add-linked-handoff') addHandoff(text(element.dataset.ref));
      if (action === 'remove-handoff') currentDocument().cross_department_handoffs.splice(index, 1);
      if (action === 'add-form') addForm();
      if (action === 'remove-form') {
        if (!window.confirm('删除当前表单或记录后，其主表、明细表和全部填写项都会一并删除。确定继续吗？')) return;
        const removed = currentDocument().forms[index];
        currentDocument().forms.splice(index, 1);
        if (removed?.form_ref === activeFormRef) {
          activeFormRef = currentDocument().forms[Math.min(index, currentDocument().forms.length - 1)]?.form_ref || '';
          activeAreaRef = '';
        }
      }
      if (action === 'add-main-area' || action === 'add-detail-area') {
        const form = currentDocument().forms[formIndex];
        if (!form) return;
        if (action === 'add-main-area' && form.areas.some(item => item.area_type === '基本信息')) return;
        const area = {
          area_ref: newRef('area'),
          area_type: action === 'add-main-area' ? '基本信息' : '明细清单',
          area_title: '',
          items: []
        };
        form.areas.push(area);
        activeAreaRef = area.area_ref;
      }
      if (action === 'remove-area') {
        if (!window.confirm('删除当前结构后，其中的全部填写项都会一并删除。确定继续吗？')) return;
        const removed = currentDocument().forms[formIndex]?.areas[index];
        currentDocument().forms[formIndex]?.areas.splice(index, 1);
        if (removed?.area_ref === activeAreaRef) activeAreaRef = '';
      }
      if (action === 'add-form-item') currentDocument().forms[formIndex].areas[areaIndex].items.push({
        item_ref: newRef('item'), item_name: '', item_type: '', required: false, instructions: ''
      });
      if (action === 'remove-form-item') currentDocument().forms[formIndex].areas[areaIndex].items.splice(index, 1);
      if (action === 'add-term') addTerm();
      if (action === 'remove-term') currentDocument().terms.splice(index, 1);
      touch();
      render();
    }

    function businessWarnings(data) {
      const warnings = [];
      const need = (value, message) => {
        if (!text(value).trim()) warnings.push(message);
      };
      need(data.export_meta.initiating_department, '未填写发起部门');
      need(data.export_meta.compiler, '未填写编制人');
      need(data.process.process_name, '未填写流程名称');
      need(data.process.owning_department, '未填写归口部门');
      need(data.process.purpose, '未填写流程目的');
      need(data.process.scope, '未填写适用范围');
      if (!data.behaviors.length) warnings.push('没有业务行为或判断节点');
      data.behaviors.forEach((item, index) => {
        const label = item.behavior_name || `第${index + 1}项行为`;
        need(item.node_type, `${label}未选择节点类型`);
        need(item.behavior_name, `第${index + 1}项行为未填写名称`);
        need(item.current_actor_role, `${label}未选择执行岗位或全公司通用`);
        if (text(item.current_actor_role).trim() && rosterLoadState === 'ready') {
          const parsedActor = parseActorRole(item.current_actor_role);
          const actorIsValid = item.current_actor_role === '全公司'
            || (
              actorDepartments().includes(parsedActor.department)
              && rosterPositions(parsedActor.department).includes(parsedActor.position)
            );
          if (!actorIsValid) warnings.push(`${label}的执行岗位未被所选执行部门的花名册收录`);
        }
        if (!text(item.trigger).trim() && !text(item.precondition).trim()) warnings.push(`${label}未填写触发条件或前置条件`);
        need(item.completion_standard, `${label}未填写完成标准`);
        need(item.output_description, `${label}未填写输出结果`);
        if (item.countersign_all_required) {
          if (!item.countersign_target_departments.length) warnings.push(`${label}未明确需要确认知悉的部门`);
        }
        if (item.node_type === 'decision') {
          const branches = data.flow_relations.filter(relation => relation.from_behavior_ref === item.behavior_ref && relation.relation_type === 'condition');
          if (branches.length < 2) warnings.push(`${label}少于两条判断分支`);
          if (branches.some(branch => !branch.condition || !branch.to_behavior_ref)) warnings.push(`${label}存在未补条件或流向的判断分支`);
        }
        if (item.node_type === 'parallel_split' && !data.flow_relations.some(relation => relation.from_behavior_ref === item.behavior_ref && relation.relation_type === 'parallel')) {
          warnings.push(`${label}是并行分支，但没有并行流向`);
        }
        if (item.node_type === 'parallel_join' && !data.flow_relations.some(relation => relation.to_behavior_ref === item.behavior_ref && relation.relation_type === 'parallel')) {
          warnings.push(`${label}是并行汇合，但没有并行来源`);
        }
      });
      if (data.behaviors.length > 1) {
        const localRelations = data.flow_relations.filter(relation => relation.from_behavior_ref && relation.to_behavior_ref);
        if (!localRelations.length) {
          warnings.push('多个业务行为之间尚未建立流程关系');
        } else {
          const incoming = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
          const outgoing = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
          localRelations.forEach(relation => {
            if (incoming.has(relation.to_behavior_ref)) incoming.set(relation.to_behavior_ref, incoming.get(relation.to_behavior_ref) + 1);
            if (outgoing.has(relation.from_behavior_ref)) outgoing.set(relation.from_behavior_ref, outgoing.get(relation.from_behavior_ref) + 1);
          });
          const starts = [...incoming.values()].filter(count => count === 0).length;
          const ends = [...outgoing.values()].filter(count => count === 0).length;
          if (starts !== 1) warnings.push(`当前识别到${starts}个流程入口，应由PMO核对为唯一入口`);
          if (ends !== 1) warnings.push(`当前识别到${ends}个流程出口，应由PMO核对为至少一个明确结束位置`);
        }
      }
      data.flow_relations.forEach((relation, index) => {
        if (relation.relation_type === 'loop' && !text(relation.condition).trim()) warnings.push(`流程关系${index + 1}是回路，但没有退出条件`);
      });
      data.forms.forEach((form, formIndex) => {
        const formLabel = form.form_name || `表单或记录${formIndex + 1}`;
        need(form.form_name, `表单或记录${formIndex + 1}未填写名称`);
        const mainCount = form.areas.filter(area => area.area_type === '基本信息').length;
        if (!mainCount) warnings.push(`${formLabel}没有主表结构`);
        if (mainCount > 1) warnings.push(`${formLabel}包含${mainCount}个主表结构`);
        let detailIndex = 0;
        form.areas.forEach((area, areaIndex) => {
          if (area.area_type === '明细清单') detailIndex += 1;
          const structureLabel = area.area_type === '基本信息'
            ? '主表结构'
            : area.area_type === '明细清单'
              ? `明细表结构${detailIndex}`
              : `待确认结构${areaIndex + 1}`;
          need(area.area_type, `${formLabel}的${structureLabel}尚未确认是主表还是明细表`);
          need(area.area_title, `${formLabel}的${structureLabel}未填写标题`);
          if (!area.items.length) warnings.push(`${formLabel}的${structureLabel}没有填写项`);
        });
      });
      data.cross_department_handoffs.forEach((item, index) => {
        need(item.source_department, `跨部门承接${index + 1}未填写发出部门`);
        need(item.target_department, `跨部门承接${index + 1}未明确承接部门`);
        need(item.send_behavior_ref, `跨部门承接${index + 1}未指定发送行为`);
        need(item.input_data_ref, `跨部门承接${index + 1}未指定发给承接部门的输入数据`);
        need(item.returned_data_ref, `跨部门承接${index + 1}未指定承接完成后返回的数据`);
        need(item.requested_matter, `跨部门承接${index + 1}未说明需要处理什么`);
        need(item.trigger_condition, `跨部门承接${index + 1}未说明何时开始`);
        need(item.completion_standard, `跨部门承接${index + 1}未填写完成标准`);
      });
      return [...new Set(warnings)];
    }

    function sanitizeFilenamePart(value, fallback) {
      const cleaned = text(value).trim().replace(/[\\/:*?"<>|\r\n]+/g, '_').replace(/\s+/g, ' ').slice(0, 80);
      return cleaned || fallback;
    }

    function exportTimestamp(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
    }

    function downloadJson(data) {
      const now = new Date();
      const department = sanitizeFilenamePart(data.export_meta.initiating_department, '未明确部门');
      const processName = sanitizeFilenamePart(data.process.process_name, '未命名流程');
      const fileName = `未审核-${department}-${processName}-${exportTimestamp(now)}.json`;
      const blob = new Blob([`${JSON.stringify(data, null, 2)}\n`], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      return fileName;
    }

    async function ensureCompatibleValidationService(retryAction = '再次导出') {
      let schema;
      try {
        const response = await fetch('/api/schema', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        schema = await readJsonResponse(response, '3001校验接口未返回结构化数据。');
      } catch (_error) {
        throw new Error(`3001校验服务暂时不可用。请保持当前页面打开，待服务恢复后${retryAction}。`);
      }

      const actualVersion = text(schema?.properties?.schema_version?.const).trim();
      if (actualVersion !== EXPECTED_EXPORT_SCHEMA_VERSION) {
        throw new Error(
          `3001前端与服务端版本不一致。当前页面使用“${EXPECTED_EXPORT_SCHEMA_VERSION}”，`
          + `服务端提供“${actualVersion || '未知版本'}”。请保持当前页面打开，待维护人员重启3001服务后${retryAction}。`
        );
      }
    }

    function validationErrorLocation(error) {
      const basePath = text(error?.path).trim() || '/';
      const missingProperty = text(error?.params?.missingProperty).trim();
      if (!missingProperty) return basePath;
      return basePath === '/' ? `/${missingProperty}` : `${basePath}/${missingProperty}`;
    }

    async function exportCurrent() {
      const entry = currentEntry();
      if (!entry) return false;
      syncRoles(entry.data);
      entry.data.export_meta.exported_at = new Date().toISOString();
      setBusy(true, '正在检查当前文件中的技术引用……');
      try {
        await ensureCompatibleValidationService();
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: entry.data })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) {
          const errors = Array.isArray(result.errors) ? result.errors : [];
          const referenceErrorsOnly = errors.length > 0 && errors.every(error => error.keyword === 'localReference');
          if (referenceErrorsOnly) {
            const details = errors.slice(0, 5).map(error => `${validationErrorLocation(error)}：${error.message}`).join('；');
            showStatus(`当前流程文件中的技术引用已断开或重复，暂不能导出。${details}`, 'error');
          } else {
            const locations = [...new Set(errors.slice(0, 5).map(validationErrorLocation))].join('、');
            const locationText = locations ? `涉及位置：${locations}。` : '';
            showStatus(
              `当前流程文件不符合3001单流程导出格式，暂不能导出。${locationText}请保持当前页面内容，并联系维护人员处理。`,
              'error'
            );
          }
          return false;
        }
        const warnings = businessWarnings(entry.data);
        if (warnings.length) {
          const preview = warnings.slice(0, 8).map((item, index) => `${index + 1}. ${item}`).join('\n');
          const more = warnings.length > 8 ? `\n另有 ${warnings.length - 8} 项。` : '';
          if (!window.confirm(`当前是未审核草稿，PMO审核前仍需补齐：\n\n${preview}${more}\n\n仍然导出当前草稿吗？`)) {
            showStatus('已取消导出，当前页面内容仍保留。');
            return false;
          }
        }
        const fileName = downloadJson(entry.data);
        entry.dirty = false;
        showStatus(`已导出 ${fileName}。该文件仍是未审核结果，不得直接进入3000。`, 'success');
        updateCandidateBar();
        return true;
      } catch (error) {
        showStatus(`导出失败：${error.message}`, 'error');
        return false;
      } finally {
        setBusy(false);
      }
    }

    function protect(action) {
      if (!hasDirtyCandidates()) {
        action();
        return;
      }
      if (!currentEntry()?.dirty) {
        currentIndex = candidates.findIndex(item => item.dirty);
        render();
      }
      protectedAction = action;
      unsavedModal.classList.add('show');
      unsavedModal.setAttribute('aria-hidden', 'false');
    }

    function closeProtectedModal() {
      unsavedModal.classList.remove('show');
      unsavedModal.setAttribute('aria-hidden', 'true');
    }

    async function sha256File(file) {
      if (!crypto.subtle) return null;
      const bytes = await file.arrayBuffer();
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(hash)).map(value => value.toString(16).padStart(2, '0')).join('');
    }

    async function importJson(file) {
      setBusy(true, `正在读取 ${file.name}……`);
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed.schema_version === 'process-governance-v1') {
          candidates = [{ data: normalizeV1(parsed), dirty: false, origin: 'v1' }];
        } else if (parsed.schema_version === 'document-structured-output-v2') {
          const fileSha256 = await sha256File(file);
          candidates = splitLegacyDocument(parsed, { fileName: file.name, fileSha256 })
            .map(data => ({ data: normalizeV1(data), dirty: true, origin: 'legacy' }));
        } else {
          throw new Error(`不支持的结构化文件版本：${parsed.schema_version || '未提供'}`);
        }
        currentIndex = 0;
        openedPreviewProcesses.clear();
        selectInitialTabAfterImport();
        render();
        showStatus(
          candidates.length > 1
            ? `历史文件包含 ${candidates.length} 条流程，已拆成候选。每条流程必须单独导出。`
            : '结构化文件已导入当前页面。',
          'success'
        );
      } catch (error) {
        showStatus(`结构化文件导入失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
        jsonInput.value = '';
      }
    }

    document.getElementById('newProcessButton').addEventListener('click', () => protect(startNewProcess));
    document.getElementById('importJsonButton').addEventListener('click', () => protect(() => jsonInput.click()));
    document.getElementById('exportButton').addEventListener('click', exportCurrent);
    document.getElementById('clearButton').addEventListener('click', () => protect(clearPage));

    jsonInput.addEventListener('change', () => {
      const file = jsonInput.files?.[0];
      if (file) importJson(file);
    });

    candidateSelect.addEventListener('change', event => {
      currentIndex = Number(event.target.value) || 0;
      selectInitialTabAfterImport();
      render();
    });

    workspace.addEventListener('input', event => {
      const target = event.target.closest('[data-bind]');
      if (!target || !currentDocument()) return;
      const kind = target.dataset.kind;
      const value = kind === 'boolean' ? target.checked : kind === 'nullable' ? nullable(target.value) : target.value;
      setByPath(target.dataset.bind, value);
      touch();
      const behaviorMatch = target.dataset.bind.match(/^behaviors\.(\d+)\.behavior_name$/);
      if (behaviorMatch) {
        const behaviorIndex = Number(behaviorMatch[1]);
        refreshRoleName(behaviorIndex);
        const behavior = currentDocument().behaviors[behaviorIndex];
        const selector = behavior
          ? workspace.querySelector(`[data-action="select-behavior"][data-ref="${CSS.escape(behavior.behavior_ref)}"]`)
          : null;
        if (selector) selector.textContent = `${behaviorIndex + 1}. ${behavior.behavior_name || '未命名业务行为'}`;
      }
      const formMatch = target.dataset.bind.match(/^forms\.(\d+)\.form_name$/);
      if (formMatch) {
        const formIndex = Number(formMatch[1]);
        const form = currentDocument().forms[formIndex];
        const selector = form
          ? workspace.querySelector(`[data-action="select-form"][data-ref="${CSS.escape(form.form_ref)}"]`)
          : null;
        if (selector) selector.textContent = `${formIndex + 1}. ${form.form_name || '未命名表单或记录'}`;
      }
      if (target.dataset.bind === 'process.process_name') updateCandidateBar();
      refreshPreviewAvailability();
    });

    workspace.addEventListener('change', event => {
      const target = event.target;
      if (target.matches('[data-actor-department]')) {
        const index = Number(target.dataset.actorDepartment);
        const behavior = currentDocument()?.behaviors?.[index];
        if (!behavior) return;
        behavior.current_actor_role = combineActorRole(target.value, '');
        touch();
        render();
        return;
      }
      if (target.matches('[data-actor-position]')) {
        const index = Number(target.dataset.actorPosition);
        const behavior = currentDocument()?.behaviors?.[index];
        const department = workspace.querySelector(`[data-actor-department="${index}"]`)?.value || '';
        if (!behavior) return;
        behavior.current_actor_role = combineActorRole(department, target.value);
        touch();
        render();
        return;
      }
      if (target.matches('[data-list-bind]')) {
        const pathKey = target.dataset.listBind;
        const values = Array.from(workspace.querySelectorAll(`input[data-list-bind="${pathKey}"]:checked`)).map(input => input.value);
        setByPath(pathKey, values);
        touch();
        refreshPreviewAvailability();
        return;
      }
      if (target.matches('[data-bind]') && (
        target.dataset.bind === 'process.owning_department'
        || /^cross_department_handoffs\.\d+\.send_behavior_ref$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.area_type$/.test(target.dataset.bind)
      )) {
        render();
      }
    });

    workspace.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    document.getElementById('cancelProtectedButton').addEventListener('click', () => {
      protectedAction = null;
      closeProtectedModal();
    });

    document.getElementById('discardProtectedButton').addEventListener('click', () => {
      const action = protectedAction;
      protectedAction = null;
      closeProtectedModal();
      if (action) action();
    });

    document.getElementById('exportProtectedButton').addEventListener('click', async () => {
      const exported = await exportCurrent();
      if (!exported) return;
      const nextDirtyIndex = candidates.findIndex(item => item.dirty);
      if (nextDirtyIndex >= 0) {
        currentIndex = nextDirtyIndex;
        render();
        showStatus('还有其他候选流程包含未导出的修改，请继续导出或选择放弃。');
        return;
      }
      const action = protectedAction;
      protectedAction = null;
      closeProtectedModal();
      if (action) action();
    });

    window.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || !diagramExpanded) return;
      diagramExpanded = false;
      render();
    });

    window.addEventListener('beforeunload', event => {
      if (!hasDirtyCandidates()) return;
      event.preventDefault();
      event.returnValue = '';
    });

    render();
    loadRosterCatalog();
    ensureCompatibleValidationService('再次操作').catch(error => showStatus(error.message, 'error'));
  </script>
</body>
</html>
