<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3001 单流程治理编制工具</title>
  <style>
    :root {
      --paper: #f3ead7;
      --paper-deep: #e9ddc5;
      --card: rgba(255, 252, 243, 0.94);
      --ink: #2f302b;
      --muted: #6d6a60;
      --line: #cbbd9e;
      --red: #8c3f33;
      --red-soft: #f2dfd8;
      --sage: #66745f;
      --sage-soft: #dfe7db;
      --blue: #5d6f78;
      --gold: #9b783d;
      --shadow: 0 12px 32px rgba(76, 58, 33, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(140, 63, 51, 0.08), transparent 28rem),
        linear-gradient(145deg, #efe4cc, var(--paper) 45%, #eee4d2);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .page {
      width: 100%;
      padding: 16px;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .task-sidebar {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: calc(100vh - 32px);
      padding: 18px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(250, 244, 230, 0.9);
      box-shadow: var(--shadow);
    }

    .sidebar-scroll-area {
      display: flex;
      flex: 1 1 auto;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
    }

    .main-column { min-width: 0; }

    .sidebar-brand h1 {
      margin: 7px 0 0;
      font-family: "SimSun", "STSong", serif;
      font-size: 25px;
      line-height: 1.3;
    }

    .eyebrow {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .tool-badge {
      display: inline-flex;
      margin-top: 9px;
      padding: 4px 8px;
      border: 1px solid #b9aa8b;
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.76);
      font-size: 12px;
      font-weight: 700;
    }

    .notice {
      margin-top: 16px;
      padding: 12px 15px;
      border-left: 4px solid var(--sage);
      border-radius: 0 10px 10px 0;
      background: var(--sage-soft);
      color: #3e4c3b;
      font-weight: 700;
    }

    .boundary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .sidebar-section {
      display: grid;
      gap: 9px;
      padding-top: 13px;
      border-top: 1px solid rgba(203, 189, 158, 0.72);
    }

    .sidebar-section-title {
      color: #584f40;
      font-size: 13px;
      font-weight: 700;
    }

    .sidebar-actions {
      display: grid;
      gap: 8px;
    }

    .sidebar-actions .button { width: 100%; }

    .button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fffaf0;
      font-weight: 700;
    }

    .button:hover { border-color: var(--gold); }
    .button.primary { color: #fff; border-color: var(--red); background: var(--red); }
    .button.secondary { color: #fff; border-color: var(--sage); background: var(--sage); }
    .button.danger { color: var(--red); border-color: #b98578; background: var(--red-soft); }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

    .status {
      display: none;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .status.show { display: block; }
    .status.error { color: #7b2f27; border-color: #c18a7d; background: #f7e5df; }
    .status.success { color: #40543b; border-color: #91a38a; background: #e8efe4; }

    .candidate-list {
      display: grid;
      gap: 7px;
      max-height: min(32vh, 300px);
      overflow-y: auto;
      padding-right: 3px;
      scrollbar-width: thin;
    }

    .candidate-item {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      width: 100%;
      min-height: 46px;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: rgba(255, 252, 243, 0.78);
      text-align: left;
    }

    .candidate-item:hover { border-color: var(--gold); }
    .candidate-item.active {
      border-color: var(--red);
      background: #fff6ed;
      box-shadow: inset 3px 0 0 var(--red);
    }

    .candidate-number {
      display: grid;
      place-items: center;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      color: #655b4a;
      background: var(--paper-deep);
      font-size: 12px;
      font-weight: 700;
    }

    .candidate-item.active .candidate-number { color: #fff; background: var(--red); }
    .candidate-copy { min-width: 0; }
    .candidate-name {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .candidate-dirty {
      display: block;
      margin-top: 3px;
      color: var(--red);
      font-size: 11px;
      font-weight: 700;
    }

    .candidate-empty {
      padding: 12px;
      border: 1px dashed #bcae90;
      border-radius: 9px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.48);
      font-size: 13px;
      line-height: 1.55;
    }

    .candidate-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.55; }

    .workspace { min-width: 0; }
    .workspace-tabs-shell {
      margin: 0;
    }

    .workspace-tabs {
      display: grid;
      gap: 7px;
    }

    .workspace-tab {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 252, 243, 0.78);
      font-weight: 700;
      text-align: left;
    }

    .workspace-tab:hover { color: var(--ink); background: var(--paper-deep); }
    .workspace-tab.active { color: #fff; background: var(--red); }
    .tab-status {
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .workspace-tab:not(.active) .tab-status.ready { color: #40543b; background: var(--sage-soft); }
    .workspace-tab:not(.active) .tab-status.warning { color: #7b2f27; background: var(--red-soft); }
    .workspace-tab:not(.active) .tab-status.waiting { color: var(--muted); background: #f4f0e7; }
    .tab-panel[hidden] { display: none; }

    .editor-navigation,
    .process-navigation {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.88);
      scrollbar-width: thin;
    }

    .editor-section-tab,
    .process-section-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    .editor-section-tab:hover,
    .process-section-tab:hover {
      color: var(--ink);
      border-color: var(--line);
      background: var(--paper-deep);
    }

    .editor-section-tab.active {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }

    .process-section-tab.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .diagram-section { overflow: visible; }
    body.diagram-overlay-open { overflow: hidden; }
    .diagram-section.diagram-expanded {
      position: fixed;
      inset: 12px;
      z-index: 90;
      margin: 0;
      overflow: auto;
      background: #fffaf0;
      box-shadow: 0 26px 80px rgba(37, 31, 23, 0.34);
    }

    .diagram-section.diagram-expanded .diagram-canvas {
      height: max(520px, calc(100vh - 350px));
    }

    .diagram-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .diagram-toolbar h2 { margin: 0 0 5px; font-family: "SimSun", serif; font-size: 22px; }
    .diagram-toolbar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .diagram-legend-shell {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid #bcae90;
      border-radius: 10px;
      background: #fbf5e9;
    }

    .diagram-legend-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .diagram-legend-list {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 10px;
    }

    .diagram-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #3f403b;
      font-size: 12px;
      line-height: 1.35;
    }

    .diagram-legend-copy { min-width: 0; }
    .diagram-legend-copy strong, .diagram-legend-copy small { display: block; }
    .diagram-legend-copy strong { color: #35362f; font-size: 12px; }
    .diagram-legend-copy small { margin-top: 2px; color: #6b685f; font-size: 10px; }
    .legend-symbol {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 24px;
      border: 2px solid #8c3f33;
      color: #7b2f27;
      background: #fffaf0;
      font-size: 15px;
      font-weight: 800;
    }

    .legend-symbol.action { border-radius: 7px; }
    .legend-symbol.decision, .legend-symbol.parallel {
      width: 23px;
      height: 23px;
      margin: 0 6px;
      transform: rotate(45deg);
      border-radius: 1px;
      background: #f5e5df;
    }

    .legend-symbol.parallel {
      border-color: #8a6a30;
      color: #6f5223;
      background: #f3e7ca;
    }

    .legend-symbol.decision > span, .legend-symbol.parallel > span { transform: rotate(-45deg); }
    .legend-symbol.call {
      border-width: 4px;
      border-color: #52665a;
      border-radius: 7px;
      background: #e5eadf;
    }

    .legend-symbol.pending {
      border-style: dashed;
      border-color: #746f64;
      background: #f4f0e7;
    }

    .legend-symbol.flow {
      width: 42px;
      height: 18px;
      border: 0;
      background: transparent;
    }

    .legend-symbol.flow::before {
      content: "";
      position: absolute;
      left: 1px;
      right: 8px;
      top: 8px;
      border-top: 2px solid #5b625d;
    }

    .legend-symbol.flow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 4px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #5b625d;
    }

    .diagram-reading-tip {
      margin: 10px 0 0;
      padding-top: 9px;
      border-top: 1px solid rgba(188, 174, 144, 0.7);
      color: #514834;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
    }

    .data-relation-legend-title {
      display: block;
      margin-bottom: 10px;
      color: #35362f;
      font-family: "SimSun", serif;
      font-size: 15px;
    }

    .data-relation-legend .diagram-legend-list {
      grid-template-columns: repeat(6, minmax(118px, 1fr));
    }

    .data-legend-node {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 26px;
      border: 2px solid #8e9f86;
      border-radius: 7px;
      color: #3e4b3e;
      background: #fffdf7;
      font-size: 10px;
      font-weight: 800;
    }

    .data-legend-node.data {
      border-width: 3px;
      border-color: #a27732;
      color: #76531c;
      background: #f4ead1;
    }

    .data-legend-edge {
      display: inline-grid;
      flex: 0 0 auto;
      grid-template-columns: 20px 25px 20px;
      align-items: center;
      justify-content: center;
      color: #5b625d;
      font-size: 9px;
      font-weight: 700;
      text-align: center;
    }

    .data-legend-edge b {
      color: #526856;
      font-size: 18px;
      line-height: 1;
    }

    .data-legend-edge.pending b {
      color: #746f64;
    }

    .diagram-legend-example {
      margin-top: 10px;
      padding: 11px;
      border: 1px dashed #bcae90;
      border-radius: 8px;
      background: #fffdf8;
    }

    .diagram-legend-example[hidden] { display: none; }
    .diagram-legend-example > p { margin: 0 0 9px; color: #666158; font-size: 11px; }
    .legend-example-flow {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) 48px minmax(110px, 1fr) 58px minmax(130px, 1.25fr);
      align-items: center;
      gap: 8px;
      max-width: 760px;
    }

    .legend-example-step { min-width: 0; text-align: center; }
    .legend-example-department {
      display: block;
      margin-bottom: 4px;
      color: #6f695d;
      font-size: 10px;
      font-weight: 700;
    }

    .legend-example-node {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 6px 9px;
      border: 2px solid #8c3f33;
      border-radius: 7px;
      color: #3c3d37;
      background: #fffaf0;
      font-size: 11px;
      font-weight: 700;
    }

    .legend-example-node.decision {
      width: 64px;
      height: 64px;
      min-height: 0;
      margin: 0 auto;
      padding: 7px;
      border-radius: 1px;
      transform: rotate(45deg);
      background: #f5e5df;
    }

    .legend-example-node.decision span { transform: rotate(-45deg); }
    .legend-example-node.handoff {
      border-style: dashed;
      border-color: #526973;
      background: #e7edef;
    }

    .legend-example-arrow {
      position: relative;
      height: 22px;
    }

    .legend-example-arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 8px;
      top: 10px;
      border-top: 2px solid #5b625d;
    }

    .legend-example-arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 6px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #5b625d;
    }

    .legend-example-arrow.message::before { border-top: 2px dashed #526973; }
    .legend-example-arrow.message::after {
      top: 6px;
      width: 8px;
      height: 8px;
      border: 0;
      border-top: 2px solid #526973;
      border-right: 2px solid #526973;
      transform: rotate(45deg);
    }

    .diagram-notice {
      margin-bottom: 12px;
      padding: 10px 13px;
      border: 1px solid #bcae90;
      border-radius: 9px;
      color: #514834;
      background: #f8efd9;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .diagram-notice.warning {
      color: #7b2f27;
      border-color: #c18a7d;
      background: #f7e5df;
    }

    .diagram-canvas {
      width: 100%;
      height: clamp(360px, 50vh, 520px);
      border: 1px solid #bcae90;
      border-radius: 12px;
      background:
        linear-gradient(rgba(203, 189, 158, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(203, 189, 158, 0.16) 1px, transparent 1px),
        #fffdf8;
      background-size: 24px 24px;
    }

    .diagram-empty {
      padding: 42px 22px;
      border: 1px dashed #bcae90;
      border-radius: 12px;
      text-align: center;
      background: rgba(255, 253, 248, 0.78);
    }

    .diagram-empty h2 { margin: 0 0 9px; font-family: "SimSun", serif; }
    .diagram-empty p { margin: 0 auto 17px; max-width: 700px; color: var(--muted); line-height: 1.75; }
    .diagram-failure {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #c18a7d;
      border-radius: 9px;
      color: #7b2f27;
      background: #f7e5df;
      line-height: 1.6;
    }

    .diagram-failure.show { display: block; }
    .diagram-warning-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.82);
    }

    .diagram-warning-list strong { color: #7b2f27; }
    .diagram-warning-button {
      padding: 8px 10px;
      border: 1px solid #d3b2aa;
      border-radius: 7px;
      color: #6f342c;
      background: #fff8f4;
      text-align: left;
      line-height: 1.55;
    }

    .diagram-warning-button:hover { border-color: var(--red); }
    .item-card.focused-card,
    .section.focused-card {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(140, 63, 51, 0.14);
      animation: focus-card-pulse 1.1s ease-out 1;
    }

    input.focused-control,
    select.focused-control,
    textarea.focused-control {
      border-color: #b42318 !important;
      background: #fff4f2 !important;
      outline: none;
      animation: focus-control-breathe 0.9s ease-in-out 3;
    }

    @keyframes focus-card-pulse {
      0% { transform: translateY(0); }
      40% { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }

    @keyframes focus-control-breathe {
      0%, 100% {
        box-shadow: 0 0 0 2px rgba(180, 35, 24, 0.16);
      }
      50% {
        box-shadow:
          0 0 0 7px rgba(180, 35, 24, 0.28),
          0 0 18px rgba(180, 35, 24, 0.24);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      input.focused-control,
      select.focused-control,
      textarea.focused-control {
        animation: none;
        box-shadow: 0 0 0 4px rgba(180, 35, 24, 0.24);
      }
    }
    .empty {
      padding: 64px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .empty h2 { margin: 0 0 10px; font-family: "SimSun", serif; }
    .empty p { margin: 0 auto 18px; max-width: 720px; color: var(--muted); line-height: 1.8; }

    .section {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 22px rgba(76, 58, 33, 0.06);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 20px;
      border-bottom: 1px solid rgba(203, 189, 158, 0.7);
      background: rgba(237, 226, 203, 0.58);
    }

    .section-head h2 { margin: 0; font-family: "SimSun", serif; font-size: 21px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .section-body { padding: 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .field { grid-column: span 4; min-width: 0; }
    .field.half { grid-column: span 6; }
    .field.wide { grid-column: 1 / -1; }
    .field label, .field-label {
      display: block;
      margin-bottom: 6px;
      color: #504d45;
      font-size: 13px;
      font-weight: 700;
    }

    .field .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .relation-guidance {
      margin-bottom: 16px;
      padding: 15px;
      border: 1px solid #c9b98f;
      border-radius: 11px;
      background: rgba(249, 244, 231, 0.9);
    }

    .relation-guidance h3 {
      margin: 0;
      color: #514834;
      font-family: "SimSun", serif;
      font-size: 17px;
    }

    .relation-guidance-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 11px;
    }

    .relation-guidance-card {
      padding: 11px 12px;
      border: 1px solid #d5c7aa;
      border-radius: 9px;
      background: #fffdf7;
    }

    .relation-guidance-card strong {
      display: block;
      margin-bottom: 4px;
      color: #6f342c;
    }

    .relation-guidance-card p,
    .relation-guidance-emphasis,
    .relation-guidance-example {
      margin: 0;
      line-height: 1.65;
    }

    .relation-guidance-card p {

    function newRef(prefix) {
      const token = typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID().replace(/-/g, '')
        : `${Date.now()}${Math.random().toString(16).slice(2)}`;
      return `${prefix}_${token}`;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function text(value) {
      return value == null ? '' : String(value);
    }

    function nullable(value) {
      const normalized = text(value).trim();
      return normalized || null;
    }

    function list(value) {
      if (Array.isArray(value)) return [...new Set(value.map(item => text(item).trim()).filter(Boolean))];
      return [...new Set(text(value).split(/[,，\n]/).map(item => item.trim()).filter(Boolean))];
    }

    function escapeHtml(value) {
      return text(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    async function readJsonResponse(response, nonJsonMessage) {
      const contentType = text(response.headers.get('content-type')).toLowerCase();
      if (!contentType.includes('application/json')) throw new Error(nonJsonMessage);
      try {
        return await response.json();
      } catch (_error) {
        throw new Error(nonJsonMessage);
      }
    }

    async function fetchEmptyProcessDocument() {
      const response = await fetch('/api/template?version=process-governance-v6', { cache: 'no-store' });

      );
      if (!response.ok) throw new Error(result.error || '无法读取当前空白模板');
      if (result.schema_version !== EXPECTED_EXPORT_SCHEMA_VERSION || !result.data) {
        throw new Error('3001空白模板与当前页面版本不一致，请联系维护人员重启服务。');
      }
      return result.data;
    }

    async function loadEditorCatalogs() {
      rosterLoadState = 'loading';
      formItemTypeLoadState = 'loading';
      try {
        const response = await fetch('/api/enums', { cache: 'no-store' });
        const result = await readJsonResponse(response, '3001岗位和填写项类型接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '无法读取岗位和填写项类型');
        rosterRolesByDepartment = result.rosterRolesByDepartment && typeof result.rosterRolesByDepartment === 'object'
          ? result.rosterRolesByDepartment
          : {};
        formItemTypes = Array.isArray(result.fieldType)
          ? [...new Set(result.fieldType.map(value => text(value).trim()).filter(Boolean))]
          : [];
        rosterLoadState = Object.keys(rosterRolesByDepartment).length ? 'ready' : 'unavailable';
        formItemTypeLoadState = formItemTypes.length ? 'ready' : 'unavailable';
      } catch (_error) {
        rosterRolesByDepartment = {};
        formItemTypes = [];
        rosterLoadState = 'unavailable';
        formItemTypeLoadState = 'unavailable';
      }
      if (currentDocument()) render();
    }

    async function loadVersionHistory() {
      versionHistoryLoadState = 'loading';
      try {
        const response = await fetch('/api/version-history', { cache: 'no-store' });
        const result = await readJsonResponse(response, '3001版本说明接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '无法读取版本说明');
        versionHistory = result;
        versionHistoryLoadState = 'ready';
      } catch (_error) {
        versionHistory = null;
        versionHistoryLoadState = 'unavailable';
      }
      if (activeWorkspaceTab === 'versions') render();
    }

    function rosterPositions(department) {
      return Array.isArray(rosterRolesByDepartment?.[department])
        ? rosterRolesByDepartment[department]
        : [];
    }

    function actorDepartments() {
      return [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司');
    }

    function currentExecutionDepartment() {
      return text(currentDocument()?.process?.owning_department).trim();
    }

    function parseActorRole(value) {
      const raw = text(value).trim();
      if (!raw) return { department: '', position: '', known: false };
      if (raw === '全公司') return { department: '全公司', position: '', known: true };
      const departments = [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司')
        .sort((left, right) => right.length - left.length);
      const department = departments.find(item => raw === item || raw.startsWith(item));
      if (department) {
        const position = raw.slice(department.length).trim();
        return {
          department,
          position,
          known: Boolean(position && rosterPositions(department).includes(position))
        };
      }
      const matches = Object.entries(rosterRolesByDepartment || {})
        .filter(([, positions]) => Array.isArray(positions) && positions.includes(raw));
      if (matches.length === 1) {
        return { department: matches[0][0], position: raw, known: true };
      }
      return { department: '', position: '', known: false };
    }

    function combineActorRole(department, position) {
      if (department === '全公司') return '全公司';
      if (department && position) return `${department}${position}`;
      return department || '';
    }

    function externalActorDepartment(value, ownDepartment = currentExecutionDepartment()) {
      const normalizedOwner = text(ownDepartment).trim();
      const parsed = parseActorRole(value);
      if (!normalizedOwner || !parsed.department || parsed.department === '全公司') return '';
      return parsed.department === normalizedOwner ? '' : parsed.department;
    }

    function actorAssignmentMode(behavior) {
      const explicit = text(behavior?.actor_assignment_mode).trim();
      if (ACTOR_ASSIGNMENT_MODE_VALUES.has(explicit)) return explicit;
      return text(behavior?.current_actor_role).trim() === '全公司'
        ? 'company_wide'
        : 'fixed_department';
    }

    function isDynamicActorBehavior(behavior) {
      return actorAssignmentMode(behavior) === 'dynamic_from_data';
    }

    function ordinaryRelationsForBehavior(behaviorRef, data = currentDocument()) {
      return (data?.flow_relations || []).filter(relation =>
        relation.from_behavior_ref === behaviorRef || relation.to_behavior_ref === behaviorRef
      );
    }

    function actorRolePicker(index) {
      const behavior = currentDocument().behaviors[index];
      const rawValue = text(behavior?.current_actor_role).trim();
      const ownDepartment = currentExecutionDepartment();
      const parsed = parseActorRole(rawValue);
      const knownDepartments = actorDepartments();
      const selectedDepartment = parsed.department === '全公司' || knownDepartments.includes(parsed.department)
        ? parsed.department
        : '';
      const externalDepartment = externalActorDepartment(rawValue, ownDepartment);
      const knownCurrentValue = Boolean(
          rawValue
          && selectedDepartment
          && selectedDepartment !== '全公司'
          && parsed.position
          && rosterPositions(selectedDepartment).includes(parsed.position)
        );
      const departmentOnlyInProgress = Boolean(
        rawValue
        && rawValue === selectedDepartment
        && selectedDepartment !== '全公司'
        && !parsed.position
      );
      const departmentOptions = [{
        value: '',
        label: '请选择执行部门'
      }];
      knownDepartments.forEach(department => departmentOptions.push({
        value: department,
        label: department === ownDepartment ? `${department}（本流程归口部门）` : department
      }));
      const positions = selectedDepartment && selectedDepartment !== '全公司'
        ? rosterPositions(selectedDepartment)
        : [];
      const positionOptions = [{
        value: '',
        label: selectedDepartment === '全公司'
          ? '全公司通用无需选择岗位'
          : rosterLoadState === 'loading'
            ? '正在读取花名册岗位'
            : rosterLoadState === 'unavailable'
              ? '花名册岗位暂时不可用'
              : selectedDepartment
                ? '请选择执行岗位'
                : '请先选择执行部门'
      }].concat(positions.map(position => ({ value: position, label: position })));
      if (selectedDepartment && parsed.position && !positions.includes(parsed.position)) {
        positionOptions.push({
          value: parsed.position,
          label: `原文件岗位：${parsed.position}（当前花名册未收录）`
        });
      }

      const rosterWarning = rawValue && !knownCurrentValue && !departmentOnlyInProgress
        ? `<div class="inline-warning">当前导入值“${escapeHtml(rawValue)}”未被现行花名册收录。3001会保留该值；如需修改，请重新选择执行部门和执行岗位。</div>`
        : '';
      const availability = rosterLoadState === 'unavailable'
        ? '<div class="inline-warning">花名册岗位暂时不可用。3001不会清除已有执行岗位；其他内容仍可继续编制和导出。</div>'
        : externalDepartment
          ? `<div class="inline-note">当前为跨部门行为。流程先后请在“流程关系”中维护；发送、接收、创建或更新的数据请在“输出物与数据”中维护。</div>`
          : selectedDepartment && selectedDepartment === ownDepartment
            ? `<div class="inline-note">当前为本部门执行。执行岗位显示“${escapeHtml(selectedDepartment)}”花名册中的岗位。</div>`
            : !ownDepartment
              ? '<div class="inline-note">可以先选择任意执行部门和岗位。填写流程归口部门后，页面会据此识别本部门行为和跨部门行为。</div>'
              : '<div class="inline-note">请选择实际执行部门和执行岗位。</div>';

      return `
        <div class="field wide">
          <span class="field-label">执行部门和执行岗位</span>
          <div class="role-picker">
            <select
              data-actor-department="${index}"
              data-focus-key="behaviors.${index}.current_actor_role"
            >
              ${optionHtml(departmentOptions, selectedDepartment)}
            </select>
            <select
              data-actor-position="${index}"
              data-focus-key="behaviors.${index}.current_actor_role"
              ${!selectedDepartment || selectedDepartment === '全公司' || rosterLoadState !== 'ready' ? 'disabled' : ''}
            >
              ${optionHtml(positionOptions, parsed.position)}
            </select>
          </div>
          ${rosterWarning}
          ${availability}
        </div>`;
    }

    function dynamicDepartmentDataSelect(index, behavior, flowDetails) {
      const selectedRef = text(behavior.actor_department_data_ref).trim();
      const values = [{ value: '', label: '请选择前序数据' }];
      (currentDocument()?.data_objects || []).forEach((item, dataIndex) => {
        const allowed = flowDetails.isAvailableBeforeBehavior?.(item.data_ref, behavior.behavior_ref) === true;
        if (!allowed && item.data_ref !== selectedRef) return;
        values.push({
          value: item.data_ref,
          label: `${dataIndex + 1}. ${item.data_name || '未命名数据'}${allowed ? '' : '（当前不是可用的前序数据）'}`
        });
      });
      const emptyHint = values.length === 1
        ? '<div class="inline-warning">当前没有可用于确定执行部门的前序数据。请先在“输出物与数据”中登记责任部门数据，并建立它的产生行为和流程关系。</div>'
        : '';
      return `
        <div class="field wide">
          <label>执行部门来源数据</label>
          <select data-bind="behaviors.${index}.actor_department_data_ref" data-kind="nullable" data-focus-key="behaviors.${index}.actor_department_data_ref">
            ${optionHtml(values, selectedRef)}
          </select>
          <span class="hint">只能选择本行为开始前已经产生、并可沿流程关系到达本行为的数据。数据值可以包含一个或多个责任部门。</span>
          ${emptyHint}
        </div>`;
    }

    function actorAssignmentEditor(index, behavior, flowDetails) {
      const mode = actorAssignmentMode(behavior);
      const modeField = `
        <div class="field wide">
          <label>执行主体确定方式</label>
          <select data-actor-assignment-mode="${index}" data-focus-key="behaviors.${index}.actor_assignment_mode">
            ${optionHtml(ACTOR_ASSIGNMENT_MODES, mode)}
          </select>
        </div>`;
      if (mode === 'company_wide') {
        return `${modeField}<div class="field wide"><div class="inline-note">“全公司通用”表示该行为不归属于某个特定部门，不算跨部门。</div></div>`;
      }
      if (mode === 'dynamic_from_data') {
        return `${modeField}
          ${dynamicDepartmentDataSelect(index, behavior, flowDetails)}
          ${field(`behaviors.${index}.actor_position_rule`, '执行岗位或责任人确定规则', {
            type: 'textarea',
            className: 'wide',
            placeholder: '例如：由问题责任部门确定整改责任人',
            hint: '运行时，每个责任部门分别确定办理岗位或责任人；责任部门尚未形成时，不得向全公司广播待办。'
          })}
          <div class="field wide"><div class="inline-note">该行为在设计时不算固定跨部门行为。运行时取得责任部门后，只有责任部门与流程归口部门不同时才形成跨部门办理。</div></div>`;
      }
      return `${modeField}${actorRolePicker(index)}`;
    }

    function currentEntry() {
      return candidates[currentIndex] || null;
    }

    function currentDocument() {
      return currentEntry()?.data || null;
    }

    function candidateStateKey(entry = currentEntry()) {
      if (!entry) return '';
      if (!entry.stateKey) entry.stateKey = newRef('candidate');
      return entry.stateKey;
    }

    function registerCandidateState(entry, options = {}) {
      if (!entry) return;
      const key = candidateStateKey(entry);
      graphStateManager.register(key, entry.data, { resetHistory: options.resetHistory !== false });
      entry.forceDirty = Boolean(options.forceDirty);
      entry.dirty = entry.forceDirty;
    }

    function refreshCandidateDirty(entry = currentEntry()) {
      if (!entry) return false;
      entry.dirty = Boolean(entry.forceDirty) || graphStateManager.isDirty(candidateStateKey(entry), entry.data);
      return entry.dirty;
    }

    function hasDirtyCandidates() {
      return candidates.some(item => item.dirty);
    }

    function touch() {
      const entry = currentEntry();
      if (!entry) return;
      refreshCandidateDirty(entry);
      updateCandidateList();
    }

    function setBusy(value, message = '') {
      busy = value;
      actionButtons.forEach(button => {
        if (button.id === 'exportButton' || button.id === 'clearButton') {
          button.disabled = value || !currentDocument();
        } else {
          button.disabled = value;
        }
      });
      if (message) showStatus(message);
    }

    function showStatus(message, kind = '') {
      statusBox.textContent = message;
      statusBox.className = `status show${kind ? ` ${kind}` : ''}`;
    }

    function clearStatus() {
      statusBox.textContent = '';
      statusBox.className = 'status';
    }

    function optionHtml(options, selected) {
      return options.map(option => {
        const value = typeof option === 'string' ? option : option.value;
        const label = typeof option === 'string' ? (option || '请选择') : option.label;
        return `<option value="${escapeAttribute(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function getByPath(pathKey) {
      return pathKey.split('.').reduce((target, part) => target == null ? undefined : target[part], currentDocument());
    }

    function setByPath(pathKey, value) {
      const parts = pathKey.split('.');
      const last = parts.pop();
      const target = parts.reduce((node, part) => node[part], currentDocument());
      target[last] = value;
    }

    function field(pathKey, label, options = {}) {
      const value = getByPath(pathKey);
      const classes = ['field', options.className || ''].filter(Boolean).join(' ');
      const hint = options.hint ? `<span class="hint">${escapeHtml(options.hint)}</span>` : '';
      let control = '';
      if (options.type === 'textarea') {
        control = `<textarea class="${options.tall ? 'tall' : ''}" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" placeholder="${escapeAttribute(options.placeholder || '')}">${escapeHtml(value)}</textarea>`;
      } else if (options.type === 'select') {
        control = `<select data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}">${optionHtml(options.options || [], value == null ? '' : value)}</select>`;
      } else if (options.type === 'date') {
        control = `<input type="date" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}">`;
      } else if (options.type === 'checkbox') {
        control = `<div class="check-row"><label><input type="checkbox" data-bind="${escapeAttribute(pathKey)}" data-kind="boolean"${value ? ' checked' : ''}> ${escapeHtml(options.checkboxLabel || label)}</label></div>`;
      } else {
        control = `<input type="text" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}" placeholder="${escapeAttribute(options.placeholder || '')}">`;
      }
      return `<div class="${classes}"><label>${escapeHtml(label)}</label>${control}${hint}</div>`;
    }

    function formItemTypeField(pathKey, currentValue) {
      const normalizedValue = text(currentValue).trim();
      const knownValue = Boolean(normalizedValue && formItemTypes.includes(normalizedValue));
      const options = [{
        value: '',
        label: formItemTypeLoadState === 'loading' ? '正在读取数据类型' : '请选择数据类型'
      }].concat(formItemTypes.map(value => ({ value, label: value })));
      if (normalizedValue && !knownValue) {
        options.push({
          value: normalizedValue,
          label: formItemTypeLoadState === 'ready'
            ? `${normalizedValue}（当前类型字典未收录）`
            : `${normalizedValue}（保留当前值）`
        });
      }
      const unavailable = formItemTypeLoadState !== 'ready'
        ? '<div class="inline-warning">数据类型字典暂时不可用。3001不会清除已有类型；字典恢复后再选择标准类型。</div>'
        : '';
      const legacyWarning = formItemTypeLoadState === 'ready' && normalizedValue && !knownValue
        ? `<div class="inline-warning">当前导入值“${escapeHtml(normalizedValue)}”未被填写项类型字典收录。3001会保留原值；如需修改，只能改选标准类型。</div>`
        : '';
      return `
        <div class="field">
          <label>${escapeHtml('数据类型')}</label>
          <select
            data-bind="${escapeAttribute(pathKey)}"
            data-kind="text"
            ${formItemTypeLoadState !== 'ready' ? 'disabled' : ''}
          >${optionHtml(options, normalizedValue)}</select>
          <span class="hint">请从标准类型中选择，不允许自由填写。</span>
          ${legacyWarning}
          ${unavailable}
        </div>`;
    }

    function formDesignStateMeta(value) {
      if (value === 'current_state') return { label: '现状', className: 'current' };
      if (value === 'proposed_design') return { label: '拟设计', className: 'proposed' };
      return { label: '待确认', className: 'unspecified' };
    }

    function formDesignStateBadge(value) {
      const meta = formDesignStateMeta(value);
      return `<span class="form-state-badge ${meta.className}">${meta.label}</span>`;
    }

    function formItemAssignmentField(formIndex, areaIndex, itemIndex, item) {
      const form = currentDocument().forms[formIndex];
      const area = form.areas[areaIndex];
      let detailNumber = 0;
      const detailOptions = form.areas
        .filter(candidate => candidate.area_type === '明细清单')
        .map(candidate => {
          detailNumber += 1;
          return {
            value: candidate.area_ref,
            label: `${candidate.area_title || `明细表${detailNumber}`}`
          };
        });
      const selected = area.area_type === '基本信息'
        ? 'main'
        : area.area_type === '明细清单'
          ? area.area_ref
          : 'unassigned';
      const options = [
        { value: 'unassigned', label: '待确认' },
        { value: 'main', label: '主表字段' },
        ...detailOptions,
        { value: '__new_detail__', label: '新建明细表' }
      ];
      const focusKey = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.assignment`;
      return `
        <div class="field">
          <label>字段归属</label>
          <select
            data-form-item-assignment
            data-form-index="${formIndex}"
            data-item-ref="${escapeAttribute(item.item_ref)}"
            data-focus-key="${escapeAttribute(focusKey)}"
          >${optionHtml(options, selected)}</select>
          <span class="hint">只按纸质表单位置选择，不根据数据类型推断。</span>
        </div>`;
    }

    function behaviorSelect(pathKey, label, options = {}) {
      const selectedRef = text(getByPath(pathKey)).trim();
      const values = [{ value: '', label: options.blankLabel || '暂不指定' }]
        .concat((currentDocument()?.behaviors || [])
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => item.behavior_ref !== options.excludeRef)
          .filter(({ item }) => !options.localOnly || !externalActorDepartment(item.current_actor_role) || item.behavior_ref === selectedRef)
          .map(({ item, index }) => ({
            value: item.behavior_ref,
            label: `${index + 1}. ${item.behavior_name || '未命名行为'}${options.localOnly && externalActorDepartment(item.current_actor_role) ? '（历史跨部门关联，请调整）' : ''}`
          })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function dataSelect(pathKey, label, options = {}) {
      const values = [{ value: '', label: '暂不指定' }]
        .concat((currentDocument()?.data_objects || []).map((item, index) => ({
          value: item.data_ref,
          label: `${index + 1}. ${item.data_name || '未命名数据'}`
        })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function multiBehavior(pathKey, label, selected) {
      const behaviors = currentDocument()?.behaviors || [];
      const content = behaviors.length
        ? behaviors.map((item, index) => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(item.behavior_ref)}"${selected.includes(item.behavior_ref) ? ' checked' : ''}> ${index + 1}. ${escapeHtml(item.behavior_name || '未命名行为')}</label>`).join('')
        : '<span class="technical-note">请先新增业务行为。</span>';
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function currentDataFlowDetails() {
      return globalThis.StructureLearningScore?.dataFlowConsistencyDetails?.(currentDocument()) || {
        incomingByBehavior: new Map(),
        dataDetails: [],
        issues: [],
        canReach: () => false,
        isConsumerAvailable: () => true
      };
    }

    function behaviorEntrySummary(behaviorRef, flowDetails = currentDataFlowDetails()) {
      const incoming = flowDetails.incomingByBehavior.get(behaviorRef) || [];
      if (!incoming.length) return '这是流程入口，请说明流程如何开始。';
      return incoming.map(entry => {
        const relation = entry.relation;
        const source = relationEndpointLabel(relation.from_behavior_ref, '前序行为待选择');
        if (relation.relation_type === 'condition') {
          const condition = text(relation.condition).trim() || '判断条件待填写';
          return `“${condition}”成立时，从“${source}”进入`;
        }
        if (relation.relation_type === 'parallel') return `并行路线“${source}”完成后进入`;
        return `“${source}”完成后进入`;
      }).join('；');
    }

    function behaviorDataSummary(behaviorRef, flowDetails = currentDataFlowDetails()) {
      const inputs = [];
      const outputs = [];
      const updates = [];
      const forms = [];
      flowDetails.dataDetails.forEach(detail => {
        const label = text(detail.data?.data_name).trim() || `输出物与数据${detail.dataIndex + 1}`;
        if (detail.consumerRefs.includes(behaviorRef) || detail.availabilityStarts.includes(behaviorRef)) inputs.push(label);
        if ((detail.data?.behavior_links || []).some(link => link.behavior_ref === behaviorRef && link.operation === 'create')) outputs.push(label);
        if ((detail.data?.behavior_links || []).some(link => link.behavior_ref === behaviorRef && link.operation === 'update')) updates.push(label);
      });
      (currentDocument()?.forms || []).forEach(form => {
        const link = (form.behavior_links || []).find(item => item.behavior_ref === behaviorRef);
        if (!link) return;
        const operationLabels = (link.operations || []).map(operation => FORM_OPERATIONS.find(item => item.value === operation)?.label || operation);
        forms.push(`${form.form_name || '未命名表单'}（${operationLabels.length ? operationLabels.join('、') : '操作待确认'}）`);
      });
      const behavior = (currentDocument()?.behaviors || []).find(item => item.behavior_ref === behaviorRef);
      if (isDynamicActorBehavior(behavior) && behavior.actor_department_data_ref) {
        const source = (currentDocument()?.data_objects || []).find(item => item.data_ref === behavior.actor_department_data_ref);
        const label = text(source?.data_name).trim() || '执行部门来源数据';
        inputs.push(`${label}（用于确定执行部门）`);
      }
      return {
        inputs: [...new Set(inputs)],
        outputs: [...new Set(outputs)],
        updates: [...new Set(updates)],
        forms: [...new Set(forms)]
      };
    }

    function renderBehaviorDerivedSummary(item, flowDetails) {
      const summary = behaviorDataSummary(item.behavior_ref, flowDetails);
      const entry = behaviorEntrySummary(item.behavior_ref, flowDetails);
      return `
        <div class="field wide">
          <span class="field-label">由流程关系和输出物与数据自动带出</span>
          <div class="inline-note">
            <div><strong>进入本行为：</strong>${escapeHtml(entry)}</div>
            <div><strong>本行为使用：</strong>${escapeHtml(summary.inputs.length ? summary.inputs.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为产生：</strong>${escapeHtml(summary.outputs.length ? summary.outputs.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为更新：</strong>${escapeHtml(summary.updates.length ? summary.updates.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为处理表单：</strong>${escapeHtml(summary.forms.length ? summary.forms.join('；') : '当前没有已关联表单')}</div>

    function renderLegacyBehaviorSupplement(item, hasDerivedEntry) {
      const entries = [];
      if (hasDerivedEntry && text(item.trigger).trim()) entries.push(`<div><strong>原“何时触发”：</strong>${escapeHtml(item.trigger)}</div>`);
      if (text(item.input_description).trim()) entries.push(`<div><strong>原“需要什么输入”：</strong>${escapeHtml(item.input_description)}</div>`);
      if (text(item.output_description).trim()) entries.push(`<div><strong>原“最终交付什么”：</strong>${escapeHtml(item.output_description)}</div>`);
      if (['parallel_split', 'parallel_join'].includes(item.node_type) && text(item.completion_standard).trim()) {
        entries.push(`<div><strong>原“怎样算完成”：</strong>${escapeHtml(item.completion_standard)}</div>`);
      }
      if (!entries.length) return '';
      return `
        <details class="nested">
          <summary><strong>历史文字补充（只读）</strong></summary>
          <div class="inline-note" style="margin-top:12px">
            ${entries.join('')}
            <div>这些内容按原值保留，不再要求重复填写。请在流程关系和“输出物与数据”中维护现行结构关系。</div>
          </div>
        </details>`;
    }

    function renderLegacyCrossDepartmentGuidance(behavior) {
      const records = currentDocument()?.migration?.legacy_cross_department_records || [];
      const related = records.filter(record => {
        if (record.conversion_status !== 'needs_manual_completion') return false;
        const handoff = record.source_handoff || {};
        return [
          record.created_behavior_ref,
          handoff.counterparty_behavior_ref,
          handoff.anchor_behavior_ref,
          handoff.resume_behavior_ref
        ].includes(behavior?.behavior_ref);
      });
      if (!related.length) return '';
      return `
        <details class="nested" open>
          <summary><strong>旧版跨部门记录待补录（${related.length}项）</strong></summary>
          <div class="inline-warning" style="margin-top:12px">
            <p>旧文件中的下列内容无法唯一转换。原值已只读保留，3001没有猜测流程方向或数据去向。</p>
            <ul>${related.map(record => {
              const handoff = record.source_handoff || {};
              const department = handoff.handoff_direction === 'inbound_prerequisite'
                ? handoff.source_department
                : handoff.target_department;
              const action = handoff.counterparty_behavior_name || handoff.requested_matter || '办理动作待确认';
              return `<li>${escapeHtml(department || '外部门待确认')}：${escapeHtml(action)}。${escapeHtml(record.conversion_reason)}</li>`;
            }).join('')}</ul>
            <div class="item-actions">
              <button class="button secondary small" data-action="open-legacy-relations">补充流程关系</button>
              <button class="button secondary small" data-action="open-legacy-data">补充输出物与数据</button>
            </div>
          </div>
        </details>`;
    }

    function dataConsumerBehaviorPicker(dataIndex, item, flowDetails = currentDataFlowDetails()) {
      const flowDetail = flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref);
      const selected = flowDetail?.consumerRefs
        || (Array.isArray(item.consumed_by_behavior_refs) ? item.consumed_by_behavior_refs : []);
      const pathKey = `data_objects.${dataIndex}.consumed_by_behavior_refs`;
      const choices = (currentDocument()?.behaviors || []).map((behavior, behaviorIndex) => {
        const isSelected = selected.includes(behavior.behavior_ref);
        const issue = flowDetails.consumerIssue?.(item.data_ref, behavior.behavior_ref);
        if (!isSelected && !flowDetails.isConsumerAvailable(item.data_ref, behavior.behavior_ref)) return '';
        const warning = issue ? ` <span class="technical-note">历史引用待整改：${escapeHtml(issue.message)}</span>` : '';
        return `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(behavior.behavior_ref)}"${isSelected ? ' checked' : ''}> ${behaviorIndex + 1}. ${escapeHtml(behavior.behavior_name || '未命名行为')}${warning}</label>`;
      }).filter(Boolean);
      const content = choices.length
        ? choices.join('')
        : '<span class="technical-note">当前没有符合流程先后顺序的可选行为。请先检查产生行为和流程关系。</span>';
      return `<div class="field wide"><span class="field-label">被哪些后续行为使用</span><div class="check-list">${content}</div><span class="hint">只显示产生后可到达的行为。并行分支之间、同一行为自身以及明确的前序行为不可选择。</span></div>`;
    }

    function dataProducerBehaviorSelect(dataIndex, item, flowDetails = currentDataFlowDetails()) {
      const flowDetail = flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref);
      const consumerRefs = flowDetail?.consumerRefs || [];
      const selected = text(item.produced_by_behavior_ref).trim();
      const values = [{ value: '', label: '暂不指定' }];
      (currentDocument()?.behaviors || []).forEach((behavior, behaviorIndex) => {
        const candidateRef = behavior.behavior_ref;
        const allowed = consumerRefs.every(consumerRef =>
          candidateRef !== consumerRef
          && flowDetails.canReach(candidateRef, consumerRef)
          && !flowDetails.canReach(consumerRef, candidateRef)
        );
        if (!allowed && candidateRef !== selected) return;
        values.push({
          value: candidateRef,
          label: `${behaviorIndex + 1}. ${behavior.behavior_name || '未命名行为'}${allowed ? '' : '（历史值待整改）'}`
        });
      });
      return field(`data_objects.${dataIndex}.produced_by_behavior_ref`, '由哪个行为产生', {
        type: 'select',
        options: values,
        nullable: true,
        hint: '只显示位于全部使用行为之前的可选行为。跨部门传递和返回也通过行为关系与普通流程关系表达。'
      });
    }

    function syncBehaviorLinksForData(item, options = {}) {
      const data = currentDocument();
      if (!data || !item?.data_ref) return;
      if (options.producer) {
        data.behaviors.forEach(behavior => {
          behavior.output_data_refs = (behavior.output_data_refs || []).filter(ref => ref !== item.data_ref);
        });
        const producer = data.behaviors.find(behavior => behavior.behavior_ref === item.produced_by_behavior_ref);
        if (producer && !producer.output_data_refs.includes(item.data_ref)) producer.output_data_refs.push(item.data_ref);
      }
      if (options.consumers) {
        const consumers = new Set(item.consumed_by_behavior_refs || []);
        data.behaviors.forEach(behavior => {
          behavior.input_data_refs = (behavior.input_data_refs || []).filter(ref => ref !== item.data_ref);
          if (consumers.has(behavior.behavior_ref)) behavior.input_data_refs.push(item.data_ref);
        });
      }
    }

    function multiDepartments(pathKey, label, selected) {
      const content = DEPARTMENTS.map(department => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(department)}"${selected.includes(department) ? ' checked' : ''}> ${escapeHtml(department)}</label>`).join('');
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function section(title, hint, body, action = '') {
      return `<section class="section"><div class="section-head"><div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(hint)}</p></div>${action}</div><div class="section-body">${body}</div></section>`;
    }

    function emptyList(message) {
      return `<div class="empty-list">${escapeHtml(message)}</div>`;
    }

    function resetEditorNavigation(sectionName = 'basic') {
      activeEditorSection = sectionName;
      activeProcessSection = 'behaviors';
      activeBehaviorRef = '';
      activeRelationRef = '';
      activeDataRef = '';
      activeTermRef = '';
      activeFlowItemKind = 'behavior';
      activeFormRef = '';
      activeAreaRef = '';
    }

    function ensureActiveBehavior() {
      const behaviors = currentDocument()?.behaviors || [];
      let behavior = behaviors.find(item => item.behavior_ref === activeBehaviorRef);
      if (!behavior) behavior = behaviors[0] || null;
      activeBehaviorRef = behavior?.behavior_ref || '';
      return behavior;
    }

    function ensureActiveCollectionItem(collectionKey, refKey, activeRef) {
      const collection = currentDocument()?.[collectionKey] || [];
      let item = collection.find(candidate => text(candidate?.[refKey]) === activeRef);
      if (!item) item = collection[0] || null;
      return {
        item,
        index: item ? collection.indexOf(item) : -1,
        ref: text(item?.[refKey])
      };
    }

    function ensureActiveRelation() {
      const active = ensureActiveCollectionItem('flow_relations', 'relation_ref', activeRelationRef);
      activeRelationRef = active.ref;
      return active;
    }

    function ensureActiveDataObject() {
      const active = ensureActiveCollectionItem('data_objects', 'data_ref', activeDataRef);
      activeDataRef = active.ref;
      return active;
    }

    function ensureActiveTerm() {
      const active = ensureActiveCollectionItem('terms', 'term_ref', activeTermRef);
      activeTermRef = active.ref;
      return active;
    }

    function ensureActiveForm() {
      const forms = currentDocument()?.forms || [];
      let form = forms.find(item => item.form_ref === activeFormRef);
      if (!form) form = forms[0] || null;
      activeFormRef = form?.form_ref || '';
      if (!form) {
        activeAreaRef = '';
        return { form: null, formIndex: -1, area: null, areaIndex: -1 };
      }
      const mainArea = form.areas.find(item => item.area_type === '基本信息');
      let area = form.areas.find(item => item.area_ref === activeAreaRef);
      if (!area) area = mainArea || form.areas[0] || null;
      activeAreaRef = area?.area_ref || '';
      return {
        form,
        formIndex: forms.indexOf(form),
        area,
        areaIndex: area ? form.areas.indexOf(area) : -1
      };
    }

      return `

        });

    function migrationSummary(data = currentDocument()) {
      if (!data) return null;
      let fieldCount = 0;
      let unresolved = 0;
      (data.data_objects || []).forEach(item => {
        if (item.information_type === 'pending_confirmation') unresolved += 1;
        unresolved += (item.behavior_links || []).filter(link => link.operation === 'pending_confirmation').length;
        unresolved += (item.source_relations || []).filter(source => source.availability_mode === 'pending_confirmation').length;
      });
      (data.forms || []).forEach(form => {
        unresolved += (form.behavior_links || []).filter(link => !(link.operations || []).length).length;
        (form.areas || []).forEach(area => (area.items || []).forEach(item => {
          fieldCount += 1;
          if (item.value_origin_mode === 'pending_confirmation') unresolved += 1;
          if (item.value_origin_mode === 'depends_on_data' && !(item.source_links || []).length) unresolved += 1;
        }));
      });
      unresolved += (data.migration?.unresolved_actor_roles || []).length;
      unresolved += (data.migration?.unresolved_join_modes || []).length;
      unresolved += (data.migration?.legacy_cross_department_records || []).filter(item => item.conversion_status === 'needs_manual_completion').length;
      const archived = ['legacy_cross_department_records', 'reference_materials', 'internal_process_calls', 'work_roles']
        .reduce((sum, key) => sum + (data.migration?.[key] || []).length, 0);
      return {
        sourceVersion: data.migration?.source_schema_version || currentEntry()?.origin || data.schema_version,
        behaviorCount: (data.behaviors || []).length,
        dataCount: (data.data_objects || []).length,
        formCount: (data.forms || []).length,
        fieldCount,
        unresolved,
        archived
      };
    }

              <p>${escapeHtml(item.summary)}</p>

        : versionHistoryLoadState === 'unavailable'
          ? '<div class="inline-note">版本说明暂时无法读取。当前页面内容不受影响，请保持页面打开并联系维护人员检查3001服务。</div>'
          : '<div class="inline-note">正在读取版本说明……</div>';
      const summary = migrationSummary();

        </div>` : '<div class="inline-note">当前没有草稿。导入v1至v5或历史多候选文件后，这里会显示本次迁移摘要。</div>';
