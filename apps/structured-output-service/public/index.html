    function itemDragHandle(kind, itemRef, index, label) {
      return `
        <button
          class="selector-drag-handle"
          data-drag-handle="${escapeAttribute(kind)}"
          data-ref="${escapeAttribute(itemRef)}"
          aria-label="拖动第${index + 1}项${escapeAttribute(label)}调整顺序"
          aria-pressed="false"
          title="拖动调整顺序；键盘按空格开始，方向键移动，空格确认，Esc取消"
        >⠿</button>`;
    }

    function orderedSelectorRow(kind, itemRef, index, total, label, buttonLabel, activeRef) {
      return `
        <div class="selector-row" data-sort-kind="${escapeAttribute(kind)}" data-sort-ref="${escapeAttribute(itemRef)}">
          <button
            class="selector-button${itemRef === activeRef ? ' active' : ''}"
            data-action="select-${escapeAttribute(kind)}"
            data-ref="${escapeAttribute(itemRef)}"
            title="${escapeAttribute(buttonLabel)}"
          >${escapeHtml(buttonLabel)}</button>
          ${itemDragHandle(kind, itemRef, index, label)}
        </div>`;
    }

    function sortableCollection(kind) {
      const definitions = {
        behavior: { collectionKey: 'behaviors', refKey: 'behavior_ref', label: '业务行为', setActive: ref => { activeBehaviorRef = ref; } },
        relation: { collectionKey: 'flow_relations', refKey: 'relation_ref', label: '流程关系', setActive: ref => { activeRelationRef = ref; } },
        data: { collectionKey: 'data_objects', refKey: 'data_ref', label: '输出物与数据', setActive: ref => { activeDataRef = ref; } },
        term: { collectionKey: 'terms', refKey: 'term_ref', label: '术语', setActive: ref => { activeTermRef = ref; } }
      };
      const definition = definitions[kind];
      const collection = definition ? currentDocument()?.[definition.collectionKey] : null;
      return definition && Array.isArray(collection) ? { ...definition, collection } : null;
    }

    function sortableRows(kind) {
      return Array.from(workspace.querySelectorAll(`.selector-row[data-sort-kind="${CSS.escape(kind)}"]`));
    }

    function clearSortableIndicators() {
      workspace.querySelectorAll('.sortable-dragging, .sortable-target-before, .sortable-target-after').forEach(row => {
        row.classList.remove('sortable-dragging', 'sortable-target-before', 'sortable-target-after');
      });
      workspace.querySelectorAll('.selector-drag-handle[aria-pressed="true"]').forEach(handle => {
        handle.setAttribute('aria-pressed', 'false');
      });
    }

    function showSortableTarget() {
      const state = sortableDragState;
      if (!state) return;
      clearSortableIndicators();
      state.handle.setAttribute('aria-pressed', 'true');
      state.row.classList.add('sortable-dragging');
      if (state.targetIndex === state.originalIndex) return;
      const rows = sortableRows(state.kind);
      const targetRow = rows[state.targetIndex];
      if (!targetRow) return;
      targetRow.classList.add(state.targetIndex < state.originalIndex ? 'sortable-target-before' : 'sortable-target-after');
    }

    function beginSortableDrag(handle, inputMode, pointerId = null) {
      const kind = text(handle.dataset.dragHandle);
      const itemRef = text(handle.dataset.ref);
      const definition = sortableCollection(kind);
      const row = handle.closest('.selector-row');
      if (!definition || !row) return false;
      const originalIndex = definition.collection.findIndex(item => text(item?.[definition.refKey]) === itemRef);
      if (originalIndex < 0) return false;
      sortableDragState = {
        kind,
        itemRef,
        definition,
        originalIndex,
        targetIndex: originalIndex,
        row,
        handle,
        inputMode,
        pointerId,
        selector: row.closest('.record-selector')
      };
      definition.setActive(itemRef);
      if (pointerId != null && handle.setPointerCapture) handle.setPointerCapture(pointerId);
      showSortableTarget();
      showStatus(`正在调整第${originalIndex + 1}项${definition.label}。`);
      return true;
    }

    function moveSortableTarget(targetIndex) {
      const state = sortableDragState;
      if (!state) return;
      const nextIndex = Math.max(0, Math.min(state.definition.collection.length - 1, targetIndex));
      if (nextIndex === state.targetIndex) return;
      state.targetIndex = nextIndex;
      showSortableTarget();
      showStatus(`将${state.definition.label}移动到第${nextIndex + 1}项；确认前不会修改草稿。`);
    }

    function sortableTargetFromPointer(clientX, clientY) {
      const state = sortableDragState;
      if (!state) return;
      const selector = state.selector;
      if (selector) {
        const bounds = selector.getBoundingClientRect();
        const edge = Math.min(48, bounds.height / 4);
        if (clientY < bounds.top + edge) selector.scrollBy({ top: -24, behavior: 'auto' });
        if (clientY > bounds.bottom - edge) selector.scrollBy({ top: 24, behavior: 'auto' });
      }
      const hit = document.elementFromPoint(clientX, clientY)?.closest('.selector-row');
      if (!hit || hit.dataset.sortKind !== state.kind) return;
      const rows = sortableRows(state.kind);
      const hitIndex = rows.indexOf(hit);
      if (hitIndex < 0) return;
      const bounds = hit.getBoundingClientRect();
      const insertionIndex = hitIndex + (clientY > bounds.top + bounds.height / 2 ? 1 : 0);
      const targetIndex = insertionIndex > state.originalIndex ? insertionIndex - 1 : insertionIndex;
      moveSortableTarget(targetIndex);
    }

    function finishSortableDrag(commit) {
      const state = sortableDragState;
      if (!state) return;
      const changed = commit && state.targetIndex !== state.originalIndex;
      clearSortableIndicators();
      sortableDragState = null;
      if (!changed) {
        showStatus(commit ? '顺序未变化，草稿没有新增修改。' : '已取消调整顺序，草稿没有新增修改。');
        state.handle.focus({ preventScroll: true });
        return;
      }
      const [item] = state.definition.collection.splice(state.originalIndex, 1);
      state.definition.collection.splice(state.targetIndex, 0, item);
      state.definition.setActive(state.itemRef);
      touch();
      render();
      requestAnimationFrame(() => {
        workspace.querySelector(`.selector-drag-handle[data-drag-handle="${CSS.escape(state.kind)}"][data-ref="${CSS.escape(state.itemRef)}"]`)?.focus({ preventScroll: true });
      });
      showStatus(`${state.definition.label}已移动到第${state.targetIndex + 1}项。技术标识和关联关系保持不变。`, 'success');
    }

    function relationTypeLabel(relationType) {
      return RELATION_TYPES.find(option => option.value === relationType)?.label || '关系类型待选择';
    }

    function relationEndpointLabel(behaviorRef, emptyLabel) {
      const behavior = currentDocument().behaviors.find(item => item.behavior_ref === behaviorRef);
      return behavior ? behavior.behavior_name || '未命名业务行为' : emptyLabel;
    }

    function relationSelectorLabel(item, index) {
      const from = relationEndpointLabel(item.from_behavior_ref, '起点待选择');
      const to = relationEndpointLabel(item.to_behavior_ref, '终点待选择');
      return `${index + 1}. ${relationTypeLabel(item.relation_type)}：${from} → ${to}`;
    }

    function dataSelectorLabel(item, index) {
      const createLink = (item.behavior_links || []).find(link => link.operation === 'create');
      const createLabel = createLink ? `创建：${behaviorLabel(createLink.behavior_ref)}` : '';
      const sourceLabel = text(item.source_relations?.[0]?.source_process_name || item.source_relations?.[0]?.source_department).trim();
      const context = createLabel || (sourceLabel ? `来源：${sourceLabel}` : '来源待确认');
      return `${index + 1}. ${text(item.data_name).trim() || '未命名数据'} · ${context}`;
    }

    function updateOrderedSelectorLabel(kind, itemRef, buttonLabel) {
      const selector = workspace.querySelector(
        `[data-action="select-${CSS.escape(kind)}"][data-ref="${CSS.escape(itemRef)}"]`
      );
      if (!selector) return;
      selector.textContent = buttonLabel;
      selector.title = buttonLabel;
    }

    function renderBehaviors() {
      const active = ensureActiveFlowItem();
      const item = active?.behavior || null;
      const index = active?.behaviorIndex ?? -1;
      const flowDetails = currentDataFlowDetails();
      const hasDerivedEntry = item
        ? (flowDetails.incomingByBehavior.get(item.behavior_ref) || []).some(entry => entry.relation?.relation_type !== 'loop')
        : false;
      const isControlNode = item ? ['decision', 'parallel_split', 'parallel_join'].includes(item.node_type) : false;
      const nodeTypeHint = item?.node_type === 'parallel_split'
        ? '并行开始是控制节点，不承担实际业务动作。请在流程关系中至少新增2条以本节点为起点、流向不同后续行为的并行路线。'
        : item?.node_type === 'parallel_join'
          ? '并行汇合是控制节点，不承担实际业务动作。请在流程关系中至少建立2条以本节点为终点的并行路线。'
          : item?.node_type === 'decision'
            ? '判断节点只表示流程分支控制，不代表执行部门或实际办理动作。'
          : '新增时默认留空，必须由编制人判断。实际办理工作请选择“业务行为”。';
      const projectedItems = flowItems();
      const selector = projectedItems.length
        ? projectedItems.map((flowItem, flowIndex) => {
            const behavior = flowItem.behavior;
            const behaviorIndex = flowItem.behaviorIndex;
            const externalDepartment = externalActorDepartment(behavior.current_actor_role);
            const assignmentMode = actorAssignmentMode(behavior);
            const behaviorBadge = assignmentMode === 'dynamic_from_data'
              ? '动态责任部门行为'
              : assignmentMode === 'company_wide'
                ? '全公司通用行为'
                : externalDepartment
                    ? '跨部门行为'
                    : behavior.node_type === 'action'
                      ? '本部门行为'
                      : '流程节点';
            return `
            <div class="selector-row" data-sort-kind="behavior" data-sort-ref="${escapeAttribute(behavior.behavior_ref)}">
              <button
                class="selector-button flow-item-button${behavior.behavior_ref === item?.behavior_ref ? ' active' : ''}"
                data-action="select-behavior"
                data-ref="${escapeAttribute(behavior.behavior_ref)}"
              ><span class="flow-item-badge">${behaviorBadge}</span><span>${flowIndex + 1}. ${escapeHtml(behavior.behavior_name || '未命名业务行为')}</span></button>
              ${itemDragHandle('behavior', behavior.behavior_ref, behaviorIndex, '业务行为')}
            </div>
          `;
          }).join('')
        : '<span class="technical-note">尚未添加业务行为或控制节点。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(item.behavior_ref)}">
            <div class="item-title">
              <strong>业务行为或节点 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-behavior" data-index="${index}">删除当前行为</button>
            </div>
            <div class="grid">
              ${field(`behaviors.${index}.node_type`, '节点类型', { type: 'select', options: NODE_TYPES, hint: nodeTypeHint })}
              ${field(`behaviors.${index}.behavior_name`, '业务行为或节点名称', { hint: '这是流程节点的主内容，用于流程图、流程关系和工作角色绑定。' })}
              ${isControlNode ? `
                <div class="field wide"><span class="field-label">流程控制</span><div class="inline-note">流程控制，不代表执行部门。已有的执行主体、动作、时限和完成标准只读保留，切换类型不会删除。</div></div>
                <div class="field wide"><span class="field-label">原普通行为字段（只读）</span><div class="technical-note">执行主体：${escapeHtml(item.current_actor_role || '空')}<br>具体做什么：${escapeHtml(item.behavior_description || '空')}<br>办理时限：${escapeHtml(item.timing || '空')}<br>完成标准：${escapeHtml(item.completion_standard || '空')}</div></div>` : `
                ${field(`behaviors.${index}.behavior_description`, '具体做什么（逐动作说明）', {
                  type: 'textarea',
                  className: 'wide',
                  hint: '按实际顺序写明每个动作、处理对象和结果。不要用抽象、定性表述代替实际动作。'
                })}
                ${actorAssignmentEditor(index, item, flowDetails)}
                ${hasDerivedEntry ? '' : field(`behaviors.${index}.trigger`, '流程如何开始', {
                  type: 'textarea',
                  className: 'half',
                  hint: '只有没有非回路入边的流程入口节点可编辑。'
                })}
                ${field(`behaviors.${index}.timing`, '办理时限（可选）', { nullable: true })}
                ${field(`behaviors.${index}.completion_standard`, '怎样算完成', {
                    type: 'textarea',
                    className: 'half',
                    hint: '只写该行为完成的判定标准，不重复填写输出物名称。'
                  })}`}
              ${renderBehaviorDerivedSummary(item, flowDetails)}
            </div>
            <details class="nested">
              <summary><strong>其他开始条件与会签（按需填写）</strong></summary>
              <div class="grid" style="margin-top:12px">
                ${field(`behaviors.${index}.precondition`, '其他开始条件（可选）', {
                  type: 'textarea',
                  className: 'wide',
                  hint: '只填写流程关系和输入数据不能表达的额外限制；没有额外限制时留空。'
                })}
                ${field(`behaviors.${index}.countersign_all_required`, '会签要求', { type: 'checkbox', className: 'wide', checkboxLabel: '这是会签行为，全部指定对象确认知悉后才算完成' })}
                ${multiDepartments(`behaviors.${index}.countersign_target_departments`, '需要确认知悉的部门', item.countersign_target_departments)}
              </div>
            </details>
            ${renderLegacyBehaviorSupplement(item, hasDerivedEntry)}
            ${renderLegacyCrossDepartmentGuidance(item)}
          </div>
        </div>` : `<div class="record-editor">${emptyList('尚未添加业务流程步骤。点击“添加业务行为或节点”开始编制。')}</div>`;
      const body = `
        <div class="record-workbench">
          <aside class="record-selector" aria-label="业务流程步骤列表">${selector}</aside>
          ${editor}
        </div>`;
      return section(
        '业务流程',
        '本部门行为和跨部门行为统一维护。执行部门与归口部门不同时，页面自动标记为跨部门行为；流程先后统一在“流程关系”中维护。',
        body,
        '<button class="button small" data-action="add-behavior">添加业务行为或节点</button>'
      );
    }

    function renderRelations() {
      const active = ensureActiveRelation();
      const item = active.item;
      const index = active.index;
      const guidance = `
        <aside class="relation-guidance" aria-labelledby="relationGuidanceTitle">
          <h3 id="relationGuidanceTitle">顺序、判断分支、流程内部回路和并行路线怎么选？</h3>
          <div class="relation-guidance-grid">
            <div class="relation-guidance-card">
              <strong>顺序</strong>
              <p>当前节点完成后，默认进入下一业务行为。判断节点可以用一条顺序关系表示默认继续路径，不需要填写条件。</p>
            </div>
            <div class="relation-guidance-card">
              <strong>判断分支</strong>
              <p>需要按某个明确判断结果进入后续步骤时使用。需要填写判断条件和要去的步骤。</p>
            </div>
            <div class="relation-guidance-card">
              <strong>流程内部回路</strong>
              <p>因为审核不通过、材料有误等原因，退回本流程前面已经存在的步骤重新处理。需要填写退回条件和退回位置。</p>
            </div>
            <div class="relation-guidance-card">
              <strong>并行路线</strong>
              <p>从并行开始节点同时启动多条办理路线时使用。并行开始至少需要2条并行路线；并行汇合至少需要2个有效来源。</p>
            </div>
          </div>
          <p class="relation-guidance-emphasis">承接顺序或判断分支的后续节点仍可以是普通业务行为。是否选择判断节点，只取决于该节点本身是否还要继续判断。</p>
          <p class="relation-guidance-example">例：部门负责人审核报销单。审核通过 → 使用顺序关系进入财务复核；审核不通过 → 使用流程内部回路退回申请人补充材料。财务复核仍是普通业务行为。</p>
        </aside>`;
      const selector = currentDocument().flow_relations.length
        ? currentDocument().flow_relations.map((relation, relationIndex) =>
            orderedSelectorRow(
              'relation',
              relation.relation_ref,
              relationIndex,
              currentDocument().flow_relations.length,
              '流程关系',
              relationSelectorLabel(relation, relationIndex),
              activeRelationRef
            )
          ).join('')
        : '<span class="technical-note">尚未添加流程关系。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="relation" data-focus-ref="${escapeAttribute(item.relation_ref)}">
            <div class="item-title">
              <strong>流程关系 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-relation" data-index="${index}">删除当前关系</button>
            </div>
            <div class="grid">
              ${field(`flow_relations.${index}.relation_type`, '关系类型', {
                type: 'select',
                options: RELATION_TYPES,
                hint: '默认继续下一步选择“顺序”；按判断结果进入后续步骤选择“判断分支”；退回前序步骤选择“流程内部回路”；同时启动或汇合多条路线选择“并行路线”。'
              })}
              ${behaviorSelect(`flow_relations.${index}.from_behavior_ref`, '从哪个行为开始', { blankLabel: '请选择' })}
              ${behaviorSelect(`flow_relations.${index}.to_behavior_ref`, '流向哪个行为')}
              ${field(`flow_relations.${index}.condition`, '判断分支条件或回路触发条件（顺序关系可不填）', { type: 'textarea', className: 'half' })}
            </div>
          </div>
        </div>` : `
        <div class="record-editor">${emptyList('尚未添加流程关系。点击“添加流程关系”开始编制。')}</div>`;
      const workbench = `
        <div class="record-workbench">
          <aside class="record-selector" aria-label="流程关系列表">${selector}</aside>
          ${editor}
        </div>`;
      return section(
        '流程关系',
        '一次只编辑一条流程关系。左侧顺序只用于整理条目，不代表流程先后关系。',
        `${guidance}${workbench}`,
        '<button class="button small" data-action="add-relation">添加流程关系</button>'
      );
    }

    function behaviorOptions(includeEmpty = false) {
      const owner = currentExecutionDepartment();
      const values = (currentDocument()?.behaviors || []).map((behavior, index) => {
        const mode = actorAssignmentMode(behavior);
        const parsed = parseActorRole(behavior.current_actor_role);
        const department = mode === 'company_wide'
          ? '全公司通用'
          : mode === 'dynamic_from_data'
            ? '运行时责任部门'
            : parsed.department || '执行部门待选择';
        const crossDepartment = mode === 'fixed_department'
          && owner
          && parsed.department
          && parsed.department !== owner
          && parsed.department !== '全公司';
        return {
          value: behavior.behavior_ref,
          label: `${index + 1}. ${department}${crossDepartment ? '（跨部门）' : ''} · ${behavior.behavior_name || '未命名行为'}`
        };
      });
      return includeEmpty ? [{ value: '', label: '请选择' }, ...values] : values;
    }

    function dataOptions(includeEmpty = true) {
      const values = (currentDocument()?.data_objects || []).map((item, index) => ({
        value: item.data_ref,
        label: dataSelectorLabel(item, index)
      }));
      return includeEmpty ? [{ value: '', label: '暂不选择' }, ...values] : values;
    }

    function dataBehaviorLinksEditor(item, dataIndex) {
      const rows = (item.behavior_links || []).map((link, linkIndex) => `
        <div class="item-card" data-focus-path="data_objects.${dataIndex}.behavior_links.${linkIndex}">
          <div class="grid">
            ${field(`data_objects.${dataIndex}.behavior_links.${linkIndex}.behavior_ref`, '业务行为', {
              type: 'select', options: behaviorOptions()
            })}
            ${field(`data_objects.${dataIndex}.behavior_links.${linkIndex}.operation`, '对数据的操作', {
              type: 'select', options: DATA_OPERATIONS
            })}
          </div>
          <button class="button danger small" data-action="remove-data-behavior-link" data-index="${linkIndex}" data-data-index="${dataIndex}">删除关系</button>
        </div>`).join('');
      return `
        <div class="field wide">
          <span class="field-label">业务行为与数据的关系</span>
          <div class="inline-note">一项数据最多确认一个“创建”行为，可以有多个“更新”和“使用”行为。系统不会根据表单或名称自动生成关系。</div>
          ${rows || emptyList('尚未登记创建、更新或使用关系。')}
          <button class="button small" data-action="add-data-behavior-link" data-data-index="${dataIndex}">添加行为关系</button>
        </div>`;
    }

    function dataSourceRelationsEditor(item, dataIndex) {
      const rows = (item.source_relations || []).map((source, sourceIndex) => `
        <div class="item-card" data-focus-path="data_objects.${dataIndex}.source_relations.${sourceIndex}">
          <div class="grid">
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_department`, '来源部门', {
              type: 'select', options: [{ value: '', label: '待补充' }, ...DEPARTMENTS.map(value => ({ value, label: value }))]
            })}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_process_name`, '来源流程名称')}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_behavior_name`, '来源行为名称')}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.source_data_name`, '来源数据名称')}
            ${field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.availability_mode`, '在当前流程何时可用', {
              type: 'select',
              options: [
                { value: 'pending_confirmation', label: '待确认' },
                { value: 'process_start', label: '流程开始前已可用' },
                { value: 'at_behavior', label: '到指定业务行为时可用' }
              ]
            })}
            ${source.availability_mode === 'at_behavior'
              ? field(`data_objects.${dataIndex}.source_relations.${sourceIndex}.available_from_behavior_ref`, '可用位置', {
                  type: 'select', options: behaviorOptions(true), nullable: true
                })
              : ''}
          </div>
          <button class="button danger small" data-action="remove-data-source" data-index="${sourceIndex}" data-data-index="${dataIndex}">删除来源线索</button>
        </div>`).join('');
      return `
        <div class="field wide">
          <span class="field-label">其他流程或外部来源线索</span>
          <div class="inline-note">这里记录线索，不绑定其他流程文件，也不判断权威源。来源部门、流程和行为可以暂缺，页面会逐项提示。</div>
          ${rows || emptyList('没有来源线索。本流程本地创建的数据可以不填写。')}
          <button class="button small secondary" data-action="add-data-source" data-data-index="${dataIndex}">添加来源线索</button>
        </div>`;
    }

    function renderDataObjects() {
      const active = ensureActiveDataObject();
      const item = active.item;
      const index = active.index;
      const selector = currentDocument().data_objects.length
        ? currentDocument().data_objects.map((dataObject, dataIndex) =>
            orderedSelectorRow(
              'data', dataObject.data_ref, dataIndex, currentDocument().data_objects.length,
              '输出物与数据', dataSelectorLabel(dataObject, dataIndex), activeDataRef
            )
          ).join('')
        : '<span class="technical-note">尚未登记数据对象。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="data" data-focus-ref="${escapeAttribute(item.data_ref)}">
            <div class="item-title">
              <strong>信息输出或数据 ${index + 1}</strong>
              <div class="item-actions">
                ${text(item.data_name).trim() && currentDocument().data_objects.some(other => other !== item && text(other.data_name).trim() === text(item.data_name).trim())
                  ? `<button class="button secondary small" data-action="merge-duplicate-data" data-index="${index}">归并同名数据</button>`
                  : ''}
                <button class="button danger small" data-action="remove-data" data-index="${index}">删除当前数据</button>
              </div>
            </div>
            <div class="grid">
              ${field(`data_objects.${index}.data_name`, '数据名称')}
              ${field(`data_objects.${index}.information_type`, '信息类型', {
                type: 'select',
                options: INFORMATION_TYPE_OPTIONS,
                hint: '示例只用于帮助判断类型，不会写入导出的结构化文件。'
              })}
              ${field(`data_objects.${index}.description`, '数据说明', { type: 'textarea', className: 'wide' })}
              ${dataBehaviorLinksEditor(item, index)}
              ${dataSourceRelationsEditor(item, index)}
            </div>
          </div>
        </div>` : `<div class="record-editor">${emptyList('尚未登记数据对象。点击“登记数据对象”开始编制。')}</div>`;
      const body = `<div class="record-workbench"><aside class="record-selector" aria-label="输出物与数据列表">${selector}</aside>${editor}</div>`;
      return section(
        '输出物与数据使用',
        '这里只结构化信息输出。实物和服务结果写在业务行为的完成标准中；需要追溯时，登记其记录或数据。3001不判断主数据、权威源、数据责任和质量规则。',
        body,
        '<button class="button small" data-action="add-data">登记数据对象</button>'
      );
    }

    function relatedFormFields(dataRef) {
      const results = [];
      (currentDocument()?.forms || []).forEach((form, formIndex) => (form.areas || []).forEach((area, areaIndex) =>
        (area.items || []).forEach((item, itemIndex) => {
          const ownership = item.business_data_ref === dataRef;
          const sourceRoles = (item.source_links || [])
            .filter(link => link.source_data_ref === dataRef)
            .map(link => FIELD_SOURCE_ROLES.find(option => option.value === link.source_role)?.label || link.source_role);
          if (!ownership && !sourceRoles.length) return;
          results.push({ form, formIndex, area, areaIndex, item, itemIndex, ownership, sourceRoles });
        })
      ));
      return results;
    }

    function renderRelationshipOverview() {
      const rows = (currentDocument()?.data_objects || []).map((item, index) => {
        const links = operation => (item.behavior_links || []).filter(link => link.operation === operation).map(link => behaviorLabel(link.behavior_ref));
        const sources = (item.source_relations || []).map(source =>
          [source.source_department, source.source_process_name, source.source_behavior_name, source.source_data_name].map(text).filter(Boolean).join(' / ') || '来源待补充'
        );
        const fields = relatedFormFields(item.data_ref);
        const pendingCount = (item.information_type === 'pending_confirmation' ? 1 : 0)
          + (item.behavior_links || []).filter(link => link.operation === 'pending_confirmation').length
          + (item.source_relations || []).filter(source => source.availability_mode === 'pending_confirmation').length
          + fields.filter(fieldItem => fieldItem.item.value_origin_mode === 'pending_confirmation').length;
        return `
          <details class="nested" data-focus-kind="data" data-focus-ref="${escapeAttribute(item.data_ref)}">
            <summary><strong>${index + 1}. ${escapeHtml(item.data_name || '未命名数据')}</strong> · ${escapeHtml(INFORMATION_TYPES.find(option => option.value === item.information_type)?.label || '类型待确认')} · ${pendingCount ? `${pendingCount}项待确认` : '关系已登记'}</summary>
            <div class="grid" style="margin-top:12px">
              <div class="inline-note"><strong>来源：</strong>${escapeHtml(sources.length ? sources.join('；') : '本流程本地创建或来源未登记')}</div>
              <div class="inline-note"><strong>创建：</strong>${escapeHtml(links('create').join('、') || '未登记')}</div>
              <div class="inline-note"><strong>更新：</strong>${escapeHtml(links('update').join('、') || '未登记')}</div>
              <div class="inline-note"><strong>使用：</strong>${escapeHtml(links('use').join('、') || '未登记')}</div>
              <div class="inline-note wide"><strong>表单与字段：</strong>${escapeHtml(fields.length ? fields.map(fieldItem => `${fieldItem.form.form_name || '未命名表单'} / ${fieldItem.item.item_name || '未命名字段'}${fieldItem.ownership ? '（归属）' : ''}${fieldItem.sourceRoles.length ? `（${fieldItem.sourceRoles.join('、')}）` : ''}`).join('；') : '未关联')}</div>
            </div>
            <button class="button secondary small" data-action="open-data-from-overview" data-ref="${escapeAttribute(item.data_ref)}">返回输出物与数据编辑</button>
          </details>`;
      }).join('');
      return section(
        '数据与表单关系总览',
        '按数据查看来源、创建、更新、使用以及表单字段关系。这里仅供核对，编辑仍回到“输出物与数据”或“表单与记录”。',
        rows || emptyList('尚未登记数据对象。')
      );
    }

    function formBehaviorLinksEditor(form, formIndex) {
      const rows = (form.behavior_links || []).map((link, linkIndex) => {
        const operationsPath = `forms.${formIndex}.behavior_links.${linkIndex}.operations`;
        return `
          <div class="item-card" data-focus-path="forms.${formIndex}.behavior_links.${linkIndex}">
            <div class="grid">
              ${field(`forms.${formIndex}.behavior_links.${linkIndex}.behavior_ref`, '业务行为', {
                type: 'select', options: behaviorOptions()
              })}
              <div class="field wide">
                <span class="field-label">如何处理这张表单</span>
                <div class="check-list">${FORM_OPERATIONS.map(option => `
                  <label><input type="checkbox" data-list-bind="${escapeAttribute(operationsPath)}" value="${option.value}"${(link.operations || []).includes(option.value) ? ' checked' : ''}> ${option.label}</label>
                `).join('')}</div>
              </div>
              ${field(`forms.${formIndex}.behavior_links.${linkIndex}.notes`, '业务说明（可选）', { type: 'textarea', className: 'wide' })}
            </div>
            <button class="button danger small" data-action="remove-form-behavior-link" data-form-index="${formIndex}" data-index="${linkIndex}">删除关系</button>
          </div>`;
      }).join('');
      return `
        <div class="field wide" data-focus-path="forms.${formIndex}.behavior_links">
          <span class="field-label">这张表单如何被处理</span>
          <div class="inline-note">关系按流程中的业务行为顺序阅读，不单独排序。未选择处理方式时，该关系保持待确认；系统不会根据字段或表单名称推断操作。</div>
          ${rows || emptyList('尚未登记表单与业务行为的关系。')}
          <button class="button small" data-action="add-form-behavior-link" data-form-index="${formIndex}">添加表单处理关系</button>
        </div>`;
    }

    function formFieldSourceSummary(item) {
      const links = Array.isArray(item.source_links) ? item.source_links : [];
      if (!links.length) return '未登记来源';
      return links.map(link => {
        const role = FIELD_SOURCE_ROLES.find(option => option.value === link.source_role)?.label || '作用待确认';
        if (link.source_type === 'external_system') {
          const systemName = text(link.source_system_name).trim() || '系统待填写';
          const dataName = text(link.source_data_name).trim() || '数据待填写';
          return `外部系统：${systemName} / ${dataName}（${role}）`;
        }
        const dataObject = currentDocument().data_objects.find(data => data.data_ref === link.source_data_ref);
        return `${dataObject?.data_name || '数据待选择'}（${role}）`;
      }).join('；');
    }

    function formFieldRelationSummary(item) {
      const ownership = currentDocument().data_objects.find(data => data.data_ref === item.business_data_ref)?.data_name || '未选择';
      const origin = FIELD_ORIGIN_MODES.find(option => option.value === item.value_origin_mode)?.label || '待确认';
      return `业务数据归属：${ownership}；取值方式：${origin}；取值来源：${formFieldSourceSummary(item)}`;
    }

    function formFieldRelationStatus(item) {
      const parts = [];
      if (item.business_data_ref) parts.push('已归属');
      if (item.value_origin_mode === 'direct_current_process') parts.push('当前流程取值');
      if (item.value_origin_mode === 'depends_on_data') {
        parts.push((item.source_links || []).length ? `${item.source_links.length}项来源` : '来源待登记');
      }
      if (item.value_origin_mode === 'pending_confirmation' || !item.value_origin_mode) parts.push('取值待确认');
      return parts.join(' · ') || '待登记';
    }

    function activeFieldContext(form, formIndex) {
      for (let areaIndex = 0; areaIndex < form.areas.length; areaIndex += 1) {
        const area = form.areas[areaIndex];
        const itemIndex = area.items.findIndex(item => item.item_ref === activeFormItemRef);
        if (itemIndex >= 0) return { form, formIndex, area, areaIndex, item: area.items[itemIndex], itemIndex };
      }
      return null;
    }

    function renderFieldRelationEditor(form, formIndex) {
      const context = activeFieldContext(form, formIndex);
      if (!context) return '';
      const { areaIndex, item, itemIndex } = context;
      const itemPath = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}`;
      const rows = (item.source_links || []).map((link, linkIndex) => {
        const linkPath = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.source_links.${linkIndex}`;
        const sourceType = link.source_type === 'external_system' ? 'external_system' : 'process_data';
        return `
          <div class="item-card">
            <div class="grid">
              ${field(`${linkPath}.source_type`, '来源类型', {
                type: 'select', options: FIELD_SOURCE_TYPES
              })}
              ${sourceType === 'external_system'
                ? `${field(`${linkPath}.source_system_name`, '外部系统名称')}
                   ${field(`${linkPath}.source_data_name`, '来源数据名称')}`
                : field(`${linkPath}.source_data_ref`, '来源数据', {
                    type: 'select', options: dataOptions()
                  })}
              ${field(`${linkPath}.source_role`, '来源作用', {
                type: 'select', options: FIELD_SOURCE_ROLES
              })}
            </div>
            <button class="button danger small" data-action="remove-field-source" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-item-index="${itemIndex}" data-index="${linkIndex}">删除来源</button>
          </div>`;
      }).join('');
      return `
        <aside class="item-card" data-focus-kind="area" data-focus-ref="${escapeAttribute(context.area.area_ref)}">
          <div class="item-title">
            <strong>字段数据关系：${escapeHtml(item.item_name || '未命名字段')}</strong>
            <button class="button secondary small" data-action="close-field-relations">关闭</button>
          </div>
          <div class="inline-note">业务数据归属表示字段属于哪项业务数据，取值方式表示字段值如何取得。取值来源可以选择本流程已登记的数据，也可以直接登记外部系统和来源数据名称；选择外部系统时不需要关联本流程业务行为。</div>
          <div class="grid">
            ${field(`${itemPath}.business_data_ref`, '业务数据归属', { type: 'select', options: dataOptions(), nullable: true })}
            ${field(`${itemPath}.value_origin_mode`, '取值方式', { type: 'select', options: FIELD_ORIGIN_MODES })}
            <div class="field wide" data-focus-key="${escapeAttribute(`${itemPath}.source_links`)}" tabindex="-1">
              <span class="field-label">取值来源</span>
              ${rows || emptyList('尚未登记取值来源。')}
              <button class="button small" data-action="add-field-source" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-item-index="${itemIndex}">添加取值来源</button>
            </div>
          </div>
        </aside>`;
    }

    function renderForms() {
      const active = ensureActiveForm();
      const addButtons = `
        <div class="form-primary-actions">
          <button class="button small" data-action="add-current-form">录入现有表单</button>
          <button class="button small secondary" data-action="add-proposed-form">设计新建／优化表单</button>
        </div>`;
      if (!active.form) {
        return section(
          '表单与记录',
          '按一张纸质表单的完整字段录入。只有新增表单后才创建空白编辑对象，3001不会自动生成表单。',
          emptyList('当前流程没有表单或记录。'),
          addButtons
        );
      }

      const { form, formIndex } = active;
      const formSelector = currentDocument().forms.map((item, index) => `
        <button
          class="selector-button${item.form_ref === form.form_ref ? ' active' : ''}"
          data-action="select-form"
          data-ref="${escapeAttribute(item.form_ref)}"
        ><span>${index + 1}. ${escapeHtml(item.form_name || '未命名表单或记录')}</span>${formDesignStateBadge(item.form_design_state)}</button>
      `).join('');

      let detailNumber = 0;
      let mainNumber = 0;
      let unassignedNumber = 0;
      const detailAreaIndices = form.areas
        .map((area, areaIndex) => area.area_type === '明细清单' ? areaIndex : -1)
        .filter(areaIndex => areaIndex >= 0);
      const groups = form.areas.map((area, areaIndex) => {
        let groupLabel = '';
        let groupClass = '';
        let detailPosition = -1;
        if (area.area_type === '基本信息') {
          mainNumber += 1;
          groupLabel = mainNumber === 1 ? '主表字段' : `主表字段 ${mainNumber}`;
        } else if (area.area_type === '明细清单') {
          detailNumber += 1;
          detailPosition = detailAreaIndices.indexOf(areaIndex);
          groupLabel = area.area_title || `明细表${detailNumber}`;
        } else {
          unassignedNumber += 1;
          groupLabel = unassignedNumber === 1 ? '字段归属待确认' : `字段归属待确认 ${unassignedNumber}`;
          groupClass = ' unassigned';
        }
        const rows = area.items.map((item, itemIndex) => `
          <tr class="form-field-row" data-focus-kind="area" data-focus-ref="${escapeAttribute(area.area_ref)}" data-item-ref="${escapeAttribute(item.item_ref)}">
            <td class="form-field-number" data-label="序号">${itemIndex + 1}</td>
            <td data-label="字段名称">
              ${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.item_name`, '字段名称')}
              <div class="form-field-relation-access">
                <button class="button secondary small" data-action="edit-field-relations" data-ref="${escapeAttribute(item.item_ref)}" title="${escapeAttribute(formFieldRelationSummary(item))}">数据关系</button>
                <span class="form-field-relation-status">${escapeHtml(formFieldRelationStatus(item))}</span>
              </div>
            </td>
            <td data-label="数据类型">${formItemTypeField(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.item_type`, item.item_type)}</td>
            <td data-label="字段归属">${formItemAssignmentField(formIndex, areaIndex, itemIndex, item)}</td>
            <td data-label="必填">${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.required`, '是否必填', { type: 'checkbox', checkboxLabel: '必填' })}</td>
            <td class="form-field-instructions" data-label="填写说明">${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.instructions`, '填写说明', { type: 'textarea' })}</td>
            <td data-label="排序">
              <div class="form-field-actions">
                <button class="button secondary small" data-action="move-form-item-up" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="上移字段${itemIndex + 1}" title="上移" ${itemIndex === 0 ? 'disabled' : ''}>↑</button>
                <button class="button secondary small" data-action="move-form-item-down" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="下移字段${itemIndex + 1}" title="下移" ${itemIndex === area.items.length - 1 ? 'disabled' : ''}>↓</button>
              </div>
            </td>
            <td data-label="删除"><button class="button danger small" data-action="remove-form-item" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="删除字段${itemIndex + 1}">删除</button></td>
          </tr>`).join('');
        const groupHead = area.area_type === '明细清单' ? `
          <div class="form-field-group-head">
            <div class="form-field-group-title">
              <strong>${escapeHtml(groupLabel)}</strong>
              ${field(`forms.${formIndex}.areas.${areaIndex}.area_title`, '明细表标题', { placeholder: `未填写时页面显示“明细表${detailNumber}”` })}
            </div>
            <div class="item-actions">
              <button class="button secondary small" data-action="move-detail-area-up" data-form-index="${formIndex}" data-index="${areaIndex}" ${detailPosition <= 0 ? 'disabled' : ''}>上移明细表</button>
              <button class="button secondary small" data-action="move-detail-area-down" data-form-index="${formIndex}" data-index="${areaIndex}" ${detailPosition === detailAreaIndices.length - 1 ? 'disabled' : ''}>下移明细表</button>
              <button class="button danger small" data-action="remove-detail-area" data-form-index="${formIndex}" data-index="${areaIndex}">删除明细表</button>
            </div>
          </div>` : `<div class="form-field-group-head"><strong>${escapeHtml(groupLabel)}</strong></div>`;
        return `
          <tbody class="form-field-group${groupClass}" data-focus-kind="area" data-focus-ref="${escapeAttribute(area.area_ref)}">
            <tr class="form-field-group-row${groupClass}"><th colspan="8">${groupHead}</th></tr>
            ${rows || `<tr class="form-field-group-empty"><td colspan="8">${escapeHtml(`${groupLabel}中还没有字段。`)}</td></tr>`}
          </tbody>`;
      }).join('');
      const fieldsTable = form.areas.length ? `
        <div class="form-field-table-shell">
          <table class="form-field-table">
            <colgroup>
              <col style="width:54px"><col style="width:230px"><col style="width:135px"><col style="width:160px">
              <col style="width:82px"><col style="width:363px"><col style="width:90px"><col style="width:76px">
            </colgroup>
            <thead><tr><th>序号</th><th>字段名称</th><th>数据类型</th><th>字段归属</th><th>必填</th><th>填写说明</th><th>排序</th><th>删除</th></tr></thead>
            ${groups}
          </table>
        </div>` : emptyList('尚未录入字段。点击“添加字段”后，再明确字段属于主表还是哪张明细表。');

      const body = `
        <div class="form-workbench">
          <aside class="form-sidebar">
            ${formSelector}
          </aside>
          <div class="form-editor">
            <div class="item-card" data-focus-kind="form" data-focus-ref="${escapeAttribute(form.form_ref)}">
              <div class="item-title">
                <strong>整张表单</strong>
                <button class="button danger small" data-action="remove-form" data-index="${formIndex}">删除当前表单或记录</button>
              </div>
              <div class="grid">
                ${field(`forms.${formIndex}.form_design_state`, '表单状态', {
                  type: 'select',
                  options: [
                    { value: 'unspecified', label: '待确认（历史文件兼容）' },
                    { value: 'current_state', label: '现状表单' },
                    { value: 'proposed_design', label: '新建或优化表单' }
                  ],
                  hint: '3001不会根据名称、编号或明细表数量推断。'
                })}
                ${field(`forms.${formIndex}.form_name`, '表单或记录名称')}
                ${field(`forms.${formIndex}.form_no`, '表单或记录编号（如有）', { nullable: true })}
                ${formBehaviorLinksEditor(form, formIndex)}
              </div>
            </div>
            ${fieldsTable}
            <button class="button small" data-action="add-form-item" data-form-index="${formIndex}">添加字段</button>
            ${renderFieldRelationEditor(form, formIndex)}
          </div>
        </div>`;
      return section(
        '表单与记录',
        '按纸质表单原样录入全部字段；有几张明细表就保留几张。',
        body,
        addButtons
      );
    }

    function renderTerms() {
      const active = ensureActiveTerm();
      const item = active.item;
      const index = active.index;
      const selector = currentDocument().terms.length
        ? currentDocument().terms.map((term, termIndex) => orderedSelectorRow(
            'term', term.term_ref, termIndex, currentDocument().terms.length,
            '术语', `${termIndex + 1}. ${term.term_name || '未命名术语'}`, activeTermRef
          )).join('')
        : '<span class="technical-note">尚未添加术语。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="term" data-focus-ref="${escapeAttribute(item.term_ref)}">
            <div class="item-title">
              <strong>术语 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-term" data-index="${index}">删除当前术语</button>
            </div>
            <div class="grid">
              ${field(`terms.${index}.term_name`, '术语名称')}
              ${field(`terms.${index}.definition`, '定义', { type: 'textarea', className: 'wide' })}
            </div>
          </div>
        </div>` : `<div class="record-editor">${emptyList('尚未添加术语。点击“添加术语”开始编制。')}</div>`;
      const body = `<div class="record-workbench"><aside class="record-selector" aria-label="术语定义列表">${selector}</aside>${editor}</div>`;
      return section(
        '术语定义',
        '只记录本流程需要解释的业务术语。左侧顺序只用于整理条目，不改变术语技术标识。',
        body,
        '<button class="button small" data-action="add-term">添加术语</button>'
      );
    }

    function renderProcessEditor() {
      const content = {
        behaviors: renderBehaviors,
        relations: renderRelations,
        data: renderDataObjects,
        relationships: renderRelationshipOverview
      }[activeProcessSection] || renderBehaviors;
      return `${renderProcessNavigation()}${content()}`;
    }

    function exportWarningLocationAttributes(item) {
      const focusPaths = Array.isArray(item.focusPaths) && item.focusPaths.length
        ? JSON.stringify(item.focusPaths)
        : '';
      return [
        ['data-editor-section', item.editorSection],
        ['data-process-section', item.processSection],
        ['data-focus-kind', item.focusKind],
        ['data-focus-ref', item.focusRef],
        ['data-focus-path', item.focusPath],
        ['data-focus-paths', focusPaths]
      ]
        .filter(([, value]) => text(value))
        .map(([name, value]) => `${name}="${escapeAttribute(value)}"`)
        .join(' ');
    }

    function currentStructureScoreKey() {
      try {
        return `${currentIndex}:${JSON.stringify(currentDocument())}`;
      } catch (_error) {
        return `${currentIndex}:unserializable`;
      }
    }

    function createStructureScoreSnapshot() {
      const snapshot = JSON.parse(JSON.stringify(currentDocument()));
      return snapshot;
    }

    function ensureStructureScoreState() {
      const documentKey = currentStructureScoreKey();
      if (
        structureScoreState.candidateIndex === currentIndex
        && structureScoreState.documentKey === documentKey
        && structureScoreState.status !== 'idle'
      ) {
        return structureScoreState;
      }

      const scoring = globalThis.StructureLearningScore;
      if (!scoring) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '评分模块暂时不可用。当前页面内容不受影响，请联系维护人员检查3001静态资源。'
        };
        return structureScoreState;
      }

      try {
        const snapshot = createStructureScoreSnapshot();
        const contentResult = scoring.evaluateContent(snapshot, { departments: actorDepartments() });
        structureScoreState = {
          status: 'pending',
          candidateIndex: currentIndex,
          documentKey,
          result: scoring.finalize(contentResult, {
            status: 'pending',
            checks: {},
            message: '正在检查技术结构'
          }),
          message: '正在检查技术结构……'
        };
        const runId = ++structureScoreRunId;
        queueMicrotask(() => runStructureScore({
          runId,
          candidateIndex: currentIndex,
          documentKey,
          snapshot,
          contentResult
        }));
      } catch (_error) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '当前页面内容暂时无法生成评分快照。评分不会修改当前流程，请保持页面打开并重新评分。'
        };
      }
      return structureScoreState;
    }

    function warningSuggestions(item) {
      const suggestions = Array.isArray(item?.suggestions)
        ? item.suggestions.map(text).filter(Boolean)
        : [];
      return suggestions.length
        ? suggestions
        : ['点击本项返回对应位置，核对并补充相关内容。'];
    }

    function renderWarningCopy(item) {
      const suggestions = warningSuggestions(item);
      return `<span class="warning-fact"><strong>当前情况：</strong>${escapeHtml(item.message)}</span>
        ${suggestions.map((suggestion, index) => `
          <span class="warning-suggestion"><strong>${suggestions.length > 1 ? `建议${index + 1}` : '建议'}：</strong>${escapeHtml(suggestion)}</span>
        `).join('')}`;
    }

    function renderStructureScoreIssues(items, title, className = 'score-issue-list', open = true) {
      if (!items.length) return '';
      return `<details class="${className}"${open ? ' open' : ''}>
        <summary>${escapeHtml(title)}（${items.length}项）</summary>
        <ol>${items.map(item => {
          const attributes = exportWarningLocationAttributes(item);
          const message = attributes
            ? `<button
                class="diagram-warning-button export-warning-button"
                data-action="focus-export-warning"
                ${attributes}
              >${renderWarningCopy(item)}</button>`
            : `<span>${renderWarningCopy(item)}</span>`;
          return `<li>
            <div class="score-issue-line">
              <span class="score-issue-category">${escapeHtml(item.category)}</span>
              <div>
                ${message}
                ${item.effect ? `<small class="score-issue-effect">${escapeHtml(item.effect)}</small>` : ''}
              </div>
            </div>
          </li>`;
        }).join('')}</ol>
      </details>`;
    }

    function renderStructureScoreStandard() {
      const rule = globalThis.StructureLearningScore?.RULE;
      if (!rule) return '';
      const dimensions = rule.dimensions.map(item => `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td>${item.max}分</td>
          <td>${escapeHtml(item.description)}</td>
        </tr>`).join('');
      const technicalChecks = rule.technicalChecks
        .map(item => `${escapeHtml(item.label)}${item.points}分`)
        .join('、');
      const coefficients = rule.chainCoefficients
        .map(item => `${escapeHtml(item.label)}×${item.coefficient.toFixed(2)}`)
        .join('；');
      const grades = rule.grades
        .map(item => `${item.grade}：${escapeHtml(item.label)}`)
        .join('；');
      return `<details class="score-standard">
        <summary>查看评分标准</summary>
        <div class="score-standard-body">
          <p><strong>结构完整性</strong>为六个维度得分之和。各维度先保留1位小数，再相加得到满分100分的结构完整性。</p>
          <div class="score-table-wrap">
            <table>
              <thead><tr><th>评分维度</th><th>分值</th><th>本期检查内容</th></tr></thead>
              <tbody>${dimensions}</tbody>
            </table>
          </div>
          <p><strong>技术结构：</strong>${technicalChecks}。当前文件发生技术阻断时，展示分最高为59分；校验服务异常时暂停生成最终分数，不把系统故障算作用户扣分。</p>
          <p><strong>展示分：</strong>结构完整性 × 行为链系数。${coefficients}。</p>
          <p><strong>等级：</strong>${grades}。</p>
          <ul>

    function renderStructureScorePanel(state) {

      const unavailable = state.status === 'unavailable';
      const scoreText = result?.available ? result.completenessScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const displayText = result?.available ? result.displayScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const gradeText = result?.available ? result.grade : pending ? '待生成' : '—';
      const dimensions = rule?.dimensions?.map(item => {
        const value = result?.dimensions?.[item.key];
        const valueText = value === null || value === undefined
          ? item.key === 'technical' && pending ? '检查中' : '—'
          : `${Number(value).toFixed(1)} / ${item.max}`;
        return `<div class="score-dimension">
          <strong>${escapeHtml(item.label)}</strong>
          <span>${valueText}</span>
          <small>${escapeHtml(item.description)}</small>

      }).join('') || '';
      const scoredIssues = result?.issues || [];
      const previewIssues = result?.previewIssues || [];
      const blockerHtml = result?.blocker
        ? '<div class="score-blocker"><strong>技术阻断：</strong>当前展示分已按规则限制为最高59分。原有导出校验仍会阻止损坏的结构或技术引用。</div>'
        : '';
      const unavailableHtml = unavailable
        ? `<div class="score-unavailable"><strong>暂不能生成最终分数：</strong>${escapeHtml(state.message)}

        : '';
      const issueHtml = scoredIssues.length
        ? renderStructureScoreIssues(scoredIssues, '计分扣项与整改位置')
        : result?.available
          ? '<div class="notice">当前未发现计分扣项。</div>'
          : '';
      const previewHtml = renderStructureScoreIssues(
        previewIssues,
        '后续集中评审预告（本期不扣分）',
        'score-preview-list',
        false
      );
      return `<div class="score-panel" id="structureScorePanel" aria-live="polite">
        <div class="score-panel-head">
          <div>
            <h3>${escapeHtml(rule?.label || '结构化学习评分 v3（process-governance-v6）')}</h3>
            <p>评分根据当前页面内容自动生成，只用于结构化学习反馈，不写入导出JSON。</p>
          </div>
          <button class="button small" data-action="refresh-structure-score"${pending ? ' disabled' : ''}>重新评分</button>
        </div>
        <div class="score-summary-grid">
          <div class="score-summary-card primary">
            <span class="score-summary-label">结构完整性</span>
            <span class="score-summary-value">${scoreText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">六项结构维度得分之和</span>
          </div>
          <div class="score-summary-card primary">
            <span class="score-summary-label">展示分</span>
            <span class="score-summary-value">${displayText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">结构完整性 × 行为链系数</span>
          </div>
          <div class="score-summary-card">
            <span class="score-summary-label">等级与行为链</span>
            <span class="score-summary-value score-grade-${escapeAttribute(gradeText)}">${escapeHtml(gradeText)}</span>
            <span class="score-summary-note">有效行为链${result ? result.effectiveChainLength : 0}个行为 × ${(result?.chainCoefficient || 0.8).toFixed(2)}</span>
          </div>
        </div>
        <div class="score-dimension-grid">${dimensions}</div>

    function renderReviewReadinessIssues(items) {
      if (!items.length) return '';
      return `<ol class="review-issue-list">${items.map(item => {
        const attributes = exportWarningLocationAttributes(item);
        const content = attributes
          ? `<button

    function reviewRoutingWarnings(data) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring?.loopExitDetails || !scoring?.parallelRouteSafetyDetails) return [];
      const warnings = [];
      const behaviors = Array.isArray(data?.behaviors) ? data.behaviors : [];
      const relations = Array.isArray(data?.flow_relations) ? data.flow_relations : [];
      const behaviorMap = new Map(behaviors.map(item => [text(item.behavior_ref), item]));
      const behaviorLabel = ref => {
        const item = behaviorMap.get(text(ref));
        return text(item?.behavior_name) || text(ref) || '未命名节点';
      };
      const relationTarget = relation => ({
        editorSection: 'process',
        processSection: 'relations',
        focusKind: 'relation',
        focusRef: text(relation?.relation_ref),
        reviewAspect: 'routing'
      });
      const splitTarget = split => {
        const behaviorIndex = behaviors.indexOf(split);
        return {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: text(split?.behavior_ref),
          focusPath: behaviorIndex >= 0 ? `behaviors.${behaviorIndex}.node_type` : '',
          reviewAspect: 'routing'
        };
      };
      const addWarning = (message, target, suggestions) => warnings.push({
        message,
        suggestions,
        ...target
      });

      scoring.loopExitDetails(data).loops.forEach(detail => {
        const relationIndex = relations.indexOf(detail.relation);
        const relationLabel = relationIndex >= 0 ? `流程关系${relationIndex + 1}` : '当前回路关系';
        const sourceLabel = behaviorLabel(detail.sourceRef);
        const targetLabel = behaviorLabel(detail.targetRef);
        if (!detail.hasForwardPath) {
          addWarning(
            `${relationLabel}从“${sourceLabel}”返回“${targetLabel}”，但从返回位置沿前进关系不能重新到达“${sourceLabel}”。`,
            relationTarget(detail.relation),
            ['核对回路返回位置，并补充从返回位置重新进入本层检查节点的前进关系。']
          );
          return;
        }
        if (!detail.exitCount) {
          const nestedSuggestion = detail.nestedWithinRefs.length
            ? '内层循环的退出路线可以进入外层循环，但必须先离开本层循环体。'
            : '最外层循环必须增加通向循环外后续行为的退出路线。';
          addWarning(
            `${relationLabel}在“${sourceLabel}”没有通向本层循环外的退出路线。`,
            relationTarget(detail.relation),
            [nestedSuggestion, '为退出路线填写明确条件和目标行为。']
          );
        }
      });

      scoring.parallelRouteSafetyDetails(data).splits.forEach(detail => {
        if (detail.routeCount < 2) return;
        const splitLabel = behaviorLabel(detail.splitRef);
        if (!detail.hasCommonJoin) {
          addWarning(
            `并行开始“${splitLabel}”的${detail.routeCount}条路线没有共同到达同一个并行汇合节点。`,
            splitTarget(detail.split),
            ['需要同时执行全部路线时，使每条路线进入同一个并行汇合节点。', '只有一条结果路线会执行时，将该节点改为判断节点并填写分支条件。']
          );
        }
        detail.terminalRefs.forEach(terminalRef => {
          const terminalLabel = behaviorLabel(terminalRef);
          addWarning(
            `并行开始“${splitLabel}”中的“${terminalLabel}”在共同并行汇合前成为流程结束位置。`,
            splitTarget(detail.split),
            [`需要同时执行全部路线时，为“${terminalLabel}”补充进入共同并行汇合的后续关系。`, '该路线可能中止整个流程时，将并行开始改为判断节点并分别填写结果条件。']
          );
        });
      });
      return warnings;
    }

    function reviewBehaviorExecutabilityWarnings(data) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring?.behaviorExecutabilityDetails) return [];
      return scoring.behaviorExecutabilityDetails(data).issues.map(detail => {
        const target = {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: detail.behaviorRef,
          focusPath: `behaviors.${detail.behaviorIndex}.behavior_description`,
          reviewAspect: 'behaviorExecutability'
        };
        if (detail.reason === 'missing_description') {
          return {
            message: `“${detail.behaviorLabel}”未填写“具体做什么”，无法判断执行人员需要逐步完成哪些动作。`,
            suggestions: ['在“具体做什么”中按实际顺序填写每个动作，并写明各动作处理的对象和产生的结果。'],
            ...target
          };
        }
        if (detail.reason === 'abstract_qualitative_description') {
          return {
            message: `“${detail.behaviorLabel}”的“具体做什么”使用“${detail.matchedPattern}”这类抽象、定性表述，不能看出实际执行动作。`,
            suggestions: ['删除抽象结论，改写为执行人员实际核对、填写、修改、提交、反馈或归档的动作，并写明每个动作的对象。'],
            ...target
          };
        }
        return {
          message: `“${detail.behaviorLabel}”的“具体做什么”未写出可识别的具体业务动作。`,
          suggestions: ['按实际顺序补充具体动词和处理对象，并写明每个动作产生的结果。'],
          ...target
        };
      });
    }

      const patterns = globalThis.ReviewPatternDiagrams?.definitions?.() || [];
      const cards = patterns.map(pattern => `

              >${expandedReviewPatternId === pattern.id ? '退出展开' : '展开查看'}</button>
            </span>
          </div>
          <div class="review-pattern-diagram">
            <div

            <div class="review-pattern-failure" id="reviewPatternFailure-${escapeAttribute(pattern.id)}" role="alert"></div>
          </div>
          <p class="review-pattern-rule"><strong>评审规则：</strong>${escapeHtml(pattern.rule)}</p>
        </article>`).join('');
      const patternContent = cards || '<div class="score-unavailable">节点组合图例暂时无法加载；当前JSON不受影响，请联系维护人员检查3001静态资源。</div>';
      return `<details class="node-combination-guide" open>
        <summary>节点组合、循环退出与嵌套并行图例</summary>
        <div class="node-combination-body">
          <p class="node-combination-intro">先按组合表选择关系类型，再用可拖动、可缩放的图形化图例核对嵌套结构。<strong>仅用于理解关系，不属于当前流程，不代表评审通过。</strong>图例不新增字段，不修改当前JSON。</p>
          <div class="node-combination-legend" aria-label="图例符号">

          <div class="review-combination-table-shell">

    function renderReviewReadinessPanel(scoreState, businessIssues) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring?.evaluateReviewReadiness || !scoring?.REVIEW_READINESS) {
        return `<div class="review-readiness-panel">
          <div class="score-unavailable"><strong>五方面评审检查暂不可用：</strong>当前页面内容不受影响，请联系维护人员检查3001静态资源。</div>
        </div>`;
      }
      const technicalIssues = (scoreState.result?.issues || []).filter(item => item.category === '技术结构');
      const technical = scoreState.status === 'unavailable'
        ? { status: 'unavailable', blocker: false }
        : scoreState.result?.technical || { status: 'pending', blocker: false };
      const readiness = scoring.evaluateReviewReadiness(currentDocument(), {
        businessIssues,
        technicalIssues,
        technical
      });
      const operationNote = {
        ready: '页面自动检查未发现内容缺项。请按五方面逐项询问归口部门，确认当前JSON与真实做法一致后再下载。',
        prompt: `当前有${readiness.businessIssueCount}项业务内容需要补充或登记为待定。业务提示不阻止下载。`,
        blocker: `当前有${readiness.technicalIssueCount || 1}项结构错误。修复技术结构或损坏引用后才能下载。`,
        checking: '正在核对结构版本、技术引用、导出回读和内容保持；五方面业务提示已经列出。',
        unavailable: '技术检查服务暂不可用。请保持当前页面打开，服务恢复后点击“重新检查五方面”。'
      }[readiness.operationStatus];
      const acceptance = scoring.REVIEW_READINESS.acceptance.map(item => `<li>${escapeHtml(item)}</li>`).join('');
      const aspects = readiness.aspects.map(aspect => {
        const aspectStatusLabel = aspect.status === 'blocker'
          ? `结构错误${aspect.issueCount}项`
          : aspect.status === 'prompt'
            ? `待处理${aspect.issueCount}项`
            : '待部门确认';
        const issues = aspect.technicalIssues.concat(aspect.businessIssues);
        const confirmations = aspect.confirmations.map(item => `<li>${escapeHtml(item)}</li>`).join('');
        const noIssue = issues.length
          ? ''
          : '<div class="review-no-issue">页面自动检查未发现缺项；业务部门仍需现场确认事实，不得直接视为评审通过。</div>';
        return `<details class="review-aspect-card ${escapeAttribute(aspect.status)}" open>
          <summary>
            <span class="review-aspect-number">${aspect.number}</span>
            <span class="review-aspect-title">${escapeHtml(aspect.label)}</span>
            <span class="review-aspect-status ${escapeAttribute(aspect.status)}">${escapeHtml(aspectStatusLabel)}</span>

          <div class="review-aspect-body">
            <p class="review-aspect-description">${escapeHtml(aspect.description)}</p>

      }).join('');
      return `<section class="review-readiness-panel" id="reviewReadinessPanel" aria-live="polite" data-rule-set="${escapeAttribute(readiness.ruleSetVersion)}">
        <div class="review-readiness-head">
          <div>
            <h3>${escapeHtml(scoring.REVIEW_READINESS.label)}</h3>

          <span class="review-operation-status ${escapeAttribute(readiness.operationStatus)}">${escapeHtml(readiness.operationLabel)}</span>
        </div>
        <p class="review-operation-note">${escapeHtml(operationNote)}</p>
        <div class="review-acceptance">
          <strong>本次现场评审统一通过口径</strong>

        <p class="boundary"><strong>责任边界：</strong>3001只提供评审准备检查和整改定位，不保存现场确认、依据或评审结论。当前3000尚未承接v5文件，不得把本次导出描述为可直接导入3000。</p>

    }
