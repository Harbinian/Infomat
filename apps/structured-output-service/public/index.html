                ${supportedLegacyRevision ? `<div class="inline-note"><strong>早期v7可兼容导入：</strong>${escapeHtml(text(supportedLegacyRevision.schema_digest).slice(0, 12) || '未记录')}<br><span class="technical-note">导入后在当前页面内存中迁移，源文件保持不变。</span></div>` : ''}
              </div>
              <p class="technical-note">结构兼容和软件发布只说明文件可由3001处理，不代表流程事实正确、部门已经确认或业务审核通过。</p>` : '';
            return `
              <article class="item-card">
                <div class="item-title"><strong>${escapeHtml(item.version)} · ${escapeHtml(item.title)}</strong><span class="technical-note">${escapeHtml(item.status === 'candidate' ? `候选 · ${item.candidate_on || '日期未记录'}` : `已发布 · ${item.released_on}`)}</span></div>
                <p>${escapeHtml(item.summary)}</p>
                ${revisionBody}
              </article>`;
          }).join('')
        : versionHistoryLoadState === 'unavailable'
          ? '<div class="inline-note">版本说明暂时无法读取。当前页面内容不受影响，请保持页面打开并联系维护人员检查3001服务。</div>'
          : '<div class="inline-note">正在读取版本说明……</div>';
      const summary = migrationSummary();
      const migrationBody = summary ? `
        <div class="item-card">
          <div class="grid">
            <div class="inline-note"><strong>导入来源：</strong>${escapeHtml(summary.sourceVersion)}</div>
            <div class="inline-note"><strong>当前格式：</strong>process-governance-v7</div>
            <div class="inline-note"><strong>已保留内容：</strong>${summary.behaviorCount}个行为、${summary.dataCount}项数据、${summary.formCount}张表单、${summary.fieldCount}个字段</div>
            <div class="inline-note"><strong>待确认关系：</strong>${summary.unresolved}项</div>
          </div>
          <p class="technical-note">迁移只发生在当前页面内存中，用户选择的源文件没有修改。</p>
          <details><summary>迁移归档（${summary.archived}项，默认折叠）</summary><p class="technical-note">归档内容只用于保留历史来源，不参与评分、流程计算或绘图。归档引用仍会保护对应对象，避免误删。</p></details>
        </div>` : '<div class="inline-note">当前没有草稿。导入v1至v6或历史多候选文件后，这里会显示本次迁移摘要。</div>';
      return `
        <div id="versionsPanel" role="tabpanel" aria-labelledby="versionsTab">
          ${section('v1至v7升级历史', '版本说明来自仓库受控文件，只供查阅，不改变当前草稿。', historyBody)}
          ${section('当前文件迁移摘要', '旧文件导入后统一在页面内存中转换为v7，导入源文件始终保持原样。', migrationBody)}
        </div>`;
    }

            ${renderNodeCombinationGuide()}
          </div>
        </div>`;
    }

    function renderDiagramWarnings(model) {
      const relationReviewMessage = '该关系与其他非回路关系形成闭环；如果这是退回前序行为，请选择“流程内部回路”。';
      const unresolvedWarnings = model.unresolvedItems.length ? `
        <div class="diagram-warning-list" aria-label="未显示项目">
          <strong>有 ${model.unresolvedCount} 项内容无法绘制，请回到“数据与表单”补齐：</strong>
          ${model.unresolvedItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message)}</button>
          `).join('')}
        </div>` : '';
      const relationReviews = model.reviewItems?.length ? `
        <div class="diagram-warning-list" aria-label="关系类型请核对">
          <strong>关系类型请核对（不影响下载）：</strong>
          ${model.reviewItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message || relationReviewMessage)}</button>
          `).join('')}
        </div>` : '';
      return `${unresolvedWarnings}${relationReviews}`;
    }

    function graphHistoryState() {
      const entry = currentEntry();
      return entry ? graphStateManager.snapshot(candidateStateKey(entry), entry.data) : { canUndo: false, canRedo: false };
    }

    function renderGraphViewActions(kind) {
      if (kind === 'flow') {
        return `
          <button class="button primary small" data-action="reset-flow-diagram">清晰检查（100%）</button>
          <button class="button secondary small" data-action="fit-flow-diagram">查看全图</button>`;
      }
      return `
        <details class="graph-view-actions">
          <summary class="button small">视图操作</summary>
          <div class="graph-view-menu">
            <button class="button small" data-action="fit-${kind}-diagram">适应画布</button>
            <button class="button small" data-action="reset-${kind}-diagram">重置视图</button>
          </div>
        </details>`;
    }

    function relationEndpointNodeType(behaviorRef) {
      return (currentDocument()?.behaviors || []).find(item => item.behavior_ref === behaviorRef)?.node_type || '';
    }

    function relationConditionEditorCopy(relation = {}) {
      if (relation.relation_type === 'condition') {
        return {
          label: '判断条件',
          placeholder: '写清满足什么判断结果时进入这条路线',
          hint: '填写判断结果。业务办理动作仍放在节点中，不要用条件线代替实际办理动作。'
        };
      }
      if (relation.relation_type === 'loop') {
        return {
          label: '退回条件',
          placeholder: '写清什么情况下退回，以及何时可以重新办理',
          hint: '起点和终点表示退回到哪里；这里填写退回原因和重新办理条件。'
        };
      }
      if (relation.relation_type === 'parallel') {
        const fromType = relationEndpointNodeType(relation.from_behavior_ref);
        const toType = relationEndpointNodeType(relation.to_behavior_ref);
        if (fromType === 'parallel_split' && toType === 'parallel_join') {
          return {
            label: '并行路线条件或汇合要求（可选）',
            placeholder: '写清这条路线何时同时启动，以及达到什么状态后进入汇合',
            hint: '没有附加启动条件或汇合要求时可以留空。并行汇合节点仍表示等待全部并行路线完成。'
          };
        }
        if (fromType === 'parallel_split') {
          return {
            label: '并行启动条件（可选）',
            placeholder: '写清这条路线在什么条件下同时启动',
            hint: '没有附加启动条件时可以留空；并行开始表示多条路线同时启动，不是选择其中一条。'
          };
        }
        if (toType === 'parallel_join') {
          return {
            label: '并行汇合要求（可选）',
            placeholder: '写清这条路线达到什么状态后可以进入汇合',
            hint: '没有附加汇合要求时可以留空；并行汇合节点表示等待全部并行路线完成。'
          };
        }
        return {
          label: '并行条件（可选）',
          placeholder: '写清这条并行路线的启动条件或汇合要求',
          hint: '没有附加条件时可以留空。需要表达同时启动或等待全部路线时，应配合并行开始或并行汇合节点。'
        };
      }
      return {
        label: '进入下一步的补充条件（可选）',
        placeholder: '顺序关系通常留空；确有附加条件时填写',
        hint: '顺序关系表示起点完成后直接进入终点，没有附加条件时可以留空。'
      };
    }

    function renderFlowRelationDraft() {
      if (!flowRelationDraft) return '';
      const conditionCopy = relationConditionEditorCopy(flowRelationDraft);
      const stageText = {
        type: '第1步：选择关系类型',
        source: '第2步：选择起点',
        target: '第3步：选择终点',
        confirm: '第4步：确认关系'
      }[flowRelationDraft.stage] || '建立关系';
      const behaviorButtons = ['source', 'target'].includes(flowRelationDraft.stage)
        ? `<div class="graph-endpoint-list">${(currentDocument().behaviors || []).map((behavior, index) => `
            <button class="button small" data-action="select-relation-endpoint" data-ref="${escapeAttribute(behavior.behavior_ref)}">
              ${index + 1}. ${escapeHtml(behavior.behavior_name || '未命名节点')}
            </button>`).join('')}</div>`
        : '';
      return `
        <div class="graph-operation-card" role="status">
          <strong>${stageText}</strong>
          ${flowRelationDraft.stage === 'type' ? `
            <select data-graph-relation-type>
              ${optionHtml(RELATION_TYPES, flowRelationDraft.relation_type)}
            </select>` : ''}
          <p>起点：${escapeHtml(relationEndpointLabel(flowRelationDraft.from_behavior_ref, '待选择'))}；终点：${escapeHtml(relationEndpointLabel(flowRelationDraft.to_behavior_ref, '待选择'))}</p>
          ${flowRelationDraft.stage === 'confirm' ? `
            <label>${escapeHtml(conditionCopy.label)}<textarea data-graph-relation-condition placeholder="${escapeAttribute(conditionCopy.placeholder)}">${escapeHtml(flowRelationDraft.condition || '')}</textarea><span class="technical-note">${escapeHtml(conditionCopy.hint)}</span></label>` : ''}
          ${behaviorButtons}
          <div class="item-actions">
            ${flowRelationDraft.stage === 'confirm' ? '<button class="button primary small" data-action="confirm-flow-relation">确认建立</button>' : ''}
            <button class="button small" data-action="cancel-flow-relation">取消（Esc）</button>
          </div>
        </div>`;
    }

    function renderFlowPropertyPanel() {
      if (flowRelationDraft) return renderFlowRelationDraft();
      const selection = graphSelection;
      if (!selection || !['behavior', 'relation'].includes(selection.kind)) {
        return '<div class="graph-property-empty">选择一个节点或关系后，在这里编辑属性。技术标识和迁移信息默认不展开。</div>';
      }
      if (selection.kind === 'relation') {
        const relation = workingEntity('relation', selection.ref);
        if (!relation) return '<div class="graph-property-empty">所选关系已经不存在。</div>';
        const conditionCopy = relationConditionEditorCopy(relation);
        const relationSession = entityEditSession('relation', selection.ref);
        const relationDirty = Boolean(relationSession && editSessionManager.isDirty(relationSession.candidateKey));
        return `
          <div class="graph-property-panel" data-focus-kind="relation" data-focus-ref="${escapeAttribute(relation.relation_ref)}">
            <h3>流程关系</h3>
            <label>关系类型<select data-graph-property="relation_type">${optionHtml(RELATION_TYPES, relation.relation_type)}</select></label>
            <label>起点<select data-graph-property="from_behavior_ref">${optionHtml(behaviorOptions('请选择起点'), relation.from_behavior_ref)}</select></label>
            <label>终点<select data-graph-property="to_behavior_ref">${optionHtml(behaviorOptions('请选择终点'), relation.to_behavior_ref)}</select></label>
            <label class="graph-property-wide">${escapeHtml(conditionCopy.label)}<textarea data-graph-property="condition" placeholder="${escapeAttribute(conditionCopy.placeholder)}">${escapeHtml(relation.condition || '')}</textarea><span class="technical-note">${escapeHtml(conditionCopy.hint)}</span></label>
            <div class="inline-note">关系类型、起点、终点以及判断、退回与并行条件都在本浮层完成。修改后点击“应用修改”，流程图和清单会同时更新。</div>
            <details><summary>技术标识</summary><code>${escapeHtml(relation.relation_ref)}</code></details>
            ${relationDirty ? '<div class="inline-warning"><strong>有未应用修改。</strong>当前JSON和下载文件仍保留应用前的关系属性。</div>' : ''}
            <div class="item-actions">
              <button class="button primary small" data-action="apply-flow-property" ${relationSession && relationDirty ? '' : 'disabled'}>应用修改</button>
              <button class="button danger small" data-action="delete-graph-selection">删除关系</button>
            </div>
          </div>`;
      }
      const behavior = workingEntity('behavior', selection.ref);
      if (!behavior) return '<div class="graph-property-empty">所选节点已经不存在。</div>';
      const behaviorSession = entityEditSession('behavior', selection.ref);
      const behaviorDirty = Boolean(behaviorSession && editSessionManager.isDirty(behaviorSession.candidateKey));
      const isControl = ['decision', 'parallel_split', 'parallel_join'].includes(behavior.node_type);
      const actor = parseActorRole(behavior.current_actor_role);
      const positions = rosterRolesByDepartment[actor.department] || [];
      const isEntry = !(currentDocument().flow_relations || []).some(relation =>
        relation.to_behavior_ref === behavior.behavior_ref && relation.relation_type !== 'loop'
      );
      return `
        <div class="graph-property-panel" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(behavior.behavior_ref)}">
          <h3>${isControl ? '流程控制节点' : '业务行为、执行主体与办理规则'}</h3>
          <label>节点类型<select data-graph-property="node_type">${optionHtml(NODE_TYPES, behavior.node_type)}</select></label>
          <label>节点名称<input data-graph-property="behavior_name" value="${escapeAttribute(behavior.behavior_name)}"></label>
          ${isControl ? `
            <div class="inline-note">流程控制，不代表执行部门。切换类型不会删除原有普通行为字段。</div>
            <details><summary>原普通行为字段（只读保留）</summary>
              <div class="technical-note">执行主体：${escapeHtml(behavior.current_actor_role || '空')}<br>具体做什么：${escapeHtml(behavior.behavior_description || '空')}<br>完成标准：${escapeHtml(behavior.completion_standard || '空')}</div>
            </details>` : `
            <label>执行主体确定方式<select data-graph-property="actor_assignment_mode">${optionHtml(ACTOR_ASSIGNMENT_MODES, actorAssignmentMode(behavior))}</select></label>
            ${actorAssignmentMode(behavior) === 'fixed_department' ? `
              <label>执行部门<select data-graph-actor-department>${optionHtml([''].concat(DEPARTMENTS.filter(item => item !== '全公司')), actor.department)}</select></label>
              <label>执行岗位<select data-graph-actor-position>${optionHtml([''].concat(positions), actor.position)}</select></label>` : ''}
            ${actorAssignmentMode(behavior) === 'dynamic_from_data' ? `
              <label>执行部门来源数据<select data-graph-property="actor_department_data_ref">${optionHtml([{ value: '', label: '请选择前序数据' }].concat((currentDocument().data_objects || []).map(item => ({ value: item.data_ref, label: item.data_name || '未命名数据' }))), behavior.actor_department_data_ref || '')}</select></label>
              <label>岗位或责任人确定规则<textarea data-graph-property="actor_position_rule">${escapeHtml(behavior.actor_position_rule)}</textarea></label>` : ''}
            <label class="graph-property-wide">具体做什么（逐动作说明）<textarea data-graph-property="behavior_description" placeholder="按实际顺序写明动作、处理对象和结果">${escapeHtml(behavior.behavior_description || '')}</textarea></label>
            ${isEntry ? `<label class="graph-property-wide">流程如何开始<textarea data-graph-property="trigger" placeholder="写明谁在什么情况下发起本流程">${escapeHtml(behavior.trigger || '')}</textarea></label>` : ''}
            <label>办理时限（可选）<input data-graph-property="timing" value="${escapeAttribute(behavior.timing || '')}"></label>
            <label class="graph-property-wide">怎样算完成<textarea data-graph-property="completion_standard" placeholder="写明该行为完成的判断标准">${escapeHtml(behavior.completion_standard || '')}</textarea></label>
            <details class="graph-property-wide"><summary>其他开始条件与会签（按需填写）</summary>
              <div class="graph-property-panel" style="margin-top:12px">
                <label class="graph-property-wide">其他开始条件<textarea data-graph-property="precondition" placeholder="只填写流程关系和输入数据不能表达的额外限制">${escapeHtml(behavior.precondition || '')}</textarea></label>
                <label class="graph-property-wide"><span class="graph-checkbox-line"><input type="checkbox" data-graph-property="countersign_all_required"${behavior.countersign_all_required ? ' checked' : ''}> 全部指定对象确认知悉后才算完成</span></label>
                <fieldset class="graph-property-wide graph-department-options"><legend>需要确认知悉的部门</legend>
                  ${DEPARTMENTS.map(department => `<label class="graph-checkbox-line"><input type="checkbox" data-graph-list-property="countersign_target_departments" value="${escapeAttribute(department)}"${list(behavior.countersign_target_departments).includes(department) ? ' checked' : ''}> ${escapeHtml(department)}</label>`).join('')}
                </fieldset>
              </div>
            </details>`}
          <details><summary>技术标识和历史文字</summary><code>${escapeHtml(behavior.behavior_ref)}</code><div class="technical-note">输入说明：${escapeHtml(behavior.input_description || '空')}<br>输出说明：${escapeHtml(behavior.output_description || '空')}</div></details>
          ${behaviorDirty ? '<div class="inline-warning"><strong>有未应用修改。</strong>当前JSON和下载文件仍保留应用前的节点属性。</div>' : ''}
          <div class="item-actions">
            <button class="button primary small" data-action="apply-flow-property" ${behaviorSession && behaviorDirty ? '' : 'disabled'}>应用修改</button>
            <button class="button danger small" data-action="delete-graph-selection">删除节点</button>
          </div>
        </div>`;
    }

    function renderFlowEditModal() {
      const visible = Boolean(flowRelationDraft || (flowEditorOpen && ['behavior', 'relation'].includes(graphSelection?.kind)));
      if (!visible) return '';
      const title = flowRelationDraft
        ? '建立流程关系'
        : graphSelection?.kind === 'relation'
          ? '编辑判断、退回与并行条件'
          : '编辑流程节点、执行主体与办理规则';
      return `<div class="modal-backdrop show" id="graphEditModal" aria-hidden="false">
        <section class="modal flow-editor-drawer" role="dialog" aria-modal="true" aria-labelledby="graphEditModalTitle">
          <div class="flow-editor-head">
            <div><div class="eyebrow">流程编制</div><h2 id="graphEditModalTitle">${escapeHtml(title)}</h2><p>在当前右侧浮层完成所选节点或关系的信息；应用后保留流程图位置、缩放和选择对象。</p></div>
            <button class="button" data-action="close-flow-editor">关闭</button>
          </div>
          <div class="flow-editor-body"><aside class="graph-property-shell">${renderFlowPropertyPanel()}</aside></div>
          <div class="flow-editor-footer"><span>未应用输入不会进入当前 JSON 或下载文件。</span><button class="button" data-action="close-flow-editor">返回流程骨架</button></div>
        </section>
      </div>`;
    }

      const history = graphHistoryState();
      const collisionNotice = model.layout?.collisions?.length
        ? `<div class="diagram-notice warning">自动避让执行6轮后仍有${model.layout.collisions.length}项碰撞。该告警不修改JSON、不阻止下载，但当前版本不能发布。</div>`
        : '';
      return `
        <section class="section diagram-section${diagramExpanded ? ' diagram-expanded' : ''}">
          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>${escapeHtml(currentDocument().process.process_name || '未命名流程')} · 流程关系</h2>
                <p>点击节点编辑执行人、逐动作和完成标准；点击流程线编辑判断、退回与并行条件。多条关系进入同一目标时，各关系条件保持独立。</p>
              </div>
              <div class="diagram-controls">
                <button class="button primary small" data-action="add-graph-node">新增节点</button>
                <button class="button secondary small" data-action="start-flow-relation">建立关系</button>
                <button class="button small" data-action="undo-graph" ${history.canUndo ? '' : 'disabled'}>撤销</button>
                <button class="button small" data-action="redo-graph" ${history.canRedo ? '' : 'disabled'}>重做</button>
                ${renderGraphViewActions('flow')}
                <button class="button small" data-action="toggle-diagram-expanded">${diagramExpanded ? '退出全屏' : '全屏检查流程图'}</button>
              </div>
            </div>
            ${renderDiagramLegend()}
            ${collisionNotice}
            <div class="diagram-notice" id="diagramViewportNotice" role="status" hidden>
              当前按100%字号从流程开头清晰检查；需要总览时点击“查看全图”
            </div>
            <div class="graph-editor-layout flow-graph-editor-layout">
              <div>
                <div class="diagram-canvas" id="processDiagramCanvas" role="application" aria-label="可编辑流程关系图"></div>
                <div class="diagram-failure" id="diagramFailure" role="alert"></div>
              </div>
            </div>
            ${renderDiagramWarnings(model)}
          </div>
        </section>${renderFlowEditModal()}`;
    }

    function ensureActiveGraphDataObject() {
      const dataObjects = currentDocument()?.data_objects || [];
      if (!dataObjects.some(item => item.data_ref === activeDataRef)) activeDataRef = '';
      return dataObjects.find(item => item.data_ref === activeDataRef) || null;
    }

    function pendingLifecycle() {
      return globalThis.ProcessGovernanceMigration?.pendingLifecycle
        ? globalThis.ProcessGovernanceMigration.pendingLifecycle()
        : {
            applicability: 'pending_confirmation',
            entry_state: {
              business_validity: 'pending_confirmation',
              custody: 'pending_confirmation',
              identifiability_applicability: 'pending_confirmation',
              identifiability: 'pending_confirmation'
            },
            routes: [],
            analysis: { analyzer_version: '', source_fingerprint: '', status: 'not_analyzed' },
            decision_reason: '',
            decision_notes: ''
          };
    }

    function renderDataModeSwitch() {
      return `<div class="step-view-switch" aria-label="数据工作区视图">
        <button class="button small step-view-button${activeDataMode === 'flow' ? ' active' : ''}" data-action="switch-data-mode" data-mode="flow">数据流</button>
        <button class="button small step-view-button${activeDataMode === 'lifecycle' ? ' active' : ''}" data-action="switch-data-mode" data-mode="lifecycle">生命周期</button>
      </div>`;
    }

    function renderMasterDataHint(dataObject, options = {}) {
      const analyzer = globalThis.LifecycleAnalyzer;
      if (!analyzer?.classifyMasterDataHint) return '';
      const hint = analyzer.classifyMasterDataHint(currentDocument(), dataObject);
      return `<section class="inline-note" aria-label="主数据认定提示">
        <strong>主数据认定提示：${escapeHtml(hint.label)}</strong>
        <p>${escapeHtml(hint.message)}</p>
        <details><summary>查看判断依据</summary><ul>${hint.reasons.map(reason => `<li>${escapeHtml(reason)}</li>`).join('')}</ul></details>
        ${options.hasUnapplied ? '<p class="technical-note"><strong>当前提示依据为已应用内容；应用修改后重新判断。</strong></p>' : ''}
        ${options.showEditAction ? '<div class="item-actions"><button class="button small" data-action="supplement-data-facts">返回数据流编辑对象信息</button></div>' : ''}
        <p class="technical-note">所有主数据都是数据对象，但不是所有数据对象都是主数据。表单通常不是主数据；填写完成的表单通常是交易记录或业务证据。该提示不写入正式主数据结论，也不阻止下载。</p>
      </section>`;

      return `<div class="item-card">
        <strong>${escapeHtml(title)}</strong>
        <div class="grid" style="margin-top:10px">
          ${field(`${pathPrefix}.business_validity`, '业务上还能用吗？', { type: 'select', options: BUSINESS_VALIDITY_OPTIONS })}
          ${field(`${pathPrefix}.custody`, '现在怎么保管？', { type: 'select', options: CUSTODY_OPTIONS })}
          ${showAnonymizationQuestion ? field(`${pathPrefix}.identifiability_applicability`, '本流程会进行匿名处理吗？', { type: 'select', options: IDENTIFIABILITY_APPLICABILITY_OPTIONS }) : ''}
          ${identifiabilityApplicability === 'applicable' ? field(`${pathPrefix}.identifiability`, '进行匿名处理后，还能认出原来对应的人或对象吗？', { type: 'select', options: IDENTIFIABILITY_OPTIONS }) : ''}
        </div>
      </div>`;
    }

    function renderLifecycleEvent(dataIndex, routeIndex, eventIndex, event) {
      const eventPath = `data_objects.${dataIndex}.lifecycle.routes.${routeIndex}.events.${eventIndex}`;
      const needsReason = ['not_applicable', 'rejected'].includes(event.review_status);
      const needsCarrier = ['archive', 'restore_active_custody', 'destroy'].includes(event.action);
      const reviewOpen = event.high_risk || ['pending_confirmation', 'needs_recheck'].includes(event.review_status);
      return `<article class="item-card" data-focus-path="${escapeAttribute(eventPath)}">
        <div class="item-title">
          <strong>${escapeHtml(LIFECYCLE_ACTIONS[event.action] || event.action)}</strong>
          <span class="status-pill ${event.high_risk ? 'danger' : ''}">${event.high_risk ? '高风险，必须人工核对' : '普通生命周期事件'}</span>
        </div>
        ${field(`${eventPath}.review_status`, '这项状态变化是否成立？', { type: 'select', options: LIFECYCLE_REVIEW_STATUS_OPTIONS })}
        ${needsReason ? field(`${eventPath}.decision_reason`, '决定原因', { type: 'select', options: LIFECYCLE_DECISION_REASON_OPTIONS }) : ''}
        ${needsReason ? field(`${eventPath}.decision_notes`, '补充说明', { type: 'textarea', className: 'wide' }) : ''}
        ${renderLifecycleStateFields(`${eventPath}.result_state`, '动作完成后的状态', event.result_state)}
        ${advancedLifecycleMode ? `<details ${reviewOpen ? 'open' : ''}><summary>高级结构核对：触发、范围、责任和异常</summary>
          <div class="grid" style="margin-top:10px">
            ${field(`${eventPath}.trigger.mode`, '触发方式', { type: 'select', options: LIFECYCLE_TRIGGER_MODE_OPTIONS })}
            ${field(`${eventPath}.trigger.operator`, '条件组合', { type: 'select', options: LIFECYCLE_TRIGGER_OPERATOR_OPTIONS })}

      </article>`;
    }

    function analyzeLifecycleForObject(documentValue, dataRef) {
      const analyzer = globalThis.LifecycleAnalyzer;
      if (!analyzer?.analyzeDataObject) return null;
      const dataObject = (documentValue?.data_objects || []).find(item => item.data_ref === dataRef);
      if (!dataObject) return null;
      const before = JSON.stringify(dataObject.lifecycle || null);
      const result = analyzer.analyzeDataObject(clone(documentValue), dataRef);
      const lifecycle = clone(result.lifecycle);
      return { ...result, lifecycle, changed: before !== JSON.stringify(lifecycle) };
    }

    function reanalyzeLifecycle(scope = 'current') {
      const activeRef = activeDataRef;
      const result = runDocumentTransaction(nextDocument => {
        const targets = scope === 'all'
          ? (nextDocument.data_objects || [])
          : (nextDocument.data_objects || []).filter(item => item.data_ref === activeRef);
        if (!targets.length) throw new Error('没有找到要分析的数据对象');
        let candidateCount = 0;
        let changedCount = 0;
        targets.forEach(dataObject => {
          const analysis = analyzeLifecycleForObject(nextDocument, dataObject.data_ref);
          if (!analysis?.lifecycle) throw new Error(`数据对象“${dataObject.data_name || '未命名数据'}”未能形成分析结果`);
          candidateCount += analysis.candidate_count || 0;
          if (analysis.changed) {
            dataObject.lifecycle = analysis.lifecycle;
            changedCount += 1;
          }
        });
        return { targetCount: targets.length, candidateCount, changedCount };
      }, {
        source: scope === 'all' ? 'reanalyze-all-lifecycle' : 'reanalyze-current-lifecycle',
        failureLabel: scope === 'all' ? '重新分析全部数据对象' : '重新分析当前数据对象',
        resetEditSessionOnSuccess: false
      });
      if (!result.ok) return false;
      const details = result.details || {};
      if (!result.changed) {
        showStatus(`分析结果没有变化，未增加未下载状态或撤销记录。本次共检查${details.targetCount || 0}个数据对象。`, 'success');
        return true;
      }
      showStatus(`已重新分析${details.targetCount || 0}个数据对象，${details.changedCount || 0}个对象的生命周期内容发生变化，共形成${details.candidateCount || 0}项候选。执行一次撤销可恢复分析前内容。`, 'success');
      return true;
    }

    const AUTHORING_QUEUE_STEPS = Object.freeze(['start', 'boundary', 'skeleton', 'action', 'data']);
    const STABLE_QUEUE_REF_KEYS = Object.freeze([
      'source_link_ref', 'source_ref', 'item_ref', 'area_ref', 'form_ref', 'field_ref',
      'link_ref', 'data_ref', 'relation_ref', 'behavior_ref', 'term_ref', 'process_ref'
    ]);

    function stableQueueTarget(issue, data = currentDocument()) {
      const rawPath = text(issue.focusPath || issue.focusPaths?.[0]);
      let node = data;
      let deepestRef = text(issue.focusRef);
      rawPath.split('.').filter(Boolean).forEach(part => {
        if (node == null) return;
        node = /^\d+$/.test(part) ? node?.[Number(part)] : node?.[part];
        if (node && typeof node === 'object' && !Array.isArray(node)) {
          const refKey = STABLE_QUEUE_REF_KEYS.find(key => typeof node[key] === 'string' && node[key]);
          if (refKey) deepestRef = node[refKey];
        }
      });
      const normalizedPath = rawPath.split('.').filter(part => !/^\d+$/.test(part)).join('.');
      return { stableRef: deepestRef || text(data?.process?.process_ref) || 'current-process', normalizedPath };
    }

    function governanceQueueRuleCode(issue, stepId, normalizedPath) {
      if (issue.ruleCode || issue.rule_code || issue.code) return text(issue.ruleCode || issue.rule_code || issue.code);
      const category = text(issue.category).replace(/\s+/g, '_') || 'BUSINESS_CHECK';
      const fieldRule = normalizedPath || [issue.editorSection, issue.processSection, issue.focusKind].map(text).filter(Boolean).join('.') || 'GENERAL';
      const semanticRule = [
        issue.reason,
        issue.reviewAspect,
        issue.consumerRef,
        issue.producerRef,
        issue.terminalRef,
        issue.keyword
      ].map(text).filter(Boolean).join(':');
      return `${category}:${stepId}:${fieldRule}${semanticRule ? `:${semanticRule}` : ''}`;
    }

    function findGovernanceQueueEntity(stableRef, data = currentDocument()) {
      const wanted = text(stableRef);
      if (!wanted || !data) return null;
      const descriptor = (options) => ({ ...options, stableRef: wanted });
      for (let index = 0; index < (data.behaviors || []).length; index += 1) {
        const item = data.behaviors[index];
        if (item.behavior_ref === wanted) return descriptor({
          normalizedRoot: 'behaviors', basePath: `behaviors.${index}`,
          focusKind: 'behavior', focusRef: wanted, editorSection: 'process', processSection: 'behaviors'
        });
      }
      for (let index = 0; index < (data.flow_relations || []).length; index += 1) {
        const item = data.flow_relations[index];
        if (item.relation_ref === wanted) return descriptor({
          normalizedRoot: 'flow_relations', basePath: `flow_relations.${index}`,
          focusKind: 'relation', focusRef: wanted, editorSection: 'process', processSection: 'relations'
        });
      }
      for (let dataIndex = 0; dataIndex < (data.data_objects || []).length; dataIndex += 1) {
        const dataObject = data.data_objects[dataIndex];
        const dataBase = `data_objects.${dataIndex}`;
        const dataContext = { dataRef: dataObject.data_ref, editorSection: 'process', processSection: 'data' };
        if (dataObject.data_ref === wanted) return descriptor({
          ...dataContext, normalizedRoot: 'data_objects', basePath: dataBase,
          focusKind: 'data', focusRef: dataObject.data_ref,
          tableId: 'data_objects', rowRefKey: 'data_ref'
        });
        for (let fieldIndex = 0; fieldIndex < (dataObject.fields || []).length; fieldIndex += 1) {
          const field = dataObject.fields[fieldIndex];
          if (field.field_ref === wanted) return descriptor({
            ...dataContext, dataFieldRef: field.field_ref,
            normalizedRoot: 'data_objects.fields', basePath: `${dataBase}.fields.${fieldIndex}`,
            focusKind: 'data', focusRef: dataObject.data_ref,
            tableId: 'data_fields', rowRefKey: 'field_ref'
          });
        }
        for (let linkIndex = 0; linkIndex < (dataObject.behavior_links || []).length; linkIndex += 1) {
          const link = dataObject.behavior_links[linkIndex];
          if (link.link_ref === wanted) return descriptor({
            ...dataContext, normalizedRoot: 'data_objects.behavior_links', basePath: `${dataBase}.behavior_links.${linkIndex}`,
            focusKind: 'data', focusRef: dataObject.data_ref,
            tableId: 'data_behavior_links', rowRefKey: 'link_ref'
          });
        }
        for (let sourceIndex = 0; sourceIndex < (dataObject.source_relations || []).length; sourceIndex += 1) {
          const source = dataObject.source_relations[sourceIndex];
          if (source.source_ref === wanted) return descriptor({
            ...dataContext, normalizedRoot: 'data_objects.source_relations', basePath: `${dataBase}.source_relations.${sourceIndex}`,
            focusKind: 'data', focusRef: dataObject.data_ref,
            tableId: 'data_source_relations', rowRefKey: 'source_ref'
          });
        }
      }
      for (let formIndex = 0; formIndex < (data.forms || []).length; formIndex += 1) {
        const form = data.forms[formIndex];
        const formBase = `forms.${formIndex}`;
        const formContext = { formRef: form.form_ref, editorSection: 'forms' };
        if (form.form_ref === wanted) return descriptor({
          ...formContext, normalizedRoot: 'forms', basePath: formBase,
          focusKind: 'form', focusRef: form.form_ref,
          tableId: 'forms', rowRefKey: 'form_ref'
        });
        for (let linkIndex = 0; linkIndex < (form.behavior_links || []).length; linkIndex += 1) {
          const link = form.behavior_links[linkIndex];
          if (link.link_ref === wanted) return descriptor({
            ...formContext, normalizedRoot: 'forms.behavior_links', basePath: `${formBase}.behavior_links.${linkIndex}`,
            focusKind: 'form', focusRef: form.form_ref,
            tableId: 'form_behavior_links', rowRefKey: 'link_ref'
          });
        }
        for (let areaIndex = 0; areaIndex < (form.areas || []).length; areaIndex += 1) {
          const area = form.areas[areaIndex];
          const areaBase = `${formBase}.areas.${areaIndex}`;
          const areaContext = { ...formContext, areaRef: area.area_ref };
          if (area.area_ref === wanted) return descriptor({
            ...areaContext, normalizedRoot: 'forms.areas', basePath: areaBase,
            focusKind: 'area', focusRef: area.area_ref,
            tableId: 'form_areas', rowRefKey: 'area_ref'
          });
          for (let itemIndex = 0; itemIndex < (area.items || []).length; itemIndex += 1) {
            const item = area.items[itemIndex];
            const itemBase = `${areaBase}.items.${itemIndex}`;
            const itemContext = { ...areaContext, formItemRef: item.item_ref };
            if (item.item_ref === wanted) return descriptor({
              ...itemContext, normalizedRoot: 'forms.areas.items', basePath: itemBase,
              focusKind: 'area', focusRef: area.area_ref,
              tableId: 'form_items', rowRefKey: 'item_ref'
            });
            for (let sourceIndex = 0; sourceIndex < (item.source_links || []).length; sourceIndex += 1) {
              const source = item.source_links[sourceIndex];
              if (source.source_link_ref === wanted) return descriptor({
                ...itemContext, normalizedRoot: 'forms.areas.items.source_links', basePath: `${itemBase}.source_links.${sourceIndex}`,
                focusKind: 'area', focusRef: area.area_ref,
                tableId: 'field_source_links', rowRefKey: 'source_link_ref'
              });
            }
          }
        }
      }
      for (let index = 0; index < (data.terms || []).length; index += 1) {
        const item = data.terms[index];
        if (item.term_ref === wanted) return descriptor({
          normalizedRoot: 'terms', basePath: `terms.${index}`,
          focusKind: 'term', focusRef: wanted, editorSection: 'terms'
        });
      }
      return null;
    }

    function resolveGovernanceQueueIssue(issue, data = currentDocument()) {
      if (!issue || !data) return null;
      const stableRef = text(issue.stableRef);
      const entity = findGovernanceQueueEntity(stableRef, data);
      const processRef = text(data.process?.process_ref) || 'current-process';
      if (!entity) {
        if (stableRef && ![processRef, 'current-process'].includes(stableRef)) return null;
        const rootPath = text(issue.path);
        if (rootPath && !/^(?:export_meta|process)(?:\.|$)/.test(rootPath)) return null;
        return { ...issue, focusPath: rootPath || text(issue.focusPath), focusPaths: [] };
      }
      const normalizedPath = text(issue.path);
      const suffix = normalizedPath === entity.normalizedRoot
        ? ''
        : normalizedPath.startsWith(`${entity.normalizedRoot}.`)
          ? normalizedPath.slice(entity.normalizedRoot.length + 1)
          : '';
      const focusPath = `${entity.basePath}${suffix ? `.${suffix}` : ''}`;
      let tableId = entity.tableId || '';
      let gridRowRef = entity.stableRef;
      let gridRefKey = entity.rowRefKey || '';
      if (tableId === 'data_objects' && suffix.startsWith('fields')) {
        tableId = 'data_fields'; gridRowRef = ''; gridRefKey = '';
      } else if (tableId === 'data_objects' && suffix.startsWith('behavior_links')) {
        tableId = 'data_behavior_links'; gridRowRef = ''; gridRefKey = '';
      } else if (tableId === 'data_objects' && suffix.startsWith('source_relations')) {
        tableId = 'data_source_relations'; gridRowRef = ''; gridRefKey = '';
      } else if (tableId === 'forms' && suffix.startsWith('behavior_links')) {
        tableId = 'form_behavior_links'; gridRowRef = ''; gridRefKey = '';
      } else if (tableId === 'form_areas' && suffix.startsWith('items')) {
        tableId = 'form_items'; gridRowRef = ''; gridRefKey = '';
      } else if (tableId === 'form_items' && suffix.startsWith('source_links')) {
        tableId = 'field_source_links'; gridRowRef = ''; gridRefKey = '';
      }
      return {
        ...issue,
        ...entity,
        tableId,
        gridRowRef,
        gridRefKey,
        focusPath,
        focusPaths: [focusPath],
        gridColumn: suffix.split('.').filter(Boolean).slice(-1)[0] || ''
      };
    }

    function buildGovernanceQueueIssues(data = currentDocument()) {
      if (!data) return [];
      const technical = (structureScoreState.result?.issues || []).filter(item => item.category === '技术结构');
      const business = governanceIssues(data);
      return technical.concat(business)
        .flatMap(issue => globalThis.GovernanceReviewQueue.expandIssueFocusPaths(issue))
        .map((issue, sourceIndex) => {
          const stepId = globalThis.GovernanceWorkflow?.stepForTarget(issue) || 'start';
          const normalizedStep = AUTHORING_QUEUE_STEPS.includes(stepId) ? stepId : 'data';
          const target = stableQueueTarget(issue, data);
          return {
            ...clone(issue),
            ruleCode: governanceQueueRuleCode(issue, normalizedStep, target.normalizedPath),
            stableRef: target.stableRef,
            path: target.normalizedPath,
            stepId: normalizedStep,
            technical: issue.category === '技术结构',
            sourceOrder: sourceIndex
          };
        }).sort((left, right) => {
          if (left.technical !== right.technical) return left.technical ? -1 : 1;
          const stepDelta = AUTHORING_QUEUE_STEPS.indexOf(left.stepId) - AUTHORING_QUEUE_STEPS.indexOf(right.stepId);
          return stepDelta || left.sourceOrder - right.sourceOrder;
        });
    }

    function runGovernanceQueueCheck(options = {}) {
      const key = candidateStateKey();
      if (!key) return null;
      const scoreState = ensureStructureScoreState();
      if (scoreState.status !== 'ready' || scoreState.documentKey !== currentStructureScoreKey()) {
        showStatus(scoreState.status === 'unavailable'
          ? '技术结构检查暂不可用，本次没有生成有效的问题队列快照。'
          : '技术结构仍在检查，请稍后重新执行“检查本轮”。本次没有生成有效的问题队列快照。', 'error');
        return null;
      }
      const revision = globalThis.GraphEditorState.fingerprint(currentDocument());
      const current = governanceReviewQueueManager.get(key);
      let state;
      try {
        const issues = buildGovernanceQueueIssues();
        state = current.checkedAtRevision == null
          ? governanceReviewQueueManager.snapshot(key, issues, { revision })
          : governanceReviewQueueManager.reconcile(key, issues, { revision });
      } catch (error) {
        showStatus(`问题队列没有生成：${error.message}。请联系维护人员补充唯一规则编码；当前旧结果保持不变。`, 'error');
        return null;
      }
      checkedGovernanceSteps.add(governanceCheckKey(activeGovernanceStep));
      if (
        options.moveNext
        && state.total > 1
        && state.currentIssue
        && current.cursorKey
        && !state.changes.resolvedKeys.includes(current.cursorKey)
      ) return governanceReviewQueueManager.next(key);
      return state;
    }

    function governanceQueueLocation(issue) {
      const step = globalThis.GovernanceWorkflow.stepById(issue.stepId);
      const ref = text(issue.stableRef);
      const data = currentDocument();
      const named = (data?.behaviors || []).find(item => item.behavior_ref === ref)?.behavior_name
        || (data?.flow_relations || []).find(item => item.relation_ref === ref)?.relation_ref
        || (data?.data_objects || []).find(item => item.data_ref === ref)?.data_name
        || (data?.data_objects || []).flatMap(item => item.fields || []).find(item => item.field_ref === ref)?.field_name
        || (data?.forms || []).find(item => item.form_ref === ref)?.form_name
        || (data?.forms || []).flatMap(form => form.areas || []).find(item => item.area_ref === ref)?.area_title
        || (data?.forms || []).flatMap(form => (form.areas || []).flatMap(area => area.items || [])).find(item => item.item_ref === ref)?.item_name
        || ref;
      return `${step?.label || '当前治理步骤'}${named ? ` / ${named}` : ''}${issue.path ? ` / ${issue.path.split('.').slice(-2).join('.')}` : ''}`;
    }

    async function validateGraphDocument(documentValue, options = {}) {
      const controller = new AbortController();
      const timeoutMs = Math.max(1000, Number(options.timeoutMs || 20000));
      const timeoutId = window.setTimeout(() => controller.abort(), timeoutMs);
      try {
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            data: documentValue,
            ...(options.validationProfile ? { validation_profile: options.validationProfile } : {})
          }),
          signal: controller.signal
        });
        const result = await readJsonResponse(response, '3001图编辑校验接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        return result;
      } catch (error) {
        if (error?.name === 'AbortError') throw new Error(`结构检查超过${Math.round(timeoutMs / 1000)}秒未返回，请稍后重新应用`);
        throw error;
      } finally {
        window.clearTimeout(timeoutId);
      }
    }

    function updateSelectionFromGraphResult(result) {
      const selected = result?.details?.selected;
      if (!selected) return;
      if (selected.kind === 'behavior') {
        openEntityEditSession('behavior', selected.ref);
      } else if (selected.kind === 'relation') {
        openEntityEditSession('relation', selected.ref);
      } else if (selected.kind === 'data') {
        openEntityEditSession('data', selected.ref);
      }
    }

    async function refreshValidationAfterGraphCommand(documentValue) {
      try {
        const result = await validateGraphDocument(documentValue);
        if (!result.valid) {
          const first = result.errors?.[0];
          showStatus(`图操作已保留；当前草稿还有${result.errors?.length || 1}项结构阻断。${first ? `${validationErrorLocation(first)}：${first.message}` : ''}`, 'error');
        }
      } catch (error) {
        showStatus(`图操作已保留；完整结构校验暂未刷新：${error.message}`, 'error');
      }
    }

    async function runGraphCommand(command, options = {}) {
      const entry = currentEntry();
      if (!entry) return false;
      captureGraphViewport();
      const preview = globalThis.GraphEditCommands.applyCommand(entry.data, command);
      if (!preview.ok) {
        const impacts = preview.details?.impacts || [];
        const impactText = impacts.length ? `：${impacts.map(item => `${item.label}${item.ref ? `（${item.ref}）` : ''}`).join('、')}` : '';
        showStatus(`${preview.message}${impactText}`, 'error');
        return false;
      }
      if (options.prevalidate) {
        try {
          const validation = await validateGraphDocument(preview.document);
          if (!validation.valid) {
            const first = validation.errors?.[0];
            throw new Error(first ? `${validationErrorLocation(first)}：${first.message}` : '副本未通过结构校验');
          }
        } catch (error) {
          showStatus(`${options.failureLabel || '图操作'}未执行：${error.message}。当前草稿保持不变。`, 'error');
          return false;
        }
      }
      const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => preview);
      if (!result.ok) {
        showStatus(result.message || '图操作未执行', 'error');
        return false;
      }
      entry.data = result.document;
      if (options.resetEditSessionOnSuccess) editSessionManager.reset();
      updateSelectionFromGraphResult(result);
      if (command.type === 'delete_object') {
        editSessionManager.reset();
        graphSelection = null;
        if (command.kind === 'behavior') activeBehaviorRef = '';
        if (command.kind === 'relation') activeRelationRef = '';
        if (command.kind === 'data') {
          activeDataRef = '';
          activeDataFieldRef = '';
        }
      }
      invalidateCurrentChecks(entry);
      resetWebGridEditor({ preserveViewState: true });
      refreshCandidateDirty(entry);
      render();
      if (result.details?.warnings?.length) {
        showStatus(`${options.successLabel || '图操作已完成'}。请核对：${result.details.warnings.join('；')}`, 'success');
      } else if (options.successLabel) {
        showStatus(options.successLabel, 'success');
      }
      refreshValidationAfterGraphCommand(result.document);
      return true;
    }

    async function applyGraphPropertyDraft() {
      const selection = graphSelection;
      if (!selection || !['behavior', 'relation'].includes(selection.kind)) {
        showStatus('当前没有可应用的节点或关系属性修改。', 'error');
        return false;
      }
      const config = entityEditConfig(selection.kind);
      const session = entityEditSession(selection.kind, selection.ref);
      const current = entityByKindAndRef(selection.kind, selection.ref);
      if (!session || !current) {
        showStatus('当前编辑对象已经不存在，未应用修改仍保留。请重新选择对象后核对。', 'error');
        return false;
      }
      const merged = editSessionManager.mergeCurrentEntity(current);
      if (!merged.ok) {
        showStatus(graphPropertyConflictMessage(merged), 'error');
        return false;
      }
      if (!merged.changedFields.length) {
        editSessionManager.reset();
        openEntityEditSession(selection.kind, selection.ref);
        refreshUnappliedIndicators();
        showStatus('属性内容没有产生变化，无需应用。', 'success');
        return true;
      }
      if (selection.kind === 'behavior') {
        return runGraphCommand(
          { type: 'update_behavior', behavior: merged.mergedEntity },
          { successLabel: `${config.label}已更新`, resetEditSessionOnSuccess: true }
        );
      }
      return runGraphCommand(
        { type: 'upsert_flow_relation', relation: merged.mergedEntity },
        { successLabel: `${config.label}已更新`, resetEditSessionOnSuccess: true }
      );
    }

    async function applyDataObjectPropertyDraft() {
      if (graphSelection?.kind !== 'data') {
        showStatus('当前没有可应用的数据对象信息修改。', 'error');
        return false;
      }
      const session = entityEditSession('data', graphSelection.ref);
      const current = entityByKindAndRef('data', graphSelection.ref);
      if (!session || !current) {
        showStatus('当前数据对象编辑状态已经失效，未应用修改仍保留。请重新选择对象后核对。', 'error');
        return false;
      }
      const merged = editSessionManager.mergeCurrentEntity(current);
      if (!merged.ok) {
        showStatus(graphPropertyConflictMessage(merged), 'error');
        return false;
      }
      if (!merged.changedFields.length) {
        editSessionManager.reset();
        openEntityEditSession('data', graphSelection.ref);
        refreshUnappliedIndicators();
        showStatus('对象信息没有产生变化，无需应用。', 'success');
        return true;
      }
      return runGraphCommand(
        { type: 'update_data_object', dataObject: merged.mergedEntity },
        { successLabel: '数据对象信息已更新', resetEditSessionOnSuccess: true }
      );
    }

    async function confirmFlowRelationDraft() {
      if (!flowRelationDraft) return false;
      if (!editSessionManager.canApply(candidateStateKey())) {
        showStatus('当前流程关系尚未完成。请先选择关系类型、起点和终点。', 'error');
        return false;
      }
      const pendingDraft = clone(flowRelationDraft);
      const relation = {
        relation_ref: newRef('relation'),
        relation_type: pendingDraft.relation_type,
        from_behavior_ref: pendingDraft.from_behavior_ref,
        to_behavior_ref: pendingDraft.to_behavior_ref,
        condition: text(pendingDraft.condition)
      };
      const applied = await runGraphCommand(
        { type: 'upsert_flow_relation', relation },
        { successLabel: '流程关系已建立', resetEditSessionOnSuccess: true }
      );
      flowRelationDraft = applied ? null : pendingDraft;
      if (!applied) syncFlowRelationDraftSession();
      render();
      return applied;
    }

    async function applyCurrentEditSession() {
      const session = editSessionManager.get();
      if (!session || !editSessionManager.isDirty(session.candidateKey)) return true;
      if (['behavior-properties', 'relation-properties'].includes(session.editorKind)) return applyGraphPropertyDraft();
      if (session.editorKind === 'data-object-properties') return applyDataObjectPropertyDraft();
      if (session.editorKind === 'data-edge-operations') return applyGraphDataOperations();
      if (session.editorKind === 'new-flow-relation-wizard') return confirmFlowRelationDraft();
      if (['new-data-behavior-link', 'new-form-behavior-link', 'new-field-source'].includes(session.editorKind)) {
        return applyGuidedCreateSession(session.editorKind);
      }
      if (session.editorKind === 'form-field-batch') return applyFormFieldBatch();
      showStatus(`${sessionLabel(session)}尚未完成，当前不能应用。`, 'error');
      return false;
    }

    function deleteGraphObject(kind, ref) {
      if (kind === 'data') return deleteDataObjectByRef(ref);
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), kind, ref);
      if (impacts.length) {
        showStatus(`不能删除：该对象仍被${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}引用。请先转到对应内容移除或替换引用。`, 'error');
        return;
      }
      if (!window.confirm('删除后可通过本候选流程的“撤销”恢复。确定删除吗？')) return;
      return runGraphCommand({ type: 'delete_object', kind, ref }, { successLabel: '对象已删除' });
    }

    async function mergeCurrentDataObjects() {
      const keep = ensureActiveGraphDataObject();
      if (!keep) return;
      const removing = currentDocument().data_objects.filter(item => item.data_ref !== keep.data_ref && text(item.data_name).trim() === text(keep.data_name).trim());
      const preview = globalThis.GraphEditCommands.mergePreview(currentDocument(), keep.data_ref, removing.map(item => item.data_ref));
      if (!preview.ok) return showStatus(preview.message, 'error');
      const valueChoices = {};
      for (const conflict of preview.details.valueConflicts) {
        const choices = [keep, ...removing].map((item, index) => `${index}：${text(item[conflict.field]) || '（空）'}`).join('\n');
        const answer = window.prompt(`字段“${conflict.field}”存在不同值。请输入要保留的编号：\n${choices}`, '0');
        if (answer == null) return showStatus('已取消归并，当前草稿保持不变。');
        const choiceIndex = Number(answer);
        if (!Number.isInteger(choiceIndex) || choiceIndex < 0 || choiceIndex > removing.length) return showStatus('归并未执行：保留值编号无效。', 'error');
        valueChoices[conflict.field] = choiceIndex === 0 ? 'keep' : removing[choiceIndex - 1].data_ref;
      }
      const impactCount = preview.details.impacts.reduce((sum, item) => sum + item.behaviorLinks + item.sourceRelations + item.fieldReferences, 0);
      if (!window.confirm(`将${removing.length + 1}个同名数据归并为当前对象“${keep.data_name}”，涉及${impactCount}项关系或引用。归并副本校验通过后才会替换草稿。确定继续吗？`)) return;
      return runGraphCommand({
        type: 'merge_data_objects',
        keepRef: keep.data_ref,
        removeRefs: removing.map(item => item.data_ref),
        valueChoices
      }, { prevalidate: true, failureLabel: '同名数据归并', successLabel: `已归并同名数据“${keep.data_name}”` });
    }

    function focusGridEditorTarget(target = {}) {
      const tableId = text(target.gridTableId);
      const tableWorkspace = globalThis.AuthoringSelectionContext.TABLE_WORKSPACES[tableId];
      if (!tableWorkspace || !currentDocument()) return false;
      activeGovernanceStep = 'data';
      activeStepView = tableWorkspace === 'forms' ? 'forms' : 'data';
      activeWorkspaceTab = 'editor';
      activeDataEditingMode = 'grid';
      updateAuthoringSelection({
        mode: 'grid',
        workspace: tableWorkspace,
        tableId,
        dataRef: text(target.dataRef),
        dataFieldRef: text(target.dataFieldRef),
        formRef: text(target.formRef),
        areaRef: text(target.areaRef),
        formItemRef: text(target.formItemRef)
      });
      ensureWebGridSession();
      activeGridTableByWorkspace[tableWorkspace] = tableId;
      const gridRowId = text(target.gridRowId);
      const rowRef = text(target.gridRowRef);
      const rowRefKey = text(target.gridRefKey);
      const row = gridRowId
        ? webGridSession.rows(tableId).find(item => !item._deleted && item._row_id === gridRowId)
        : rowRef && rowRefKey
          ? webGridSession.rows(tableId).find(item => !item._deleted && text(item[rowRefKey]) === rowRef)
          : null;
      if (row) {
        selectGridParent(tableId, row);
        webGridSelectedRows[tableId] = row._row_id;
      } else {
        webGridSelectedRows[tableId] = '';
      }
      const columns = nativeGridColumns(tableId);
      const requestedColumn = text(target.gridColumn);
      const column = columns.some(item => item.key === requestedColumn)
        ? requestedColumn
        : columns.find(item => item.editor !== 'readonly')?.key || columns[0]?.key || '';
      if (row && column) {
        webGridRanges[tableId] = {
          anchorRowId: row._row_id,
          currentRowId: row._row_id,
          anchorColumn: column,
          currentColumn: column
        };
        webGridFilters[tableId] = '';
      }
      captureAuthoringSelectionContext();
      render();
      requestAnimationFrame(() => {
        if (row && column && focusNativeGridCell(tableId, row._row_id, column)) return;
        workspace.querySelector(`[data-grid-panel="${CSS.escape(tableId)}"]`)?.focus?.({ preventScroll: true });
      });
      return true;
    }

    function focusEditorTarget(target = {}) {
      if (activeDataEditingMode === 'grid' && focusGridEditorTarget(target)) return;
      const focusKind = text(target.focusKind);
      const focusRef = text(target.focusRef);
      const focusPaths = [...new Set([
        text(target.focusPath),
        ...(Array.isArray(target.focusPaths) ? target.focusPaths.map(text) : [])
      ].filter(Boolean))];
      if (focusKind === 'call') {
        showStatus('部门内调用仅用于预览，请在MDM平台正式功能中维护。');
        return;
      }
      diagramExpanded = false;
      editSessionManager.reset();
      graphSelection = null;
      flowEditorOpen = false;
      const targetStep = globalThis.GovernanceWorkflow.stepForTarget(target);
      const governanceStep = compactTaskUiEnabled() && targetStep === 'action' ? 'skeleton' : targetStep;
      activeGovernanceStep = governanceStep;
      activeStepView = defaultStepView(governanceStep);
      activeWorkspaceTab = governanceStep === 'skeleton' ? 'flow' : governanceStep === 'data' ? 'data' : 'editor';
      activeEditorSection = EDITOR_SECTIONS.some(item => item.value === target.editorSection)
        ? target.editorSection
        : 'process';
      if (PROCESS_SECTIONS.some(item => item.value === target.processSection)) {
        activeProcessSection = target.processSection;
      }
      if (focusKind === 'behavior') {
        activeEditorSection = 'process';
        activeProcessSection = 'behaviors';
        activeBehaviorRef = focusRef;
        if (governanceStep === 'skeleton') {
          openEntityEditSession('behavior', focusRef);
          activeStepView = 'diagram';
          diagramExpanded = false;
          flowEditorOpen = true;
        } else {
          activeStepView = 'behaviors';
        }
      } else if (focusKind === 'relation') {
        activeEditorSection = 'process';
        activeProcessSection = 'relations';
        activeRelationRef = focusRef;
        if (governanceStep === 'skeleton') {
          openEntityEditSession('relation', focusRef);
          activeStepView = 'diagram';
          diagramExpanded = false;
          flowEditorOpen = true;
        } else {
          activeStepView = 'relations';
        }
      } else if (focusKind === 'data') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = focusRef;
        activeDataFieldRef = text(target.dataFieldRef);
        activeStepView = 'data';
        if (activeDataEditingMode === 'guided' && activeDataMode === 'flow') openEntityEditSession('data', focusRef);
      } else if (focusKind === 'form') {
        activeEditorSection = 'forms';
        activeFormRef = focusRef;
        activeStepView = 'forms';
      } else if (focusKind === 'area') {
        activeEditorSection = 'forms';
        activeStepView = 'forms';
        const owner = currentDocument()?.forms?.find(form =>
          form.areas.some(area => area.area_ref === focusRef)
        );
        if (owner) {
          activeFormRef = owner.form_ref;
          activeAreaRef = focusRef;
        }
        if (text(target.formItemRef)) activeFormItemRef = text(target.formItemRef);
        const itemPath = focusPaths
          .map(path => path.match(/^forms\.(\d+)\.areas\.(\d+)\.items\.(\d+)\.(?:business_data_ref|value_origin_mode|source_links)/))
          .find(Boolean);
        if (itemPath) {
          activeFormItemRef = currentDocument()?.forms?.[Number(itemPath[1])]
            ?.areas?.[Number(itemPath[2])]?.items?.[Number(itemPath[3])]?.item_ref || '';
        }
      }
      render();
      requestAnimationFrame(() => {
        const card = Array.from(workspace.querySelectorAll('[data-focus-kind]')).find(item =>
          item.dataset.focusKind === focusKind && item.dataset.focusRef === text(focusRef)
        );
        const controls = Array.from(
          workspace.querySelectorAll('[data-bind], [data-focus-key], [data-list-bind]')
        ).filter(item =>
          focusPaths.includes(item.dataset.bind)
          || focusPaths.includes(item.dataset.focusKey)
          || focusPaths.includes(item.dataset.listBind)
        );
        controls.forEach(control => {
          const details = control.closest('details');
          if (details) details.open = true;
        });
        const focusTarget = controls.find(control => !control.disabled)
          || controls[0]
          || card
          || workspace.querySelector('.section');
        if (!focusTarget) return;
        workspace.querySelectorAll('.focused-card, .focused-control').forEach(item => {
          item.classList.remove('focused-card', 'focused-control');
          item.removeAttribute('aria-invalid');
        });
        if (controls.length) {
          controls.forEach(control => {
            void control.offsetWidth;
            control.classList.add('focused-control');
            control.setAttribute('aria-invalid', 'true');
          });
          if (!focusTarget.disabled) focusTarget.focus({ preventScroll: true });
        } else {
          focusTarget.classList.add('focused-card');
          focusTarget.setAttribute('tabindex', '-1');
          focusTarget.focus({ preventScroll: true });
        }
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (focusClearTimer) clearTimeout(focusClearTimer);
        focusClearTimer = setTimeout(() => {
          focusTarget.classList.remove('focused-card');
          controls.forEach(control => {
            control.classList.remove('focused-control');
            control.removeAttribute('aria-invalid');
          });
        }, 2900);
      });
    }

      const step = text(element.dataset.step);

      const target = {
        focusKind: element.dataset.focusKind,
        focusRef: element.dataset.focusRef,

    function handoffSummaryLine(result = currentEntry()?.lastDownload) {
      if (!result) return '';
      return [
        `文件名：${result.fileName}`,
        `导出时间：${result.exportedAt}`,
        `阶段：${result.stage.label}`,
        `结构版本：${EXPECTED_EXPORT_SCHEMA_VERSION}`,
        `SHA-256：${result.sha256 || '摘要未生成，交接前需使用外部工具补算'}`
      ].join('；');
    }

    async function copyLastHandoffSummary() {
      const line = handoffSummaryLine();
      if (!line) return;
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(line);
        } else {
          const area = document.createElement('textarea');
          area.value = line;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.appendChild(area);
          area.select();
          if (!document.execCommand('copy')) throw new Error('copy unavailable');
          area.remove();
        }
        showStatus('交接摘要已复制。', 'success');
      } catch (_error) {
        window.prompt('浏览器未允许自动复制。请手工复制以下交接摘要：', line);
      }
    }

      if (!data) return [];

    function ensureActiveFlowItem() {
      const items = flowItems();

    function itemDragHandle(kind, itemRef, index, label) {
      return `
        <button
          class="selector-drag-handle"
          data-drag-handle="${escapeAttribute(kind)}"
          data-ref="${escapeAttribute(itemRef)}"
          aria-label="拖动第${index + 1}项${escapeAttribute(label)}调整顺序"

    function orderedSelectorRow(kind, itemRef, index, total, label, buttonLabel, activeRef) {

    function sortableCollection(kind) {
      const definitions = {
        behavior: { collectionKey: 'behaviors', refKey: 'behavior_ref', label: '业务行为', setActive: ref => { activeBehaviorRef = ref; } },
        relation: { collectionKey: 'flow_relations', refKey: 'relation_ref', label: '流程关系', setActive: ref => { activeRelationRef = ref; } },
        data: { collectionKey: 'data_objects', refKey: 'data_ref', label: '输出物与数据', setActive: ref => { activeDataRef = ref; } },
        term: { collectionKey: 'terms', refKey: 'term_ref', label: '术语', setActive: ref => { activeTermRef = ref; } }
      };
      const definition = definitions[kind];
      const collection = definition ? currentDocument()?.[definition.collectionKey] : null;
      return definition && Array.isArray(collection) ? { ...definition, collection } : null;
    }

    function sortableRows(kind) {
      return Array.from(workspace.querySelectorAll(`.selector-row[data-sort-kind="${CSS.escape(kind)}"]`));
    }

    function clearSortableIndicators() {
      workspace.querySelectorAll('.sortable-dragging, .sortable-target-before, .sortable-target-after').forEach(row => {
        row.classList.remove('sortable-dragging', 'sortable-target-before', 'sortable-target-after');
      });
      workspace.querySelectorAll('.selector-drag-handle[aria-pressed="true"]').forEach(handle => {
        handle.setAttribute('aria-pressed', 'false');
      });
    }

    function showSortableTarget() {
      const state = sortableDragState;
      if (!state) return;
      clearSortableIndicators();
      state.handle.setAttribute('aria-pressed', 'true');
      state.row.classList.add('sortable-dragging');
      if (state.targetIndex === state.originalIndex) return;
      const rows = sortableRows(state.kind);
      const targetRow = rows[state.targetIndex];
      if (!targetRow) return;
      targetRow.classList.add(state.targetIndex < state.originalIndex ? 'sortable-target-before' : 'sortable-target-after');
    }

    function beginSortableDrag(handle, inputMode, pointerId = null) {
      const kind = text(handle.dataset.dragHandle);
      const itemRef = text(handle.dataset.ref);
      const definition = sortableCollection(kind);
      const row = handle.closest('.selector-row');
      if (!definition || !row) return false;
      const originalIndex = definition.collection.findIndex(item => text(item?.[definition.refKey]) === itemRef);
      if (originalIndex < 0) return false;
      sortableDragState = {
        kind,
        itemRef,
        definition,
        originalIndex,
        targetIndex: originalIndex,
        row,
        handle,
        inputMode,
        pointerId,
        selector: row.closest('.record-selector')
      };
      definition.setActive(itemRef);
      if (pointerId != null && handle.setPointerCapture) handle.setPointerCapture(pointerId);
      showSortableTarget();
      showStatus(`正在调整第${originalIndex + 1}项${definition.label}。`);
      return true;
    }

    function moveSortableTarget(targetIndex) {
      const state = sortableDragState;
      if (!state) return;
      const nextIndex = Math.max(0, Math.min(state.definition.collection.length - 1, targetIndex));
      if (nextIndex === state.targetIndex) return;
      state.targetIndex = nextIndex;
      showSortableTarget();
      showStatus(`将${state.definition.label}移动到第${nextIndex + 1}项；确认前不会修改草稿。`);
    }

    function sortableTargetFromPointer(clientX, clientY) {
      const state = sortableDragState;
      if (!state) return;
      const selector = state.selector;
      if (selector) {
        const bounds = selector.getBoundingClientRect();
        const edge = Math.min(48, bounds.height / 4);
        if (clientY < bounds.top + edge) selector.scrollBy({ top: -24, behavior: 'auto' });
        if (clientY > bounds.bottom - edge) selector.scrollBy({ top: 24, behavior: 'auto' });
      }
      const hit = document.elementFromPoint(clientX, clientY)?.closest('.selector-row');
      if (!hit || hit.dataset.sortKind !== state.kind) return;
      const rows = sortableRows(state.kind);
      const hitIndex = rows.indexOf(hit);
      if (hitIndex < 0) return;
      const bounds = hit.getBoundingClientRect();
      const insertionIndex = hitIndex + (clientY > bounds.top + bounds.height / 2 ? 1 : 0);
      const targetIndex = insertionIndex > state.originalIndex ? insertionIndex - 1 : insertionIndex;
      moveSortableTarget(targetIndex);
    }

    function finishSortableDrag(commit) {
      const state = sortableDragState;
      if (!state) return;
      const changed = commit && state.targetIndex !== state.originalIndex;
      clearSortableIndicators();
      sortableDragState = null;
      if (!changed) {
        showStatus(commit ? '顺序未变化，草稿没有新增修改。' : '已取消调整顺序，草稿没有新增修改。');
        state.handle.focus({ preventScroll: true });
        return;
      }
      const [item] = state.definition.collection.splice(state.originalIndex, 1);
      state.definition.collection.splice(state.targetIndex, 0, item);
      state.definition.setActive(state.itemRef);
      touch();
      render();
      requestAnimationFrame(() => {
        workspace.querySelector(`.selector-drag-handle[data-drag-handle="${CSS.escape(state.kind)}"][data-ref="${CSS.escape(state.itemRef)}"]`)?.focus({ preventScroll: true });
      });
      showStatus(`${state.definition.label}已移动到第${state.targetIndex + 1}项。技术标识和关联关系保持不变。`, 'success');
    }
