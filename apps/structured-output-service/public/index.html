    function candidateStateKey(entry = currentEntry()) {
      if (!entry) return '';
      if (!entry.stateKey) entry.stateKey = newRef('candidate');
      return entry.stateKey;
    }

    function registerCandidateState(entry, options = {}) {
      if (!entry) return;
      const key = candidateStateKey(entry);
      graphStateManager.register(key, entry.data, { resetHistory: options.resetHistory !== false });
      entry.forceDirty = Boolean(options.forceDirty);
      entry.dirty = entry.forceDirty;
    }

    function refreshCandidateDirty(entry = currentEntry()) {
      if (!entry) return false;
      entry.dirty = Boolean(entry.forceDirty) || graphStateManager.isDirty(candidateStateKey(entry), entry.data);
      return entry.dirty;
    }

    function hasDirtyCandidates() {
      return candidates.some(item => item.dirty);
    }

    function governanceCheckKey(stepId, entry = currentEntry()) {
      return entry ? `${candidateStateKey(entry)}:${stepId}` : '';
    }

    function checkedGovernanceStepIds(entry = currentEntry()) {
      if (!entry) return [];
      const prefix = `${candidateStateKey(entry)}:`;
      return [...checkedGovernanceSteps]
        .filter(key => key.startsWith(prefix))
        .map(key => key.slice(prefix.length));
    }

    function invalidateCurrentChecks(entry = currentEntry()) {
      if (!entry) return;
      const prefix = `${candidateStateKey(entry)}:`;
      [...checkedGovernanceSteps].forEach(key => {
        if (key.startsWith(prefix)) checkedGovernanceSteps.delete(key);
      });
    }

    function invalidateBulkPreview() {
      bulkDataEditorState.preview = null;
      bulkDataEditorState.documentKey = '';
    }

    function resetBulkDataEditor(options = {}) {
      bulkDataEditorState = {
        kind: options.keepKind ? bulkDataEditorState.kind : 'objects',
        text: '',
        preview: null,
        documentKey: ''
      };
    }

    function touch() {
      const entry = currentEntry();
      if (!entry) return;
      invalidateCurrentChecks(entry);
      invalidateBulkPreview();
      refreshCandidateDirty(entry);
      updateCandidateList();
      governanceHeader.innerHTML = renderGovernanceHeader(currentDocument());
      workspaceViewSwitch.innerHTML = renderGovernanceSteps();
      refreshVisibleGovernanceCheckUi();
    }

    function setBusy(value, message = '') {
      busy = value;
      document.querySelectorAll('[data-global-action]').forEach(button => {
        button.disabled = value || (button.dataset.requiresDocument === 'true' && !currentDocument());
      });
      if (message) showStatus(message);
    }

    function showStatus(message, kind = '') {
      statusBox.textContent = message;
      statusBox.className = `status show${kind ? ` ${kind}` : ''}`;
    }

    function clearStatus() {
      statusBox.textContent = '';
      statusBox.className = 'status';
    }

    function optionHtml(options, selected) {
      return options.map(option => {
        const value = typeof option === 'string' ? option : option.value;
        const label = typeof option === 'string' ? (option || '请选择') : option.label;
        return `<option value="${escapeAttribute(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function getByPath(pathKey) {
      return pathKey.split('.').reduce((target, part) => target == null ? undefined : target[part], currentDocument());
    }

    function setByPath(pathKey, value) {
      const parts = pathKey.split('.');
      const last = parts.pop();
      const target = parts.reduce((node, part) => node[part], currentDocument());
      target[last] = value;
    }

    function field(pathKey, label, options = {}) {
      const value = getByPath(pathKey);
      const classes = ['field', options.className || ''].filter(Boolean).join(' ');
      const hint = options.hint ? `<span class="hint">${escapeHtml(options.hint)}</span>` : '';
      let control = '';
      if (options.type === 'textarea') {
        control = `<textarea class="${options.tall ? 'tall' : ''}" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" placeholder="${escapeAttribute(options.placeholder || '')}">${escapeHtml(value)}</textarea>`;
      } else if (options.type === 'select') {
        control = `<select data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}">${optionHtml(options.options || [], value == null ? '' : value)}</select>`;
      } else if (options.type === 'date') {
        control = `<input type="date" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}">`;
      } else if (options.type === 'checkbox') {
        control = `<div class="check-row"><label><input type="checkbox" data-bind="${escapeAttribute(pathKey)}" data-kind="boolean"${value ? ' checked' : ''}> ${escapeHtml(options.checkboxLabel || label)}</label></div>`;
      } else {
        control = `<input type="text" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}" placeholder="${escapeAttribute(options.placeholder || '')}">`;
      }
      return `<div class="${classes}"><label>${escapeHtml(label)}</label>${control}${hint}</div>`;
    }

    function formItemTypeField(pathKey, currentValue) {
      const normalizedValue = text(currentValue).trim();
      const knownValue = Boolean(normalizedValue && formItemTypes.includes(normalizedValue));
      const options = [{
        value: '',
        label: formItemTypeLoadState === 'loading' ? '正在读取数据类型' : '请选择数据类型'
      }].concat(formItemTypes.map(value => ({ value, label: value })));
      if (normalizedValue && !knownValue) {
        options.push({
          value: normalizedValue,
          label: formItemTypeLoadState === 'ready'
            ? `${normalizedValue}（当前类型字典未收录）`
            : `${normalizedValue}（保留当前值）`
        });
      }
      const unavailable = formItemTypeLoadState !== 'ready'
        ? '<div class="inline-warning">数据类型字典暂时不可用。3001不会清除已有类型；字典恢复后再选择标准类型。</div>'
        : '';
      const legacyWarning = formItemTypeLoadState === 'ready' && normalizedValue && !knownValue
        ? `<div class="inline-warning">当前导入值“${escapeHtml(normalizedValue)}”未被填写项类型字典收录。3001会保留原值；如需修改，只能改选标准类型。</div>`
        : '';
      return `
        <div class="field">
          <label>${escapeHtml('数据类型')}</label>
          <select
            data-bind="${escapeAttribute(pathKey)}"
            data-kind="text"
            ${formItemTypeLoadState !== 'ready' ? 'disabled' : ''}
          >${optionHtml(options, normalizedValue)}</select>
          <span class="hint">请从标准类型中选择，不允许自由填写。</span>
          ${legacyWarning}
          ${unavailable}
        </div>`;
    }

    function formDesignStateMeta(value) {
      if (value === 'current_state') return { label: '现状', className: 'current' };
      if (value === 'proposed_design') return { label: '拟设计', className: 'proposed' };
      return { label: '待确认', className: 'unspecified' };
    }

    function formDesignStateBadge(value) {
      const meta = formDesignStateMeta(value);
      return `<span class="form-state-badge ${meta.className}">${meta.label}</span>`;
    }

    function formItemAssignmentField(formIndex, areaIndex, itemIndex, item) {
      const form = currentDocument().forms[formIndex];
      const area = form.areas[areaIndex];
      let detailNumber = 0;
      const detailOptions = form.areas
        .filter(candidate => candidate.area_type === '明细清单')
        .map(candidate => {
          detailNumber += 1;
          return {
            value: candidate.area_ref,
            label: `${candidate.area_title || `明细表${detailNumber}`}`
          };
        });
      const selected = area.area_type === '基本信息'
        ? 'main'
        : area.area_type === '明细清单'
          ? area.area_ref
          : 'unassigned';
      const options = [
        { value: 'unassigned', label: '待确认' },
        { value: 'main', label: '主表字段' },
        ...detailOptions,
        { value: '__new_detail__', label: '新建明细表' }
      ];
      const focusKey = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.assignment`;
      return `
        <div class="field">
          <label>字段归属</label>
          <select
            data-form-item-assignment
            data-form-index="${formIndex}"
            data-item-ref="${escapeAttribute(item.item_ref)}"
            data-focus-key="${escapeAttribute(focusKey)}"
          >${optionHtml(options, selected)}</select>
          <span class="hint">只按纸质表单位置选择，不根据数据类型推断。</span>
        </div>`;
    }

    function behaviorSelect(pathKey, label, options = {}) {
      const selectedRef = text(getByPath(pathKey)).trim();
      const values = [{ value: '', label: options.blankLabel || '暂不指定' }]
        .concat((currentDocument()?.behaviors || [])
          .map((item, index) => ({ item, index }))
          .filter(({ item }) => item.behavior_ref !== options.excludeRef)
          .filter(({ item }) => !options.localOnly || !externalActorDepartment(item.current_actor_role) || item.behavior_ref === selectedRef)
          .map(({ item, index }) => ({
            value: item.behavior_ref,
            label: `${index + 1}. ${item.behavior_name || '未命名行为'}${options.localOnly && externalActorDepartment(item.current_actor_role) ? '（历史跨部门关联，请调整）' : ''}`
          })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function dataSelect(pathKey, label, options = {}) {
      const values = [{ value: '', label: '暂不指定' }]
        .concat((currentDocument()?.data_objects || []).map((item, index) => ({
          value: item.data_ref,
          label: `${index + 1}. ${item.data_name || '未命名数据'}`
        })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function multiBehavior(pathKey, label, selected) {
      const behaviors = currentDocument()?.behaviors || [];
      const content = behaviors.length
        ? behaviors.map((item, index) => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(item.behavior_ref)}"${selected.includes(item.behavior_ref) ? ' checked' : ''}> ${index + 1}. ${escapeHtml(item.behavior_name || '未命名行为')}</label>`).join('')
        : '<span class="technical-note">请先新增业务行为。</span>';
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function currentDataFlowDetails() {
      return globalThis.StructureLearningScore?.dataFlowConsistencyDetails?.(currentDocument()) || {
        incomingByBehavior: new Map(),
        dataDetails: [],
        issues: [],
        canReach: () => false,
        isConsumerAvailable: () => true
      };
    }

    function behaviorEntrySummary(behaviorRef, flowDetails = currentDataFlowDetails()) {
      const incoming = flowDetails.incomingByBehavior.get(behaviorRef) || [];
      if (!incoming.length) return '这是流程入口，请说明流程如何开始。';
      return incoming.map(entry => {
        const relation = entry.relation;
        const source = relationEndpointLabel(relation.from_behavior_ref, '前序行为待选择');
        if (relation.relation_type === 'condition') {
          const condition = text(relation.condition).trim() || '判断条件待填写';
          return `“${condition}”成立时，从“${source}”进入`;
        }
        if (relation.relation_type === 'parallel') return `并行路线“${source}”完成后进入`;
        return `“${source}”完成后进入`;
      }).join('；');
    }

    function behaviorDataSummary(behaviorRef, flowDetails = currentDataFlowDetails()) {
      const inputs = [];
      const outputs = [];
      const updates = [];
      const forms = [];
      flowDetails.dataDetails.forEach(detail => {
        const label = text(detail.data?.data_name).trim() || `输出物与数据${detail.dataIndex + 1}`;
        if (detail.consumerRefs.includes(behaviorRef) || detail.availabilityStarts.includes(behaviorRef)) inputs.push(label);
        if ((detail.data?.behavior_links || []).some(link => link.behavior_ref === behaviorRef && link.operation === 'create')) outputs.push(label);
        if ((detail.data?.behavior_links || []).some(link => link.behavior_ref === behaviorRef && link.operation === 'update')) updates.push(label);
      });
      (currentDocument()?.forms || []).forEach(form => {
        const link = (form.behavior_links || []).find(item => item.behavior_ref === behaviorRef);
        if (!link) return;
        const operationLabels = (link.operations || []).map(operation => FORM_OPERATIONS.find(item => item.value === operation)?.label || operation);
        forms.push(`${form.form_name || '未命名表单'}（${operationLabels.length ? operationLabels.join('、') : '操作待确认'}）`);
      });
      const behavior = (currentDocument()?.behaviors || []).find(item => item.behavior_ref === behaviorRef);
      if (isDynamicActorBehavior(behavior) && behavior.actor_department_data_ref) {
        const source = (currentDocument()?.data_objects || []).find(item => item.data_ref === behavior.actor_department_data_ref);
        const label = text(source?.data_name).trim() || '执行部门来源数据';
        inputs.push(`${label}（用于确定执行部门）`);
      }
      return {
        inputs: [...new Set(inputs)],
        outputs: [...new Set(outputs)],
        updates: [...new Set(updates)],
        forms: [...new Set(forms)]
      };
    }

    function renderBehaviorDerivedSummary(item, flowDetails) {
      const summary = behaviorDataSummary(item.behavior_ref, flowDetails);
      const entry = behaviorEntrySummary(item.behavior_ref, flowDetails);
      return `
        <div class="field wide">
          <span class="field-label">由流程关系和输出物与数据自动带出</span>
          <div class="inline-note">
            <div><strong>进入本行为：</strong>${escapeHtml(entry)}</div>
            <div><strong>本行为使用：</strong>${escapeHtml(summary.inputs.length ? summary.inputs.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为产生：</strong>${escapeHtml(summary.outputs.length ? summary.outputs.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为更新：</strong>${escapeHtml(summary.updates.length ? summary.updates.join('、') : '当前没有已关联数据')}</div>
            <div><strong>本行为处理表单：</strong>${escapeHtml(summary.forms.length ? summary.forms.join('；') : '当前没有已关联表单')}</div>
            <button class="button secondary small" data-action="open-behavior-data" data-ref="${escapeAttribute(item.behavior_ref)}">管理输出物与数据</button>
          </div>
        </div>`;
    }

    function renderLegacyBehaviorSupplement(item, hasDerivedEntry) {
      const entries = [];
      if (hasDerivedEntry && text(item.trigger).trim()) entries.push(`<div><strong>原“何时触发”：</strong>${escapeHtml(item.trigger)}</div>`);
      if (text(item.input_description).trim()) entries.push(`<div><strong>原“需要什么输入”：</strong>${escapeHtml(item.input_description)}</div>`);
      if (text(item.output_description).trim()) entries.push(`<div><strong>原“最终交付什么”：</strong>${escapeHtml(item.output_description)}</div>`);
      if (['parallel_split', 'parallel_join'].includes(item.node_type) && text(item.completion_standard).trim()) {
        entries.push(`<div><strong>原“怎样算完成”：</strong>${escapeHtml(item.completion_standard)}</div>`);
      }
      if (!entries.length) return '';
      return `
        <details class="nested">
          <summary><strong>历史文字补充（只读）</strong></summary>
          <div class="inline-note" style="margin-top:12px">
            ${entries.join('')}
            <div>这些内容按原值保留，不再要求重复填写。请在流程关系和“输出物与数据”中维护现行结构关系。</div>
          </div>
        </details>`;
    }

    function legacyCrossDepartmentDiagnostics(data = currentDocument()) {
      return globalThis.LegacyCrossDepartmentDiagnostics?.diagnose(data) || [];
    }

    function renderLegacyCrossDepartmentGuidance(behavior) {
      const related = legacyCrossDepartmentDiagnostics().filter(item =>
        item.issues.length && item.relatedBehaviorRefs.includes(behavior?.behavior_ref)
      );
      if (!related.length) return '';
      return `
        <details class="nested" open>
          <summary><strong>旧版跨部门记录待核对（${related.length}项）</strong></summary>
          <div class="inline-warning" style="margin-top:12px">
            <p>3001已对照旧触发说明和当前流程关系，列出需要业务人员确认的具体位置。原值仍只读保留，页面不会自动选择流程方向或数据去向。</p>
            <ul>${related.flatMap(item => item.issues).map(issue => `
              <li>
                <div>${escapeHtml(issue.message)}</div>
                <ul>${issue.suggestions.map(suggestion => `<li>${escapeHtml(suggestion)}</li>`).join('')}</ul>
                <div class="item-actions" style="margin-top:8px">
                  <button class="button secondary small" data-action="focus-legacy-diagnostic" ${exportWarningLocationAttributes(issue)}>定位并核对</button>
                </div>
              </li>`).join('')}</ul>
          </div>
        </details>`;
    }

    function dataConsumerBehaviorPicker(dataIndex, item, flowDetails = currentDataFlowDetails()) {
      const flowDetail = flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref);
      const selected = flowDetail?.consumerRefs
        || (Array.isArray(item.consumed_by_behavior_refs) ? item.consumed_by_behavior_refs : []);
      const pathKey = `data_objects.${dataIndex}.consumed_by_behavior_refs`;
      const choices = (currentDocument()?.behaviors || []).map((behavior, behaviorIndex) => {
        const isSelected = selected.includes(behavior.behavior_ref);
        const issue = flowDetails.consumerIssue?.(item.data_ref, behavior.behavior_ref);
        if (!isSelected && !flowDetails.isConsumerAvailable(item.data_ref, behavior.behavior_ref)) return '';
        const warning = issue ? ` <span class="technical-note">历史引用待整改：${escapeHtml(issue.message)}</span>` : '';
        return `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(behavior.behavior_ref)}"${isSelected ? ' checked' : ''}> ${behaviorIndex + 1}. ${escapeHtml(behavior.behavior_name || '未命名行为')}${warning}</label>`;
      }).filter(Boolean);
      const content = choices.length
        ? choices.join('')
        : '<span class="technical-note">当前没有符合流程先后顺序的可选行为。请先检查产生行为和流程关系。</span>';
      return `<div class="field wide"><span class="field-label">被哪些后续行为使用</span><div class="check-list">${content}</div><span class="hint">只显示产生后可到达的行为。并行分支之间、同一行为自身以及明确的前序行为不可选择。</span></div>`;
    }

    function dataProducerBehaviorSelect(dataIndex, item, flowDetails = currentDataFlowDetails()) {
      const flowDetail = flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref);
      const consumerRefs = flowDetail?.consumerRefs || [];
      const selected = text(item.produced_by_behavior_ref).trim();
      const values = [{ value: '', label: '暂不指定' }];
      (currentDocument()?.behaviors || []).forEach((behavior, behaviorIndex) => {
        const candidateRef = behavior.behavior_ref;
        const allowed = consumerRefs.every(consumerRef =>
          candidateRef !== consumerRef
          && flowDetails.canReach(candidateRef, consumerRef)
          && !flowDetails.canReach(consumerRef, candidateRef)
        );
        if (!allowed && candidateRef !== selected) return;
        values.push({
          value: candidateRef,
          label: `${behaviorIndex + 1}. ${behavior.behavior_name || '未命名行为'}${allowed ? '' : '（历史值待整改）'}`
        });
      });
      return field(`data_objects.${dataIndex}.produced_by_behavior_ref`, '由哪个行为产生', {
        type: 'select',
        options: values,
        nullable: true,
        hint: '只显示位于全部使用行为之前的可选行为。跨部门传递和返回也通过行为关系与普通流程关系表达。'
      });
    }

    function syncBehaviorLinksForData(item, options = {}) {
      const data = currentDocument();
      if (!data || !item?.data_ref) return;
      if (options.producer) {
        data.behaviors.forEach(behavior => {
          behavior.output_data_refs = (behavior.output_data_refs || []).filter(ref => ref !== item.data_ref);
        });
        const producer = data.behaviors.find(behavior => behavior.behavior_ref === item.produced_by_behavior_ref);
        if (producer && !producer.output_data_refs.includes(item.data_ref)) producer.output_data_refs.push(item.data_ref);
      }
      if (options.consumers) {
        const consumers = new Set(item.consumed_by_behavior_refs || []);
        data.behaviors.forEach(behavior => {
          behavior.input_data_refs = (behavior.input_data_refs || []).filter(ref => ref !== item.data_ref);
          if (consumers.has(behavior.behavior_ref)) behavior.input_data_refs.push(item.data_ref);
        });
      }
    }

    function multiDepartments(pathKey, label, selected) {
      const content = DEPARTMENTS.map(department => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(department)}"${selected.includes(department) ? ' checked' : ''}> ${escapeHtml(department)}</label>`).join('');
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function section(title, hint, body, action = '') {
      return `<section class="section"><div class="section-head"><div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(hint)}</p></div>${action}</div><div class="section-body">${body}</div></section>`;
    }

    function emptyList(message) {
      return `<div class="empty-list">${escapeHtml(message)}</div>`;
    }

    function resetEditorNavigation(sectionName = 'basic') {
      activeEditorSection = sectionName;
      activeProcessSection = 'behaviors';
      activeBehaviorRef = '';
      activeRelationRef = '';
      activeDataRef = '';
      activeTermRef = '';
      activeFlowItemKind = 'behavior';
      activeFormRef = '';
      activeAreaRef = '';
    }

    function ensureActiveBehavior() {
      const behaviors = currentDocument()?.behaviors || [];
      let behavior = behaviors.find(item => item.behavior_ref === activeBehaviorRef);
      if (!behavior) behavior = behaviors[0] || null;
      activeBehaviorRef = behavior?.behavior_ref || '';
      return behavior;
    }

    function ensureActiveCollectionItem(collectionKey, refKey, activeRef) {
      const collection = currentDocument()?.[collectionKey] || [];
      let item = collection.find(candidate => text(candidate?.[refKey]) === activeRef);
      if (!item) item = collection[0] || null;
      return {
        item,
        index: item ? collection.indexOf(item) : -1,
        ref: text(item?.[refKey])
      };
    }

    function ensureActiveRelation() {
      const active = ensureActiveCollectionItem('flow_relations', 'relation_ref', activeRelationRef);
      activeRelationRef = active.ref;
      return active;
    }

    function ensureActiveDataObject() {
      const active = ensureActiveCollectionItem('data_objects', 'data_ref', activeDataRef);
      activeDataRef = active.ref;
      return active;
    }

    function ensureActiveTerm() {
      const active = ensureActiveCollectionItem('terms', 'term_ref', activeTermRef);
      activeTermRef = active.ref;
      return active;
    }

    function ensureActiveForm() {
      const forms = currentDocument()?.forms || [];
      let form = forms.find(item => item.form_ref === activeFormRef);
      if (!form) form = forms[0] || null;
      activeFormRef = form?.form_ref || '';
      if (!form) {
        activeAreaRef = '';
        return { form: null, formIndex: -1, area: null, areaIndex: -1 };
      }
      const mainArea = form.areas.find(item => item.area_type === '基本信息');
      let area = form.areas.find(item => item.area_ref === activeAreaRef);
      if (!area) area = mainArea || form.areas[0] || null;
      activeAreaRef = area?.area_ref || '';
      return {
        form,
        formIndex: forms.indexOf(form),
        area,
        areaIndex: area ? form.areas.indexOf(area) : -1
      };
    }

    function renderEditorNavigation() {
      return `
        <nav class="editor-navigation" aria-label="字段编辑分区">
          ${EDITOR_SECTIONS.map(item => `
            <button
              class="editor-section-tab${activeEditorSection === item.value ? ' active' : ''}"
              data-action="switch-editor-section"
              data-section="${escapeAttribute(item.value)}"
            >${escapeHtml(item.label)}</button>
          `).join('')}
        </nav>`;
    }

    function renderProcessNavigation() {
      return `
        <nav class="process-navigation" aria-label="流程步骤内容">
          ${PROCESS_SECTIONS.map(item => `
            <button
              class="process-section-tab${activeProcessSection === item.value ? ' active' : ''}"
              data-action="switch-process-section"
              data-section="${escapeAttribute(item.value)}"
            >${escapeHtml(item.label)}</button>
          `).join('')}
        </nav>`;
    }

    function currentDiagramModel(data = currentDocument()) {
      if (window.ProcessDiagram?.buildGraphModel) {
        return window.ProcessDiagram.buildGraphModel(data, {
          departmentOrder: actorDepartments()
        });
      }
      const namedBehaviorCount = (data?.behaviors || []).filter(item => text(item.behavior_name).trim()).length;
      return {
        nodes: [],
        backgrounds: [],
        edges: [],
        elements: [],
        lanes: [],
        namedBehaviorCount,
        localEdgeCount: 0,
        unresolvedItems: [],
        unresolvedCount: 0,
        reviewItems: [],
        reviewCount: 0
      };
    }

    function previewStatus(model) {
      if (!model.namedBehaviorCount) return { label: '待填写行为', className: 'waiting' };
      if (model.unresolvedCount) return { label: `有 ${model.unresolvedCount} 项未显示`, className: 'warning' };
      if (model.reviewCount) return { label: `有 ${model.reviewCount} 项关系待核对`, className: 'warning' };
      return { label: '可查看', className: 'ready' };
    }

    function governanceTechnicalCount() {
      if (!currentDocument() || structureScoreState.documentKey !== currentStructureScoreKey()) return null;
      if (structureScoreState.status === 'pending') return null;
      return (structureScoreState.result?.issues || []).filter(item => item.category === '技术结构').length;
    }

    function governanceStartedSteps(data = currentDocument()) {
      if (!data) return [];
      const boundaryValues = [
        data.export_meta?.initiating_department,
        data.export_meta?.compiler,
        data.process?.process_name,
        data.process?.owning_department,
        data.process?.purpose,
        data.process?.scope
      ];
      const actionStarted = (data.behaviors || []).some(item => [
        item.behavior_description,
        item.trigger,
        item.precondition,
        item.timing,
        item.completion_standard
      ].some(value => text(value).trim()) || item.countersign_all_required || item.countersign_target_departments?.length);
      const steps = ['start'];
      if (boundaryValues.some(value => text(value).trim())) steps.push('boundary');
      if ((data.behaviors || []).length || (data.flow_relations || []).length) steps.push('skeleton');
      if (actionStarted) steps.push('action');
      if ((data.data_objects || []).length || (data.forms || []).length) steps.push('data');
      if ((data.behaviors || []).some(item => externalActorDepartment(item.current_actor_role))) steps.push('cross-department');
      if (currentEntry()?.lastDownload?.stage?.key === 'final' || activeGovernanceStep === 'handoff') steps.push('handoff');
      return steps;
    }

    function governanceIssues(data = currentDocument()) {
      if (!data) return [];
      return businessWarnings(data).concat(
        reviewBehaviorExecutabilityWarnings(data),
        reviewRoutingWarnings(data)
      );
    }

    function governanceIssuesForStep(stepId, data = currentDocument()) {
      return governanceIssues(data).filter(item =>
        (globalThis.GovernanceWorkflow?.stepForTarget(item) || 'handoff') === stepId
      );
    }

    function governanceIssueCounts(data = currentDocument()) {
      const counts = Object.fromEntries(GOVERNANCE_STEPS.map(step => [step.id, 0]));
      if (!data) return counts;
      governanceIssues(data).forEach(item => {
        const stepId = globalThis.GovernanceWorkflow?.stepForTarget(item) || 'handoff';
        counts[stepId] = (counts[stepId] || 0) + 1;
      });
      return counts;
    }

    function governanceContext(data = currentDocument()) {
      const issueCounts = governanceIssueCounts(data);
      return {
        hasDocument: Boolean(data),
        activeStep: activeGovernanceStep,
        issueCounts,
        technicalCount: governanceTechnicalCount() || 0,
        startedSteps: governanceStartedSteps(data),
        checkedSteps: checkedGovernanceStepIds()
      };
    }

    function renderGovernanceSteps(disabled = false) {
      const context = governanceContext();
      return `<div class="workspace-tabs-shell"><div class="workspace-tabs" role="tablist" aria-label="七步治理导航">
        ${GOVERNANCE_STEPS.map(step => {
          const active = activeGovernanceStep === step.id;
          const status = globalThis.GovernanceWorkflow.statusForStep(step.id, context);
          return `<button
            class="workspace-tab${active ? ' active' : ''}"
            role="tab"
            aria-selected="${active}"
            data-action="switch-governance-step"
            data-step="${escapeAttribute(step.id)}"
            ${disabled && step.id !== 'start' ? 'disabled' : ''}
          >
            <span class="step-number">${step.number}</span>
            <span class="step-copy"><span class="step-label">${escapeHtml(step.label)}</span><span class="step-responsibility">${escapeHtml(step.responsibility)}</span></span>
            <span class="tab-status ${status.key === 'error' || status.key === 'missing' ? 'warning' : status.key === 'reviewable' ? 'ready' : 'waiting'}">${escapeHtml(status.label)}</span>
          </button>`;
        }).join('')}
      </div></div>`;
    }

    function renderGovernanceHeader(data = currentDocument()) {
      const entry = currentEntry();
      const stage = globalThis.GovernanceWorkflow.stageForStep(activeGovernanceStep);
      const technicalCount = governanceTechnicalCount();
      const technicalLabel = technicalCount == null ? '结构错误：待检查' : `结构错误：${technicalCount}项`;
      const candidateOptions = candidates.map((item, index) => {
        const name = item.data.process?.process_name || `未命名流程 ${index + 1}`;
        return `<option value="${index}" ${index === currentIndex ? 'selected' : ''}>${index + 1}. ${escapeHtml(name)}${item.dirty ? '（有未下载修改）' : ''}</option>`;
      }).join('');
      const origin = entry?.importInfo?.sourceVersion || entry?.origin || '尚未建立草稿';
      return `<div class="governance-header-main">
        <div class="governance-current">
          <label for="governanceCandidateSelect">当前流程${candidates.length > 1 ? `（${candidates.length}个候选）` : ''}</label>
          ${data
            ? `<select id="governanceCandidateSelect" data-governance-candidate>${candidateOptions}</select>`
            : '<strong>尚未新建或导入流程</strong>'}
          <div class="governance-context">
            <span class="context-badge version">当前v7 · 使用中验证</span>
            <span class="context-badge">导入来源：${escapeHtml(origin)}</span>
            ${entry?.dirty ? '<span class="context-badge dirty">有未下载修改</span>' : data ? '<span class="context-badge ready">当前没有未下载修改</span>' : ''}
            <span class="context-badge">${escapeHtml(technicalLabel)}</span>
          </div>
        </div>
        <div class="governance-header-actions">
          <button class="button secondary" data-action="download-current-stage" data-global-action data-requires-document="true" ${busy || !data ? 'disabled' : ''}>下载当前草稿 · ${escapeHtml(stage.label)}</button>
          <button class="button" data-action="open-governance-drawer">完整治理流程</button>
          <details class="header-menu">
            <summary class="button">文件</summary>
            <div class="header-menu-panel">
              <button class="button primary" data-action="start-new-process" data-global-action>新建流程</button>
              <button class="button" data-action="open-import-file" data-global-action>继续已有流程</button>
              <button class="button danger" data-action="clear-current-page" data-global-action data-requires-document="true" ${!data ? 'disabled' : ''}>清空当前页面</button>
            </div>
          </details>
          <details class="header-menu">
            <summary class="button">帮助与版本</summary>
            <div class="header-menu-panel">
              <p class="boundary">帮助内容解释页面操作、工具术语和结构边界，不替业务部门确认事实。</p>
              <button class="button" data-action="open-help-view">操作帮助</button>
              <button class="button" data-action="open-version-view">版本说明</button>
            </div>
          </details>
        </div>
      </div>`;
    }

    function renderGovernanceDrawer() {
      const phases = [
        ['工作准备', '部门负责人确认编制人和业务核对人。业务核对人确认制度、表单、台账和实际做法的核对范围。MDM工作组确认3001运行版本和结构版本。'],
        ['选择编制路线', '编制人可以在3001直接新建或导入v1至v7文件；也可以使用MDM-AI助手完成v5填报和预审，再手工导入3001转换为v7。AI路线形成的v5预审记录不能替代最终v7独立结构预审。'],
        ['四轮编制与阶段下载', '第一轮处理流程边界和骨架；第二轮处理逐动作说明、完成标准和异常路径；第三轮处理数据对象、表单和字段；第四轮核对跨部门事实和待定事项。每轮下载阶段草稿，但不锁定后续步骤。'],
        ['部门事实初核', '业务核对人核对全部流程事实。跨部门内容由归口部门和承接部门分别确认本方事实。未确认内容保持待定，并在JSON之外记录证据、确认主体和关闭条件。'],
        ['最终v7独立结构预审', 'MDM工作组或Codex检查最终v7的结构错误、字段归位、对象拆分和生命周期结构。编制人关闭硬性结构错误；保留建议原值时，在外部问题处理记录中说明理由。'],
        ['重新导入、最终下载和交接', '编制人重新导入整改后的文件，核对版本、数量、内容、稳定引用和往返完整性，再分别交接最终v7、结构预审问题处理记录和部门业务核对记录。'],
        ['当前停止边界', '3000当前只承接v1至v3。v7不得直接导入3000，也不得自动降级。MDM工作组完成兼容或迁移方案、验证和审核后，才能另行进入3000受控预览、审核导入和发布。']
      ];
      governanceDrawerContent.innerHTML = `${renderRoleOperationSequence(true)}<div class="governance-drawer-list">${phases.map((phase, index) => `
        <section class="governance-drawer-card"><strong>${index + 1}. ${escapeHtml(phase[0])}</strong><p>${escapeHtml(phase[1])}</p></section>
      `).join('')}</div>`;
    }

    function renderRoleOperationSequence(compact = false) {
      const roleSequence = globalThis.GovernanceWorkflow?.ROLE_SEQUENCE || [];
      return `<section class="role-sequence${compact ? ' compact' : ''}" aria-label="业务角色操作顺序">
        <div class="role-sequence-head">
          <strong>业务角色操作顺序</strong>
          <p>必须按下列顺序交接。3001只提供编制和检查工具，业务核对记录与审核结论不写入JSON。</p>
        </div>
        <ol class="role-sequence-list">${roleSequence.map(item => `
          <li class="role-sequence-item">
            <div class="role-sequence-role"><span class="role-sequence-order">${item.order}</span><strong>${escapeHtml(item.role)}</strong></div>
            <p>${escapeHtml(item.action)}</p>
            <p class="role-sequence-handoff"><strong>交接结果：</strong>${escapeHtml(item.handoff)}</p>
          </li>
        `).join('')}</ol>
      </section>`;
    }

    function isAuthoringGovernanceStep(stepId) {
      return ['start', 'boundary', 'skeleton', 'action', 'data'].includes(stepId);
    }

    function renderPrimaryGuidanceContent(stepId, context = governanceContext()) {
      const action = globalThis.GovernanceWorkflow.primaryActionForStep(stepId, context);
      const checked = context.checkedSteps.includes(stepId);
      const checkAction = isAuthoringGovernanceStep(stepId)
        ? `<button class="button small${checked ? '' : ' secondary'}" data-action="check-governance-step" data-step="${escapeAttribute(stepId)}" ${context.hasDocument ? '' : 'disabled'}>${checked ? '重新检查本轮' : '检查本轮'}</button>`
        : '';
      return `<strong>当前建议操作</strong><br>${escapeHtml(action)}${checkAction ? `<div class="step-check-action">${checkAction}<small>完成当前输入后主动检查；修改草稿后需要重新检查。</small></div>` : ''}`;
    }

    function refreshVisibleGovernanceCheckUi() {
      if (!isAuthoringGovernanceStep(activeGovernanceStep)) return;
      workspace.querySelectorAll('.step-issue-panel, .step-check-clear').forEach(item => item.remove());
      const guidance = workspace.querySelector('.primary-guidance');
      if (guidance) guidance.innerHTML = renderPrimaryGuidanceContent(activeGovernanceStep);
    }

    function renderStepIntro(stepId = activeGovernanceStep) {
      const step = globalThis.GovernanceWorkflow.stepById(stepId);
      const context = governanceContext();
      return `<div class="step-intro">
        <div><div class="eyebrow">第${step.number}步</div><h2>${escapeHtml(step.label)}</h2><p>${escapeHtml(step.responsibility)}</p></div>
        <div class="primary-guidance">${renderPrimaryGuidanceContent(stepId, context)}</div>
      </div>${renderGovernanceIssuePanel(stepId)}`;
    }

    function renderGovernanceIssuePanel(stepId) {
      const context = governanceContext();
      if (!globalThis.GovernanceWorkflow.issuesVisibleForStep(stepId, context)) return '';
      const issues = governanceIssuesForStep(stepId);
      const vocabulary = globalThis.GovernanceWorkflow.issueVocabularyForStep(stepId);
      if (!issues.length) return `<div class="step-check-clear"><strong>${escapeHtml(vocabulary.plural)}：0项</strong><span>当前页面检查未发现这一类事项；业务事实仍由相应角色核对。</span></div>`;
      return `<details class="step-issue-panel" open>
        <summary>${escapeHtml(vocabulary.plural)}（${issues.length}项）</summary>
        <p class="step-issue-copy">以下事项来自当前页面检查。点击任一事项会返回对应编辑位置；页面提示不替代业务人员确认事实。</p>
        <ol class="step-issue-list">${issues.map(item => {
          const attributes = exportWarningLocationAttributes(item);
          const content = attributes
            ? `<button class="diagram-warning-button export-warning-button" data-action="focus-export-warning" ${attributes}>${renderWarningCopy(item)}</button>`
            : `<span>${renderWarningCopy(item)}</span>`;
          return `<li>${content}</li>`;
        }).join('')}</ol>
      </details>`;
    }

    function renderStepViewSwitch(items) {
      return `<div class="step-view-switch" role="tablist">${items.map(item => `
        <button class="button small step-view-button${activeStepView === item.value ? ' active' : ''}" data-action="switch-step-view" data-view="${escapeAttribute(item.value)}">${escapeHtml(item.label)}</button>
      `).join('')}</div>`;
    }

    function renderStartStep() {
      const data = currentDocument();
      if (activeStepView === 'version') return `${renderStepIntro('start')}${renderVersionHistoryPanel()}`;
      if (activeStepView === 'help') {
        const helpSteps = TOOL_HELP_STEPS.map(item => `
          <article class="tool-help-step-card">
            <h3>${escapeHtml(item.title)}</h3>
            <p><strong>怎么做：</strong>${escapeHtml(item.action)}</p>
            <p><strong>完成标志：</strong>${escapeHtml(item.completion)}</p>
          </article>`).join('');
        const termGroups = TOOL_TERM_GROUPS.map(group => `
          <details class="tool-term-group" open>
            <summary>${escapeHtml(group.title)}（${group.terms.length}项）</summary>
            <dl class="tool-term-list">${group.terms.map(([term, definition]) => `
              <div class="tool-term-row">
                <dt>${escapeHtml(term)}</dt>
                <dd>${escapeHtml(definition)}</dd>
              </div>`).join('')}</dl>
          </details>`).join('');
        return `${renderStepIntro('start')}<div class="tool-help-page">
          ${section(
            '使用前必读',
            '本帮助只解释3001页面操作、字段含义和结构边界，不替代业务部门确认流程事实，也不形成审核或批准结论。',
            `${renderRoleOperationSequence()}<div class="tool-help-grid">
              <article class="tool-help-card"><h3>使用人和责任</h3><p>编制人维护当前流程；业务核对人确认实际流程、表单、数据和跨部门事实；MDM工作组检查结构并组织后续交接。页面检查不能代替任何一方确认。</p></article>
              <article class="tool-help-card"><h3>开始前准备</h3><p>选择一条真实流程，准备可以核对的制度、表单、台账和实际做法，并明确编制人和不同人员担任的业务核对人。教学样例不能作为业务事实。</p></article>
              <article class="tool-help-card"><h3>保存和恢复</h3><p>3001不自动保存。每轮完成后由用户主动下载；关闭或刷新后，只能重新导入已下载文件继续编制。源文件不会被修改。</p></article>
              <article class="tool-help-card"><h3>当前停止边界</h3><p>3001输出始终是未审核的单流程v7文件。v7暂不能直接导入3000，也不得自动降级。</p></article>
            </div>`
          )}
          ${section(
            '按七步完成编制',
            '每项事实只有一个可写入口。跨部门核对和评审与交接只读汇总，修改按钮会返回对应编辑位置。',
            `<div class="tool-help-step-grid">${helpSteps}</div>`
          )}
          ${section(
            '常用操作与异常处理',
            '执行删除、清空、重新导入和下载前，先核对当前候选和未下载状态。',
            `<div class="tool-help-grid">
              <article class="tool-help-card"><h3>新建、导入和清空</h3><p>统一从顶部“文件”入口执行。导入失败或取消时，当前候选、选择、未下载修改和撤销记录保持不变。</p></article>
              <article class="tool-help-card"><h3>新增、删除和归并</h3><p>先进入唯一编辑步骤并选中对象。删除不级联；对象仍被关系、字段或迁移归档引用时，页面会阻止删除。成功删除或归并后，可在当前候选的撤销记录中恢复。</p></article>
              <article class="tool-help-card"><h3>下载和继续编制</h3><p>阶段下载和最终下载都会执行技术检查。下载后继续修改不会被锁定；下次只能重新导入已下载文件恢复业务内容。</p></article>
              <article class="tool-help-card"><h3>结构错误和业务提示</h3><p>结构错误必须修正后才能下载。业务提示可以保持待定并下载，但编制人和业务核对人仍须在交接前逐项处理或记录确认责任。</p></article>
              <article class="tool-help-card"><h3>没有数据、表单或跨部门位置</h3><p>确实不适用时保持为空，不为满足检查虚构内容。页面没有识别到跨部门位置，只表示现有字段没有形成固定跨部门行为，不代表业务实际不涉及跨部门。</p></article>
              <article class="tool-help-card"><h3>交接时核对</h3><p>交出人与接收人核对文件名、阶段、结构版本和SHA-256。最终v7、结构预审问题处理记录和业务核对记录分别保存，不嵌入同一JSON。</p></article>
            </div>`
          )}
          ${section(
            '本工具术语',
            '以下定义只说明这些词在3001编制工具中的含义。名称相同、页面提示或技术校验通过，都不能自动形成业务事实或治理结论。',
            `<div class="tool-term-groups">${termGroups}</div>`
          )}
        </div>`;
      }
      const flowCards = GOVERNANCE_STEPS.map(step => `
        <div class="governance-flow-card"><strong>${step.number}. ${escapeHtml(step.label)}</strong><p>${escapeHtml(step.responsibility)}</p></div>
      `).join('');
      if (!data) {
        return `<section class="start-hero">
          <div class="eyebrow">3001 · process-governance-v7</div>
          <h2>按七步完成一条流程的编制、核对和交接准备</h2>
          <p>v7已发布，当前在实际使用中继续验证。编制人维护当前唯一流程文件；业务核对人确认流程事实；MDM工作组检查结构。3001不保存草稿，也不记录审核结论。</p>
          ${renderRoleOperationSequence()}
          <div class="start-actions">
            <button class="button primary" data-action="start-new-process" data-global-action>新建流程</button>
            <button class="button secondary" data-action="open-import-file" data-global-action>继续已有流程</button>
            <button class="button" data-action="open-governance-drawer">查看完整治理流程</button>
          </div>
          <div class="governance-flow-grid">${flowCards}</div>
          <p class="boundary"><strong>当前停止边界：</strong>3001输出的v7文件暂不能直接导入3000，也不得自动降级；3000必须另行完成兼容、迁移审核和验证。</p>
        </section>`;
      }
      const entry = currentEntry();
      const importInfo = entry?.importInfo;
      return `${renderStepIntro('start')}${section(
        '当前文件基本信息',
        '源文件名、来源版本、源文件SHA-256和候选数量只在当前页面显示，不写入下载的v7内容。',
        `<div class="grid">
          <div class="inline-note"><strong>源文件：</strong>${escapeHtml(importInfo?.fileName || (entry?.origin === 'new' ? '空白模板新建' : '本次页面来源未记录'))}</div>
          <div class="inline-note"><strong>来源版本：</strong>${escapeHtml(importInfo?.sourceVersion || entry?.origin || '未知')}</div>
          <div class="inline-note"><strong>源文件SHA-256：</strong><code>${escapeHtml(importInfo?.sha256 || '空白新建不适用')}</code></div>
          <div class="inline-note"><strong>候选数量：</strong>${candidates.length}</div>
        </div>
        <div class="item-actions"><button class="button primary" data-action="switch-governance-step" data-step="boundary">进入流程边界</button></div>`
      )}`;
    }

    function renderBoundaryStep() {
      const hasTerms = Boolean(currentDocument()?.terms?.length);
      return `${renderStepIntro('boundary')}${renderBasic()}${renderProfile()}
        <details class="section" ${hasTerms ? 'open' : ''}>
          <summary style="padding:16px"><strong>术语定义（按需填写${hasTerms ? `，已有${currentDocument().terms.length}项` : ''}）</strong></summary>
          <div class="section-body">${renderTerms()}</div>
        </details>`;
    }

    function renderSkeletonListPanel() {
      const data = currentDocument();
      const selected = graphSelection?.kind;
      const behaviorRows = (data.behaviors || []).map((item, index) => `
        <button class="button skeleton-list-button${selected === 'behavior' && graphSelection.ref === item.behavior_ref ? ' primary' : ''}" data-action="select-skeleton-item" data-kind="behavior" data-ref="${escapeAttribute(item.behavior_ref)}">
          节点${index + 1}：${escapeHtml(item.behavior_name || '未填写名称')} · ${escapeHtml(NODE_TYPES.find(option => option.value === item.node_type)?.label || '未选择类型')}
        </button>`).join('') || '<div class="candidate-empty">尚未新增节点。</div>';
      const relationRows = (data.flow_relations || []).map((item, index) => `
        <button class="button skeleton-list-button${selected === 'relation' && graphSelection.ref === item.relation_ref ? ' primary' : ''}" data-action="select-skeleton-item" data-kind="relation" data-ref="${escapeAttribute(item.relation_ref)}">
          关系${index + 1}：${escapeHtml(relationSelectorLabel(item, index))}
        </button>`).join('') || '<div class="candidate-empty">尚未建立流程关系。</div>';
      return `<section class="section"><div class="section-body">
        <div class="diagram-toolbar"><div><h2>流程骨架清单</h2><p>清单和泳道图互斥显示，二者共同维护同一份页面内存草稿。</p></div><div class="diagram-controls"><button class="button primary small" data-action="add-graph-node">新增节点</button><button class="button secondary small" data-action="start-flow-relation">建立关系</button></div></div>
        <div class="skeleton-list-layout"><div class="skeleton-list"><strong>节点</strong>${behaviorRows}<strong>关系</strong>${relationRows}</div><aside class="graph-property-shell">${renderFlowPropertyPanel()}</aside></div>
      </div></section>`;
    }

    function renderSkeletonStep() {
      if (!['diagram', 'list'].includes(activeStepView)) activeStepView = 'diagram';
      activeWorkspaceTab = 'flow';
      const model = currentDiagramModel();
      return `${renderStepIntro('skeleton')}${renderStepViewSwitch([
        { value: 'diagram', label: '泳道图' },
        { value: 'list', label: '清单' }
      ])}${activeStepView === 'list' ? renderSkeletonListPanel() : renderDiagramPanel(model)}`;
    }

    function renderActionStep() {
      if (!['behaviors', 'relations'].includes(activeStepView)) activeStepView = 'behaviors';
      activeWorkspaceTab = 'editor';
      activeEditorSection = 'process';
      activeProcessSection = activeStepView;
      return `${renderStepIntro('action')}${renderStepViewSwitch([
        { value: 'behaviors', label: '逐动作与完成标准' },
        { value: 'relations', label: '判断、退回与并行条件' }
      ])}${activeStepView === 'relations' ? renderRelations() : renderBehaviors()}`;
    }

    function renderDataStartChoice() {
      return section(
        '选择真实起点',
        '有的流程先识别业务输出，有的部门先拿现有表单录入字段。这个选择只控制当前页面展开内容，不写入JSON，也不限制之后切换。',
        `<div class="next-stage-grid">
          <section class="next-stage-card next"><h3>从业务输出开始</h3><p>先登记流程产生、更新或使用的数据对象，再建立数据与业务行为关系。</p><button class="button primary" data-action="choose-data-start">登记数据对象</button></section>
          <section class="next-stage-card future"><h3>从现有表单开始</h3><p>先建立表单涉及的数据对象和对象字段，再按整张纸质表单登记主表、每张明细表并引用对象字段。</p><button class="button secondary" data-action="choose-form-start">建立数据对象与表单</button></section>
        </div>`
      );
    }

    function renderDataStep() {
      const data = currentDocument();
      if (!['choice', 'data', 'forms', 'relationships', 'bulk'].includes(activeStepView)) {
        activeStepView = data.data_objects?.length ? 'data' : data.forms?.length ? 'forms' : 'choice';
      }
      const views = [
        { value: 'data', label: '数据对象与行为关系' },
        { value: 'forms', label: '表单、明细和字段' },
        { value: 'relationships', label: '数据与表单关系总览' },
        { value: 'bulk', label: 'Excel / WPS批量编辑' }
      ];
      let content;
      if (activeStepView === 'choice' && !(data.data_objects?.length || data.forms?.length)) {
        content = renderDataStartChoice();
      } else if (activeStepView === 'forms') {
        activeWorkspaceTab = 'editor';
        activeEditorSection = 'forms';
        content = renderForms();
      } else if (activeStepView === 'relationships') {
        activeWorkspaceTab = 'editor';
        activeEditorSection = 'process';
        activeProcessSection = 'relationships';
        content = renderRelationshipOverview();
      } else if (activeStepView === 'bulk') {
        activeWorkspaceTab = 'editor';
        content = renderBulkDataEditor();
      } else {
        activeWorkspaceTab = 'data';
        content = `${renderDataModeSwitch()}${activeDataMode === 'lifecycle' ? renderLifecyclePanel() : renderDataDiagramPanel()}`;
      }
      return `${renderStepIntro('data')}${activeStepView === 'choice' ? '' : renderStepViewSwitch(views)}${content}`;
    }

    function renderCrossDepartmentStep() {
      const data = currentDocument();
      const owningDepartment = text(data.process?.owning_department).trim();
      const crossDepartment = (data.behaviors || []).filter(item => externalActorDepartment(item.current_actor_role));
      const cards = crossDepartment.map(item => {
        const actor = parseActorRole(item.current_actor_role);
        const relations = (data.flow_relations || []).filter(relation => relation.from_behavior_ref === item.behavior_ref || relation.to_behavior_ref === item.behavior_ref);
        const dataLinks = (data.data_objects || []).flatMap(dataObject => dataObject.behavior_links.filter(link => link.behavior_ref === item.behavior_ref));
        return `<article class="cross-department-card">
          <h3>${escapeHtml(item.behavior_name || '未命名跨部门行为')}</h3>
          <p><strong>归口部门：</strong>${escapeHtml(owningDepartment || '待填写')}；<strong>执行部门和岗位：</strong>${escapeHtml(actor.department || '待确认')} / ${escapeHtml(actor.position || '待确认')}</p>
          <p><strong>当前结构：</strong>${relations.length}条相连流程关系，${dataLinks.length}条数据操作记录。两部门仍须分别确认本方事实。</p>
          <div class="item-actions">
            <button class="button small" data-action="governance-jump" data-step="skeleton" data-view="diagram" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(item.behavior_ref)}">核对节点和流程位置</button>
            <button class="button small" data-action="governance-jump" data-step="action" data-view="behaviors" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(item.behavior_ref)}" data-focus-path="behaviors.${data.behaviors.indexOf(item)}.behavior_description">核对动作和完成标准</button>
            <button class="button small" data-action="governance-jump" data-step="data" data-view="data" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(item.behavior_ref)}">核对数据关系</button>
          </div>
        </article>`;
      }).join('');
      const content = cards || `<div class="inline-warning"><strong>页面尚未识别到跨部门行为。</strong>这不表示当前流程不涉及跨部门事项。归口部门仍须核对执行部门、流程关系、数据传递和返回条件；发现跨部门事实后，请回到流程骨架、动作与异常或数据与表单的唯一编辑位置补充。</div>`;
      return `${renderStepIntro('cross-department')}${section(
        '跨部门事实核对汇总',
        '本步骤只汇总和定位，不直接编辑。归口部门确认发出事项和期望，承接部门确认本方动作、数据和返回条件。',
        `<div class="cross-department-list">${content}</div><div class="item-actions"><button class="button secondary" data-action="download-current-stage">下载第4轮跨部门核对草稿</button></div>`
      )}`;
    }

    function renderLastDownloadResult() {
      const result = currentEntry()?.lastDownload;
      if (!result) return '<div class="inline-note">本次页面尚未完成下载。下载后，这里会显示文件名、时间、阶段、结构版本和SHA-256摘要。</div>';
      const digest = result.sha256 || '摘要未生成，交接前需使用外部工具补算';
      return `<div class="download-result">
        <strong>最近一次下载</strong>
        <span>文件名：${escapeHtml(result.fileName)}</span>
        <span>导出时间：${escapeHtml(result.exportedAt)}</span>
        <span>阶段：${escapeHtml(result.stage.label)}</span>
        <span>结构版本：${escapeHtml(EXPECTED_EXPORT_SCHEMA_VERSION)}</span>
        <span>SHA-256：<code>${escapeHtml(digest)}</code></span>
        <div class="handoff-actions"><button class="button small" data-action="copy-handoff-summary">复制交接摘要</button></div>
      </div>`;
    }

    function renderHandoffStep() {
      activeWorkspaceTab = 'editor';
      activeEditorSection = 'export';
      return `${renderStepIntro('handoff')}${renderExportCheck()}${section(
        '最终交接卡',
        '最终v7、结构预审问题处理记录和部门业务核对记录必须分别保存。页面只生成并摘要当前v7文件。',
        `<div class="next-stage-grid">
          <section class="next-stage-card next"><h3>技术状态</h3><p>结构错误必须关闭。业务待定不阻止下载，但应在外部核对记录中写明证据、确认主体和关闭条件。</p></section>
          <section class="next-stage-card future"><h3>外部材料</h3><p>准备结构预审问题处理记录和部门业务核对记录。3001不会生成、保存或嵌入这些记录。</p></section>
        </div>
        <p class="boundary"><strong>3000停止边界：</strong>3000当前只承接v1至v3。v6不得直接导入3000，也不得自动降级。</p>
        ${renderLastDownloadResult()}`
      )}`;
    }

    function renderCurrentGovernanceStep() {
      if (!currentDocument() && activeGovernanceStep !== 'start') activeGovernanceStep = 'start';
      return {
        start: renderStartStep,
        boundary: renderBoundaryStep,
        skeleton: renderSkeletonStep,
        action: renderActionStep,
        data: renderDataStep,
        'cross-department': renderCrossDepartmentStep,
        handoff: renderHandoffStep
      }[activeGovernanceStep]?.() || renderStartStep();
    }

    function defaultStepView(stepId, data = currentDocument()) {
      if (stepId === 'start') return 'overview';
      if (stepId === 'boundary') return 'basic';
      if (stepId === 'skeleton') return 'diagram';
      if (stepId === 'action') return 'behaviors';
      if (stepId === 'data') return data?.data_objects?.length ? 'data' : data?.forms?.length ? 'forms' : 'choice';
      if (stepId === 'cross-department') return 'summary';
      return 'review';
    }

    function setActiveGovernanceStep(stepId, view = '') {
      captureGraphViewport();
      const next = globalThis.GovernanceWorkflow.normalizeStepId(stepId);
      if (!currentDocument() && next !== 'start') return;
      activeGovernanceStep = next;
      activeStepView = view || defaultStepView(next);
      const entry = currentEntry();
      if (entry) {
        entry.governanceStep = activeGovernanceStep;
        entry.stepView = activeStepView;
        graphStateManager.updateView(candidateStateKey(entry), { mode: next === 'data' ? 'data' : 'flow' });
      }
      if (next !== 'skeleton') diagramExpanded = false;
      render();
    }

    function migrationSummary(data = currentDocument()) {
      if (!data) return null;
      let fieldCount = 0;
      let unresolved = 0;
      (data.data_objects || []).forEach(item => {
        if (item.information_type === 'pending_confirmation') unresolved += 1;
        unresolved += (item.behavior_links || []).filter(link => link.operation === 'pending_confirmation').length;
        unresolved += (item.source_relations || []).filter(source => source.availability_mode === 'pending_confirmation').length;
      });
      (data.forms || []).forEach(form => {
        unresolved += (form.behavior_links || []).filter(link => !(link.operations || []).length).length;
        (form.areas || []).forEach(area => (area.items || []).forEach(item => {
          fieldCount += 1;
          if (item.business_data_ref && !item.data_field_ref) unresolved += 1;
          if (item.data_field_ref && item.value_usage_mode === 'pending_confirmation') unresolved += 1;
          if (item.value_origin_mode === 'pending_confirmation') unresolved += 1;
          if (item.value_origin_mode === 'depends_on_data' && item.value_usage_mode !== 'reuse_existing' && !(item.source_links || []).length) unresolved += 1;
        }));
      });
      unresolved += (data.migration?.unresolved_actor_roles || []).length;
      unresolved += (data.migration?.unresolved_join_modes || []).length;
      unresolved += (data.migration?.legacy_cross_department_records || []).filter(item => item.conversion_status === 'needs_manual_completion').length;
      const archived = ['legacy_cross_department_records', 'reference_materials', 'internal_process_calls', 'work_roles']
        .reduce((sum, key) => sum + (data.migration?.[key] || []).length, 0);
      return {
        sourceVersion: data.migration?.source_schema_version || currentEntry()?.origin || data.schema_version,
        behaviorCount: (data.behaviors || []).length,
        dataCount: (data.data_objects || []).length,
        formCount: (data.forms || []).length,
        fieldCount,
        unresolved,
        archived
      };
    }

    function renderVersionHistoryPanel() {
      const historyBody = versionHistoryLoadState === 'ready'
        ? (versionHistory?.versions || []).map(item => `
            <article class="item-card">
              <div class="item-title"><strong>${escapeHtml(item.version)} · ${escapeHtml(item.title)}</strong><span class="technical-note">${escapeHtml(item.status === 'candidate' ? `候选 · ${item.candidate_on || '日期未记录'}` : `已发布 · ${item.released_on}`)}</span></div>
              <p>${escapeHtml(item.summary)}</p>
            </article>`).join('')
        : versionHistoryLoadState === 'unavailable'
          ? '<div class="inline-note">版本说明暂时无法读取。当前页面内容不受影响，请保持页面打开并联系维护人员检查3001服务。</div>'
          : '<div class="inline-note">正在读取版本说明……</div>';
      const summary = migrationSummary();
      const migrationBody = summary ? `
        <div class="item-card">
          <div class="grid">
            <div class="inline-note"><strong>导入来源：</strong>${escapeHtml(summary.sourceVersion)}</div>
            <div class="inline-note"><strong>当前格式：</strong>process-governance-v7</div>
            <div class="inline-note"><strong>已保留内容：</strong>${summary.behaviorCount}个行为、${summary.dataCount}项数据、${summary.formCount}张表单、${summary.fieldCount}个字段</div>
            <div class="inline-note"><strong>待确认关系：</strong>${summary.unresolved}项</div>
          </div>
          <p class="technical-note">迁移只发生在当前页面内存中，用户选择的源文件没有修改。</p>
          <details><summary>迁移归档（${summary.archived}项，默认折叠）</summary><p class="technical-note">归档内容只用于保留历史来源，不参与评分、流程计算或绘图。归档引用仍会保护对应对象，避免误删。</p></details>
        </div>` : '<div class="inline-note">当前没有草稿。导入v1至v6或历史多候选文件后，这里会显示本次迁移摘要。</div>';
      return `
        <div id="versionsPanel" role="tabpanel" aria-labelledby="versionsTab">
          ${section('v1至v7升级历史', '版本说明来自仓库受控文件，只供查阅，不改变当前草稿。', historyBody)}
          ${section('当前文件迁移摘要', '旧文件导入后统一在页面内存中转换为v7，导入源文件始终保持原样。', migrationBody)}
        </div>`;
    }

      return `
        <div class="diagram-legend-shell" aria-label="跨职能流程图图例">
          <div class="diagram-legend-head">
            <div class="diagram-legend-list" role="list">
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol action" aria-hidden="true"></span>
                <span class="diagram-legend-copy"><strong>业务行为</strong><small>部门或岗位完成工作</small></span>
              </div>
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol action" style="border-style:dashed;border-color:#5f6f8a;background:#e9edf4" aria-hidden="true"></span>
                <span class="diagram-legend-copy"><strong>动态责任部门</strong><small>由前序数据在运行时确定</small></span>
              </div>
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol decision" aria-hidden="true"><span>×</span></span>
                <span class="diagram-legend-copy"><strong>判断</strong><small>按条件选择去向</small></span>
              </div>
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol parallel" aria-hidden="true"><span>＋</span></span>
                <span class="diagram-legend-copy"><strong>并行</strong><small>同时开始或汇合</small></span>
              </div>
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol flow" aria-hidden="true"></span>
                <span class="diagram-legend-copy"><strong>流程关系</strong><small>跨泳道时表示部门之间的流程流转</small></span>
              </div>
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol call" aria-hidden="true"></span>
                <span class="diagram-legend-copy"><strong>内部流程调用</strong><small>调用本部门另一流程</small></span>
              </div>
              <div class="diagram-legend-item" role="listitem">
                <span class="legend-symbol pending" aria-hidden="true"></span>
                <span class="diagram-legend-copy"><strong>类型待判断</strong><small>尚未确认节点类型</small></span>
              </div>
            </div>
            <button
              class="button small"
              data-action="toggle-diagram-example"
              aria-expanded="${diagramExampleExpanded}"
              aria-controls="diagramLegendExample"
            >${exampleButtonLabel}</button>
          </div>
          <p class="diagram-reading-tip">先看泳道确认执行部门，再沿流程关系箭头阅读。箭头跨越泳道时，表示两个执行部门之间的流程流转；带条件的前进箭头表示判断分支，标有“回路”的返回箭头表示退回前序步骤。</p>
          <div class="diagram-legend-example" id="diagramLegendExample"${diagramExampleExpanded ? '' : ' hidden'}>
            <p>以下仅为读图示例，不属于当前流程。</p>

              </div>
              <span class="legend-example-arrow" aria-hidden="true"></span>
              <div class="legend-example-step">
                <span class="legend-example-department">发起部门泳道</span>
                <span class="legend-example-node decision"><span>×<br>材料齐全？</span></span>
              </div>
              <span class="legend-example-arrow" aria-hidden="true"></span>
              <div class="legend-example-step">
                <span class="legend-example-department">外部门泳道</span>

            </div>
            ${renderNodeCombinationGuide()}
