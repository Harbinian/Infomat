    function bulkPrepareOptions() {
      return {
        refFactory: newRef,
        technicalIntegrity: globalThis.GraphEditCommands.technicalIntegrity,
        allowedFieldTypes: formItemTypes,
        dataObjectFactory(ref, values) {
          return {
            data_ref: ref,
            data_name: values.data_name,
            description: values.description,
            information_type: values.information_type,
            fields: [],
            behavior_links: [],
            source_relations: [],
            lifecycle: pendingLifecycle()
          };
        },
        deleteDataObject(documentDraft, ref) {
          return globalThis.GraphEditCommands.applyCommand(documentDraft, { type: 'delete_object', kind: 'data', ref });
        }
      };
    }

    async function previewBulkData() {
      const data = currentDocument();
      if (!data) return false;
      const documentKey = globalThis.GraphEditorState.fingerprint(data);
      setBusy(true, `正在检查${bulkKindLabel(bulkDataEditorState.kind)}批量数据……`);
      try {
        const preview = globalThis.BulkDataEditor.prepare(
          bulkDataEditorState.kind,
          bulkDataEditorState.text,
          data,
          bulkPrepareOptions()
        );
        if (preview.ok) {
          const validation = await validateGraphDocument(preview.document);
          if (!validation.valid) {
            preview.ok = false;
            (validation.errors || []).forEach(item => preview.errors.push({
              row: 0,
              column: '',
              code: item.keyword || 'SCHEMA_VALIDATION',
              message: `${validationErrorLocation(item)}：${item.message}`
            }));
            preview.document = clone(data);
          }
        }
        bulkDataEditorState.preview = preview;
        bulkDataEditorState.documentKey = documentKey;
        render();
        if (preview.ok) {
          const changes = preview.summary.added + preview.summary.updated + preview.summary.deleted;
          showStatus(changes ? `批量预览已通过，共${changes}项变化。请核对差异后一次应用。` : '批量预览已通过，当前内容没有变化。', 'success');
        } else {
          showStatus(`批量预览未通过，共${preview.errors.length}项错误。当前流程保持不变。`, 'error');
        }
        return preview.ok;
      } catch (error) {
        bulkDataEditorState.preview = null;
        bulkDataEditorState.documentKey = '';
        render();
        showStatus(`批量预览失败：${error.message}。当前流程保持不变。`, 'error');
        return false;
      } finally {
        setBusy(false);
      }
    }

    function applyBulkData() {
      const entry = currentEntry();
      const preview = bulkDataEditorState.preview;
      if (!entry || !preview?.ok) return false;
      const currentKey = globalThis.GraphEditorState.fingerprint(entry.data);
      if (currentKey !== bulkDataEditorState.documentKey) {
        invalidateBulkPreview();
        render();
        showStatus('批量预览后当前流程已发生修改。请重新预览，当前流程未应用这批数据。', 'error');
        return false;
      }
      const changeCount = preview.summary.added + preview.summary.updated + preview.summary.deleted;
      if (!changeCount) {
        showStatus('当前批量内容没有变化，无需应用。', 'success');
        return false;
      }
      const result = graphStateManager.execute(candidateStateKey(entry), entry.data, () => ({
        ok: true,
        document: clone(preview.document),
        details: { bulkKind: bulkDataEditorState.kind, changeCount }
      }));
      if (!result.ok) {
        showStatus(result.message || '批量数据未应用，当前流程保持不变。', 'error');
        return false;
      }
      entry.data = result.document;
      graphSelection = null;
      if (!(entry.data.data_objects || []).some(item => item.data_ref === activeDataRef)) {
        activeDataRef = entry.data.data_objects?.[0]?.data_ref || '';
      }
      invalidateCurrentChecks(entry);
      invalidateBulkPreview();
      refreshCandidateDirty(entry);
      render();
      showStatus(`已一次应用${changeCount}项${bulkKindLabel(bulkDataEditorState.kind)}变化。可在数据关系图中点击一次“撤销”恢复整批内容。`, 'success');
      return true;
    }

    async function copyBulkText(value, successMessage, options = {}) {
      const content = text(value);
      if (options.loadIntoEditor) {
        bulkDataEditorState.text = content;
        invalidateBulkPreview();
      }
      try {
        if (!navigator.clipboard?.writeText) throw new Error('当前浏览器未开放剪贴板写入');
        await navigator.clipboard.writeText(content);
        if (options.loadIntoEditor) render();
        showStatus(successMessage, 'success');
        return true;
      } catch (_error) {
        bulkDataEditorState.text = content;
        invalidateBulkPreview();
        render();
        const input = document.getElementById('bulkDataInput');
        input?.focus();
        input?.select();
        showStatus('浏览器未允许自动复制。内容已放入粘贴区并全选，请按Ctrl+C复制。', 'error');
        return false;
      }
    }

    function formBehaviorLinksEditor(form, formIndex) {
      const rows = (form.behavior_links || []).map((link, linkIndex) => {
        const operationsPath = `forms.${formIndex}.behavior_links.${linkIndex}.operations`;
        return `
          <div class="item-card" data-focus-path="forms.${formIndex}.behavior_links.${linkIndex}">

              ${field(`forms.${formIndex}.behavior_links.${linkIndex}.behavior_ref`, '业务行为', {
                type: 'select', options: behaviorOptions()
              })}

                <span class="field-label">如何处理这张表单</span>
                <div class="check-list">${FORM_OPERATIONS.map(option => `
                  <label><input type="checkbox" data-list-bind="${escapeAttribute(operationsPath)}" value="${option.value}"${(link.operations || []).includes(option.value) ? ' checked' : ''}> ${option.label}</label>
                `).join('')}</div>
              </div>
              ${field(`forms.${formIndex}.behavior_links.${linkIndex}.notes`, '业务说明（可选）', { type: 'textarea', className: 'wide' })}

          ${rows || emptyList('尚未登记表单与业务行为的关系。')}
          <button class="button small" data-action="add-form-behavior-link" data-form-index="${formIndex}">添加表单处理关系</button>

    function formFieldSourceSummary(item) {
      const links = Array.isArray(item.source_links) ? item.source_links : [];
      if (!links.length) return '未登记来源';
      return links.map(link => {
        const role = FIELD_SOURCE_ROLES.find(option => option.value === link.source_role)?.label || '作用待确认';
        if (link.source_type === 'external_system') {
          const systemName = text(link.source_system_name).trim() || '系统待填写';
          const dataName = text(link.source_data_name).trim() || '数据待填写';
          return `外部系统：${systemName} / ${dataName}（${role}）`;
        }
        const dataObject = currentDocument().data_objects.find(data => data.data_ref === link.source_data_ref);
        return `${dataObject?.data_name || '数据待选择'}（${role}）`;
      }).join('；');
    }

    function referencedDataField(item) {
      const owner = (currentDocument()?.data_objects || []).find(dataObject => dataObject.data_ref === item.business_data_ref);
      return (owner?.fields || []).find(dataField => dataField.field_ref === item.data_field_ref) || null;
    }

    function dataFieldOptions(item) {
      const owner = (currentDocument()?.data_objects || []).find(dataObject => dataObject.data_ref === item.business_data_ref);
      const values = (owner?.fields || []).map((dataField, index) => ({
        value: dataField.field_ref,
        label: `${index + 1}. ${dataField.field_name || '未命名对象字段'}${dataField.field_type ? `（${dataField.field_type}）` : ''}`
      }));
      return [{ value: '', label: owner ? '请选择对象字段' : '请先选择业务数据归属' }, ...values];
    }

    function formFieldTypeCell(pathKey, item) {
      const dataField = referencedDataField(item);
      if (!dataField) return formItemTypeField(pathKey, item.item_type);
      return `<div class="field"><span class="field-label">数据类型</span><div class="inline-note">${escapeHtml(dataField.field_type || '对象字段类型待补充')}</div><span class="hint">从“${escapeHtml(dataField.field_name || '未命名对象字段')}”继承；请回到数据对象字段明细修改。</span></div>`;
    }

    function formFieldRelationSummary(item) {
      const ownership = currentDocument().data_objects.find(data => data.data_ref === item.business_data_ref)?.data_name || '未选择';
      const dataField = referencedDataField(item)?.field_name || '未选择';
      const usage = FIELD_VALUE_USAGE_MODES.find(option => option.value === item.value_usage_mode)?.label || '待确认';
      const origin = FIELD_ORIGIN_MODES.find(option => option.value === item.value_origin_mode)?.label || '待确认';
      return `业务数据归属：${ownership}；引用对象字段：${dataField}；字段值使用方式：${usage}；取值方式：${origin}；取值来源：${formFieldSourceSummary(item)}`;
    }

    function formFieldRelationStatus(item) {
      const parts = [];
      if (item.business_data_ref) parts.push('已归属');
      if (item.data_field_ref) parts.push('已引用对象字段');
      if (item.value_usage_mode === 'authoritative_input') parts.push('权威录入点');
      if (item.value_usage_mode === 'reuse_existing') parts.push('沿用已有值');
      if (item.value_usage_mode === 'calculated') parts.push('系统计算');
      if (item.value_usage_mode === 'external_source') parts.push('外部取得');
      if (item.value_usage_mode === 'pending_confirmation' || !item.value_usage_mode) parts.push('使用方式待确认');
      if (item.value_origin_mode === 'direct_current_process') parts.push('当前流程取值');
      if (item.value_origin_mode === 'depends_on_data') {
        if (item.value_usage_mode === 'reuse_existing') {
          parts.push('沿用对象字段已有值');
        } else {
          parts.push((item.source_links || []).length ? `${item.source_links.length}项来源` : '来源待登记');
        }
      }
      if (item.value_origin_mode === 'pending_confirmation' || !item.value_origin_mode) parts.push('取值待确认');
      return parts.join(' · ') || '待登记';
    }

    function activeFieldContext(form, formIndex) {
      for (let areaIndex = 0; areaIndex < form.areas.length; areaIndex += 1) {
        const area = form.areas[areaIndex];
        const itemIndex = area.items.findIndex(item => item.item_ref === activeFormItemRef);
        if (itemIndex >= 0) return { form, formIndex, area, areaIndex, item: area.items[itemIndex], itemIndex };
      }
      return null;
    }

    function renderFieldRelationEditor(form, formIndex) {
      const context = activeFieldContext(form, formIndex);
      if (!context) return '';
      const { areaIndex, item, itemIndex } = context;
      const itemPath = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}`;
      const rows = (item.source_links || []).map((link, linkIndex) => {
        const linkPath = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.source_links.${linkIndex}`;
        const sourceType = link.source_type === 'external_system' ? 'external_system' : 'process_data';
        return `
          <div class="item-card">
            <div class="grid">
              ${field(`${linkPath}.source_type`, '来源类型', {
                type: 'select', options: FIELD_SOURCE_TYPES
              })}
              ${sourceType === 'external_system'
                ? `${field(`${linkPath}.source_system_name`, '外部系统名称')}
                   ${field(`${linkPath}.source_data_name`, '来源数据名称')}`
                : field(`${linkPath}.source_data_ref`, '来源数据', {
                    type: 'select', options: dataOptions()
                  })}
              ${field(`${linkPath}.source_role`, '来源作用', {
                type: 'select', options: FIELD_SOURCE_ROLES
              })}
            </div>
            <button class="button danger small" data-action="remove-field-source" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-item-index="${itemIndex}" data-index="${linkIndex}">删除来源</button>
          </div>`;
      }).join('');
      return `
        <aside class="item-card" data-focus-kind="area" data-focus-ref="${escapeAttribute(context.area.area_ref)}">
          <div class="item-title">
            <strong>字段数据关系：${escapeHtml(item.item_name || '未命名字段')}</strong>
            <button class="button secondary small" data-action="close-field-relations">关闭</button>
          </div>
          <div class="inline-note">先选择业务数据归属，再引用该数据对象下的字段。字段值使用方式用于区分本流程权威录入点、后续沿用、系统计算和外部取得；选择“沿用已有值”时，承载表单的业务系统应自动带入并避免重复录入。</div>
          <div class="grid">
            ${field(`${itemPath}.business_data_ref`, '业务数据归属', { type: 'select', options: dataOptions(), nullable: true })}
            ${field(`${itemPath}.data_field_ref`, '引用对象字段', { type: 'select', options: dataFieldOptions(item), nullable: true })}
            ${field(`${itemPath}.value_usage_mode`, '字段值使用方式', { type: 'select', options: FIELD_VALUE_USAGE_MODES })}
            ${field(`${itemPath}.value_origin_mode`, '取值方式', { type: 'select', options: FIELD_ORIGIN_MODES })}
            <div class="field wide" data-focus-key="${escapeAttribute(`${itemPath}.source_links`)}" tabindex="-1">
              <span class="field-label">取值来源</span>
              ${rows || emptyList(item.value_usage_mode === 'reuse_existing'
                ? '沿用当前对象字段已经建立的值，无需在本表单重复登记取值来源。'
                : '尚未登记取值来源。')}
              ${item.value_usage_mode === 'reuse_existing' ? '' : `<button class="button small" data-action="add-field-source" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-item-index="${itemIndex}">添加取值来源</button>`}
            </div>
          </div>
        </aside>`;
    }

    function renderForms() {
      const catalog = renderDataObjectFieldCatalog();
      const active = ensureActiveForm();
      const addButtons = `
        <div class="form-primary-actions">

        return catalog + section(
          '2. 实际表单、主表、明细和字段',
          '完成对象字段明细后，再按一张纸质表单的完整结构录入。只有新增表单后才创建空白编辑对象，3001不会自动生成表单。',
          emptyList('当前流程没有表单或记录。'),

        );

      const formSelector = currentDocument().forms.map((item, index) => `
        <button

          data-action="select-form"
          data-ref="${escapeAttribute(item.form_ref)}"

              </div>
            </td>
            <td data-label="删除"><button class="button danger small" data-action="remove-form-item" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="删除字段${itemIndex + 1}">删除</button></td>
          </tr>`).join('');
        const groupHead = area.area_type === '明细清单' ? `
          <div class="form-field-group-head">
            <div class="form-field-group-title">
              <strong>${escapeHtml(groupLabel)}</strong>

            </div>
            <div class="item-actions">
              <button class="button secondary small" data-action="move-detail-area-up" data-form-index="${formIndex}" data-index="${areaIndex}" ${detailPosition <= 0 ? 'disabled' : ''}>上移明细表</button>
              <button class="button secondary small" data-action="move-detail-area-down" data-form-index="${formIndex}" data-index="${areaIndex}" ${detailPosition === detailAreaIndices.length - 1 ? 'disabled' : ''}>下移明细表</button>
              <button class="button danger small" data-action="remove-detail-area" data-form-index="${formIndex}" data-index="${areaIndex}">删除明细表</button>
            </div>
          </div>` : `<div class="form-field-group-head"><strong>${escapeHtml(groupLabel)}</strong></div>`;
        return `
          <tbody class="form-field-group${groupClass}" data-focus-kind="area" data-focus-ref="${escapeAttribute(area.area_ref)}">
            <tr class="form-field-group-row${groupClass}"><th colspan="8">${groupHead}</th></tr>
            ${rows || `<tr class="form-field-group-empty"><td colspan="8">${escapeHtml(`${groupLabel}中还没有字段。`)}</td></tr>`}
          </tbody>`;
      }).join('');
      const fieldsTable = form.areas.length ? `
        <div class="form-field-table-shell">
          <table class="form-field-table">
            <colgroup>
              <col style="width:54px"><col style="width:230px"><col style="width:135px"><col style="width:160px">
              <col style="width:82px"><col style="width:363px"><col style="width:90px"><col style="width:76px">
            </colgroup>
            <thead><tr><th>序号</th><th>字段名称</th><th>数据类型</th><th>字段归属</th><th>必填</th><th>填写说明</th><th>排序</th><th>删除</th></tr></thead>
            ${groups}
          </table>
        </div>` : emptyList('尚未录入字段。点击“添加字段”后，再明确字段属于主表还是哪张明细表。');

      const body = `
        <div class="form-workbench">
          <aside class="form-sidebar">
            ${formSelector}
          </aside>
          <div class="form-editor">
            <div class="item-card" data-focus-kind="form" data-focus-ref="${escapeAttribute(form.form_ref)}">
              <div class="item-title">
                <strong>整张表单</strong>
                <button class="button danger small" data-action="remove-form" data-index="${formIndex}">删除当前表单或记录</button>
              </div>
              <div class="grid">
                ${field(`forms.${formIndex}.form_design_state`, '表单状态', {
                  type: 'select',
                  options: [
                    { value: 'unspecified', label: '待确认（历史文件兼容）' },
                    { value: 'current_state', label: '现状表单' },
                    { value: 'proposed_design', label: '新建或优化表单' }
                  ],
                  hint: '3001不会根据名称、编号或明细表数量推断。'
                })}
                ${field(`forms.${formIndex}.form_name`, '表单或记录名称')}
                ${field(`forms.${formIndex}.form_no`, '表单或记录编号（如有）', { nullable: true })}
                ${formBehaviorLinksEditor(form, formIndex)}
              </div>
            </div>
            ${fieldsTable}
            <button class="button small" data-action="add-form-item" data-form-index="${formIndex}">添加字段</button>
            ${renderFieldRelationEditor(form, formIndex)}
          </div>
        </div>`;
      return catalog + section(
        '2. 实际表单、主表、明细和字段',
        '按纸质表单原样录入全部字段；有几张明细表就保留几张。表单字段先选择业务数据归属，再引用该对象的字段。',
        body,
        addButtons
      );
    }

    function renderTerms() {
      const active = ensureActiveTerm();
      const item = active.item;
      const index = active.index;
      const selector = currentDocument().terms.length
        ? currentDocument().terms.map((term, termIndex) => orderedSelectorRow(
            'term', term.term_ref, termIndex, currentDocument().terms.length,
            '术语', `${termIndex + 1}. ${term.term_name || '未命名术语'}`, activeTermRef
          )).join('')

    function renderProcessEditor() {
      const content = {
        behaviors: renderBehaviors,
        relations: renderRelations,
        data: renderDataObjects,
        relationships: renderRelationshipOverview
      }[activeProcessSection] || renderBehaviors;
      return `${renderProcessNavigation()}${content()}`;
    }

    function exportWarningLocationAttributes(item) {
      const focusPaths = Array.isArray(item.focusPaths) && item.focusPaths.length
        ? JSON.stringify(item.focusPaths)
        : '';
      return [
        ['data-editor-section', item.editorSection],
        ['data-process-section', item.processSection],
        ['data-focus-kind', item.focusKind],
        ['data-focus-ref', item.focusRef],
        ['data-focus-path', item.focusPath],
        ['data-focus-paths', focusPaths]
      ]
        .filter(([, value]) => text(value))
        .map(([name, value]) => `${name}="${escapeAttribute(value)}"`)
        .join(' ');
    }

    function currentStructureScoreKey() {
      try {
        return `${currentIndex}:${JSON.stringify(currentDocument())}`;
      } catch (_error) {
        return `${currentIndex}:unserializable`;
      }
    }

    function createStructureScoreSnapshot() {
      const snapshot = JSON.parse(JSON.stringify(currentDocument()));
      return snapshot;
    }

    function ensureStructureScoreState() {
      const documentKey = currentStructureScoreKey();
      if (
        structureScoreState.candidateIndex === currentIndex
        && structureScoreState.documentKey === documentKey
        && structureScoreState.status !== 'idle'
      ) {
        return structureScoreState;
      }

      const scoring = globalThis.StructureLearningScore;
      if (!scoring) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '评分模块暂时不可用。当前页面内容不受影响，请联系维护人员检查3001静态资源。'
        };
        return structureScoreState;
      }

      try {
        const snapshot = createStructureScoreSnapshot();
        const contentResult = scoring.evaluateContent(snapshot, { departments: actorDepartments() });
        structureScoreState = {
          status: 'pending',
          candidateIndex: currentIndex,
          documentKey,
          result: scoring.finalize(contentResult, {
            status: 'pending',
            checks: {},
            message: '正在检查技术结构'
          }),
          message: '正在检查技术结构……'
        };
        const runId = ++structureScoreRunId;
        queueMicrotask(() => runStructureScore({
          runId,
          candidateIndex: currentIndex,
          documentKey,
          snapshot,
          contentResult
        }));
      } catch (_error) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '当前页面内容暂时无法生成评分快照。评分不会修改当前流程，请保持页面打开并重新评分。'
        };
      }
      return structureScoreState;
    }

    function warningSuggestions(item) {
      const suggestions = Array.isArray(item?.suggestions)
        ? item.suggestions.map(text).filter(Boolean)
        : [];
      return suggestions.length
        ? suggestions
        : ['点击本项返回对应位置，核对并补充相关内容。'];
    }

    function renderWarningCopy(item) {
      const suggestions = warningSuggestions(item);
      return `<span class="warning-fact"><strong>当前情况：</strong>${escapeHtml(item.message)}</span>
        ${suggestions.map((suggestion, index) => `
          <span class="warning-suggestion"><strong>${suggestions.length > 1 ? `建议${index + 1}` : '建议'}：</strong>${escapeHtml(suggestion)}</span>
        `).join('')}`;
    }

    function renderStructureScoreIssues(items, title, className = 'score-issue-list', open = true) {
      if (!items.length) return '';
      return `<details class="${className}"${open ? ' open' : ''}>
        <summary>${escapeHtml(title)}（${items.length}项）</summary>
        <ol>${items.map(item => {
          const attributes = exportWarningLocationAttributes(item);
          const message = attributes
            ? `<button
                class="diagram-warning-button export-warning-button"
                data-action="focus-export-warning"
                ${attributes}
              >${renderWarningCopy(item)}</button>`
            : `<span>${renderWarningCopy(item)}</span>`;
          return `<li>
            <div class="score-issue-line">
              <span class="score-issue-category">${escapeHtml(item.category)}</span>
              <div>
                ${message}
                ${item.effect ? `<small class="score-issue-effect">${escapeHtml(item.effect)}</small>` : ''}
              </div>
            </div>
          </li>`;
        }).join('')}</ol>
      </details>`;
    }

    function renderStructureScoreStandard() {
      const rule = globalThis.StructureLearningScore?.RULE;
      if (!rule) return '';
      const dimensions = rule.dimensions.map(item => `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td>${item.max}分</td>
          <td>${escapeHtml(item.description)}</td>
        </tr>`).join('');
      const technicalChecks = rule.technicalChecks
        .map(item => `${escapeHtml(item.label)}${item.points}分`)
        .join('、');
      const coefficients = rule.chainCoefficients
        .map(item => `${escapeHtml(item.label)}×${item.coefficient.toFixed(2)}`)
        .join('；');
      const grades = rule.grades
        .map(item => `${item.grade}：${escapeHtml(item.label)}`)
        .join('；');
      return `<details class="score-standard">
        <summary>查看评分标准</summary>
        <div class="score-standard-body">
          <p><strong>结构完整性</strong>为六个维度得分之和。各维度先保留1位小数，再相加得到满分100分的结构完整性。</p>
          <div class="score-table-wrap">
            <table>
              <thead><tr><th>评分维度</th><th>分值</th><th>本期检查内容</th></tr></thead>
              <tbody>${dimensions}</tbody>
            </table>
          </div>
          <p><strong>技术结构：</strong>${technicalChecks}。当前文件发生技术阻断时，展示分最高为59分；校验服务异常时暂停生成最终分数，不把系统故障算作用户扣分。</p>
          <p><strong>展示分：</strong>结构完整性 × 行为链系数。${coefficients}。</p>
          <p><strong>等级：</strong>${grades}。</p>
          <ul>
            <li>有效行为链采用最长的明确非回路关系链。孤立行为不增加长度，回路边不重复计数。</li>
            <li>必填项中的“待填写、待补充、待确认、未知、暂无、无、不适用、N/A”按未完成处理；选填项可以留空或使用占位说明。</li>
            <li>无数据对象时，数据对象子项为0/15；无表单时，表单结构维度为0/10；没有跨部门行为时，跨部门行为完整性按不适用计5/5。不要为提高分数虚构数据、表单、行为或关系。</li>
            <li>判断节点允许一条无条件顺序关系作为默认继续路径。判断分支和回路必须填写条件；承接判断结果的目标节点可以是普通业务行为。</li>
            <li>“具体做什么”、输入说明和办理时限等字段本期不计分。</li>
          </ul>
          <p class="boundary"><strong>评价边界：</strong>本评分只反映当前JSON展示出的结构化学习成果，不代表流程设计正确、部门职责正确或业务事实已经确认，也不是正式PMO评审结论。</p>
        </div>
      </details>`;
    }

    function renderStructureScorePanel(state) {
      const rule = globalThis.StructureLearningScore?.RULE;
      const result = state.result;
      const pending = state.status === 'pending';
      const unavailable = state.status === 'unavailable';
      const scoreText = result?.available ? result.completenessScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const displayText = result?.available ? result.displayScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const gradeText = result?.available ? result.grade : pending ? '待生成' : '—';
      const dimensions = rule?.dimensions?.map(item => {
        const value = result?.dimensions?.[item.key];
        const valueText = value === null || value === undefined
          ? item.key === 'technical' && pending ? '检查中' : '—'
          : `${Number(value).toFixed(1)} / ${item.max}`;
        return `<div class="score-dimension">
          <strong>${escapeHtml(item.label)}</strong>
          <span>${valueText}</span>
          <small>${escapeHtml(item.description)}</small>
        </div>`;
      }).join('') || '';
      const scoredIssues = result?.issues || [];
      const previewIssues = result?.previewIssues || [];
      const blockerHtml = result?.blocker
        ? '<div class="score-blocker"><strong>技术阻断：</strong>当前展示分已按规则限制为最高59分。下载校验仍会阻止损坏的结构或技术引用。</div>'
        : '';
      const unavailableHtml = unavailable
        ? `<div class="score-unavailable"><strong>暂不能生成最终分数：</strong>${escapeHtml(state.message)}
            <button class="button small" data-action="refresh-structure-score">重新评分</button>
          </div>`
        : '';
      const issueHtml = scoredIssues.length
        ? renderStructureScoreIssues(scoredIssues, '计分扣项与整改位置')
        : result?.available
          ? '<div class="notice">当前未发现计分扣项。</div>'
          : '';
      const previewHtml = renderStructureScoreIssues(
        previewIssues,
        '后续集中评审预告（本期不扣分）',
        'score-preview-list',
        false
      );
      return `<div class="score-panel" id="structureScorePanel" aria-live="polite">
        <div class="score-panel-head">
          <div>
            <h3>${escapeHtml(rule?.label || '结构化学习评分 v4（process-governance-v7）')}</h3>
            <p>评分根据当前页面内容自动生成，只用于结构化学习反馈，不写入下载的JSON。</p>
          </div>
          <button class="button small" data-action="refresh-structure-score"${pending ? ' disabled' : ''}>重新评分</button>
        </div>
        <div class="score-summary-grid">
          <div class="score-summary-card primary">
            <span class="score-summary-label">结构完整性</span>
            <span class="score-summary-value">${scoreText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">六项结构维度得分之和</span>
          </div>
          <div class="score-summary-card primary">
            <span class="score-summary-label">展示分</span>
            <span class="score-summary-value">${displayText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">结构完整性 × 行为链系数</span>
          </div>
          <div class="score-summary-card">
            <span class="score-summary-label">等级与行为链</span>
            <span class="score-summary-value score-grade-${escapeAttribute(gradeText)}">${escapeHtml(gradeText)}</span>
            <span class="score-summary-note">有效行为链${result ? result.effectiveChainLength : 0}个行为 × ${(result?.chainCoefficient || 0.8).toFixed(2)}</span>
          </div>
        </div>
        <div class="score-dimension-grid">${dimensions}</div>
        ${blockerHtml}
        ${unavailableHtml}
        ${issueHtml}
        ${previewHtml}
        ${renderStructureScoreStandard()}
      </div>`;
    }

    function renderReviewReadinessIssues(items) {
      if (!items.length) return '';
      return `<ol class="review-issue-list">${items.map(item => {
        const attributes = exportWarningLocationAttributes(item);
        const content = attributes
          ? `<button
              class="diagram-warning-button export-warning-button"
              data-action="focus-export-warning"
              ${attributes}
            >${renderWarningCopy(item)}</button>`
          : `<span>${renderWarningCopy(item)}</span>`;
        return `<li>${content}</li>`;
      }).join('')}</ol>`;
    }

    function reviewRoutingWarnings(data) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring?.loopExitDetails || !scoring?.parallelRouteSafetyDetails) return [];
      const warnings = [];
      const behaviors = Array.isArray(data?.behaviors) ? data.behaviors : [];
      const relations = Array.isArray(data?.flow_relations) ? data.flow_relations : [];
      const behaviorMap = new Map(behaviors.map(item => [text(item.behavior_ref), item]));
      const behaviorLabel = ref => {
        const item = behaviorMap.get(text(ref));
        return text(item?.behavior_name) || text(ref) || '未命名节点';
      };
      const relationTarget = relation => ({
        editorSection: 'process',
        processSection: 'relations',
        focusKind: 'relation',
        focusRef: text(relation?.relation_ref),
        reviewAspect: 'routing'
      });
      const splitTarget = split => {
        const behaviorIndex = behaviors.indexOf(split);
        return {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: text(split?.behavior_ref),
          focusPath: behaviorIndex >= 0 ? `behaviors.${behaviorIndex}.node_type` : '',
          reviewAspect: 'routing'
        };
      };
      const addWarning = (message, target, suggestions) => warnings.push({
        message,
        suggestions,
        ...target
      });

      scoring.loopExitDetails(data).loops.forEach(detail => {
        const relationIndex = relations.indexOf(detail.relation);
        const relationLabel = relationIndex >= 0 ? `流程关系${relationIndex + 1}` : '当前回路关系';
        const sourceLabel = behaviorLabel(detail.sourceRef);
        const targetLabel = behaviorLabel(detail.targetRef);
        if (!detail.hasForwardPath) {
          addWarning(
            `${relationLabel}从“${sourceLabel}”返回“${targetLabel}”，但从返回位置沿前进关系不能重新到达“${sourceLabel}”。`,
            relationTarget(detail.relation),
            ['核对回路返回位置，并补充从返回位置重新进入本层检查节点的前进关系。']
          );
          return;
        }
        if (!detail.exitCount) {
          const nestedSuggestion = detail.nestedWithinRefs.length
            ? '内层循环的退出路线可以进入外层循环，但必须先离开本层循环体。'
            : '最外层循环必须增加通向循环外后续行为的退出路线。';
          addWarning(
            `${relationLabel}在“${sourceLabel}”没有通向本层循环外的退出路线。`,
            relationTarget(detail.relation),
            [nestedSuggestion, '为退出路线填写明确条件和目标行为。']
          );
        }
      });

      scoring.parallelRouteSafetyDetails(data).splits.forEach(detail => {
        if (detail.routeCount < 2) return;
        const splitLabel = behaviorLabel(detail.splitRef);
        if (!detail.hasCommonJoin) {
          addWarning(
            `并行开始“${splitLabel}”的${detail.routeCount}条路线没有共同到达同一个并行汇合节点。`,
            splitTarget(detail.split),
            ['需要同时执行全部路线时，使每条路线进入同一个并行汇合节点。', '只有一条结果路线会执行时，将该节点改为判断节点并填写分支条件。']
          );
        }
        detail.terminalRefs.forEach(terminalRef => {
          const terminalLabel = behaviorLabel(terminalRef);
          addWarning(
            `并行开始“${splitLabel}”中的“${terminalLabel}”在共同并行汇合前成为流程结束位置。`,
            splitTarget(detail.split),
            [`需要同时执行全部路线时，为“${terminalLabel}”补充进入共同并行汇合的后续关系。`, '该路线可能中止整个流程时，将并行开始改为判断节点并分别填写结果条件。']
          );
        });
      });
      return warnings;
    }

    function reviewBehaviorExecutabilityWarnings(data) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring?.behaviorExecutabilityDetails) return [];
      return scoring.behaviorExecutabilityDetails(data).issues.map(detail => {
        const target = {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: detail.behaviorRef,
          focusPath: `behaviors.${detail.behaviorIndex}.behavior_description`,
          reviewAspect: 'behaviorExecutability'
        };
        if (detail.reason === 'missing_description') {
          return {
            message: `“${detail.behaviorLabel}”未填写“具体做什么”，无法判断执行人员需要逐步完成哪些动作。`,
            suggestions: ['在“具体做什么”中按实际顺序填写每个动作，并写明各动作处理的对象和产生的结果。'],
            ...target
          };
        }
        if (detail.reason === 'abstract_qualitative_description') {
          return {
            message: `“${detail.behaviorLabel}”的“具体做什么”使用“${detail.matchedPattern}”这类抽象、定性表述，不能看出实际执行动作。`,
            suggestions: ['删除抽象结论，改写为执行人员实际核对、填写、修改、提交、反馈或归档的动作，并写明每个动作的对象。'],
            ...target
          };
        }
        return {
          message: `“${detail.behaviorLabel}”的“具体做什么”未写出可识别的具体业务动作。`,
          suggestions: ['按实际顺序补充具体动词和处理对象，并写明每个动作产生的结果。'],
          ...target
        };
      });
    }

    function renderNodeCombinationGuide() {
      const matrixRows = [
        ['业务行为', '业务行为或判断节点', '顺序关系', '按实际先后执行；条件留空。'],
        ['判断节点', '不同结果行为', '判断分支', '每条结果填写条件；最多保留一条无条件默认顺序关系。'],
        ['循环检查节点', '本层前序行为', '流程内部回路', '填写继续本层循环的条件；同一检查节点另设退出路线。'],
        ['并行开始', '每条路线的首个节点', '并行路线', '至少两条不同目标路线。'],
        ['每条并行路线的末项', '共同并行汇合', '并行路线', '全部路线必须进入同一个汇合；汇合前不得中止流程。'],
        ['并行路线内部', '业务行为、判断、内层循环或内层并行', '按内部结构选择', '内层结构先闭合，再进入外层并行汇合。'],

    function renderReviewReadinessPanel(scoreState, businessIssues) {

        return `<div class="review-readiness-panel">

        </div>`;
      }
      const technicalIssues = (scoreState.result?.issues || []).filter(item => item.category === '技术结构');
      const technical = scoreState.status === 'unavailable'
        ? { status: 'unavailable', blocker: false }
        : scoreState.result?.technical || { status: 'pending', blocker: false };
      const readiness = scoring.evaluateReviewReadiness(currentDocument(), {
        businessIssues,
        technicalIssues,
        technical
      });
      const operationNote = {
        ready: '页面自动检查未发现内容缺项。请按六方面逐项询问归口部门，确认当前JSON与真实做法一致后再下载。',
        prompt: `当前有${readiness.businessIssueCount}项业务内容需要补充或登记为待定。业务提示不阻止下载。`,
        blocker: `当前有${readiness.technicalIssueCount || 1}项结构错误。修复技术结构或损坏引用后才能下载。`,
        checking: '正在核对结构版本、技术引用、下载回读和内容保持；六方面业务提示已经列出。',
        unavailable: '技术检查服务暂不可用。请保持当前页面打开，服务恢复后点击“重新检查六方面”。'
      }[readiness.operationStatus];
      const acceptance = scoring.REVIEW_READINESS.acceptance.map(item => `<li>${escapeHtml(item)}</li>`).join('');
      const aspects = readiness.aspects.map(aspect => {
        const aspectStatusLabel = aspect.status === 'blocker'
          ? `结构错误${aspect.issueCount}项`

            ? `待处理${aspect.issueCount}项`

    function owningDepartmentChangeImpact(data, nextDepartment) {
      const behaviors = Array.isArray(data?.behaviors) ? data.behaviors : [];
      const fixedAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'fixed_department'
        && text(item?.current_actor_role).trim()
      ).length;
      const dynamicAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'dynamic_from_data'
        || item?.actor_department_data_ref
        || text(item?.actor_position_rule).trim()
      ).length;
      const companyWideAssignments = behaviors.filter(item => actorAssignmentMode(item) === 'company_wide').length;
      const formalWorkRoles = Array.isArray(data?.migration?.work_roles) ? data.migration.work_roles.length : 0;
      const classificationFields = [
        data?.process?.capability_domain,
        data?.process?.business_capability,
        data?.process?.classification_status !== 'unclassified' ? data?.process?.classification_status : ''
      ].filter(value => text(value).trim()).length;
      return {
        previousDepartment: text(data?.process?.owning_department).trim(),
        nextDepartment: text(nextDepartment).trim(),
        behaviorCount: behaviors.length,
        fixedAssignments,
        dynamicAssignments,
        companyWideAssignments,
        classificationFields,
        formalWorkRoles,
        internalCallCount: Array.isArray(data?.migration?.internal_process_calls) ? data.migration.internal_process_calls.length : 0
      };

      const next = clone(data);

      next.process.business_capability = null;
      next.process.classification_status = 'unclassified';

        behavior.actor_assignment_mode = 'fixed_department';

        behavior.actor_department_data_ref = null;
        behavior.actor_position_rule = '';
      });

    function removeRelation(index) {
      const relation = currentDocument().flow_relations[index];
      if (!relation) return false;
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), 'relation', relation.relation_ref);
      if (impacts.length) {
        window.alert(`当前流程关系仍被${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}引用，不能删除。`);
        return false;
      }
      currentDocument().flow_relations.splice(index, 1);
      if (activeRelationRef === relation.relation_ref) {
        activeRelationRef = currentDocument().flow_relations[Math.min(index, currentDocument().flow_relations.length - 1)]?.relation_ref || '';
      }
      return true;
    }

    function ensureFormArea(form, areaType) {
      const existing = form.areas.find(area => areaType ? area.area_type === areaType : !area.area_type);
      if (existing) return existing;
      const area = {
        area_ref: newRef('area'),
        area_type: areaType || '',
        area_title: '',
        items: []
      };
      form.areas.push(area);
      return area;
    }

    function findFormItem(form, itemRef) {
      for (let areaIndex = 0; areaIndex < form.areas.length; areaIndex += 1) {
        const itemIndex = form.areas[areaIndex].items.findIndex(item => item.item_ref === itemRef);
        if (itemIndex >= 0) return { areaIndex, itemIndex, item: form.areas[areaIndex].items[itemIndex] };
      }
      return null;
    }

    function moveFormItemToAssignment(formIndex, itemRef, assignment) {
      const form = currentDocument().forms[formIndex];
      if (!form) return false;
      const found = findFormItem(form, itemRef);
      if (!found) return false;
      let targetArea = null;
      if (assignment === 'main') {
        targetArea = ensureFormArea(form, '基本信息');
      } else if (assignment === 'unassigned') {
        targetArea = ensureFormArea(form, '');
      } else if (assignment === '__new_detail__') {
        targetArea = {
          area_ref: newRef('area'),
          area_type: '明细清单',
          area_title: '',
          items: []
        };
        form.areas.push(targetArea);
      } else {
        targetArea = form.areas.find(area => area.area_type === '明细清单' && area.area_ref === assignment);
      }
      if (!targetArea) return false;
      const sourceArea = form.areas[found.areaIndex];
      if (sourceArea.area_ref === targetArea.area_ref) return true;
      const [item] = sourceArea.items.splice(found.itemIndex, 1);
      targetArea.items.push(item);
      if (!sourceArea.area_type && !sourceArea.items.length) {
        form.areas.splice(form.areas.indexOf(sourceArea), 1);
      }
      activeAreaRef = targetArea.area_ref;
      return true;
    }

    function moveFormItem(formIndex, areaIndex, itemIndex, direction) {
      const items = currentDocument().forms[formIndex]?.areas[areaIndex]?.items;
      const targetIndex = itemIndex + direction;
      if (!items || targetIndex < 0 || targetIndex >= items.length) return false;
      [items[itemIndex], items[targetIndex]] = [items[targetIndex], items[itemIndex]];
      return true;
    }

    function moveDetailArea(formIndex, areaIndex, direction) {
      const form = currentDocument().forms[formIndex];
      if (!form?.areas[areaIndex] || form.areas[areaIndex].area_type !== '明细清单') return false;
      const detailIndices = form.areas
        .map((area, index) => area.area_type === '明细清单' ? index : -1)
        .filter(index => index >= 0);
      const position = detailIndices.indexOf(areaIndex);
      const targetAreaIndex = detailIndices[position + direction];
      if (position < 0 || targetAreaIndex == null) return false;
      [form.areas[areaIndex], form.areas[targetAreaIndex]] = [form.areas[targetAreaIndex], form.areas[areaIndex]];
      return true;
    }

    function removeDetailArea(formIndex, areaIndex) {
      const form = currentDocument().forms[formIndex];
      const area = form?.areas[areaIndex];
      if (!area || area.area_type !== '明细清单') return false;
      const fieldCount = area.items.length;
      if (!window.confirm(`当前明细表包含${fieldCount}个字段。删除后，这些字段会一并删除；其他字段不受影响。确定继续吗？`)) return false;
      form.areas.splice(areaIndex, 1);
      if (area.area_ref === activeAreaRef) activeAreaRef = '';
      return true;
    }

    function removeBehavior(index) {

      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), 'behavior', ref);
      if (impacts.length) {
        window.alert(`当前业务行为仍被以下内容引用：${impacts.map(item => `${item.label}（${item.ref}）`).join('、')}。请先逐项移除或替换引用，再删除该行为。`);
        return false;
      }
      currentDocument().behaviors.splice(index, 1);
      if (activeBehaviorRef === ref) {
        activeBehaviorRef = currentDocument().behaviors[Math.min(index, currentDocument().behaviors.length - 1)]?.behavior_ref || '';
      }
      return true;
    }

    function removeData(index) {
      const item = currentDocument().data_objects[index];
      if (!item) return false;
      const ref = item.data_ref;
      const impacts = globalThis.GraphEditCommands.analyzeDeletion(currentDocument(), 'data', ref);
      if (impacts.length) {
        window.alert(`当前数据仍被以下内容引用：${impacts.map(impact => `${impact.label}（${impact.ref}）`).join('、')}。请先逐项移除或替换引用，再删除该数据。`);
        return false;
      }
      currentDocument().data_objects.splice(index, 1);
      if (activeDataRef === ref) {
        activeDataRef = currentDocument().data_objects[Math.min(index, currentDocument().data_objects.length - 1)]?.data_ref || '';
      }
      return true;
    }

    async function mergeDuplicateData(index) {
      const current = currentDocument()?.data_objects?.[index];
      if (current) activeDataRef = current.data_ref;
      return mergeCurrentDataObjects();
    }

    function owningDepartmentChangeNeedsConfirmation(impact) {
      return Boolean(
        impact.fixedAssignments
        || impact.dynamicAssignments
        || impact.classificationFields
        || impact.formalWorkRoles
        || impact.internalCallCount
      );
    }

    function renderOwningDepartmentChangeModal() {
      const impact = owningDepartmentChangeState?.impact;
      if (!impact) return;
      const previousLabel = impact.previousDepartment || '未填写';
      const nextLabel = impact.nextDepartment || '未填写';
      const preservedReviewItems = [
        impact.formalWorkRoles ? `${impact.formalWorkRoles}个正式工作角色` : '',
        impact.internalCallCount ? `${impact.internalCallCount}条历史部门内调用` : ''
      ].filter(Boolean);
      const actorResetItems = [
        impact.fixedAssignments ? `清空${impact.fixedAssignments}个行为已有的固定执行部门和岗位` : '',
        impact.dynamicAssignments ? `将${impact.dynamicAssignments}个动态责任部门设置恢复为“固定部门和岗位—未选择”` : ''
      ].filter(Boolean);
      const actorResetMarkup = actorResetItems.length
        ? `<div class="merge-summary-item"><strong>执行主体：</strong>${actorResetItems.join('；')}。</div>`
        : '';
      const classificationResetMarkup = impact.classificationFields
        ? `<div class="merge-summary-item"><strong>能力归类：</strong>能力域、业务能力和归类状态恢复为未归类，当前有${impact.classificationFields}项已填内容会被重置。</div>`
        : '';
      const followupItems = [
        impact.fixedAssignments || impact.dynamicAssignments
          ? '从“流程步骤—业务流程”开始，逐项重新选择执行主体；页面将根据执行部门自动标记跨部门行为'
          : '',
        impact.classificationFields ? '回到“基本信息”重新确认能力域、业务能力和归类状态' : '',
        preservedReviewItems.length ? `在后续审核中重新确认${preservedReviewItems.join('和')}是否仍适用` : ''
      ].filter(Boolean);
      owningDepartmentChangeContent.innerHTML = `
        <p>归口部门是识别本部门行为和跨部门行为的基准。将归口部门从“${escapeHtml(previousLabel)}”改为“${escapeHtml(nextLabel)}”后，原责任判断不能继续沿用。</p>
        <div class="merge-summary">
          ${actorResetMarkup}
          ${classificationResetMarkup}
          <div class="merge-summary-item"><strong>保持不变：</strong>${impact.companyWideAssignments ? `${impact.companyWideAssignments}个“全公司通用”行为、` : ''}业务行为名称和说明、流程关系、输出物与数据、表单、技术标识${preservedReviewItems.length ? `，以及${preservedReviewItems.join('和')}` : ''}。</div>
        </div>
        ${preservedReviewItems.length ? `<div class="inline-warning" style="margin-top:14px">${escapeHtml(preservedReviewItems.join('和'))}不会被页面改写。归口部门变更后，请在后续审核中重新确认这些保留内容是否仍适用。</div>` : ''}
        <div class="inline-warning" style="margin-top:14px"><strong>确认后需要重新梳理：</strong>${escapeHtml(followupItems.join('；'))}。页面刷新或关闭后无法恢复本次重置前的内容；需要留存时，请先下载当前草稿。</div>
        <div id="owningDepartmentChangeError" class="inline-warning" style="margin-top:14px;display:none" role="alert"></div>`;
    }

    function openOwningDepartmentChange(nextDepartment) {
      const data = currentDocument();
      if (!data) return;
      const impact = owningDepartmentChangeImpact(data, nextDepartment);
      if (impact.nextDepartment === impact.previousDepartment) {
        render();
        return;
      }
      if (!owningDepartmentChangeNeedsConfirmation(impact)) {
        data.process.owning_department = impact.nextDepartment;
        touch();
        render();
        return;
      }
      owningDepartmentChangeState = {
        candidateIndex: currentIndex,
        processRef: text(data?.process?.process_ref).trim(),
        impact
      };
      renderOwningDepartmentChangeModal();
      owningDepartmentChangeModal.classList.add('show');
      owningDepartmentChangeModal.setAttribute('aria-hidden', 'false');
      confirmOwningDepartmentChangeButton.focus();
    }

    function closeOwningDepartmentChange() {
      owningDepartmentChangeState = null;
      owningDepartmentChangeModal.classList.remove('show');
      owningDepartmentChangeModal.setAttribute('aria-hidden', 'true');
      owningDepartmentChangeContent.innerHTML = '';
    }

    function showOwningDepartmentChangeError(message) {
      const errorBox = document.getElementById('owningDepartmentChangeError');
      if (!errorBox) return;
      errorBox.textContent = message;
      errorBox.style.display = 'block';
    }

    async function confirmOwningDepartmentChange() {
      const state = owningDepartmentChangeState;
      const entry = currentEntry();
      if (!state || !entry) return;
      if (
        state.candidateIndex !== currentIndex
        || state.processRef !== text(entry.data?.process?.process_ref).trim()
        || state.impact.previousDepartment !== text(entry.data?.process?.owning_department).trim()
      ) {
        showOwningDepartmentChangeError('当前流程已发生变化。页面没有执行重置，请取消后重新选择归口部门。');
        return;
      }
      confirmOwningDepartmentChangeButton.disabled = true;
      try {
        const next = buildOwningDepartmentResetDocument(entry.data, state.impact.nextDepartment);
        await ensureCompatibleValidationService('再次变更归口部门');
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: next })
        });
        const result = await readJsonResponse(response, '3001校验接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) throw new Error('重置后的技术引用校验未通过，当前草稿保持不变。');
        entry.data = next;
        activeFlowItemKind = 'behavior';
        if (!next.behaviors.some(item => item.behavior_ref === activeBehaviorRef)) {
          activeBehaviorRef = next.behaviors[0]?.behavior_ref || '';
        }
        const impact = state.impact;
        closeOwningDepartmentChange();
        touch();
        render();
        const resetItems = [
          impact.fixedAssignments + impact.dynamicAssignments
            ? `${impact.fixedAssignments + impact.dynamicAssignments}个执行主体设置`
            : '',
          impact.classificationFields ? '能力归类' : ''
        ].filter(Boolean);
        const nextStep = impact.fixedAssignments || impact.dynamicAssignments
          ? '请从“流程步骤—业务流程”开始重新梳理。'
          : impact.classificationFields
            ? '请在“基本信息”中重新确认能力归类。'
            : '请在后续审核中确认保留内容是否仍适用。';
        showStatus(
          `归口部门已改为“${impact.nextDepartment || '未填写'}”。${resetItems.length ? `页面已重置${resetItems.join('、')}；` : ''}${nextStep}`,
          'success'
        );
      } catch (error) {
        showOwningDepartmentChangeError(`变更未执行：${error.message}`);
        showStatus(`归口部门变更未执行：${error.message}`, 'error');
      } finally {
        confirmOwningDepartmentChangeButton.disabled = false;
      }
    }

    function handleAction(action, element) {
      const index = Number(element.dataset.index);
      const formIndex = Number(element.dataset.formIndex);
      const areaIndex = Number(element.dataset.areaIndex);
      let nextFocusPath = '';
      if (action === 'switch-governance-step') return setActiveGovernanceStep(element.dataset.step);
      if (action === 'check-governance-step') {
        const stepId = globalThis.GovernanceWorkflow.normalizeStepId(element.dataset.step);
        if (!currentDocument()) return;
        checkedGovernanceSteps.add(governanceCheckKey(stepId));
        render();
        requestAnimationFrame(() => workspace.querySelector('.step-issue-panel, .step-check-clear')?.focus?.());
        return;
      }
      if (action === 'switch-step-view') {
        activeStepView = text(element.dataset.view) || defaultStepView(activeGovernanceStep);
        if (currentEntry()) currentEntry().stepView = activeStepView;
        return render();
      }
      if (action === 'switch-bulk-kind') {
        bulkDataEditorState = {
          kind: ['objects', 'fields', 'relations'].includes(element.dataset.kind) ? element.dataset.kind : 'objects',
          text: '',
          preview: null,
          documentKey: ''
        };
        return render();
      }
      if (action === 'copy-bulk-header') {
        const content = globalThis.BulkDataEditor.headerText(bulkDataEditorState.kind);
        return copyBulkText(content, `${bulkKindLabel(bulkDataEditorState.kind)}列头已复制。请粘贴到Excel或WPS第一行。`);
      }
      if (action === 'copy-bulk-current') {
        const content = globalThis.BulkDataEditor.exportTsv(bulkDataEditorState.kind, currentDocument());
        return copyBulkText(content, `当前${bulkKindLabel(bulkDataEditorState.kind)}已复制，并载入粘贴区。`, { loadIntoEditor: true });
      }
      if (action === 'clear-bulk-input') {
        resetBulkDataEditor({ keepKind: true });
        return render();
      }
      if (action === 'preview-bulk-data') return previewBulkData();
      if (action === 'apply-bulk-data') return applyBulkData();
      if (action === 'switch-data-mode') {
        activeDataMode = text(element.dataset.mode) === 'lifecycle' ? 'lifecycle' : 'flow';
        graphSelection = null;
        if (activeDataMode === 'lifecycle') {
          const dataObject = ensureActiveGraphDataObject();
          const result = dataObject ? analyzeLifecycleForObject(dataObject) : null;
          if (result?.changed) touch();
        }
        return render();
      }
      if (action === 'start-new-process') return protect(startNewProcess);
      if (action === 'open-import-file') return protect(() => jsonInput.click());
      if (action === 'clear-current-page') return protect(clearPage);
      if (action === 'download-current-stage') return exportCurrent({
        stage: globalThis.GovernanceWorkflow.stageForStep(activeGovernanceStep),
        skipBusinessConfirm: activeGovernanceStep !== 'handoff'
      });
      if (action === 'open-governance-drawer') {
        renderGovernanceDrawer();
        governanceDrawer.classList.add('show');
        governanceDrawer.setAttribute('aria-hidden', 'false');
        return;
      }
      if (action === 'close-governance-drawer') {
        governanceDrawer.classList.remove('show');
        governanceDrawer.setAttribute('aria-hidden', 'true');
        return;
      }
      if (action === 'open-help-view') return setActiveGovernanceStep('start', 'help');
      if (action === 'open-version-view') return setActiveGovernanceStep('start', 'version');
      if (action === 'choose-data-start') {
        if (!(currentDocument()?.data_objects || []).length) {
          addDataObject();
          touch();
        }
        activeStepView = 'data';
        activeWorkspaceTab = 'data';
        return render();
      }
      if (action === 'choose-form-start') {
        if (!(currentDocument()?.data_objects || []).length) {
          addDataObject();
          touch();
        }
        activeStepView = 'forms';
        activeWorkspaceTab = 'editor';
        activeEditorSection = 'forms';
        return render();
      }
      if (action === 'select-skeleton-item') {
        const kind = text(element.dataset.kind);
        const ref = text(element.dataset.ref);
        if (kind === 'behavior') {
          const item = currentDocument()?.behaviors?.find(value => value.behavior_ref === ref);
          graphSelection = item ? { kind, ref, draft: clone(item) } : null;
          activeBehaviorRef = ref;
        } else if (kind === 'relation') {
          const item = currentDocument()?.flow_relations?.find(value => value.relation_ref === ref);
          graphSelection = item ? { kind, ref, draft: clone(item) } : null;
          activeRelationRef = ref;
        }
        return render();
      }
      if (action === 'governance-jump') return navigateToGovernanceTarget(element);
      if (action === 'copy-handoff-summary') return copyLastHandoffSummary();
      if (action === 'switch-tab') return setActiveWorkspaceTab(element.dataset.tab);
      if (action === 'return-editor') {
        activeEditorSection = 'process';
        return setActiveWorkspaceTab('editor');
      }
      if (action === 'fit-review-pattern') return reviewPatternViews.get(text(element.dataset.patternId))?.fit();
      if (action === 'reset-review-pattern') return reviewPatternViews.get(text(element.dataset.patternId))?.reset();
      if (action === 'toggle-review-pattern-expanded') {
        const patternId = text(element.dataset.patternId);
        expandedReviewPatternId = expandedReviewPatternId === patternId ? '' : patternId;
        return render();
      }
      if (action === 'fit-diagram') return diagramView?.fit();
      if (action === 'reset-diagram') return diagramView?.reset();
      if (action === 'toggle-diagram-example') {
        diagramExampleExpanded = !diagramExampleExpanded;
        if (!diagramExampleExpanded) {
          legendPatternGuideExpanded = false;
          expandedReviewPatternId = '';
        }
        return render();
      }
      if (action === 'toggle-diagram-expanded') {
        diagramExpanded = !diagramExpanded;
        return render();
      }
      if (action === 'focus-editor') return focusEditorItem(element.dataset.focusKind, element.dataset.focusRef);
      if (action === 'focus-export-warning') return focusExportWarning(element);
      if (action === 'refresh-structure-score') {
        structureScoreRunId += 1;
        structureScoreState = {
          status: 'idle',
          candidateIndex: -1,
          documentKey: '',
          result: null,
          message: ''
        };
        return render();
      }
      if (!currentDocument()) return;
      if (action === 'reanalyze-current-lifecycle') {
        const dataObject = ensureActiveGraphDataObject();
        if (!dataObject) return;
        const result = analyzeLifecycleForObject(dataObject);
        touch();
        showStatus(`已重新分析“${dataObject.data_name || '未命名数据'}”，形成${result?.candidate_count || 0}项候选。`, 'success');
        return render();
      }
      if (action === 'reanalyze-all-lifecycle') {
        let candidateCount = 0;
        (currentDocument().data_objects || []).forEach(dataObject => {
          const result = analyzeLifecycleForObject(dataObject);
          candidateCount += result?.candidate_count || 0;
        });
        touch();
        showStatus(`已重新分析${currentDocument().data_objects.length}个数据对象，共形成${candidateCount}项候选。`, 'success');
        return render();
      }
      if (action === 'supplement-data-facts') {
        activeDataMode = 'flow';
        const dataObject = ensureActiveGraphDataObject();
        graphSelection = dataObject ? { kind: 'data', ref: dataObject.data_ref, draft: clone(dataObject) } : null;
        return render();
      }
      if (action === 'mark-master-data-pending') {
        const dataObject = ensureActiveGraphDataObject();
        if (!dataObject) return;
        masterDataPendingRefs.add(dataObject.data_ref);
        showStatus('已列入本页交接待定提示。该标记只保留在当前页面，不写成正式主数据结论。', 'success');
        return render();
      }
      if (action === 'fit-flow-diagram') {
        diagramView?.fit();
        captureGraphViewport();
        return;
      }
      if (action === 'reset-flow-diagram') {
        graphStateManager.resetView(candidateStateKey(), 'flow');
        diagramView?.reset();
        captureGraphViewport();
        return;
      }
      if (action === 'fit-data-diagram') {
        dataDiagramView?.fit();
        captureGraphViewport();
        return;
      }
      if (action === 'reset-data-diagram') {
        graphStateManager.resetView(candidateStateKey(), 'data');
        dataDiagramView?.reset();
        captureGraphViewport();
        return;
      }
      if (action === 'undo-graph') return applyGraphHistory('undo');
      if (action === 'redo-graph') return applyGraphHistory('redo');
      if (action === 'add-graph-node') {
        return runGraphCommand({ type: 'add_behavior', behavior: newGraphBehavior() }, { successLabel: '已新增业务行为节点' });
      }
      if (action === 'start-flow-relation') {
        graphSelection = null;
        flowRelationDraft = { stage: 'type', relation_type: '', from_behavior_ref: null, to_behavior_ref: null, condition: '' };
        return render();
      }
      if (action === 'cancel-flow-relation') {
        flowRelationDraft = null;
        return render();
      }
      if (action === 'select-relation-endpoint') {
        if (!flowRelationDraft || !['source', 'target'].includes(flowRelationDraft.stage)) return;
        const ref = text(element.dataset.ref);
        if (flowRelationDraft.stage === 'source') {
          flowRelationDraft.from_behavior_ref = ref;
          flowRelationDraft.stage = 'target';
        } else {
          flowRelationDraft.to_behavior_ref = ref;
          flowRelationDraft.stage = 'confirm';
        }
        return render();
      }
      if (action === 'confirm-flow-relation') {
        if (!flowRelationDraft) return;
        const pendingDraft = flowRelationDraft;
        const relation = {
          relation_ref: newRef('relation'),
          relation_type: flowRelationDraft.relation_type,
          from_behavior_ref: flowRelationDraft.from_behavior_ref,
          to_behavior_ref: flowRelationDraft.to_behavior_ref,
          condition: text(flowRelationDraft.condition)
        };
        return runGraphCommand({ type: 'upsert_flow_relation', relation }, { successLabel: '流程关系已建立' }).then(ok => {
          flowRelationDraft = ok ? null : pendingDraft;
          render();
        });
      }
      if (action === 'apply-flow-property') return applyGraphPropertyDraft();
      if (action === 'delete-graph-selection') {
        if (!graphSelection || !['behavior', 'relation'].includes(graphSelection.kind)) return;
        return deleteGraphObject(graphSelection.kind, graphSelection.ref);
      }
      if (action === 'add-graph-data') {
        return runGraphCommand({ type: 'add_data_object', dataObject: newGraphDataObject() }, { successLabel: '已新增数据对象' });
      }
      if (action === 'merge-current-data') return mergeCurrentDataObjects();
      if (action === 'choose-data-behavior') {
        graphSelection = { kind: 'data-behavior-choice', dataRef: activeDataRef, behaviorRef: '' };
        return render();
      }
      if (action === 'cancel-data-relation') {
        const item = ensureActiveGraphDataObject();
        graphSelection = item ? { kind: 'data', ref: item.data_ref, draft: clone(item) } : null;
        return render();
      }
      if (action === 'continue-data-relation') {
        if (!graphSelection?.behaviorRef) return;
        const dataObject = ensureActiveGraphDataObject();
        graphSelection = {
          kind: 'data-edge',
          dataRef: dataObject.data_ref,
          behaviorRef: graphSelection.behaviorRef,
          operations: dataObject.behavior_links.filter(link => link.behavior_ref === graphSelection.behaviorRef).map(link => link.operation)
        };
        return render();
      }
      if (action === 'apply-data-operations') {
        if (graphSelection?.kind !== 'data-edge') return;
        return runGraphCommand({
          type: 'set_data_operations',
          dataRef: graphSelection.dataRef,
          behaviorRef: graphSelection.behaviorRef,
          operations: graphSelection.operations || [],
          refFactory: () => newRef('data_link')
        }, { successLabel: graphSelection.operations?.length ? '数据关系已更新' : '数据关系已删除' });
      }
      if (action === 'apply-data-property') {
        if (graphSelection?.kind !== 'data' || !graphSelection.draft) return;
        return runGraphCommand({ type: 'update_data_object', dataObject: graphSelection.draft }, { successLabel: '数据对象已更新' });
      }
      if (action === 'open-flow-behavior') {
        const ref = text(element.dataset.ref);
        const behavior = currentDocument().behaviors.find(item => item.behavior_ref === ref);
        graphSelection = behavior ? { kind: 'behavior', ref, draft: clone(behavior) } : null;
        activeBehaviorRef = ref;
        return setActiveGovernanceStep('skeleton', 'diagram');
      }
      if (action === 'delete-data-object') return deleteGraphObject('data', activeDataRef);
      if (action === 'focus-legacy-diagnostic') return focusExportWarning(element);
      if (action === 'open-behavior-data') {
        const behaviorRef = text(element.dataset.ref);
        const related = currentDataFlowDetails().dataDetails.find(detail =>
          detail.producerRefs.includes(behaviorRef)
          || detail.consumerRefs.includes(behaviorRef)
          || detail.availabilityStarts.includes(behaviorRef)
          || currentDocument().behaviors.find(item => item.behavior_ref === behaviorRef)?.actor_department_data_ref === detail.dataRef
        );
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        if (related) activeDataRef = related.dataRef;
        return setActiveGovernanceStep('data', 'data');
      }
      if (action === 'open-data-from-overview') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = text(element.dataset.ref);
        return setActiveGovernanceStep('data', 'data');
      }
      if (action === 'merge-duplicate-data') return mergeDuplicateData(index);
      if (action === 'add-data-behavior-link') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        const behavior = currentDocument().behaviors[0];
        if (!dataObject || !behavior) {
          window.alert('请先添加至少一个业务行为，再登记数据关系。');
          return;
        }
        dataObject.behavior_links.push({ link_ref: newRef('data_link'), behavior_ref: behavior.behavior_ref, operation: 'pending_confirmation' });
        touch();
        return render();
      }
      if (action === 'remove-data-behavior-link') {
        currentDocument().data_objects[Number(element.dataset.dataIndex)]?.behavior_links.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'add-data-source') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        if (!dataObject) return;
        dataObject.source_relations.push({
          source_ref: newRef('data_source'),
          source_department: '',
          source_process_name: '',
          source_behavior_name: '',
          source_data_name: '',
          availability_mode: 'pending_confirmation',
          available_from_behavior_ref: null
        });
        touch();
        return render();
      }
      if (action === 'remove-data-source') {
        currentDocument().data_objects[Number(element.dataset.dataIndex)]?.source_relations.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'add-data-field') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        if (!dataObject) return;
        if (!Array.isArray(dataObject.fields)) dataObject.fields = [];
        dataObject.fields.push({ field_ref: newRef('data_field'), field_name: '', field_type: '', definition: '' });
        touch();
        return render();
      }
      if (action === 'remove-data-field') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        const dataField = dataObject?.fields?.[index];
        if (!dataField) return;
        const references = [];
        (currentDocument().forms || []).forEach(form => (form.areas || []).forEach(area =>
          (area.items || []).forEach(item => {
            if (item.data_field_ref === dataField.field_ref) references.push(`${form.form_name || '未命名表单'} / ${item.item_name || '未命名字段'}`);
          })
        ));
        if (references.length) {
          window.alert(`当前对象字段仍被${references.join('、')}引用。请先替换或移除这些引用，再删除对象字段。`);
          return;
        }
        if (!window.confirm(`确定删除对象字段“${dataField.field_name || '未命名对象字段'}”吗？`)) return;
        dataObject.fields.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'add-form-behavior-link') {
        const form = currentDocument().forms[formIndex];
        const behavior = currentDocument().behaviors[0];
        if (!form || !behavior) {
          window.alert('请先添加至少一个业务行为，再登记表单处理关系。');
          return;
        }
        form.behavior_links.push({ link_ref: newRef('form_link'), behavior_ref: behavior.behavior_ref, operations: [], notes: '' });
        touch();
        return render();
      }
      if (action === 'remove-form-behavior-link') {
        currentDocument().forms[formIndex]?.behavior_links.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'edit-field-relations') {
        activeFormItemRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'close-field-relations') {
        activeFormItemRef = '';
        return render();
      }
      if (action === 'add-field-source') {
        const formItem = currentDocument().forms[formIndex]?.areas[areaIndex]?.items[Number(element.dataset.itemIndex)];
        const dataObject = currentDocument().data_objects[0];
        if (!formItem) return;
        formItem.source_links.push({
          source_link_ref: newRef('field_source'),
          source_type: dataObject ? 'process_data' : 'external_system',
          source_data_ref: dataObject?.data_ref || null,
          source_system_name: '',
          source_data_name: '',
          source_role: 'provides_value'
        });
        touch();
        return render();
      }
      if (action === 'remove-field-source') {
        currentDocument().forms[formIndex]?.areas[areaIndex]?.items[Number(element.dataset.itemIndex)]?.source_links.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'switch-editor-section') {
        activeEditorSection = EDITOR_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'basic';
        return render();
      }
      if (action === 'switch-process-section') {
        activeProcessSection = PROCESS_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'behaviors';
        return render();
      }
      if (action === 'select-behavior') {
        activeFlowItemKind = 'behavior';
        activeBehaviorRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-relation') {
        activeRelationRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-data') {
        activeDataRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-term') {
        activeTermRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-form') {
        activeFormRef = text(element.dataset.ref);
        activeAreaRef = '';
        activeFormItemRef = '';
        return render();
      }
      if (action === 'select-area') {
        activeAreaRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'export-current') return exportCurrent({
        stage: globalThis.GovernanceWorkflow.stageForStep('handoff'),
        skipBusinessConfirm: false
      });
      if (action === 'add-behavior') addBehavior();
      if (action === 'remove-behavior' && !removeBehavior(index)) return;
      if (action === 'add-relation') addRelation();
      if (action === 'remove-relation' && !removeRelation(index)) return;
      if (action === 'add-data') addDataObject();
      if (action === 'remove-data' && !removeData(index)) return;
      if (action === 'add-current-form') addForm('current_state');
      if (action === 'add-proposed-form') addForm('proposed_design');
      if (action === 'remove-form') {
        if (!window.confirm('删除当前表单或记录后，其主表、明细表和全部填写项都会一并删除。确定继续吗？')) return;
        const removed = currentDocument().forms[index];
        currentDocument().forms.splice(index, 1);
        if (removed?.form_ref === activeFormRef) {
          activeFormRef = currentDocument().forms[Math.min(index, currentDocument().forms.length - 1)]?.form_ref || '';
          activeAreaRef = '';
        }
      }
      if (action === 'move-detail-area-up' && !moveDetailArea(formIndex, index, -1)) return;
      if (action === 'move-detail-area-down' && !moveDetailArea(formIndex, index, 1)) return;
      if (action === 'remove-detail-area' && !removeDetailArea(formIndex, index)) return;
      if (action === 'add-form-item') {
        const form = currentDocument().forms[formIndex];
        if (!form) return;
        const area = ensureFormArea(form, '');
        const itemIndex = area.items.length;
        const newItem = {
          item_ref: newRef('item'),
          item_name: '',
          item_type: '',
          required: false,
          instructions: '',
          business_data_ref: null,
          data_field_ref: null,
          value_usage_mode: 'pending_confirmation',
          value_origin_mode: 'pending_confirmation',
          source_links: []
        };
        area.items.push(newItem);
        activeFormItemRef = newItem.item_ref;
        activeAreaRef = area.area_ref;
        const nextAreaIndex = form.areas.indexOf(area);
        nextFocusPath = `forms.${formIndex}.areas.${nextAreaIndex}.items.${itemIndex}.item_name`;
      }
      if (action === 'move-form-item-up' && !moveFormItem(formIndex, areaIndex, index, -1)) return;
      if (action === 'move-form-item-down' && !moveFormItem(formIndex, areaIndex, index, 1)) return;
      if (action === 'remove-form-item') {
        const removedItem = currentDocument().forms[formIndex]?.areas[areaIndex]?.items[index];
        currentDocument().forms[formIndex]?.areas[areaIndex]?.items.splice(index, 1);
        if (removedItem?.item_ref === activeFormItemRef) activeFormItemRef = '';
      }
      if (action === 'add-term') addTerm();
      if (action === 'remove-term') {
        const removed = currentDocument().terms[index];
        currentDocument().terms.splice(index, 1);
        if (removed?.term_ref === activeTermRef) {
          activeTermRef = currentDocument().terms[Math.min(index, currentDocument().terms.length - 1)]?.term_ref || '';
        }
      }
      touch();
      render();
      if (nextFocusPath) {
        requestAnimationFrame(() => {
          const control = Array.from(workspace.querySelectorAll('[data-bind]')).find(item => item.dataset.bind === nextFocusPath);
          if (!control) return;
          control.focus({ preventScroll: true });
          control.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }
    }

    function businessWarnings(data) {
      const warnings = [];
      const defaultSuggestions = target => {
        if (target.focusPath) return ['点击本项返回对应位置，补充并核对页面高亮的字段。'];
        if (Array.isArray(target.focusPaths) && target.focusPaths.length) {
          return ['点击本项返回对应位置，逐项核对页面高亮的字段。'];
        }
        return ['点击本项返回对应页面，核对并补充相关内容。'];
      };
      const addWarning = (message, target = {}, suggestions = []) => {
        const normalizedSuggestions = (Array.isArray(suggestions) ? suggestions : [suggestions])
          .map(text)
          .filter(Boolean);
        warnings.push({
          message,
          suggestions: normalizedSuggestions.length ? normalizedSuggestions : defaultSuggestions(target),
          ...target
        });
      };
      const need = (value, message, target = {}, suggestions = []) => {
        if (!text(value).trim()) addWarning(message, target, suggestions);
      };
      const atField = (target, focusPath) => ({ ...target, focusPath });
      const atFields = (target, focusPaths) => ({ ...target, focusPaths });
      need(data.export_meta.initiating_department, '未填写发起部门', {
        editorSection: 'basic',
        focusPath: 'export_meta.initiating_department'
      });
      need(data.export_meta.compiler, '未填写编制人', {
        editorSection: 'basic',
        focusPath: 'export_meta.compiler'
      });
      need(data.process.process_name, '未填写流程名称', {
        editorSection: 'basic',
        focusPath: 'process.process_name'
      });
      need(data.process.owning_department, '未填写归口部门', {
        editorSection: 'basic',
        focusPath: 'process.owning_department'
      });
      need(data.process.purpose, '未填写流程目的', {
        editorSection: 'profile',
        focusPath: 'process.purpose'
      });
      need(data.process.scope, '未填写适用范围', {
        editorSection: 'profile',
        focusPath: 'process.scope'
      });
      if (!data.behaviors.length) {
        addWarning('尚未添加流程节点', {
          editorSection: 'process',
          processSection: 'behaviors'
        });
      }
      const owningDepartment = text(data.process.owning_department).trim();
      const dataFlowDetails = globalThis.StructureLearningScore?.dataFlowConsistencyDetails?.(data);
      data.behaviors.forEach((item, index) => {
        const label = item.behavior_name || `第${index + 1}项行为`;
        const behaviorTarget = {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: item.behavior_ref
        };
        const isControlNode = ['decision', 'parallel_split', 'parallel_join'].includes(item.node_type);
        const assignmentMode = actorAssignmentMode(item);
        const actorTarget = atField(
          behaviorTarget,
          assignmentMode === 'dynamic_from_data'
            ? `behaviors.${index}.actor_department_data_ref`
            : assignmentMode === 'company_wide'
              ? `behaviors.${index}.actor_assignment_mode`
              : `behaviors.${index}.current_actor_role`
        );
        need(item.node_type, `${label}未选择节点类型`, atField(behaviorTarget, `behaviors.${index}.node_type`));
        need(item.behavior_name, `第${index + 1}项行为未填写名称`, atField(behaviorTarget, `behaviors.${index}.behavior_name`));
        if (!isControlNode && assignmentMode === 'dynamic_from_data') {
          if (!item.actor_department_data_ref) {
            addWarning(`${label}未选择用于确定执行部门的前序数据`, actorTarget);
          } else if (!dataFlowDetails?.isAvailableBeforeBehavior?.(item.actor_department_data_ref, item.behavior_ref)) {
            addWarning(
              `${label}选择的执行部门来源数据尚未在本行为开始前形成。`,
              actorTarget,
              ['改选本行为开始前已经形成的数据。']
            );
          }
          need(
            item.actor_position_rule,
            `${label}未填写办理人员确定规则`,
            atField(behaviorTarget, `behaviors.${index}.actor_position_rule`)
          );
        } else if (!isControlNode && assignmentMode === 'fixed_department') {
          need(item.current_actor_role, `${label}未选择执行部门`, actorTarget);
        }
        const externalDepartment = assignmentMode === 'fixed_department'
          ? externalActorDepartment(item.current_actor_role, owningDepartment)
          : '';
        const validRelations = ordinaryRelationsForBehavior(item.behavior_ref, data).filter(relation =>
          relation.relation_type
          && relation.from_behavior_ref
          && relation.to_behavior_ref
        );
        if (!isControlNode && externalDepartment && !validRelations.length) {
          addWarning(
            `${label}由${externalDepartment}执行，但尚未建立有效流程关系。`,
            { editorSection: 'process', processSection: 'relations' },
            ['在“流程关系”中补充该行为与前序或后续行为的实际先后关系。']
          );
        }
        if (!isControlNode && assignmentMode === 'fixed_department' && text(item.current_actor_role).trim() && rosterLoadState === 'ready') {
          const parsedActor = parseActorRole(item.current_actor_role);
          const actorDepartmentIsKnown = actorDepartments().includes(parsedActor.department);
          const actorIsValid = item.current_actor_role === '全公司'
            || (
              actorDepartmentIsKnown
              && rosterPositions(parsedActor.department).includes(parsedActor.position)
            );
          if (item.current_actor_role !== '全公司' && actorDepartmentIsKnown && !parsedActor.position) {
            addWarning(`${label}未选择执行岗位`, actorTarget);
          } else if (!actorIsValid) {
            addWarning(`${label}的执行岗位未被所选执行部门的花名册收录`, actorTarget);
          }
        }
        const hasDerivedEntry = (dataFlowDetails?.incomingByBehavior.get(item.behavior_ref) || [])
          .some(entry => entry.relation?.relation_type !== 'loop');
        if (!isControlNode && !hasDerivedEntry && !text(item.trigger).trim()) {
          addWarning(
            `${label}是流程入口，但未说明流程如何开始`,
            atField(behaviorTarget, `behaviors.${index}.trigger`)
          );
        }
        if (!isControlNode) {
          need(
            item.completion_standard,
