      }
      if (action === 'cancel-data-relation') {
        const item = ensureActiveGraphDataObject();
        graphSelection = item ? { kind: 'data', ref: item.data_ref, draft: clone(item) } : null;
        return render();
      }
      if (action === 'continue-data-relation') {
        if (!graphSelection?.behaviorRef) return;
        const dataObject = ensureActiveGraphDataObject();
        graphSelection = {
          kind: 'data-edge',
          dataRef: dataObject.data_ref,
          behaviorRef: graphSelection.behaviorRef,
          operations: dataObject.behavior_links.filter(link => link.behavior_ref === graphSelection.behaviorRef).map(link => link.operation)
        };
        return render();
      }
      if (action === 'apply-data-operations') {
        if (graphSelection?.kind !== 'data-edge') return;
        return runGraphCommand({
          type: 'set_data_operations',
          dataRef: graphSelection.dataRef,
          behaviorRef: graphSelection.behaviorRef,
          operations: graphSelection.operations || [],
          refFactory: () => newRef('data_link')
        }, { successLabel: graphSelection.operations?.length ? '数据关系已更新' : '数据关系已删除' });
      }
      if (action === 'apply-data-property') {
        if (graphSelection?.kind !== 'data' || !graphSelection.draft) return;
        return runGraphCommand({ type: 'update_data_object', dataObject: graphSelection.draft }, { successLabel: '数据对象已更新' });
      }
      if (action === 'open-flow-behavior') {
        const ref = text(element.dataset.ref);
        const behavior = currentDocument().behaviors.find(item => item.behavior_ref === ref);
        graphSelection = behavior ? { kind: 'behavior', ref, draft: clone(behavior) } : null;
        activeBehaviorRef = ref;
        return setActiveWorkspaceTab('flow');
      }
      if (action === 'delete-data-object') return deleteGraphObject('data', activeDataRef);
      if (action === 'open-legacy-relations') {
        activeEditorSection = 'process';
        activeProcessSection = 'relations';
        return render();
      }
      if (action === 'open-legacy-data') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        return render();
      }
      if (action === 'open-behavior-data') {
        const behaviorRef = text(element.dataset.ref);
        const related = currentDataFlowDetails().dataDetails.find(detail =>
          detail.producerRefs.includes(behaviorRef)
          || detail.consumerRefs.includes(behaviorRef)
          || detail.availabilityStarts.includes(behaviorRef)
          || currentDocument().behaviors.find(item => item.behavior_ref === behaviorRef)?.actor_department_data_ref === detail.dataRef
        );
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        if (related) activeDataRef = related.dataRef;
        return render();
      }
      if (action === 'open-data-from-overview') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'merge-duplicate-data') return mergeDuplicateData(index);
      if (action === 'add-data-behavior-link') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        const behavior = currentDocument().behaviors[0];
        if (!dataObject || !behavior) {
          window.alert('请先添加至少一个业务行为，再登记数据关系。');
          return;
        }
        dataObject.behavior_links.push({ link_ref: newRef('data_link'), behavior_ref: behavior.behavior_ref, operation: 'pending_confirmation' });
        touch();
        return render();
      }
      if (action === 'remove-data-behavior-link') {
        currentDocument().data_objects[Number(element.dataset.dataIndex)]?.behavior_links.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'add-data-source') {
        const dataObject = currentDocument().data_objects[Number(element.dataset.dataIndex)];
        if (!dataObject) return;
        dataObject.source_relations.push({
          source_ref: newRef('data_source'),
          source_department: '',
          source_process_name: '',
          source_behavior_name: '',
          source_data_name: '',
          availability_mode: 'pending_confirmation',
          available_from_behavior_ref: null
        });
        touch();
        return render();
      }
      if (action === 'remove-data-source') {
        currentDocument().data_objects[Number(element.dataset.dataIndex)]?.source_relations.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'add-form-behavior-link') {
        const form = currentDocument().forms[formIndex];
        const behavior = currentDocument().behaviors[0];
        if (!form || !behavior) {
          window.alert('请先添加至少一个业务行为，再登记表单处理关系。');
          return;
        }
        form.behavior_links.push({ link_ref: newRef('form_link'), behavior_ref: behavior.behavior_ref, operations: [], notes: '' });
        touch();
        return render();
      }
      if (action === 'remove-form-behavior-link') {
        currentDocument().forms[formIndex]?.behavior_links.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'edit-field-relations') {
        activeFormItemRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'close-field-relations') {
        activeFormItemRef = '';
        return render();
      }
      if (action === 'add-field-source') {
        const formItem = currentDocument().forms[formIndex]?.areas[areaIndex]?.items[Number(element.dataset.itemIndex)];
        const dataObject = currentDocument().data_objects[0];
        if (!formItem) return;
        formItem.source_links.push({
          source_link_ref: newRef('field_source'),
          source_type: dataObject ? 'process_data' : 'external_system',
          source_data_ref: dataObject?.data_ref || null,
          source_system_name: '',
          source_data_name: '',
          source_role: 'provides_value'
        });
        touch();
        return render();
      }
      if (action === 'remove-field-source') {
        currentDocument().forms[formIndex]?.areas[areaIndex]?.items[Number(element.dataset.itemIndex)]?.source_links.splice(index, 1);
        touch();
        return render();
      }
      if (action === 'switch-editor-section') {
        activeEditorSection = EDITOR_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'basic';
        return render();
      }
      if (action === 'switch-process-section') {
        activeProcessSection = PROCESS_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'behaviors';
        return render();
      }
      if (action === 'select-behavior') {
        activeFlowItemKind = 'behavior';
        activeBehaviorRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-relation') {
        activeRelationRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-data') {
        activeDataRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-term') {
        activeTermRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-form') {
        activeFormRef = text(element.dataset.ref);
        activeAreaRef = '';
        activeFormItemRef = '';
        return render();
      }
      if (action === 'select-area') {
        activeAreaRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'export-current') return exportCurrent();
      if (action === 'add-behavior') addBehavior();
      if (action === 'remove-behavior' && !removeBehavior(index)) return;
      if (action === 'add-relation') addRelation();
      if (action === 'remove-relation' && !removeRelation(index)) return;
      if (action === 'add-data') addDataObject();
      if (action === 'remove-data' && !removeData(index)) return;
      if (action === 'add-current-form') addForm('current_state');
      if (action === 'add-proposed-form') addForm('proposed_design');
      if (action === 'remove-form') {
        if (!window.confirm('删除当前表单或记录后，其主表、明细表和全部填写项都会一并删除。确定继续吗？')) return;
        const removed = currentDocument().forms[index];
        currentDocument().forms.splice(index, 1);
        if (removed?.form_ref === activeFormRef) {
          activeFormRef = currentDocument().forms[Math.min(index, currentDocument().forms.length - 1)]?.form_ref || '';
          activeAreaRef = '';
        }
      }
      if (action === 'move-detail-area-up' && !moveDetailArea(formIndex, index, -1)) return;
      if (action === 'move-detail-area-down' && !moveDetailArea(formIndex, index, 1)) return;
      if (action === 'remove-detail-area' && !removeDetailArea(formIndex, index)) return;
      if (action === 'add-form-item') {
        const form = currentDocument().forms[formIndex];
        if (!form) return;
        const area = ensureFormArea(form, '');
        const itemIndex = area.items.length;
        const newItem = {
          item_ref: newRef('item'),
          item_name: '',
          item_type: '',
          required: false,
          instructions: '',
          business_data_ref: null,
          value_origin_mode: 'pending_confirmation',
          source_links: []
        };
        area.items.push(newItem);
        activeFormItemRef = newItem.item_ref;
        activeAreaRef = area.area_ref;
        const nextAreaIndex = form.areas.indexOf(area);
        nextFocusPath = `forms.${formIndex}.areas.${nextAreaIndex}.items.${itemIndex}.item_name`;
      }
      if (action === 'move-form-item-up' && !moveFormItem(formIndex, areaIndex, index, -1)) return;
      if (action === 'move-form-item-down' && !moveFormItem(formIndex, areaIndex, index, 1)) return;
      if (action === 'remove-form-item') {
        const removedItem = currentDocument().forms[formIndex]?.areas[areaIndex]?.items[index];
        currentDocument().forms[formIndex]?.areas[areaIndex]?.items.splice(index, 1);
        if (removedItem?.item_ref === activeFormItemRef) activeFormItemRef = '';
      }
      if (action === 'add-term') addTerm();
      if (action === 'remove-term') {
        const removed = currentDocument().terms[index];
        currentDocument().terms.splice(index, 1);
        if (removed?.term_ref === activeTermRef) {
          activeTermRef = currentDocument().terms[Math.min(index, currentDocument().terms.length - 1)]?.term_ref || '';
        }
      }
      touch();
      render();
      if (nextFocusPath) {
        requestAnimationFrame(() => {
          const control = Array.from(workspace.querySelectorAll('[data-bind]')).find(item => item.dataset.bind === nextFocusPath);
          if (!control) return;
          control.focus({ preventScroll: true });
          control.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }
    }

    function businessWarnings(data) {
      const warnings = [];
      const defaultSuggestions = target => {
        if (target.focusPath) return ['点击本项返回对应位置，补充并核对页面高亮的字段。'];
        if (Array.isArray(target.focusPaths) && target.focusPaths.length) {
          return ['点击本项返回对应位置，逐项核对页面高亮的字段。'];
        }
        return ['点击本项返回对应页面，核对并补充相关内容。'];
      };
      const addWarning = (message, target = {}, suggestions = []) => {
        const normalizedSuggestions = (Array.isArray(suggestions) ? suggestions : [suggestions])
          .map(text)
          .filter(Boolean);
        warnings.push({
          message,
          suggestions: normalizedSuggestions.length ? normalizedSuggestions : defaultSuggestions(target),
          ...target
        });
      };
      const need = (value, message, target = {}, suggestions = []) => {
        if (!text(value).trim()) addWarning(message, target, suggestions);
      };
      const atField = (target, focusPath) => ({ ...target, focusPath });
      const atFields = (target, focusPaths) => ({ ...target, focusPaths });
      need(data.export_meta.initiating_department, '未填写发起部门', {
        editorSection: 'basic',
        focusPath: 'export_meta.initiating_department'
      });
      need(data.export_meta.compiler, '未填写编制人', {
        editorSection: 'basic',
        focusPath: 'export_meta.compiler'
      });
      need(data.process.process_name, '未填写流程名称', {
        editorSection: 'basic',
        focusPath: 'process.process_name'
      });
      need(data.process.owning_department, '未填写归口部门', {
        editorSection: 'basic',
        focusPath: 'process.owning_department'
      });
      need(data.process.purpose, '未填写流程目的', {
        editorSection: 'profile',
        focusPath: 'process.purpose'
      });
      need(data.process.scope, '未填写适用范围', {
        editorSection: 'profile',
        focusPath: 'process.scope'
      });
      if (!data.behaviors.length) {
        addWarning('尚未添加流程节点', {
          editorSection: 'process',
          processSection: 'behaviors'
        });
      }
      const owningDepartment = text(data.process.owning_department).trim();
      const dataFlowDetails = globalThis.StructureLearningScore?.dataFlowConsistencyDetails?.(data);
      data.behaviors.forEach((item, index) => {
        const label = item.behavior_name || `第${index + 1}项行为`;
        const behaviorTarget = {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: item.behavior_ref
        };
        const isControlNode = ['decision', 'parallel_split', 'parallel_join'].includes(item.node_type);
        const assignmentMode = actorAssignmentMode(item);
        const actorTarget = atField(
          behaviorTarget,
          assignmentMode === 'dynamic_from_data'
            ? `behaviors.${index}.actor_department_data_ref`
            : assignmentMode === 'company_wide'
              ? `behaviors.${index}.actor_assignment_mode`
              : `behaviors.${index}.current_actor_role`
        );
        need(item.node_type, `${label}未选择节点类型`, atField(behaviorTarget, `behaviors.${index}.node_type`));
        need(item.behavior_name, `第${index + 1}项行为未填写名称`, atField(behaviorTarget, `behaviors.${index}.behavior_name`));
        if (!isControlNode && assignmentMode === 'dynamic_from_data') {
          if (!item.actor_department_data_ref) {
            addWarning(`${label}未选择用于确定执行部门的前序数据`, actorTarget);
          } else if (!dataFlowDetails?.isAvailableBeforeBehavior?.(item.actor_department_data_ref, item.behavior_ref)) {
            addWarning(
              `${label}选择的执行部门来源数据尚未在本行为开始前形成。`,
              actorTarget,
              ['改选本行为开始前已经形成的数据。']
            );
          }
          need(
            item.actor_position_rule,
            `${label}未填写办理人员确定规则`,
            atField(behaviorTarget, `behaviors.${index}.actor_position_rule`)
          );
        } else if (!isControlNode && assignmentMode === 'fixed_department') {
          need(item.current_actor_role, `${label}未选择执行部门`, actorTarget);
        }
        const externalDepartment = assignmentMode === 'fixed_department'
          ? externalActorDepartment(item.current_actor_role, owningDepartment)
          : '';
        const validRelations = ordinaryRelationsForBehavior(item.behavior_ref, data).filter(relation =>
          relation.relation_type
          && relation.from_behavior_ref
          && relation.to_behavior_ref
        );
        if (!isControlNode && externalDepartment && !validRelations.length) {
          addWarning(
            `${label}由${externalDepartment}执行，但尚未建立有效流程关系。`,
            { editorSection: 'process', processSection: 'relations' },
            ['在“流程关系”中补充该行为与前序或后续行为的实际先后关系。']
          );
        }
        if (!isControlNode && assignmentMode === 'fixed_department' && text(item.current_actor_role).trim() && rosterLoadState === 'ready') {
          const parsedActor = parseActorRole(item.current_actor_role);
          const actorDepartmentIsKnown = actorDepartments().includes(parsedActor.department);
          const actorIsValid = item.current_actor_role === '全公司'
            || (
              actorDepartmentIsKnown
              && rosterPositions(parsedActor.department).includes(parsedActor.position)
            );
          if (item.current_actor_role !== '全公司' && actorDepartmentIsKnown && !parsedActor.position) {
            addWarning(`${label}未选择执行岗位`, actorTarget);
          } else if (!actorIsValid) {
            addWarning(`${label}的执行岗位未被所选执行部门的花名册收录`, actorTarget);
          }
        }
        const hasDerivedEntry = (dataFlowDetails?.incomingByBehavior.get(item.behavior_ref) || [])
          .some(entry => entry.relation?.relation_type !== 'loop');
        if (!isControlNode && !hasDerivedEntry && !text(item.trigger).trim()) {
          addWarning(
            `${label}是流程入口，但未说明流程如何开始`,
            atField(behaviorTarget, `behaviors.${index}.trigger`)
          );
        }
        if (!isControlNode) {
          need(
            item.completion_standard,
            `${label}未填写完成标准`,
            atField(behaviorTarget, `behaviors.${index}.completion_standard`)
          );
        }
        if (!isControlNode && item.countersign_all_required) {
          if (!item.countersign_target_departments.length) {
            addWarning(
              `${label}未选择需要确认知悉的部门`,
              atField(behaviorTarget, `behaviors.${index}.countersign_target_departments`)
            );
          }
        }
        if (item.node_type === 'decision') {
          const localBranches = data.flow_relations.filter(relation =>
            relation.from_behavior_ref === item.behavior_ref
            && ['condition', 'sequence', 'loop'].includes(relation.relation_type)
          );
          const outletCount = localBranches.length;
          if (outletCount < 2) {
            addWarning(
              `${label}当前只有${outletCount}条明确出口，判断节点至少需要2条。`,
              behaviorTarget,
              [`补充${2 - outletCount}条具有明确去向的判断出口。`]
            );
          }
          const defaultSequenceBranches = localBranches.filter(branch =>
            branch.relation_type === 'sequence'
            && !text(branch.condition).trim()
          );
          defaultSequenceBranches.slice(1).forEach((branch, branchIndex) => {
            const relationIndex = data.flow_relations.indexOf(branch);
            addWarning(
              `${label}的流程关系${relationIndex + 1}形成第${branchIndex + 2}条默认继续路径，判断节点只能保留1条默认继续路径。`,
              {
                editorSection: 'process',
                processSection: 'relations',
                focusKind: 'relation',
                focusRef: branch.relation_ref,
                focusPath: `flow_relations.${relationIndex}.relation_type`
              },
              [
                '需要保留该关系时，为它填写判断条件并改为“判断分支”。',
                '不需要保留该关系时，删除该默认继续关系。'
              ]
            );
          });
        }
      });
      dataFlowDetails?.issues.forEach(item => {
        const dataObject = data.data_objects[item.dataIndex];
        addWarning(item.message, {
          editorSection: 'process',
          processSection: 'data',
          focusKind: 'data',
          focusRef: dataObject?.data_ref || item.dataRef,
          focusPath: `data_objects.${item.dataIndex}.behavior_links`
        }, item.suggestions);
      });
      const parallelDetails = globalThis.StructureLearningScore?.parallelStructureDetails?.(data);
      const parallelTarget = { editorSection: 'process', processSection: 'relations' };
      if (parallelDetails?.missingSplit) {
        addWarning('当前存在并行路线，但业务流程中没有“并行开始（同时启动多条路线）”控制节点。', {
          editorSection: 'process',
          processSection: 'behaviors'
        }, ['新增“并行开始”控制节点，并让现有并行路线从该节点发出。']);
      }
      if (parallelDetails?.missingJoin) {
        addWarning('当前存在并行路线，但业务流程中没有“并行汇合（等待多条路线完成）”控制节点。', {
          editorSection: 'process',
          processSection: 'behaviors'
        }, ['新增“并行汇合”控制节点，并让需要等待的并行路线进入该节点。']);
      }
      parallelDetails?.splits.forEach(detail => {
        if (!detail.missingCount) return;
        const guidance = globalThis.StructureLearningScore?.parallelSplitGuidance?.(detail, data);
        addWarning(guidance?.message || '并行开始节点的有效并行路线不足2条。', guidance?.target || parallelTarget, guidance?.suggestions);
      });
      parallelDetails?.joins.forEach(detail => {
        if (!detail.missingCount) return;
        const guidance = globalThis.StructureLearningScore?.parallelJoinGuidance?.(detail, data);
        addWarning(guidance?.message || '并行汇合节点的有效来源不足2个。', guidance?.target || parallelTarget, guidance?.suggestions);
      });
      if (data.behaviors.length > 1) {
        const relationsTarget = {
          editorSection: 'process',
          processSection: 'relations'
        };
        const localRelations = data.flow_relations.filter(relation =>
          relation.from_behavior_ref
          && relation.to_behavior_ref
          && relation.relation_type !== 'loop'
        );
        const incoming = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
        const outgoing = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
        const transitions = localRelations.map(relation => ({
          from: relation.from_behavior_ref,
          to: relation.to_behavior_ref
        }));
        transitions.forEach(transition => {
          if (incoming.has(transition.to)) incoming.set(transition.to, incoming.get(transition.to) + 1);
          if (outgoing.has(transition.from)) outgoing.set(transition.from, outgoing.get(transition.from) + 1);
        });
        if (!transitions.length) {
          addWarning(
            `当前有${data.behaviors.length}个流程节点，但没有建立任何有效流程关系。`,
            relationsTarget,
            ['从流程入口开始，按实际先后顺序建立节点之间的关系。']
          );
        } else {
          const starts = [...incoming.values()].filter(count => count === 0).length;
          const ends = [...outgoing.values()].filter(count => count === 0).length;
          if (starts !== 1) {
            addWarning(
              `当前识别到${starts}个流程入口，流程应有1个明确入口。`,
              { ...relationsTarget, reviewAspect: 'boundary' },
              ['请归口部门核对未连接的起始节点，并补充关系使流程只保留1个入口。']
            );
          }
          if (ends < 1) {
            addWarning(
              '当前没有可识别的流程结束位置。',
              { ...relationsTarget, reviewAspect: 'boundary' },
              [
                '请归口部门确认实际结束位置，并检查末端业务行为是否写明完成标准。',
                '流程通过明确回路继续办理时，请核对回路关系类型和触发条件。'
              ]
            );
          }
        }
      }
      data.flow_relations.forEach((relation, index) => {
        const relationTarget = {
          editorSection: 'process',
          processSection: 'relations',
          focusKind: 'relation',
          focusRef: relation.relation_ref
        };
        need(
          relation.relation_type,
          `流程关系${index + 1}未选择关系类型`,
          atField(relationTarget, `flow_relations.${index}.relation_type`)
        );
        need(
          relation.from_behavior_ref,
          `流程关系${index + 1}未选择起点行为`,
          atField(relationTarget, `flow_relations.${index}.from_behavior_ref`)
        );
        need(
          relation.to_behavior_ref,
          `流程关系${index + 1}未选择目标行为`,
          atField(relationTarget, `flow_relations.${index}.to_behavior_ref`)
        );
        if (relation.relation_type === 'condition' && !text(relation.condition).trim()) {
          addWarning(
            `流程关系${index + 1}已选择“判断分支”，但判断条件为空。`,
            atField(relationTarget, `flow_relations.${index}.condition`),
            ['填写进入目标行为必须满足的具体判断结果。']
          );
        }
        if (relation.relation_type === 'loop' && !text(relation.condition).trim()) {
          addWarning(
            `流程关系${index + 1}已选择“流程内部回路”，但回路触发条件为空。`,
            atField(relationTarget, `flow_relations.${index}.condition`),
            ['填写退回前序行为的具体触发条件。']
          );
        }
      });
      const dataNameCounts = new Map();
      data.data_objects.forEach(item => {
        const name = text(item.data_name).trim();
        if (name) dataNameCounts.set(name, (dataNameCounts.get(name) || 0) + 1);
      });
      data.data_objects.forEach((item, dataIndex) => {
        const label = item.data_name || `第${dataIndex + 1}项数据`;
        const dataTarget = {
          editorSection: 'process', processSection: 'data', focusKind: 'data', focusRef: item.data_ref
        };
        need(item.data_name, `第${dataIndex + 1}项数据未填写名称`, atField(dataTarget, `data_objects.${dataIndex}.data_name`));
        need(item.description, `${label}未填写数据说明`, atField(dataTarget, `data_objects.${dataIndex}.description`));
        if (item.information_type === 'pending_confirmation') {
          addWarning(`${label}的信息类型待确认。`, atField(dataTarget, `data_objects.${dataIndex}.information_type`));
        }
        if (text(item.data_name).trim() && dataNameCounts.get(text(item.data_name).trim()) > 1) {
          addWarning(
            `${label}与当前流程中的其他数据对象重名。`,
            atField(dataTarget, `data_objects.${dataIndex}.data_name`),
            ['核对这些对象是否确实不同；需要保留时结合创建行为以及来源线索区分。', '确认属于同一对象时，先核对引用影响，再使用受控归并。']
          );
        }
        const createLinks = (item.behavior_links || []).filter(link => link.operation === 'create');
        if (createLinks.length > 1) {
          addWarning(`${label}登记了${createLinks.length}个创建行为，当前无法确认唯一创建位置。`, atField(dataTarget, `data_objects.${dataIndex}.behavior_links`));
        }
        (item.behavior_links || []).forEach((link, linkIndex) => {
          if (link.operation === 'pending_confirmation') {
            addWarning(`${label}与“${behaviorLabel(link.behavior_ref)}”之间的数据操作待确认。`, atField(dataTarget, `data_objects.${dataIndex}.behavior_links.${linkIndex}.operation`));
          }
        });
        if (!createLinks.length && !(item.source_relations || []).length) {
          addWarning(`${label}没有本流程创建行为，也未登记其他流程以及外部来源线索。`, atField(dataTarget, `data_objects.${dataIndex}.source_relations`));
        }
        (item.source_relations || []).forEach((source, sourceIndex) => {
          const sourcePath = `data_objects.${dataIndex}.source_relations.${sourceIndex}`;
          need(source.source_data_name, `${label}的来源线索${sourceIndex + 1}未填写来源数据名称`, atField(dataTarget, `${sourcePath}.source_data_name`));
          need(source.source_department, `${label}的来源线索${sourceIndex + 1}未填写来源部门`, atField(dataTarget, `${sourcePath}.source_department`));
          need(source.source_process_name, `${label}的来源线索${sourceIndex + 1}未填写来源流程名称`, atField(dataTarget, `${sourcePath}.source_process_name`));
          need(source.source_behavior_name, `${label}的来源线索${sourceIndex + 1}未填写来源行为名称`, atField(dataTarget, `${sourcePath}.source_behavior_name`));
          if (source.availability_mode === 'pending_confirmation') {
            addWarning(`${label}的来源线索${sourceIndex + 1}尚未确认在当前流程中的可用时间。`, atField(dataTarget, `${sourcePath}.availability_mode`));
          }
          if (source.availability_mode === 'at_behavior' && !source.available_from_behavior_ref) {
            addWarning(`${label}的来源线索${sourceIndex + 1}未选择具体可用位置。`, atField(dataTarget, `${sourcePath}.available_from_behavior_ref`));
          }
        });
      });
      data.forms.forEach((form, formIndex) => {
        const formLabel = form.form_name || `第${formIndex + 1}项表单记录`;
        const formTarget = {
          editorSection: 'forms',
          focusKind: 'form',
          focusRef: form.form_ref
        };
        need(
          form.form_name,
          `第${formIndex + 1}项表单记录未填写名称`,
          atField(formTarget, `forms.${formIndex}.form_name`)
        );
        if (form.form_design_state === 'unspecified') {
          addWarning(
            `${formLabel}尚未确认属于现状表单还是拟设计表单。`,
            atField(formTarget, `forms.${formIndex}.form_design_state`),
            ['根据实际情况，在“现状”“拟设计”中选择一项。']
          );
        }
        if (!(form.behavior_links || []).length) {
          addWarning(`${formLabel}尚未登记由哪些业务行为处理。`, atField(formTarget, `forms.${formIndex}.behavior_links`));
        }
        (form.behavior_links || []).forEach((link, linkIndex) => {
          if (!(link.operations || []).length) {
            addWarning(`${formLabel}与“${behaviorLabel(link.behavior_ref)}”的处理方式待确认。`, atField(formTarget, `forms.${formIndex}.behavior_links.${linkIndex}.operations`));
          }
        });
        const detailCount = form.areas.filter(area => area.area_type === '明细清单').length;
        let detailIndex = 0;
        form.areas.forEach((area, areaIndex) => {
          const areaTarget = {
            editorSection: 'forms',
            focusKind: 'area',
            focusRef: area.area_ref
          };
          if (area.area_type === '明细清单') detailIndex += 1;
          const groupLabel = area.area_type === '基本信息'
            ? '主表字段'
            : area.area_type === '明细清单'
              ? `明细表${detailIndex}`
              : '待确认字段';
          if (area.area_type === '明细清单' && detailCount > 1 && !text(area.area_title).trim()) {
            addWarning(
              `${formLabel}包含${detailCount}张明细表，但${groupLabel}的标题为空，当前无法区分该明细表。`,
              atField(areaTarget, `forms.${formIndex}.areas.${areaIndex}.area_title`),
              ['填写能够区分该明细表用途的标题。']
            );
          }
          if (!area.area_type) {
            area.items.forEach((item, itemIndex) => {
              addWarning(
                `${formLabel}的字段“${item.item_name || `字段${itemIndex + 1}`}”尚未确定字段归属。`,
                atField(areaTarget, `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.assignment`),
                ['字段属于主表时选择“主表”；字段属于明细表时选择一张具体明细表。']
              );
            });
          }
          if (!area.items.length && area.area_type === '明细清单') {
            addWarning(
              `${formLabel}的${groupLabel}当前没有字段。`,
              areaTarget,
              ['该明细表确实存在时，至少录入1个字段；不需要该明细表时将其删除。']
            );
          }
          area.items.forEach((item, itemIndex) => {
            const itemLabel = item.item_name || `字段${itemIndex + 1}`;
            const itemPath = `forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}`;
            if (item.value_origin_mode === 'pending_confirmation') {
              addWarning(`${formLabel}的“${itemLabel}”取值方式待确认。`, atField(areaTarget, `${itemPath}.value_origin_mode`));
            }
            if (item.value_origin_mode === 'depends_on_data' && !(item.source_links || []).length) {
              addWarning(`${formLabel}的“${itemLabel}”选择依赖数据取得，但尚未登记取值来源。`, atField(areaTarget, `${itemPath}.source_links`));
            }
            (item.source_links || []).forEach((link, linkIndex) => {
              const linkPath = `${itemPath}.source_links.${linkIndex}`;
              if (link.source_type === 'external_system') {
                if (!text(link.source_system_name).trim()) {
                  addWarning(`${formLabel}的“${itemLabel}”已选择外部系统来源，但尚未填写外部系统名称。`, atField(areaTarget, `${linkPath}.source_system_name`));
                }
                if (!text(link.source_data_name).trim()) {
                  addWarning(`${formLabel}的“${itemLabel}”已选择外部系统来源，但尚未填写来源数据名称。`, atField(areaTarget, `${linkPath}.source_data_name`));
                }
              } else if (!link.source_data_ref) {
                addWarning(`${formLabel}的“${itemLabel}”已选择本流程数据来源，但尚未选择来源数据。`, atField(areaTarget, `${linkPath}.source_data_ref`));
              }
            });
          });
        });
      });
      (data.migration?.legacy_cross_department_records || []).forEach((record, index) => {
        if (record.conversion_status !== 'needs_manual_completion') return;
        const source = record.source_handoff || {};
        const sourceLabel = text(source.counterparty_behavior_name || source.requested_matter).trim() || `旧版跨部门记录${index + 1}`;
        const behaviorRef = text(record.created_behavior_ref || source.counterparty_behavior_ref).trim();
        if (!behaviorRef || !data.behaviors.some(item => item.behavior_ref === behaviorRef)) {
          addWarning(`${sourceLabel}尚未形成可编辑的业务行为。`, {
            editorSection: 'process', processSection: 'behaviors'
          }, ['根据原记录补建实际执行部门、岗位和办理动作明确的业务行为。']);
        }
        if (!(record.created_relation_refs || []).length) {
          addWarning(`${sourceLabel}的流程方向或衔接位置无法唯一转换。`, {
            editorSection: 'process', processSection: 'relations'
          }, ['根据实际先后顺序补充普通流程关系；不要按旧记录名称猜测方向。']);
        }
        const hasLegacyData = Boolean(source.transfer_data_ref || source.returned_data_ref);
        if (hasLegacyData && !(record.created_data_link_refs || []).length) {
          const dataRef = source.transfer_data_ref || source.returned_data_ref;
          addWarning(`${sourceLabel}的数据传递或返回关系无法唯一转换。`, {
            editorSection: 'process',
            processSection: 'data',
            focusKind: 'data',
            focusRef: data.data_objects.find(item => item.data_ref === dataRef)?.data_ref || ''
          }, ['在“输出物与数据”中登记实际创建、更新或使用该数据的业务行为。']);
        }
      });
      return [...new Map(warnings.map(item => [item.message, item])).values()];
    }

    function sanitizeFilenamePart(value, fallback) {
      const cleaned = text(value).trim().replace(/[\\/:*?"<>|\r\n]+/g, '_').replace(/\s+/g, ' ').slice(0, 80);
      return cleaned || fallback;
    }

    function exportTimestamp(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
    }

    function downloadJson(data) {
      const now = new Date();
      const department = sanitizeFilenamePart(data.export_meta.initiating_department, '未明确部门');
      const processName = sanitizeFilenamePart(data.process.process_name, '未命名流程');
      const fileName = `未审核-${department}-${processName}-${exportTimestamp(now)}.json`;
      const blob = new Blob([`${JSON.stringify(data, null, 2)}\n`], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      return fileName;
    }

    async function ensureCompatibleValidationService(retryAction = '再次导出') {
      let schema;
      try {
        const response = await fetch('/api/schema', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        schema = await readJsonResponse(response, '3001校验接口未返回结构化数据。');
      } catch (_error) {
        throw new Error(`3001校验服务暂时不可用。请保持当前页面打开，待服务恢复后${retryAction}。`);
      }

      const actualVersion = text(schema?.properties?.schema_version?.const).trim();
      if (actualVersion !== EXPECTED_EXPORT_SCHEMA_VERSION) {
        throw new Error(
          `3001前端与服务端版本不一致。当前页面使用“${EXPECTED_EXPORT_SCHEMA_VERSION}”，`
          + `服务端提供“${actualVersion || '未知版本'}”。请保持当前页面打开，待维护人员重启3001服务后${retryAction}。`
        );
      }
    }

    function validationErrorLocation(error) {
      const basePath = text(error?.path).trim() || '/';
      const missingProperty = text(error?.params?.missingProperty).trim();
      if (!missingProperty) return basePath;
      return basePath === '/' ? `/${missingProperty}` : `${basePath}/${missingProperty}`;
    }

    function structureScoreTargetForValidationError(error, snapshot) {
      const location = validationErrorLocation(error);
      const segments = location.split('/').filter(Boolean);
      const focusPath = segments.join('.');
      const root = segments[0];
      const index = Number(segments[1]);
      if (root === 'export_meta') return { editorSection: 'basic', focusPath };
      if (root === 'process') {
        return {
          editorSection: ['purpose', 'scope'].includes(segments[1]) ? 'profile' : 'basic',
          focusPath
        };
      }
      if (root === 'behaviors' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: snapshot.behaviors?.[index]?.behavior_ref || '',
          focusPath
        };
      }
      if (root === 'flow_relations' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'relations',
          focusKind: 'relation',
          focusRef: snapshot.flow_relations?.[index]?.relation_ref || '',
          focusPath
        };
      }
      if (root === 'data_objects' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'data',
          focusKind: 'data',
          focusRef: snapshot.data_objects?.[index]?.data_ref || '',
          focusPath
        };
      }
      if (root === 'forms' && Number.isInteger(index)) {
        const areaIndex = Number(segments[3]);
        if (segments[2] === 'areas' && Number.isInteger(areaIndex)) {
          return {
            editorSection: 'forms',
            focusKind: 'area',
            focusRef: snapshot.forms?.[index]?.areas?.[areaIndex]?.area_ref || '',
            focusPath
          };
        }
        return {
          editorSection: 'forms',
          focusKind: 'form',
          focusRef: snapshot.forms?.[index]?.form_ref || '',
          focusPath
        };
      }
      if (root === 'terms') return { editorSection: 'terms', focusPath };
      return {};
    }

    function structureScoreValidationErrors(result, snapshot) {
      const errors = Array.isArray(result?.errors) ? result.errors : [];
      return errors.slice(0, 8).map(error => {
        const location = validationErrorLocation(error);
        const detail = text(error?.message).trim() || '结构规则检查未通过';
        return {
          message: `技术结构检查未通过：${location} ${detail}`,
          target: structureScoreTargetForValidationError(error, snapshot)
        };
      });
    }

    async function validateStructureScoreDocument(data) {
      const response = await fetch('/api/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return readJsonResponse(response, '3001校验接口未返回结构化数据。');
    }

    function commitStructureScoreState(context, nextState) {
      if (context.runId !== structureScoreRunId) return;
      if (context.candidateIndex !== currentIndex) return;
      if (context.documentKey !== currentStructureScoreKey()) return;
      structureScoreState = {
        ...nextState,
        candidateIndex: context.candidateIndex,
        documentKey: context.documentKey
      };
      if (activeWorkspaceTab === 'editor' && activeEditorSection === 'export') render();
    }

    async function runStructureScore(context) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring) return;
      const checks = {
        parse: false,
        compatibility: false,
        validation: false,
        roundTrip: false,
        preservation: false
      };
      const errors = [];
      let parsed;
      let roundTripDocument;

      try {
        parsed = JSON.parse(JSON.stringify(context.snapshot));
        checks.parse = true;
        const migrated = globalThis.ProcessGovernanceMigration.migrateDocument(parsed, { departments: DEPARTMENTS });
        checks.compatibility = parsed.schema_version === EXPECTED_EXPORT_SCHEMA_VERSION
          && migrated.length === 1
          && migrated[0].schema_version === EXPECTED_EXPORT_SCHEMA_VERSION;
        roundTripDocument = globalThis.ProcessGovernanceMigration.migrateDocument(
          JSON.parse(JSON.stringify(migrated[0])),
          { departments: DEPARTMENTS }
        )[0];
        checks.preservation = scoring.stableStringify(scoring.semanticProjection(migrated[0]))
          === scoring.stableStringify(scoring.semanticProjection(roundTripDocument));
      } catch (_error) {
        errors.push({ message: '当前页面内容无法完成JSON序列化和回读。' });
      }

      if (!checks.compatibility && checks.parse) {
        errors.push({ message: `当前页面内容不是${EXPECTED_EXPORT_SCHEMA_VERSION}。` });
      }
      if (!checks.preservation && roundTripDocument) {
        errors.push({ message: '当前页面内容在导出回读后发生变化，业务字段或技术引用未能完整保持。' });
      }

      try {
        await ensureCompatibleValidationService('重新评分');
        if (parsed) {
          const currentValidation = await validateStructureScoreDocument(parsed);
          checks.validation = Boolean(currentValidation?.valid);
          if (!checks.validation) {
            errors.push(...structureScoreValidationErrors(currentValidation, parsed));
          }
        }
        if (roundTripDocument) {
          const roundTripValidation = await validateStructureScoreDocument(roundTripDocument);
          checks.roundTrip = Boolean(roundTripValidation?.valid);
          if (!checks.roundTrip) {
            errors.push(...structureScoreValidationErrors(roundTripValidation, roundTripDocument));
          }
        }
      } catch (error) {
        const message = text(error?.message).trim()
          || '3001校验服务暂时不可用。请保持当前页面打开，待服务恢复后重新评分。';
        commitStructureScoreState(context, {
          status: 'unavailable',
          result: scoring.finalize(context.contentResult, {
            status: 'unavailable',
            checks,
            message
          }),
          message
        });
        return;
      }

      const deduplicatedErrors = [...new Map(errors.map(item => [item.message, item])).values()];
      commitStructureScoreState(context, {
        status: 'ready',
        result: scoring.finalize(context.contentResult, {
          status: 'ready',
          checks,
          errors: deduplicatedErrors
        }),
        message: ''
      });
    }

    async function exportCurrent() {
      const entry = currentEntry();
      if (!entry) return false;
      const exportDocument = clone(entry.data);
      exportDocument.export_meta.exported_at = new Date().toISOString();
      setBusy(true, '正在检查当前文件中的技术引用……');
      try {
        await ensureCompatibleValidationService();
        const roundTripDocument = globalThis.ProcessGovernanceMigration.migrateDocument(
          JSON.parse(JSON.stringify(exportDocument)),
          { departments: DEPARTMENTS }
        )[0];
        if (JSON.stringify(roundTripDocument) !== JSON.stringify(exportDocument)) {
          showStatus('当前内容在导出回读后会发生丢失，暂不能导出。当前草稿保持不变。', 'error');
          return false;
        }
        const response = await fetch('/api/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: exportDocument })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) {
          const errors = Array.isArray(result.errors) ? result.errors : [];
          const referenceErrorsOnly = errors.length > 0 && errors.every(error => error.keyword === 'localReference');
          if (referenceErrorsOnly) {
            const details = errors.slice(0, 5).map(error => `${validationErrorLocation(error)}：${error.message}`).join('；');
            showStatus(`当前流程文件中的技术引用已断开或重复，暂不能导出。${details}`, 'error');
          } else {
            const locations = [...new Set(errors.slice(0, 5).map(validationErrorLocation))].join('、');
            const locationText = locations ? `涉及位置：${locations}。` : '';
            showStatus(
              `当前流程文件不符合3001单流程导出格式，暂不能导出。${locationText}请保持当前页面内容，并联系维护人员处理。`,
              'error'
            );
          }
          return false;
        }
        const warnings = businessWarnings(exportDocument);
        if (warnings.length) {
          const preview = warnings.slice(0, 8).map((item, index) => {
            const suggestionItems = warningSuggestions(item);
            const suggestions = suggestionItems
              .map((suggestion, suggestionIndex) => `${suggestionItems.length > 1 ? `建议${suggestionIndex + 1}` : '建议'}：${suggestion}`)
              .join('\n   ');
            return `${index + 1}. 当前情况：${item.message}\n   ${suggestions}`;
          }).join('\n');
          const more = warnings.length > 8 ? `\n另有 ${warnings.length - 8} 项。` : '';
          if (!window.confirm(`当前是未审核草稿，以下事项仍需处理或登记为待定：\n\n${preview}${more}\n\n仍然导出当前草稿吗？`)) {
            showStatus('已取消导出，当前页面内容仍保留。');
            return false;
          }
        }
        const fileName = downloadJson(exportDocument);
        entry.data = exportDocument;
        entry.forceDirty = false;
        graphStateManager.markBaseline(candidateStateKey(entry), entry.data);
        refreshCandidateDirty(entry);
        showStatus(`已导出 ${fileName}。请妥善保存；再次编制时可重新导入3001。`, 'success');
        updateCandidateList();
        return true;
      } catch (error) {
        showStatus(`导出失败：${error.message}`, 'error');
        return false;
      } finally {
        setBusy(false);
      }
    }

    function protect(action) {
      if (!hasDirtyCandidates()) {
        action();
        return;
      }
      if (!currentEntry()?.dirty) {
        currentIndex = candidates.findIndex(item => item.dirty);
        render();
      }
      protectedAction = action;
      protectedActionInvoker = document.activeElement instanceof HTMLElement
        ? document.activeElement
        : null;
      unsavedModal.classList.add('show');
      unsavedModal.setAttribute('aria-hidden', 'false');
    }

    function closeProtectedModal() {
      if (protectedActionInvoker?.isConnected) {
        protectedActionInvoker.focus();
      } else if (unsavedModal.contains(document.activeElement)) {
        document.activeElement.blur();
      }
      protectedActionInvoker = null;
      unsavedModal.classList.remove('show');
      unsavedModal.setAttribute('aria-hidden', 'true');
    }

    async function sha256File(file) {
      if (!crypto.subtle) return null;
      const bytes = await file.arrayBuffer();
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(hash)).map(value => value.toString(16).padStart(2, '0')).join('');
    }

    async function importJson(file) {
      setBusy(true, `正在读取 ${file.name}……`);
      try {
        const parsed = JSON.parse(await file.text());
        const supported = [
          ...globalThis.ProcessGovernanceMigration.SUPPORTED_PROCESS_VERSIONS,
          globalThis.ProcessGovernanceMigration.LEGACY_DOCUMENT_VERSION
        ];
        if (!supported.includes(parsed.schema_version)) {
          throw new Error(`不支持的结构化文件版本：${parsed.schema_version || '未提供'}`);
        }
        const sourceValidation = await validateGraphDocument(parsed);
        if (!sourceValidation.valid) {
          const firstError = sourceValidation.errors?.[0];
          throw new Error(firstError ? `${validationErrorLocation(firstError)}：${firstError.message}` : '源文件未通过结构与本地引用检查');
        }
        const fileSha256 = parsed.schema_version === globalThis.ProcessGovernanceMigration.LEGACY_DOCUMENT_VERSION
          ? await sha256File(file)
          : null;
        const migratedDocuments = globalThis.ProcessGovernanceMigration.migrateDocument(parsed, {
          fileName: file.name,
          fileSha256,
          departments: DEPARTMENTS
        });
        const targetValidations = await Promise.all(migratedDocuments.map(validateGraphDocument));
        const failedTarget = targetValidations.find(result => !result.valid);
        if (failedTarget) {
          const firstError = failedTarget.errors?.[0];
          throw new Error(firstError ? `${validationErrorLocation(firstError)}：${firstError.message}` : '迁移副本未通过v6结构校验');
        }
        const migrated = parsed.schema_version !== EXPECTED_EXPORT_SCHEMA_VERSION;
        const nextCandidates = migratedDocuments.map(data => ({
          data: clone(data),
          dirty: migrated,
          forceDirty: migrated,
          origin: parsed.schema_version
        }));
        destroyDiagram();
        destroyDataDiagram();
        graphStateManager.clear();
        candidates = nextCandidates;
        candidates.forEach(entry => registerCandidateState(entry, { forceDirty: migrated }));
        currentIndex = 0;
        selectInitialTabAfterImport();
        render();
        showStatus(
          candidates.length > 1
            ? `历史文件包含 ${candidates.length} 条流程，全部通过v6校验后已拆成候选。每条流程必须单独导出。`
            : migrated
              ? '历史结构化文件已无损迁移到v6，当前内容标记为未导出。'
              : 'v6结构化文件已导入当前页面。',
          'success'
        );
      } catch (error) {
        showStatus(`结构化文件导入失败：${error.message}。当前草稿、图状态和撤销记录保持不变。`, 'error');
      } finally {
        setBusy(false);
        jsonInput.value = '';
      }
    }

    document.getElementById('newProcessButton').addEventListener('click', () => protect(startNewProcess));
    document.getElementById('importJsonButton').addEventListener('click', () => protect(() => jsonInput.click()));
    document.getElementById('exportButton').addEventListener('click', exportCurrent);
    document.getElementById('clearButton').addEventListener('click', () => protect(clearPage));

    jsonInput.addEventListener('change', () => {
      const file = jsonInput.files?.[0];
      if (file) importJson(file);
    });

    candidateList.addEventListener('click', event => {
      const button = event.target.closest('[data-candidate-index]');
      if (!button) return;
      const nextIndex = Number(button.dataset.candidateIndex);
      if (!Number.isInteger(nextIndex) || !candidates[nextIndex] || nextIndex === currentIndex) return;
      captureGraphViewport();
      currentIndex = nextIndex;
      graphSelection = null;
      flowRelationDraft = null;
      activeDataRef = graphStateManager.view(candidateStateKey()).data.dataRef || '';
      selectInitialTabAfterImport();
      render();
    });

    workspaceViewSwitch.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    workspace.addEventListener('input', event => {
      const graphProperty = event.target.closest('[data-graph-property]');
      if (graphProperty && graphSelection?.draft) {
        const key = graphProperty.dataset.graphProperty;
        graphSelection.draft[key] = key === 'timing' || key === 'actor_department_data_ref'
          ? nullable(graphProperty.value)
          : graphProperty.value;
        return;
      }
      const dataProperty = event.target.closest('[data-graph-data-property]');
      if (dataProperty && graphSelection?.kind === 'data' && graphSelection.draft) {
        graphSelection.draft[dataProperty.dataset.graphDataProperty] = dataProperty.value;
        return;
      }
      if (event.target.matches('[data-graph-relation-condition]') && flowRelationDraft) {
        flowRelationDraft.condition = event.target.value;
        return;
      }
      const target = event.target.closest('[data-bind]');
      if (!target || !currentDocument()) return;
      if (target.dataset.bind === 'process.owning_department') return;
      const kind = target.dataset.kind;
      const value = kind === 'boolean' ? target.checked : kind === 'nullable' ? nullable(target.value) : target.value;
      setByPath(target.dataset.bind, value);
      touch();
      const behaviorMatch = target.dataset.bind.match(/^behaviors\.(\d+)\.behavior_name$/);
      if (behaviorMatch) {
        const behaviorIndex = Number(behaviorMatch[1]);
        const behavior = currentDocument().behaviors[behaviorIndex];
        const selector = behavior
          ? workspace.querySelector(`[data-action="select-behavior"][data-ref="${CSS.escape(behavior.behavior_ref)}"]`)
          : null;
        const selectorLabel = selector?.querySelector('span:last-child');
        const flowIndex = behavior
          ? flowItems().findIndex(item => item.kind === 'behavior' && item.behavior.behavior_ref === behavior.behavior_ref)
          : -1;
        if (selectorLabel) selectorLabel.textContent = `${flowIndex + 1}. ${behavior.behavior_name || '未命名业务行为'}`;
      }
      const formMatch = target.dataset.bind.match(/^forms\.(\d+)\.form_name$/);
      if (formMatch) {
        const formIndex = Number(formMatch[1]);
        const form = currentDocument().forms[formIndex];
        const selector = form
          ? workspace.querySelector(`[data-action="select-form"][data-ref="${CSS.escape(form.form_ref)}"]`)
          : null;
        const selectorLabel = selector?.querySelector('span:first-child');
        if (selectorLabel) selectorLabel.textContent = `${formIndex + 1}. ${form.form_name || '未命名表单或记录'}`;
      }
      const relationMatch = target.dataset.bind.match(/^flow_relations\.(\d+)\./);
      if (relationMatch) {
        const relationIndex = Number(relationMatch[1]);
        const relation = currentDocument().flow_relations[relationIndex];
        if (relation) {
          updateOrderedSelectorLabel('relation', relation.relation_ref, relationSelectorLabel(relation, relationIndex));
        }
      }
      const dataMatch = target.dataset.bind.match(/^data_objects\.(\d+)\./);
      if (dataMatch) {
        const dataIndex = Number(dataMatch[1]);
        const dataObject = currentDocument().data_objects[dataIndex];
        if (dataObject) {
          updateOrderedSelectorLabel('data', dataObject.data_ref, dataSelectorLabel(dataObject, dataIndex));
        }
      }
      const termMatch = target.dataset.bind.match(/^terms\.(\d+)\.term_name$/);
      if (termMatch) {
        const termIndex = Number(termMatch[1]);
        const term = currentDocument().terms[termIndex];
        if (term) updateOrderedSelectorLabel('term', term.term_ref, `${termIndex + 1}. ${term.term_name || '未命名术语'}`);
      }
      if (target.dataset.bind === 'process.process_name') updateCandidateList();
      refreshPreviewAvailability();
    });

    workspace.addEventListener('change', event => {
      const target = event.target;
      if (target.matches('[data-graph-relation-type]') && flowRelationDraft) {
        flowRelationDraft.relation_type = target.value;
        if (target.value) flowRelationDraft.stage = 'source';
        render();
        return;
      }
      if (target.matches('[data-graph-property="actor_assignment_mode"]') && graphSelection?.kind === 'behavior') {
        const draft = graphSelection.draft;
        draft.actor_assignment_mode = target.value;
        draft.current_actor_role = target.value === 'company_wide' ? '全公司' : '';
        draft.actor_department_data_ref = null;
        draft.actor_position_rule = '';
        render();
        return;
      }
      if (target.matches('[data-graph-actor-department]') && graphSelection?.kind === 'behavior') {
        graphSelection.draft.current_actor_role = combineActorRole(target.value, '');
        render();
        return;
      }
      if (target.matches('[data-graph-actor-position]') && graphSelection?.kind === 'behavior') {
        const department = workspace.querySelector('[data-graph-actor-department]')?.value || '';
        graphSelection.draft.current_actor_role = combineActorRole(department, target.value);
        return;
      }
      if (target.matches('[data-graph-countersign]') && graphSelection?.kind === 'behavior') {
        graphSelection.draft.countersign_all_required = target.checked;
        return;
      }
      if (target.matches('[data-graph-countersign-target]') && graphSelection?.kind === 'behavior') {
        graphSelection.draft.countersign_target_departments = Array.from(
          workspace.querySelectorAll('[data-graph-countersign-target]:checked')
        ).map(item => item.value);
        return;
      }
      if (target.matches('[data-graph-data-focus]')) {
        captureGraphViewport();
        activeDataRef = target.value;
        const item = ensureActiveGraphDataObject();
        graphSelection = item ? { kind: 'data', ref: item.data_ref, draft: clone(item) } : null;
        graphStateManager.updateView(candidateStateKey(), { data: { dataRef: activeDataRef, zoom: null, pan: null } });
        render();
        return;
      }
      if (target.matches('[data-graph-data-behavior]') && graphSelection?.kind === 'data-behavior-choice') {
        graphSelection.behaviorRef = target.value;
        render();
        return;
      }
      if (target.matches('[data-graph-data-operation]') && graphSelection?.kind === 'data-edge') {
        graphSelection.operations = Array.from(workspace.querySelectorAll('[data-graph-data-operation]:checked')).map(item => item.value);
        return;
      }
      if (target.matches('[data-bind="process.owning_department"]')) {
        openOwningDepartmentChange(target.value);
        return;
      }
      if (target.matches('[data-form-item-assignment]')) {
        const formIndex = Number(target.dataset.formIndex);
        if (!moveFormItemToAssignment(formIndex, text(target.dataset.itemRef), target.value)) return;
        touch();
        render();
        return;
      }
      if (target.matches('[data-actor-assignment-mode]')) {
        const index = Number(target.dataset.actorAssignmentMode);
        const behavior = currentDocument()?.behaviors?.[index];
        if (!behavior) return;
        const previousMode = actorAssignmentMode(behavior);
        const nextMode = ACTOR_ASSIGNMENT_MODE_VALUES.has(target.value) ? target.value : 'fixed_department';
        if (nextMode === previousMode) return;
        if (
          previousMode === 'dynamic_from_data'
          && nextMode !== 'dynamic_from_data'
          && (behavior.actor_department_data_ref || text(behavior.actor_position_rule).trim())
          && !window.confirm('切换执行主体确定方式后，将清空当前的执行部门来源数据和岗位确定规则。确定继续吗？')
        ) {
          render();
          return;
        }
        behavior.actor_assignment_mode = nextMode;
        if (nextMode === 'company_wide') {
          behavior.current_actor_role = '全公司';
          behavior.actor_department_data_ref = null;
          behavior.actor_position_rule = '';
        } else if (nextMode === 'dynamic_from_data') {
          behavior.current_actor_role = '';
          behavior.actor_department_data_ref = null;
          behavior.actor_position_rule = '';
        } else {
          behavior.current_actor_role = '';
          behavior.actor_department_data_ref = null;
          behavior.actor_position_rule = '';
        }
        touch();
        render();
        return;
      }
      if (target.matches('[data-actor-department]')) {
        const index = Number(target.dataset.actorDepartment);
        const behavior = currentDocument()?.behaviors?.[index];
        if (!behavior) return;
        const nextValue = combineActorRole(target.value, '');
        behavior.actor_assignment_mode = 'fixed_department';
        behavior.current_actor_role = nextValue;
        behavior.actor_department_data_ref = null;
        behavior.actor_position_rule = '';
        touch();
        render();
        return;
      }
      if (target.matches('[data-actor-position]')) {
        const index = Number(target.dataset.actorPosition);
        const behavior = currentDocument()?.behaviors?.[index];
        const department = workspace.querySelector(`[data-actor-department="${index}"]`)?.value || '';
        if (!behavior) return;
        behavior.actor_assignment_mode = 'fixed_department';
        behavior.current_actor_role = combineActorRole(department, target.value);
        touch();
        render();
        return;
      }
      if (target.matches('[data-list-bind]')) {
        const pathKey = target.dataset.listBind;
        const values = Array.from(workspace.querySelectorAll(`input[data-list-bind="${pathKey}"]:checked`)).map(input => input.value);
        setByPath(pathKey, values);
        touch();
        refreshPreviewAvailability();
        return;
      }
      const fieldSourceTypeMatch = target.dataset.bind?.match(/^forms\.(\d+)\.areas\.(\d+)\.items\.(\d+)\.source_links\.(\d+)\.source_type$/);
      if (fieldSourceTypeMatch) {
        const formIndex = Number(fieldSourceTypeMatch[1]);
        const areaIndex = Number(fieldSourceTypeMatch[2]);
        const itemIndex = Number(fieldSourceTypeMatch[3]);
        const linkIndex = Number(fieldSourceTypeMatch[4]);
        const link = currentDocument()?.forms?.[formIndex]?.areas?.[areaIndex]?.items?.[itemIndex]?.source_links?.[linkIndex];
        if (!link) return;
        if (link.source_type === 'external_system') {
          link.source_data_ref = null;
          link.source_system_name = text(link.source_system_name);
          link.source_data_name = text(link.source_data_name);
        } else {
          link.source_type = 'process_data';
          link.source_data_ref = link.source_data_ref || currentDocument().data_objects[0]?.data_ref || null;
          link.source_system_name = '';
          link.source_data_name = '';
        }
        render();
        return;
      }
      if (target.matches('[data-bind]') && (
        /^behaviors\.\d+\.node_type$/.test(target.dataset.bind)
        || /^behaviors\.\d+\.(actor_department_data_ref|actor_position_rule)$/.test(target.dataset.bind)
        || /^data_objects\.\d+\.(information_type|behavior_links\.\d+\.(behavior_ref|operation)|source_relations\.\d+\.availability_mode)$/.test(target.dataset.bind)
        || /^forms\.\d+\.form_design_state$/.test(target.dataset.bind)
        || /^forms\.\d+\.behavior_links\.\d+\.behavior_ref$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.items\.\d+\.(business_data_ref|value_origin_mode)$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.items\.\d+\.item_type$/.test(target.dataset.bind)
      )) {
        render();
      }
    });

    workspace.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    workspace.addEventListener('pointerdown', event => {
      const handle = event.target.closest('[data-drag-handle]');
      if (!handle || event.button !== 0) return;
      if (!beginSortableDrag(handle, event.pointerType || 'pointer', event.pointerId)) return;
      event.preventDefault();
    });

    workspace.addEventListener('pointermove', event => {
      if (!sortableDragState || sortableDragState.pointerId !== event.pointerId) return;
      event.preventDefault();
      sortableTargetFromPointer(event.clientX, event.clientY);
    });

    workspace.addEventListener('pointerup', event => {
      if (!sortableDragState || sortableDragState.pointerId !== event.pointerId) return;
      event.preventDefault();
      sortableTargetFromPointer(event.clientX, event.clientY);
      finishSortableDrag(true);
    });

    workspace.addEventListener('pointercancel', event => {
      if (!sortableDragState || sortableDragState.pointerId !== event.pointerId) return;
      finishSortableDrag(false);
    });

    workspace.addEventListener('keydown', event => {
      const handle = event.target.closest('[data-drag-handle]');
      if (!handle && !sortableDragState) return;
      if (!sortableDragState && handle && (event.key === ' ' || event.key === 'Enter')) {
        event.preventDefault();
        beginSortableDrag(handle, 'keyboard');
        return;
      }
      if (!sortableDragState || sortableDragState.inputMode !== 'keyboard') return;
      if (event.key === 'ArrowUp' || event.key === 'ArrowLeft') {
        event.preventDefault();
        moveSortableTarget(sortableDragState.targetIndex - 1);
        return;
      }
      if (event.key === 'ArrowDown' || event.key === 'ArrowRight') {
        event.preventDefault();
        moveSortableTarget(sortableDragState.targetIndex + 1);
        return;
      }
      if (event.key === ' ' || event.key === 'Enter') {
        event.preventDefault();
        finishSortableDrag(true);
        return;
      }
      if (event.key === 'Escape') {
        event.preventDefault();
        event.stopPropagation();
        finishSortableDrag(false);
      }
    });

    document.getElementById('cancelOwningDepartmentChangeButton').addEventListener('click', () => {
      closeOwningDepartmentChange();
      render();
    });
    document.getElementById('exportBeforeOwningDepartmentChangeButton').addEventListener('click', exportCurrent);
    confirmOwningDepartmentChangeButton.addEventListener('click', confirmOwningDepartmentChange);

    document.getElementById('cancelProtectedButton').addEventListener('click', () => {
      protectedAction = null;
      closeProtectedModal();
    });

    document.getElementById('discardProtectedButton').addEventListener('click', () => {
      const action = protectedAction;
      protectedAction = null;
      closeProtectedModal();
      if (action) action();
    });

    document.getElementById('exportProtectedButton').addEventListener('click', async () => {
      const exported = await exportCurrent();
      if (!exported) return;
      const nextDirtyIndex = candidates.findIndex(item => item.dirty);
      if (nextDirtyIndex >= 0) {
        currentIndex = nextDirtyIndex;
        render();
        showStatus('还有其他候选流程包含未导出的修改，请继续导出或选择放弃。');
        return;
      }
      const action = protectedAction;
      protectedAction = null;
      closeProtectedModal();
      if (action) action();
    });

    window.addEventListener('keydown', event => {
      if (event.key !== 'Escape') return;
      if (flowRelationDraft) {
        flowRelationDraft = null;
        render();
        return;
      }
      if (sortableDragState) return finishSortableDrag(false);
      if (owningDepartmentChangeState) {
        closeOwningDepartmentChange();
        render();
        return;
      }
      if (expandedReviewPatternId) {
        expandedReviewPatternId = '';
        render();
        return;
      }
      if (diagramExpanded) {
        diagramExpanded = false;
        render();
      }
    });

    window.addEventListener('beforeunload', event => {
      if (!hasDirtyCandidates()) return;
      event.preventDefault();
      event.returnValue = '';
    });

    render();
    loadEditorCatalogs();
    loadVersionHistory();
    ensureCompatibleValidationService('再次操作').catch(error => showStatus(error.message, 'error'));
  </script>
</body>
</html>
