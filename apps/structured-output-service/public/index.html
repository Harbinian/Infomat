<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3001 单流程治理编制工具</title>
  <style>
    :root {
      --paper: #f3ead7;
      --paper-deep: #e9ddc5;
      --card: rgba(255, 252, 243, 0.94);
      --ink: #2f302b;
      --muted: #6d6a60;
      --line: #cbbd9e;
      --red: #8c3f33;
      --red-soft: #f2dfd8;
      --sage: #66745f;
      --sage-soft: #dfe7db;
      --blue: #5d6f78;
      --gold: #9b783d;
      --shadow: 0 12px 32px rgba(76, 58, 33, 0.1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 4%, rgba(140, 63, 51, 0.08), transparent 28rem),
        linear-gradient(145deg, #efe4cc, var(--paper) 45%, #eee4d2);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      min-height: 100vh;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: 0.55; }

    .page {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 48px;
    }

    .hero {
      padding: 26px 30px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(250, 244, 230, 0.9);
      box-shadow: var(--shadow);
    }

    .eyebrow {
      color: var(--red);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 6px;
      font-family: "SimSun", "STSong", serif;
      font-size: clamp(28px, 4vw, 42px);
      font-weight: 700;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.75;
    }

    .notice {
      margin-top: 16px;
      padding: 12px 15px;
      border-left: 4px solid var(--sage);
      border-radius: 0 10px 10px 0;
      background: var(--sage-soft);
      color: #3e4c3b;
      font-weight: 700;
    }

    .boundary {
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .button {
      min-height: 42px;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: var(--ink);
      background: #fffaf0;
      font-weight: 700;
    }

    .button:hover { border-color: var(--gold); }
    .button.primary { color: #fff; border-color: var(--red); background: var(--red); }
    .button.secondary { color: #fff; border-color: var(--sage); background: var(--sage); }
    .button.danger { color: var(--red); border-color: #b98578; background: var(--red-soft); }
    .button.small { min-height: 34px; padding: 6px 10px; font-size: 13px; }

    .status {
      display: none;
      margin-top: 14px;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: var(--card);
      line-height: 1.6;
    }

    .status.show { display: block; }
    .status.error { color: #7b2f27; border-color: #c18a7d; background: #f7e5df; }
    .status.success { color: #40543b; border-color: #91a38a; background: #e8efe4; }

    .candidate-bar {
      display: none;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--paper-deep);
    }

    .candidate-bar.show { display: flex; }
    .candidate-bar select { min-width: min(560px, 70vw); }
    .candidate-note { color: var(--muted); font-size: 13px; }

    .workspace { margin-top: 18px; }
    .workspace-tabs-shell {
      position: sticky;
      top: 0;
      z-index: 20;
      margin-bottom: 14px;
      padding: 8px 0;
      background: linear-gradient(180deg, rgba(243, 234, 215, 0.98), rgba(243, 234, 215, 0.92));
      backdrop-filter: blur(8px);
    }

    .workspace-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.96);
      box-shadow: 0 6px 18px rgba(76, 58, 33, 0.08);
    }

    .workspace-tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 8px 14px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
    }

    .workspace-tab:hover { color: var(--ink); background: var(--paper-deep); }
    .workspace-tab.active { color: #fff; background: var(--red); }
    .tab-status {
      padding: 2px 7px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .workspace-tab:not(.active) .tab-status.ready { color: #40543b; background: var(--sage-soft); }
    .workspace-tab:not(.active) .tab-status.warning { color: #7b2f27; background: var(--red-soft); }
    .workspace-tab:not(.active) .tab-status.waiting { color: var(--muted); background: #f4f0e7; }
    .tab-panel[hidden] { display: none; }

    .editor-navigation,
    .process-navigation {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 252, 243, 0.88);
      scrollbar-width: thin;
    }

    .editor-section-tab,
    .process-section-tab {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 7px 13px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-weight: 700;
      white-space: nowrap;
    }

    .editor-section-tab:hover,
    .process-section-tab:hover {
      color: var(--ink);
      border-color: var(--line);
      background: var(--paper-deep);
    }

    .editor-section-tab.active {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }

    .process-section-tab.active {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }

    .preview-guidance {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid #b7c2b0;
      border-left: 5px solid var(--sage);
      border-radius: 10px;
      background: var(--sage-soft);
    }

    .preview-guidance strong { display: block; margin-bottom: 4px; color: #40543b; }
    .preview-guidance p { margin: 0; color: #4d5b49; font-size: 13px; line-height: 1.65; }
    .preview-ready-callout {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 650px;
      padding-left: 16px;
      border-left: 1px solid #aab7a4;
    }

    .preview-ready-callout[hidden] { display: none; }
    .preview-ready-callout p { color: #2f472b; font-weight: 700; }

    .diagram-section { overflow: visible; }
    body.diagram-overlay-open { overflow: hidden; }
    .diagram-section.diagram-expanded {
      position: fixed;
      inset: 12px;
      z-index: 90;
      margin: 0;
      overflow: auto;
      background: #fffaf0;
      box-shadow: 0 26px 80px rgba(37, 31, 23, 0.34);
    }

    .diagram-section.diagram-expanded .diagram-canvas {
      height: max(520px, calc(100vh - 350px));
    }

    .diagram-toolbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .diagram-toolbar h2 { margin: 0 0 5px; font-family: "SimSun", serif; font-size: 22px; }
    .diagram-toolbar p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
    .diagram-controls { display: flex; flex-wrap: wrap; gap: 8px; }
    .diagram-legend-shell {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid #bcae90;
      border-radius: 10px;
      background: #fbf5e9;
    }

    .diagram-legend-head {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .diagram-legend-list {
      display: grid;
      flex: 1;
      grid-template-columns: repeat(7, minmax(112px, 1fr));
      gap: 10px;
    }

    .diagram-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #3f403b;
      font-size: 12px;
      line-height: 1.35;
    }

    .diagram-legend-copy { min-width: 0; }
    .diagram-legend-copy strong, .diagram-legend-copy small { display: block; }
    .diagram-legend-copy strong { color: #35362f; font-size: 12px; }
    .diagram-legend-copy small { margin-top: 2px; color: #6b685f; font-size: 10px; }
    .legend-symbol {
      position: relative;
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 24px;
      border: 2px solid #8c3f33;
      color: #7b2f27;
      background: #fffaf0;
      font-size: 15px;
      font-weight: 800;
    }

    .legend-symbol.action { border-radius: 7px; }
    .legend-symbol.decision, .legend-symbol.parallel {
      width: 23px;
      height: 23px;
      margin: 0 6px;
      transform: rotate(45deg);
      border-radius: 1px;
      background: #f5e5df;
    }

    .legend-symbol.parallel {
      border-color: #8a6a30;
      color: #6f5223;
      background: #f3e7ca;
    }

    .legend-symbol.decision > span, .legend-symbol.parallel > span { transform: rotate(-45deg); }
    .legend-symbol.call {
      border-width: 4px;
      border-color: #52665a;
      border-radius: 7px;
      background: #e5eadf;
    }

    .legend-symbol.pending {
      border-style: dashed;
      border-color: #746f64;
      background: #f4f0e7;
    }

    .legend-symbol.flow, .legend-symbol.handoff {
      width: 42px;
      height: 18px;
      border: 0;
      background: transparent;
    }

    .legend-symbol.flow::before, .legend-symbol.handoff::before {
      content: "";
      position: absolute;
      left: 1px;
      right: 8px;
      top: 8px;
      border-top: 2px solid #5b625d;
    }

    .legend-symbol.flow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 4px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #5b625d;
    }

    .legend-symbol.handoff::before { border-top: 2px dashed #526973; }
    .legend-symbol.handoff::after {
      content: "";
      position: absolute;
      right: 1px;
      top: 4px;
      width: 8px;
      height: 8px;
      border-top: 2px solid #526973;
      border-right: 2px solid #526973;
      transform: rotate(45deg);
    }

    .diagram-reading-tip {
      margin: 10px 0 0;
      padding-top: 9px;
      border-top: 1px solid rgba(188, 174, 144, 0.7);
      color: #514834;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
    }

    .diagram-legend-example {
      margin-top: 10px;
      padding: 11px;
      border: 1px dashed #bcae90;
      border-radius: 8px;
      background: #fffdf8;
    }

    .diagram-legend-example[hidden] { display: none; }
    .diagram-legend-example > p { margin: 0 0 9px; color: #666158; font-size: 11px; }
    .legend-example-flow {
      display: grid;
      grid-template-columns: minmax(92px, 1fr) 48px minmax(110px, 1fr) 58px minmax(130px, 1.25fr);
      align-items: center;
      gap: 8px;
      max-width: 760px;
    }

    .legend-example-step { min-width: 0; text-align: center; }
    .legend-example-department {
      display: block;
      margin-bottom: 4px;
      color: #6f695d;
      font-size: 10px;
      font-weight: 700;
    }

    .legend-example-node {
      display: flex;
      min-height: 42px;
      align-items: center;
      justify-content: center;
      padding: 6px 9px;
      border: 2px solid #8c3f33;
      border-radius: 7px;
      color: #3c3d37;
      background: #fffaf0;
      font-size: 11px;
      font-weight: 700;
    }

    .legend-example-node.decision {
      width: 64px;
      height: 64px;
      min-height: 0;
      margin: 0 auto;
      padding: 7px;
      border-radius: 1px;
      transform: rotate(45deg);
      background: #f5e5df;
    }

    .legend-example-node.decision span { transform: rotate(-45deg); }
    .legend-example-node.handoff {
      border-style: dashed;
      border-color: #526973;
      background: #e7edef;
    }

    .legend-example-arrow {
      position: relative;
      height: 22px;
    }

    .legend-example-arrow::before {
      content: "";
      position: absolute;
      left: 0;
      right: 8px;
      top: 10px;
      border-top: 2px solid #5b625d;
    }

    .legend-example-arrow::after {
      content: "";
      position: absolute;
      right: 0;
      top: 6px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #5b625d;
    }

    .legend-example-arrow.message::before { border-top: 2px dashed #526973; }
    .legend-example-arrow.message::after {
      top: 6px;
      width: 8px;
      height: 8px;
      border: 0;
      border-top: 2px solid #526973;
      border-right: 2px solid #526973;
      transform: rotate(45deg);
    }

    .diagram-notice {
      margin-bottom: 12px;
      padding: 10px 13px;
      border: 1px solid #bcae90;
      border-radius: 9px;
      color: #514834;
      background: #f8efd9;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }

    .diagram-notice.warning {
      color: #7b2f27;
      border-color: #c18a7d;
      background: #f7e5df;
    }

    .diagram-canvas {
      width: 100%;
      height: clamp(360px, 50vh, 520px);
      border: 1px solid #bcae90;
      border-radius: 12px;
      background:
        linear-gradient(rgba(203, 189, 158, 0.16) 1px, transparent 1px),
        linear-gradient(90deg, rgba(203, 189, 158, 0.16) 1px, transparent 1px),
        #fffdf8;
      background-size: 24px 24px;
    }

    .diagram-empty {
      padding: 42px 22px;
      border: 1px dashed #bcae90;
      border-radius: 12px;
      text-align: center;
      background: rgba(255, 253, 248, 0.78);
    }

    .diagram-empty h2 { margin: 0 0 9px; font-family: "SimSun", serif; }
    .diagram-empty p { margin: 0 auto 17px; max-width: 700px; color: var(--muted); line-height: 1.75; }
    .diagram-failure {
      display: none;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #c18a7d;
      border-radius: 9px;
      color: #7b2f27;
      background: #f7e5df;
      line-height: 1.6;
    }

    .diagram-failure.show { display: block; }
    .diagram-warning-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.82);
    }

    .diagram-warning-list strong { color: #7b2f27; }
    .diagram-warning-button {
      padding: 8px 10px;
      border: 1px solid #d3b2aa;
      border-radius: 7px;
      color: #6f342c;
      background: #fff8f4;
      text-align: left;
      line-height: 1.55;
    }

    .diagram-warning-button:hover { border-color: var(--red); }
    .item-card.focused-card {
      border-color: var(--red);
      box-shadow: 0 0 0 4px rgba(140, 63, 51, 0.14);
      animation: focus-card-pulse 1.1s ease-out 1;
    }

    @keyframes focus-card-pulse {
      0% { transform: translateY(0); }
      40% { transform: translateY(-3px); }
      100% { transform: translateY(0); }
    }
    .empty {
      padding: 64px 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
      background: var(--card);
      box-shadow: var(--shadow);
    }

    .empty h2 { margin: 0 0 10px; font-family: "SimSun", serif; }
    .empty p { margin: 0 auto 18px; max-width: 720px; color: var(--muted); line-height: 1.8; }

    .section {
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      box-shadow: 0 8px 22px rgba(76, 58, 33, 0.06);
      overflow: hidden;
    }

    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      padding: 17px 20px;
      border-bottom: 1px solid rgba(203, 189, 158, 0.7);
      background: rgba(237, 226, 203, 0.58);
    }

    .section-head h2 { margin: 0; font-family: "SimSun", serif; font-size: 21px; }
    .section-head p { margin: 5px 0 0; color: var(--muted); font-size: 13px; line-height: 1.6; }
    .section-body { padding: 20px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 14px;
    }

    .field { grid-column: span 4; min-width: 0; }
    .field.half { grid-column: span 6; }
    .field.wide { grid-column: 1 / -1; }
    .field label, .field-label {
      display: block;
      margin-bottom: 6px;
      color: #504d45;
      font-size: 13px;
      font-weight: 700;
    }

    .field .hint {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    input[type="text"], input[type="date"], select, textarea {
      width: 100%;
      border: 1px solid #bcae90;
      border-radius: 8px;
      color: var(--ink);
      background: #fffdf7;
      outline: none;
    }

    input[type="text"], input[type="date"], select { min-height: 40px; padding: 8px 10px; }
    textarea { min-height: 92px; padding: 10px; line-height: 1.65; resize: vertical; }
    textarea.tall { min-height: 180px; }
    input:focus, select:focus, textarea:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(140, 63, 51, 0.1); }

    .item-card {
      margin-bottom: 14px;
      padding: 16px;
      border: 1px solid #d5c7aa;
      border-radius: 11px;
      background: rgba(255, 253, 247, 0.82);
    }

    .item-card:last-child { margin-bottom: 0; }
    .item-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .item-title strong { color: #514834; }
    .technical-note { color: var(--muted); font-size: 12px; }
    .role-name {
      padding: 10px 12px;
      border: 1px solid #b7c2b0;
      border-radius: 8px;
      color: #40543b;
      background: var(--sage-soft);
      font-weight: 700;
      line-height: 1.55;
    }

    .role-picker {
      display: grid;
      grid-template-columns: minmax(150px, 0.8fr) minmax(190px, 1.2fr);
      gap: 9px;
    }

    .inline-warning {
      margin-top: 8px;
      padding: 9px 11px;
      border: 1px solid #d3b2aa;
      border-radius: 8px;
      color: #7b2f27;
      background: #fff3ee;
      font-size: 12px;
      line-height: 1.6;
    }

    .inline-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .record-workbench,
    .form-workbench {
      display: grid;
      grid-template-columns: minmax(210px, 260px) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .record-selector,
    .form-sidebar {
      position: sticky;
      top: 126px;
      display: grid;
      gap: 8px;
      max-height: calc(100vh - 160px);
      padding: 12px;
      overflow-y: auto;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(237, 226, 203, 0.52);
    }

    .selector-button,
    .structure-button {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid #cdbf9f;
      border-radius: 8px;
      color: #514834;
      background: #fffaf0;
      text-align: left;
      line-height: 1.45;
    }

    .selector-button.active,
    .structure-button.active {
      color: #fff;
      border-color: var(--sage);
      background: var(--sage);
    }

    .form-editor,
    .record-editor {
      min-width: 0;
    }

    .structure-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0;
      padding: 10px;
      border: 1px solid #d5c7aa;
      border-radius: 10px;
      background: rgba(255, 253, 247, 0.82);
    }

    .structure-button {
      width: auto;
      max-width: 100%;
    }

    .form-structure-warning,
    .export-warning-list {
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #d3b2aa;
      border-radius: 9px;
      color: #6f342c;
      background: #fff4ef;
      line-height: 1.65;
    }

    .export-warning-list ol {
      margin: 8px 0 0;
      padding-left: 22px;
    }

    .check-row, .check-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      padding: 10px 12px;
      border: 1px solid #d4c7ad;
      border-radius: 8px;
      background: #fffdf8;
    }

    .check-row label, .check-list label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font-size: 13px;
      font-weight: 400;
    }

    .nested {
      margin-top: 14px;
      padding: 14px;
      border-left: 4px solid var(--blue);
      border-radius: 0 9px 9px 0;
      background: rgba(225, 231, 232, 0.58);
    }

    .linked-handoff-list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .linked-handoff-card {
      padding: 13px;
      border: 1px solid #b8c4c6;
      border-radius: 9px;
      background: rgba(255, 253, 247, 0.86);
    }

    .linked-handoff-card .item-title { margin-bottom: 12px; }

    .empty-list {
      padding: 22px;
      border: 1px dashed #bcae90;
      border-radius: 9px;
      color: var(--muted);
      text-align: center;
    }

    .footer-note {
      margin-top: 18px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(250, 244, 230, 0.75);
      font-size: 13px;
      line-height: 1.7;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(47, 48, 43, 0.52);
    }

    .modal-backdrop.show { display: flex; }
    .modal {
      width: min(560px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fffaf0;
      box-shadow: 0 24px 70px rgba(30, 27, 21, 0.28);
    }

    .modal h2 { margin: 0 0 9px; font-family: "SimSun", serif; }
    .modal p { color: var(--muted); line-height: 1.7; }
    .modal-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; margin-top: 20px; }

    @media (max-width: 900px) {
      .page { width: min(100% - 20px, 1500px); padding-top: 10px; }
      .hero { padding: 20px; }
      .field, .field.half { grid-column: 1 / -1; }
      .section-head { flex-direction: column; }
      .candidate-bar { align-items: stretch; flex-direction: column; }
      .candidate-bar select { min-width: 0; }
      .workspace-tabs { display: flex; width: 100%; }
      .workspace-tab { flex: 1; justify-content: center; padding-inline: 8px; }
      .preview-guidance, .preview-ready-callout, .diagram-toolbar {
        align-items: stretch;
        flex-direction: column;
      }
      .preview-ready-callout { padding: 12px 0 0; border-top: 1px solid #aab7a4; border-left: 0; }
      .diagram-controls .button { flex: 1; }
      .diagram-canvas { height: min(420px, 58vh); }
      .diagram-section.diagram-expanded { inset: 6px; }
      .diagram-section.diagram-expanded .diagram-canvas {
        height: max(420px, calc(100vh - 430px));
      }
      .diagram-legend-head { flex-direction: column; }
      .diagram-legend-list { grid-template-columns: repeat(2, minmax(130px, 1fr)); width: 100%; }
      .legend-example-flow {
        grid-template-columns: minmax(92px, 1fr) 34px minmax(100px, 1fr) 34px minmax(116px, 1fr);
        min-width: 540px;
      }
      .diagram-legend-example { overflow-x: auto; }
      .record-workbench, .form-workbench { grid-template-columns: 1fr; }
      .record-selector, .form-sidebar {
        position: static;
        display: flex;
        max-height: none;
        overflow-x: auto;
        overflow-y: hidden;
      }
      .selector-button { min-width: 180px; width: auto; }
      .role-picker { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="eyebrow">Infomat · 3001 · 无状态临时工具</div>
      <h1>单流程治理编制工具</h1>
      <p class="subtitle">直接新建流程，或导入已有结构化文件继续整理。一份导出的 JSON 只对应一个流程。</p>
      <div class="actions">
        <button class="button primary" id="newProcessButton">新建流程</button>
        <button class="button" id="importJsonButton">导入结构化文件</button>
        <button class="button secondary" id="exportButton" disabled>导出当前流程</button>
        <button class="button danger" id="clearButton" disabled>清空当前页面</button>
      </div>
      <div class="status" id="statusBox" role="status"></div>
      <input id="jsonInput" type="file" accept=".json,application/json" hidden>
    </header>

    <div class="candidate-bar" id="candidateBar">
      <strong>当前候选流程</strong>
      <select id="candidateSelect"></select>
      <span class="candidate-note" id="candidateNote"></span>
    </div>

    <main class="workspace" id="workspace"></main>

    <div class="footer-note">
      用户主动导出是唯一保存方式。导出允许保留未补齐草稿，但文件名会统一标注“未审核”。页面刷新或关闭后，本次内容无法恢复。
    </div>
  </div>

  <div class="modal-backdrop" id="unsavedModal" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="unsavedTitle">
      <h2 id="unsavedTitle">当前还有未导出的修改</h2>
      <p id="unsavedText">继续操作会清除当前页面中的内容。可以先导出当前候选流程；如果还有其他未导出的候选，工具会依次提醒。</p>
      <div class="modal-actions">
        <button class="button" id="cancelProtectedButton">取消</button>
        <button class="button secondary" id="exportProtectedButton">先导出当前流程</button>
        <button class="button danger" id="discardProtectedButton">放弃当前内容</button>
      </div>
    </div>
  </div>

  <script src="/vendor/cytoscape.min.js"></script>
  <script src="process-diagram.js"></script>
  <script>
    const DEPARTMENTS = [
      '全公司', '公司领导', '工程技术部', '质量管理部', '财务部', '行政人事部',
      '经营发展部', '物资保障部', '项目管理部', '复材车间', '运维安环部'
    ];
    const ROLE_DUTIES = ['', '发起', '办理', '审核', '批准', '判断', '发送', '接收', '会签'];
    const NODE_TYPES = [
      { value: '', label: '请选择' },
      { value: 'action', label: '业务行为' },
      { value: 'decision', label: '判断节点' },
      { value: 'parallel_split', label: '并行分支' },
      { value: 'parallel_join', label: '并行汇合' }
    ];
    const RELATION_TYPES = [
      { value: '', label: '请选择' },
      { value: 'sequence', label: '顺序' },
      { value: 'condition', label: '判断分支' },
      { value: 'loop', label: '流程内部回路' },
      { value: 'parallel', label: '并行关系' }
    ];
    const MATERIAL_TYPES = ['', '现有制度', '表单或记录', '现行业务操作说明', '会议或访谈', '其他参考材料'];
    const AREA_TYPES = ['', '基本信息', '明细清单'];
    const EXPECTED_EXPORT_SCHEMA_VERSION = 'process-governance-v1';
    const EDITOR_SECTIONS = [
      { value: 'basic', label: '基本信息' },
      { value: 'profile', label: '目的与范围' },
      { value: 'terms', label: '术语定义' },
      { value: 'process', label: '流程步骤' },
      { value: 'forms', label: '表单与记录' },
      { value: 'export', label: '导出检查' }
    ];
    const PROCESS_SECTIONS = [
      { value: 'behaviors', label: '业务行为' },
      { value: 'relations', label: '流程关系' },
      { value: 'data', label: '输出物与数据' },
      { value: 'handoffs', label: '跨部门承接' }
    ];
    const LEGACY_DUTY_MAP = {
      initiator: '发起',
      executor: '办理',
      reviewer: '审核',
      approver: '批准',
      collaborator: '会签',
      provider: '发送',
      sender: '发送',
      receiver: '接收',
      countersigner: '会签'
    };

    let candidates = [];
    let currentIndex = 0;
    let protectedAction = null;
    let busy = false;
    let activeWorkspaceTab = 'editor';
    let activeEditorSection = 'basic';
    let activeProcessSection = 'behaviors';
    let activeBehaviorRef = '';
    let activeFormRef = '';
    let activeAreaRef = '';
    let rosterRolesByDepartment = {};
    let rosterLoadState = 'loading';
    let diagramView = null;
    let diagramExampleExpanded = false;
    let diagramExpanded = false;
    let focusClearTimer = null;
    const openedPreviewProcesses = new Set();

    const workspace = document.getElementById('workspace');
    const statusBox = document.getElementById('statusBox');
    const candidateBar = document.getElementById('candidateBar');
    const candidateSelect = document.getElementById('candidateSelect');
    const candidateNote = document.getElementById('candidateNote');
    const unsavedModal = document.getElementById('unsavedModal');
    const jsonInput = document.getElementById('jsonInput');
    const actionButtons = [
      document.getElementById('newProcessButton'),
      document.getElementById('importJsonButton'),
      document.getElementById('exportButton'),
      document.getElementById('clearButton')
    ];

    function newRef(prefix) {
      const token = typeof crypto.randomUUID === 'function'
        ? crypto.randomUUID().replace(/-/g, '')
        : `${Date.now()}${Math.random().toString(16).slice(2)}`;
      return `${prefix}_${token}`;
    }

    function technicalRef(value, prefix) {
      const raw = String(value || '').trim();
      if (/^[A-Za-z0-9][A-Za-z0-9._:-]{0,159}$/.test(raw)) return raw;
      return newRef(prefix);
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function text(value) {
      return value == null ? '' : String(value);
    }

    function nullable(value) {
      const normalized = text(value).trim();
      return normalized || null;
    }

    function list(value) {
      if (Array.isArray(value)) return [...new Set(value.map(item => text(item).trim()).filter(Boolean))];
      return [...new Set(text(value).split(/[,，\n]/).map(item => item.trim()).filter(Boolean))];
    }

    function escapeHtml(value) {
      return text(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, '&#96;');
    }

    function roleName(behaviorName, duty) {
      const base = text(behaviorName).trim().replace(/行为$/, '');
      return base && duty ? `${base}行为的${duty}角色` : '';
    }

    async function readJsonResponse(response, nonJsonMessage) {
      const contentType = text(response.headers.get('content-type')).toLowerCase();
      if (!contentType.includes('application/json')) throw new Error(nonJsonMessage);
      try {
        return await response.json();
      } catch (_error) {
        throw new Error(nonJsonMessage);
      }
    }

    async function fetchEmptyProcessDocument() {
      const response = await fetch('/api/template?version=process-governance-v1', { cache: 'no-store' });
      const result = await readJsonResponse(
        response,
        '3001空白模板接口未返回结构化数据。请保持当前页面打开，待维护人员重启3001服务后再次新建流程。'
      );
      if (!response.ok) throw new Error(result.error || '无法读取当前空白模板');
      if (result.schema_version !== EXPECTED_EXPORT_SCHEMA_VERSION || !result.data) {
        throw new Error('3001空白模板与当前页面版本不一致，请联系维护人员重启服务。');
      }
      return result.data;
    }

    async function loadRosterCatalog() {
      rosterLoadState = 'loading';
      try {
        const response = await fetch('/api/enums', { cache: 'no-store' });
        const result = await readJsonResponse(response, '3001花名册岗位接口未返回结构化数据。');
        if (!response.ok) throw new Error(result.error || '无法读取花名册岗位');
        rosterRolesByDepartment = result.rosterRolesByDepartment && typeof result.rosterRolesByDepartment === 'object'
          ? result.rosterRolesByDepartment
          : {};
        rosterLoadState = Object.keys(rosterRolesByDepartment).length ? 'ready' : 'unavailable';
      } catch (_error) {
        rosterRolesByDepartment = {};
        rosterLoadState = 'unavailable';
      }
      if (currentDocument()) render();
    }

    function rosterPositions(department) {
      return Array.isArray(rosterRolesByDepartment?.[department])
        ? rosterRolesByDepartment[department]
        : [];
    }

    function actorDepartments() {
      return [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司');
    }

    function currentExecutionDepartment() {
      return text(currentDocument()?.process?.owning_department).trim();
    }

    function parseActorRole(value) {
      const raw = text(value).trim();
      if (!raw) return { department: '', position: '', known: false };
      if (raw === '全公司') return { department: '全公司', position: '', known: true };
      const departments = [...new Set(DEPARTMENTS.concat(Object.keys(rosterRolesByDepartment || {})))]
        .filter(department => department && department !== '全公司')
        .sort((left, right) => right.length - left.length);
      const department = departments.find(item => raw === item || raw.startsWith(item));
      if (department) {
        const position = raw.slice(department.length).trim();
        return {
          department,
          position,
          known: Boolean(position && rosterPositions(department).includes(position))
        };
      }
      const matches = Object.entries(rosterRolesByDepartment || {})
        .filter(([, positions]) => Array.isArray(positions) && positions.includes(raw));
      if (matches.length === 1) {
        return { department: matches[0][0], position: raw, known: true };
      }
      return { department: '', position: '', known: false };
    }

    function combineActorRole(department, position) {
      if (department === '全公司') return '全公司';
      if (department && position) return `${department}${position}`;
      return department || '';
    }

    function actorRolePicker(index) {
      const rawValue = text(currentDocument().behaviors[index]?.current_actor_role).trim();
      const ownDepartment = currentExecutionDepartment();
      const parsed = parseActorRole(rawValue);
      const selectableDepartments = actorDepartments();
      const selectedDepartment = parsed.department === '全公司' || selectableDepartments.includes(parsed.department)
        ? parsed.department
        : '';
      const knownCurrentValue = rawValue === '全公司'
        || Boolean(
          rawValue
          && selectedDepartment
          && selectedDepartment !== '全公司'
          && parsed.position
          && rosterPositions(selectedDepartment).includes(parsed.position)
        );
      const departmentOnlyInProgress = Boolean(
        rawValue
        && rawValue === selectedDepartment
        && selectedDepartment !== '全公司'
        && !parsed.position
      );
      const departmentOptions = [{
        value: '',
        label: '请选择执行部门'
      }];
      selectableDepartments.forEach(department => departmentOptions.push({
        value: department,
        label: department === ownDepartment ? `${department}（本流程归口部门）` : department
      }));
      departmentOptions.push({ value: '全公司', label: '全公司通用' });

      const positions = selectedDepartment && selectedDepartment !== '全公司'
        ? rosterPositions(selectedDepartment)
        : [];
      const positionOptions = [{
        value: '',
        label: selectedDepartment === '全公司'
          ? '全公司通用无需选择岗位'
          : rosterLoadState === 'loading'
            ? '正在读取花名册岗位'
            : rosterLoadState === 'unavailable'
              ? '花名册岗位暂时不可用'
              : selectedDepartment
                ? '请选择执行岗位'
                : '请先选择执行部门'
      }].concat(positions.map(position => ({ value: position, label: position })));
      if (selectedDepartment && parsed.position && !positions.includes(parsed.position)) {
        positionOptions.push({
          value: parsed.position,
          label: `原文件岗位：${parsed.position}（当前花名册未收录）`
        });
      }

      const warning = rawValue && !knownCurrentValue && !departmentOnlyInProgress
        ? `<div class="inline-warning">当前导入值“${escapeHtml(rawValue)}”未被现行花名册收录。3001会保留该值；如需修改，请重新选择执行部门和执行岗位。</div>`
        : '';
      const availability = selectedDepartment === '全公司'
        ? '<div class="inline-note">已选择“全公司通用”，无需再选择具体岗位。</div>'
        : rosterLoadState === 'unavailable'
        ? '<div class="inline-warning">花名册岗位暂时不可用。3001不会清除已有执行岗位；其他内容仍可继续编制和导出。</div>'
        : !selectedDepartment
          ? '<div class="inline-note">执行部门可以选择全部组织部门；选择后，执行岗位只显示该部门在花名册中的岗位。</div>'
          : !ownDepartment
            ? `<div class="inline-note">尚未填写流程归口部门。当前岗位只来自“${escapeHtml(selectedDepartment)}”花名册；归口部门补齐后，3001再判断是否属于跨部门执行。</div>`
            : ownDepartment === '全公司'
              ? `<div class="inline-note">当前流程归口部门为“全公司”。执行岗位只显示“${escapeHtml(selectedDepartment)}”花名册中的岗位。</div>`
              : selectedDepartment === ownDepartment
                ? `<div class="inline-note">当前为本部门执行。执行岗位只显示“${escapeHtml(selectedDepartment)}”花名册中的岗位。</div>`
                : `<div class="inline-note">当前为跨部门执行。执行岗位只显示“${escapeHtml(selectedDepartment)}”花名册中的岗位。</div>`;

      return `
        <div class="field wide">
          <span class="field-label">执行部门和执行岗位</span>
          <div class="role-picker">
            <select data-actor-department="${index}">
              ${optionHtml(departmentOptions, selectedDepartment)}
            </select>
            <select
              data-actor-position="${index}"
              ${!selectedDepartment || selectedDepartment === '全公司' || rosterLoadState !== 'ready' ? 'disabled' : ''}
            >
              ${optionHtml(positionOptions, parsed.position)}
            </select>
          </div>
          ${warning}
          ${availability}
        </div>`;
    }

    function normalizeWorkRole(role, behaviorRef, behaviorName) {
      if (!role || typeof role !== 'object') return null;
      const duty = ROLE_DUTIES.includes(role.role_duty) ? role.role_duty : '';
      const code = nullable(role.work_role_code);
      return {
        behavior_ref: behaviorRef,
        work_role_code: code,
        role_duty: duty,
        work_role_name: roleName(behaviorName, duty),
        assignment_status: code ? 'assigned' : 'pending_assignment'
      };
    }

    function normalizeV1(input) {
      const source = input && typeof input === 'object' ? input : {};
      const process = source.process || {};
      const behaviorRefMap = new Map();
      const behaviors = (Array.isArray(source.behaviors) ? source.behaviors : []).map((item, index) => {
        const behaviorRef = technicalRef(item?.behavior_ref, `behavior${index + 1}`);
        if (item?.behavior_ref) behaviorRefMap.set(item.behavior_ref, behaviorRef);
        const behaviorName = text(item?.behavior_name);
        return {
          behavior_ref: behaviorRef,
          node_type: NODE_TYPES.some(option => option.value === item?.node_type) ? item.node_type : '',
          behavior_name: behaviorName,
          current_actor_role: text(item?.current_actor_role),
          trigger: text(item?.trigger),
          precondition: text(item?.precondition),
          input_description: text(item?.input_description),
          timing: nullable(item?.timing),
          completion_standard: text(item?.completion_standard),
          output_description: text(item?.output_description),
          input_data_refs: list(item?.input_data_refs),
          output_data_refs: list(item?.output_data_refs),
          work_role: normalizeWorkRole(item?.work_role, behaviorRef, behaviorName),
          countersign_all_required: Boolean(item?.countersign_all_required),
          countersign_target_departments: list(item?.countersign_target_departments)
        };
      });
      const mapBehaviorRef = value => value ? (behaviorRefMap.get(value) || technicalRef(value, 'behavior')) : null;
      const dataRefMap = new Map();
      const dataObjects = (Array.isArray(source.data_objects) ? source.data_objects : []).map((item, index) => {
        const dataRef = technicalRef(item?.data_ref, `data${index + 1}`);
        if (item?.data_ref) dataRefMap.set(item.data_ref, dataRef);
        return {
          data_ref: dataRef,
          data_name: text(item?.data_name),
          description: text(item?.description),
          governance_status: 'candidate',
          produced_by_behavior_ref: mapBehaviorRef(item?.produced_by_behavior_ref),
          consumed_by_behavior_refs: list(item?.consumed_by_behavior_refs).map(mapBehaviorRef)
        };
      });
      const mapDataRef = value => value ? (dataRefMap.get(value) || technicalRef(value, 'data')) : null;
      behaviors.forEach((behavior, index) => {
        const original = source.behaviors?.[index] || {};
        behavior.input_data_refs = list(original.input_data_refs).map(mapDataRef);
        behavior.output_data_refs = list(original.output_data_refs).map(mapDataRef);
      });

      const normalized = {
        schema_version: 'process-governance-v1',
        export_meta: {
          package_ref: technicalRef(source.export_meta?.package_ref, 'package'),
          exported_at: Number.isNaN(Date.parse(source.export_meta?.exported_at))
            ? new Date().toISOString()
            : new Date(source.export_meta.exported_at).toISOString(),
          initiating_department: text(source.export_meta?.initiating_department),
          compiler: text(source.export_meta?.compiler)
        },
        process: {
          process_ref: technicalRef(process.process_ref, 'process'),
          process_name: text(process.process_name),
          owning_department: text(process.owning_department),
          purpose: text(process.purpose),
          scope: text(process.scope),
          capability_domain: nullable(process.capability_domain),
          business_capability: nullable(process.business_capability),
          classification_status: ['unclassified', 'needs_review', 'confirmed'].includes(process.classification_status)
            ? process.classification_status
            : 'unclassified'
        },
        reference_materials: (Array.isArray(source.reference_materials) ? source.reference_materials : []).map((item, index) => ({
          material_ref: technicalRef(item?.material_ref, `material${index + 1}`),
          material_type: MATERIAL_TYPES.includes(item?.material_type) ? item.material_type : '',
          material_name: text(item?.material_name),
          document_no: nullable(item?.document_no),
          version: nullable(item?.version),
          file_sha256: /^[a-fA-F0-9]{64}$/.test(text(item?.file_sha256)) ? item.file_sha256 : null,
          readable_text: text(item?.readable_text),
          provider_department: text(item?.provider_department),
          provider_name: text(item?.provider_name),
          as_of_date: nullable(item?.as_of_date)
        })),
        behaviors,
        flow_relations: (Array.isArray(source.flow_relations) ? source.flow_relations : []).map((item, index) => ({
          relation_ref: technicalRef(item?.relation_ref, `relation${index + 1}`),
          relation_type: RELATION_TYPES.some(option => option.value === item?.relation_type) ? item.relation_type : '',
          from_behavior_ref: mapBehaviorRef(item?.from_behavior_ref),
          to_behavior_ref: mapBehaviorRef(item?.to_behavior_ref),
          condition: text(item?.condition),
          join_mode: item?.join_mode === 'all' ? 'all' : ''
        })),
        data_objects: dataObjects,
        cross_department_handoffs: (Array.isArray(source.cross_department_handoffs) ? source.cross_department_handoffs : []).map((item, index) => ({
          handoff_ref: technicalRef(item?.handoff_ref, `handoff${index + 1}`),
          source_department: text(item?.source_department),
          target_department: text(item?.target_department),
          send_behavior_ref: mapBehaviorRef(item?.send_behavior_ref),
          receive_behavior_ref: item?.receive_behavior_ref ? technicalRef(item.receive_behavior_ref, 'receive') : null,
          input_data_ref: mapDataRef(item?.input_data_ref || item?.output_data_ref),
          returned_data_ref: mapDataRef(item?.returned_data_ref),
          requested_matter: text(item?.requested_matter),
          trigger_condition: text(item?.trigger_condition),
          completion_standard: text(item?.completion_standard),
          target_process_ref: item?.target_process_ref ? technicalRef(item.target_process_ref, 'target_process') : null,
          target_process_name: text(item?.target_process_name),
          target_behavior_ref: item?.target_behavior_ref ? technicalRef(item.target_behavior_ref, 'target_behavior') : null,
          target_behavior_name: text(item?.target_behavior_name),
          return_behavior_ref: mapBehaviorRef(item?.return_behavior_ref)
        })),
        internal_process_calls: (Array.isArray(source.internal_process_calls) ? source.internal_process_calls : []).map((item, index) => ({
          call_ref: technicalRef(item?.call_ref, `call${index + 1}`),
          caller_behavior_ref: mapBehaviorRef(item?.caller_behavior_ref),
          target_process_ref: item?.target_process_ref ? technicalRef(item.target_process_ref, 'target_process') : null,
          target_process_name: text(item?.target_process_name),
          input_data_refs: list(item?.input_data_refs).map(mapDataRef),
          output_data_refs: list(item?.output_data_refs).map(mapDataRef),
          return_behavior_ref: mapBehaviorRef(item?.return_behavior_ref)
        })),
        forms: (Array.isArray(source.forms) ? source.forms : []).map((form, formIndex) => ({
          form_ref: technicalRef(form?.form_ref, `form${formIndex + 1}`),
          behavior_ref: mapBehaviorRef(form?.behavior_ref),
          form_name: text(form?.form_name),
          form_no: nullable(form?.form_no),
          areas: (Array.isArray(form?.areas) ? form.areas : []).map((area, areaIndex) => ({
            area_ref: technicalRef(area?.area_ref, `area${formIndex + 1}_${areaIndex + 1}`),
            area_type: AREA_TYPES.includes(area?.area_type) ? area.area_type : '',
            area_title: text(area?.area_title),
            items: (Array.isArray(area?.items) ? area.items : []).map((item, itemIndex) => ({
              item_ref: technicalRef(item?.item_ref, `item${formIndex + 1}_${areaIndex + 1}_${itemIndex + 1}`),
              item_name: text(item?.item_name),
              item_type: text(item?.item_type),
              required: Boolean(item?.required),
              instructions: text(item?.instructions)
            }))
          }))
        })),
        terms: (Array.isArray(source.terms) ? source.terms : []).map((item, index) => ({
          term_ref: technicalRef(item?.term_ref, `term${index + 1}`),
          term_name: text(item?.term_name),
          definition: text(item?.definition)
        }))
      };
      if (source.migration && typeof source.migration === 'object') {
        normalized.migration = {
          source_schema_version: text(source.migration.source_schema_version),
          source_process_ref: source.migration.source_process_ref
            ? technicalRef(source.migration.source_process_ref, 'source_process')
            : null,
          source_process_count: Math.max(1, Number(source.migration.source_process_count) || 1)
        };
      }
      syncRoles(normalized);
      return normalized;
    }

    function legacyReferenceMaterial(source, fileName, fileSha256) {
      const profile = source.document_profile || {};
      const draft = source.draft || {};
      return {
        material_ref: newRef('material'),
        material_type: draft.basis_type === '表单 / 台账' ? '表单或记录' : '现有制度',
        material_name: profile.document_title || draft.document_title || fileName || '历史结构化文件',
        document_no: nullable(profile.document_no || draft.document_no),
        version: nullable(draft.planned_edition),
        file_sha256: fileSha256 || null,
        readable_text: text(source.markdown_draft),
        provider_department: text(draft.department?.department_name),
        provider_name: '',
        as_of_date: null
      };
    }

    function splitLegacyDocument(source, options = {}) {
      const processList = Array.isArray(source.processes) && source.processes.length
        ? source.processes
        : [{
            process_ref: source.draft?.draft_ref || newRef('legacy_process'),
            l1_name: source.draft?.l1_name || '',
            l2_name: source.draft?.l2_name || '',
            l3_name: source.draft?.l3_name || source.draft?.process_name || ''
          }];
      const sharedMaterial = options.referenceMaterial
        ? normalizeV1({ reference_materials: [options.referenceMaterial] }).reference_materials[0]
        : legacyReferenceMaterial(source, options.fileName, options.fileSha256);

      return processList.map((legacyProcess, processIndex) => {
        const oldProcessRef = legacyProcess.process_ref;
        let steps = (source.steps || []).filter(step => step.process_ref === oldProcessRef);
        if (!steps.length && processList.length === 1) steps = Array.isArray(source.steps) ? source.steps : [];
        const stepRefMap = new Map();
        steps.forEach((step, index) => stepRefMap.set(step.step_ref, technicalRef(step.step_ref, `behavior${index + 1}`)));
        const dataObjects = [];
        const outputDataByStep = new Map();
        const bindings = Array.isArray(source.work_role_bindings) ? source.work_role_bindings : [];
        const unusedBindings = bindings.filter(binding => binding.process_ref === oldProcessRef && !stepRefMap.has(binding.step_ref));

        const behaviors = steps.map((step, index) => {
          const behaviorRef = stepRefMap.get(step.step_ref);
          const detail = (source.behavior_details || []).find(item => item.step_ref === step.step_ref) || {};
          const stepBindings = bindings.filter(binding => binding.step_ref === step.step_ref);
          const selectedBinding = stepBindings[0];
          if (stepBindings.length > 1) unusedBindings.push(...stepBindings.slice(1));
          const duty = LEGACY_DUTY_MAP[selectedBinding?.participation_type] || '';
          const outputDescription = text(step.output_result || detail.delivery_object);
          const outputRefs = [];
          if (outputDescription) {
            const dataRef = newRef('data');
            outputDataByStep.set(step.step_ref, dataRef);
            outputRefs.push(dataRef);
            dataObjects.push({
              data_ref: dataRef,
              data_name: outputDescription.slice(0, 120),
              description: outputDescription,
              governance_status: 'candidate',
              produced_by_behavior_ref: behaviorRef,
              consumed_by_behavior_refs: []
            });
          }
          const nodeType = step.step_type === 'decision' ? 'decision' : step.step_type === 'action' ? 'action' : '';
          return {
            behavior_ref: behaviorRef,
            node_type: nodeType,
            behavior_name: text(step.step_name),
            current_actor_role: text(step.actor_role || selectedBinding?.source_role_text),
            trigger: text(detail.trigger_scene),
            precondition: text(detail.precondition),
            input_description: text(step.input_materials),
            timing: nullable(step.timing),
            completion_standard: text(detail.execution_standard),
            output_description: outputDescription,
            input_data_refs: [],
            output_data_refs: outputRefs,
            work_role: selectedBinding ? {
              behavior_ref: behaviorRef,
              work_role_code: nullable(selectedBinding.work_role_code),
              role_duty: duty,
              work_role_name: roleName(step.step_name, duty),
              assignment_status: selectedBinding.work_role_code ? 'assigned' : 'pending_assignment'
            } : null,
            countersign_all_required: duty === '会签',
            countersign_target_departments: []
          };
        });

        (source.mdm_requirement_catalog || []).forEach(item => {
          const name = text(item.object);
          if (!name) return;
          dataObjects.push({
            data_ref: newRef('data'),
            data_name: name,
            description: text(item.requirement),
            governance_status: 'candidate',
            produced_by_behavior_ref: null,
            consumed_by_behavior_refs: []
          });
        });

        const formTables = Array.isArray(source.form_tables) ? source.form_tables : [];
        const tableFields = Array.isArray(source.form_table_fields) ? source.form_table_fields : [];
        const forms = (source.forms || [])
          .filter(form => stepRefMap.has(form.step_ref))
          .map((form, formIndex) => {
            let tables = formTables.filter(table => table.form_ref === form.form_ref);
            if (!tables.length && form.main_table_name) {
              tables = [{
                table_ref: newRef('legacy_table'),
                table_kind: 'main',
                table_name: form.main_table_name
              }];
            }
            return {
              form_ref: technicalRef(form.form_ref, `form${formIndex + 1}`),
              behavior_ref: stepRefMap.get(form.step_ref) || null,
              form_name: text(form.form_name),
              form_no: nullable(form.form_code),
              areas: tables.map((table, areaIndex) => ({
                area_ref: technicalRef(table.table_ref, `area${formIndex + 1}_${areaIndex + 1}`),
                area_type: table.table_kind === 'detail' ? '明细清单' : '基本信息',
                area_title: text(table.table_name),
                items: tableFields
                  .filter(field => field.table_ref === table.table_ref)
                  .map((field, itemIndex) => ({
                    item_ref: technicalRef(field.table_field_ref, `item${formIndex + 1}_${areaIndex + 1}_${itemIndex + 1}`),
                    item_name: text(field.field_name),
                    item_type: text(field.field_type),
                    required: Boolean(field.required),
                    instructions: text(field.description)
                  }))
              }))
            };
          });

        const references = [clone(sharedMaterial)];
        const evidence = Array.isArray(source.evidence_catalog) ? source.evidence_catalog : [];
        if (unusedBindings.length || evidence.length) {
          references.push({
            material_ref: newRef('material'),
            material_type: '其他参考材料',
            material_name: '旧版结构化补充信息',
            document_no: null,
            version: null,
            file_sha256: null,
            readable_text: JSON.stringify({
              unmatched_work_role_bindings: unusedBindings,
              evidence_catalog: evidence
            }, null, 2),
            provider_department: text(source.draft?.department?.department_name),
            provider_name: '',
            as_of_date: null
          });
        }

        const result = {
          schema_version: 'process-governance-v1',
          export_meta: {
            package_ref: newRef('package'),
            exported_at: new Date().toISOString(),
            initiating_department: text(source.draft?.department?.department_name),
            compiler: ''
          },
          process: {
            process_ref: technicalRef(oldProcessRef, `process${processIndex + 1}`),
            process_name: text(legacyProcess.l3_name || source.draft?.process_name || source.draft?.l3_name),
            owning_department: text(source.draft?.department?.department_name),
            purpose: text(source.document_profile?.purpose),
            scope: text(source.document_profile?.scope),
            capability_domain: nullable(legacyProcess.l1_name || source.draft?.l1_name),
            business_capability: nullable(legacyProcess.l2_name || source.draft?.l2_name),
            classification_status: source.draft?.l1_status === 'confirmed' && source.draft?.l2_status === 'confirmed'
              ? 'confirmed'
              : 'unclassified'
          },
          reference_materials: references,
          behaviors,
          flow_relations: (source.step_transitions || [])
            .filter(relation => stepRefMap.has(relation.from_step_ref))
            .map((relation, index) => ({
              relation_ref: technicalRef(relation.transition_ref, `relation${index + 1}`),
              relation_type: 'condition',
              from_behavior_ref: stepRefMap.get(relation.from_step_ref),
              to_behavior_ref: relation.to_step_ref ? (stepRefMap.get(relation.to_step_ref) || null) : null,
              condition: text(relation.condition),
              join_mode: ''
            })),
          data_objects: dataObjects,
          cross_department_handoffs: (source.cross_dept_handoffs || [])
            .filter(handoff => stepRefMap.has(handoff.step_ref))
            .map((handoff, index) => ({
              handoff_ref: technicalRef(handoff.handoff_ref, `handoff${index + 1}`),
              source_department: text(source.draft?.department?.department_name),
              target_department: text(handoff.target_department),
              send_behavior_ref: stepRefMap.get(handoff.step_ref),
              receive_behavior_ref: null,
              input_data_ref: outputDataByStep.get(handoff.step_ref) || null,
              returned_data_ref: null,
              requested_matter: text(handoff.target_behavior_name || handoff.handoff_standard),
              trigger_condition: '',
              completion_standard: text(handoff.handoff_standard),
              target_process_ref: handoff.target_process_code ? technicalRef(handoff.target_process_code, 'target_process') : null,
              target_process_name: text(handoff.target_process_name),
              target_behavior_ref: handoff.target_behavior_code ? technicalRef(handoff.target_behavior_code, 'target_behavior') : null,
              target_behavior_name: text(handoff.target_behavior_name),
              return_behavior_ref: null
            })),
          internal_process_calls: [],
          forms,
          terms: (source.terms || []).map((item, index) => ({
            term_ref: technicalRef(item.term_ref, `term${index + 1}`),
            term_name: text(item.term_name),
            definition: text(item.definition)
          })),
          migration: {
            source_schema_version: 'document-structured-output-v2',
            source_process_ref: oldProcessRef ? technicalRef(oldProcessRef, 'source_process') : null,
            source_process_count: processList.length
          }
        };
        syncRoles(result);
        return result;
      });
    }

    function currentEntry() {
      return candidates[currentIndex] || null;
    }

    function currentDocument() {
      return currentEntry()?.data || null;
    }

    function hasDirtyCandidates() {
      return candidates.some(item => item.dirty);
    }

    function touch() {
      const entry = currentEntry();
      if (!entry) return;
      entry.dirty = true;
      updateCandidateBar();
    }

    function setBusy(value, message = '') {
      busy = value;
      actionButtons.forEach(button => {
        if (button.id === 'exportButton' || button.id === 'clearButton') {
          button.disabled = value || !currentDocument();
        } else {
          button.disabled = value;
        }
      });
      if (message) showStatus(message);
    }

    function showStatus(message, kind = '') {
      statusBox.textContent = message;
      statusBox.className = `status show${kind ? ` ${kind}` : ''}`;
    }

    function clearStatus() {
      statusBox.textContent = '';
      statusBox.className = 'status';
    }

    function optionHtml(options, selected) {
      return options.map(option => {
        const value = typeof option === 'string' ? option : option.value;
        const label = typeof option === 'string' ? (option || '请选择') : option.label;
        return `<option value="${escapeAttribute(value)}"${value === selected ? ' selected' : ''}>${escapeHtml(label)}</option>`;
      }).join('');
    }

    function getByPath(pathKey) {
      return pathKey.split('.').reduce((target, part) => target == null ? undefined : target[part], currentDocument());
    }

    function setByPath(pathKey, value) {
      const parts = pathKey.split('.');
      const last = parts.pop();
      const target = parts.reduce((node, part) => node[part], currentDocument());
      target[last] = value;
    }

    function field(pathKey, label, options = {}) {
      const value = getByPath(pathKey);
      const classes = ['field', options.className || ''].filter(Boolean).join(' ');
      const hint = options.hint ? `<span class="hint">${escapeHtml(options.hint)}</span>` : '';
      let control = '';
      if (options.type === 'textarea') {
        control = `<textarea class="${options.tall ? 'tall' : ''}" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" placeholder="${escapeAttribute(options.placeholder || '')}">${escapeHtml(value)}</textarea>`;
      } else if (options.type === 'select') {
        control = `<select data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}">${optionHtml(options.options || [], value == null ? '' : value)}</select>`;
      } else if (options.type === 'date') {
        control = `<input type="date" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}">`;
      } else if (options.type === 'checkbox') {
        control = `<div class="check-row"><label><input type="checkbox" data-bind="${escapeAttribute(pathKey)}" data-kind="boolean"${value ? ' checked' : ''}> ${escapeHtml(options.checkboxLabel || label)}</label></div>`;
      } else {
        control = `<input type="text" data-bind="${escapeAttribute(pathKey)}" data-kind="${options.nullable ? 'nullable' : 'text'}" value="${escapeAttribute(value || '')}" placeholder="${escapeAttribute(options.placeholder || '')}">`;
      }
      return `<div class="${classes}"><label>${escapeHtml(label)}</label>${control}${hint}</div>`;
    }

    function behaviorSelect(pathKey, label, options = {}) {
      const values = [{ value: '', label: options.blankLabel || '暂不指定' }]
        .concat((currentDocument()?.behaviors || []).map((item, index) => ({
          value: item.behavior_ref,
          label: `${index + 1}. ${item.behavior_name || '未命名行为'}`
        })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function dataSelect(pathKey, label, options = {}) {
      const values = [{ value: '', label: '暂不指定' }]
        .concat((currentDocument()?.data_objects || []).map((item, index) => ({
          value: item.data_ref,
          label: `${index + 1}. ${item.data_name || '未命名数据'}`
        })));
      return field(pathKey, label, { type: 'select', options: values, nullable: true, className: options.className || '' });
    }

    function multiBehavior(pathKey, label, selected) {
      const behaviors = currentDocument()?.behaviors || [];
      const content = behaviors.length
        ? behaviors.map((item, index) => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(item.behavior_ref)}"${selected.includes(item.behavior_ref) ? ' checked' : ''}> ${index + 1}. ${escapeHtml(item.behavior_name || '未命名行为')}</label>`).join('')
        : '<span class="technical-note">请先新增业务行为。</span>';
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function multiData(pathKey, label, selected) {
      const objects = currentDocument()?.data_objects || [];
      const content = objects.length
        ? objects.map((item, index) => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(item.data_ref)}"${selected.includes(item.data_ref) ? ' checked' : ''}> ${index + 1}. ${escapeHtml(item.data_name || '未命名数据')}</label>`).join('')
        : '<span class="technical-note">请先登记数据对象。</span>';
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function multiDepartments(pathKey, label, selected) {
      const content = DEPARTMENTS.map(department => `<label><input type="checkbox" data-list-bind="${escapeAttribute(pathKey)}" value="${escapeAttribute(department)}"${selected.includes(department) ? ' checked' : ''}> ${escapeHtml(department)}</label>`).join('');
      return `<div class="field wide"><span class="field-label">${escapeHtml(label)}</span><div class="check-list">${content}</div></div>`;
    }

    function section(title, hint, body, action = '') {
      return `<section class="section"><div class="section-head"><div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(hint)}</p></div>${action}</div><div class="section-body">${body}</div></section>`;
    }

    function emptyList(message) {
      return `<div class="empty-list">${escapeHtml(message)}</div>`;
    }

    function resetEditorNavigation(sectionName = 'basic') {
      activeEditorSection = sectionName;
      activeProcessSection = 'behaviors';
      activeBehaviorRef = '';
      activeFormRef = '';
      activeAreaRef = '';
    }

    function ensureActiveBehavior() {
      const behaviors = currentDocument()?.behaviors || [];
      let behavior = behaviors.find(item => item.behavior_ref === activeBehaviorRef);
      if (!behavior) behavior = behaviors[0] || null;
      activeBehaviorRef = behavior?.behavior_ref || '';
      return behavior;
    }

    function ensureActiveForm() {
      const forms = currentDocument()?.forms || [];
      let form = forms.find(item => item.form_ref === activeFormRef);
      if (!form) form = forms[0] || null;
      activeFormRef = form?.form_ref || '';
      if (!form) {
        activeAreaRef = '';
        return { form: null, formIndex: -1, area: null, areaIndex: -1 };
      }
      const mainArea = form.areas.find(item => item.area_type === '基本信息');
      let area = form.areas.find(item => item.area_ref === activeAreaRef);
      if (!area) area = mainArea || form.areas[0] || null;
      activeAreaRef = area?.area_ref || '';
      return {
        form,
        formIndex: forms.indexOf(form),
        area,
        areaIndex: area ? form.areas.indexOf(area) : -1
      };
    }

    function renderEditorNavigation() {
      return `
        <nav class="editor-navigation" aria-label="文字编制分区">
          ${EDITOR_SECTIONS.map(item => `
            <button
              class="editor-section-tab${activeEditorSection === item.value ? ' active' : ''}"
              data-action="switch-editor-section"
              data-section="${escapeAttribute(item.value)}"
            >${escapeHtml(item.label)}</button>
          `).join('')}
        </nav>`;
    }

    function renderProcessNavigation() {
      return `
        <nav class="process-navigation" aria-label="流程步骤内容">
          ${PROCESS_SECTIONS.map(item => `
            <button
              class="process-section-tab${activeProcessSection === item.value ? ' active' : ''}"
              data-action="switch-process-section"
              data-section="${escapeAttribute(item.value)}"
            >${escapeHtml(item.label)}</button>
          `).join('')}
        </nav>`;
    }

    function currentProcessKey(data = currentDocument()) {
      return text(data?.process?.process_ref).trim();
    }

    function currentDiagramModel(data = currentDocument()) {
      if (window.ProcessDiagram?.buildGraphModel) {
        return window.ProcessDiagram.buildGraphModel(data, {
          departmentOrder: actorDepartments()
        });
      }
      const namedBehaviorCount = (data?.behaviors || []).filter(item => text(item.behavior_name).trim()).length;
      return {
        nodes: [],
        backgrounds: [],
        edges: [],
        elements: [],
        lanes: [],
        namedBehaviorCount,
        localEdgeCount: 0,
        unresolvedItems: [],
        unresolvedCount: 0
      };
    }

    function previewStatus(model) {
      if (!model.namedBehaviorCount) return { label: '待填写行为', className: 'waiting' };
      if (model.unresolvedCount) return { label: `有 ${model.unresolvedCount} 项未显示`, className: 'warning' };
      return { label: '可查看', className: 'ready' };
    }

    function renderWorkspaceTabs(model) {
      const status = previewStatus(model);
      const editorActive = activeWorkspaceTab === 'editor';
      const diagramActive = activeWorkspaceTab === 'diagram';
      return `
        <div class="workspace-tabs-shell">
          <div class="workspace-tabs" role="tablist" aria-label="流程编制视图">
            <button
              class="workspace-tab${editorActive ? ' active' : ''}"
              id="editorTab"
              role="tab"
              aria-selected="${editorActive}"
              aria-controls="editorPanel"
              data-action="switch-tab"
              data-tab="editor"
            >文字编制</button>
            <button
              class="workspace-tab${diagramActive ? ' active' : ''}"
              id="diagramTab"
              role="tab"
              aria-selected="${diagramActive}"
              aria-controls="diagramPanel"
              data-action="switch-tab"
              data-tab="diagram"
            >
              跨职能流程图预览
              <span class="tab-status ${status.className}" id="diagramTabStatus">${escapeHtml(status.label)}</span>
            </button>
          </div>
        </div>`;
    }

    function renderPreviewGuidance(model) {
      const processKey = currentProcessKey();
      const showReady = model.namedBehaviorCount > 0 && !openedPreviewProcesses.has(processKey);
      return `
        <div class="preview-guidance">
          <div>
            <strong>什么时候可以查看跨职能流程图</strong>

    function renderDiagramWarnings(model) {
      if (!model.unresolvedItems.length) return '';
      return `
        <div class="diagram-warning-list" aria-label="未显示项目">
          <strong>有 ${model.unresolvedCount} 项内容无法绘制，请返回文字编制补齐：</strong>
          ${model.unresolvedItems.map(item => `
            <button
              class="diagram-warning-button"
              data-action="focus-editor"
              data-focus-kind="${escapeAttribute(item.focusKind)}"
              data-focus-ref="${escapeAttribute(item.focusRef)}"
            >${escapeHtml(item.message)}</button>

    function renderDiagramPanel(model) {
      if (!model.namedBehaviorCount) {

          </div>`;
      }
      const importedNotice = currentEntry()?.origin !== 'new'
        ? '<div class="diagram-notice">该图根据导入内容生成，仅用于核对，不代表已经审核。</div>'
        : '';
      const relationNotice = model.localEdgeCount === 0
        ? '<div class="diagram-notice warning">当前只能看到业务行为节点；本流程尚无明确流程关系，因此行为节点之间没有箭头。</div>'

          <div class="section-body">
            <div class="diagram-toolbar">
              <div>
                <h2>${escapeHtml(currentDocument().process.process_name || '未命名流程')} · 跨职能流程图预览</h2>
                <p>每条横向泳道代表执行部门，节点第二行显示执行岗位。图形只根据明确关系生成；用户可以平移、缩放和点击定位，但不能在图中编排流程。</p>

                <button class="button small" data-action="return-editor">返回文字编制</button>

            ${relationNotice}

              class="diagram-canvas"
              id="processDiagramCanvas"
              role="img"

            ></div>
            <div class="diagram-failure" id="diagramFailure" role="alert"></div>

          </div>

    function destroyDiagram() {
      if (!diagramView) return;
      try {
        diagramView.destroy();
      } catch (_error) {
        // The text editor must remain available even if the graph library has already released the canvas.
      }
      diagramView = null;
    }

    function mountDiagram() {
      destroyDiagram();
      if (activeWorkspaceTab !== 'diagram') return;
      const data = currentDocument();
      const model = currentDiagramModel(data);
      if (!data || !model.namedBehaviorCount) return;
      const container = document.getElementById('processDiagramCanvas');
      const failure = document.getElementById('diagramFailure');
      if (!container) return;
      try {
        diagramView = window.ProcessDiagram.mount({
          container,
          documentData: data,
          departmentOrder: actorDepartments(),
          onFocus: focusEditorItem
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `流程图暂时无法生成：${error.message}。当前文字内容仍然保留，可以继续编制或导出。`;
          failure.classList.add('show');
        }
      }
    }

    function setActiveWorkspaceTab(tab) {
      if (!currentDocument()) return;
      activeWorkspaceTab = tab === 'diagram' ? 'diagram' : 'editor';
      if (activeWorkspaceTab === 'editor') diagramExpanded = false;
      if (activeWorkspaceTab === 'diagram') {
        const model = currentDiagramModel();
        if (model.namedBehaviorCount) openedPreviewProcesses.add(currentProcessKey());
      }
      render();
    }

    function focusEditorItem(focusKind, focusRef) {
      if (focusKind === 'call') {
        showStatus('部门内调用仅用于预览，请在MDM平台正式功能中维护。');
        return;
      }
      diagramExpanded = false;
      activeWorkspaceTab = 'editor';
      activeEditorSection = 'process';
      if (focusKind === 'behavior') {
        activeProcessSection = 'behaviors';
        activeBehaviorRef = text(focusRef);
      } else if (focusKind === 'relation') {
        activeProcessSection = 'relations';
      } else if (focusKind === 'handoff') {
        activeProcessSection = 'handoffs';
      }
      render();
      requestAnimationFrame(() => {
        const card = Array.from(workspace.querySelectorAll('.item-card[data-focus-kind]')).find(item =>
          item.dataset.focusKind === focusKind && item.dataset.focusRef === text(focusRef)
        );
        if (!card) return;
        workspace.querySelectorAll('.focused-card').forEach(item => item.classList.remove('focused-card'));
        card.classList.add('focused-card');
        card.setAttribute('tabindex', '-1');
        card.focus({ preventScroll: true });
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (focusClearTimer) clearTimeout(focusClearTimer);
        focusClearTimer = setTimeout(() => card.classList.remove('focused-card'), 2600);
      });
    }

    function refreshPreviewAvailability() {
      if (!currentDocument()) return;
      const model = currentDiagramModel();
      const status = previewStatus(model);
      const badge = document.getElementById('diagramTabStatus');
      if (badge) {
        badge.textContent = status.label;
        badge.className = `tab-status ${status.className}`;
      }
      const callout = document.getElementById('previewReadyCallout');
      if (callout) {
        callout.hidden = !(model.namedBehaviorCount > 0 && !openedPreviewProcesses.has(currentProcessKey()));
      }
    }

    function selectInitialTabAfterImport() {
      const model = currentDiagramModel();
      resetEditorNavigation(model.namedBehaviorCount ? 'process' : 'basic');
      diagramExpanded = false;
      activeWorkspaceTab = model.namedBehaviorCount ? 'diagram' : 'editor';
      if (model.namedBehaviorCount) openedPreviewProcesses.add(currentProcessKey());
    }
