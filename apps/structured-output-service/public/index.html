      const options = [''].concat(DEPARTMENTS.filter(department =>
        department !== '全公司' && department !== owningDepartment
      ));
      if (currentValue && !options.includes(currentValue)) options.push(currentValue);
      return options;
    }

    function renderHandoffCreationActions(behavior) {
      const linked = currentDocument().cross_department_handoffs
        .filter(handoff => handoff.anchor_behavior_ref === behavior.behavior_ref);
      return `
        <details class="nested" open>
          <summary><strong>在此流程位置添加跨部门行为（当前${linked.length}条）</strong></summary>
          <p class="inline-note">新增后会生成一个外部门行为节点和一条跨部门关系。外部门的动作、执行部门和岗位只在该行为节点填写一次。</p>
          <div class="item-actions" style="margin-top:12px">
            <button
              class="button small"
              data-action="add-inbound-handoff"
              data-ref="${escapeAttribute(behavior.behavior_ref)}"
            >添加前置跨部门行为</button>
            <button
              class="button small"
              data-action="add-outbound-handoff"
              data-ref="${escapeAttribute(behavior.behavior_ref)}"
            >添加后续跨部门行为</button>
          </div>
        </details>`;
    }

    function itemOrderButtons(kind, itemRef, index, total, label) {
      return `
        <span class="selector-order-actions" aria-label="调整第${index + 1}项${escapeAttribute(label)}顺序">
          <button
            class="selector-order-button"
            data-action="move-${escapeAttribute(kind)}-up"
            data-ref="${escapeAttribute(itemRef)}"
            aria-label="上移第${index + 1}项${escapeAttribute(label)}"
            title="上移"
            ${index === 0 ? 'disabled' : ''}
          >↑</button>
          <button
            class="selector-order-button"
            data-action="move-${escapeAttribute(kind)}-down"
            data-ref="${escapeAttribute(itemRef)}"
            aria-label="下移第${index + 1}项${escapeAttribute(label)}"
            title="下移"
            ${index === total - 1 ? 'disabled' : ''}
          >↓</button>
        </span>`;
    }

    function orderedSelectorRow(kind, itemRef, index, total, label, buttonLabel, activeRef) {
      return `
        <div class="selector-row">
          <button
            class="selector-button${itemRef === activeRef ? ' active' : ''}"
            data-action="select-${escapeAttribute(kind)}"
            data-ref="${escapeAttribute(itemRef)}"
            title="${escapeAttribute(buttonLabel)}"
          >${escapeHtml(buttonLabel)}</button>
          ${itemOrderButtons(kind, itemRef, index, total, label)}
        </div>`;
    }

    function relationTypeLabel(relationType) {
      return RELATION_TYPES.find(option => option.value === relationType)?.label || '关系类型待选择';
    }

    function relationEndpointLabel(behaviorRef, emptyLabel) {
      const behavior = currentDocument().behaviors.find(item => item.behavior_ref === behaviorRef);
      return behavior ? behavior.behavior_name || '未命名业务行为' : emptyLabel;
    }

    function relationSelectorLabel(item, index) {
      const from = relationEndpointLabel(item.from_behavior_ref, '起点待选择');
      const to = relationEndpointLabel(item.to_behavior_ref, '终点待选择');
      return `${index + 1}. ${relationTypeLabel(item.relation_type)}：${from} → ${to}`;
    }

    function dataSelectorLabel(item, index) {
      return `${index + 1}. ${text(item.data_name).trim() || '未命名数据'}`;
    }

    function handoffSelectorLabel(item, index) {
      const directionLabel = item.handoff_direction === 'inbound_prerequisite' ? '前置输入' : '后续承接';
      const targetDepartment = text(
        item.handoff_direction === 'inbound_prerequisite' ? item.source_department : item.target_department
      ).trim() || '责任部门待明确';
      const requestedMatter = text(item.requested_matter).trim() || '承接事项待填写';
      return `${index + 1}. ${directionLabel} · ${targetDepartment}：${requestedMatter}`;
    }

    function updateOrderedSelectorLabel(kind, itemRef, buttonLabel) {
      const selector = workspace.querySelector(
        `[data-action="select-${CSS.escape(kind)}"][data-ref="${CSS.escape(itemRef)}"]`
      );
      if (!selector) return;
      selector.textContent = buttonLabel;
      selector.title = buttonLabel;
    }

    function updateFlowHandoffSelectorLabel(handoff) {
      const selector = workspace.querySelector(
        `[data-action="select-flow-handoff"][data-ref="${CSS.escape(handoff.handoff_ref)}"]`
      );
      if (!selector) return;
      const itemIndex = flowItems().findIndex(item =>
        item.kind === 'handoff' && item.handoff.handoff_ref === handoff.handoff_ref
      );
      const externalDepartment = externalDepartmentForHandoff(handoff) || '承接部门待明确';
      const actionName = text(counterpartyBehaviorForHandoff(handoff)?.behavior_name).trim()
        || text(handoff.counterparty_behavior_name).trim()
        || text(handoff.requested_matter).trim()
        || '办理动作待填写';
      const label = selector.querySelector('span:last-child');
      if (label) label.textContent = `${itemIndex + 1}. ${externalDepartment}：${actionName}`;
    }

    function renderHandoffEditor(item, index) {
      if (!item || index < 0) return `<div class="record-editor">${emptyList('当前没有可编辑的跨部门待办。')}</div>`;
      const direction = item.handoff_direction === 'inbound_prerequisite'
        ? 'inbound_prerequisite'
        : 'outbound_followup';
      const externalDepartmentPath = direction === 'inbound_prerequisite'
        ? `cross_department_handoffs.${index}.source_department`
        : `cross_department_handoffs.${index}.target_department`;
      const directionLabel = direction === 'inbound_prerequisite'
        ? '本行为开始前，由外部门提供输入'
        : '本行为完成后，系统生成跨部门待办';
      const owningDepartment = currentExecutionDepartment() || '本流程归口部门待填写';
      const trigger = text(item.trigger_condition).trim() || defaultHandoffTrigger(direction, item.anchor_behavior_ref);
      const placementWarning = item.anchor_behavior_ref
        ? ''
        : '<div class="inline-warning">当前待办尚未关联本流程行为。请在“调整位置与可选信息”中选择发起或接收位置。</div>';
      return `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="handoff" data-focus-ref="${escapeAttribute(item.handoff_ref)}">
            <div class="item-title">
              <strong>跨部门待办 ${index + 1} · ${escapeHtml(directionLabel)}</strong>
              <button class="button danger small" data-action="remove-handoff" data-index="${index}">删除当前待办</button>
            </div>
            <div class="inline-note">${direction === 'inbound_prerequisite' ? '本流程接收行为' : '本部门发起动作'}：${escapeHtml(behaviorLabel(item.anchor_behavior_ref))}；本流程部门：${escapeHtml(owningDepartment)}；默认触发时点：${escapeHtml(trigger)}。</div>
            ${placementWarning}
            <div class="grid" style="margin-top:12px">
              ${field(externalDepartmentPath, direction === 'inbound_prerequisite' ? '提供输入的外部门' : '承接部门', {
                type: 'select',
                options: handoffExternalDepartmentOptions(item),
                hint: '选择后，页面自动把外部门识别状态改为“已明确”。'
              })}
              ${field(`cross_department_handoffs.${index}.counterparty_behavior_name`, direction === 'inbound_prerequisite' ? '提供部门办理动作' : '承接部门办理动作', {
                placeholder: '例如：物资保障部计划员发放工装序列号',
                hint: '这是旧文件和外部流程引用的兼容输入。新建跨部门行为时，办理动作直接使用关联行为的名称。'
              })}
              ${field(`cross_department_handoffs.${index}.requested_matter`, '需要处理或提供的事项', {
                type: 'textarea',
                className: 'half',
                placeholder: '例如：根据工装图号和名称提供工装序列号'
              })}
              ${field(`cross_department_handoffs.${index}.completion_standard`, '外部门怎样算完成', {
                type: 'textarea',
                className: 'half',
                placeholder: '写明关闭待办所需的结果或判定标准'
              })}
              ${dataSelect(
                `cross_department_handoffs.${index}.transfer_data_ref`,
                direction === 'inbound_prerequisite' ? '外部门提供的输入数据（可选）' : '发给外部门的数据（可选）'
              )}
              ${direction === 'outbound_followup'
                ? field(`cross_department_handoffs.${index}.requires_return`, '是否需要返回本流程', { type: 'checkbox', className: 'wide', checkboxLabel: '外部门完成并关闭待办后，需要返回数据并恢复本流程' })
                : ''}
              ${direction === 'outbound_followup' && item.requires_return
                ? dataSelect(`cross_department_handoffs.${index}.returned_data_ref`, '外部门完成后返回的数据')
                : ''}
              ${direction === 'outbound_followup' && item.requires_return
                ? behaviorSelect(`cross_department_handoffs.${index}.resume_behavior_ref`, '返回后本流程从哪个行为继续')
                : ''}
            </div>
            <details class="nested">
              <summary><strong>调整位置与可选信息</strong></summary>
              <div class="grid" style="margin-top:12px">
                ${field(`cross_department_handoffs.${index}.handoff_direction`, '承接方向', {
                  type: 'select',
                  options: [
                    { value: 'inbound_prerequisite', label: '本行为开始前，由外部门提供输入' },
                    { value: 'outbound_followup', label: '本行为完成后，交给外部门办理' }
                  ]
                })}
                ${behaviorSelect(`cross_department_handoffs.${index}.anchor_behavior_ref`, '关联哪个本流程行为', { blankLabel: '请选择' })}
                ${field(`cross_department_handoffs.${index}.trigger_condition`, '触发条件（已自动带出，可修改）', { type: 'textarea', className: 'half' })}
                ${field(`cross_department_handoffs.${index}.counterparty_process_name`, '外部门对应流程名称（如已知）')}
              </div>
            </details>
          </div>
        </div>`;
    }

    function renderLinkedHandoffFields(behavior, handoff, handoffIndex) {
      if (!behavior || !handoff || handoffIndex < 0) return '';
      const direction = handoff.handoff_direction === 'inbound_prerequisite'
        ? 'inbound_prerequisite'
        : 'outbound_followup';
      const directionLabel = direction === 'inbound_prerequisite'
        ? '该外部门行为完成后，本流程关联行为才能开始'
        : '本流程关联行为完成后，启动该外部门行为';
      const trigger = text(handoff.trigger_condition).trim()
        || defaultHandoffTrigger(direction, handoff.anchor_behavior_ref);
      return `
        <details class="nested" open>
          <summary><strong>跨部门关系（与当前行为共用一条记录）</strong></summary>
          <div class="inline-note" style="margin-top:12px">${escapeHtml(directionLabel)}。当前行为的名称、执行部门、执行岗位和完成标准以上方行为信息为准，不在跨部门关系中重复填写。</div>
          <div class="grid" style="margin-top:12px">
            ${field(`cross_department_handoffs.${handoffIndex}.handoff_direction`, '交接方向', {
              type: 'select',
              options: [
                { value: 'inbound_prerequisite', label: '外部门先办理，再进入本流程关联行为' },
                { value: 'outbound_followup', label: '本流程关联行为完成后，交给外部门办理' }
              ]
            })}
            ${behaviorSelect(`cross_department_handoffs.${handoffIndex}.anchor_behavior_ref`, direction === 'inbound_prerequisite' ? '本流程接收位置' : '本流程发起位置', { blankLabel: '请选择', excludeRef: behavior.behavior_ref, localOnly: true })}
            ${field(`cross_department_handoffs.${handoffIndex}.requested_matter`, '需要处理或提供的事项', {
              type: 'textarea',
              className: 'half',
              placeholder: '写清交给外部门处理什么，或需要外部门提供什么'
            })}
            ${dataSelect(
              `cross_department_handoffs.${handoffIndex}.transfer_data_ref`,
              direction === 'inbound_prerequisite' ? '外部门提供的输入数据（可选）' : '发给外部门的数据（可选）'
            )}
            ${direction === 'outbound_followup'
              ? field(`cross_department_handoffs.${handoffIndex}.requires_return`, '是否需要返回本流程', { type: 'checkbox', className: 'wide', checkboxLabel: '外部门完成后，需要返回数据并从指定位置继续' })
              : ''}
            ${direction === 'outbound_followup' && handoff.requires_return
              ? dataSelect(`cross_department_handoffs.${handoffIndex}.returned_data_ref`, '外部门完成后返回的数据')
              : ''}
            ${direction === 'outbound_followup' && handoff.requires_return
              ? behaviorSelect(`cross_department_handoffs.${handoffIndex}.resume_behavior_ref`, '返回后本流程从哪个行为继续', { excludeRef: behavior.behavior_ref, localOnly: true })
              : ''}
            ${field(`cross_department_handoffs.${handoffIndex}.counterparty_process_name`, '外部门对应流程名称（如已知）')}
          </div>
          <div class="inline-note">触发时点由交接方向和关联位置自动确定：${escapeHtml(trigger)}。</div>
        </details>`;
    }

    function renderBehaviors() {
      const active = ensureActiveFlowItem();
      const item = active?.kind === 'behavior' ? active.behavior : null;
      const index = active?.kind === 'behavior' ? active.behaviorIndex : -1;
      const counterpartyLink = active?.kind === 'behavior' ? active.counterpartyLink : null;
      const flowDetails = currentDataFlowDetails();
      const hasDerivedEntry = item
        ? (flowDetails.incomingByBehavior.get(item.behavior_ref) || []).length > 0
        : false;
      const isControlNode = item ? ['parallel_split', 'parallel_join'].includes(item.node_type) : false;
      const nodeTypeHint = item?.node_type === 'parallel_split'
        ? '并行开始是控制节点，不承担实际业务动作。请在流程关系中至少新增2条以本节点为起点、流向不同后续行为的并行路线。'
        : item?.node_type === 'parallel_join'
          ? '并行汇合是控制节点，不承担实际业务动作。至少2条路线完成后才从本节点继续；跨部门路线返回时把恢复位置设为本节点。'
          : '新增时默认留空，必须由编制人判断。实际办理工作请选择“业务行为”。';
      const projectedItems = flowItems();
      const selector = projectedItems.length
        ? projectedItems.map((flowItem, flowIndex) => {
            if (flowItem.kind === 'handoff') {
              const handoff = flowItem.handoff;
              const externalDepartment = externalDepartmentForHandoff(handoff) || '承接部门待明确';
              const actionName = text(counterpartyBehaviorForHandoff(handoff)?.behavior_name).trim()
                || text(handoff.counterparty_behavior_name).trim()
                || text(handoff.requested_matter).trim()
                || '办理动作待填写';
              return `
                <div class="selector-row">
                  <button
                    class="selector-button flow-item-button handoff${active?.kind === 'handoff' && handoff.handoff_ref === active.handoff.handoff_ref ? ' active' : ''}"
                    data-action="select-flow-handoff"
                    data-ref="${escapeAttribute(handoff.handoff_ref)}"
                  ><span class="flow-item-badge">跨部门待办</span><span>${flowIndex + 1}. ${escapeHtml(externalDepartment)}：${escapeHtml(actionName)}</span></button>
                </div>`;
            }
            const behavior = flowItem.behavior;
            const behaviorIndex = flowItem.behaviorIndex;
            const externalDepartment = externalActorDepartment(behavior.current_actor_role);
            const isLinkedExternal = Boolean(flowItem.counterpartyLink);
            const assignmentMode = actorAssignmentMode(behavior);
            const behaviorBadge = assignmentMode === 'dynamic_from_data'
              ? '动态责任部门行为'
              : assignmentMode === 'company_wide'
                ? '全公司通用行为'
                : isLinkedExternal
                  ? '跨部门行为'
                  : externalDepartment
                    ? '跨部门关系待归并'
                    : behavior.node_type === 'action'
                      ? '本部门行为'
                      : '流程节点';
            return `
            <div class="selector-row">
              <button
                class="selector-button flow-item-button${behavior.behavior_ref === item?.behavior_ref ? ' active' : ''}"
                data-action="select-behavior"
                data-ref="${escapeAttribute(behavior.behavior_ref)}"
              ><span class="flow-item-badge">${behaviorBadge}</span><span>${flowIndex + 1}. ${escapeHtml(behavior.behavior_name || '未命名业务行为')}</span></button>
              <span class="selector-order-actions" aria-label="调整第${behaviorIndex + 1}项业务行为顺序">
                <button
                  class="selector-order-button"
                  data-action="move-behavior-up"
                  data-ref="${escapeAttribute(behavior.behavior_ref)}"
                  aria-label="上移第${behaviorIndex + 1}项业务行为"
                  title="上移"
                  ${behaviorIndex === 0 ? 'disabled' : ''}
                >↑</button>
                <button
                  class="selector-order-button"
                  data-action="move-behavior-down"
                  data-ref="${escapeAttribute(behavior.behavior_ref)}"
                  aria-label="下移第${behaviorIndex + 1}项业务行为"
                  title="下移"
                  ${behaviorIndex === currentDocument().behaviors.length - 1 ? 'disabled' : ''}
                >↓</button>
              </span>
            </div>
          `;
          }).join('')
        : '<span class="technical-note">尚未添加本部门业务行为或跨部门待办。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="behavior" data-focus-ref="${escapeAttribute(item.behavior_ref)}">
            <div class="item-title">
              <strong>业务行为或节点 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-behavior" data-index="${index}">删除当前行为</button>
            </div>
            <div class="grid">
              ${field(`behaviors.${index}.node_type`, '节点类型', { type: 'select', options: NODE_TYPES, hint: nodeTypeHint })}
              ${field(`behaviors.${index}.behavior_name`, '业务行为或节点名称', { hint: '这是流程节点的主内容，用于流程图、流程关系和工作角色绑定。' })}
              ${field(`behaviors.${index}.behavior_description`, '具体做什么（补充说明，可选）', {
                type: 'textarea',
                className: 'wide',
                hint: '补充说明实际操作，供PMO和部门业务人员沟通；不会替代业务行为名称，也不显示在流程图节点上。'
              })}
              ${actorAssignmentEditor(index, item, flowDetails)}
              ${hasDerivedEntry ? '' : field(`behaviors.${index}.trigger`, '流程如何开始', {
                type: 'textarea',
                className: 'half',
                hint: '只有流程入口需要填写。建立前序流程关系或跨部门返回关系后，本项由关系自动带出。'
              })}
              ${field(`behaviors.${index}.timing`, '办理时限（可选）', { nullable: true })}
              ${isControlNode
                ? '<div class="field half"><span class="field-label">完成标准</span><div class="inline-note">并行控制节点只控制路线启动或汇合，不承担实际业务动作，无需填写完成标准。</div></div>'
                : field(`behaviors.${index}.completion_standard`, '怎样算完成', {
                    type: 'textarea',
                    className: 'half',
                    hint: '只写该行为完成的判定标准，不重复填写输出物名称。'
                  })}
              ${renderBehaviorDerivedSummary(item, flowDetails)}
            </div>
            <details class="nested">
              <summary><strong>其他开始条件与会签（按需填写）</strong></summary>
              <div class="grid" style="margin-top:12px">
                ${field(`behaviors.${index}.precondition`, '其他开始条件（可选）', {
                  type: 'textarea',
                  className: 'wide',
                  hint: '只填写流程关系和输入数据不能表达的额外限制；没有额外限制时留空。'
                })}
                ${field(`behaviors.${index}.countersign_all_required`, '会签要求', { type: 'checkbox', className: 'wide', checkboxLabel: '这是会签行为，全部指定对象确认知悉后才算完成' })}
                ${multiDepartments(`behaviors.${index}.countersign_target_departments`, '需要确认知悉的部门', item.countersign_target_departments)}
              </div>
            </details>
            ${renderLegacyBehaviorSupplement(item, hasDerivedEntry)}
            ${counterpartyLink
              ? renderLinkedHandoffFields(item, counterpartyLink.handoff, counterpartyLink.handoffIndex)
              : externalActorDepartment(item.current_actor_role)
                ? ''
                : renderHandoffCreationActions(item)}
            ${item.work_role ? '<div class="inline-note">原文件包含与当前业务行为绑定的正式工作角色。3001会在导出时保留该内容，但本页面不新增或编辑正式工作角色。</div>' : ''}
          </div>
        </div>` : active?.kind === 'handoff'
          ? renderHandoffEditor(active.handoff, active.handoffIndex)
          : `<div class="record-editor">${emptyList('尚未添加业务流程步骤。点击“添加本部门业务行为或节点”开始编制。')}</div>`;
      const body = `
        <div class="record-workbench">
          <aside class="record-selector" aria-label="业务流程步骤列表">${selector}</aside>
          ${editor}
        </div>`;
      return section(
        '业务流程',
        '本部门行为和跨部门行为按流程位置统一显示。跨部门行为的动作、执行部门和岗位只填写一次；跨部门关系只补充交接事项、数据和返回位置。',
        body,
        '<button class="button small" data-action="add-behavior">添加业务行为或节点</button>'
      );
    }

    function renderRelations() {
      const active = ensureActiveRelation();
      const item = active.item;
      const index = active.index;
      const guidance = `
        <aside class="relation-guidance" aria-labelledby="relationGuidanceTitle">
          <h3 id="relationGuidanceTitle">顺序、判断分支、流程内部回路和并行路线怎么选？</h3>
          <div class="relation-guidance-grid">
            <div class="relation-guidance-card">
              <strong>顺序</strong>
              <p>当前节点完成后，默认进入下一业务行为。判断节点可以用一条顺序关系表示默认继续路径，不需要填写条件。</p>
            </div>
            <div class="relation-guidance-card">
              <strong>判断分支</strong>
              <p>需要按某个明确判断结果进入后续步骤时使用。需要填写判断条件和要去的步骤。</p>
            </div>
            <div class="relation-guidance-card">
              <strong>流程内部回路</strong>
              <p>因为审核不通过、材料有误等原因，退回本流程前面已经存在的步骤重新处理。需要填写退回条件和退回位置。</p>
            </div>
            <div class="relation-guidance-card">
              <strong>并行路线</strong>
              <p>从并行开始节点同时启动多条办理路线时使用。并行开始至少需要2条并行路线；并行汇合至少需要2个有效来源。</p>
            </div>
          </div>
          <p class="relation-guidance-emphasis">承接顺序或判断分支的后续节点仍可以是普通业务行为。是否选择判断节点，只取决于该节点本身是否还要继续判断。</p>
          <p class="relation-guidance-example">例：部门负责人审核报销单。审核通过 → 使用顺序关系进入财务复核；审核不通过 → 使用流程内部回路退回申请人补充材料。财务复核仍是普通业务行为。</p>
        </aside>`;
      const selector = currentDocument().flow_relations.length
        ? currentDocument().flow_relations.map((relation, relationIndex) =>
            orderedSelectorRow(
              'relation',
              relation.relation_ref,
              relationIndex,
              currentDocument().flow_relations.length,
              '流程关系',
              relationSelectorLabel(relation, relationIndex),
              activeRelationRef
            )
          ).join('')
        : '<span class="technical-note">尚未添加流程关系。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="relation" data-focus-ref="${escapeAttribute(item.relation_ref)}">
            <div class="item-title">
              <strong>流程关系 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-relation" data-index="${index}">删除当前关系</button>
            </div>
            <div class="grid">
              ${field(`flow_relations.${index}.relation_type`, '关系类型', {
                type: 'select',
                options: RELATION_TYPES,
                hint: '默认继续下一步选择“顺序”；按判断结果进入后续步骤选择“判断分支”；退回前序步骤选择“流程内部回路”；同时启动或汇合多条路线选择“并行路线”。'
              })}
              ${behaviorSelect(`flow_relations.${index}.from_behavior_ref`, '从哪个行为开始', { blankLabel: '请选择' })}
              ${behaviorSelect(`flow_relations.${index}.to_behavior_ref`, '流向哪个行为')}
              ${field(`flow_relations.${index}.condition`, '判断分支条件或回路触发条件（顺序关系可不填）', { type: 'textarea', className: 'half' })}
              ${field(`flow_relations.${index}.join_mode`, '汇合方式', {
                type: 'select',
                options: [{ value: '', label: '不适用' }, { value: 'all', label: '全部分支完成后汇合' }]
              })}
            </div>
          </div>
        </div>` : `
        <div class="record-editor">${emptyList('尚未添加流程关系。点击“添加流程关系”开始编制。')}</div>`;
      const workbench = `
        <div class="record-workbench">
          <aside class="record-selector" aria-label="流程关系列表">${selector}</aside>
          ${editor}
        </div>`;
      return section(
        '流程关系',
        '一次只编辑一条流程关系。左侧顺序只用于整理条目，不代表流程先后关系。',
        `${guidance}${workbench}`,
        '<button class="button small" data-action="add-relation">添加流程关系</button>'
      );
    }

    function renderDataObjects() {
      const active = ensureActiveDataObject();
      const item = active.item;
      const index = active.index;
      const flowDetails = currentDataFlowDetails();
      const flowDetail = item ? flowDetails.dataDetails.find(detail => detail.dataRef === item.data_ref) : null;
      const legacyProducerRefs = flowDetail?.producerRefs.filter(ref => ref !== flowDetail.canonicalProducerRef) || [];
      const legacyConsumerRefs = flowDetail?.legacyConsumerRefs.filter(ref => !flowDetail.canonicalConsumerRefs.includes(ref)) || [];
      const legacyReferenceNote = legacyProducerRefs.length || legacyConsumerRefs.length
        ? `<div class="inline-note">当前数据保留了旧版业务行为中的数据引用。页面不会在导入时自动改写；修改“产生行为”或“使用行为”后，只归一当前一类关系。</div>`
        : '';
      const selector = currentDocument().data_objects.length
        ? currentDocument().data_objects.map((dataObject, dataIndex) =>
            orderedSelectorRow(
              'data',
              dataObject.data_ref,
              dataIndex,
              currentDocument().data_objects.length,
              '输出物与数据',
              dataSelectorLabel(dataObject, dataIndex),
              activeDataRef
            )
          ).join('')
        : '<span class="technical-note">尚未登记数据对象。</span>';
      const editor = item ? `
        <div class="record-editor">
          <div class="item-card" data-focus-kind="data" data-focus-ref="${escapeAttribute(item.data_ref)}">
            <div class="item-title">
              <strong>待治理数据 ${index + 1}</strong>
              <button class="button danger small" data-action="remove-data" data-index="${index}">删除当前数据</button>
            </div>
            <div class="grid">
              ${field(`data_objects.${index}.data_name`, '数据名称')}
              ${dataProducerBehaviorSelect(index, item, flowDetails)}
              ${field(`data_objects.${index}.description`, '数据说明', { type: 'textarea', className: 'half' })}
              ${dataConsumerBehaviorPicker(index, item, flowDetails)}
            </div>
            ${legacyReferenceNote}
          </div>
        </div>` : `
        <div class="record-editor">${emptyList('尚未登记数据对象。点击“登记数据对象”开始编制。')}</div>`;
      const body = `
        <div class="record-workbench">
          <aside class="record-selector" aria-label="输出物与数据列表">${selector}</aside>
          ${editor}
        </div>`;
      return section(
        '输出物与数据使用',
        '这里是业务行为输入和输出的唯一编辑入口。只能把数据提供给流程中明确位于产生行为之后的行为；3001不判断主数据、黄金源、数据责任和质量规则。',
        body,
        '<button class="button small" data-action="add-data">登记数据对象</button>'
      );
    }

    function renderHandoffs() {
      const items = currentDocument().cross_department_handoffs;
      const body = items.length
        ? `<div class="handoff-summary-list" aria-label="跨部门待办只读汇总">${items.map((item, index) => {
            const directionLabel = item.handoff_direction === 'inbound_prerequisite' ? '前置输入' : '后续承接';
            const department = externalDepartmentForHandoff(item) || '承接部门待明确';
            const actionName = text(counterpartyBehaviorForHandoff(item)?.behavior_name).trim()
              || text(item.counterparty_behavior_name).trim()
              || '办理动作待填写';
            const matter = text(item.requested_matter).trim() || '处理事项待填写';
            const returnSummary = item.requires_return
              ? `需要返回；恢复位置：${behaviorLabel(item.resume_behavior_ref)}`
              : '不需要返回本流程';
            return `
              <article class="handoff-summary-card" data-focus-kind="handoff" data-focus-ref="${escapeAttribute(item.handoff_ref)}">
                <div class="item-title">
                  <strong>${index + 1}. ${escapeHtml(directionLabel)} · ${escapeHtml(department)}</strong>
                  <button class="button secondary small" data-action="open-flow-handoff" data-ref="${escapeAttribute(item.handoff_ref)}">返回业务流程查看或编辑</button>
                </div>
                <div>本流程位置：${escapeHtml(behaviorLabel(item.anchor_behavior_ref))}</div>
                <div>承接部门办理动作：${escapeHtml(actionName)}</div>
                <div>需要处理或提供的事项：${escapeHtml(matter)}</div>
                <div>${escapeHtml(returnSummary)}</div>
              </article>`;
          }).join('')}</div>`
        : emptyList('当前流程没有跨部门待办。请回到“业务流程”，在对应本部门行为处直接添加。');
      return section(
        '跨部门待办汇总',
        '这里只集中查看，不新增、不修改。跨部门行为及其交接关系都在“业务流程”的同一个位置维护；归口部门审核导入3000后，系统才生成正式待办。',
        body
      );
    }

    function renderForms() {
      const active = ensureActiveForm();
      const addButtons = `
        <div class="form-primary-actions">
          <button class="button small" data-action="add-current-form">录入现有表单</button>
          <button class="button small secondary" data-action="add-proposed-form">设计新建／优化表单</button>
        </div>`;
      if (!active.form) {
        return section(
          '表单与记录',
          '按一张纸质表单的完整字段录入。只有新增表单后才创建空白编辑对象，3001不会自动生成表单。',
          emptyList('当前流程没有表单或记录。'),
          addButtons
        );
      }

      const { form, formIndex } = active;
      const formSelector = currentDocument().forms.map((item, index) => `
        <button
          class="selector-button${item.form_ref === form.form_ref ? ' active' : ''}"
          data-action="select-form"
          data-ref="${escapeAttribute(item.form_ref)}"
        ><span>${index + 1}. ${escapeHtml(item.form_name || '未命名表单或记录')}</span>${formDesignStateBadge(item.form_design_state)}</button>
      `).join('');

      let detailNumber = 0;
      let mainNumber = 0;
      let unassignedNumber = 0;
      const detailAreaIndices = form.areas
        .map((area, areaIndex) => area.area_type === '明细清单' ? areaIndex : -1)
        .filter(areaIndex => areaIndex >= 0);
      const groups = form.areas.map((area, areaIndex) => {
        let groupLabel = '';
        let groupClass = '';
        let detailPosition = -1;
        if (area.area_type === '基本信息') {
          mainNumber += 1;
          groupLabel = mainNumber === 1 ? '主表字段' : `主表字段 ${mainNumber}`;
        } else if (area.area_type === '明细清单') {
          detailNumber += 1;
          detailPosition = detailAreaIndices.indexOf(areaIndex);
          groupLabel = area.area_title || `明细表${detailNumber}`;
        } else {
          unassignedNumber += 1;
          groupLabel = unassignedNumber === 1 ? '字段归属待确认' : `字段归属待确认 ${unassignedNumber}`;
          groupClass = ' unassigned';
        }
        const rows = area.items.map((item, itemIndex) => `
          <tr class="form-field-row" data-focus-kind="area" data-focus-ref="${escapeAttribute(area.area_ref)}">
            <td class="form-field-number" data-label="序号">${itemIndex + 1}</td>
            <td data-label="字段名称">${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.item_name`, '字段名称')}</td>
            <td data-label="数据类型">${formItemTypeField(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.item_type`, item.item_type)}</td>
            <td data-label="字段归属">${formItemAssignmentField(formIndex, areaIndex, itemIndex, item)}</td>
            <td data-label="必填">${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.required`, '是否必填', { type: 'checkbox', checkboxLabel: '必填' })}</td>
            <td class="form-field-instructions" data-label="填写说明">${field(`forms.${formIndex}.areas.${areaIndex}.items.${itemIndex}.instructions`, '填写说明', { type: 'textarea' })}</td>
            <td data-label="排序">
              <div class="form-field-actions">
                <button class="button secondary small" data-action="move-form-item-up" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="上移字段${itemIndex + 1}" title="上移" ${itemIndex === 0 ? 'disabled' : ''}>↑</button>
                <button class="button secondary small" data-action="move-form-item-down" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="下移字段${itemIndex + 1}" title="下移" ${itemIndex === area.items.length - 1 ? 'disabled' : ''}>↓</button>
              </div>
            </td>
            <td data-label="删除"><button class="button danger small" data-action="remove-form-item" data-form-index="${formIndex}" data-area-index="${areaIndex}" data-index="${itemIndex}" aria-label="删除字段${itemIndex + 1}">删除</button></td>
          </tr>`).join('');
        const groupHead = area.area_type === '明细清单' ? `
          <div class="form-field-group-head">
            <div class="form-field-group-title">
              <strong>${escapeHtml(groupLabel)}</strong>
              ${field(`forms.${formIndex}.areas.${areaIndex}.area_title`, '明细表标题', { placeholder: `未填写时页面显示“明细表${detailNumber}”` })}
            </div>
            <div class="item-actions">
              <button class="button secondary small" data-action="move-detail-area-up" data-form-index="${formIndex}" data-index="${areaIndex}" ${detailPosition <= 0 ? 'disabled' : ''}>上移明细表</button>
              <button class="button secondary small" data-action="move-detail-area-down" data-form-index="${formIndex}" data-index="${areaIndex}" ${detailPosition === detailAreaIndices.length - 1 ? 'disabled' : ''}>下移明细表</button>
              <button class="button danger small" data-action="remove-detail-area" data-form-index="${formIndex}" data-index="${areaIndex}">删除明细表</button>
            </div>
          </div>` : `<div class="form-field-group-head"><strong>${escapeHtml(groupLabel)}</strong></div>`;
        return `
          <tbody class="form-field-group${groupClass}" data-focus-kind="area" data-focus-ref="${escapeAttribute(area.area_ref)}">
            <tr class="form-field-group-row${groupClass}"><th colspan="8">${groupHead}</th></tr>
            ${rows || `<tr class="form-field-group-empty"><td colspan="8">${escapeHtml(`${groupLabel}中还没有字段。`)}</td></tr>`}
          </tbody>`;
      }).join('');
      const fieldsTable = form.areas.length ? `
        <div class="form-field-table-shell">
          <table class="form-field-table">
            <colgroup>
              <col style="width:54px"><col style="width:170px"><col style="width:140px"><col style="width:170px">
              <col style="width:82px"><col><col style="width:90px"><col style="width:76px">
            </colgroup>
            <thead><tr><th>序号</th><th>字段名称</th><th>数据类型</th><th>字段归属</th><th>必填</th><th>填写说明</th><th>排序</th><th>删除</th></tr></thead>
            ${groups}
          </table>
        </div>` : emptyList('尚未录入字段。点击“添加字段”后，再明确字段属于主表还是哪张明细表。');

      const body = `
        <div class="form-workbench">
          <aside class="form-sidebar">
            ${formSelector}
            ${addButtons}
          </aside>
          <div class="form-editor">
            <div class="item-card" data-focus-kind="form" data-focus-ref="${escapeAttribute(form.form_ref)}">
              <div class="item-title">
                <strong>整张表单</strong>
                <button class="button danger small" data-action="remove-form" data-index="${formIndex}">删除当前表单或记录</button>
              </div>
              <div class="grid">
                ${field(`forms.${formIndex}.form_design_state`, '表单状态', {
                  type: 'select',
                  options: [
                    { value: 'unspecified', label: '待确认（历史文件兼容）' },
                    { value: 'current_state', label: '现状表单' },
                    { value: 'proposed_design', label: '新建或优化表单' }
                  ],
                  hint: '3001不会根据名称、编号或明细表数量推断。'
                })}
                ${field(`forms.${formIndex}.form_name`, '表单或记录名称')}
                ${field(`forms.${formIndex}.form_no`, '表单或记录编号（如有）', { nullable: true })}
                ${behaviorSelect(`forms.${formIndex}.behavior_ref`, '关联业务行为（可选）')}
              </div>
            </div>
            ${fieldsTable}
            <button class="button small" data-action="add-form-item" data-form-index="${formIndex}">添加字段</button>
          </div>
        </div>`;
      return section(
        '表单与记录',
        '一次查看并录入整张纸质表单的字段。字段归属只用于整理导出JSON，不会创建数据库表；现状表单有几张明细表就保留几张。',
        body,
        addButtons
      );
    }

    function renderTerms() {
      const items = currentDocument().terms.map((item, index) => `
        <div class="item-card">
          <div class="item-title">
            <strong>术语 ${index + 1}</strong>
            <button class="button danger small" data-action="remove-term" data-index="${index}">删除</button>
          </div>
          <div class="grid">
            ${field(`terms.${index}.term_name`, '术语名称')}
            ${field(`terms.${index}.definition`, '定义', { type: 'textarea', className: 'wide' })}
          </div>
        </div>`).join('');
      return section(
        '术语定义',
        '只记录本流程需要解释的业务术语。',
        items || emptyList('尚未添加术语。'),
        '<button class="button small" data-action="add-term">添加术语</button>'
      );
    }

    function renderProcessEditor() {
      const content = {
        behaviors: renderBehaviors,
        relations: renderRelations,
        data: renderDataObjects,
        handoffs: renderHandoffs
      }[activeProcessSection] || renderBehaviors;
      return `${renderProcessNavigation()}${content()}`;
    }

    function exportWarningLocationAttributes(item) {
      const focusPaths = Array.isArray(item.focusPaths) && item.focusPaths.length
        ? JSON.stringify(item.focusPaths)
        : '';
      return [
        ['data-editor-section', item.editorSection],
        ['data-process-section', item.processSection],
        ['data-focus-kind', item.focusKind],
        ['data-focus-ref', item.focusRef],
        ['data-focus-path', item.focusPath],
        ['data-focus-paths', focusPaths]
      ]
        .filter(([, value]) => text(value))
        .map(([name, value]) => `${name}="${escapeAttribute(value)}"`)
        .join(' ');
    }

    function structureScoreIssueIdentity(item) {
      const values = [
        item.editorSection,
        item.processSection,
        item.focusKind,
        item.focusRef,
        item.focusPath,
        ...(Array.isArray(item.focusPaths) ? item.focusPaths : [])
      ].map(value => text(value).trim());
      return values.some(Boolean) ? values.join('::') : '';
    }

    function currentStructureScoreKey() {
      try {
        return `${currentIndex}:${JSON.stringify(currentDocument())}`;
      } catch (_error) {
        return `${currentIndex}:unserializable`;
      }
    }

    function createStructureScoreSnapshot() {
      const snapshot = JSON.parse(JSON.stringify(currentDocument()));
      syncRoles(snapshot);
      return snapshot;
    }

    function ensureStructureScoreState() {
      const documentKey = currentStructureScoreKey();
      if (
        structureScoreState.candidateIndex === currentIndex
        && structureScoreState.documentKey === documentKey
        && structureScoreState.status !== 'idle'
      ) {
        return structureScoreState;
      }

      const scoring = globalThis.StructureLearningScore;
      if (!scoring) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '评分模块暂时不可用。当前页面内容不受影响，请联系维护人员检查3001静态资源。'
        };
        return structureScoreState;
      }

      try {
        const snapshot = createStructureScoreSnapshot();
        const contentResult = scoring.evaluateContent(snapshot, { departments: actorDepartments() });
        structureScoreState = {
          status: 'pending',
          candidateIndex: currentIndex,
          documentKey,
          result: scoring.finalize(contentResult, {
            status: 'pending',
            checks: {},
            message: '正在检查技术结构'
          }),
          message: '正在检查技术结构……'
        };
        const runId = ++structureScoreRunId;
        queueMicrotask(() => runStructureScore({
          runId,
          candidateIndex: currentIndex,
          documentKey,
          snapshot,
          contentResult
        }));
      } catch (_error) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '当前页面内容暂时无法生成评分快照。评分不会修改当前流程，请保持页面打开并重新评分。'
        };
      }
      return structureScoreState;
    }

    function warningSuggestions(item) {
      const suggestions = Array.isArray(item?.suggestions)
        ? item.suggestions.map(text).filter(Boolean)
        : [];
      return suggestions.length
        ? suggestions
        : ['点击本项返回对应位置，核对并补充相关内容。'];
    }

    function renderWarningCopy(item) {
      const suggestions = warningSuggestions(item);
      return `<span class="warning-fact"><strong>当前情况：</strong>${escapeHtml(item.message)}</span>
        ${suggestions.map((suggestion, index) => `
          <span class="warning-suggestion"><strong>${suggestions.length > 1 ? `建议${index + 1}` : '建议'}：</strong>${escapeHtml(suggestion)}</span>
        `).join('')}`;
    }

    function renderStructureScoreIssues(items, title, className = 'score-issue-list', open = true) {
      if (!items.length) return '';
      return `<details class="${className}"${open ? ' open' : ''}>
        <summary>${escapeHtml(title)}（${items.length}项）</summary>
        <ol>${items.map(item => {
          const attributes = exportWarningLocationAttributes(item);
          const message = attributes
            ? `<button
                class="diagram-warning-button export-warning-button"
                data-action="focus-export-warning"
                ${attributes}
              >${renderWarningCopy(item)}</button>`
            : `<span>${renderWarningCopy(item)}</span>`;
          return `<li>
            <div class="score-issue-line">
              <span class="score-issue-category">${escapeHtml(item.category)}</span>
              <div>
                ${message}
                ${item.effect ? `<small class="score-issue-effect">${escapeHtml(item.effect)}</small>` : ''}
              </div>
            </div>
          </li>`;
        }).join('')}</ol>
      </details>`;
    }

    function renderStructureScoreStandard() {
      const rule = globalThis.StructureLearningScore?.RULE;
      if (!rule) return '';
      const dimensions = rule.dimensions.map(item => `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td>${item.max}分</td>
          <td>${escapeHtml(item.description)}</td>
        </tr>`).join('');
      const technicalChecks = rule.technicalChecks
        .map(item => `${escapeHtml(item.label)}${item.points}分`)
        .join('、');
      const coefficients = rule.chainCoefficients
        .map(item => `${escapeHtml(item.label)}×${item.coefficient.toFixed(2)}`)
        .join('；');
      const grades = rule.grades
        .map(item => `${item.grade}：${escapeHtml(item.label)}`)
        .join('；');
      return `<details class="score-standard">
        <summary>查看评分标准</summary>
        <div class="score-standard-body">
          <p><strong>结构完整性</strong>为六个维度得分之和。各维度先保留1位小数，再相加得到满分100分的结构完整性。</p>
          <div class="score-table-wrap">
            <table>
              <thead><tr><th>评分维度</th><th>分值</th><th>本期检查内容</th></tr></thead>
              <tbody>${dimensions}</tbody>
            </table>
          </div>
          <p><strong>技术结构：</strong>${technicalChecks}。当前文件发生技术阻断时，展示分最高为59分；校验服务异常时暂停生成最终分数，不把系统故障算作用户扣分。</p>
          <p><strong>展示分：</strong>结构完整性 × 行为链系数。${coefficients}。</p>
          <p><strong>等级：</strong>${grades}。</p>
          <ul>
            <li>有效行为链采用最长的明确非回路关系链。孤立行为不增加长度，回路边不重复计数。</li>
            <li>必填项中的“待填写、待补充、待确认、未知、暂无、无、不适用、N/A”按未完成处理；选填项可以留空或使用占位说明。</li>
              <li>无数据对象时，数据对象子项为0/15；无表单时，表单结构维度为0/10；无跨部门待办（候选）时，承接子项按不适用计5/5。不要为提高分数虚构数据、表单、行为或关系。</li>
            <li>判断节点允许一条无条件顺序关系作为默认继续路径。判断分支和回路必须填写条件；承接判断结果的目标节点可以是普通业务行为。</li>
            <li>“具体做什么”、输入说明、办理时限和跨部门目标流程等字段本期不计分。</li>
          </ul>
          <p class="boundary"><strong>评价边界：</strong>本评分只反映当前JSON展示出的结构化学习成果，不代表流程设计正确、部门职责正确或业务事实已经确认，也不是正式PMO评审结论。</p>
        </div>
      </details>`;
    }

    function renderStructureScorePanel(state) {
      const rule = globalThis.StructureLearningScore?.RULE;
      const result = state.result;
      const pending = state.status === 'pending';
      const unavailable = state.status === 'unavailable';
      const scoreText = result?.available ? result.completenessScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const displayText = result?.available ? result.displayScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const gradeText = result?.available ? result.grade : pending ? '待生成' : '—';
      const dimensions = rule?.dimensions?.map(item => {
        const value = result?.dimensions?.[item.key];
        const valueText = value === null || value === undefined
          ? item.key === 'technical' && pending ? '检查中' : '—'
          : `${Number(value).toFixed(1)} / ${item.max}`;
        return `<div class="score-dimension">
          <strong>${escapeHtml(item.label)}</strong>
          <span>${valueText}</span>
          <small>${escapeHtml(item.description)}</small>
        </div>`;
      }).join('') || '';
      const scoredIssues = result?.issues || [];
      const previewIssues = result?.previewIssues || [];
      const blockerHtml = result?.blocker
        ? '<div class="score-blocker"><strong>技术阻断：</strong>当前展示分已按规则限制为最高59分。原有导出校验仍会阻止损坏的结构或技术引用。</div>'
        : '';
      const unavailableHtml = unavailable
        ? `<div class="score-unavailable"><strong>暂不能生成最终分数：</strong>${escapeHtml(state.message)}
            <button class="button small" data-action="refresh-structure-score">重新评分</button>
          </div>`
        : '';
      const issueHtml = scoredIssues.length
        ? renderStructureScoreIssues(scoredIssues, '计分扣项与整改位置')
        : result?.available
          ? '<div class="notice">当前未发现计分扣项。</div>'
          : '';
      const previewHtml = renderStructureScoreIssues(
        previewIssues,
        '后续集中评审预告（本期不扣分）',
        'score-preview-list',
        false
      );
      return `<div class="score-panel" id="structureScorePanel" aria-live="polite">
        <div class="score-panel-head">
          <div>
            <h3>${escapeHtml(rule?.label || '结构化学习评分 v1（试行）')}</h3>
            <p>评分根据当前页面内容自动生成，只用于结构化学习反馈，不写入导出JSON。</p>
          </div>
          <button class="button small" data-action="refresh-structure-score"${pending ? ' disabled' : ''}>重新评分</button>
        </div>
        <div class="score-summary-grid">
          <div class="score-summary-card primary">
            <span class="score-summary-label">结构完整性</span>
            <span class="score-summary-value">${scoreText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">六项结构维度得分之和</span>
          </div>
          <div class="score-summary-card primary">
            <span class="score-summary-label">展示分</span>
            <span class="score-summary-value">${displayText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">结构完整性 × 行为链系数</span>
          </div>
          <div class="score-summary-card">
            <span class="score-summary-label">等级与行为链</span>
            <span class="score-summary-value score-grade-${escapeAttribute(gradeText)}">${escapeHtml(gradeText)}</span>
            <span class="score-summary-note">有效行为链${result ? result.effectiveChainLength : 0}个行为 × ${(result?.chainCoefficient || 0.8).toFixed(2)}</span>
          </div>
        </div>
        <div class="score-dimension-grid">${dimensions}</div>
        ${blockerHtml}
        ${unavailableHtml}
        ${issueHtml}
        ${previewHtml}
        ${renderStructureScoreStandard()}
      </div>`;
    }

    function renderExportCheck() {
      const scoreState = ensureStructureScoreState();
      const scoreIssues = (scoreState.result?.issues || []).concat(scoreState.result?.previewIssues || []);
      const scoredMessages = new Set(scoreIssues.map(item => item.message));
      const scoredLocations = new Set(
        scoreIssues.map(structureScoreIssueIdentity).filter(Boolean)
      );
      const warnings = businessWarnings(currentDocument()).filter(item =>
        !scoredMessages.has(item.message)
        && !scoredLocations.has(structureScoreIssueIdentity(item))
      );
      const warningHtml = warnings.length
        ? `<div class="export-warning-list">
            <strong>其他提示项（不阻止导出）：当前草稿有 ${warnings.length} 项内容待确认。点击问题项可返回对应位置补充。</strong>
            <ol>${warnings.map(item => `
              <li>
                <button
                  class="diagram-warning-button export-warning-button"
                  data-action="focus-export-warning"
                  ${exportWarningLocationAttributes(item)}
                >${renderWarningCopy(item)}</button>
              </li>`).join('')}</ol>
          </div>`
        : '<div class="notice">其他提示项：当前未发现本评分之外的待确认内容。</div>';
      const body = `
        ${renderStructureScorePanel(scoreState)}
        ${warningHtml}
        <div class="next-stage-grid" aria-label="导出后的处理说明">
          <section class="next-stage-card next">
            <span class="next-stage-badge">下一步</span>
            <h3>完成业务评审后，进入MDM平台正式编辑</h3>
            <p>3001不记录评审结果。业务评审完成后，归口部门MDM审核员在MDM平台选择“预览并审核导入3001文件”，核对流程内容并填写审核依据。MDM平台复核文件内容未变化后，才写入流程草稿。后续编辑、证据核验、跨部门承接和发布均在MDM平台完成。</p>
          </section>
          <section class="next-stage-card future">
            <span class="next-stage-badge">后续规划</span>
            <h3>后续预告：系统动力学评价</h3>
            <p>流程进入MDM平台后，后续将结合正式流程、运行数据和实际反馈，观察等待、积压、返工、资源压力及跨部门影响等动态变化。逻辑关系清楚只表示流程能够被理解，不代表当前做法就应该继续。评价结果用于寻找优化方向，不替代业务评审、审核和管理决策。</p>
          </section>
        </div>
        <p class="boundary"><strong>阻断项：</strong>只有JSON结构或技术引用损坏时才禁止导出。业务内容提示项尚未补齐时，用户仍可导出当前草稿。</p>
        <button class="button secondary" data-action="export-current">导出当前流程</button>`;
      return section(
        '导出检查',
        '先查看待补内容，再导出当前这一条流程。导出不会把分区状态、流程图布局或花名册快照写入JSON。',
        body
      );
    }

    function renderEditorContent() {
      const renderSection = {
        basic: renderBasic,
        profile: renderProfile,
        terms: renderTerms,
        process: renderProcessEditor,
        forms: renderForms,
        export: renderExportCheck
      }[activeEditorSection] || renderBasic;
      return `${renderEditorNavigation()}${renderSection()}`;
    }

    function render() {
      destroyDiagram();
      const data = currentDocument();
      document.body.classList.toggle(
        'diagram-overlay-open',
        Boolean(data && activeWorkspaceTab === 'diagram' && diagramExpanded)
      );
      document.getElementById('exportButton').disabled = busy || !data;
      document.getElementById('clearButton').disabled = busy || !data;
      updateCandidateList();
      if (!data) {
        diagramExpanded = false;
        document.body.classList.remove('diagram-overlay-open');
        activeWorkspaceTab = 'editor';
        workspaceViewSwitch.innerHTML = renderWorkspaceTabs(null, true);
        workspace.innerHTML = `<div class="empty">
          <h2>从一条空白流程开始</h2>
          <p>点击“新建流程”后，直接填写流程、业务行为、执行岗位、跨部门待办（候选）和数据输出。3001暂不要求提供编制参考资料，也不要求填写制度编号。</p>
          <button class="button primary" data-action="new-process-inline">新建流程</button>
        </div>`;
        return;
      }
      const model = currentDiagramModel(data);
      workspaceViewSwitch.innerHTML = renderWorkspaceTabs(model);
      workspace.innerHTML = `
        <div
          class="tab-panel"
          id="editorPanel"
          role="tabpanel"
          aria-labelledby="editorTab"
          ${activeWorkspaceTab === 'editor' ? '' : 'hidden'}
        >
          ${renderPreviewGuidance(model)}
          ${renderEditorContent()}
        </div>
        <div
          class="tab-panel"
          id="diagramPanel"
          role="tabpanel"
          aria-labelledby="diagramTab"
          ${activeWorkspaceTab === 'diagram' ? '' : 'hidden'}
        >
          ${renderDiagramPanel(model)}
        </div>`;
      if (activeWorkspaceTab === 'diagram') requestAnimationFrame(mountDiagram);
    }

    function updateCandidateList() {
      if (!candidates.length) {
        candidateList.innerHTML = '<div class="candidate-empty">尚未创建或导入流程。</div>';
        candidateNote.textContent = '新建流程或导入结构化文件后，可以在这里切换当前流程。';
        return;
      }
      candidateList.innerHTML = candidates.map((item, index) => {
        const name = item.data.process.process_name || `未命名流程 ${index + 1}`;
        const fullLabel = `${index + 1}. ${name}${item.dirty ? '，未导出修改' : ''}`;
        return `
          <button
            class="candidate-item${index === currentIndex ? ' active' : ''}"
            type="button"
            role="option"
            aria-selected="${index === currentIndex}"
            aria-label="${escapeAttribute(fullLabel)}"
            title="${escapeAttribute(fullLabel)}"
            data-candidate-index="${index}"
          >
            <span class="candidate-number" aria-hidden="true">${index + 1}</span>
            <span class="candidate-copy">
              <span class="candidate-name">${escapeHtml(name)}</span>
              ${item.dirty ? '<span class="candidate-dirty">未导出修改</span>' : ''}
            </span>
          </button>`;
      }).join('');
      candidateNote.textContent = candidates.length > 1
        ? `本次导入拆出 ${candidates.length} 条候选流程，请逐一检查并分别导出。`
        : '当前页面只编辑并导出这一条流程。';
    }

    function syncRoles(data = currentDocument()) {
      (data?.behaviors || []).forEach(behavior => {
        if (!behavior.work_role) return;
        behavior.work_role.behavior_ref = behavior.behavior_ref;
        behavior.work_role.work_role_name = roleName(behavior.behavior_name, behavior.work_role.role_duty);
        behavior.work_role.assignment_status = behavior.work_role.work_role_code ? 'assigned' : 'pending_assignment';
      });
    }

    function refreshRoleName(index) {
      syncRoles();
      const target = document.querySelector(`[data-role-name="${index}"]`);
      if (target) target.textContent = currentDocument().behaviors[index].work_role?.work_role_name || '填写行为名称和角色职责后生成';
    }

    function addCandidate(data, dirty, origin) {
      candidates.push({ data: normalizeV1(data), dirty: Boolean(dirty), origin: origin || 'unknown' });
    }

    async function startNewProcess() {
      setBusy(true, '正在读取当前结构和空白模板……');
      try {
        await ensureCompatibleValidationService('再次新建流程');
        const data = await fetchEmptyProcessDocument();
        destroyDiagram();
        candidates = [{ data: normalizeV1(data), dirty: false, origin: 'new' }];
        currentIndex = 0;
        activeWorkspaceTab = 'editor';
        diagramExpanded = false;
        resetEditorNavigation('basic');
        openedPreviewProcesses.clear();
        clearStatus();
        render();
      } catch (error) {
        showStatus(`新建流程失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
      }
    }

    function clearPage() {
      destroyDiagram();
      candidates = [];
      currentIndex = 0;
      activeWorkspaceTab = 'editor';
      diagramExpanded = false;
      resetEditorNavigation('basic');
      openedPreviewProcesses.clear();
      clearStatus();
      render();
    }

    function addBehavior() {
      const behavior = {
        behavior_ref: newRef('behavior'),
        node_type: '',
        behavior_name: '',
        behavior_description: '',
        current_actor_role: '',
        actor_assignment_mode: 'fixed_department',
        actor_department_data_ref: null,
        actor_position_rule: '',
        trigger: '',
        precondition: '',
        input_description: '',
        timing: null,
        completion_standard: '',
        output_description: '',
        input_data_refs: [],
        output_data_refs: [],
        work_role: null,
        countersign_all_required: false,
        countersign_target_departments: []
      };
      currentDocument().behaviors.push(behavior);
      activeFlowItemKind = 'behavior';
      activeBehaviorRef = behavior.behavior_ref;
      return behavior;
    }

    function moveBehavior(behaviorRef, direction) {
      const behaviors = currentDocument()?.behaviors || [];
      const index = behaviors.findIndex(item => item.behavior_ref === behaviorRef);
      const targetIndex = index + Number(direction);
      if (index < 0 || targetIndex < 0 || targetIndex >= behaviors.length) return false;
      [behaviors[index], behaviors[targetIndex]] = [behaviors[targetIndex], behaviors[index]];
      activeBehaviorRef = behaviorRef;
      return true;
    }

    function moveCollectionItem(collectionKey, refKey, itemRef, direction) {
      const collection = currentDocument()?.[collectionKey];
      if (!Array.isArray(collection)) return false;
      const index = collection.findIndex(item => text(item?.[refKey]) === itemRef);
      const targetIndex = index + Number(direction);
      if (index < 0 || targetIndex < 0 || targetIndex >= collection.length) return false;
      [collection[index], collection[targetIndex]] = [collection[targetIndex], collection[index]];
      if (collectionKey === 'flow_relations') activeRelationRef = itemRef;
      if (collectionKey === 'data_objects') activeDataRef = itemRef;
      if (collectionKey === 'cross_department_handoffs') activeHandoffRef = itemRef;
      return true;
    }

    function addRelation() {
      const relation = {
        relation_ref: newRef('relation'),
        relation_type: '',
        from_behavior_ref: null,
        to_behavior_ref: null,
        condition: '',
        join_mode: ''
      };
      currentDocument().flow_relations.push(relation);
      activeRelationRef = relation.relation_ref;
      return relation;
    }

    function addDataObject() {
      const dataObject = {
        data_ref: newRef('data'),
        data_name: '',
        description: '',
        governance_status: 'candidate',
        produced_by_behavior_ref: null,
        consumed_by_behavior_refs: []
      };
      currentDocument().data_objects.push(dataObject);
      activeDataRef = dataObject.data_ref;
      return dataObject;
    }

    function addHandoff(direction = 'outbound_followup', anchorBehaviorRef = null, counterpartyBehaviorRef = null) {
      const normalizedDirection = direction === 'inbound_prerequisite'
        ? 'inbound_prerequisite'
        : 'outbound_followup';
      const owningDepartment = currentDocument().process.owning_department
        || currentDocument().export_meta.initiating_department
        || '';
      const triggerCondition = anchorBehaviorRef
        ? defaultHandoffTrigger(normalizedDirection, anchorBehaviorRef)
        : '';
      const handoff = {
        handoff_ref: newRef('handoff'),
        handoff_direction: normalizedDirection,
        anchor_behavior_ref: anchorBehaviorRef || null,
        counterparty_resolution: 'needs_identification',
        source_department: normalizedDirection === 'outbound_followup' ? owningDepartment : '',
        target_department: normalizedDirection === 'inbound_prerequisite' ? owningDepartment : '',
        transfer_data_ref: null,
        requested_matter: '',
        trigger_condition: triggerCondition,
        completion_standard: '',
        counterparty_process_ref: null,
        counterparty_process_name: '',
        counterparty_behavior_ref: counterpartyBehaviorRef || null,
        counterparty_behavior_name: '',
        requires_return: false,
        returned_data_ref: null,
        resume_behavior_ref: null
      };
      currentDocument().cross_department_handoffs.push(handoff);
      activeFlowItemKind = 'handoff';
      activeHandoffRef = handoff.handoff_ref;
      return handoff;
    }

    function addCrossDepartmentBehavior(direction, anchorBehaviorRef) {
      const behavior = addBehavior();
      behavior.node_type = 'action';
      const handoff = addHandoff(direction, anchorBehaviorRef, behavior.behavior_ref);
      if (direction === 'outbound_followup') {
        const resumeBehaviorRef = defaultResumeBehaviorRef(anchorBehaviorRef);
        if (resumeBehaviorRef) {
          handoff.requires_return = true;
          handoff.resume_behavior_ref = resumeBehaviorRef;
        }
      }
      activeFlowItemKind = 'behavior';
      activeBehaviorRef = behavior.behavior_ref;
      activeHandoffRef = handoff.handoff_ref;
      return { behavior, handoff };
    }

    function inferredHandoffPlacement(behaviorRef, data = currentDocument()) {
      const incoming = (data?.flow_relations || []).filter(item => item.to_behavior_ref === behaviorRef && item.relation_type !== 'loop');
      const outgoing = (data?.flow_relations || []).filter(item => item.from_behavior_ref === behaviorRef && item.relation_type !== 'loop');
      if (incoming.length === 0 && outgoing.length === 1) {
        return {
          direction: 'inbound_prerequisite',
          anchorBehaviorRef: outgoing[0].to_behavior_ref,
          resumeBehaviorRef: null,
          unambiguous: true
        };
      }
      if (incoming.length === 1) {
        return {
          direction: 'outbound_followup',
          anchorBehaviorRef: incoming[0].from_behavior_ref,
          resumeBehaviorRef: outgoing.length === 1 ? outgoing[0].to_behavior_ref : null,
          unambiguous: outgoing.length <= 1
        };
      }
      return { direction: 'outbound_followup', anchorBehaviorRef: null, resumeBehaviorRef: null, unambiguous: false };
    }

    function ensureLinkedHandoffForExternalBehavior(behaviorRef, data = currentDocument(), options = {}) {
      const behavior = (data?.behaviors || []).find(item => item.behavior_ref === behaviorRef);
      const owner = text(data?.process?.owning_department).trim();
      const externalDepartment = behavior ? externalActorDepartment(behavior.current_actor_role, owner) : '';
      if (!behavior || !externalDepartment) return null;
      const linked = linkedHandoffsForCounterpartyBehavior(behaviorRef, data);
      if (linked.length) {
        linked.forEach(({ handoff }) => syncHandoffDerivedFields(handoff));
        return linked[0].handoff;
      }
      const placement = inferredHandoffPlacement(behaviorRef, data);
      const handoff = addHandoff(placement.direction, placement.anchorBehaviorRef, behaviorRef);
      if (placement.direction === 'outbound_followup' && placement.resumeBehaviorRef) {
        handoff.requires_return = true;
        handoff.resume_behavior_ref = placement.resumeBehaviorRef;
      }
      const adjacentRefs = [placement.anchorBehaviorRef, placement.resumeBehaviorRef].filter(Boolean);
      const adjacentBehaviorsAreLocal = adjacentRefs.every(ref => {
        const adjacent = (data.behaviors || []).find(item => item.behavior_ref === ref);
        return adjacent && !externalActorDepartment(adjacent.current_actor_role, owner);
      });
      if (
        options.convertUniqueRelations
        && placement.unambiguous
        && placement.anchorBehaviorRef
        && adjacentBehaviorsAreLocal
      ) {
        data.flow_relations = data.flow_relations.filter(item =>
          item.from_behavior_ref !== behaviorRef && item.to_behavior_ref !== behaviorRef
        );
      }
      syncHandoffDerivedFields(handoff);
      activeFlowItemKind = 'behavior';
      activeBehaviorRef = behaviorRef;
      return handoff;
    }

    function addSequenceRelationIfMissing(fromBehaviorRef, toBehaviorRef, data = currentDocument()) {
      if (!fromBehaviorRef || !toBehaviorRef || fromBehaviorRef === toBehaviorRef) return null;
      const existing = (data.flow_relations || []).find(item =>
        item.from_behavior_ref === fromBehaviorRef
        && item.to_behavior_ref === toBehaviorRef
        && item.relation_type !== 'loop'
      );
      if (existing) return existing;
      const relation = {
        relation_ref: newRef('relation'),
        relation_type: 'sequence',
        from_behavior_ref: fromBehaviorRef,
        to_behavior_ref: toBehaviorRef,
        condition: '',
        join_mode: ''
      };
      data.flow_relations.push(relation);
      return relation;
    }

    function owningDepartmentResetSequencePairs(data) {
      const behaviorRefs = new Set((data?.behaviors || []).map(item => text(item?.behavior_ref).trim()).filter(Boolean));
      const existingPairs = new Set((data?.flow_relations || [])
        .filter(item => item?.relation_type !== 'loop')
        .map(item => `${text(item?.from_behavior_ref).trim()}\u0000${text(item?.to_behavior_ref).trim()}`));
      const addedPairs = [];
      const appendPair = (fromBehaviorRef, toBehaviorRef) => {
        const fromRef = text(fromBehaviorRef).trim();
        const toRef = text(toBehaviorRef).trim();
        if (!behaviorRefs.has(fromRef) || !behaviorRefs.has(toRef) || fromRef === toRef) return;
        const key = `${fromRef}\u0000${toRef}`;
        if (existingPairs.has(key)) return;
        existingPairs.add(key);
        addedPairs.push({ fromBehaviorRef: fromRef, toBehaviorRef: toRef });
      };
      (data?.cross_department_handoffs || []).forEach(handoff => {
        const counterpartyBehaviorRef = text(handoff?.counterparty_behavior_ref).trim();
        if (handoff?.handoff_direction === 'inbound_prerequisite') {
          appendPair(counterpartyBehaviorRef, handoff?.anchor_behavior_ref);
          return;
        }
        appendPair(handoff?.anchor_behavior_ref, counterpartyBehaviorRef);
        if (handoff?.requires_return) appendPair(counterpartyBehaviorRef, handoff?.resume_behavior_ref);
      });
      return addedPairs;
    }

    function owningDepartmentChangeImpact(data, nextDepartment) {
      const behaviors = Array.isArray(data?.behaviors) ? data.behaviors : [];
      const handoffs = Array.isArray(data?.cross_department_handoffs) ? data.cross_department_handoffs : [];
      const fixedAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'fixed_department'
        && text(item?.current_actor_role).trim()
      ).length;
      const dynamicAssignments = behaviors.filter(item =>
        actorAssignmentMode(item) === 'dynamic_from_data'
        || item?.actor_department_data_ref
        || text(item?.actor_position_rule).trim()
      ).length;
      const companyWideAssignments = behaviors.filter(item => actorAssignmentMode(item) === 'company_wide').length;
      const formalWorkRoles = behaviors.filter(item => item?.work_role).length;
      const classificationFields = [
        data?.process?.capability_domain,
        data?.process?.business_capability,
        data?.process?.classification_status !== 'unclassified' ? data?.process?.classification_status : ''
      ].filter(value => text(value).trim()).length;
      return {
        previousDepartment: text(data?.process?.owning_department).trim(),
        nextDepartment: text(nextDepartment).trim(),
        behaviorCount: behaviors.length,
        fixedAssignments,
        dynamicAssignments,
        companyWideAssignments,
        handoffCount: handoffs.length,
        restoredSequenceCount: owningDepartmentResetSequencePairs(data).length,
        classificationFields,
        formalWorkRoles,
        internalCallCount: Array.isArray(data?.internal_process_calls) ? data.internal_process_calls.length : 0
      };
    }

    function buildOwningDepartmentResetDocument(data, nextDepartment) {
      const next = clone(data);
      owningDepartmentResetSequencePairs(next).forEach(pair => {
        addSequenceRelationIfMissing(pair.fromBehaviorRef, pair.toBehaviorRef, next);
      });
      next.process.owning_department = text(nextDepartment).trim();
      next.process.capability_domain = null;
      next.process.business_capability = null;
      next.process.classification_status = 'unclassified';
      next.behaviors.forEach(behavior => {
        if (actorAssignmentMode(behavior) === 'company_wide') return;
        behavior.actor_assignment_mode = 'fixed_department';
        behavior.current_actor_role = '';
        behavior.actor_department_data_ref = null;
        behavior.actor_position_rule = '';
      });
      next.cross_department_handoffs = [];
      return next;
    }

    function removeCounterpartyLinksForBehavior(behaviorRef, nextActorLabel = '本流程内执行') {
      const documentValue = currentDocument();
      const linked = linkedHandoffsForCounterpartyBehavior(behaviorRef, documentValue);
      if (!linked.length) return true;
      const populated = linked.some(({ handoff }) =>
        text(handoff.requested_matter).trim()
        || handoff.transfer_data_ref
        || handoff.returned_data_ref
        || handoff.resume_behavior_ref
        || text(handoff.counterparty_process_name).trim()
      );
      const message = populated
        ? `改为“${nextActorLabel}”后，将把${linked.length}条跨部门位置转换为普通顺序关系，并删除其中的交接事项、传递数据和返回设置；当前行为、表单和数据对象不会删除。确定继续吗？`
        : `改为“${nextActorLabel}”后，将把${linked.length}条跨部门位置转换为普通顺序关系并删除空的跨部门关系；当前行为不受影响。确定继续吗？`;
      if (!window.confirm(message)) return false;
      linked.forEach(({ handoff }) => {
        if (handoff.handoff_direction === 'inbound_prerequisite') {
          addSequenceRelationIfMissing(behaviorRef, handoff.anchor_behavior_ref, documentValue);
          return;
        }
        addSequenceRelationIfMissing(handoff.anchor_behavior_ref, behaviorRef, documentValue);
        if (handoff.requires_return && handoff.resume_behavior_ref) {
          addSequenceRelationIfMissing(behaviorRef, handoff.resume_behavior_ref, documentValue);
        }
      });
      const refs = new Set(linked.map(({ handoff }) => handoff.handoff_ref));
      documentValue.cross_department_handoffs = documentValue.cross_department_handoffs.filter(item => !refs.has(item.handoff_ref));
      if (refs.has(activeHandoffRef)) activeHandoffRef = '';
      return true;
    }

    function syncHandoffDerivedFields(handoff, changedField = '') {
      if (!handoff) return;
      const owningDepartment = currentDocument().process.owning_department
        || currentDocument().export_meta.initiating_department
        || '';
      const direction = handoff.handoff_direction === 'inbound_prerequisite'
        ? 'inbound_prerequisite'
        : 'outbound_followup';
      if (direction === 'inbound_prerequisite') {
        handoff.target_department = owningDepartment;
      } else {
        handoff.source_department = owningDepartment;
      }
      const counterpartyBehavior = counterpartyBehaviorForHandoff(handoff);
      const behaviorDepartment = counterpartyBehavior
        ? externalActorDepartment(counterpartyBehavior.current_actor_role, owningDepartment)
        : '';
      if (counterpartyBehavior) {
        if (direction === 'inbound_prerequisite') handoff.source_department = behaviorDepartment;
        else handoff.target_department = behaviorDepartment;
        handoff.counterparty_behavior_name = '';
        handoff.completion_standard = '';
      }
      const externalDepartment = externalDepartmentForHandoff(handoff);
      handoff.counterparty_resolution = externalDepartment ? 'identified' : 'needs_identification';
      if ((changedField === 'handoff_direction' || changedField === 'anchor_behavior_ref') && handoff.anchor_behavior_ref) {
        handoff.trigger_condition = defaultHandoffTrigger(direction, handoff.anchor_behavior_ref);
      }
      if (direction === 'outbound_followup' && handoff.requires_return && !handoff.resume_behavior_ref) {
        handoff.resume_behavior_ref = defaultResumeBehaviorRef(handoff.anchor_behavior_ref);
      }
      if (counterpartyBehavior && handoff.anchor_behavior_ref) {
        handoff.trigger_condition = defaultHandoffTrigger(direction, handoff.anchor_behavior_ref);
      }
    }

    function removeRelation(index) {
      const relation = currentDocument().flow_relations[index];
      if (!relation) return false;
      currentDocument().flow_relations.splice(index, 1);
      if (activeRelationRef === relation.relation_ref) {
        activeRelationRef = currentDocument().flow_relations[Math.min(index, currentDocument().flow_relations.length - 1)]?.relation_ref || '';
      }
      return true;
    }

    function removeHandoff(index) {
      const handoff = currentDocument().cross_department_handoffs[index];
      if (!handoff) return false;
      const targetDepartment = text(
        handoff.handoff_direction === 'inbound_prerequisite'
          ? handoff.source_department
          : handoff.target_department
      ).trim() || '待在MDM平台明确责任部门';
      const requestedMatter = text(handoff.requested_matter).trim() || '未填写';
      const confirmed = window.confirm([
        '确定删除这条跨部门待办吗？',
        `承接部门：${targetDepartment}`,
        `处理事项：${requestedMatter}`,
        '',
        '删除后无法在当前页面撤销。这条待办中的输入数据、返回数据、触发条件、完成标准、目标流程、办理动作和恢复位置都会一并删除；当前业务行为和其他跨部门待办不受影响。'
      ].join('\n'));
      if (!confirmed) return false;
      currentDocument().cross_department_handoffs.splice(index, 1);
      if (activeHandoffRef === handoff.handoff_ref) {
        activeHandoffRef = currentDocument().cross_department_handoffs[Math.min(index, currentDocument().cross_department_handoffs.length - 1)]?.handoff_ref || '';
        if (!activeHandoffRef) activeFlowItemKind = 'behavior';
      }
      return true;
    }

    function removeHandoffByRef(handoffRef) {
      const index = currentDocument().cross_department_handoffs.findIndex(item => item.handoff_ref === handoffRef);
      return removeHandoff(index);
    }

    function ensureFormArea(form, areaType) {
      const existing = form.areas.find(area => areaType ? area.area_type === areaType : !area.area_type);
      if (existing) return existing;
      const area = {
        area_ref: newRef('area'),
        area_type: areaType || '',
        area_title: '',
        items: []
      };
      form.areas.push(area);
      return area;
    }

    function findFormItem(form, itemRef) {
      for (let areaIndex = 0; areaIndex < form.areas.length; areaIndex += 1) {
        const itemIndex = form.areas[areaIndex].items.findIndex(item => item.item_ref === itemRef);
        if (itemIndex >= 0) return { areaIndex, itemIndex, item: form.areas[areaIndex].items[itemIndex] };
      }
      return null;
    }

    function moveFormItemToAssignment(formIndex, itemRef, assignment) {
      const form = currentDocument().forms[formIndex];
      if (!form) return false;
      const found = findFormItem(form, itemRef);
      if (!found) return false;
      let targetArea = null;
      if (assignment === 'main') {
        targetArea = ensureFormArea(form, '基本信息');
      } else if (assignment === 'unassigned') {
        targetArea = ensureFormArea(form, '');
      } else if (assignment === '__new_detail__') {
        targetArea = {
          area_ref: newRef('area'),
          area_type: '明细清单',
          area_title: '',
          items: []
        };
        form.areas.push(targetArea);
      } else {
        targetArea = form.areas.find(area => area.area_type === '明细清单' && area.area_ref === assignment);
      }
      if (!targetArea) return false;
      const sourceArea = form.areas[found.areaIndex];
      if (sourceArea.area_ref === targetArea.area_ref) return true;
      const [item] = sourceArea.items.splice(found.itemIndex, 1);
      targetArea.items.push(item);
      if (!sourceArea.area_type && !sourceArea.items.length) {
        form.areas.splice(form.areas.indexOf(sourceArea), 1);
      }
      activeAreaRef = targetArea.area_ref;
      return true;
    }

    function moveFormItem(formIndex, areaIndex, itemIndex, direction) {
      const items = currentDocument().forms[formIndex]?.areas[areaIndex]?.items;
      const targetIndex = itemIndex + direction;
      if (!items || targetIndex < 0 || targetIndex >= items.length) return false;
      [items[itemIndex], items[targetIndex]] = [items[targetIndex], items[itemIndex]];
      return true;
    }

    function moveDetailArea(formIndex, areaIndex, direction) {
      const form = currentDocument().forms[formIndex];
      if (!form?.areas[areaIndex] || form.areas[areaIndex].area_type !== '明细清单') return false;
      const detailIndices = form.areas
        .map((area, index) => area.area_type === '明细清单' ? index : -1)
        .filter(index => index >= 0);
      const position = detailIndices.indexOf(areaIndex);
      const targetAreaIndex = detailIndices[position + direction];
      if (position < 0 || targetAreaIndex == null) return false;
      [form.areas[areaIndex], form.areas[targetAreaIndex]] = [form.areas[targetAreaIndex], form.areas[areaIndex]];
      return true;
    }

    function removeDetailArea(formIndex, areaIndex) {
      const form = currentDocument().forms[formIndex];
      const area = form?.areas[areaIndex];
      if (!area || area.area_type !== '明细清单') return false;
      const fieldCount = area.items.length;
      if (!window.confirm(`当前明细表包含${fieldCount}个字段。删除后，这些字段会一并删除；其他字段不受影响。确定继续吗？`)) return false;
      form.areas.splice(areaIndex, 1);
      if (area.area_ref === activeAreaRef) activeAreaRef = '';
      return true;
    }

    function addForm(formDesignState) {
      const mainArea = {
        area_ref: newRef('area'),
        area_type: '基本信息',
        area_title: '',
        items: []
      };
      const form = {
        form_ref: newRef('form'),
        behavior_ref: null,
        form_name: '',
        form_no: null,
        form_design_state: formDesignState,
        areas: [mainArea]
      };
      currentDocument().forms.push(form);
      activeFormRef = form.form_ref;
      activeAreaRef = mainArea.area_ref;
    }

    function addTerm() {
      currentDocument().terms.push({ term_ref: newRef('term'), term_name: '', definition: '' });
    }

    function removeBehavior(index) {
      const behavior = currentDocument().behaviors[index];
      if (!behavior) return false;
      const ref = behavior.behavior_ref;
      const internalCallCount = currentDocument().internal_process_calls.filter(item =>
        item.caller_behavior_ref === ref || item.return_behavior_ref === ref
      ).length;
      if (internalCallCount) {
        window.alert(`当前业务行为被${internalCallCount}条部门内调用预览信息引用。3001不编辑部门内调用，请保留该行为，或在MDM平台处理后重新导入。`);
        return false;
      }
      const linkedHandoffCount = currentDocument().cross_department_handoffs.filter(item =>
        item.anchor_behavior_ref === ref || item.counterparty_behavior_ref === ref
      ).length;
      if (linkedHandoffCount && !window.confirm(`删除当前业务行为将同时删除${linkedHandoffCount}条关联的跨部门待办。确定继续吗？`)) {
        return false;
      }
      currentDocument().behaviors.splice(index, 1);
      if (activeBehaviorRef === ref) {
        activeBehaviorRef = currentDocument().behaviors[Math.min(index, currentDocument().behaviors.length - 1)]?.behavior_ref || '';
      }
      currentDocument().flow_relations = currentDocument().flow_relations.filter(item => item.from_behavior_ref !== ref && item.to_behavior_ref !== ref);
      currentDocument().data_objects.forEach(item => {
        if (item.produced_by_behavior_ref === ref) item.produced_by_behavior_ref = null;
        item.consumed_by_behavior_refs = item.consumed_by_behavior_refs.filter(value => value !== ref);
      });
      currentDocument().cross_department_handoffs = currentDocument().cross_department_handoffs.filter(item =>
        item.anchor_behavior_ref !== ref && item.counterparty_behavior_ref !== ref
      );
      currentDocument().cross_department_handoffs.forEach(item => {
        if (item.resume_behavior_ref === ref) item.resume_behavior_ref = null;
      });
      currentDocument().forms.forEach(item => {
        if (item.behavior_ref === ref) item.behavior_ref = null;
      });
      return true;
    }

    function removeData(index) {
      const item = currentDocument().data_objects[index];
      if (!item) return false;
      const ref = item.data_ref;
      const internalCallCount = currentDocument().internal_process_calls.filter(call =>
        call.input_data_refs.includes(ref) || call.output_data_refs.includes(ref)
