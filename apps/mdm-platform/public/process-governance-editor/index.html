    function destroyDiagram() {
      if (!diagramView) return;
      try {
        diagramView.destroy();
      } catch (_error) {
        // The text editor must remain available even if the graph library has already released the canvas.
      }
      diagramView = null;
    }

    function mountDiagram() {
      destroyDiagram();
      if (activeWorkspaceTab !== 'diagram') return;
      const data = currentDocument();
      const model = currentDiagramModel(data);
      if (!data || !model.namedBehaviorCount) return;
      const container = document.getElementById('processDiagramCanvas');
      const failure = document.getElementById('diagramFailure');
      if (!container) return;
      try {
        diagramView = window.ProcessDiagram.mount({
          container,
          documentData: data,
          departmentOrder: actorDepartments(),
          onFocus: focusEditorItem,
          onViewportModeChange(viewport) {
            const notice = document.getElementById('diagramViewportNotice');
            if (notice) notice.hidden = viewport?.mode !== 'start';
          }
        });
      } catch (error) {
        container.hidden = true;
        if (failure) {
          failure.textContent = `流程图暂时无法生成：${error.message}。当前文字内容仍然保留，可以继续编制或导出。`;
          failure.classList.add('show');
        }
      }
    }

    function setActiveWorkspaceTab(tab) {
      if (!currentDocument()) return;
      activeWorkspaceTab = tab === 'diagram' ? 'diagram' : 'editor';
      if (activeWorkspaceTab === 'editor') diagramExpanded = false;
      if (activeWorkspaceTab === 'diagram') {
        const model = currentDiagramModel();
        if (model.namedBehaviorCount) openedPreviewProcesses.add(currentProcessKey());
      }
      render();
    }

    function focusEditorTarget(target = {}) {
      const focusKind = text(target.focusKind);
      const focusRef = text(target.focusRef);
      const focusPaths = [...new Set([
        text(target.focusPath),
        ...(Array.isArray(target.focusPaths) ? target.focusPaths.map(text) : [])
      ].filter(Boolean))];
      if (focusKind === 'call') {
        showStatus('部门内调用仅用于预览，请在MDM平台正式功能中维护。');
        return;
      }
      diagramExpanded = false;
      activeWorkspaceTab = 'editor';
      activeEditorSection = EDITOR_SECTIONS.some(item => item.value === target.editorSection)
        ? target.editorSection
        : 'process';
      if (PROCESS_SECTIONS.some(item => item.value === target.processSection)) {
        activeProcessSection = target.processSection;
      }
      if (focusKind === 'behavior') {
        activeEditorSection = 'process';
        activeProcessSection = 'behaviors';
        activeBehaviorRef = focusRef;
      } else if (focusKind === 'relation') {
        activeEditorSection = 'process';
        activeProcessSection = 'relations';
        activeRelationRef = focusRef;
      } else if (focusKind === 'data') {
        activeEditorSection = 'process';
        activeProcessSection = 'data';
        activeDataRef = focusRef;
      } else if (focusKind === 'handoff') {
        activeEditorSection = 'process';
        activeProcessSection = 'handoffs';
        activeHandoffRef = focusRef;
      } else if (focusKind === 'form') {
        activeEditorSection = 'forms';
        activeFormRef = focusRef;
      } else if (focusKind === 'area') {
        activeEditorSection = 'forms';
        const owner = currentDocument()?.forms?.find(form =>
          form.areas.some(area => area.area_ref === focusRef)
        );
        if (owner) {
          activeFormRef = owner.form_ref;
          activeAreaRef = focusRef;
        }
      }
      render();
      requestAnimationFrame(() => {
        const card = Array.from(workspace.querySelectorAll('[data-focus-kind]')).find(item =>
          item.dataset.focusKind === focusKind && item.dataset.focusRef === text(focusRef)
        );
        const controls = Array.from(
          workspace.querySelectorAll('[data-bind], [data-focus-key], [data-list-bind]')
        ).filter(item =>
          focusPaths.includes(item.dataset.bind)
          || focusPaths.includes(item.dataset.focusKey)
          || focusPaths.includes(item.dataset.listBind)
        );
        controls.forEach(control => {
          const details = control.closest('details');
          if (details) details.open = true;
        });
        const focusTarget = controls.find(control => !control.disabled)
          || controls[0]
          || card
          || workspace.querySelector('.section');
        if (!focusTarget) return;
        workspace.querySelectorAll('.focused-card, .focused-control').forEach(item => {
          item.classList.remove('focused-card', 'focused-control');
          item.removeAttribute('aria-invalid');
        });
        if (controls.length) {
          controls.forEach(control => {
            void control.offsetWidth;
            control.classList.add('focused-control');
            control.setAttribute('aria-invalid', 'true');
          });
          if (!focusTarget.disabled) focusTarget.focus({ preventScroll: true });
        } else {
          focusTarget.classList.add('focused-card');
          focusTarget.setAttribute('tabindex', '-1');
          focusTarget.focus({ preventScroll: true });
        }
        focusTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
        if (focusClearTimer) clearTimeout(focusClearTimer);
        focusClearTimer = setTimeout(() => {
          focusTarget.classList.remove('focused-card');
          controls.forEach(control => {
            control.classList.remove('focused-control');
            control.removeAttribute('aria-invalid');
          });
        }, 2900);
      });
    }

    function focusEditorItem(focusKind, focusRef) {
      focusEditorTarget({ focusKind, focusRef });
    }

    function focusExportWarning(element) {
      let focusPaths = [];
      try {
        const parsed = JSON.parse(element.dataset.focusPaths || '[]');
        if (Array.isArray(parsed)) focusPaths = parsed;
      } catch (_error) {
        focusPaths = [];
      }
      focusEditorTarget({
        editorSection: element.dataset.editorSection,
        processSection: element.dataset.processSection,
        focusKind: element.dataset.focusKind,
        focusRef: element.dataset.focusRef,
        focusPath: element.dataset.focusPath,
        focusPaths
      });
    }

    function renderForms() {

      if (!active.form) {
        return section(

      const structureWarnings = [];
      if (!mainAreas.length) structureWarnings.push('当前表单尚未设置主表结构。');

      if (unresolvedAreas.length) structureWarnings.push(`当前表单有 ${unresolvedAreas.length} 个结构尚未确认是主表还是明细表。`);

      let mainNumber = 0;

              ${field(`forms.${formIndex}.areas.${areaIndex}.area_type`, '结构类型', {
                type: 'select',
                options: [
                  { value: '', label: '待确认' },
                  { value: '基本信息', label: '主表' },
                  { value: '明细清单', label: '明细表' }

                `forms.${formIndex}.areas.${areaIndex}.area_title`,
                area.area_type === '基本信息' ? '主表标题' : area.area_type === '明细清单' ? '明细表标题' : '结构标题'

    function exportWarningLocationAttributes(item) {
      const focusPaths = Array.isArray(item.focusPaths) && item.focusPaths.length
        ? JSON.stringify(item.focusPaths)
        : '';
      return [
        ['data-editor-section', item.editorSection],
        ['data-process-section', item.processSection],
        ['data-focus-kind', item.focusKind],
        ['data-focus-ref', item.focusRef],
        ['data-focus-path', item.focusPath],
        ['data-focus-paths', focusPaths]
      ]
        .filter(([, value]) => text(value))
        .map(([name, value]) => `${name}="${escapeAttribute(value)}"`)
        .join(' ');
    }

    function structureScoreIssueIdentity(item) {
      const values = [
        item.editorSection,
        item.processSection,
        item.focusKind,
        item.focusRef,
        item.focusPath,
        ...(Array.isArray(item.focusPaths) ? item.focusPaths : [])
      ].map(value => text(value).trim());
      return values.some(Boolean) ? values.join('::') : '';
    }

    function currentStructureScoreKey() {
      try {
        return `${currentIndex}:${JSON.stringify(currentDocument())}`;
      } catch (_error) {
        return `${currentIndex}:unserializable`;
      }
    }

    function createStructureScoreSnapshot() {
      const snapshot = JSON.parse(JSON.stringify(currentDocument()));
      syncRoles(snapshot);
      return snapshot;
    }

    function ensureStructureScoreState() {
      const documentKey = currentStructureScoreKey();
      if (
        structureScoreState.candidateIndex === currentIndex
        && structureScoreState.documentKey === documentKey
        && structureScoreState.status !== 'idle'
      ) {
        return structureScoreState;
      }

      const scoring = globalThis.StructureLearningScore;
      if (!scoring) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '评分模块暂时不可用。当前页面内容不受影响，请联系维护人员检查MDM编制工作台资源。'
        };
        return structureScoreState;
      }

      try {
        const snapshot = createStructureScoreSnapshot();
        const contentResult = scoring.evaluateContent(snapshot, { departments: actorDepartments() });
        structureScoreState = {
          status: 'pending',
          candidateIndex: currentIndex,
          documentKey,
          result: scoring.finalize(contentResult, {
            status: 'pending',
            checks: {},
            message: '正在检查技术结构'
          }),
          message: '正在检查技术结构……'
        };
        const runId = ++structureScoreRunId;
        queueMicrotask(() => runStructureScore({
          runId,
          candidateIndex: currentIndex,
          documentKey,
          snapshot,
          contentResult
        }));
      } catch (_error) {
        structureScoreState = {
          status: 'unavailable',
          candidateIndex: currentIndex,
          documentKey,
          result: null,
          message: '当前页面内容暂时无法生成评分快照。评分不会修改当前流程，请保持页面打开并重新评分。'
        };
      }
      return structureScoreState;
    }

    function renderStructureScoreIssues(items, title, className = 'score-issue-list', open = true) {
      if (!items.length) return '';
      return `<details class="${className}"${open ? ' open' : ''}>
        <summary>${escapeHtml(title)}（${items.length}项）</summary>
        <ol>${items.map(item => {
          const attributes = exportWarningLocationAttributes(item);
          const message = attributes
            ? `<button
                class="diagram-warning-button export-warning-button"
                data-action="focus-export-warning"
                ${attributes}
              >${escapeHtml(item.message)}</button>`
            : `<span>${escapeHtml(item.message)}</span>`;
          return `<li>
            <div class="score-issue-line">
              <span class="score-issue-category">${escapeHtml(item.category)}</span>
              <div>
                ${message}
                ${item.effect ? `<small class="score-issue-effect">${escapeHtml(item.effect)}</small>` : ''}
              </div>
            </div>
          </li>`;
        }).join('')}</ol>
      </details>`;
    }

    function renderStructureScoreStandard() {
      const rule = globalThis.StructureLearningScore?.RULE;
      if (!rule) return '';
      const dimensions = rule.dimensions.map(item => `
        <tr>
          <td>${escapeHtml(item.label)}</td>
          <td>${item.max}分</td>
          <td>${escapeHtml(item.description)}</td>
        </tr>`).join('');
      const technicalChecks = rule.technicalChecks
        .map(item => `${escapeHtml(item.label)}${item.points}分`)
        .join('、');
      const coefficients = rule.chainCoefficients
        .map(item => `${escapeHtml(item.label)}×${item.coefficient.toFixed(2)}`)
        .join('；');
      const grades = rule.grades
        .map(item => `${item.grade}：${escapeHtml(item.label)}`)
        .join('；');
      return `<details class="score-standard">
        <summary>查看评分标准</summary>
        <div class="score-standard-body">
          <p><strong>结构完整性</strong>为六个维度得分之和。各维度先保留1位小数，再相加得到满分100分的结构完整性。</p>
          <div class="score-table-wrap">
            <table>
              <thead><tr><th>评分维度</th><th>分值</th><th>本期检查内容</th></tr></thead>
              <tbody>${dimensions}</tbody>
            </table>
          </div>
          <p><strong>技术结构：</strong>${technicalChecks}。当前文件发生技术阻断时，展示分最高为59分；校验服务异常时暂停生成最终分数，不把系统故障算作用户扣分。</p>
          <p><strong>展示分：</strong>结构完整性 × 行为链系数。${coefficients}。</p>
          <p><strong>等级：</strong>${grades}。</p>
          <ul>
            <li>有效行为链采用最长的明确非回路关系链。孤立行为不增加长度，回路边不重复计数。</li>
            <li>必填项中的“待填写、待补充、待确认、未知、暂无、无、不适用、N/A”按未完成处理；选填项可以留空或使用占位说明。</li>
            <li>无数据对象时，数据对象子项为0/15；无表单时，表单结构维度为0/10；无跨部门承接时，承接子项按不适用计5/5。不要为提高分数虚构数据、表单、行为或关系。</li>
            <li>判断节点允许一条无条件顺序关系作为默认继续路径。判断分支和回路必须填写条件；承接判断结果的目标节点可以是普通业务行为。</li>
            <li>“具体做什么”、输入说明、办理时限和跨部门目标流程等字段本期不计分。</li>
          </ul>
          <p class="boundary"><strong>评价边界：</strong>本评分只反映当前JSON展示出的结构化学习成果，不代表流程设计正确、部门职责正确或业务事实已经确认，也不是正式PMO评审结论。</p>
        </div>
      </details>`;
    }

    function renderStructureScorePanel(state) {
      const rule = globalThis.StructureLearningScore?.RULE;
      const result = state.result;
      const pending = state.status === 'pending';
      const unavailable = state.status === 'unavailable';
      const scoreText = result?.available ? result.completenessScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const displayText = result?.available ? result.displayScore.toFixed(1) : pending ? '检查中' : '暂不可计算';
      const gradeText = result?.available ? result.grade : pending ? '待生成' : '—';
      const dimensions = rule?.dimensions?.map(item => {
        const value = result?.dimensions?.[item.key];
        const valueText = value === null || value === undefined
          ? item.key === 'technical' && pending ? '检查中' : '—'
          : `${Number(value).toFixed(1)} / ${item.max}`;
        return `<div class="score-dimension">
          <strong>${escapeHtml(item.label)}</strong>
          <span>${valueText}</span>
          <small>${escapeHtml(item.description)}</small>
        </div>`;
      }).join('') || '';
      const scoredIssues = result?.issues || [];
      const previewIssues = result?.previewIssues || [];
      const blockerHtml = result?.blocker
        ? '<div class="score-blocker"><strong>技术阻断：</strong>当前展示分已按规则限制为最高59分。原有导出校验仍会阻止损坏的结构或技术引用。</div>'
        : '';
      const unavailableHtml = unavailable
        ? `<div class="score-unavailable"><strong>暂不能生成最终分数：</strong>${escapeHtml(state.message)}
            <button class="button small" data-action="refresh-structure-score">重新评分</button>
          </div>`
        : '';
      const issueHtml = scoredIssues.length
        ? renderStructureScoreIssues(scoredIssues, '计分扣项与整改位置')
        : result?.available
          ? '<div class="notice">当前未发现计分扣项。</div>'
          : '';
      const previewHtml = renderStructureScoreIssues(
        previewIssues,
        '后续集中评审预告（本期不扣分）',
        'score-preview-list',
        false
      );
      return `<div class="score-panel" id="structureScorePanel" aria-live="polite">
        <div class="score-panel-head">
          <div>
            <h3>${escapeHtml(rule?.label || '结构化学习评分 v1（试行）')}</h3>
            <p>评分根据当前页面内容自动生成，只用于结构化学习反馈，不写入导出JSON。</p>
          </div>
          <button class="button small" data-action="refresh-structure-score"${pending ? ' disabled' : ''}>重新评分</button>
        </div>
        <div class="score-summary-grid">
          <div class="score-summary-card primary">
            <span class="score-summary-label">结构完整性</span>
            <span class="score-summary-value">${scoreText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">六项结构维度得分之和</span>
          </div>
          <div class="score-summary-card primary">
            <span class="score-summary-label">展示分</span>
            <span class="score-summary-value">${displayText}${result?.available ? ' / 100' : ''}</span>
            <span class="score-summary-note">结构完整性 × 行为链系数</span>
          </div>
          <div class="score-summary-card">
            <span class="score-summary-label">等级与行为链</span>
            <span class="score-summary-value score-grade-${escapeAttribute(gradeText)}">${escapeHtml(gradeText)}</span>
            <span class="score-summary-note">有效行为链${result ? result.effectiveChainLength : 0}个行为 × ${(result?.chainCoefficient || 0.8).toFixed(2)}</span>
          </div>
        </div>
        <div class="score-dimension-grid">${dimensions}</div>
        ${blockerHtml}
        ${unavailableHtml}
        ${issueHtml}
        ${previewHtml}
        ${renderStructureScoreStandard()}
      </div>`;
    }

    function renderExportCheck() {
      const scoreState = ensureStructureScoreState();
      const scoreIssues = (scoreState.result?.issues || []).concat(scoreState.result?.previewIssues || []);
      const scoredMessages = new Set(scoreIssues.map(item => item.message));
      const scoredLocations = new Set(
        scoreIssues.map(structureScoreIssueIdentity).filter(Boolean)
      );
      const warnings = businessWarnings(currentDocument()).filter(item =>
        !scoredMessages.has(item.message)
        && !scoredLocations.has(structureScoreIssueIdentity(item))
      );
      const warningHtml = warnings.length
        ? `<div class="export-warning-list">
            <strong>其他提示项（不阻止导出）：当前草稿有 ${warnings.length} 项内容待确认。点击问题项可返回对应位置补充。</strong>
            <ol>${warnings.map(item => `
              <li>
                <button
                  class="diagram-warning-button export-warning-button"
                  data-action="focus-export-warning"
                  ${exportWarningLocationAttributes(item)}
                >${escapeHtml(item.message)}</button>
              </li>`).join('')}</ol>
          </div>`
        : '<div class="notice">其他提示项：当前未发现本评分之外的待确认内容。</div>';
      const body = `
        ${renderStructureScorePanel(scoreState)}
        ${warningHtml}
        <div class="next-stage-grid" aria-label="编制后的处理说明">
          <section class="next-stage-card next">
            <span class="next-stage-badge">下一步</span>
            <h3>保存草稿后提交归口部门审核</h3>
            <p>部门主对接人保存当前草稿并提交审核。归口部门MDM审核员核对流程内容和依据；审核通过后，跨部门承接按治理故事链继续处理。</p>
          </section>
          <section class="next-stage-card future">
            <span class="next-stage-badge">后续规划</span>
            <h3>后续预告：系统动力学评价</h3>
            <p>流程进入MDM平台后，后续将结合正式流程、运行数据和实际反馈，观察等待、积压、返工、资源压力及跨部门影响等动态变化。逻辑关系清楚只表示流程能够被理解，不代表当前做法就应该继续。评价结果用于寻找优化方向，不替代业务评审、审核和管理决策。</p>
          </section>
        </div>
        <p class="boundary"><strong>阻断项：</strong>JSON结构或技术引用损坏时不能保存和提交审核。业务内容提示项用于补充信息，不会自动替代审核判断。</p>
        <button class="button secondary" data-action="export-current">导出当前备份</button>`;
      return section(
        '导出检查',
        '先查看待补内容，再保存草稿或导出备份。保存和导出都不会把分区状态、流程图布局或花名册快照写入JSON。',
        body
      );
    }

    function renderEditorContent() {
      const renderSection = {
        basic: renderBasic,
        profile: renderProfile,
        terms: renderTerms,
        process: renderProcessEditor,
        forms: renderForms,
        export: renderExportCheck
      }[activeEditorSection] || renderBasic;
      return `${renderEditorNavigation()}${renderSection()}`;
    }

    function render() {
      destroyDiagram();
      const data = currentDocument();
      document.body.classList.toggle(
        'diagram-overlay-open',
        Boolean(data && activeWorkspaceTab === 'diagram' && diagramExpanded)
      );
      document.getElementById('exportButton').disabled = busy || !data;
      document.getElementById('clearButton').disabled = busy || !data;
      updateCandidateBar();
      if (!data) {
        diagramExpanded = false;
        document.body.classList.remove('diagram-overlay-open');
        activeWorkspaceTab = 'editor';
        workspace.innerHTML = `<div class="empty">
          <h2>从一条空白流程开始</h2>
          <p>部门主对接人点击“新建流程”后，填写流程、业务行为、执行岗位、跨部门承接和数据输出。管理员只能打开已有草稿查看。</p>
          <button class="button primary" data-action="new-process-inline">新建流程</button>
        </div>`;
        return;
      }
      const model = currentDiagramModel(data);
      workspace.innerHTML = `
        ${renderWorkspaceTabs(model)}
        <div
          class="tab-panel"
          id="editorPanel"
          role="tabpanel"
          aria-labelledby="editorTab"
          ${activeWorkspaceTab === 'editor' ? '' : 'hidden'}
        >
          ${renderPreviewGuidance(model)}
          ${renderEditorContent()}
        </div>
        <div
          class="tab-panel"
          id="diagramPanel"
          role="tabpanel"
          aria-labelledby="diagramTab"
          ${activeWorkspaceTab === 'diagram' ? '' : 'hidden'}
        >
          ${renderDiagramPanel(model)}
        </div>`;
      if (activeWorkspaceTab === 'diagram') requestAnimationFrame(mountDiagram);
    }

    function updateCandidateBar() {
      if (!candidates.length) {
        candidateBar.classList.remove('show');
        candidateSelect.innerHTML = '';
        candidateNote.textContent = '';
        return;
      }
      candidateBar.classList.add('show');
      candidateSelect.innerHTML = candidates.map((item, index) => {
        const name = item.data.process.process_name || `未命名流程 ${index + 1}`;
        const marker = item.dirty ? ' · 未保存修改' : '';
        return `<option value="${index}"${index === currentIndex ? ' selected' : ''}>${escapeHtml(`${index + 1}. ${name}${marker}`)}</option>`;
      }).join('');
      candidateNote.textContent = candidates.length > 1
        ? `本次导入拆出 ${candidates.length} 条候选流程，请逐一检查并分别保存到MDM。`
        : '当前工作台只编辑一条流程。';
    }

    function syncRoles(data = currentDocument()) {
      (data?.behaviors || []).forEach(behavior => {
        if (!behavior.work_role) return;
        behavior.work_role.behavior_ref = behavior.behavior_ref;
        behavior.work_role.work_role_name = roleName(behavior.behavior_name, behavior.work_role.role_duty);
        behavior.work_role.assignment_status = behavior.work_role.work_role_code ? 'assigned' : 'pending_assignment';
      });
    }

    function refreshRoleName(index) {
      syncRoles();
      const target = document.querySelector(`[data-role-name="${index}"]`);
      if (target) target.textContent = currentDocument().behaviors[index].work_role?.work_role_name || '填写行为名称和角色职责后生成';
    }

    function addCandidate(data, dirty, origin) {
      candidates.push({ data: normalizeV1(data), dirty: Boolean(dirty), origin: origin || 'unknown' });
    }

    async function startNewProcess() {
      setBusy(true, '正在读取当前结构和空白模板……');
      try {
        await ensureCompatibleValidationService('再次新建流程');
        const data = await fetchEmptyProcessDocument();
        destroyDiagram();
        candidates = [{ data: normalizeV1(data), dirty: false, origin: 'new' }];
        currentIndex = 0;
        activeWorkspaceTab = 'editor';
        diagramExpanded = false;
        resetEditorNavigation('basic');
        openedPreviewProcesses.clear();
        clearStatus();
        render();
      } catch (error) {
        showStatus(`新建流程失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
      }
    }

    function clearPage() {
      destroyDiagram();
      candidates = [];
      currentIndex = 0;
      activeWorkspaceTab = 'editor';
      diagramExpanded = false;
      resetEditorNavigation('basic');
      openedPreviewProcesses.clear();
      clearStatus();
      render();
    }

    function addBehavior() {
      const behavior = {
        behavior_ref: newRef('behavior'),
        node_type: '',
        behavior_name: '',
        behavior_description: '',
        current_actor_role: '',
        trigger: '',
        precondition: '',
        input_description: '',
        timing: null,
        completion_standard: '',
        output_description: '',
        input_data_refs: [],
        output_data_refs: [],
        work_role: null,
        countersign_all_required: false,
        countersign_target_departments: []
      };
      currentDocument().behaviors.push(behavior);
      activeBehaviorRef = behavior.behavior_ref;
    }

    function moveBehavior(behaviorRef, direction) {
      const behaviors = currentDocument()?.behaviors || [];
      const index = behaviors.findIndex(item => item.behavior_ref === behaviorRef);
      const targetIndex = index + Number(direction);
      if (index < 0 || targetIndex < 0 || targetIndex >= behaviors.length) return false;
      [behaviors[index], behaviors[targetIndex]] = [behaviors[targetIndex], behaviors[index]];
      activeBehaviorRef = behaviorRef;
      return true;
    }

    function moveCollectionItem(collectionKey, refKey, itemRef, direction) {
      const collection = currentDocument()?.[collectionKey];
      if (!Array.isArray(collection)) return false;
      const index = collection.findIndex(item => text(item?.[refKey]) === itemRef);
      const targetIndex = index + Number(direction);
      if (index < 0 || targetIndex < 0 || targetIndex >= collection.length) return false;
      [collection[index], collection[targetIndex]] = [collection[targetIndex], collection[index]];
      if (collectionKey === 'flow_relations') activeRelationRef = itemRef;
      if (collectionKey === 'data_objects') activeDataRef = itemRef;
      if (collectionKey === 'cross_department_handoffs') activeHandoffRef = itemRef;
      return true;
    }

    function addRelation() {
      const relation = {
        relation_ref: newRef('relation'),
        relation_type: '',
        from_behavior_ref: null,
        to_behavior_ref: null,
        condition: '',
        join_mode: ''
      };
      currentDocument().flow_relations.push(relation);
      activeRelationRef = relation.relation_ref;
      return relation;
    }

    function addDataObject() {
      const dataObject = {
        data_ref: newRef('data'),
        data_name: '',
        description: '',
        governance_status: 'candidate',
        produced_by_behavior_ref: null,
        consumed_by_behavior_refs: []
      };
      currentDocument().data_objects.push(dataObject);
      activeDataRef = dataObject.data_ref;
      return dataObject;
    }

    function addHandoff(direction = 'outbound_followup', anchorBehaviorRef = null) {
      const normalizedDirection = direction === 'inbound_prerequisite'
        ? 'inbound_prerequisite'
        : 'outbound_followup';
      const owningDepartment = currentDocument().process.owning_department
        || currentDocument().export_meta.initiating_department
        || '';
      const handoff = {
        handoff_ref: newRef('handoff'),
        handoff_direction: normalizedDirection,
        anchor_behavior_ref: anchorBehaviorRef || null,
        counterparty_resolution: 'needs_identification',
        source_department: normalizedDirection === 'outbound_followup' ? owningDepartment : '',
        target_department: normalizedDirection === 'inbound_prerequisite' ? owningDepartment : '',
        transfer_data_ref: null,
        requested_matter: '',
        trigger_condition: '',
        completion_standard: '',
        counterparty_process_ref: null,
        counterparty_process_name: '',
        counterparty_behavior_ref: null,
        counterparty_behavior_name: '',
        requires_return: false,
        returned_data_ref: null,
        resume_behavior_ref: null
      };
      currentDocument().cross_department_handoffs.push(handoff);
      activeHandoffRef = handoff.handoff_ref;
      return handoff;
    }

    function removeRelation(index) {
      const relation = currentDocument().flow_relations[index];
      if (!relation) return false;
      currentDocument().flow_relations.splice(index, 1);
      if (activeRelationRef === relation.relation_ref) {
        activeRelationRef = currentDocument().flow_relations[Math.min(index, currentDocument().flow_relations.length - 1)]?.relation_ref || '';
      }
      return true;
    }

    function removeHandoff(index) {
      const handoff = currentDocument().cross_department_handoffs[index];
      if (!handoff) return false;
      const targetDepartment = text(
        handoff.handoff_direction === 'inbound_prerequisite'
          ? handoff.source_department
          : handoff.target_department
      ).trim() || '待在MDM平台明确责任部门';
      const requestedMatter = text(handoff.requested_matter).trim() || '未填写';
      const confirmed = window.confirm([
        '确定删除这条跨部门承接吗？',
        `承接部门：${targetDepartment}`,
        `处理事项：${requestedMatter}`,
        '',
        '删除后无法在当前页面撤销。这条承接中的输入数据、返回数据、触发条件、完成标准、目标流程或行为和恢复位置都会一并删除；当前业务行为和其他跨部门承接不受影响。'
      ].join('\n'));
      if (!confirmed) return false;
      currentDocument().cross_department_handoffs.splice(index, 1);
      if (activeHandoffRef === handoff.handoff_ref) {
        activeHandoffRef = currentDocument().cross_department_handoffs[Math.min(index, currentDocument().cross_department_handoffs.length - 1)]?.handoff_ref || '';
      }
      return true;
    }

    function removeHandoffByRef(handoffRef) {
      const index = currentDocument().cross_department_handoffs.findIndex(item => item.handoff_ref === handoffRef);
      return removeHandoff(index);
    }

    function addForm() {
      const mainArea = {
        area_ref: newRef('area'),
        area_type: '基本信息',
        area_title: '',
        items: []
      };
      const form = {
        form_ref: newRef('form'),
        behavior_ref: null,
        form_name: '',
        form_no: null,
        areas: [mainArea]
      };
      currentDocument().forms.push(form);
      activeFormRef = form.form_ref;
      activeAreaRef = mainArea.area_ref;
    }

    function addTerm() {
      currentDocument().terms.push({ term_ref: newRef('term'), term_name: '', definition: '' });
    }

    function removeBehavior(index) {
      const behavior = currentDocument().behaviors[index];
      if (!behavior) return false;
      const ref = behavior.behavior_ref;
      const internalCallCount = currentDocument().internal_process_calls.filter(item =>
        item.caller_behavior_ref === ref || item.return_behavior_ref === ref
      ).length;
      if (internalCallCount) {
        window.alert(`当前业务行为被${internalCallCount}条部门内调用预览信息引用。本工作台不编辑部门内调用，请保留该行为。`);
        return false;
      }
      const linkedHandoffCount = currentDocument().cross_department_handoffs.filter(item => item.anchor_behavior_ref === ref).length;
      if (linkedHandoffCount && !window.confirm(`删除当前业务行为将同时删除${linkedHandoffCount}条关联的跨部门输入或承接。确定继续吗？`)) {
        return false;
      }
      currentDocument().behaviors.splice(index, 1);
      if (activeBehaviorRef === ref) {
        activeBehaviorRef = currentDocument().behaviors[Math.min(index, currentDocument().behaviors.length - 1)]?.behavior_ref || '';
      }
      currentDocument().flow_relations = currentDocument().flow_relations.filter(item => item.from_behavior_ref !== ref && item.to_behavior_ref !== ref);
      currentDocument().data_objects.forEach(item => {
        if (item.produced_by_behavior_ref === ref) item.produced_by_behavior_ref = null;
        item.consumed_by_behavior_refs = item.consumed_by_behavior_refs.filter(value => value !== ref);
      });
      currentDocument().cross_department_handoffs = currentDocument().cross_department_handoffs.filter(item => item.anchor_behavior_ref !== ref);
      currentDocument().cross_department_handoffs.forEach(item => {
        if (item.resume_behavior_ref === ref) item.resume_behavior_ref = null;
      });
      currentDocument().forms.forEach(item => {
        if (item.behavior_ref === ref) item.behavior_ref = null;
      });
      return true;
    }

    function removeData(index) {
      const item = currentDocument().data_objects[index];
      if (!item) return false;
      const ref = item.data_ref;
      const internalCallCount = currentDocument().internal_process_calls.filter(call =>
        call.input_data_refs.includes(ref) || call.output_data_refs.includes(ref)
      ).length;
      if (internalCallCount) {
        window.alert(`当前数据被${internalCallCount}条部门内调用预览信息引用。本工作台不编辑部门内调用，请保留该数据。`);
        return false;
      }
      currentDocument().data_objects.splice(index, 1);
      if (activeDataRef === ref) {
        activeDataRef = currentDocument().data_objects[Math.min(index, currentDocument().data_objects.length - 1)]?.data_ref || '';
      }
      currentDocument().behaviors.forEach(behavior => {
        behavior.input_data_refs = behavior.input_data_refs.filter(value => value !== ref);
        behavior.output_data_refs = behavior.output_data_refs.filter(value => value !== ref);
      });
      currentDocument().cross_department_handoffs.forEach(handoff => {
        if (handoff.transfer_data_ref === ref) handoff.transfer_data_ref = null;
        if (handoff.returned_data_ref === ref) handoff.returned_data_ref = null;
      });
      return true;
    }

    function handleAction(action, element) {
      const index = Number(element.dataset.index);
      const formIndex = Number(element.dataset.formIndex);
      const areaIndex = Number(element.dataset.areaIndex);
      if (action === 'new-process-inline') return protect(startNewProcess);
      if (action === 'switch-tab') return setActiveWorkspaceTab(element.dataset.tab);
      if (action === 'view-diagram') return setActiveWorkspaceTab('diagram');
      if (action === 'return-editor') {
        activeEditorSection = 'process';
        return setActiveWorkspaceTab('editor');
      }
      if (action === 'fit-diagram') return diagramView?.fit();
      if (action === 'reset-diagram') return diagramView?.reset();
      if (action === 'toggle-diagram-example') {
        diagramExampleExpanded = !diagramExampleExpanded;
        return render();
      }
      if (action === 'toggle-diagram-expanded') {
        diagramExpanded = !diagramExpanded;
        return render();
      }
      if (action === 'focus-editor') return focusEditorItem(element.dataset.focusKind, element.dataset.focusRef);
      if (action === 'focus-export-warning') return focusExportWarning(element);
      if (action === 'refresh-structure-score') {
        structureScoreRunId += 1;
        structureScoreState = {
          status: 'idle',
          candidateIndex: -1,
          documentKey: '',
          result: null,
          message: ''
        };
        return render();
      }
      if (action === 'edit-linked-handoff') return focusEditorItem('handoff', element.dataset.ref);
      if (!currentDocument()) return;
      if (action === 'switch-editor-section') {
        activeEditorSection = EDITOR_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'basic';
        return render();
      }
      if (action === 'switch-process-section') {
        activeProcessSection = PROCESS_SECTIONS.some(item => item.value === element.dataset.section)
          ? element.dataset.section
          : 'behaviors';
        return render();
      }
      if (action === 'select-behavior') {
        activeBehaviorRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-relation') {
        activeRelationRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-data') {
        activeDataRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-handoff') {
        activeHandoffRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'select-form') {
        activeFormRef = text(element.dataset.ref);
        activeAreaRef = '';
        return render();
      }
      if (action === 'select-area') {
        activeAreaRef = text(element.dataset.ref);
        return render();
      }
      if (action === 'export-current') return exportCurrent();
      if (action === 'move-behavior-up' && !moveBehavior(text(element.dataset.ref), -1)) return;
      if (action === 'move-behavior-down' && !moveBehavior(text(element.dataset.ref), 1)) return;
      if (action === 'move-relation-up' && !moveCollectionItem('flow_relations', 'relation_ref', text(element.dataset.ref), -1)) return;
      if (action === 'move-relation-down' && !moveCollectionItem('flow_relations', 'relation_ref', text(element.dataset.ref), 1)) return;
      if (action === 'move-data-up' && !moveCollectionItem('data_objects', 'data_ref', text(element.dataset.ref), -1)) return;
      if (action === 'move-data-down' && !moveCollectionItem('data_objects', 'data_ref', text(element.dataset.ref), 1)) return;
      if (action === 'move-handoff-up' && !moveCollectionItem('cross_department_handoffs', 'handoff_ref', text(element.dataset.ref), -1)) return;
      if (action === 'move-handoff-down' && !moveCollectionItem('cross_department_handoffs', 'handoff_ref', text(element.dataset.ref), 1)) return;
      if (action === 'add-behavior') addBehavior();
      if (action === 'remove-behavior' && !removeBehavior(index)) return;
      if (action === 'add-relation') addRelation();
      if (action === 'remove-relation' && !removeRelation(index)) return;
      if (action === 'add-data') addDataObject();
      if (action === 'remove-data' && !removeData(index)) return;
      if (action === 'add-inbound-handoff') addHandoff('inbound_prerequisite', text(element.dataset.ref) || null);
      if (action === 'add-outbound-handoff') addHandoff('outbound_followup', text(element.dataset.ref) || null);
      if (action === 'remove-linked-handoff' && !removeHandoffByRef(text(element.dataset.ref))) return;
      if (action === 'remove-handoff' && !removeHandoff(index)) return;
      if (action === 'add-form') addForm();
      if (action === 'remove-form') {
        if (!window.confirm('删除当前表单或记录后，其主表、明细表和全部填写项都会一并删除。确定继续吗？')) return;
        const removed = currentDocument().forms[index];
        currentDocument().forms.splice(index, 1);
        if (removed?.form_ref === activeFormRef) {
          activeFormRef = currentDocument().forms[Math.min(index, currentDocument().forms.length - 1)]?.form_ref || '';
          activeAreaRef = '';
        }
      }
      if (action === 'add-main-area' || action === 'add-detail-area') {
        const form = currentDocument().forms[formIndex];
        if (!form) return;
        if (action === 'add-main-area' && form.areas.some(item => item.area_type === '基本信息')) return;
        const area = {
          area_ref: newRef('area'),
          area_type: action === 'add-main-area' ? '基本信息' : '明细清单',
          area_title: '',
          items: []
        };
        form.areas.push(area);
        activeAreaRef = area.area_ref;
      }
      if (action === 'remove-area') {
        if (!window.confirm('删除当前结构后，其中的全部填写项都会一并删除。确定继续吗？')) return;
        const removed = currentDocument().forms[formIndex]?.areas[index];
        currentDocument().forms[formIndex]?.areas.splice(index, 1);
        if (removed?.area_ref === activeAreaRef) activeAreaRef = '';
      }
      if (action === 'add-form-item') currentDocument().forms[formIndex].areas[areaIndex].items.push({
        item_ref: newRef('item'), item_name: '', item_type: '', required: false, instructions: ''
      });
      if (action === 'remove-form-item') currentDocument().forms[formIndex].areas[areaIndex].items.splice(index, 1);
      if (action === 'add-term') addTerm();
      if (action === 'remove-term') currentDocument().terms.splice(index, 1);

      render();

    function businessWarnings(data) {
      const warnings = [];
      const addWarning = (message, target = {}) => {
        warnings.push({ message, ...target });
      };
      const need = (value, message, target = {}) => {
        if (!text(value).trim()) addWarning(message, target);
      };
      const atField = (target, focusPath) => ({ ...target, focusPath });
      const atFields = (target, focusPaths) => ({ ...target, focusPaths });
      need(data.export_meta.initiating_department, '未填写发起部门', {
        editorSection: 'basic',
        focusPath: 'export_meta.initiating_department'
      });
      need(data.export_meta.compiler, '未填写编制人', {
        editorSection: 'basic',
        focusPath: 'export_meta.compiler'
      });
      need(data.process.process_name, '未填写流程名称', {
        editorSection: 'basic',
        focusPath: 'process.process_name'
      });
      need(data.process.owning_department, '未填写归口部门', {
        editorSection: 'basic',
        focusPath: 'process.owning_department'
      });
      need(data.process.purpose, '未填写流程目的', {
        editorSection: 'profile',
        focusPath: 'process.purpose'
      });
      need(data.process.scope, '未填写适用范围', {
        editorSection: 'profile',
        focusPath: 'process.scope'
      });
      if (!data.behaviors.length) {
        addWarning('尚未添加流程节点', {
          editorSection: 'process',
          processSection: 'behaviors'
        });
      }
      data.behaviors.forEach((item, index) => {
        const label = item.behavior_name || `第${index + 1}项行为`;
        const behaviorTarget = {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: item.behavior_ref
        };
        const actorTarget = atField(behaviorTarget, `behaviors.${index}.current_actor_role`);
        need(item.node_type, `${label}未选择节点类型`, atField(behaviorTarget, `behaviors.${index}.node_type`));
        need(item.behavior_name, `第${index + 1}项行为未填写名称`, atField(behaviorTarget, `behaviors.${index}.behavior_name`));
        need(item.current_actor_role, `${label}未选择执行部门`, actorTarget);
        if (text(item.current_actor_role).trim() && rosterLoadState === 'ready') {
          const parsedActor = parseActorRole(item.current_actor_role);
          const actorDepartmentIsKnown = actorDepartments().includes(parsedActor.department);
          const actorIsValid = item.current_actor_role === '全公司'
            || (
              actorDepartmentIsKnown
              && rosterPositions(parsedActor.department).includes(parsedActor.position)
            );
          if (item.current_actor_role !== '全公司' && actorDepartmentIsKnown && !parsedActor.position) {
            addWarning(`${label}未选择执行岗位`, actorTarget);
          } else if (!actorIsValid) {
            addWarning(`${label}的执行岗位未被所选执行部门的花名册收录`, actorTarget);
          }
        }
        if (!text(item.trigger).trim() && !text(item.precondition).trim()) {
          addWarning(
            `${label}的触发条件和前置条件均为空，请至少填写一项`,
            atFields(behaviorTarget, [`behaviors.${index}.trigger`, `behaviors.${index}.precondition`])
          );
        }
        need(
          item.completion_standard,
          `${label}未填写完成标准`,
          atField(behaviorTarget, `behaviors.${index}.completion_standard`)
        );
        need(
          item.output_description,
          `${label}未填写输出结果`,
          atField(behaviorTarget, `behaviors.${index}.output_description`)
        );
        if (item.countersign_all_required) {
          if (!item.countersign_target_departments.length) {
            addWarning(
              `${label}未选择需要确认知悉的部门`,
              atField(behaviorTarget, `behaviors.${index}.countersign_target_departments`)
            );
          }
        }
        if (item.node_type === 'decision') {
          const localBranches = data.flow_relations.filter(relation =>
            relation.from_behavior_ref === item.behavior_ref
            && ['condition', 'sequence', 'loop'].includes(relation.relation_type)
          );
          const handoffBranches = data.cross_department_handoffs.filter(handoff =>
            handoff.handoff_direction === 'outbound_followup'
            && handoff.anchor_behavior_ref === item.behavior_ref
          );
          const outletCount = localBranches.length + handoffBranches.length;
          if (outletCount < 2) {
            addWarning(`${label}当前只有${outletCount}条明确出口，判断节点至少需要2条`, behaviorTarget);
          }
          const defaultSequenceBranches = localBranches.filter(branch =>
            branch.relation_type === 'sequence'
            && !text(branch.condition).trim()
          );
          defaultSequenceBranches.slice(1).forEach((branch, branchIndex) => {
            const relationIndex = data.flow_relations.indexOf(branch);
            addWarning(
              `${label}的流程关系${relationIndex + 1}形成第${branchIndex + 2}条默认继续路径，判断节点只能保留1条`,
              {
                editorSection: 'process',
                processSection: 'relations',
                focusKind: 'relation',
                focusRef: branch.relation_ref,
                focusPath: `flow_relations.${relationIndex}.relation_type`
              }
            );
          });
        }
        if (item.node_type === 'parallel_split' && !data.flow_relations.some(relation => relation.from_behavior_ref === item.behavior_ref && relation.relation_type === 'parallel')) {
          addWarning(`${label}是并行分支，但没有并行流向`, behaviorTarget);
        }
        if (item.node_type === 'parallel_join' && !data.flow_relations.some(relation => relation.to_behavior_ref === item.behavior_ref && relation.relation_type === 'parallel')) {
          addWarning(`${label}是并行汇合，但没有并行来源`, behaviorTarget);
        }
      });
      if (data.behaviors.length > 1) {
        const relationsTarget = {
          editorSection: 'process',
          processSection: 'relations'
        };
        const localRelations = data.flow_relations.filter(relation =>
          relation.from_behavior_ref
          && relation.to_behavior_ref
          && relation.relation_type !== 'loop'
        );
        if (!localRelations.length) {
          addWarning('多个业务行为之间尚未建立流程关系', relationsTarget);
        } else {
          const incoming = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
          const outgoing = new Map(data.behaviors.map(item => [item.behavior_ref, 0]));
          localRelations.forEach(relation => {
            if (incoming.has(relation.to_behavior_ref)) incoming.set(relation.to_behavior_ref, incoming.get(relation.to_behavior_ref) + 1);
            if (outgoing.has(relation.from_behavior_ref)) outgoing.set(relation.from_behavior_ref, outgoing.get(relation.from_behavior_ref) + 1);
          });
          const starts = [...incoming.values()].filter(count => count === 0).length;
          const ends = [...outgoing.values()].filter(count => count === 0).length;
          if (starts !== 1) addWarning(`当前识别到${starts}个流程入口，应由PMO核对为唯一入口`, relationsTarget);
          if (ends !== 1) addWarning(`当前识别到${ends}个流程出口，应由PMO核对为至少一个明确结束位置`, relationsTarget);
        }
      }
      data.flow_relations.forEach((relation, index) => {
        const relationTarget = {
          editorSection: 'process',
          processSection: 'relations',
          focusKind: 'relation',
          focusRef: relation.relation_ref
        };
        need(
          relation.relation_type,
          `流程关系${index + 1}未选择关系类型`,
          atField(relationTarget, `flow_relations.${index}.relation_type`)
        );
        need(
          relation.from_behavior_ref,
          `流程关系${index + 1}未选择起点行为`,
          atField(relationTarget, `flow_relations.${index}.from_behavior_ref`)
        );
        need(
          relation.to_behavior_ref,
          `流程关系${index + 1}未选择目标行为`,
          atField(relationTarget, `flow_relations.${index}.to_behavior_ref`)
        );
        if (relation.relation_type === 'condition' && !text(relation.condition).trim()) {
          addWarning(
            `流程关系${index + 1}为判断分支，但未填写判断条件`,
            atField(relationTarget, `flow_relations.${index}.condition`)
          );
        }
        if (relation.relation_type === 'loop' && !text(relation.condition).trim()) {
          addWarning(
            `流程关系${index + 1}为流程内部回路，但未填写回路触发条件`,
            atField(relationTarget, `flow_relations.${index}.condition`)
          );
        }
      });
      data.forms.forEach((form, formIndex) => {
        const formLabel = form.form_name || `第${formIndex + 1}项表单记录`;
        const formTarget = {
          editorSection: 'forms',
          focusKind: 'form',
          focusRef: form.form_ref
        };
        need(
          form.form_name,
          `第${formIndex + 1}项表单记录未填写名称`,
          atField(formTarget, `forms.${formIndex}.form_name`)
        );
        const mainCount = form.areas.filter(area => area.area_type === '基本信息').length;
        if (!mainCount) addWarning(`${formLabel}没有主表结构`, formTarget);
        if (mainCount > 1) addWarning(`${formLabel}包含${mainCount}个主表结构`, formTarget);
        let detailIndex = 0;
        form.areas.forEach((area, areaIndex) => {
          const areaTarget = {
            editorSection: 'forms',
            focusKind: 'area',
            focusRef: area.area_ref
          };
          if (area.area_type === '明细清单') detailIndex += 1;
          const structureLabel = area.area_type === '基本信息'
            ? '主表结构'
            : area.area_type === '明细清单'
              ? `明细表结构${detailIndex}`
              : `待确认结构${areaIndex + 1}`;
          need(
            area.area_type,
            `${formLabel}的${structureLabel}未选择结构类型`,
            atField(areaTarget, `forms.${formIndex}.areas.${areaIndex}.area_type`)
          );
          need(
            area.area_title,
            `${formLabel}的${structureLabel}未填写标题`,
            atField(areaTarget, `forms.${formIndex}.areas.${areaIndex}.area_title`)
          );
          if (!area.items.length) addWarning(`${formLabel}的${structureLabel}没有填写项`, areaTarget);
        });
      });
      data.cross_department_handoffs.forEach((item, index) => {
        const handoffTarget = {
          editorSection: 'process',
          processSection: 'handoffs',
          focusKind: 'handoff',
          focusRef: item.handoff_ref
        };
        need(
          ['inbound_prerequisite', 'outbound_followup'].includes(item.handoff_direction),
          `跨部门承接${index + 1}未选择承接方向`,
          atField(handoffTarget, `cross_department_handoffs.${index}.handoff_direction`)
        );
        need(
          item.anchor_behavior_ref,
          `跨部门承接${index + 1}未关联本流程行为`,
          atField(handoffTarget, `cross_department_handoffs.${index}.anchor_behavior_ref`)
        );
        const externalDepartment = item.handoff_direction === 'inbound_prerequisite'
          ? item.source_department
          : item.target_department;
        if (!['identified', 'needs_identification'].includes(item.counterparty_resolution)) {
          addWarning(
            `跨部门承接${index + 1}未选择外部门识别状态`,
            atField(handoffTarget, `cross_department_handoffs.${index}.counterparty_resolution`)
          );
        } else if (item.counterparty_resolution === 'identified' && !text(externalDepartment).trim()) {
          addWarning(
            `跨部门承接${index + 1}已选择“已明确外部门”，但尚未选择具体部门`,
            atField(
              handoffTarget,
              `cross_department_handoffs.${index}.${item.handoff_direction === 'inbound_prerequisite' ? 'source_department' : 'target_department'}`
            )
          );
        }
        if (!item.transfer_data_ref && !text(item.requested_matter).trim()) {
          addWarning(
            `跨部门承接${index + 1}未说明跨部门交界对象`,
            atField(handoffTarget, `cross_department_handoffs.${index}.requested_matter`)
          );
        }
        if (!text(item.trigger_condition).trim() && !text(item.completion_standard).trim()) {
          addWarning(
            `跨部门承接${index + 1}的触发条件和完成标准均为空`,
            atField(handoffTarget, `cross_department_handoffs.${index}.trigger_condition`)
          );
        }
        if (!text(item.counterparty_process_name).trim() || !text(item.counterparty_behavior_name).trim()) {
          addWarning(
            `跨部门承接${index + 1}的外部门流程、行为信息尚未补齐；导入MDM平台后将形成承接待办`,
            handoffTarget
          );
        }
        if (
          item.handoff_direction === 'outbound_followup'
          && item.requires_return
          && (!item.returned_data_ref || !item.resume_behavior_ref)
        ) {
          addWarning(
            `跨部门承接${index + 1}要求返回，但返回信息尚未补齐；导入MDM平台后继续完善`,
            handoffTarget
          );
        }
      });
      return [...new Map(warnings.map(item => [item.message, item])).values()];
    }

    function sanitizeFilenamePart(value, fallback) {
      const cleaned = text(value).trim().replace(/[\\/:*?"<>|\r\n]+/g, '_').replace(/\s+/g, ' ').slice(0, 80);
      return cleaned || fallback;
    }

    function exportTimestamp(date) {
      const pad = value => String(value).padStart(2, '0');
      return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
    }

    function downloadJson(data) {
      const now = new Date();
      const department = sanitizeFilenamePart(data.export_meta.initiating_department, '未明确部门');
      const processName = sanitizeFilenamePart(data.process.process_name, '未命名流程');
      const fileName = `未审核-${department}-${processName}-${exportTimestamp(now)}.json`;
      const blob = new Blob([`${JSON.stringify(data, null, 2)}\n`], { type: 'application/json;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = fileName;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      return fileName;
    }

    async function ensureCompatibleValidationService(retryAction = '再次导出') {
      let schema;
      try {
        const response = await fetch('/api/process-design/editor/schema', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        schema = await readJsonResponse(response, 'MDM校验接口未返回结构化数据。');
      } catch (_error) {
        throw new Error(`MDM结构校验服务暂时不可用。请保持当前页面打开，待服务恢复后${retryAction}。`);
      }

      const actualVersion = text(schema?.properties?.schema_version?.const).trim();
      if (actualVersion !== EXPECTED_EXPORT_SCHEMA_VERSION) {
        throw new Error(
          `MDM编制工作台与服务端版本不一致。当前页面使用“${EXPECTED_EXPORT_SCHEMA_VERSION}”，`
          + `服务端提供“${actualVersion || '未知版本'}”。请保持当前页面打开，待维护人员处理后${retryAction}。`
        );
      }
    }

    function validationErrorLocation(error) {
      const basePath = text(error?.path).trim() || '/';
      const missingProperty = text(error?.params?.missingProperty).trim();
      if (!missingProperty) return basePath;
      return basePath === '/' ? `/${missingProperty}` : `${basePath}/${missingProperty}`;
    }

    function structureScoreTargetForValidationError(error, snapshot) {
      const location = validationErrorLocation(error);
      const segments = location.split('/').filter(Boolean);
      const focusPath = segments.join('.');
      const root = segments[0];
      const index = Number(segments[1]);
      if (root === 'export_meta') return { editorSection: 'basic', focusPath };
      if (root === 'process') {
        return {
          editorSection: ['purpose', 'scope'].includes(segments[1]) ? 'profile' : 'basic',
          focusPath
        };
      }
      if (root === 'behaviors' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'behaviors',
          focusKind: 'behavior',
          focusRef: snapshot.behaviors?.[index]?.behavior_ref || '',
          focusPath
        };
      }
      if (root === 'flow_relations' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'relations',
          focusKind: 'relation',
          focusRef: snapshot.flow_relations?.[index]?.relation_ref || '',
          focusPath
        };
      }
      if (root === 'data_objects' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'data',
          focusKind: 'data',
          focusRef: snapshot.data_objects?.[index]?.data_ref || '',
          focusPath
        };
      }
      if (root === 'cross_department_handoffs' && Number.isInteger(index)) {
        return {
          editorSection: 'process',
          processSection: 'handoffs',
          focusKind: 'handoff',
          focusRef: snapshot.cross_department_handoffs?.[index]?.handoff_ref || '',
          focusPath
        };
      }
      if (root === 'forms' && Number.isInteger(index)) {
        const areaIndex = Number(segments[3]);
        if (segments[2] === 'areas' && Number.isInteger(areaIndex)) {
          return {
            editorSection: 'forms',
            focusKind: 'area',
            focusRef: snapshot.forms?.[index]?.areas?.[areaIndex]?.area_ref || '',
            focusPath
          };
        }
        return {
          editorSection: 'forms',
          focusKind: 'form',
          focusRef: snapshot.forms?.[index]?.form_ref || '',
          focusPath
        };
      }
      if (root === 'terms') return { editorSection: 'terms', focusPath };
      return {};
    }

    function structureScoreValidationErrors(result, snapshot) {
      const errors = Array.isArray(result?.errors) ? result.errors : [];
      return errors.slice(0, 8).map(error => {
        const location = validationErrorLocation(error);
        const detail = text(error?.message).trim() || '结构规则检查未通过';
        return {
          message: `技术结构检查未通过：${location} ${detail}`,
          target: structureScoreTargetForValidationError(error, snapshot)
        };
      });
    }

    async function validateStructureScoreDocument(data) {
      const response = await fetch('/api/process-design/editor/validate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ data })
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return readJsonResponse(response, 'MDM校验接口未返回结构化数据。');
    }

    function commitStructureScoreState(context, nextState) {
      if (context.runId !== structureScoreRunId) return;
      if (context.candidateIndex !== currentIndex) return;
      if (context.documentKey !== currentStructureScoreKey()) return;
      structureScoreState = {
        ...nextState,
        candidateIndex: context.candidateIndex,
        documentKey: context.documentKey
      };
      if (activeWorkspaceTab === 'editor' && activeEditorSection === 'export') render();
    }

    async function runStructureScore(context) {
      const scoring = globalThis.StructureLearningScore;
      if (!scoring) return;
      const checks = {
        parse: false,
        compatibility: false,
        validation: false,
        roundTrip: false,
        preservation: false
      };
      const errors = [];
      let parsed;
      let roundTripDocument;

      try {
        parsed = JSON.parse(JSON.stringify(context.snapshot));
        checks.parse = true;
        const normalized = normalizeV1(parsed);
        checks.compatibility = ['process-governance-v1', EXPECTED_EXPORT_SCHEMA_VERSION].includes(parsed.schema_version)
          && normalized.schema_version === EXPECTED_EXPORT_SCHEMA_VERSION;
        roundTripDocument = normalizeV1(JSON.parse(JSON.stringify(normalized)));
        checks.preservation = scoring.stableStringify(scoring.semanticProjection(parsed))
          === scoring.stableStringify(scoring.semanticProjection(roundTripDocument));
      } catch (_error) {
        errors.push({ message: '当前页面内容无法完成JSON序列化和回读。' });
      }

      if (!checks.compatibility && checks.parse) {
        errors.push({ message: `当前页面内容不是${EXPECTED_EXPORT_SCHEMA_VERSION}。` });
      }
      if (!checks.preservation && roundTripDocument) {
        errors.push({ message: '当前页面内容在导出回读后发生变化，业务字段或技术引用未能完整保持。' });
      }

      try {
        await ensureCompatibleValidationService('重新评分');
        if (parsed) {
          const currentValidation = await validateStructureScoreDocument(parsed);
          checks.validation = Boolean(currentValidation?.valid);
          if (!checks.validation) {
            errors.push(...structureScoreValidationErrors(currentValidation, parsed));
          }
        }
        if (roundTripDocument) {
          const roundTripValidation = await validateStructureScoreDocument(roundTripDocument);
          checks.roundTrip = Boolean(roundTripValidation?.valid);
          if (!checks.roundTrip) {
            errors.push(...structureScoreValidationErrors(roundTripValidation, roundTripDocument));
          }
        }
      } catch (error) {
        const message = text(error?.message).trim()
          || 'MDM校验服务暂时不可用。请保持当前页面打开，待服务恢复后重新评分。';
        commitStructureScoreState(context, {
          status: 'unavailable',
          result: scoring.finalize(context.contentResult, {
            status: 'unavailable',
            checks,
            message
          }),
          message
        });
        return;
      }

      const deduplicatedErrors = [...new Map(errors.map(item => [item.message, item])).values()];
      commitStructureScoreState(context, {
        status: 'ready',
        result: scoring.finalize(context.contentResult, {
          status: 'ready',
          checks,
          errors: deduplicatedErrors
        }),
        message: ''
      });
    }

    async function exportCurrent() {
      const entry = currentEntry();
      if (!entry) return false;
      syncRoles(entry.data);
      entry.data.export_meta.exported_at = new Date().toISOString();
      setBusy(true, '正在检查当前文件中的技术引用……');
      try {
        await ensureCompatibleValidationService();
        const response = await fetch('/api/process-design/editor/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ data: entry.data })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '校验服务不可用');
        if (!result.valid) {
          const errors = Array.isArray(result.errors) ? result.errors : [];
          const referenceErrorsOnly = errors.length > 0 && errors.every(error => error.keyword === 'localReference');
          if (referenceErrorsOnly) {
            const details = errors.slice(0, 5).map(error => `${validationErrorLocation(error)}：${error.message}`).join('；');
            showStatus(`当前流程文件中的技术引用已断开或重复，暂不能导出。${details}`, 'error');
          } else {
            const locations = [...new Set(errors.slice(0, 5).map(validationErrorLocation))].join('、');
            const locationText = locations ? `涉及位置：${locations}。` : '';
            showStatus(
              `当前流程文件不符合MDM单流程治理JSON格式，暂不能导出。${locationText}请保持当前页面内容，并联系维护人员处理。`,
              'error'
            );
          }
          return false;
        }
        const warnings = businessWarnings(entry.data);
        if (warnings.length) {
          const preview = warnings.slice(0, 8).map((item, index) => `${index + 1}. ${item.message}`).join('\n');
          const more = warnings.length > 8 ? `\n另有 ${warnings.length - 8} 项。` : '';
          if (!window.confirm(`当前是未审核草稿，PMO审核前仍需补齐：\n\n${preview}${more}\n\n仍然导出当前草稿吗？`)) {
            showStatus('已取消导出，当前页面内容仍保留。');
            return false;
          }
        }
        const fileName = downloadJson(entry.data);
        showStatus(`已导出备份 ${fileName}。导出不会保存MDM草稿；有修改时仍需点击“保存草稿”。`, 'success');
        updateCandidateBar();
        return true;
      } catch (error) {
        showStatus(`导出失败：${error.message}`, 'error');
        return false;
      } finally {
        setBusy(false);
      }
    }

    function protect(action) {
      if (!hasDirtyCandidates()) {
        action();
        return;
      }
      if (!currentEntry()?.dirty) {
        currentIndex = candidates.findIndex(item => item.dirty);
        render();
      }
      protectedAction = action;
      unsavedModal.classList.add('show');
      unsavedModal.setAttribute('aria-hidden', 'false');
    }

    function closeProtectedModal() {
      unsavedModal.classList.remove('show');
      unsavedModal.setAttribute('aria-hidden', 'true');
    }

    async function sha256File(file) {
      if (!crypto.subtle) return null;
      const bytes = await file.arrayBuffer();
      const hash = await crypto.subtle.digest('SHA-256', bytes);
      return Array.from(new Uint8Array(hash)).map(value => value.toString(16).padStart(2, '0')).join('');
    }

    async function importJson(file) {
      setBusy(true, `正在读取 ${file.name}……`);
      try {
        const parsed = JSON.parse(await file.text());
        if (parsed.schema_version === 'process-governance-v1' || parsed.schema_version === 'process-governance-v2') {
          const migrated = parsed.schema_version === 'process-governance-v1';
          candidates = [{ data: normalizeV1(parsed), dirty: migrated, origin: migrated ? 'v1' : 'v2' }];
        } else if (parsed.schema_version === 'document-structured-output-v2') {
          const fileSha256 = await sha256File(file);
          candidates = splitLegacyDocument(parsed, { fileName: file.name, fileSha256 })
            .map(data => ({ data: normalizeV1(data), dirty: true, origin: 'legacy' }));
        } else {
          throw new Error(`不支持的结构化文件版本：${parsed.schema_version || '未提供'}`);
        }
        currentIndex = 0;
        openedPreviewProcesses.clear();
        selectInitialTabAfterImport();
        render();
        showStatus(
          candidates.length > 1
            ? `历史文件包含 ${candidates.length} 条流程，已拆成候选。每条流程必须单独导出。`
            : '结构化文件已导入当前页面。',
          'success'
        );
      } catch (error) {
        showStatus(`结构化文件导入失败：${error.message}`, 'error');
      } finally {
        setBusy(false);
        jsonInput.value = '';
      }
    }

    document.getElementById('newProcessButton').addEventListener('click', () => protect(startNewProcess));
    document.getElementById('importJsonButton').addEventListener('click', () => protect(() => jsonInput.click()));
    document.getElementById('exportButton').addEventListener('click', exportCurrent);
    document.getElementById('clearButton').addEventListener('click', () => protect(clearPage));

    jsonInput.addEventListener('change', () => {
      const file = jsonInput.files?.[0];
      if (file) importJson(file);
    });

    candidateSelect.addEventListener('change', event => {
      currentIndex = Number(event.target.value) || 0;
      selectInitialTabAfterImport();
      render();
    });

    workspace.addEventListener('input', event => {
      const target = event.target.closest('[data-bind]');
      if (!target || !currentDocument()) return;
      const kind = target.dataset.kind;
      const value = kind === 'boolean' ? target.checked : kind === 'nullable' ? nullable(target.value) : target.value;
      setByPath(target.dataset.bind, value);
      touch();
      const behaviorMatch = target.dataset.bind.match(/^behaviors\.(\d+)\.behavior_name$/);
      if (behaviorMatch) {
        const behaviorIndex = Number(behaviorMatch[1]);
        refreshRoleName(behaviorIndex);
        const behavior = currentDocument().behaviors[behaviorIndex];
        const selector = behavior
          ? workspace.querySelector(`[data-action="select-behavior"][data-ref="${CSS.escape(behavior.behavior_ref)}"]`)
          : null;
        if (selector) selector.textContent = `${behaviorIndex + 1}. ${behavior.behavior_name || '未命名业务行为'}`;
      }
      const formMatch = target.dataset.bind.match(/^forms\.(\d+)\.form_name$/);
      if (formMatch) {
        const formIndex = Number(formMatch[1]);
        const form = currentDocument().forms[formIndex];
        const selector = form
          ? workspace.querySelector(`[data-action="select-form"][data-ref="${CSS.escape(form.form_ref)}"]`)
          : null;
        if (selector) selector.textContent = `${formIndex + 1}. ${form.form_name || '未命名表单或记录'}`;
      }
      const relationMatch = target.dataset.bind.match(/^flow_relations\.(\d+)\./);
      if (relationMatch) {
        const relationIndex = Number(relationMatch[1]);
        const relation = currentDocument().flow_relations[relationIndex];
        if (relation) {
          updateOrderedSelectorLabel('relation', relation.relation_ref, relationSelectorLabel(relation, relationIndex));
        }
      }
      const dataMatch = target.dataset.bind.match(/^data_objects\.(\d+)\./);
      if (dataMatch) {
        const dataIndex = Number(dataMatch[1]);
        const dataObject = currentDocument().data_objects[dataIndex];
        if (dataObject) {
          updateOrderedSelectorLabel('data', dataObject.data_ref, dataSelectorLabel(dataObject, dataIndex));
        }
      }
      const handoffMatch = target.dataset.bind.match(/^cross_department_handoffs\.(\d+)\./);
      if (handoffMatch) {
        const handoffIndex = Number(handoffMatch[1]);
        const handoff = currentDocument().cross_department_handoffs[handoffIndex];
        if (handoff) {
          updateOrderedSelectorLabel('handoff', handoff.handoff_ref, handoffSelectorLabel(handoff, handoffIndex));
        }
      }
      if (target.dataset.bind === 'process.process_name') updateCandidateBar();
      refreshPreviewAvailability();
    });

    workspace.addEventListener('change', event => {
      const target = event.target;
      if (target.matches('[data-actor-department]')) {
        const index = Number(target.dataset.actorDepartment);
        const behavior = currentDocument()?.behaviors?.[index];
        if (!behavior) return;
        behavior.current_actor_role = combineActorRole(target.value, '');
        touch();
        render();
        return;
      }
      if (target.matches('[data-actor-position]')) {
        const index = Number(target.dataset.actorPosition);
        const behavior = currentDocument()?.behaviors?.[index];
        const department = workspace.querySelector(`[data-actor-department="${index}"]`)?.value || '';
        if (!behavior) return;
        behavior.current_actor_role = combineActorRole(department, target.value);
        touch();
        render();
        return;
      }
      if (target.matches('[data-list-bind]')) {
        const pathKey = target.dataset.listBind;
        const values = Array.from(workspace.querySelectorAll(`input[data-list-bind="${pathKey}"]:checked`)).map(input => input.value);
        setByPath(pathKey, values);
        touch();
        refreshPreviewAvailability();
        return;
      }
      if (target.matches('[data-bind]') && (
        target.dataset.bind === 'process.owning_department'
        || /^cross_department_handoffs\.\d+\.(handoff_direction|counterparty_resolution|anchor_behavior_ref|requires_return)$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.area_type$/.test(target.dataset.bind)
        || /^forms\.\d+\.areas\.\d+\.items\.\d+\.item_type$/.test(target.dataset.bind)
      )) {
        render();
      }
    });

    workspace.addEventListener('click', event => {
      const button = event.target.closest('[data-action]');
      if (!button) return;
      handleAction(button.dataset.action, button);
    });

    document.getElementById('cancelProtectedButton').addEventListener('click', () => {
      protectedAction = null;
      closeProtectedModal();
    });

    document.getElementById('discardProtectedButton').addEventListener('click', () => {
      const action = protectedAction;
      protectedAction = null;
      closeProtectedModal();
      if (action) action();
    });

    document.getElementById('exportProtectedButton').addEventListener('click', async () => {
      const saved = await saveCurrentDraft();
      if (!saved) return;
      const nextDirtyIndex = candidates.findIndex(item => item.dirty);
      if (nextDirtyIndex >= 0) {
        currentIndex = nextDirtyIndex;
        render();
        showStatus('还有其他候选流程包含未保存修改，请继续保存或选择放弃。');
        return;
      }
      const action = protectedAction;
      protectedAction = null;
      closeProtectedModal();
      if (action) action();
    });

    window.addEventListener('keydown', event => {
      if (event.key !== 'Escape' || !diagramExpanded) return;
      diagramExpanded = false;
      render();
    });

    window.addEventListener('beforeunload', event => {
      if (!hasDirtyCandidates()) return;
      event.preventDefault();
      event.returnValue = '';
    });

    render();
    loadEditorCatalogs();
    ensureCompatibleValidationService('再次操作').catch(error => showStatus(error.message, 'error'));
  </script>
</body>
</html>
