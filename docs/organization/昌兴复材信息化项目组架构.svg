<svg viewBox="0 0 960 700" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="960" height="700" fill="url(#bg-grad)" rx="16"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="960" height="52" rx="16" fill="url(#header-grad)"/>
  <rect x="0" y="36" width="960" height="16" fill="url(#header-grad)"/>
  <text x="480" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">昌兴复材 · 信息化项目组架构</text>

  <!-- ══════════════════════════════════════════
       第一层：决策组
  ══════════════════════════════════════════ -->
  <rect x="330" y="68" width="300" height="52" rx="10" fill="#1e3a5f" filter="url(#shadow)"/>
  <!-- 左侧色条 -->
  <rect x="330" y="68" width="6" height="52" rx="3" fill="#60a5fa"/>
  <text x="492" y="89" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">🏛  项目决策组</text>
  <text x="492" y="108" text-anchor="middle" font-size="10" fill="#93c5fd">总经理 · 经营副总 · 生产副总</text>

  <!-- 决策→PMO 连线 -->
  <line x1="480" y1="120" x2="480" y2="144" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="480,148 476,140 484,140" fill="#94a3b8"/>

  <!-- ══════════════════════════════════════════
       第二层：PMO + 左右侧组
  ══════════════════════════════════════════ -->
  <!-- PMO -->
  <rect x="340" y="150" width="280" height="52" rx="10" fill="#1d4ed8" filter="url(#shadow)"/>
  <rect x="340" y="150" width="6" height="52" rx="3" fill="#93c5fd"/>
  <text x="482" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">📋  信息化项目管理办公室（PMO）</text>
  <text x="482" y="190" text-anchor="middle" font-size="10" fill="#bfdbfe">经营发展部牵头 · 信息化负责人 · 各供应商PM</text>

  <!-- PMO 左连线 → 技术架构组 -->
  <line x1="340" y1="176" x2="240" y2="176" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="236,176 244,172 244,180" fill="#94a3b8"/>
  <!-- PMO 右连线 → 变更控制组 -->
  <line x1="620" y1="176" x2="720" y2="176" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="724,176 716,172 716,180" fill="#94a3b8"/>

  <!-- 技术架构组 -->
  <rect x="60" y="150" width="176" height="52" rx="10" fill="#0f766e" filter="url(#shadow)"/>
  <rect x="60" y="150" width="6" height="52" rx="3" fill="#6ee7b7"/>
  <text x="150" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">⚙  技术架构组</text>
  <text x="150" y="190" text-anchor="middle" font-size="10" fill="#99f6e4">信息化负责人牵头 · 各供应商技术人员</text>
  
  <!-- 变更控制组 -->
  <rect x="724" y="150" width="176" height="52" rx="10" fill="#6d28d9" filter="url(#shadow)"/>
  <rect x="724" y="150" width="6" height="52" rx="3" fill="#c4b5fd"/>
  <text x="814" y="171" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">🔒  变更控制组</text>
  <text x="814" y="190" text-anchor="middle" font-size="10" fill="#ddd6fe">工程技术部 · 质量管理部</text>

  <!-- ══════════════════════════════════════════
       PMO → 五组 连线主干
  ══════════════════════════════════════════ -->
  <line x1="480" y1="202" x2="480" y2="228" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 横主干 -->
  <line x1="96" y1="228" x2="864" y2="228" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 五条竖线 -->
  <line x1="96"  y1="228" x2="96"  y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="288" y1="228" x2="288" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="480" y1="228" x2="480" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="672" y1="228" x2="672" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="864" y1="228" x2="864" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 五个箭头 -->
  <polygon points="96,256 92,248 100,248"  fill="#94a3b8"/>
  <polygon points="288,256 284,248 292,248" fill="#94a3b8"/>
  <polygon points="480,256 476,248 484,248" fill="#94a3b8"/>
  <polygon points="672,256 668,248 676,248" fill="#94a3b8"/>
  <polygon points="864,256 860,248 868,248" fill="#94a3b8"/>

  <!-- ══════════════════════════════════════════
       第三层：五个工作组卡片
       每卡宽160，间距24，起点x=16
       x: 16, 200, 384, 568, 752
  ══════════════════════════════════════════ -->

  <!-- ① PLM工作组 -->
  <rect x="16"  y="256" width="160" height="130" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="16"  y="256" width="160" height="32"  rx="10" fill="#1d4ed8"/>
  <rect x="16"  y="276" width="160" height="12"  fill="#1d4ed8"/>
  <text x="96"  y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PLM 工作组</text>
  <!-- 组长标签 -->
  <rect x="26" y="296" width="52" height="16" rx="4" fill="#dbeafe"/>
  <text x="52" y="308" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">组长</text>
  <text x="110" y="308" font-size="9.5" fill="#374151">工程技术部</text>
  <!-- 成员 -->
  <line x1="26" y1="318" x2="156" y2="318" stroke="#e5e7eb" stroke-width="1"/>
  <text x="96" y="332" text-anchor="middle" font-size="9" fill="#6b7280">质量管理部 · 物资保障部</text>
  <text x="96" y="374" text-anchor="middle" font-size="9" fill="#9ca3af">PLM供应商</text>

  <!-- ② MES工作组 -->
  <rect x="200" y="256" width="160" height="130" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="200" y="256" width="160" height="32"  rx="10" fill="#0f766e"/>
  <rect x="200" y="276" width="160" height="12"  fill="#0f766e"/>
  <text x="280" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">MES 工作组</text>
  <rect x="210" y="296" width="52" height="16" rx="4" fill="#d1fae5"/>
  <text x="236" y="308" text-anchor="middle" font-size="9" fill="#065f46" font-weight="bold">组长</text>
  <text x="294" y="308" font-size="9.5" fill="#374151">项目管理部</text>
  <line x1="210" y1="318" x2="340" y2="318" stroke="#e5e7eb" stroke-width="1"/>
  <text x="280" y="330" text-anchor="middle" font-size="9" fill="#6b7280">工程技术部 · 质量管理部</text>
  <text x="280" y="343" text-anchor="middle" font-size="9" fill="#6b7280">运维安环部 · 复材车间</text>
  <text x="280" y="379" text-anchor="middle" font-size="9" fill="#9ca3af">MES供应商</text>

  <!-- ③ MDM·集成工作组 -->
  <rect x="384" y="256" width="192" height="130" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="384" y="256" width="192" height="32"  rx="10" fill="#b45309"/>
  <rect x="384" y="276" width="192" height="12"  fill="#b45309"/>
  <text x="480" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">MDM · 集成工作组</text>
  <rect x="394" y="296" width="52" height="16" rx="4" fill="#fef3c7"/>
  <text x="420" y="308" text-anchor="middle" font-size="9" fill="#92400e" font-weight="bold">组长</text>
  <text x="498" y="308" font-size="9.5" fill="#374151">信息化负责人</text>
  <line x1="394" y1="318" x2="566" y2="318" stroke="#e5e7eb" stroke-width="1"/>
  <text x="480" y="331" text-anchor="middle" font-size="9" fill="#6b7280">所有部门正副职</text>
  <text x="480" y="344" text-anchor="middle" font-size="9" fill="#6b7280">各部门一名业务支持人员</text>
  <text x="480" y="368" text-anchor="middle" font-size="9" fill="#9ca3af">四家供应商接口负责人</text>
  <text x="480" y="381" text-anchor="middle" font-size="9" fill="#d97706" font-weight="bold">★ 横向协调，所有接口经此审核</text>

  <!-- ④ ERP·OA工作组 -->
  <rect x="600" y="256" width="160" height="130" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="600" y="256" width="160" height="32"  rx="10" fill="#b91c1c"/>
  <rect x="600" y="276" width="160" height="12"  fill="#b91c1c"/>
  <text x="680" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ERP · OA 工作组</text>
  <rect x="610" y="296" width="52" height="16" rx="4" fill="#fee2e2"/>
  <text x="636" y="308" text-anchor="middle" font-size="9" fill="#991b1b" font-weight="bold">组长</text>
  <text x="694" y="308" font-size="9.5" fill="#374151">财务部</text>
  <line x1="610" y1="318" x2="740" y2="318" stroke="#e5e7eb" stroke-width="1"/>
  <text x="680" y="332" text-anchor="middle" font-size="9" fill="#6b7280">行政人事部 · 物资保障部</text>
  <text x="680" y="374" text-anchor="middle" font-size="9" fill="#9ca3af">ERP / OA供应商</text>

  <!-- ⑤ 数据质量工作组 -->
  <rect x="784" y="256" width="160" height="130" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="784" y="256" width="160" height="32"  rx="10" fill="#6d28d9"/>
  <rect x="784" y="276" width="160" height="12"  fill="#6d28d9"/>
  <text x="864" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">数据质量工作组</text>
  <rect x="794" y="296" width="52" height="16" rx="4" fill="#ede9fe"/>
  <text x="820" y="308" text-anchor="middle" font-size="9" fill="#4c1d95" font-weight="bold">组长</text>
  <text x="878" y="308" font-size="9.5" fill="#374151">工程技术部</text>
  <line x1="794" y1="318" x2="924" y2="318" stroke="#e5e7eb" stroke-width="1"/>
  <text x="864" y="331" text-anchor="middle" font-size="9" fill="#6b7280">所有部门正副职</text>
  <text x="864" y="344" text-anchor="middle" font-size="9" fill="#6b7280">各部门2名数据录入人员</text>
  <line x1="794" y1="354" x2="924" y2="354" stroke="#e5e7eb" stroke-width="1"/>
  <text x="864" y="368" text-anchor="middle" font-size="9" fill="#9ca3af">财务部（成本口径）</text>
  <text x="864" y="381" text-anchor="middle" font-size="9" fill="#7c3aed" font-weight="bold">★ M2前完成，阶段性任务</text>

  <!-- ══════════════════════════════════════════
       说明区：三列 + 底部时间轴
  ══════════════════════════════════════════ -->
  <rect x="16" y="406" width="928" height="96" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="480" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">关键设计说明</text>

  <!-- 左列 -->
  <text x="36" y="442" font-size="10" fill="#1d4ed8">●</text>
  <text x="50" y="442" font-size="10" fill="#374151">PMO由经营发展部牵头，确保项目计划落地</text>
  <text x="36" y="458" font-size="10" fill="#1d4ed8">●</text>
  <text x="50" y="458" font-size="10" fill="#374151">决策组介入时机：结构性冲突 / 预算追加 / 重大变更</text>
  <text x="36" y="474" font-size="10" fill="#1d4ed8">●</text>
  <text x="50" y="474" font-size="10" fill="#374151">变更控制组独立于PMO，防止需求蔓延失控</text>
  <text x="36" y="490" font-size="10" fill="#1d4ed8">●</text>
  <text x="50" y="490" font-size="10" fill="#374151">两个复材车间分别出代表，需求不合并处理</text>

  <!-- 分隔线 -->
  <line x1="340" y1="430" x2="340" y2="496" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="650" y1="430" x2="650" y2="496" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 中列 -->
  <text x="356" y="442" font-size="10" fill="#0f766e">●</text>
  <text x="370" y="442" font-size="10" fill="#374151">MDM·集成组是横向组，所有接口须经此审核</text>
  <text x="356" y="458" font-size="10" fill="#0f766e">●</text>
  <text x="370" y="458" font-size="10" fill="#374151">数据质量组在8月15日前完成历史数据清洗</text>
  <text x="356" y="474" font-size="10" fill="#0f766e">●</text>
  <text x="370" y="474" font-size="10" fill="#374151">各工作组组长须为副职及以上</text>
  <text x="356" y="490" font-size="10" fill="#0f766e">●</text>
  <text x="370" y="490" font-size="10" fill="#374151">供应商PM常驻期间，每周向PMO同步进度</text>

  <!-- 右列 -->
  <text x="666" y="442" font-size="10" fill="#b45309">●</text>
  <text x="680" y="442" font-size="10" fill="#374151">需求冻结（M1）后，工作组转入开发测试模式</text>
  <text x="666" y="458" font-size="10" fill="#b45309">●</text>
  <text x="680" y="458" font-size="10" fill="#374151">新增需求一律进二期池，不进当期开发范围</text>
  <text x="666" y="474" font-size="10" fill="#b45309">●</text>
  <text x="680" y="474" font-size="10" fill="#374151">保密办需在关键节点参与合规审核（涉密信息）</text>
  <text x="666" y="490" font-size="10" fill="#b45309">●</text>
  <text x="680" y="490" font-size="10" fill="#374151">UAT阶段各部门须派员全程参与</text>

  <!-- ══════════════════════════════════════════
       底部时间轴
  ══════════════════════════════════════════ -->
  <rect x="16" y="518" width="928" height="164" rx="10" fill="#1e3a5f" filter="url(#shadow)"/>
  <text x="480" y="540" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff" letter-spacing="1">⚠  项目组搭建关键时间节点</text>

  <!-- 时间轴横线 -->
  <line x1="80" y1="590" x2="880" y2="590" stroke="#475569" stroke-width="2"/>

  <!-- 节点1：5月22日 -->
  <circle cx="140" cy="590" r="8" fill="#60a5fa"/>
  <circle cx="140" cy="590" r="4" fill="#ffffff"/>
  <rect x="90" y="558" width="100" height="26" rx="5" fill="#1d4ed8"/>
  <text x="140" y="575" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">5月22日</text>
  <text x="140" y="610" text-anchor="middle" font-size="9.5" fill="#93c5fd">各组长名单确认</text>
  <text x="140" y="624" text-anchor="middle" font-size="9" fill="#35b1c2ff">决策层指定人员（副职及以上）</text>

  <!-- 节点2：5月底 -->
  <circle cx="340" cy="590" r="8" fill="#34d399"/>
  <circle cx="340" cy="590" r="4" fill="#ffffff"/>
  <rect x="290" y="558" width="100" height="26" rx="5" fill="#065f46"/>
  <text x="340" y="575" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">5月底</text>
  <text x="340" y="610" text-anchor="middle" font-size="9.5" fill="#6ee7b7">工作组全员到位</text>
  <text x="340" y="624" text-anchor="middle" font-size="9" fill="#35b1c2ff">各供应商二次会议</text>

  <!-- 节点3：6月13日 -->
  <circle cx="560" cy="590" r="10" fill="#f59e0b"/>
  <circle cx="560" cy="590" r="5" fill="#ffffff"/>
  <rect x="495" y="555" width="130" height="28" rx="5" fill="#b45309"/>
  <text x="560" y="573" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">6月13日  🔴 关键</text>
  <text x="560" y="610" text-anchor="middle" font-size="9.5" fill="#fcd34d">编码锁定（M1冻结）</text>
  <text x="560" y="624" text-anchor="middle" font-size="9" fill="#35b1c2ff">物料编码·接口字段定义完成</text>

  <!-- 节点4：需求冻结后 -->
  <circle cx="780" cy="590" r="8" fill="#a78bfa"/>
  <circle cx="780" cy="590" r="4" fill="#ffffff"/>
  <rect x="720" y="558" width="120" height="26" rx="5" fill="#4c1d95"/>
  <text x="780" y="575" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff">需求冻结后</text>
  <text x="780" y="610" text-anchor="middle" font-size="9.5" fill="#c4b5fd">工作组转测试模式</text>
  <text x="780" y="624" text-anchor="middle" font-size="9" fill="#35b1c2ff">新需求进二期池</text>

  <!-- 时间轴箭头 -->
  <polygon points="886,590 878,586 878,594" fill="#475569"/>

  <!-- 底部版权 -->
  <text x="480" y="658" text-anchor="middle" font-size="9" fill="#ffffffff">昌兴复材信息化项目组架构 · 2026年5月</text>
</svg>