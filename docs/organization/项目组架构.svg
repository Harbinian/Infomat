<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000018"/>
    </filter>
    <filter id="shadow-light" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#00000010"/>
    </filter>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#f8f9fa"/>
    </linearGradient>
    <linearGradient id="header-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8e"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="900" fill="url(#bg-grad)" rx="16"/>

  <!-- 顶部标题栏 -->
  <rect x="0" y="0" width="1200" height="52" rx="16" fill="url(#header-grad)"/>
  <rect x="0" y="36" width="1200" height="16" fill="url(#header-grad)"/>
  <text x="600" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff" letter-spacing="2">昌兴复材 · 信息化项目组架构</text>

  <!-- ══════════════════════════════════════════
       第一层：项目决策组
  ══════════════════════════════════════════ -->
  <rect x="400" y="68" width="400" height="52" rx="10" fill="#1e3a5f" filter="url(#shadow)"/>
  <rect x="400" y="68" width="6" height="52" rx="3" fill="#60a5fa"/>
  <text x="602" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">项目决策组</text>
  <text x="602" y="108" text-anchor="middle" font-size="10" fill="#93c5fd">组长：马成文　　执行副组长：李洪哲　　副组长：刘春含</text>

  <!-- 决策组 → 办公室 连线 -->
  <line x1="600" y1="120" x2="600" y2="138" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="600,142 596,134 604,134" fill="#94a3b8"/>

  <!-- ══════════════════════════════════════════
       第二层：信息化项目管理工作室
  ══════════════════════════════════════════ -->
  <rect x="60" y="148" width="1080" height="155" rx="10" fill="#ffffff" filter="url(#shadow)"/>

  <!-- 办公室标题栏 -->
  <rect x="60" y="148" width="1080" height="32" rx="10" fill="#1d4ed8"/>
  <rect x="60" y="168" width="1080" height="12" fill="#1d4ed8"/>
  <text x="600" y="169" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">信息化项目管理工作室</text>

  <!-- 左侧色条 -->
  <rect x="60" y="148" width="5" height="155" rx="3" fill="#93c5fd"/>

  <!-- 主任行 -->
  <rect x="482" y="186" width="44" height="16" rx="4" fill="#dbeafe"/>
  <text x="504" y="198" text-anchor="middle" font-size="9" fill="#1d4ed8" font-weight="bold">主任</text>
  <text x="535" y="198" font-size="10" fill="#1e3a5f" font-weight="bold">刘春含</text>

  <!-- 分隔线 -->
  <line x1="100" y1="210" x2="1100" y2="210" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 小组定位 -->
  <text x="600" y="226" text-anchor="middle" font-size="9" fill="#6b7280">统筹项目运行，按"说明会方案"的关键节点推进项目进度、审核各工作组成果、控制项目边界</text>

  <!-- ═════ 三个负责人区域 ═════ -->

  <!-- ① 技术架构 -->
  <rect x="100" y="236" width="340" height="56" rx="8" fill="#f0fdf4" filter="url(#shadow-light)"/>
  <rect x="100" y="236" width="340" height="20" rx="8" fill="#ccfbf1"/>
  <rect x="100" y="244" width="340" height="12" fill="#ccfbf1"/>
  <text x="270" y="251" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f766e">技术架构</text>
  <text x="120" y="272" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#065f46">负责人</tspan>　张广懿</text>
  <text x="120" y="286" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#065f46">专员</tspan>　　佟浩</text>

  <!-- ② 变更控制 -->
  <rect x="460" y="236" width="340" height="56" rx="8" fill="#faf5ff" filter="url(#shadow-light)"/>
  <rect x="460" y="236" width="340" height="20" rx="8" fill="#ede9fe"/>
  <rect x="460" y="244" width="340" height="12" fill="#ede9fe"/>
  <text x="630" y="251" text-anchor="middle" font-size="10" font-weight="bold" fill="#6d28d9">变更控制</text>
  <text x="480" y="272" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">负责人</tspan>　曲明盛、池炳辉</text>
  <text x="480" y="286" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#4c1d95">专员</tspan>　　张永翔、胡睿</text>

  <!-- ③ 基础设施 -->
  <rect x="820" y="236" width="300" height="56" rx="8" fill="#fffbeb" filter="url(#shadow-light)"/>
  <rect x="820" y="236" width="300" height="20" rx="8" fill="#fef3c7"/>
  <rect x="820" y="244" width="300" height="12" fill="#fef3c7"/>
  <text x="970" y="251" text-anchor="middle" font-size="10" font-weight="bold" fill="#b45309">基础设施</text>
  <text x="840" y="272" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#92400e">负责人</tspan>　刘洪雨</text>
  <text x="840" y="286" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#92400e">专员</tspan>　　方嵩荐</text>

  <!-- ══════════════════════════════════════════
       办公室 → 五个工作组 连线树
  ══════════════════════════════════════════ -->
  <!-- 竖线 ↓ -->
  <line x1="600" y1="303" x2="600" y2="328" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 横线 -->
  <line x1="142" y1="328" x2="1062" y2="328" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 五条竖线 -->
  <line x1="142" y1="328" x2="142" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="372" y1="328" x2="372" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="602" y1="328" x2="602" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="832" y1="328" x2="832" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="1062" y1="328" x2="1062" y2="345" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- 五个箭头 -->
  <polygon points="142,349 138,341 146,341" fill="#94a3b8"/>
  <polygon points="372,349 368,341 376,341" fill="#94a3b8"/>
  <polygon points="602,349 598,341 606,341" fill="#94a3b8"/>
  <polygon points="832,349 828,341 836,341" fill="#94a3b8"/>
  <polygon points="1062,349 1058,341 1066,341" fill="#94a3b8"/>

  <!-- ══════════════════════════════════════════
       第三层：五个工作组卡片
       每卡宽214，间距16，起点x=35
       x: 35, 265, 495, 725, 955
  ══════════════════════════════════════════ -->

  <!-- ① MDM 工作组 -->
  <rect x="35" y="350" width="214" height="210" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="35" y="350" width="214" height="30" rx="10" fill="#b45309"/>
  <rect x="35" y="368" width="214" height="12" fill="#b45309"/>
  <rect x="35" y="350" width="5" height="210" rx="3" fill="#fcd34d"/>
  <text x="142" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">MDM 工作组</text>

  <rect x="46" y="386" width="28" height="14" rx="4" fill="#fef3c7"/>
  <text x="60" y="396" text-anchor="middle" font-size="8" fill="#92400e" font-weight="bold">组长</text>
  <text x="82" y="396" font-size="9" fill="#374151">张广懿</text>

  <text x="46" y="413" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#92400e">数据冲突处理人</tspan>　各工作组长</text>
  <text x="46" y="428" font-size="9" fill="#374151"><tspan font-weight="bold" fill="#92400e">审核员</tspan>　各部门长授权一名人员</text>

  <line x1="46" y1="440" x2="230" y2="440" stroke="#f3f4f6" stroke-width="1"/>

  <text x="46" y="456" font-size="8.5" fill="#6b7280"><tspan font-weight="bold" fill="#b45309">定位</tspan>　管理主数据。汇总元数据、</text>
  <text x="46" y="470" font-size="8.5" fill="#6b7280">制定数据标准与质量模板、</text>
  <text x="46" y="484" font-size="8.5" fill="#6b7280">发布质量报告与数据纠正通知。</text>

  <!-- ② PLM 工作组 -->
  <rect x="265" y="350" width="214" height="210" rx="10" fill="#ffffff" filter="url(#shadow)"/>
