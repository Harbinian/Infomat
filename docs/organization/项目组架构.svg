  <rect x="265" y="368" width="214" height="12" fill="#1d4ed8"/>
  <rect x="265" y="350" width="5" height="210" rx="3" fill="#93c5fd"/>
  <text x="372" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PLM 工作组</text>

  <rect x="276" y="386" width="28" height="14" rx="4" fill="#dbeafe"/>
  <text x="290" y="396" text-anchor="middle" font-size="8" fill="#1d4ed8" font-weight="bold">组长</text>
  <text x="312" y="396" font-size="9" fill="#374151">池炳辉</text>

  <text x="276" y="413" font-size="9" fill="#1e3a5f" font-weight="bold">业务对接员</text>
  <text x="276" y="430" font-size="9" fill="#374151">常云龙</text>
  <text x="340" y="430" font-size="8" fill="#6b7280">PDM、工程研发项目管理</text>
  <text x="276" y="445" font-size="9" fill="#374151">安建国</text>
  <text x="340" y="445" font-size="8" fill="#6b7280">适航追溯</text>
  <text x="276" y="460" font-size="9" fill="#374151">黄吉</text>
  <text x="340" y="460" font-size="8" fill="#6b7280">全域数据一致性</text>

  <line x1="276" y1="474" x2="460" y2="474" stroke="#f3f4f6" stroke-width="1"/>

  <text x="276" y="490" font-size="8" fill="#6b7280"><tspan font-weight="bold" fill="#1d4ed8">定位</tspan>　治理业务流程关系与数据链，</text>
  <text x="276" y="504" font-size="8" fill="#6b7280">持续完善主映射关系与业务行为标准。</text>

  <!-- ③ MES 工作组 -->
  <rect x="495" y="350" width="214" height="210" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="495" y="350" width="214" height="30" rx="10" fill="#0f766e"/>
  <rect x="495" y="368" width="214" height="12" fill="#0f766e"/>
  <rect x="495" y="350" width="5" height="210" rx="3" fill="#6ee7b7"/>
  <text x="602" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">MES 工作组</text>

  <rect x="506" y="386" width="28" height="14" rx="4" fill="#d1fae5"/>
  <text x="520" y="396" text-anchor="middle" font-size="8" fill="#065f46" font-weight="bold">组长</text>
  <text x="542" y="396" font-size="9" fill="#374151">范秋南</text>

  <rect x="506" y="403" width="36" height="14" rx="4" fill="#d1fae5"/>
  <text x="524" y="413" text-anchor="middle" font-size="8" fill="#065f46" font-weight="bold">副组长</text>
  <text x="550" y="413" font-size="9" fill="#374151">纪鹏飞（无纸化）</text>

  <text x="506" y="432" font-size="9" fill="#0f766e" font-weight="bold">业务对接员</text>
  <text x="506" y="447" font-size="8.5" fill="#374151">郎春生、安建国<tspan fill="#6b7280">（QMS）</tspan>、肖明哲</text>
  <text x="506" y="462" font-size="8.5" fill="#374151">万旭、刘楠楠、黄吉<tspan fill="#6b7280">（物料）</tspan></text>
  <text x="506" y="477" font-size="8.5" fill="#374151">胡婷婷<tspan fill="#6b7280">（工装）</tspan>、薛一博<tspan fill="#6b7280">（安全·设备）</tspan></text>
  <text x="506" y="492" font-size="8.5" fill="#374151">孙利<tspan fill="#6b7280">（数字化测量、普钳）</tspan></text>

  <line x1="506" y1="504" x2="690" y2="504" stroke="#f3f4f6" stroke-width="1"/>

  <text x="506" y="518" font-size="8" fill="#6b7280"><tspan font-weight="bold" fill="#0f766e">定位</tspan>　治理业务流程关系与数据链，</text>
  <text x="506" y="532" font-size="8" fill="#6b7280">持续完善主映射关系与业务行为标准。</text>

  <!-- ④ ERP·OA 工作组 -->
  <rect x="725" y="350" width="214" height="210" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="725" y="350" width="214" height="30" rx="10" fill="#b91c1c"/>
  <rect x="725" y="368" width="214" height="12" fill="#b91c1c"/>
  <rect x="725" y="350" width="5" height="210" rx="3" fill="#fca5a5"/>
  <text x="832" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ERP · OA 工作组</text>

  <rect x="736" y="386" width="28" height="14" rx="4" fill="#fee2e2"/>
  <text x="750" y="396" text-anchor="middle" font-size="8" fill="#991b1b" font-weight="bold">组长</text>
  <text x="772" y="396" font-size="9" fill="#374151">李雪</text>

  <rect x="736" y="403" width="36" height="14" rx="4" fill="#fee2e2"/>
  <text x="754" y="413" text-anchor="middle" font-size="8" fill="#991b1b" font-weight="bold">副组长</text>
  <text x="780" y="413" font-size="9" fill="#374151">陈娟（OA）</text>

  <text x="736" y="432" font-size="9" fill="#991b1b" font-weight="bold">业务对接员</text>
  <text x="736" y="449" font-size="8.5" fill="#374151">刘佳、万恒洋、肖明哲</text>
  <text x="736" y="464" font-size="8.5" fill="#374151">董含琪、张琇雅</text>

  <line x1="736" y1="478" x2="920" y2="478" stroke="#f3f4f6" stroke-width="1"/>

  <text x="736" y="494" font-size="8" fill="#6b7280"><tspan font-weight="bold" fill="#b91c1c">定位</tspan>　治理业务流程关系与数据链，</text>
  <text x="736" y="508" font-size="8" fill="#6b7280">持续完善主映射关系与业务行为标准。</text>

  <!-- ⑤ 数据质量工作组 -->
  <rect x="955" y="350" width="214" height="210" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="955" y="350" width="214" height="30" rx="10" fill="#6d28d9"/>
  <rect x="955" y="368" width="214" height="12" fill="#6d28d9"/>
  <rect x="955" y="350" width="5" height="210" rx="3" fill="#c4b5fd"/>
  <text x="1062" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">数据质量工作组</text>

  <rect x="966" y="386" width="28" height="14" rx="4" fill="#ede9fe"/>
  <text x="980" y="396" text-anchor="middle" font-size="8" fill="#4c1d95" font-weight="bold">组长</text>
  <text x="1002" y="396" font-size="9" fill="#374151">池炳辉</text>

  <rect x="966" y="403" width="36" height="14" rx="4" fill="#ede9fe"/>
  <text x="984" y="413" text-anchor="middle" font-size="8" fill="#4c1d95" font-weight="bold">副组长</text>
  <text x="1010" y="413" font-size="9" fill="#374151">胡睿、范秋南、张永翔</text>

  <text x="966" y="432" font-size="9" fill="#6d28d9" font-weight="bold">数据质量员</text>
  <text x="966" y="448" font-size="8.5" fill="#374151">赵襄璇、李铄康、佟浩</text>
  <text x="966" y="463" font-size="8.5" fill="#374151">胡婷婷、李新潮、张席铭</text>

  <line x1="966" y1="476" x2="1150" y2="476" stroke="#f3f4f6" stroke-width="1"/>

  <text x="966" y="492" font-size="8" fill="#6b7280"><tspan font-weight="bold" fill="#6d28d9">定位</tspan>　根据MDM工作组发布的</text>
  <text x="966" y="506" font-size="8" fill="#6b7280">数据标准与质量模板审核各系统</text>
  <text x="966" y="520" font-size="8" fill="#6b7280">数据合规性并出具审计报告。</text>

  <!-- ══════════════════════════════════════════
       底部说明区
  ══════════════════════════════════════════ -->
  <rect x="35" y="578" width="1130" height="108" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="600" y="598" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a5f">架构设计要点</text>

  <!-- 三列说明 -->
  <!-- 左列 -->
  <text x="55" y="618" font-size="9" fill="#1d4ed8">●</text>
  <text x="68" y="618" font-size="9" fill="#374151">决策组在结构性冲突、预算追加、重大延误、重大内容变更时介入并决策</text>
  <text x="55" y="635" font-size="9" fill="#1d4ed8">●</text>
  <text x="68" y="635" font-size="9" fill="#374151">信息化项目管理工作室按"说明会方案"关键节点推进、审核成果、控制边界</text>
  <text x="55" y="652" font-size="9" fill="#1d4ed8">●</text>
  <text x="68" y="652" font-size="9" fill="#374151">技术架构负责人主导技术路线与数据架构决策</text>
  <text x="55" y="669" font-size="9" fill="#1d4ed8">●</text>
  <text x="68" y="669" font-size="9" fill="#374151">变更控制负责人独立于各工作组，防止需求蔓延失控</text>

  <!-- 分隔线 -->
  <line x1="405" y1="604" x2="405" y2="674" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="795" y1="604" x2="795" y2="674" stroke="#e5e7eb" stroke-width="1"/>

  <!-- 中列 -->
  <text x="420" y="618" font-size="9" fill="#b45309">●</text>
  <text x="433" y="618" font-size="9" fill="#374151">MDM 工作组负责主数据标准制定，是数据治理的源头</text>
  <text x="420" y="635" font-size="9" fill="#b45309">●</text>
  <text x="433" y="635" font-size="9" fill="#374151">数据冲突处理由各工作组长协同，审核员由各部门长授权</text>
  <text x="420" y="652" font-size="9" fill="#b45309">●</text>
  <text x="433" y="652" font-size="9" fill="#374151">池炳辉同时担任 PLM 组长、数据质量组长、变更控制负责人</text>
  <text x="420" y="669" font-size="9" fill="#b45309">●</text>
  <text x="433" y="669" font-size="9" fill="#374151">数据质量组根据 MDM 标准对各系统数据合规性独立审计</text>

  <!-- 右列 -->
  <text x="810" y="618" font-size="9" fill="#0f766e">●</text>
  <text x="823" y="618" font-size="9" fill="#374151">PLM / MES / ERP·OA 三组职责一致：治理业务流程关系</text>
  <text x="810" y="635" font-size="9" fill="#0f766e">●</text>
  <text x="823" y="635" font-size="9" fill="#374151">各组持续完善"部门能力-业务流程-业务行为-应用系统"主映射</text>
  <text x="810" y="652" font-size="9" fill="#0f766e">●</text>
  <text x="823" y="652" font-size="9" fill="#374151">持续完善业务行为的触发机制、判断依据、验收标准</text>
  <text x="810" y="669" font-size="9" fill="#0f766e">●</text>
  <text x="823" y="669" font-size="9" fill="#374151">MES 组覆盖范围最广：生产、质量、工装、安全、设备、测量</text>

